  .ie-stat .n { font-size:20px; font-weight:700; }
  .ie-stat .l { font-size:11.5px; color:var(--text-muted); }
  .ie-item { border:1px solid var(--border-subtle); border-radius:12px; background:var(--surface-primary); box-shadow:var(--shadow-card); padding:14px 15px; display:flex; flex-direction:column; gap:11px; }
  .ie-num { width:26px; height:26px; border-radius:50%; background:var(--accent-soft); color:var(--accent-text); display:grid; place-items:center; font-size:13px; font-weight:600; flex:none; }
  .ie-opt { display:flex; align-items:center; gap:9px; flex:1 1 110px; padding:10px 13px; border:1.5px solid var(--border-input); border-radius:var(--radius-md); background:var(--surface-primary); cursor:pointer; font:inherit; min-height:44px; color:var(--text-primary); }
  .ie-opt[aria-pressed="true"]{ border-color:var(--action-primary); background:var(--accent-soft); }
  .ie-ind { width:18px; height:18px; border-radius:50%; border:2px solid var(--border-strong); flex:none; display:grid; place-items:center; }
  .ie-opt[aria-pressed="true"] .ie-ind{ border-color:var(--action-primary); background:var(--action-primary); }
  .ie-radios { display:flex; gap:8px; flex-wrap:wrap; }
  .ie-k { font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
  .up-btn { display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border:1.5px dashed var(--border-strong); border-radius:var(--radius-md); background:var(--surface-sunken); font:inherit; font-size:13px; cursor:pointer; color:var(--text-secondary); }
  .ie-langbtn { padding:7px 13px; border-radius:999px; border:1px solid var(--border-subtle); background:var(--surface-sunken); font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-secondary); }
  .switch { display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:12.5px; white-space:nowrap; }
  .switch > span { white-space:nowrap; }
  .switch input { appearance:none; -webkit-appearance:none; box-sizing:border-box; width:34px; min-width:34px; height:20px; margin:0; border:0; border-radius:999px; background:var(--border-strong); position:relative; cursor:pointer; transition:background .15s; flex:none; }

        h("strong",{style:{fontSize:"13px"}}, (ar?"عينة (1)":"Sample (1)")),
        h("button",{className:"up-btn"}, h("svg",{viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:1.7,style:{width:15,height:15}},h("path",{d:"M12 16V4M8 8l4-4 4 4M4 20h16"})), t.samplePhoto),
        h("span",{className:"t-caption"},t.samplePhotoHelp),
        extractRow,
        h("button",{className:"up-btn",style:{borderStyle:"solid",borderColor:"var(--action-primary)",color:"var(--action-primary)"}}, "+ "+t.addSample)):null);
    const seizureBody=h(React.Fragment,null,
      h("h4",{style:{margin:0,fontSize:"14.5px"}},t.seizureTitle),
      gate(st.seizureGate,"seizureGate",t.seizureGate),
      st.seizureGate==="yes"?h("div",{style:{border:"1px dashed var(--border-strong)",borderRadius:"8px",padding:"11px 12px",display:"flex",flexDirection:"column",gap:"8px",marginTop:"2px"}},
        h("strong",{style:{fontSize:"13px"}}, t.productN.replace("{n}","1")),
        extractRow,
        h("button",{className:"up-btn",style:{borderStyle:"solid",borderColor:"var(--action-primary)",color:"var(--action-primary)"}}, "+ "+t["addالسeized"])):null,
      h("div",{className:"t-caption",style:{marginTop:"2px"}}, t.seizureLink+" · "+t.attMax));

    // Grouped submit blockers (computeBlockers)
    const un=ITEMS.filter(it=>st.ans[it.id].applied && !st.ans[it.id].value);
    const evb=ITEMS.filter(evMiss);
    const fmb=ITEMS.filter(afMiss);
    const anyBlock=un.length||evb.length||fmb.length;
    const bLine=(label,arr)=> arr.length?h("div",{style:{fontSize:"12.5px"}}, h("span",{className:"ie-k"},label+": "), arr.map((it,i)=>((i?"، ":"")+it.title)).join("")):null;
    const blockersBody=h(React.Fragment,null,
      h("div",{style:{display:"flex",alignItems:"center",gap:"8px"}}, h("h4",{style:{margin:0,fontSize:"14.5px"}},t.blockersTitle), anyBlock?chip("badge-critical",String(un.length+evb.length+fmb.length)):chip("badge-compliant","✓")),
      anyBlock?h("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}}, bLine(t.bUnanswered,un), bLine(t.bEvidence,evb), bLine(t.bForms,fmb)) : h("div",{className:"t-caption",style:{color:"var(--status-compliant-text)"}}, t.noBlockers));

    return {
      theme:st.theme, isLight:st.theme==="light", isDark:st.theme==="dark",
      toggleTheme:()=>this.setState(s=>({theme:s.theme==="dark"?"light":"dark"})),
      lang:st.lang, dir:ar?"rtl":"ltr", toggleLang:()=>this.setState(s=>({lang:s.lang==="ar"?"en":"ar"})), t,
      strip, items, samplesBody, seizureBody, blockersBody,
      blockerBorder: anyBlock?"color-mix(in srgb,var(--status-critical) 30%,transparent)":"var(--border-subtle)",
      submitBadge: anyBlock?t.submitBlocked:t.submitReady, submitBadgeClass: anyBlock?"badge-critical":"badge-completed",
      submitDisabled: anyBlock?"true":"false", submitStyle: anyBlock?"opacity:.5; pointer-events:none;":"",
    };
  }
}
</script>
