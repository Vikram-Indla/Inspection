      { company: "Unlicensed metal workshop — Al-Sulai district", license: "No license", city: "Riyadh", status: "Immediate closure", badge: "badge-critical", risk: "High", riskExc: "exc-critical" },
      { company: "Unlicensed packaging facility", license: "No license", city: "Dammam", status: "Final warning", badge: "badge-warning", risk: "Medium", riskExc: "exc-warning" },
      { company: "Unlicensed plastics factory", license: "No license", city: "Jeddah", status: "Referred to committee", badge: "badge-neutral", risk: "High", riskExc: "exc-critical" },
    ];
    return {
      theme: this.state.theme, isLight: this.state.theme === "light", isDark: this.state.theme === "dark",
      toggleTheme: () => this.setState(s => ({ theme: s.theme === "dark" ? "light" : "dark" })),
      lang, dir: lang === "ar" ? "rtl" : "ltr", toggleLang: () => this.setState(s => ({ lang: s.lang === "ar" ? "en" : "ar" })), t,
      syncNow: () => {},
      pickFile: () => { const el = document.getElementById("sw-filepick"); if (el) el.click(); },
      licTab: this.state.tab === 0, unlicTab: this.state.tab === 1,
      pickLic: () => this.setState({ tab: 0 }), pickUnlic: () => this.setState({ tab: 1 }),
      rows: (this.state.tab === 0 && this.state.noResults ? [] : (this.state.tab === 0 ? LIC : UNLIC)).map(r => ({ ...r, initial: r.company.trim().charAt(0) })),
      showEmptyHint: this.state.tab === 0 && this.state.noResults,
      onSearch: e => { const q = e.target.value.trim().toLowerCase(); this.setState({ noResults: q.length > 0 && !LIC.some(r => r.company.toLowerCase().includes(q)) }); },
      filterOpen: this.state.filter, openFilter: () => this.setState({ filter: true }), closeFilter: () => this.setState({ filter: false }),
      createOpen: this.state.create, openCreate: () => this.setState({ create: true }), closeCreate: () => this.setState({ create: false }),
    };
  }
}
