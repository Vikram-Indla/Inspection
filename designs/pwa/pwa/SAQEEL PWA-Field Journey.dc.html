<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="saqeel/styles.css">
<style>
  html, body { height:100%; margin:0; }
  .jr-wrap { max-width:900px; width:100%; margin:0 auto; padding:16px 18px 130px; display:flex; flex-direction:column; gap:14px; }
  .card { border:1px solid var(--border-subtle); border-radius:12px; background:var(--surface-primary); box-shadow:var(--shadow-card); padding:15px 16px; display:flex; flex-direction:column; gap:12px; }
  .jr-seg { display:inline-flex; border:1px solid var(--border-input); border-radius:var(--radius-md); overflow:hidden; flex-wrap:wrap; }
  .jr-seg button { border:0; background:var(--surface-primary); font:inherit; font-size:12px; padding:8px 12px; cursor:pointer; color:var(--text-secondary); border-inline-end:1px solid var(--border-input); }
  .jr-seg button[aria-pressed="true"]{ background:var(--action-primary); color:var(--text-on-action); }
  .jr-langbtn { padding:7px 13px; border-radius:999px; border:1px solid var(--border-subtle); background:var(--surface-sunken); font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-secondary); }
  .jr-metrics { display:flex; gap:8px; flex-wrap:wrap; }
  .jr-metric { flex:1 1 90px; border:1px solid var(--border-subtle); border-radius:10px; background:var(--surface-sunken); padding:10px 12px; }
  .jr-metric .n { font-size:19px; font-weight:700; } .jr-metric .l { font-size:11px; color:var(--text-muted); }
  .jr-fence { position:relative; height:190px; border:1px solid var(--border-subtle); border-radius:12px; background:var(--surface-sunken); overflow:hidden; display:grid; place-items:center; }
  .jr-ring { position:absolute; border-radius:50%; border:2px dashed var(--action-primary); opacity:.6; }
  .jr-pin { position:absolute; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; transform:translate(-50%,-50%); }
  .jr-dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--surface-primary); box-shadow:var(--shadow-card); }
  .jr-opt { display:flex; align-items:center; gap:9px; padding:11px 13px; border:1.5px solid var(--border-input); border-radius:var(--radius-md); background:var(--surface-primary); cursor:pointer; font:inherit; min-height:46px; color:var(--text-primary); text-align:start; width:100%; }
  .jr-opt[aria-pressed="true"]{ border-color:var(--action-primary); background:var(--accent-soft); }
  .jr-ind { width:18px; height:18px; border-radius:50%; border:2px solid var(--border-strong); flex:none; display:grid; place-items:center; }
  .jr-opt[aria-pressed="true"] .jr-ind{ border-color:var(--action-primary); background:var(--action-primary); }
  .up-btn { display:inline-flex; align-items:center; gap:8px; padding:11px 15px; border:1.5px dashed var(--border-strong); border-radius:var(--radius-md); background:var(--surface-sunken); font:inherit; font-size:13px; cursor:pointer; color:var(--text-secondary); align-self:flex-start; }
  .jr-h { margin:0; font-size:15px; font-weight:600; }
  .jr-k { font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
</style>
<script src="./pwa-tabbar.js"></script>
</helmet>
<div style="min-height:100dvh; display:flex; flex-direction:column; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font-body);" data-theme="{{ theme }}" dir="{{ dir }}" lang="{{ lang }}">

  <header style="position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:12px 18px; padding-block-start:max(12px,env(safe-area-inset-top)); background:var(--surface-primary); border-block-end:1px solid var(--border-subtle);">

    <span class="badge {{ opBadgeClass }}"><span class="dot"></span>{{ opState }}</span>
    <button class="jr-langbtn" onClick="{{ toggleLang }}">{{ t.langBtnLabel }}</button>
    <button class="btn btn-icon btn-ghost" onClick="{{ toggleTheme }}" aria-label="{{ t.theme }}">
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:20px;height:20px;"><circle cx="12" cy="12" r="4.4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg></sc-if>

    </button>
  </header>

  <div class="jr-wrap">
    <div class="card" style="gap:9px;">
      <span class="jr-k">{{ t.demoLabel }}</span>
      <div class="jr-seg">
        <sc-for list="{{ situations }}" as="s" hint-placeholder-count="4"><button aria-pressed="{{ s.active }}" onClick="{{ s.go }}">{{ s.label }}</button></sc-for>
      </div>

    </div>

    <sc-if value="{{ recovered }}" hint-placeholder-val="{{ false }}">

        <span class="t-compact" style="color:var(--status-info-text);">{{ t.recoveredNote }}</span>
      </div>
    </sc-if>

    {{ panel }}
  </div>

  <div style="position:sticky; bottom:0; display:flex; align-items:center; gap:10px; padding:12px 18px; padding-block-end:max(12px,env(safe-area-inset-bottom)); background:var(--surface-primary); border-block-start:1px solid var(--border-subtle);">
    <span class="badge {{ footBadgeClass }}"><span class="dot"></span>{{ footStatus }}</span>
    <span style="flex:1;"></span>
    <button class="btn btn-secondary" onClick="{{ openUnable }}">{{ t.unableBtn }}</button>
    <button class="btn btn-primary" aria-disabled="{{ startDisabled }}" style="{{ startStyle }}">{{ t.startExec }}</button>
  </div>
</div>
</x-dc>

      if(st.unable!=="none") return banner(st.unable==="approved"?t.unableApproved:st.unable==="rejected"?t.unableRejected:t.unablePending, st.unable==="approved"?"compliant":st.unable==="rejected"?"info":"warning");
      const needComment=st.cancelReason==="other";
      return h("div",{className:"card"}, h("h3",{className:"jr-h"},t.unableH), banner(t.unableBody,"info"),
        h("div",null, h("div",{className:"jr-k",style:{marginBottom:"6px"}},t.unableReasonL),
          h("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}}, t.reasons.map(([k,l])=>{const on=st.cancelReason===k;return h("button",{key:k,className:"jr-opt","aria-pressed":on,onClick:()=>sett({cancelReason:k})},h("span",{className:"jr-ind"},on?ck:null),l);}))),
        field(t.unableComment,"",{area:true,rows:2}),
        needComment?h("div",{className:"t-caption",style:{color:"var(--status-warning-text)"}},t.unableCommentReq):null,
        upload(t.unableEvidence),
        h("div",{style:{display:"flex",gap:"8px",flexWrap:"wrap"}},
          h("button",{className:"btn btn-primary","aria-disabled": (st.cancelReason&&!(needComment))?"false":"true", style:(st.cancelReason)?{}:{opacity:.5,pointerEvents:"none"}, onClick:()=>sett({unable:"pending"})},t.unableSubmit),
          st.unable==="none"?h("button",{className:"btn btn-secondary",onClick:()=>sett({sit:"traveling",cancelReason:""})},t.unableCancel):null),
        h("div",{style:{display:"flex",gap:"8px"}}, h("button",{className:"btn btn-secondary",onClick:()=>sett({unable:"approved"})},ar?"محاكاة الاعتماد":"Simulate approve"), h("button",{className:"btn btn-secondary",onClick:()=>sett({unable:"rejected"})},ar?"محاكاة الرفض":"Simulate reject")));
    }

    // op state + start gating
    const opMap = sit==="traveling"?[t.opWay,"badge-onhold"]: (inside||outside)?[t.opArrived,"badge-completed"]:[t.opNew,"badge-draft"];
    let startBlock=null;
    if(outside && st.override!=="approved") startBlock=t.startBlockOutside;
    else if((inside||outside) && !st.arrEvidence && sit!=="unable") startBlock=t.startBlockArr;
    if(st.unable==="pending") startBlock=t.startBlockUnable;
    const blocked=!!startBlock || sit==="traveling" || sit==="unable";

    const SITS=[["traveling",t.sit_travel],["inside",t.sit_inside],["outside",t.sit_outside],["unable",t.sit_unable]];
    return {
      theme:st.theme, isLight:st.theme==="light", isDark:st.theme==="dark",
      toggleTheme:()=>this.setState(s=>({theme:s.theme==="dark"?"light":"dark"})),
      lang:st.lang, dir:ar?"rtl":"ltr", toggleLang:()=>this.setState(s=>({lang:s.lang==="ar"?"en":"ar"})), t,
      situations: SITS.map(([k,l])=>({label:l, active: sit===k?"true":"false", go:()=>sett({sit:k, override:"none", unable:"none", arrEvidence:false, ovReason:"", cancelReason:""})})),
      online:st.online, toggleOnline:()=>this.setState(s=>({online:!s.online})),
      recovered: sit==="outside" && !st.online,
      panel,
      opState: opMap[0], opBadgeClass: opMap[1],
      openUnable:()=>sett({sit:"unable"}),
      footStatus: startBlock ? startBlock : (sit==="traveling"?t.footTravel: t.footArrived),
      footBadgeClass: startBlock?"badge-critical": sit==="traveling"?"badge-onhold":"badge-completed",
      startDisabled: blocked?"true":"false", startStyle: blocked?"opacity:.5; pointer-events:none;":"",
    };
  }
}
</script>
