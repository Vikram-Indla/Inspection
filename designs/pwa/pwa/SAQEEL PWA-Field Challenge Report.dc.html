<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="saqeel/styles.css">
<style>
  html, body { height:100%; margin:0; }
  .ch-wrap { max-width:820px; width:100%; margin:0 auto; padding:16px 18px 120px; display:flex; flex-direction:column; gap:14px; }
  .card { border:1px solid var(--border-subtle); border-radius:12px; background:var(--surface-primary); box-shadow:var(--shadow-card); padding:16px 17px; display:flex; flex-direction:column; gap:13px; }
  .fld { display:flex; flex-direction:column; gap:5px; }
  .fld > span { font-size:13px; color:var(--text-secondary); }
  .ret { font-size:11px; color:var(--text-muted); border:1px solid var(--border-subtle); border-radius:999px; padding:1px 8px; }
  .rowlabel { display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .fld-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px){ .fld-row { grid-template-columns:1fr; } }
  .ch-langbtn { padding:7px 13px; border-radius:999px; border:1px solid var(--border-subtle); background:var(--surface-sunken); font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-secondary); }
  .ch-tbl { width:100%; border-collapse:collapse; font-size:12.5px; }
  .ch-tbl th, .ch-tbl td { border:1px solid var(--border-subtle); padding:8px 10px; text-align:start; }
  .ch-tbl th { background:var(--surface-sunken); font-weight:600; color:var(--text-secondary); }
  .ch-tbl td input { width:100%; border:0; background:none; font:inherit; color:var(--text-primary); }
  .it-del { border:0; background:none; cursor:pointer; color:var(--status-critical-text); padding:4px; }
  .up-btn { display:inline-flex; align-items:center; gap:8px; padding:11px 15px; border:1.5px dashed var(--border-strong); border-radius:var(--radius-md); background:var(--surface-sunken); font:inherit; font-size:13px; cursor:pointer; color:var(--text-secondary); align-self:flex-start; }
</style>
<script src="./pwa-tabbar.js"></script>
</helmet>
<div style="min-height:100dvh; display:flex; flex-direction:column; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font-body);" data-theme="{{ theme }}" dir="{{ dir }}" lang="{{ lang }}">

  <header style="position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:12px 18px; padding-block-start:max(12px,env(safe-area-inset-top)); background:var(--surface-primary); border-block-end:1px solid var(--border-subtle);">
    <button class="btn btn-icon btn-ghost" aria-label="{{ t.back }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:20px;height:20px;"><path d="m9 6 6 6-6 6"/></svg></button>
    <div style="flex:1; min-width:0; line-height:1.35;"><div style="font-weight:600; font-size:15px;">{{ t.headerTitle }}</div><div class="t-caption" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ t.headerSub }} · <span class="id-code">VS-40219</span></div></div>
    <span class="badge badge-info">{{ t.overlayTag }}</span>
    <button class="ch-langbtn" onClick="{{ toggleLang }}">{{ t.langBtnLabel }}</button>
    <button class="btn btn-icon btn-ghost" onClick="{{ toggleTheme }}" aria-label="{{ t.theme }}">
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:20px;height:20px;"><circle cx="12" cy="12" r="4.4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg></sc-if>
      <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:20px;height:20px;"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
    </button>
  </header>

  <div class="ch-wrap">
    <div class="card" style="flex-direction:row; gap:10px; align-items:flex-start; background:var(--status-info-soft); border-color:color-mix(in srgb,var(--status-info) 26%,transparent); box-shadow:none; padding:12px 14px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--status-info-text)" stroke-width="1.7" style="width:18px;height:18px;flex:none;margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
      <span class="t-compact" style="color:var(--status-info-text);">{{ t.overlayNote }}</span>
    </div>

    <div class="card">
      <h3 style="margin:0; font-size:15px; font-weight:600;">{{ t.contextH }}</h3>
      <div class="fld-row">
        <label class="fld"><span class="rowlabel"><span>{{ t.inspDate }}</span><span class="ret">{{ t.retrieved }}</span></span><input class="input" type="date" value="2026-07-23" disabled style="color:var(--text-muted);"></label>
        <label class="fld"><span class="rowlabel"><span>{{ t.inspector }}</span><span class="ret">{{ t.retrieved }}</span></span><input class="input" value="{{ t.inspectorVal }}" disabled style="color:var(--text-muted);"></label>
      </div>
      <label class="fld"><span class="rowlabel"><span>{{ t.visitType }}</span><span class="ret">{{ t.retrieved }}</span></span><input class="input" value="{{ t.visitTypeVal }}" disabled style="color:var(--text-muted);"></label>
    </div>

    <div class="card">
      <h3 style="margin:0; font-size:15px; font-weight:600;">{{ t.profileH }}</h3>
      <p class="t-caption" style="margin:0;">{{ t.profileNote }}</p>
      <sc-for list="{{ profile }}" as="p" hint-placeholder-count="5">
        <label class="fld"><span class="rowlabel"><span>{{ p.q }}</span><span class="ret">{{ t.retrieved }}</span></span><input class="input" value="{{ p.a }}" disabled style="color:var(--text-muted);"></label>
      </sc-for>
    </div>

    <div class="card">
      <h3 style="margin:0; font-size:15px; font-weight:600;">{{ t.challengesH }}</h3>
      <div style="overflow-x:auto;">
        <table class="ch-tbl">
          <thead><tr><th style="width:180px;">{{ t.chStatus }}</th><th>{{ t.chDesc }}</th><th style="width:40px;"></th></tr></thead>
          <tbody>
            <sc-for list="{{ challenges }}" as="c" hint-placeholder-count="2">
              <tr><td><input value="{{ c.status }}"></td><td><input value="{{ c.desc }}"></td><td><button class="it-del" aria-label="{{ t.delete }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:15px;height:15px;"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></td></tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <button class="up-btn" style="border-style:solid; border-color:var(--action-primary); color:var(--action-primary);">+ {{ t.addChallenge }}</button>
      <label class="fld"><span>{{ t.notes }}</span><textarea class="input" rows="3" placeholder="{{ t.notesPh }}"></textarea></label>
      <label class="fld"><span>{{ t.attachments }}</span><button class="up-btn" onClick="{{ pickFile }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:15px;height:15px;"><path d="M12 16V4M8 8l4-4 4 4M4 20h16"/></svg>{{ t.attachBtn }}</button></label>
    </div>
  </div>

  <input id="ch-filepick" type="file" accept="image/*,application/pdf" style="display:none">

  <div style="position:sticky; bottom:0; display:flex; align-items:center; gap:12px; padding:12px 18px; padding-block-end:max(12px,env(safe-area-inset-bottom)); background:var(--surface-primary); border-block-start:1px solid var(--border-subtle);">
    <span class="badge badge-completed"><span class="dot"></span>{{ t.ready }}</span>
    <span style="flex:1;"></span>
    <button class="btn btn-secondary">{{ t.saveDraft }}</button>
    <button class="btn btn-primary">{{ t.submit }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { theme:"dark", lang:"ar" };
  renderVals(){
    const ar=this.state.lang==="ar";
    const pickFile=()=>{ const el=document.getElementById("ch-filepick"); if(el)el.click(); };
    const t = ar ? {
      back:"رجوع", headerTitle:"تقرير رصد التحدي", headerSub:"شركة الأمل لتدريب العمال", overlayTag:"إضافي",
      theme:"الوضع", langBtnLabel:"EN", ready:"جاهز للإرسال", saveDraft:"حفظ كمسودة", submit:"إرسال",
      overlayNote:"«رصد التحدي» خيار إضافي يُضاف إلى أي تقرير رئيسي — يعرض بنود التقرير الرئيسي بالإضافة إلى بنود رصد التحدي، وهذا القسم الخاص به.",
      contextH:"سياق التفتيش", retrieved:"مُسترجع", inspDate:"تاريخ التفتيش", inspector:"اسم المفتش", inspectorVal:"عبدالله بن صالح الشهري", visitType:"نوع الزيارة", visitTypeVal:"زيارة رقابية",
      profileH:"ملف الشركة (مُسترجع)", profileNote:"تُقرأ هذه المؤشرات من النظام لتأطير التحدي.",
      challengesH:"التحديات المرصودة", chStatus:"حالة التحدي", chDesc:"وصف التحدي", delete:"حذف", addChallenge:"إضافة تحدٍّ",
      notes:"ملاحظات", notesPh:"ملاحظات المفتش على التحديات…", attachments:"المرفقات", attachBtn:"إضافة أو استعراض الملفات",
      profQ:["كم يبلغ رأس مال الشركة؟","هل لدى الشركة قرض من صندوق التنمية الصناعي؟","هل يتم تصدير منتجات؟","هل فازت الشركة بعقود توريد حكومية؟","هل هناك خطة معتمدة للتوسع في السنة الحالية أو القادمة؟"],
      profA:["25,000,000 ريال","نعم","نعم — 30% من الإنتاج","لا","نعم — توسعة خط جديد 2027"],
      ch:[["قائم","نقص العمالة الفنية المدرّبة يحدّ من الطاقة الإنتاجية."],["قيد المعالجة","تأخر توريد مواد خام مستوردة بسبب إجراءات جمركية."]],
    } : {
      back:"Back", headerTitle:"Challenge Observation report", headerSub:"Al-Amal Worker Training Co.", overlayTag:"Add-on",
      theme:"Theme", langBtnLabel:"AR", ready:"Ready to submit", saveDraft:"Save as draft", submit:"Submit",
      overlayNote:"“Challenge Observation” is an add-on to any main report — it shows the main report's items plus the challenge items, and this dedicated section.",
      contextH:"Inspection context", retrieved:"Retrieved", inspDate:"Inspection date", inspector:"Inspector name", inspectorVal:"Abdullah bin Saleh Al-Shehri", visitType:"Visit type", visitTypeVal:"Regulatory visit",
      profileH:"Company profile (retrieved)", profileNote:"These indicators are read from the system to frame the challenge.",
      challengesH:"Observed challenges", chStatus:"Challenge status", chDesc:"Challenge description", delete:"Delete", addChallenge:"Add challenge",
      notes:"Notes", notesPh:"Inspector notes on the challenges…", attachments:"Attachments", attachBtn:"Add or browse files",
      profQ:["What is the company's capital amount?","Does the company have a loan from the Industrial Development Fund?","Are products exported?","Has the company won government supply contracts?","Is there an approved expansion plan for the current or upcoming year?"],
      profA:["SAR 25,000,000","Yes","Yes — 30% of output","No","Yes — new line expansion 2027"],
      ch:[["Open","Shortage of trained technical labor limits production capacity."],["In progress","Imported raw-material delivery delayed by customs procedures."]],
    };
    return {
      theme:this.state.theme, isLight:this.state.theme==="light", isDark:this.state.theme==="dark",
      toggleTheme:()=>this.setState(s=>({theme:s.theme==="dark"?"light":"dark"})),
      lang:this.state.lang, dir:ar?"rtl":"ltr", toggleLang:()=>this.setState(s=>({lang:s.lang==="ar"?"en":"ar"})),
      t, pickFile,
      profile: t.profQ.map((q,i)=>({q, a:t.profA[i]})),
      challenges: t.ch.map(([status,desc])=>({status, desc})),
    };
  }
}
</script>
</body>
</html>
