<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<x-dc>
<helmet>
<link rel="stylesheet" href="saqeel/styles.css">

<style>
  html, body { height:100%; margin:0; }
  .cp-wrap { max-width:900px; width:100%; margin:0 auto; padding:16px 18px 130px; display:flex; flex-direction:column; gap:14px; }
  .card { border:1px solid var(--border-subtle); border-radius:12px; background:var(--surface-primary); box-shadow:var(--shadow-card); padding:15px 16px; display:flex; flex-direction:column; gap:12px; }
  .cp-seg { display:inline-flex; border:1px solid var(--border-input); border-radius:var(--radius-md); overflow:hidden; flex-wrap:wrap; }
  .cp-seg button { border:0; background:var(--surface-primary); font:inherit; font-size:11.5px; padding:7px 11px; cursor:pointer; color:var(--text-secondary); border-inline-end:1px solid var(--border-input); }
  .cp-seg button[aria-pressed="true"]{ background:var(--action-primary); color:var(--text-on-action); }
  .cp-langbtn { padding:7px 13px; border-radius:999px; border:1px solid var(--border-subtle); background:var(--surface-sunken); font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-secondary); }
  .cp-opt { display:flex; align-items:center; gap:9px; flex:1 1 130px; padding:11px 13px; border:1.5px solid var(--border-input); border-radius:var(--radius-md); background:var(--surface-primary); cursor:pointer; font:inherit; min-height:46px; color:var(--text-primary); }
  .cp-opt[aria-pressed="true"]{ border-color:var(--action-primary); background:var(--accent-soft); }
  .cp-ind { width:18px; height:18px; border-radius:50%; border:2px solid var(--border-strong); flex:none; display:grid; place-items:center; }
  .cp-opt[aria-pressed="true"] .cp-ind{ border-color:var(--action-primary); background:var(--action-primary); }
  .cp-sig { width:100%; height:170px; background:var(--surface-sunken); border:1.5px dashed var(--border-strong); border-radius:var(--radius-md); touch-action:none; cursor:crosshair; display:block; }
  .cp-metrics { display:flex; gap:8px; flex-wrap:wrap; }
  .cp-metric { flex:1 1 110px; border:1px solid var(--border-subtle); border-radius:10px; background:var(--surface-sunken); padding:10px 12px; }
  .cp-metric .n { font-size:19px; font-weight:700; } .cp-metric .l { font-size:11px; color:var(--text-muted); }
  .cp-h { margin:0; font-size:15px; font-weight:600; }
  .cp-k { font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
  .cp-diff { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--border-subtle); border:1px solid var(--border-subtle); border-radius:8px; overflow:hidden; }
  .cp-diff > div { background:var(--surface-primary); padding:9px 11px; font-size:12.5px; }
  .cp-tl { display:flex; flex-direction:column; gap:0; }
  .cp-tlrow { display:flex; gap:10px; padding:8px 0; }
  .cp-tldot { width:10px; height:10px; border-radius:50%; margin-top:4px; flex:none; }
</style>
<script src="./pwa-tabbar.js"></script>
</helmet>
<div style="min-height:100dvh; display:flex; flex-direction:column; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font-body);" data-theme="{{ theme }}" dir="{{ dir }}" lang="{{ lang }}">

  <header style="position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:12px 18px; padding-block-start:max(12px,env(safe-area-inset-top)); background:var(--surface-primary); border-block-end:1px solid var(--border-subtle);">
    <button class="btn btn-icon btn-ghost" aria-label="{{ t.back }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:20px;height:20px;"><path d="m9 6 6 6-6 6"/></svg></button>
    <div style="flex:1; min-width:0; line-height:1.3;"><div style="font-weight:600; font-size:15px;">{{ t.headerTitle }}</div><div class="t-caption" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ t.headerSub }} · <span class="id-code">VS-40219</span></div></div>
    <span class="badge {{ reviewBadgeClass }}">{{ reviewLabel }}</span>
    <button class="cp-langbtn" onClick="{{ toggleLang }}">{{ t.langBtnLabel }}</button>
    <button class="btn btn-icon btn-ghost" onClick="{{ toggleTheme }}" aria-label="{{ t.theme }}">
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:20px;height:20px;"><circle cx="12" cy="12" r="4.4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg></sc-if>
      <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:20px;height:20px;"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
    </button>
  </header>

  <div class="cp-wrap">
    <div class="card" style="gap:9px;">
      <span class="cp-k">{{ t.demoLabel }}</span>
      <div class="cp-seg"><sc-for list="{{ phaseTabs }}" as="p" hint-placeholder-count="6"><button aria-pressed="{{ p.active }}" onClick="{{ p.go }}">{{ p.label }}</button></sc-for></div>
      <label class="check" style="display:flex; gap:8px; align-items:center; font-size:12.5px;"><input type="checkbox" checked="{{ offline }}" onChange="{{ toggleOffline }}"> <span>{{ t.offlineTgl }}</span></label>
    </div>
    {{ panel }}
  </div>

  <div style="position:sticky; bottom:0; display:flex; align-items:center; gap:10px; padding:12px 18px; padding-block-end:max(12px,env(safe-area-inset-bottom)); background:var(--surface-primary); border-block-start:1px solid var(--border-subtle);">
    <span class="badge {{ footBadgeClass }}"><span class="dot"></span>{{ footStatus }}</span>
    <span style="flex:1;"></span>
    <button class="btn btn-secondary">{{ t.saveDraft }}</button>
    <button class="btn btn-primary" aria-disabled="{{ primaryDisabled }}" style="{{ primaryStyle }}" onClick="{{ onPrimary }}">{{ primaryLabel }}</button>
  </div>
</div>
</x-dc>

          h("div",{className:"t-caption",style:{color:"var(--status-warning-text)"}},t.draftWarn)));
    }
    function compareToggle(){ return h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"10px",flexWrap:"wrap"}}, h("h3",{className:"cp-h"},t.compareH), h("button",{className:"btn btn-secondary",onClick:()=>set({showCompare:!st.showCompare})}, st.showCompare?"−":"+")); }
    function compareBlock(){ return h("div",null, h("div",{className:"cp-k",style:{marginBottom:"6px"}},t.diffItem),
      h("div",{className:"cp-diff"}, h("div",null, h("div",{className:"cp-k"},t.before), h("div",{style:{color:"var(--status-compliant-text)"}},t.diffB)), h("div",null, h("div",{className:"cp-k"},t.after), h("div",{style:{color:"var(--status-critical-text)"}},t.diffA)))); }
    function historyCard(){
      const rows=[["compliant",t.h1],["warning",t.h2],["compliant",t.h3], st.phase==="approved"?["completed",t.h4]:null].filter(Boolean);
      return h("div",{className:"card"}, h("h3",{className:"cp-h"},t.historyH),
        h("div",{className:"cp-tl"}, rows.map(([tone,label],i)=>h("div",{className:"cp-tlrow",key:i}, h("span",{className:"cp-tldot",style:{background:`var(--status-${tone})`}}), h("div",{style:{fontSize:"13px"}},label)))));
    }

    // footer primary per phase
    const ackReady = st.attendance==="present" ? (st.hasInk && st.sigName.trim()) : !!st.absentReason.trim();
    let primaryLabel,primaryBlocked=false,onPrimary=()=>{},foot,footClass;
    if(ph==="review"){ primaryLabel=t.p_ack; foot=st.blockersCleared?t.footReady:t.footBlocked; footClass=st.blockersCleared?"badge-completed":"badge-critical"; onPrimary=()=>set({phase:"ack"}); }
    else if(ph==="ack"){ primaryLabel=t.submitBtn; primaryBlocked=!ackReady; foot=ackReady?t.footReady:t.footBlocked; footClass=ackReady?"badge-completed":"badge-critical"; onPrimary=()=>{ if(ackReady)set({phase:"submitted"}); }; }
    else if(ph==="submitted"){ primaryLabel=t.p_pending; foot=t.footSubmitted; footClass="badge-completed"; onPrimary=()=>set({phase:"pending"}); }
    else if(ph==="pending"){ primaryLabel=t.p_returned; foot=t.footPending; footClass="badge-pending"; onPrimary=()=>set({phase:"returned"}); }
    else if(ph==="returned"){ primaryLabel=fmt(t.resubmitBtn,{v:st.version+1}); primaryBlocked=!st.correctionDone; foot=st.correctionDone?t.footReady:t.footBlocked; footClass=st.correctionDone?"badge-completed":"badge-warning"; onPrimary=()=>{ if(st.correctionDone)set({phase:"approved",version:st.version+1,correctionDone:false}); }; }
    else if(ph==="approved"){ primaryLabel=t.finalPdf; foot=t.footApproved; footClass="badge-completed"; }
    else { primaryLabel=t.p_review; foot=t.footRejected; footClass="badge-critical"; onPrimary=()=>set({phase:"review"}); }
    const primaryDis = primaryBlocked;

    const revMap={review:["badge-onhold",t.p_review],ack:["badge-onhold",t.p_ack],submitted:["badge-completed",t.p_submitted],pending:["badge-pending",t.p_pending],returned:["badge-warning",t.p_returned],approved:["badge-completed",t.p_approved],rejected:["badge-critical",t.p_rejected]};
    const PH=[["review",t.p_review],["ack",t.p_ack],["submitted",t.p_submitted],["pending",t.p_pending],["returned",t.p_returned],["approved",t.p_approved],["rejected",t.p_rejected]];
    return {
      theme:st.theme, isLight:st.theme==="light", isDark:st.theme==="dark",
      toggleTheme:()=>this.setState(s=>({theme:s.theme==="dark"?"light":"dark"})),
      lang:st.lang, dir:ar?"rtl":"ltr", toggleLang:()=>this.setState(s=>({lang:s.lang==="ar"?"en":"ar"})), t,
      phaseTabs: PH.map(([k,l])=>({label:l, active: ph===k?"true":"false", go:()=>set({phase:k})})),
      offline:st.offline, toggleOffline:()=>this.setState(s=>({offline:!s.offline})),
      panel,
      reviewLabel: revMap[ph][1], reviewBadgeClass: revMap[ph][0],
      footStatus:foot, footBadgeClass:footClass,
      primaryLabel, primaryDisabled: primaryDis?"true":"false", primaryStyle: primaryDis?"opacity:.5; pointer-events:none;":"", onPrimary,
    };
  }
}
</script>
</body>
</html>
