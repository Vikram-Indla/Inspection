<html>

<link rel="stylesheet" href="saqeel/styles.css">
<style>
  html, body { height:100%; margin:0; }
  .vs-wrap { max-width:900px; width:100%; margin:0 auto; padding:16px 18px 130px; display:flex; flex-direction:column; gap:14px; }
  .card { border:1px solid var(--border-subtle); border-radius:12px; background:var(--surface-primary); box-shadow:var(--shadow-card); padding:15px 16px; display:flex; flex-direction:column; gap:12px; }
  .vs-seg { display:inline-flex; border:1px solid var(--border-input); border-radius:var(--radius-md); overflow:hidden; flex-wrap:wrap; }
  .vs-seg button { border:0; background:var(--surface-primary); font:inherit; font-size:11.5px; padding:7px 11px; cursor:pointer; color:var(--text-secondary); border-inline-end:1px solid var(--border-input); }
  .vs-seg button[aria-pressed="true"]{ background:var(--action-primary); color:var(--text-on-action); }
  .vs-langbtn { padding:7px 13px; border-radius:999px; border:1px solid var(--border-subtle); background:var(--surface-sunken); font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-secondary); }
  .vs-path { display:flex; gap:6px; flex-wrap:wrap; }
  .vs-node { display:flex; align-items:center; gap:6px; font-size:12px; padding:6px 10px; border-radius:999px; background:var(--surface-sunken); color:var(--text-muted); }
  .vs-node.done { color:var(--status-compliant-text); } .vs-node.now { background:var(--accent-soft); color:var(--accent-text); font-weight:600; }
  .vs-ndot { width:8px; height:8px; border-radius:50%; background:currentColor; flex:none; }
  .vs-link { display:flex; gap:10px; padding:10px 0; border-block-end:1px solid var(--border-subtle); }
  .vs-link:last-child { border-block-end:0; }
  .vs-ln { width:22px; height:22px; border-radius:50%; background:var(--surface-sunken); display:grid; place-items:center; font-size:11px; font-weight:700; flex:none; color:var(--text-secondary); }
  .vs-room { height:170px; border:1px dashed var(--border-strong); border-radius:12px; background:var(--surface-sunken); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--text-muted); }
  .vs-in { height:var(--control-h-md); padding-inline:var(--space-3); background:var(--surface-primary); color:var(--text-primary); border:1.5px solid var(--border-input); border-radius:var(--radius-md); font:inherit; width:120px; text-align:center; letter-spacing:.3em; font-family:var(--font-mono); }
  .vs-h { margin:0; font-size:15px; font-weight:600; }
  .vs-k { font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
  .up-btn { display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border:1.5px dashed var(--border-strong); border-radius:var(--radius-md); background:var(--surface-sunken); font:inherit; font-size:13px; cursor:pointer; color:var(--text-secondary); align-self:flex-start; }

<div style="min-height:100dvh; display:flex; flex-direction:column; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font-body);" data-theme="{{ theme }}" dir="{{ dir }}" lang="{{ lang }}">

    <span class="badge badge-info">{{ stateLabel }}</span>
    <button class="vs-langbtn" onClick="{{ toggleLang }}">{{ t.langBtnLabel }}</button>

    </button>
  </header>

  <div class="vs-wrap">
    <div class="card" style="gap:9px;">
      <span class="vs-k">{{ t.demoLabel }}</span>

        <label class="check" style="display:flex; gap:8px; align-items:center; font-size:12.5px;"><input type="checkbox" checked="{{ stale }}" onChange="{{ toggleStale }}"> <span>{{ t.staleTgl }}</span></label>

    </div>

    {{ banners }}

    <div class="card">
      <h3 class="vs-h">{{ t.statePath }}</h3>
      <div class="vs-path">{{ pathNodes }}</div>
    </div>

    <div class="card">
      <h3 class="vs-h">{{ t.contract }}</h3>
      <p class="t-caption" style="margin:0;">{{ t.contractHint }}</p>
      {{ links }}
    </div>

    {{ participantsCard }}
    {{ roomCard }}
    {{ closeCard }}
  </div>

  <div style="position:sticky; bottom:0; display:flex; align-items:center; gap:10px; padding:12px 18px; padding-block-end:max(12px,env(safe-area-inset-bottom)); background:var(--surface-primary); border-block-start:1px solid var(--border-subtle);">
    <span class="badge {{ nextBadgeClass }}"><span class="dot"></span>{{ nextWhy }}</span>
    <span style="flex:1;"></span>
    <button class="btn btn-secondary" aria-disabled="{{ reschedDisabled }}" style="{{ reschedStyle }}">{{ t.reschedule }}</button>
    <button class="btn btn-primary" aria-disabled="{{ nextDisabled }}" style="{{ nextStyle }}" onClick="{{ onNext }}">{{ nextLabel }}</button>
  </div>
</div>
</x-dc>

    const closeCard = closed ? null : h("div",{className:"card"}, h("h3",{className:"vs-h"},t.closeH),
      h("label",{className:"fld",style:{display:"flex",flexDirection:"column",gap:"5px"}}, h("span",{style:{fontSize:"13px",color:"var(--text-secondary)"}}, t.closeReason+" *"), h("input",{className:"input",disabled:!st.online})),
      h("label",{className:"fld",style:{display:"flex",flexDirection:"column",gap:"5px"}}, h("span",{style:{fontSize:"13px",color:"var(--text-secondary)"}},t.closeComment), h("textarea",{className:"input",rows:2,disabled:!st.online})),
      h("button",{className:"btn btn-secondary",style:{alignSelf:"flex-start",color:"var(--status-critical-text)",borderColor:"color-mix(in srgb,var(--status-critical) 40%,transparent)"},disabled:!st.online},t.closeSubmit));

    // single gated next action (mirrors Room.tsx `next`)
    let nextLabel,nextBlocked=false,nextWhy=t.nextReady;
    if(closed){ nextLabel=t.s_closed; nextBlocked=true; nextWhy=t.immutableTitle; }
    else if(st.sState==="scheduled"){ nextLabel=t.openWaiting; }
    else if(st.sState==="in_progress"){ nextLabel=t.continueExec; }
    else if(serverReady){ nextLabel=t.begin; }
    else { nextLabel=t.beginGated; nextBlocked=true; nextWhy=t.beginGated; }
    const nextDisabled = nextBlocked || !st.online;
    const onNext=()=>{ if(nextBlocked||!st.online)return; if(st.sState==="scheduled")set({sState:"waiting"}); else if(st.sState==="verified")set({sState:"in_progress"}); };
    const canReschedule=["scheduled","waiting"].includes(st.sState) && st.online;

    const TABS=ORDER.map(s=>[s,lbl[s]]);
    return {
      theme:st.theme, isLight:st.theme==="light", isDark:st.theme==="dark",
      toggleTheme:()=>this.setState(s=>({theme:s.theme==="dark"?"light":"dark"})),
      lang:st.lang, dir:ar?"rtl":"ltr", toggleLang:()=>this.setState(s=>({lang:s.lang==="ar"?"en":"ar"})), t,
      stateLabel: lbl[st.sState],
      stateTabs: TABS.map(([k,l])=>({label:l, active: st.sState===k?"true":"false", go:()=>set({sState:k, repVerified: ORDER.indexOf(k)>=3, repJoined: ORDER.indexOf(k)>=2, otpSent:false, otpMsg:"", attempts:0, resends:0, locked:false, exhausted:false, devCode:"", otpCode:""})})),
      online:st.online, toggleOnline:()=>this.setState(s=>({online:!s.online})),
      stale:st.stale, toggleStale:()=>this.setState(s=>({stale:!s.stale})),
      sim:st.sim, toggleSim:()=>this.setState(s=>({sim:!s.sim})),
      banners, pathNodes, links, participantsCard, roomCard, closeCard,
      nextLabel, nextWhy, nextBadgeClass: nextBlocked?"badge-critical":"badge-completed",
      nextDisabled: nextDisabled?"true":"false", nextStyle: nextDisabled?"opacity:.5; pointer-events:none;":"",
      onNext,
      reschedDisabled: canReschedule?"false":"true", reschedStyle: canReschedule?"":"opacity:.5; pointer-events:none;",
    };
  }
}
</script>
