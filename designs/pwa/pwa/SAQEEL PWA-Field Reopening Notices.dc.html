<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="saqeel/styles.css">
<style>
  html, body { height:100%; margin:0; }
  .rn-wrap { max-width:820px; width:100%; margin:0 auto; padding:16px 18px 120px; display:flex; flex-direction:column; gap:12px; }
  .rn-acc { border:1px solid var(--border-subtle); border-radius:12px; background:var(--surface-primary); overflow:hidden; box-shadow:var(--shadow-card); }
  .rn-head { display:flex; align-items:center; gap:12px; width:100%; padding:15px 17px; border:0; background:none; cursor:pointer; font:inherit; text-align:start; color:var(--text-primary); }
  .rn-num { width:26px; height:26px; border-radius:50%; background:var(--accent-soft); color:var(--accent-text); display:grid; place-items:center; font-size:13px; font-weight:600; flex:none; }
  .rn-body { padding:8px 17px 20px; border-block-start:1px solid var(--border-subtle); display:flex; flex-direction:column; gap:14px; }
  .fld { display:flex; flex-direction:column; gap:5px; }
  .fld > span { font-size:13px; color:var(--text-secondary); }
  .req { color:var(--status-critical-text); }
  .fld-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px){ .fld-row { grid-template-columns:1fr; } }
  .rn-chip { display:inline-flex; align-items:center; gap:7px; padding:9px 13px; border:1.5px solid var(--border-input); border-radius:var(--radius-md); background:var(--surface-primary); font:inherit; font-size:13px; cursor:pointer; color:var(--text-primary); min-height:42px; }
  .rn-chip[aria-pressed="true"]{ border-color:var(--action-primary); background:var(--accent-soft); }
  .rn-lines { display:flex; gap:8px; flex-wrap:wrap; }
  .up-btn { display:inline-flex; align-items:center; gap:8px; padding:11px 15px; border:1.5px dashed var(--border-strong); border-radius:var(--radius-md); background:var(--surface-sunken); font:inherit; font-size:13px; cursor:pointer; color:var(--text-secondary); align-self:flex-start; }
  .rn-langbtn { padding:7px 13px; border-radius:999px; border:1px solid var(--border-subtle); background:var(--surface-sunken); font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-secondary); }
  .rn-check { display:flex; align-items:center; gap:9px; font-size:13px; cursor:pointer; }
  .rn-check input { width:18px; height:18px; accent-color:var(--action-primary); }
  .sigbox { height:110px; border:1.5px dashed var(--border-strong); border-radius:var(--radius-md); background:var(--surface-sunken); display:grid; place-items:center; color:var(--text-muted); font-size:12.5px; }
</style>
<script src="./pwa-tabbar.js"></script>
</helmet>
<div style="min-height:100dvh; display:flex; flex-direction:column; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font-body);" data-theme="{{ theme }}" dir="{{ dir }}" lang="{{ lang }}">

  <header style="position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:12px 18px; padding-block-start:max(12px,env(safe-area-inset-top)); background:var(--surface-primary); border-block-end:1px solid var(--border-subtle);">
    <button class="btn btn-icon btn-ghost" aria-label="{{ t.back }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:20px;height:20px;"><path d="m9 6 6 6-6 6"/></svg></button>
    <div style="flex:1; min-width:0; line-height:1.35;"><div style="font-weight:600; font-size:15px;">{{ t.headerTitle }}</div><div class="t-caption" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ t.headerSub }} · <span class="id-code">VS-40219</span></div></div>
    <span class="badge badge-info">{{ t.recordsTag }}</span>
    <button class="rn-langbtn" onClick="{{ toggleLang }}">{{ t.langBtnLabel }}</button>
    <button class="btn btn-icon btn-ghost" onClick="{{ toggleTheme }}" aria-label="{{ t.theme }}">
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:20px;height:20px;"><circle cx="12" cy="12" r="4.4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg></sc-if>
      <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:20px;height:20px;"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
    </button>
  </header>

  <div class="rn-wrap">
    <div class="rn-acc" style="border:0; background:var(--status-info-soft); box-shadow:none;">
      <div style="padding:11px 15px; display:flex; gap:10px; align-items:flex-start;">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--status-info-text)" stroke-width="1.7" style="width:18px;height:18px;flex:none;margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
        <span class="t-compact" style="color:var(--status-info-text);">{{ t.note }}</span>
      </div>
    </div>

    <sc-for list="{{ notices }}" as="n" hint-placeholder-count="2">
      <div class="rn-acc">
        <button class="rn-head" onClick="{{ n.toggle }}" aria-expanded="{{ n.open }}"><span class="rn-num">{{ n.num }}</span><span style="font-weight:600; font-size:15px; flex:1;">{{ n.title }}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" style="width:18px;height:18px;flex:none;">{{ n.chevron }}</svg></button>
        <sc-if value="{{ n.open }}" hint-placeholder-val="{{ true }}"><div class="rn-body">{{ n.body }}</div></sc-if>
      </div>
    </sc-for>
  </div>

  <input id="rn-filepick" type="file" accept="image/*,application/pdf" style="display:none">

  <div style="position:sticky; bottom:0; display:flex; align-items:center; gap:12px; padding:12px 18px; padding-block-end:max(12px,env(safe-area-inset-bottom)); background:var(--surface-primary); border-block-start:1px solid var(--border-subtle);">
    <span class="badge badge-warning"><span class="dot"></span>{{ t.pendingSync }}</span>
    <span style="flex:1;"></span>
    <button class="btn btn-secondary">{{ t.saveDraft }}</button>
    <button class="btn btn-primary">{{ t.submit }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:760}}">
class Component extends DCLogic {
  state = { theme:"dark", lang:"ar", open:1, plAbsent:false, facAbsent:false, lines:{pkg:true, weld:false} };
  renderVals(){
    const ar=this.state.lang==="ar", h=React.createElement, st=this.state;
    const pickFile=()=>{ const el=document.getElementById("rn-filepick"); if(el)el.click(); };
    const t = ar ? {
      back:"رجوع", headerTitle:"إشعارات إعادة الفتح", headerSub:"شركة الأمل لتدريب العمال", recordsTag:"محاضر", theme:"الوضع", langBtnLabel:"EN",
      pendingSync:"بانتظار المزامنة · 2", saveDraft:"حفظ كمسودة", submit:"إرسال",
      note:"يقترن كل إشعار إعادة فتح بمحضر الإغلاق المقابل، ويظهر فقط في الزيارة الميدانية.",
      plTitle:"إشعار إعادة فتح خط إنتاج المنشأة", facTitle:"إشعار إعادة فتح المنشأة",
      lines:"خط الإنتاج", linesHint:"يمكن اختيار أكثر من خط إنتاج.", pkgLine:"خط التعبئة والتغليف", weldLine:"خط اللحام",
      reportNo:"رقم المحضر", reportDate:"تاريخ المحضر",
      absent:"عدم وجود ممثل للمنشأة أو اعتراضه على التوقيع", reason:"السبب", signature:"التوقيع", signHint:"وقّع في الإطار (يظهر عند حضور الممثل وموافقته).",
      reopenPL:"يُحدَّد عند إعادة فتح أحد خطوط الإنتاج.", reopenFac:"يُحدَّد عند إعادة فتح المنشأة.",
    } : {
      back:"Back", headerTitle:"Reopening notifications", headerSub:"Al-Amal Worker Training Co.", recordsTag:"Records", theme:"Theme", langBtnLabel:"AR",
      pendingSync:"Pending sync · 2", saveDraft:"Save as draft", submit:"Submit",
      note:"Each reopening notice pairs with its closure record and appears only on a field visit.",
      plTitle:"Production Line Reopening Notification", facTitle:"Factory Reopening Notification",
      lines:"Production line", linesHint:"More than one line can be selected.", pkgLine:"Packaging line", weldLine:"Welding line",
      reportNo:"Report number", reportDate:"Report date",
      absent:"No factory representative present or refused to sign", reason:"Reason", signature:"Signature", signHint:"Sign in the box (shown when the representative attends and agrees).",
      reopenPL:"Selected when a production line is reopened.", reopenFac:"Selected when the establishment is reopened.",
    };
    const down=h("path",{d:"m6 9 6 6 6-6"}), up=h("path",{d:"m6 15 6-6 6 6"});
    const field=(label,opts={})=>h("label",{className:"fld"}, h("span",null,label, opts.req?h("span",{className:"req"}," *"):null), opts.type==="date"?h("input",{className:"input",type:"date"}):h("input",{className:"input",defaultValue:opts.val||""}));
    // attendance branch shared by both notices (BRD: reason if absent/refused, else signature)
    const attendance=(absent,key)=>h("div",{style:{display:"flex",flexDirection:"column",gap:"10px",borderBlockStart:"1px solid var(--border-subtle)",paddingBlockStart:"12px"}},
      h("label",{className:"rn-check"}, h("input",{type:"checkbox",checked:absent,onChange:e=>this.setState({[key]:e.target.checked})}), h("span",null,t.absent)),
      absent
        ? h("label",{className:"fld"}, h("span",null,t.reason), h("textarea",{className:"input",rows:2}))
        : h("div",{className:"fld"}, h("span",{style:{fontSize:"13px",color:"var(--text-secondary)"}},t.signature), h("div",{className:"sigbox"},t.signHint)));

    const plBody=h(React.Fragment,null,
      h("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}},
        h("span",{style:{fontSize:"13px",color:"var(--text-secondary)"}}, t.lines, h("span",{className:"req"}," *")),
        h("div",{className:"rn-lines"},
          h("button",{className:"rn-chip","aria-pressed":st.lines.pkg?"true":"false",onClick:()=>this.setState(s=>({lines:{...s.lines,pkg:!s.lines.pkg}}))}, t.pkgLine),
          h("button",{className:"rn-chip","aria-pressed":st.lines.weld?"true":"false",onClick:()=>this.setState(s=>({lines:{...s.lines,weld:!s.lines.weld}}))}, t.weldLine)),
        h("span",{className:"t-caption"},t.linesHint)),
      h("div",{className:"fld-row"}, field(t.reportNo,{req:true,val:"47072332"}), field(t.reportDate,{req:true,type:"date"})),
      attendance(st.plAbsent,"plAbsent"));
    const facBody=h(React.Fragment,null,
      h("div",{className:"fld-row"}, field(t.reportNo,{req:true,val:"47072332"}), field(t.reportDate,{req:true,type:"date"})),
      attendance(st.facAbsent,"facAbsent"));

    const NOTICES=[
      {num:"١", en:"1", title:t.plTitle, body:plBody},
      {num:"٢", en:"2", title:t.facTitle, body:facBody},
    ];
    return {
      theme:st.theme, isLight:st.theme==="light", isDark:st.theme==="dark",
      toggleTheme:()=>this.setState(s=>({theme:s.theme==="dark"?"light":"dark"})),
      lang:st.lang, dir:ar?"rtl":"ltr", toggleLang:()=>this.setState(s=>({lang:s.lang==="ar"?"en":"ar"})), t, pickFile,
      notices: NOTICES.map((n,idx)=>{ const i=idx+1; const open=st.open===i; return { num: ar?n.num:n.en, title:n.title, open, chevron: open?up:down, toggle:()=>this.setState(s=>({open:s.open===i?null:i})), body:n.body }; }),
    };
  }
}
</script>
</body>
</html>
