<style>

  .mm-btn { padding:7px 13px; border-radius:999px; border:1px solid var(--border-subtle); background:var(--surface-sunken); font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--text-secondary); }
  .mm-btn[aria-pressed="true"]{ background:var(--action-primary); color:var(--text-on-action); border-color:var(--action-primary); }
  .mm-legend { display:flex; gap:14px; flex-wrap:wrap; }
  .mm-leg { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-secondary); }
  .mm-sw { width:10px; height:10px; border-radius:50%; flex:none; }
  .mm-canvas { padding:32px 40px 80px; overflow:auto; }
  .mm-tree { display:inline-flex; align-items:flex-start; }
  .mm-node { display:flex; align-items:center; }
  .mm-card { position:relative; display:flex; align-items:center; gap:9px; padding:10px 13px; border:1px solid var(--border-subtle); border-inline-start:4px solid var(--c,var(--border-strong)); border-radius:12px; background:var(--surface-primary); box-shadow:var(--shadow-card); cursor:pointer; white-space:nowrap; min-height:40px; }

  .mm-card.stage { font-weight:600; }

  .mm-card.root .mm-chev { background:rgba(255,255,255,.2); color:#fff; }
  .mm-dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .mm-tt { display:flex; flex-direction:column; gap:1px; }
  .mm-lbl { font-size:13.5px; line-height:1.25; }
  .mm-rt { font-size:10.5px; color:var(--text-muted); font-family:var(--font-mono); }

  .mm-kids::before { content:""; position:absolute; inset-inline-start:0; top:16px; bottom:16px; width:2px; background:var(--border-strong); }
  .mm-kids > .mm-node { position:relative; }
  .mm-kids > .mm-node::before { content:""; position:absolute; inset-inline-start:-30px; top:20px; width:30px; height:2px; background:var(--border-strong); }
  .mm-count { font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; background:var(--surface-sunken); color:var(--text-muted); }
  .mm-card.root .mm-count { background:rgba(255,255,255,.2); color:#fff; }
  .dv-wrap { display:flex; flex-direction:column; gap:14px; max-width:1500px; }
  .dv-note { font-size:12px; color:var(--text-muted); max-width:90ch; }
  .dv-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; max-width:1500px; }
  .dv-modcard { border:1px solid var(--border-subtle); border-radius:10px; background:var(--surface-primary); overflow:hidden; }
  .dv-modname { padding:10px 14px; font-size:13px; font-weight:700; background:var(--surface-secondary); border-block-end:1px solid var(--border-subtle); }
  .dv-lanes { display:flex; flex-direction:column; }
  .dv-lanerow { display:grid; grid-template-columns:110px auto; align-items:start; gap:4px 10px; padding:8px 14px; border-block-end:1px solid var(--border-subtle); }
  .dv-lanerow:last-child { border-block-end:0; }
  .dv-lanename { font-size:11px; font-weight:600; color:var(--text-muted); padding-top:1px; }
  .dv-status { display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; }

  .dv-legend { display:flex; gap:16px; flex-wrap:wrap; padding:4px 2px; }
  .dv-leg { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-secondary); }

<div class="mm-root" dir="{{ dir }}" lang="{{ lang }}" data-theme="dark">
  <div class="mm-bar">
    <strong style="font-size:14px; word-break:break-word;">{{ boardTitle }}</strong>
    <span class="mm-rt" style="color:var(--text-muted);">{{ revLabel }}</span>
    <button class="mm-btn" aria-pressed="{{ isJourney }}" onClick="{{ showJourney }}">{{ t.vJourney }}</button>
    <button class="mm-btn" aria-pressed="{{ isApi }}" onClick="{{ showApi }}">{{ t.vApi }}</button>
    <button class="mm-btn" aria-pressed="{{ isDelivery }}" onClick="{{ showDelivery }}">{{ t.vDelivery }}</button>
    <span style="flex:1;"></span>
    <div class="mm-legend">{{ legend }}</div>
    <sc-if value="{{ isDelivery }}" hint-placeholder-val="{{ false }}"></sc-if>
    <sc-if value="{{ notDelivery }}" hint-placeholder-val="{{ true }}">
      <button class="mm-btn" onClick="{{ expandAll }}">{{ t.expand }}</button>
      <button class="mm-btn" onClick="{{ collapseAll }}">{{ t.collapse }}</button>
    </sc-if>
    <button class="mm-btn" onClick="{{ toggleLang }}">{{ t.langBtnLabel }}</button>
  </div>
  <div class="mm-canvas"><sc-if value="{{ isDelivery }}" hint-placeholder-val="{{ false }}">{{ deliveryBoard }}</sc-if><sc-if value="{{ notDelivery }}" hint-placeholder-val="{{ true }}">{{ tree }}</sc-if></div>
</div>

      { id:"M1", name:S("M1 · Dashboard","M1 · لوحة القيادة"), lanes:{
        design:cell("green","Design","M1-DASH-r1 reconciled vs dashboard.xlsx/DASH-001..016/WA-SP-010..028/WA-M1-AC-001..006/SRC-DES-025/046 — SAQEEL M1 Dashboard.dc.html","2026-07-24"),
        frontend:cell("green","FE","Candidate — F0 shell reused; not yet built in app/dashboard","2026-07-24"),
        service:cell("amber","Platform","Analytics and Execution cutover remain blocked; only RLS/audit baseline proven","2026-07-24"),
        qa:cell("amber","QA","Fixture-only evidence; formula/policy tests not yet run against real data","2026-07-24"),
        sponsor:cell("green","Sponsor","M1 dashboard design baseline approved — design reconciliation only, not full KPI-live acceptance","2026-07-24"),
      }},
      { id:"M3", name:S("M3 · Operations Center","M3 · مركز العمليات"), lanes:{ ...grey5(), design:cell("amber","Design","WA-DES-033-C3 and WA-DES-034-C3 visibly reviewed against /operations and /operations/live. Premium shell, responsive controls, hard states and the three truthful location-provenance states are present in the live design surfaces, but design authority is not yet consumable: the platform exposes no immutable revision token/export hash for the currently visible provenance-adjusted C3, the registered 21,270-byte C3 export (SHA-256 ef0a7c0dc933a793e194b87aa84de849cee2386b01aa1368375ef598e8ded279) is the older projected-route predecessor, and repository CURRENT_SLICE remains M2 awaiting Product Owner approval. No M3 design or requirement completion credit. Open P1 corrections before acceptance: make Active inspectors inspector-first and operationally scannable instead of exposing an unbounded fixture-heavy dump; selection must open a meaningful detail hierarchy with source-backed inspector name, factory, region, canonical operational state, valid state-entered time, visit reference and the entity’s own location-provenance metadata; impossible future, invalid or contradictory timestamps must fail closed as unavailable/invalid data rather than render as ‘Since’; use a source-backed locale-specific person name when available, otherwise keep the official name inside automatic bidirectional isolation without inventing transliteration; retain distinct Loading, RLS-empty, query Error, tile/provider failure, No positions and Direct-route unauthorized states. Current runtime evidence still shows fixture-heavy rows, impossible future ‘Since’ dates, Arabic-only names in English and a global projected-route disclosure, so parity is not certified.","2026-07-25") } },
      { id:"M4", name:S("M4 · Factories & Factory 360","M4 · المصانع و٣٦٠"), lanes:{ ...grey5(), design:cell("amber","Design","Shell reconciliation started; CR/license model + 8-tab IA not yet re-verified against reference","2026-07-24") } },
      { id:"M5", name:S("M5 · Reviews/Cases/Tasks","M5 · المراجعات/الحالات/المهام"), lanes:grey5() },
      { id:"M6", name:S("M6 · Compliance/Enforcement/Committee/Risk","M6 · الامتثال/الإنفاذ/اللجنة/المخاطر"), lanes:grey5() },
      { id:"M7", name:S("M7 · Reports/OCR/AI/Incidents","M7 · التقارير/OCR/الذكاء الاصطناعي/الحوادث"), lanes:grey5() },
      { id:"M8", name:S("M8 · Admin Identity/Roles/Security","M8 · إدارة الهوية/الأدوار/الأمن"), lanes:grey5() },
      { id:"M9", name:S("M9 · Admin Workflows/Forms/Lookups/KPI","M9 · سير العمل/النماذج/القوائم/المؤشرات"), lanes:grey5() },
      { id:"M10", name:S("M10 · Admin Integrations/GIS/Execution/Provider Health","M10 · التكاملات/نظم المعلومات الجغرافية/التنفيذ/صحة المزوّد"), lanes:grey5() },
      { id:"M11", name:S("M11 · Auth/Portal/Profile/Virtual/Shared States","M11 · الدخول/البوابة/الملف/الافتراضي/الحالات المشتركة"), lanes:grey5() },
    ];
    const legendDelivery = Object.entries(ST).filter(([k])=>k!=="na").map(([k,v],i)=>h("span",{key:i,className:"dv-leg"}, h("span",{className:"dv-dot2",style:{background:v.c}}), v.sym+" "+v.lbl));
    const dLane=(labelText,l,i)=>{ const s=ST[l.status]; return h("div",{className:"dv-lanerow",key:i},
      h("div",{className:"dv-lanename"}, labelText),
      h("div",{className:"dv-status",style:{color:s.c}}, h("span",{className:"dv-dot2",style:{background:s.c}}), s.sym+" "+s.lbl),
      h("div",{className:"dv-meta2"},
        l.owner?h("span",{key:"o"}, l.owner+(l.date?" · "+l.date:"")):null,
        l.evidence?h("span",{key:"e"}, l.evidence):null,
        l.blocker?h("span",{key:"b",style:{color:ST.red.c}}, l.blocker):null,
      ),
    ); };
    const deliveryBoard = h("div",{className:"dv-wrap"},
      h("div",{className:"dv-legend"}, legendDelivery),
      h("div",{className:"dv-note"}, S(
        "Every non-grey lane shows owner, evidence, last-updated date and blocker when applicable. One overall module color is prohibited; grey does not mean no product exists — existing routes may already function pending Phase-1 redesign certification.",
        "يعرض كل مسار غير رمادي المالك والدليل وتاريخ آخر تحديث والمعيق عند وجوده. يُمنع لون واحد إجمالي للوحدة؛ الرمادي لا يعني عدم وجود منتج — قد تعمل المسارات الحالية بانتظار اعتماد إعادة التصميم للمرحلة الأولى.",
      )),
      h("div",{className:"dv-cards"},
        MODULES.map(m=>h("div",{className:"dv-modcard",key:m.id},
          h("div",{className:"dv-modname"}, m.name),
          h("div",{className:"dv-lanes"}, LANES.map(([k,l],i)=>dLane(l,m.lanes[k],i))),
        )),
      ),
    );
    const isCol=(id)=>!!st.collapsed[id];
    const toggle=(id)=>this.setState(s=>({collapsed:{...s.collapsed,[id]:!s.collapsed[id]}}));
    const render=(n)=>{
      const kids=n.kids||[]; const col=isCol(n.id); const has=kids.length>0;
      const card=h("div",{className:"mm-card"+(n.root?" root":"")+(n.kids?" stage":""),style:n.s?{"--c":C[n.s]}:null,onClick:has?()=>toggle(n.id):null},
        has?h("span",{className:"mm-chev"}, col?"+":"−"):(n.s?h("span",{className:"mm-dot",style:{background:C[n.s]}}):null),
        h("span",{className:"mm-tt"}, h("span",{className:"mm-lbl"},n.label), n.rt?h("span",{className:"mm-rt"},n.rt):null),
        has?h("span",{className:"mm-count"},String(kids.length)):null);
      return h("div",{className:"mm-node",key:n.id}, card, (has&&!col)?h("div",{className:"mm-kids"}, kids.map(render)):null);
    };

    const isDelivery = st.view==="delivery";
    const ACTIVE = st.view==="api" ? TREE_API : TREE;
    const allIds=[]; (function walk(n){ if(n.kids&&n.kids.length){allIds.push(n.id); n.kids.forEach(walk);} })(ACTIVE);
    return {
      lang:st.lang, dir:ar?"rtl":"ltr", toggleLang:()=>this.setState(s=>({lang:s.lang==="ar"?"en":"ar"})), t,
      legend: isDelivery ? null : legend,
      tree: h("div",{className:"mm-tree"}, render(ACTIVE)),
      deliveryBoard, isDelivery, notDelivery: !isDelivery,
      isJourney: st.view==="journey"?"true":"false", isApi: st.view==="api"?"true":"false",
      showJourney:()=>this.setState({view:"journey",collapsed:{}}), showApi:()=>this.setState({view:"api",collapsed:{}}),
      showDelivery:()=>this.setState({view:"delivery",collapsed:{}}),
      expandAll:()=>this.setState({collapsed:{}}),
      collapseAll:()=>{ const c={}; allIds.forEach(id=>{ if(id!==ACTIVE.id)c[id]=true; }); this.setState({collapsed:c}); },
      revLabel: "rev "+REV.id+" ← "+REV.from,
      boardTitle: isDelivery ? S("Web/Admin delivery status","حالة تسليم الويب/الإدارة") : t.title,
    };
  }
