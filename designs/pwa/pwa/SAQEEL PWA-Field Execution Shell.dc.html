<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="saqeel/styles.css">
<style>
  html, body { height:100%; margin:0; }
  .sh-root { min-height:100dvh; display:flex; flex-direction:column; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font-body); }
  .sh-head { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; padding:12px 18px; padding-block-start:max(12px,env(safe-area-inset-top)); background:var(--surface-primary); border-block-end:1px solid var(--border-subtle); }
  .sh-langbtn { padding:7px 13px; border-radius:999px; border:1px solid var(--border-subtle); background:var(--surface-sunken); font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-secondary); }
  .sh-body { flex:1; display:grid; grid-template-columns:1fr; min-height:0; }
  .sh-nav { display:flex; gap:8px; overflow-x:auto; padding:10px 14px; background:var(--surface-primary); border-block-end:1px solid var(--border-subtle); position:sticky; top:0; z-index:20; }
  .sh-stage { flex:0 0 auto; display:flex; flex-direction:column; gap:5px; align-items:flex-start; min-width:132px; padding:9px 13px; border:1.5px solid var(--border-input); border-radius:var(--radius-md); background:var(--surface-primary); cursor:pointer; font:inherit; text-align:start; color:var(--text-primary); min-height:44px; }
  .sh-stage[aria-current="true"]{ border-color:var(--action-primary); background:var(--accent-soft); }
  .sh-stage .row { display:flex; align-items:center; gap:7px; width:100%; }
  .sh-idx { width:22px; height:22px; border-radius:50%; background:var(--surface-sunken); color:var(--text-secondary); display:grid; place-items:center; font-size:12px; font-weight:700; flex:none; }
  .sh-stage[aria-current="true"] .sh-idx { background:var(--action-primary); color:var(--text-on-action); }
  .sh-stage .nm { font-size:13px; font-weight:600; flex:1; }
  .sh-bd { width:8px; height:8px; border-radius:50%; flex:none; }
  .sh-prog { height:3px; width:100%; border-radius:2px; background:var(--surface-sunken); overflow:hidden; }
  .sh-prog i { display:block; height:100%; background:var(--action-primary); }
  .sh-scroll { overflow-y:auto; min-height:0; }
  .sh-content { max-width:900px; width:100%; margin:0 auto; padding:16px 18px 32px; display:flex; flex-direction:column; gap:14px; }
  .sh-foot { position:sticky; bottom:0; z-index:30; display:flex; align-items:center; gap:10px; padding:12px 18px; padding-block-end:max(12px,env(safe-area-inset-bottom)); background:var(--surface-primary); border-block-start:1px solid var(--border-subtle); }
  .card { border:1px solid var(--border-subtle); border-radius:12px; background:var(--surface-primary); box-shadow:var(--shadow-card); padding:15px 16px; display:flex; flex-direction:column; gap:12px; }
  .fld-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .ie-opt { display:flex; align-items:center; gap:9px; flex:1 1 120px; padding:10px 13px; border:1.5px solid var(--border-input); border-radius:var(--radius-md); background:var(--surface-primary); cursor:pointer; font:inherit; min-height:44px; color:var(--text-primary); }
  .ie-opt[aria-pressed="true"]{ border-color:var(--action-primary); background:var(--accent-soft); }
  .ie-ind { width:18px; height:18px; border-radius:50%; border:2px solid var(--border-strong); flex:none; display:grid; place-items:center; }
  .ie-opt[aria-pressed="true"] .ie-ind{ border-color:var(--action-primary); background:var(--action-primary); }
  .swx { display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:12.5px; white-space:nowrap; }
  .swx input { appearance:none; -webkit-appearance:none; box-sizing:border-box; width:34px; min-width:34px; height:20px; margin:0; border:0; border-radius:999px; background:var(--border-strong); position:relative; cursor:pointer; transition:background .15s; flex:none; }
  .swx input:checked { background:var(--action-primary); }
  .swx input::after { content:""; position:absolute; top:2px; inset-inline-start:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:inset-inline-start .15s; }
  .swx input:checked::after { inset-inline-start:16px; }
  @media (min-width:1000px){
    .sh-body { grid-template-columns:248px 1fr; }
    .sh-nav { flex-direction:column; overflow-x:visible; overflow-y:auto; border-block-end:0; border-inline-end:1px solid var(--border-subtle); padding:14px; position:sticky; top:0; align-self:start; height:100%; }
    .sh-stage { min-width:0; width:100%; }
  }
</style>
<script src="./pwa-tabbar.js"></script>
</helmet>
<div class="sh-root" data-theme="{{ theme }}" dir="{{ dir }}" lang="{{ lang }}">

  <header class="sh-head">
    <button class="btn btn-icon btn-ghost" aria-label="{{ t.back }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:20px;height:20px;"><path d="m9 6 6 6-6 6"/></svg></button>
    <div style="flex:1; min-width:0; line-height:1.3;">
      <div style="font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ t.headerSub }} · <span class="id-code">VS-40219</span></div>
      <div class="sh-chips" style="display:flex; gap:6px; flex-wrap:wrap; margin-top:3px;">
        <span class="badge badge-info">{{ t.reportType }}</span>
        <span class="badge badge-onhold">{{ t.visitStatus }}</span>
        <span class="badge badge-warning"><span class="dot"></span>{{ t.opState }}</span>
        <span class="badge badge-pending"><span class="dot"></span>{{ syncChip }}</span>
        <sc-if value="{{ hasConflict }}" hint-placeholder-val="{{ false }}"><span class="badge badge-critical"><span class="dot"></span>{{ conflictChip }}</span></sc-if>
      </div>
    </div>
    <button class="sh-langbtn" onClick="{{ toggleOffline }}" aria-pressed="{{ offline }}">{{ onlineTgl }}</button>
    <button class="sh-langbtn" onClick="{{ toggleLang }}">{{ t.langBtnLabel }}</button>
    <button class="btn btn-icon btn-ghost" onClick="{{ toggleTheme }}" aria-label="{{ t.theme }}">
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:20px;height:20px;"><circle cx="12" cy="12" r="4.4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg></sc-if>
      <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:20px;height:20px;"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
    </button>
  </header>

  <div class="sh-body">
    <nav class="sh-nav" aria-label="{{ t.stagesLabel }}">
      <sc-for list="{{ stages }}" as="s" hint-placeholder-count="4">
        <button class="sh-stage" aria-current="{{ s.current }}" onClick="{{ s.go }}">
          <div class="row"><span class="sh-idx">{{ s.n }}</span><span class="nm">{{ s.title }}</span><span class="sh-bd" style="background:{{ s.dot }};"></span></div>
          <div class="sh-prog"><i style="width:{{ s.pct }}%;"></i></div>
        </button>
      </sc-for>
    </nav>

    <div class="sh-scroll">
      <div class="sh-content">{{ stageBody }}</div>
    </div>
  </div>

  <footer class="sh-foot">
    <span class="badge {{ submitBadgeClass }}"><span class="dot"></span>{{ footStatus }}</span>
    <span style="flex:1;"></span>
    <button class="btn btn-secondary" aria-disabled="{{ atFirst }}" style="{{ prevStyle }}" onClick="{{ onPrev }}">{{ t.prev }}</button>
    <button class="btn btn-secondary" onClick="{{ onSave }}">{{ t.save }}</button>
    <sc-if value="{{ atLast }}" hint-placeholder-val="{{ false }}">
      <button class="btn btn-primary" aria-disabled="{{ submitDisabled }}" style="{{ submitStyle }}" onClick="{{ onSubmit }}">{{ t.submit }}</button>
    </sc-if>
    <sc-if value="{{ notLast }}" hint-placeholder-val="{{ true }}">
      <button class="btn btn-primary" onClick="{{ onNext }}">{{ t.next }}</button>
    </sc-if>
  </footer>
</div>
</x-dc>

        h("div",{className:"card"},
          rec("summons",t.rSummons), rec("factfind",t.rFact), rec("violation",t.rViolation), rec("sample",t.rSample), rec("destruction",t.rDestruction),
          rec("seizure",t.rSeizure), rec("liftSeizure",t.rLift), rec("plClose",t.rPLClose), rec("facClose",t.rFacClose), rec("plReopen",t.rPLReopen), rec("facReopen",t.rFacReopen),
          rec("incident", ar?"رصد حادث أثناء الزيارة":"Mid-visit incident")),
        banner(t.reportTypeNote,"info"),
        banner(ar?"يمكن بدء تفتيش فوري (بدون إسناد مسبق) من «مهامي»، وتُقفل الحزمة كأي زيارة — انظر «التفتيش الفوري ورصد الحادث».":"An immediate inspection (no prior assignment) can be started from My Tasks; the package locks like any visit — see “Immediate inspection & incident”.","info"));
    }

    // Batch 6 hardening — offline + conflict banners prepended to every stage
    const hardening=[];
    if(st.offline) hardening.push(banner(t.offlineBanner,"warning"));
    if(st.conflicts>0) hardening.push(banner(t.conflictNote,"critical"));
    const bodyWrapped = hardening.length ? h(React.Fragment,null, ...hardening, body) : body;

    const atFirst=st.stage===0, atLast=st.stage===STAGES.length-1;
    const go=(i)=>this.setState({stage:i});

    return {
      theme:st.theme, isLight:st.theme==="light", isDark:st.theme==="dark",
      toggleTheme:()=>this.setState(s=>({theme:s.theme==="dark"?"light":"dark"})),
      lang:st.lang, dir:ar?"rtl":"ltr", toggleLang:()=>this.setState(s=>({lang:s.lang==="ar"?"en":"ar"})), t,
      stages: STAGES.map((s,i)=>({ n:String(i+1), title:s.title, pct:s.pct, dot:s.dot, current: i===st.stage ? "true":"false", go:()=>go(i) })),
      stageBody: bodyWrapped,
      offline:st.offline, toggleOffline:()=>this.setState(s=>({offline:!s.offline})),
      syncChip: t.syncChip.replace("{n}",st.syncPending), conflictCount: st.conflicts, hasConflict: st.conflicts>0,
      conflictChip: t.conflictChip.replace("{n}",st.conflicts), mode:t.mode, onlineTgl:t.onlineTgl,
      atFirst, atLast, notLast:!atLast,
      onPrev:()=>!atFirst&&go(st.stage-1), onNext:()=>!atLast&&go(st.stage+1), onSave:()=>{}, onSubmit:()=>{},
      prevStyle: atFirst?"opacity:.4; pointer-events:none;":"",
      submitDisabled: nBlock?"true":"false", submitStyle: nBlock?"opacity:.5; pointer-events:none;":"",
      footStatus: nBlock ? (t.blockersMini+" "+[unanswered.length?unanswered.length+" "+t.bU:null, evBlock.length?evBlock.length+" "+t.bE:null].filter(Boolean).join(" · ")) : t.ready,
      submitBadgeClass: nBlock?"badge-critical":"badge-completed",
    };
  }
}
</script>
