<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="saqeel/styles.css">
<style>
  html, body { height: 100%; margin: 0; }
  .lg-cam { position: absolute; inset: 0; }
  .lg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; transition: opacity 900ms ease; }
  .lg-fill { position: absolute; inset: 0; background: radial-gradient(135% 105% at 48% 33%, #0c2033 0%, #081521 56%, #050c14 100%); }
  .lg-warm { position: absolute; inset: 0; pointer-events: none; }
  [data-mode="light"] .lg-frame { background: #d9cdb4; }
  [data-mode="dark"]  .lg-frame { background: #0a0f18; }
  [data-mode="light"] .lg-warm { background: linear-gradient(160deg, rgba(208,172,112,.26), rgba(158,126,74,.14)); mix-blend-mode: multiply; }
  [data-mode="dark"]  .lg-warm { background: linear-gradient(160deg, rgba(150,96,34,.18), rgba(60,40,15,.10)); mix-blend-mode: soft-light; }
  .lg-poi { pointer-events: auto; cursor: pointer; }
  .lg-poi-dot { transition: transform 220ms cubic-bezier(.2,.8,.2,1); transform-box: fill-box; transform-origin: center; }
  .lg-poi:hover .lg-poi-dot { transform: translateY(-2.5px) scale(1.4); }
  @keyframes lg-ring  { 0% { r: 3.4; opacity: .8; } 100% { r: 9; opacity: 0; } }
  @keyframes lg-card  { from { opacity: 0; transform: translate(-50%, -104%) scale(.92); } to { opacity: 1; transform: translate(-50%, -110%) scale(1); } }
  @keyframes lg-cards-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .lg-scene-tab { transition: color 160ms, background 160ms, border-color 160ms; }
  @media (prefers-reduced-motion: reduce) { .lg-cam, .lg-drag, .lg-img, .lg-spot { transition: none !important; } }
</style>
</helmet>
<div dir="ltr" data-theme="light" style="height:100vh; display:grid; grid-template-columns:1fr minmax(360px, 452px); background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font-body); overflow:hidden;">

  <!-- ══ STORY / ATLAS HERO (always dark, full-bleed) ══ -->
  <section data-theme="dark" data-phase="{{ phaseId }}" data-mode="dark" dir="{{ dir }}" style="position:relative; min-width:0; overflow:hidden; background:#0a0f18; color:var(--text-primary);">
    <div style="position:absolute; inset:0;">
      <div class="lg-cam">
        <div class="lg-frame" style="position:absolute; inset:0;">
          <div class="lg-fill"></div>
          <img class="lg-img" src="saqeel/atlas/atlas-night.webp" alt="Saudi industrial inspection atlas" style="opacity:1; object-fit:contain; object-position:50% 50%;">
          <div class="lg-warm"></div>
        </div>
      </div>
    </div>

    <div style="position:absolute; inset-inline:0; top:0; height:118px; background:linear-gradient(to bottom, rgba(9,12,18,.7), transparent); pointer-events:none; z-index:4;"></div>

    <!-- brand wordmark -->
    <div style="position:absolute; top:24px; inset-inline-start:28px; z-index:6; display:flex; align-items:center; gap:11px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--action-primary)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:28px; height:28px; flex:none;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
      <span style="display:flex; align-items:baseline; gap:9px; color:#fff;"><span style="font-weight:700; font-size:18px; letter-spacing:.09em;">SAQEEL</span><span style="opacity:.45; font-weight:300; font-size:19px;">|</span><span lang="ar" style="font-weight:700; font-size:21px;">صقيل</span></span>
    </div>

    <!-- phase card — only on click, ≤1s -->
    <sc-if value="{{ cardOn }}" hint-placeholder-val="{{ false }}">
      <div dir="{{ dir }}" style="position:absolute; top:80px; inset-inline-start:28px; width:min(330px,60%); z-index:7; padding:14px 16px; border-radius:12px; border:1px solid var(--border-subtle); background:color-mix(in srgb, var(--surface-primary) 90%, transparent); backdrop-filter:blur(10px); box-shadow:var(--shadow-card); pointer-events:none; animation:lg-cards-in 200ms ease both;">
        <div style="display:flex; align-items:center; gap:8px; justify-content:{{ startJustify }};"><span style="font:700 11px var(--font-mono); color:var(--action-primary);">{{ activeNum }}</span><span class="t-label" style="color:var(--text-secondary);">{{ activeLabel }}</span></div>
        <div style="margin-block-start:8px; font-size:13px; line-height:1.6;">{{ activeDesc }}</div>
        <div style="margin-block-start:10px;"><span style="display:inline-flex; align-items:baseline; gap:5px; padding:3px 9px; border-radius:var(--radius-full); background:var(--accent-soft); color:var(--accent-text); font-size:11px; font-weight:600;"><b style="font-size:14px; font-variant-numeric:tabular-nums;">{{ activeCount }}</b> {{ activeMetric }}</span></div>
      </div>
    </sc-if>

    <!-- lifecycle rail -->
    <div dir="{{ dir }}" style="position:absolute; inset-inline:0; bottom:0; z-index:6; display:flex; gap:8px; padding:16px 18px 18px;">
      <sc-for list="{{ scenes }}" as="sc" hint-placeholder-count="5">
        <button onClick="{{ sc.pick }}" class="lg-scene-tab" aria-pressed="{{ sc.active }}" style="flex:1; display:flex; align-items:center; gap:8px; justify-content:center; padding:10px 8px; border-radius:var(--radius-md); border:1px solid {{ sc.border }}; background:{{ sc.bg }}; color:{{ sc.color }}; cursor:pointer; font:inherit;">
          <span style="font:700 10px var(--font-mono); opacity:.7;">{{ sc.num }}</span>
          <span style="font-size:12.5px; font-weight:600;">{{ sc.label }}</span>
        </button>
      </sc-for>
    </div>
  </section>

  <!-- ══ CREDENTIAL PANEL ══ -->
  <section data-theme="light" dir="{{ dir }}" style="position:relative; display:flex; flex-direction:column; padding:34px 40px; background:var(--surface-canvas); border-inline-start:1px solid var(--border-subtle); min-width:0; overflow-y:auto;">
    <div style="text-align:center;">
      <div style="font-weight:700; font-size:15px; color:var(--text-primary); letter-spacing:-0.005em;">{{ s.brandName }}</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 0 2px;">
      <div style="position:relative; display:grid; place-items:center;">
        <div style="position:absolute; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--action-primary) 18%, transparent), transparent 68%);"></div>
        <img src="saqeel/brand/ministry-mark.png" alt="{{ s.ministry }}" style="position:relative; height:88px; width:auto;">
      </div>
      <span lang="ar" style="font-weight:700; font-size:22px; color:var(--text-primary);">صقيل</span>
    </div>

    <div style="display:flex; flex-direction:column; max-width:360px; width:100%; margin:10px auto 0;">
      <h1 style="font-size:26px; font-weight:700; letter-spacing:-0.01em; margin:0;">{{ s.signIn }}</h1>
      <p style="font-size:13.5px; color:var(--text-secondary); margin:6px 0 18px;">{{ s.signInSub }}</p>

      <label class="t-label" style="display:block; margin-block-end:7px;">{{ s.email }}</label>
      <input class="input" type="email" value="inspector@mim.gov.sa" style="width:100%; margin-block-end:18px;">

      <label class="t-label" style="display:block; margin-block-end:7px;">{{ s.password }}</label>
      <div class="input-affix" style="width:100%; margin-block-end:18px; display:flex; align-items:center; gap:8px; padding:0 12px; min-height:40px; border:1px solid var(--border-input); border-radius:var(--radius-sm); background:var(--surface-primary);">
        <button onClick="{{ togglePw }}" aria-label="Show password" style="border:0; background:none; padding:0; cursor:pointer; color:var(--text-muted); display:grid; place-items:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:18px;height:18px;"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <input class="input" type="{{ pwType }}" value="inspection2026" style="border:0; padding-inline-start:6px; background:none;">
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-block-end:20px;">
        <label class="check" style="font-size:13px; color:var(--text-secondary);"><input type="checkbox">{{ s.remember }}</label>
        <a href="#" style="font-size:13px; color:var(--action-primary);">{{ s.forgot }}</a>
      </div>
      <button class="btn btn-primary btn-lg btn-block">{{ s.signIn }}</button>
    </div>

    <div style="margin-block-start:auto; border-block-start:1px solid var(--border-subtle); padding-block-start:16px;">
      <div style="display:flex; align-items:flex-start; gap:8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--action-primary)" stroke-width="1.6" style="width:16px;height:16px;flex:none;margin-block-start:1px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
        <div>
          <div style="font-size:11.5px; color:var(--text-secondary);">{{ s.trust }}</div>
          <div style="font-size:11.5px; color:var(--text-muted); margin-block-start:3px;">{{ s.noConfirm }}</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-block-start:16px;">
        <span style="font-size:11px; color:var(--text-muted);">{{ s.copyright }}</span>
        <button onClick="{{ toggleLocale }}" style="border:0; background:none; padding:0; cursor:pointer; font-size:13px; font-weight:600; color:var(--action-primary);">{{ s.langToggle }}</button>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;locale&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ar&quot;,&quot;en&quot;],&quot;default&quot;:&quot;ar&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Login&quot;}}">
class Component extends DCLogic {
  state = { locale: "ar", phase: 0, paused: false, showPw: false, cardOn: false };

  componentDidMount() {
    if (this.props.locale && this.props.locale !== this.state.locale) this.setState({ locale: this.props.locale });
  }
  componentWillUnmount() { clearTimeout(this._cardT); }

  renderVals() {
    const AR = this.state.locale === "ar";
    const S = {
      atlasTitle: AR ? "صقيل · التفتيش الصناعي" : "SAQEEL Industrial Inspection",
      atlasSub: AR ? "منصة التفتيش الصناعي · دورة حياة التفتيش من التخطيط إلى الإغلاق" : "Industrial inspection platform · the lifecycle from plan to close",
      brandName: AR ? "منصة التفتيش الصناعي" : "Industrial Inspection Platform",
      platform: AR ? "صقيل · منصة التفتيش الصناعي" : "SAQEEL · Industrial Inspection Platform",
      ministry: AR ? "وزارة الصناعة والثروة المعدنية" : "Ministry of Industry & Mineral Resources",
      remember: AR ? "تذكّرني" : "Remember me",
      signIn: AR ? "تسجيل الدخول" : "Sign in",
      signInSub: AR ? "ادخل بحسابك لمتابعة أعمال التفتيش الصناعي وإدارتها" : "Access your account to manage industrial inspection work.",
      email: AR ? "البريد الإلكتروني" : "Email",
      password: AR ? "كلمة المرور" : "Password",
      forgot: AR ? "هل نسيت كلمة المرور؟" : "Forgot your password?",
      trust: AR ? "كل إجراء داخل جلستك موثَّق ومراجَع · اتصال مشفَّر" : "Every action in your session is logged and reviewable · encrypted connection",
      noConfirm: AR ? "لحمايتك، لا نؤكد أبدًا وجود حساب من عدمه." : "For your protection, we never confirm whether an account exists.",
      copyright: AR ? "صقيل — وزارة الصناعة والثروة المعدنية © 2026" : "SAQEEL — Ministry of Industry & Mineral Resources © 2026",
      langToggle: AR ? "English" : "العربية",
      risk: AR ? "الخطر" : "Risk",
      complianceLabel: AR ? "الالتزام" : "Compliance",
      dragHint: AR ? "اسحب للتدوير · عجلة للتقريب" : "Drag to rotate · scroll to zoom",
    };

    // Lifecycle phases (real inspection process)
    const M = [
      ["01", AR ? "التخطيط" : "Plan", AR ? "إنشاء واستهداف الزيارات — مصنع مفرد أو تصفية جماعية عبر المملكة." : "Create & target visits — a single factory or a bulk filter across the Kingdom.", 221, AR ? "مخطّطة" : "planned"],
      ["02", AR ? "الجدولة" : "Schedule", AR ? "نشر الخطة وإسناد المفتّشين ضمن نافذة زمنية محكومة." : "Publish the plan and assign inspectors within a governed SLA window.", 264, AR ? "مجدولة" : "scheduled"],
      ["03", AR ? "التنفيذ" : "Execute", AR ? "التفتيش الميداني — قوائم الفحص والأدلة ودرجة الصحة." : "On-site inspection — checklist, evidence and Health score.", 318, AR ? "قيد التنفيذ" : "executing"],
      ["04", AR ? "المراجعة" : "Review", AR ? "اعتماد المُراجِع للنسخة غير القابلة للتعديل (صانع ≠ مُراجِع)." : "Maker-checker approval of the immutable submission.", 247, AR ? "قيد المراجعة" : "in review"],
      ["05", AR ? "الإغلاق" : "Close", AR ? "النتائج والإجراءات التصحيحية وإغلاق الحالة." : "Outcomes, corrective actions and case closure.", 198, AR ? "مُغلقة" : "closed"],
    ];
    const ids = ["plan", "schedule", "execute", "review", "close"], phase = this.state.phase;
    const scenes = M.map((m, i) => ({
      num: m[0], label: m[1], active: i === phase,
      bg: i === phase ? "var(--accent-soft)" : "transparent",
      border: i === phase ? "color-mix(in srgb, var(--action-primary) 45%, transparent)" : "var(--border-subtle)",
      color: i === phase ? "var(--accent-text)" : "var(--text-secondary)",
      pick: () => this.setState({ phase: i, paused: true, cardOn: true }),
    }));

    return {
      s: S,
      dir: AR ? "rtl" : "ltr",
      startJustify: AR ? "flex-end" : "flex-start",
      toggleLocale: () => this.setState(st => ({ locale: st.locale === "ar" ? "en" : "ar" })),
      pwType: this.state.showPw ? "text" : "password",
      togglePw: () => this.setState(st => ({ showPw: !st.showPw })),
      scenes, phaseId: ids[phase], cardOn: this.state.cardOn,
      activeNum: M[phase][0], activeLabel: M[phase][1], activeDesc: M[phase][2], activeCount: M[phase][3], activeMetric: M[phase][4],
    };
  }
}
</script>
</body>
</html>
