<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="saqeel/styles.css">
<style>
  html, body { height: 100%; margin: 0; }
  .rp-wrap { max-width: 900px; margin: 0 auto; padding: 18px 18px 130px; display:flex; flex-direction:column; gap:14px; }
  .rt-tabs { display:flex; gap:8px; flex-wrap:wrap; }
  .rt-tab { display:flex; flex-direction:column; gap:3px; align-items:flex-start; flex:1 1 190px; padding:12px 14px; border:1.5px solid var(--border-input); border-radius:var(--radius-md); background:var(--surface-primary); cursor:pointer; font:inherit; text-align:start; color:var(--text-primary); min-height:64px; }
  .rt-tab[aria-pressed="true"]{ border-color:var(--action-primary); background:var(--accent-soft); box-shadow:0 0 0 1px var(--action-primary) inset; }
  .rt-tab .k { font-size:12px; color:var(--text-secondary); letter-spacing:.02em; }
  .rt-tab .n { font-size:14.5px; font-weight:600; }
  .rp-acc { border:1px solid var(--border-subtle); border-radius:12px; background:var(--surface-primary); overflow:hidden; box-shadow:var(--shadow-card); }
  .rp-head { display:flex; align-items:center; gap:12px; width:100%; padding:15px 17px; border:0; background:none; cursor:pointer; font:inherit; text-align:start; color:var(--text-primary); }
  .rp-num { width:26px; height:26px; border-radius:50%; background:var(--accent-soft); color:var(--accent-text); display:grid; place-items:center; font-size:13px; font-weight:600; flex:none; }
  .rp-body { padding:8px 17px 20px; border-block-start:1px solid var(--border-subtle); display:flex; flex-direction:column; gap:16px; }
  .fld { display:flex; flex-direction:column; gap:5px; }
  .fld > span { font-size:13px; color:var(--text-secondary); }
  .req { color:var(--status-critical-text); }
  .fld-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .fld-row.three { grid-template-columns:1fr 1fr 1fr; }
  @media (max-width:600px){ .fld-row, .fld-row.three { grid-template-columns:1fr; } .rp-wrap { padding:14px 12px 130px; } }
  .rp-opt { display:flex; align-items:center; gap:9px; flex:1 1 150px; padding:11px 14px; border:1.5px solid var(--border-input); border-radius:var(--radius-md); background:var(--surface-primary); cursor:pointer; font:inherit; min-height:48px; color:var(--text-primary); }
  .rp-opt[aria-pressed="true"]{ border-color:var(--action-primary); background:var(--accent-soft); }
  .rp-ind { width:18px; height:18px; border-radius:50%; border:2px solid var(--border-strong); flex:none; display:grid; place-items:center; }
  .rp-opt[aria-pressed="true"] .rp-ind{ border-color:var(--action-primary); background:var(--action-primary); }
  .rp-radios { display:flex; gap:10px; flex-wrap:wrap; }
  .up-btn { display:inline-flex; align-items:center; gap:8px; padding:11px 15px; border:1.5px dashed var(--border-strong); border-radius:var(--radius-md); background:var(--surface-sunken); font:inherit; font-size:13px; cursor:pointer; color:var(--text-secondary); }
  .rp-langbtn { padding:7px 13px; border-radius:999px; border:1px solid var(--border-subtle); background:var(--surface-sunken); font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-secondary); }
  .it-tbl { width:100%; border-collapse:collapse; font-size:12.5px; }
  .it-tbl th, .it-tbl td { border:1px solid var(--border-subtle); padding:7px 9px; text-align:start; }
  .it-tbl th { background:var(--surface-sunken); font-weight:600; color:var(--text-secondary); white-space:nowrap; }
  .it-tbl td input { width:100%; border:0; background:none; font:inherit; color:var(--text-primary); }
  .it-del { border:0; background:none; cursor:pointer; color:var(--status-critical-text); padding:4px; }
  .doc { border:1px solid var(--border-subtle); border-radius:10px; background:var(--surface-primary); box-shadow:var(--shadow-card); overflow:hidden; }
  .doc-hd { padding:16px 20px; border-block-end:1px solid var(--border-subtle); display:flex; align-items:flex-start; gap:14px; }
  .doc-sec { padding:14px 20px; border-block-end:1px solid var(--border-subtle); }
  .doc-sec:last-child { border-block-end:0; }
  .doc-k { font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
  .doc-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; margin-top:8px; }
  .doc-grid .v { font-size:13.5px; font-weight:600; }
  .extract { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; background:var(--status-warning-soft); color:var(--status-warning-text); }
</style>
</helmet>
<div data-theme="{{ theme }}" dir="{{ dir }}" lang="{{ lang }}" style="min-height:100dvh; display:flex; flex-direction:column; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font-body);">

  <header style="position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:12px 18px; padding-block-start:max(12px,env(safe-area-inset-top)); background:var(--surface-primary); border-block-end:1px solid var(--border-subtle);">

    <span class="badge badge-info">{{ t.deltaTag }}</span>
    <button class="rp-langbtn" onClick="{{ toggleLang }}">{{ t.langBtnLabel }}</button>
    <button class="btn btn-icon btn-ghost" onClick="{{ toggleTheme }}" aria-label="{{ t.theme }}">
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:20px;height:20px;"><circle cx="12" cy="12" r="4.4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg></sc-if>
      <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:20px;height:20px;"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
    </button>
  </header>

  <input id="rd-filepick" type="file" accept="image/*,application/pdf" style="display:none">

  <div class="rp-wrap">
    <div style="display:flex; flex-direction:column; gap:5px;">
      <span class="doc-k">{{ t.selectorLabel }}</span>
      <p class="t-caption" style="margin:0;">{{ t.selectorHint }}</p>
    </div>
    <div class="rt-tabs">
      <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="4">
        <button class="rt-tab" aria-pressed="{{ tab.active }}" onClick="{{ tab.select }}"><span class="k">{{ tab.kicker }}</span><span class="n">{{ tab.name }}</span></button>
      </sc-for>
    </div>

    <div class="panel" style="padding:12px 15px; display:flex; align-items:flex-start; gap:10px; background:var(--status-info-soft); border-color:color-mix(in srgb,var(--status-info) 26%,transparent); box-shadow:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--status-info-text)" stroke-width="1.7" style="width:18px;height:18px;flex:none;margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
      <span class="t-compact" style="color:var(--status-info-text);">{{ t.flowNote }}</span>
    </div>

    <sc-if value="{{ isViewer }}" hint-placeholder-val="{{ false }}">
      <div class="doc">{{ viewerDoc }}</div>
    </sc-if>

    <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; flex-direction:column; gap:12px;">
        <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="5">
          <div class="rp-acc">
            <button class="rp-head" onClick="{{ sec.toggle }}" aria-expanded="{{ sec.open }}"><span class="rp-num">{{ sec.numDisp }}</span><span style="font-weight:600; font-size:15px; flex:1;">{{ sec.title }}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" style="width:18px;height:18px;flex:none;">{{ sec.chevron }}</svg></button>
            <sc-if value="{{ sec.open }}" hint-placeholder-val="{{ false }}"><div class="rp-body">{{ sec.body }}</div></sc-if>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div style="position:sticky; bottom:0; display:flex; align-items:center; gap:12px; padding:12px 18px; padding-block-end:max(12px,env(safe-area-inset-bottom)); background:var(--surface-primary); border-block-start:1px solid var(--border-subtle);">
    <span class="badge badge-warning"><span class="dot"></span>{{ t.pendingSync }}</span>
    <span class="grow" style="flex:1;"></span>
    <button class="btn btn-secondary">{{ t.saveDraft }}</button>
    <button class="btn btn-primary">{{ t.primaryAction }}</button>
  </div>
</div>
</x-dc>
