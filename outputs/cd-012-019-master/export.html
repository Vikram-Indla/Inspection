/* blocked health-inputs panel — placeholders, never numbers */
.wf-blocked{border:1.5px dashed color-mix(in srgb,var(--ax-color-critical) 45%,var(--ax-color-border));border-radius:var(--ax-radius-standard);background:color-mix(in srgb,var(--ax-color-critical) 4%,var(--ax-color-surface))}
.wf-blocked__head{display:flex;align-items:center;gap:8px;padding:var(--ax-space-150) var(--ax-space-200);border-block-end:1px dashed color-mix(in srgb,var(--ax-color-critical) 35%,var(--ax-color-border))}
.wf-blocked__head b{font:var(--ax-text-body-strong)}
.wf-blocked ul{list-style:none;margin:0;padding:var(--ax-space-150) var(--ax-space-200);display:flex;flex-direction:column;gap:var(--ax-space-100)}
.wf-blocked li{display:flex;flex-direction:column;gap:3px}
.wf-blocked__label{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wf-blocked__label span:first-child{font:var(--ax-text-body-strong)}
.wf-ph{font:var(--ax-text-caption);color:var(--ax-color-text-disabled);font-style:italic;text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ax-color-critical) 50%,transparent)}

/* separation-of-duties guard (maker-checker boundary) */
.wf-guard{display:flex;gap:10px;align-items:flex-start;padding:var(--ax-space-150) var(--ax-space-200);border-radius:var(--ax-radius-standard);background:var(--ax-color-critical-tint);border:1px solid color-mix(in srgb,var(--ax-color-critical) 40%,var(--ax-color-border))}
.wf-guard__g{font-size:16px;flex:none}
.wf-guard__t{display:flex;flex-direction:column;gap:2px;font:var(--ax-text-caption);line-height:1.5}
.wf-guard__t b{font:var(--ax-text-body-strong)}

/* mode switch (library / designer separation) */
.wf-mode{display:inline-flex;border:1px solid var(--ax-color-border);border-radius:var(--ax-radius-small);overflow:hidden}
.wf-mode a{padding:8px 16px;font:var(--ax-text-body-strong);color:var(--ax-color-text-secondary);text-decoration:none;background:var(--ax-color-surface)}
.wf-mode a[aria-current=page]{background:var(--ax-color-primary-tint);color:var(--ax-color-primary-strong)}
.wf-mode a+a{border-inline-start:1px solid var(--ax-color-border)}

/* in-frame fixture watermark (evidence exports) */
.wf-fixture{position:absolute;inset-block-start:0;inset-inline-end:0;font:var(--ax-text-micro);font-family:var(--ax-font-mono);letter-spacing:.08em;color:var(--ax-color-warning-strong);background:var(--ax-color-warning-tint);border:1px solid color-mix(in srgb,var(--ax-color-warning) 45%,var(--ax-color-border));border-start-end-radius:0;border-end-start-radius:var(--ax-radius-small);padding:4px 12px;z-index:5}

/* ============================ CDM master · CD-013…CD-019 ==================== */
/* generic two-pane workspace */
.m-split{display:grid;grid-template-columns:1.5fr 1fr;gap:var(--ax-space-300);align-items:start}
.w-tablet .m-split,.w-narrow .m-split{grid-template-columns:1fr}
.m-split3{display:grid;grid-template-columns:220px 1.5fr 1fr;gap:var(--ax-space-250);align-items:start}
.w-tablet .m-split3{grid-template-columns:1fr 1.4fr}
.w-narrow .m-split3{grid-template-columns:1fr}
.m-panel{padding:var(--ax-space-250);border:1px solid var(--ax-color-border);border-radius:var(--ax-radius-standard);background:var(--ax-color-surface);display:flex;flex-direction:column;gap:var(--ax-space-150)}
.m-panel__head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.m-panel__head h4{font:var(--ax-text-subheading)}
.m-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font:var(--ax-text-caption)}
.m-kv dt{color:var(--ax-color-text-secondary);font-family:var(--ax-font-mono);text-transform:uppercase;letter-spacing:.04em;font-size:10px;padding-block-start:2px}
.m-kv dd{margin:0;font-variant-numeric:tabular-nums}
.m-mono{font-family:var(--ax-font-mono);font-variant-numeric:tabular-nums;font-size:13px}
.m-num{font-variant-numeric:tabular-nums}

/* CD-013 · state-machine studio */
.dz-canvas{position:relative;min-block-size:340px;border:1px solid var(--ax-color-border);border-radius:var(--ax-radius-standard);background:var(--ax-color-surface-sunken);background-image:radial-gradient(color-mix(in srgb,var(--ax-color-border) 60%,transparent) 1px,transparent 1px);background-size:22px 22px;overflow:hidden}
.dz-node{position:absolute;min-inline-size:120px;padding:10px 14px;border:1.5px solid var(--ax-color-border-strong);border-radius:var(--ax-radius-standard);background:var(--ax-color-surface);display:flex;flex-direction:column;gap:2px;box-shadow:var(--ax-shadow-raised)}
.dz-node b{font:var(--ax-text-body-strong)}
.dz-node small{font:var(--ax-text-micro);font-family:var(--ax-font-mono);color:var(--ax-color-text-secondary)}
.dz-node--initial{border-color:var(--ax-color-primary)}
.dz-node--terminal{border-color:var(--ax-color-text-secondary);box-shadow:0 0 0 3px color-mix(in srgb,var(--ax-color-text-secondary) 22%,transparent)}
.dz-node--selected{border-color:var(--ax-color-primary);box-shadow:0 0 0 2px var(--ax-color-primary)}
.dz-node--invalid{border-color:var(--ax-color-critical);border-style:dashed;background:var(--ax-color-critical-tint)}
.dz-edges{position:absolute;inset:0;pointer-events:none}
.dz-edge{stroke:var(--ax-color-border-strong);stroke-width:1.8;fill:none;marker-end:url(#dzArrow)}
.dz-edge--invalid{stroke:var(--ax-color-critical);stroke-dasharray:5 4}
.dz-edge--replay{stroke:var(--ax-color-primary);stroke-width:2.5}
.dz-badge{position:absolute;font:var(--ax-text-micro);font-family:var(--ax-font-mono);padding:2px 7px;border-radius:6px;background:var(--ax-color-surface);border:1px solid var(--ax-color-border)}
.dz-step{display:grid;grid-template-columns:22px 1fr;gap:10px;padding-block:7px;font:var(--ax-text-caption);position:relative}
.dz-step__n{inline-size:20px;block-size:20px;border-radius:50%;background:var(--ax-color-primary-tint);color:var(--ax-color-primary-strong);display:grid;place-items:center;font:600 10px var(--ax-font-mono)}
.dz-step--fail .dz-step__n{background:var(--ax-color-critical-tint);color:var(--ax-color-critical-strong)}
.dz-step b{font:var(--ax-text-body-strong)}

/* CD-014 · risk reproducibility */
.rk-driver{display:grid;grid-template-columns:1fr 64px 1fr;gap:12px;align-items:center;padding-block:8px;border-block-end:1px solid var(--ax-color-border)}
.rk-driver:last-child{border-block-end:0}
.rk-driver__name{display:flex;flex-direction:column;gap:2px}
.rk-driver__name b{font:var(--ax-text-body-strong)}
.rk-w{font:600 15px var(--ax-font-mono);text-align:end}
.rk-bar{block-size:8px;border-radius:4px;background:var(--ax-color-neutral-weak);overflow:hidden;position:relative}
.rk-bar span{position:absolute;inset-block:0;inset-inline-start:0;background:var(--ax-color-primary);border-radius:4px}
.rk-bar--stale span{background:var(--ax-color-warning)}
.rk-bar--missing span{background:var(--ax-color-critical);inline-size:100%;opacity:.25}
.rk-band{display:flex;block-size:26px;border-radius:var(--ax-radius-small);overflow:hidden;font:600 10px var(--ax-font-mono);color:#fff}
.rk-band span{display:grid;place-items:center}
.rk-trace td:first-child{font-family:var(--ax-font-mono);font-size:12px}
.rk-score{font:600 44px/1 var(--ax-font-sans);font-variant-numeric:tabular-nums}
.rk-marker{position:relative}
.rk-marker::after{content:"";position:absolute;inset-block:-4px;inline-size:2px;background:var(--ax-color-text)}

/* CD-015 · GIS studio */
.gx-map{position:relative;min-block-size:360px;border:1px solid var(--ax-color-border);border-radius:var(--ax-radius-standard);overflow:hidden;background:repeating-linear-gradient(45deg,var(--ax-color-surface-sunken) 0 14px,color-mix(in srgb,var(--ax-color-border) 30%,var(--ax-color-surface-sunken)) 14px 28px)}
.gx-map__label{position:absolute;inset-block-start:50%;inset-inline-start:50%;transform:translate(-50%,-50%);font:11px var(--ax-font-mono);color:var(--ax-color-text-secondary);background:var(--ax-color-surface);border:1px dashed var(--ax-color-border-strong);border-radius:6px;padding:6px 12px;text-align:center}
[dir=rtl] .gx-map__label{transform:translate(50%,-50%)}
.gx-pt{position:absolute;inline-size:14px;block-size:14px;border-radius:50%;border:2.5px solid;transform:translate(-50%,-50%)}
.gx-pt--official{border-color:var(--ax-color-primary);background:var(--ax-color-primary-tint)}
.gx-pt--verified{border-color:var(--ax-color-success);background:var(--ax-color-success)}
.gx-poly{position:absolute;border:2px dashed var(--ax-color-info);border-radius:30% 55% 45% 40%;background:color-mix(in srgb,var(--ax-color-info) 8%,transparent)}
.gx-poly--invalid{border-color:var(--ax-color-critical);background:color-mix(in srgb,var(--ax-color-critical) 8%,transparent)}
.gx-layer{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--ax-radius-small);font:var(--ax-text-caption)}
.gx-layer:hover{background:var(--ax-color-surface-sunken)}
.gx-layer__sw{inline-size:14px;block-size:14px;border-radius:4px;flex:none;border:2px solid}
.gx-conf{display:flex;flex-direction:column}
.gx-conf__row{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;padding-block:7px;border-block-end:1px solid var(--ax-color-border);font:var(--ax-text-caption)}
.gx-conf__row:last-child{border-block-end:0}
.gx-conf__dot{inline-size:12px;block-size:12px;border-radius:50%;border:2.5px solid}

/* CD-016 · notification & SLA rules */
.nt-rule{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--ax-color-border);border-radius:var(--ax-radius-standard);background:var(--ax-color-surface)}
.nt-rule--expanded{border-color:var(--ax-color-primary)}
.nt-evt{font:600 11px var(--ax-font-mono);padding:4px 9px;border-radius:6px;background:var(--ax-color-primary-tint);color:var(--ax-color-primary-strong);white-space:nowrap}
.nt-tl{position:relative;block-size:74px;margin-block:8px}
.nt-tl__axis{position:absolute;inset-inline:0;inset-block-start:36px;block-size:2px;background:var(--ax-color-border-strong)}
.nt-tl__tick{position:absolute;inset-block-start:28px;inline-size:2px;block-size:18px;background:var(--ax-color-border-strong)}
.nt-tl__ev{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;font:10px var(--ax-font-mono);color:var(--ax-color-text-secondary);text-align:center}
[dir=rtl] .nt-tl__ev{transform:translateX(50%)}
.nt-tl__dot{inline-size:12px;block-size:12px;border-radius:50%;background:var(--ax-color-primary)}
.nt-tl__dot--warn{background:var(--ax-color-warning)}
.nt-tl__dot--crit{background:var(--ax-color-critical)}
.nt-tl__dot--off{background:transparent;border:2px dashed var(--ax-color-text-disabled)}
.nt-chan{display:inline-flex;align-items:center;gap:5px;font:var(--ax-text-micro);font-family:var(--ax-font-mono);padding:3px 8px;border-radius:6px;border:1px solid var(--ax-color-border);color:var(--ax-color-text-secondary)}
.nt-chan--blocked{border-style:dashed;color:var(--ax-color-critical-strong);text-decoration:line-through}

/* CD-017 · roles & permissions matrix */
.rp-matrix{border-collapse:collapse;inline-size:100%;font:var(--ax-text-caption)}
.rp-matrix th,.rp-matrix td{border:1px solid var(--ax-color-border);padding:8px 10px;text-align:center}
.rp-matrix th[scope=row]{text-align:start;font:var(--ax-text-body-strong);background:var(--ax-color-surface-sunken)}
.rp-matrix thead th{background:var(--ax-color-surface-sunken);font:var(--ax-text-micro);font-family:var(--ax-font-mono);text-transform:uppercase;letter-spacing:.04em}
.rp-cell--y{color:var(--ax-color-success-strong);font-weight:700}
.rp-cell--n{color:var(--ax-color-text-disabled)}
.rp-cell--scope{color:var(--ax-color-primary-strong);font-weight:600;font-family:var(--ax-font-mono);font-size:11px}
.rp-cell--conflict{background:var(--ax-color-critical-tint);color:var(--ax-color-critical-strong);font-weight:700}
.rp-cell--draft{outline:2px dashed var(--ax-color-warning);outline-offset:-3px}
.rp-sim{display:flex;flex-direction:column;gap:8px}
.rp-sim__verdict{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--ax-radius-standard);font:var(--ax-text-body-strong)}
.rp-sim__verdict--allow{background:var(--ax-color-success-tint);color:var(--ax-color-success-strong)}
.rp-sim__verdict--deny{background:var(--ax-color-critical-tint);color:var(--ax-color-critical-strong)}
.rp-why{display:grid;grid-template-columns:18px 1fr;gap:8px;font:var(--ax-text-caption);padding-block:5px;align-items:start}
.rp-why b{font:var(--ax-text-body-strong)}

/* CD-018 · localization studio */
.lz-row{display:grid;grid-template-columns:1fr 1fr 150px;gap:0;border:1px solid var(--ax-color-border);border-radius:var(--ax-radius-standard);overflow:hidden;background:var(--ax-color-surface)}
.w-narrow .lz-row{grid-template-columns:1fr}
.lz-cell{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-inline-size:0}
.lz-cell+.lz-cell{border-inline-start:1px solid var(--ax-color-border)}
.w-narrow .lz-cell+.lz-cell{border-inline-start:0;border-block-start:1px solid var(--ax-color-border)}
.lz-key{font:10px var(--ax-font-mono);color:var(--ax-color-text-secondary);letter-spacing:.02em;direction:ltr;text-align:start}
.lz-src{font:var(--ax-text-body)}
.lz-ar{font:var(--ax-text-body);font-family:var(--ax-font-arabic,inherit)}
.lz-ph{font:600 11px var(--ax-font-mono);padding:1px 5px;border-radius:4px;background:var(--ax-color-info-tint);color:var(--ax-color-primary-strong);direction:ltr;display:inline-block}
.lz-ph--err{background:var(--ax-color-critical-tint);color:var(--ax-color-critical-strong);text-decoration:line-through}
.lz-drift{background:var(--ax-color-warning-tint);border-radius:3px;padding-inline:2px}
.lz-risk{display:inline-flex;gap:5px;align-items:center;font:var(--ax-text-micro);font-family:var(--ax-font-mono);color:var(--ax-color-warning-strong)}
.lz-list{display:flex;flex-direction:column;gap:var(--ax-space-150)}

/* CD-019 · audit trail browser */
.au-stream{display:flex;flex-direction:column}
.au-ev{display:grid;grid-template-columns:150px 16px 1fr;gap:14px;padding-block:10px;position:relative;font:var(--ax-text-caption)}
.w-narrow .au-ev{grid-template-columns:16px 1fr}
.w-narrow .au-ev .au-ev__ts{display:none}
.au-ev__ts{font-family:var(--ax-font-mono);color:var(--ax-color-text-secondary);text-align:end;font-variant-numeric:tabular-nums;direction:ltr}
.au-ev__dot{inline-size:12px;block-size:12px;border-radius:50%;background:var(--ax-color-primary);margin-block-start:3px;z-index:1;justify-self:center}
.au-ev--config .au-ev__dot{background:var(--ax-color-info)}
.au-ev--critical .au-ev__dot{background:var(--ax-color-critical)}
.au-ev:not(:last-child)::after{content:"";position:absolute;inset-inline-start:169px;inset-block:20px -4px;inline-size:2px;background:var(--ax-color-border)}
[dir=rtl] .au-ev:not(:last-child)::after{inset-inline-start:auto;inset-inline-end:169px}
.w-narrow .au-ev:not(:last-child)::after{inset-inline-start:7px}
.au-ev__body{display:flex;flex-direction:column;gap:4px;min-inline-size:0}
.au-ev__t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.au-ev__t b{font:var(--ax-text-body-strong)}
.au-corr{font:600 10px var(--ax-font-mono);padding:2px 7px;border-radius:6px;background:var(--ax-color-surface-sunken);border:1px solid var(--ax-color-border);color:var(--ax-color-text-secondary);direction:ltr;display:inline-block}
.au-diff{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--ax-color-border);border-radius:var(--ax-radius-standard);overflow:hidden;font:12px var(--ax-font-mono)}
.w-narrow .au-diff{grid-template-columns:1fr}
.au-diff>div{padding:12px 14px;direction:ltr;text-align:left}
.au-diff__before{background:color-mix(in srgb,var(--ax-color-critical) 5%,var(--ax-color-surface))}
.au-diff__after{background:color-mix(in srgb,var(--ax-color-success) 5%,var(--ax-color-surface));border-inline-start:1px solid var(--ax-color-border)}
.au-diff del{background:var(--ax-color-critical-tint);text-decoration:line-through;color:var(--ax-color-critical-strong)}
.au-diff ins{background:var(--ax-color-success-tint);text-decoration:none;color:var(--ax-color-success-strong)}
.au-redact{display:inline-block;padding:1px 8px;border-radius:4px;background:var(--ax-color-neutral-weak);color:var(--ax-color-text-secondary);font:600 10px var(--ax-font-mono);letter-spacing:.14em}

html,body{margin:0;background:#05050b}
#frame{position:relative;margin:0}
#frame .wf-fixture{position:absolute;inset-block-start:0;inset-inline-end:0}
</style>
</head>
<body>
<div id="frame"></div>
<script src="cdm-common.js"></script>
<script src="cd12.js"></script>
<script src="cd12-register.js"></script>
<script src="cd13.js"></script>
<script src="cd14.js"></script>
<script src="cd15.js"></script>
<script src="cd16.js"></script>
<script src="cd17.js"></script>
<script src="cd18.js"></script>
<script src="cd19.js"></script>
<script>
(function(){
  var TARGET_W=900, TARGET_H=512;
  function setFrame(screen,state,lang,theme,w){
    screen=screen||'cd12'; lang=lang||'en'; theme=theme||'dark'; w=w||1440;
    var f=document.getElementById('frame');
    f.className='cd-body thm-'+theme;
    f.setAttribute('dir', lang==='ar'?'rtl':'ltr');
    f.setAttribute('lang', lang);
    f.style.transform='none'; f.style.width=w+'px';
    f.innerHTML='<div class="wf-fixture">DESIGN FIXTURE — NOT RUNTIME EVIDENCE</div>'+window.CDM.render(screen,state,lang);
    var h=f.scrollHeight;
    var s=Math.min(TARGET_W/w, TARGET_H/h, 1);
    f.style.transformOrigin='top left';
    f.style.transform='scale('+s+')';
    document.documentElement.style.width=Math.ceil(w*s)+'px';
    document.body.style.width=Math.ceil(w*s)+'px';
    document.documentElement.style.height=Math.ceil(h*s)+'px';
    document.body.style.height=Math.ceil(h*s)+'px';
    window.__frameMeta={screen:screen,state:state,lang:lang,theme:theme,designW:w,designH:h,scale:+s.toFixed(4),rasterW:Math.ceil(w*s),rasterH:Math.ceil(h*s)};
    document.title=screen+'_'+state+'_'+theme+'_'+lang+'_'+w;
    window.scrollTo(0,0);
    return window.__frameMeta;
  }
  window.setFrame=setFrame;
  window.smokeTest=function(){
    var out={}, C=window.CDM;
    Object.keys(C.screens).forEach(function(id){
      var s=C.screens[id];
      s.states.forEach(function(st){
        ['en','ar'].forEach(function(lg){
          try{ var h=C.render(id,st.id,lg); out[id+'/'+st.id+'/'+lg]=h.length>800?null:'SHORT '+h.length; }
          catch(e){ out[id+'/'+st.id+'/'+lg]='ERR '+e.message; }
        });
      });
    });
    var bad=Object.keys(out).filter(function(k){return out[k];}).map(function(k){return k+': '+out[k];});
    return bad.length?bad:'ALL PASS ('+Object.keys(out).length+' renders)';
  };
  var q=new URLSearchParams(location.search);
  setFrame(q.get('sc'), q.get('s'), q.get('l'), q.get('t'), q.get('w')?parseInt(q.get('w'),10):1440);
})();
</script>
</body>
