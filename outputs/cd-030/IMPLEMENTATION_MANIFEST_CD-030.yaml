  - HANDOFF_BLOCKED_ACCEPT        # no accept/merge action or authorization path; navigation-only
  - HANDOFF_BLOCKED_LINKED        # comparison source degradation shows unavailable, not empty
  - HANDOFF_BLOCKED_START_REVIEW_ATOMIC  # opening is read-only; StartReview.tsx startReview inserts review then separately sets inspection under_review — non-atomic
