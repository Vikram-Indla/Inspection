post_audit_corrections:
  - "Planner and ordinary Inspector are both source-authorized; Inspector self-assigns and enters the standard field start flow."
  - "Temporary identity accepts any available name/CR/licence/activity; region and city are optional."
  - "Planner window is explicit and ordered; Inspector is stamped start-now. No invented +8h duration."
  - "Creation is one SECURITY INVOKER transaction, not sequential client writes or a partial ledger."
  - "Retry is request-id idempotent replay, not resumable partial dispatch."
  - "Visit location persists on visits.planner_lat/planner_lng/visit_location_source and never overwrites official factory coordinates."
  - "The accepted D3 four-value urgency set is enforced in the server action and by a database CHECK; Other requires Notes."
  - "The Inspector field-start insert failure uses stable localized recovery copy, not raw database text."
  - "The obsolete cancel-unassigned design row was replaced by the source-required Inspector start handoff (M01-051)."

