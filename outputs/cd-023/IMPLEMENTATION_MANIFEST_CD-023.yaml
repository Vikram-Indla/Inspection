database_contract:
  rpc: public.create_immediate_visit
  security: SECURITY_INVOKER_RLS_ENFORCED
  atomicity: single_transaction
  idempotency: visits.creation_request_id + advisory_transaction_lock
  audit: append_only_row_audits + private.audit_immediate_attempt
  notification_truth:
    planner: one queued row with provider status; delivery not claimed
    inspector: none for self-assignment
  urgency_constraint_migration: 20260714060935_cd023_urgency_contract.sql
  urgency_constraint_live_state: APPLIED_LIVE_SPONSOR_CONFIRMED_SQL_EDITOR
  live_state_reason: >-
    Sponsor applied the exact 20260714060935 migration body to the linked project
    through Supabase SQL Editor on 2026-07-14. Focused runtime coverage then passed
    18/18 including crafted direct-RPC rejection. Linked CLI migration-history
    confirmation remains unavailable without SUPABASE_ACCESS_TOKEN/DB password.

