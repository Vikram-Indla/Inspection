<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="saqeel-tokens.css">
<link rel="stylesheet" href="saqeel-astryx.css">
<style>
.thm-dark{--ax-color-primary:#7C6CFF;--ax-color-primary-hover:#9487FF;--ax-color-canvas:#0A0A14;--ax-color-surface:#14141F;--ax-color-text:#EFEFF7;--ax-color-text-secondary:#9C9CB2;--ax-color-border:#26263A;--ax-color-success:#2DE08E;--ax-color-warning:#E8B84B;--ax-color-critical:#F0625D;--ax-color-info:#5AA7FA;--ax-color-shadow-base:#000000;--ax-color-inverse-text:#0B0B14;color-scheme:dark}
.thm-light{--ax-color-primary:#6B57F0;--ax-color-primary-hover:#5541D6;--ax-color-canvas:#F4F4FB;--ax-color-surface:#FFFFFF;--ax-color-text:#16161F;--ax-color-text-secondary:#56566B;--ax-color-border:#E2E2EC;--ax-color-success:#0F9F63;--ax-color-warning:#B26B00;--ax-color-critical:#CF3A38;--ax-color-info:#2E7FD4;--ax-color-shadow-base:#1A1A2E;--ax-color-inverse-text:#FFFFFF;color-scheme:light}
body{margin:0;background:#05050b}
.cd-body{background:var(--ax-color-canvas);color:var(--ax-color-text);font:var(--ax-text-body)}
:lang(ar) .cd-body,[dir=rtl] .cd-body{font-family:var(--ax-font-arabic)}
a{color:var(--ax-color-primary)}a:hover{color:var(--ax-color-primary-hover)}
/* harness */
.hn{position:sticky;top:0;z-index:200;background:#0c0c16;border-block-end:1px solid #26263a;color:#cfcfe2;font-family:var(--ax-font-mono)}
.hn__row{display:flex;align-items:center;gap:14px;padding:9px 16px;flex-wrap:wrap}
.hn__brand{font-weight:600;letter-spacing:.08em;color:#9487ff;font-size:12px;text-transform:uppercase}
.hn__sep{width:1px;align-self:stretch;background:#26263a}
.hn__group{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.hn__lab{color:#6f6f88;text-transform:uppercase;letter-spacing:.1em;font-size:10px}
.hn__btn{font:11px/1 var(--ax-font-mono);color:#cfcfe2;background:#14141f;border:1px solid #2c2c42;border-radius:6px;padding:7px 9px;cursor:pointer}
.hn__btn:hover{border-color:#4a4a6a;color:#fff}
.hn__btn[aria-pressed=true]{background:#7c6cff;border-color:#7c6cff;color:#0b0b14;font-weight:600}
.hn__sel{font:11px/1 var(--ax-font-mono);color:#cfcfe2;background:#14141f;border:1px solid #2c2c42;border-radius:6px;padding:8px 10px;max-width:340px}
.frameband{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#0f0f1c;color:#8f8fb0;font:11px/1.4 var(--ax-font-mono)}
.frameband b{color:#c9c4ff}
.stageframe{margin:0 auto;position:relative}
.w-desktop{max-inline-size:none}
.w-tablet{max-inline-size:1024px;border-inline:1px dashed #2c2c42}
.w-narrow{max-inline-size:412px;border-inline:1px dashed #2c2c42}
.ax-pagehead{backdrop-filter:none}
/* narrow drawer mirror (real shell @899px) */
.w-narrow .ax-shell,.w-narrow .ax-shell.is-collapsed{grid-template-columns:minmax(0,1fr)}
.w-narrow .ax-shell__nav{position:absolute;z-index:var(--ax-z-drawer);inset-block:0;inset-inline-start:0;inline-size:min(260px,88vw);block-size:100%;transform:translateX(-105%);transition:transform var(--ax-motion-standard);box-shadow:var(--ax-shadow-overlay);overflow:auto}
.w-narrow[dir=rtl] .ax-shell__nav{transform:translateX(105%)}
.w-narrow .ax-shell.is-drawer-open .ax-shell__nav{transform:translateX(0)}
.w-narrow .ax-shell__close{display:grid;place-items:center}
.w-narrow .ax-shell__collapse{display:none}
.w-narrow .ax-shell__menu{display:grid}
.w-narrow .ax-shell__backdrop{position:absolute;z-index:calc(var(--ax-z-drawer) - 1);inset:0;background:var(--ax-color-overlay);border:0;cursor:pointer;display:none}
.w-narrow .ax-shell.is-drawer-open .ax-shell__backdrop{display:block}
.w-narrow .ax-shell-account__identity{display:none}
.w-narrow .ax-content{padding:var(--ax-space-200)}
.cd-navsvg{width:20px;height:20px}
/* workspace */
.cd-ws{display:flex;flex-direction:column;gap:var(--ax-space-200)}
.cd-scopebar{padding:var(--ax-space-150) var(--ax-space-200)}
.cd-scopebar__row{display:flex;align-items:center;gap:var(--ax-space-150);flex-wrap:wrap}
.cd-scopebar__spring{flex:1}
.cd-chip{font:var(--ax-text-caption);display:inline-flex;gap:6px;align-items:baseline;padding:5px 10px;border-radius:var(--ax-radius-full);background:var(--ax-color-surface-sunken);border:1px solid var(--ax-color-border)}
.cd-chip__k{font:var(--ax-text-micro);text-transform:uppercase;letter-spacing:.05em;color:var(--ax-color-text-secondary)}
.cd-chip b{font-variant-numeric:tabular-nums;font-size:15px}
.cd-sampletag{margin-block-start:8px;font:var(--ax-text-micro);font-family:var(--ax-font-mono);letter-spacing:.08em;color:var(--ax-color-warning-strong);text-transform:uppercase}
.cd-lensswitch{align-self:flex-start}
.cd-filters{padding:var(--ax-space-200);display:flex;flex-wrap:wrap;gap:var(--ax-space-150);align-items:flex-end}
.cd-fl{display:flex;flex-direction:column;gap:4px}
.cd-fl__k{font:var(--ax-text-micro);text-transform:uppercase;letter-spacing:.04em;color:var(--ax-color-text-secondary)}
.cd-fl--search{flex:1;min-inline-size:220px}
.cd-fl--search .ax-input{inline-size:100%}
.cd-grid{display:grid;grid-template-columns:1fr 320px;gap:var(--ax-space-200);align-items:start}
.w-tablet .cd-grid,.w-narrow .cd-grid{grid-template-columns:1fr}
.cd-grid__main{display:flex;flex-direction:column;gap:var(--ax-space-200);min-inline-size:0}
.cd-grid__side{position:sticky;inset-block-start:var(--ax-space-200)}
.w-narrow .cd-grid__side,.w-tablet .cd-grid__side{position:static}
.cd-panelpad{padding:var(--ax-space-300)}
.cd-sectionhead{margin-block-end:var(--ax-space-150)}
.cd-sectionhead h3{font:var(--ax-text-heading)}
.cd-mono{font-family:var(--ax-font-mono);font-variant-numeric:tabular-nums}
.cd-sub{font:var(--ax-text-caption);color:var(--ax-color-text-secondary)}
.cd-warn{color:var(--ax-color-warning-strong)}
.cd-warn-soft{color:var(--ax-color-text-secondary)}
.cd-fname{font:var(--ax-text-body-strong)}
.cd-stack{display:flex;flex-direction:column;gap:var(--ax-space-100);flex:1}
/* table */
.cd-table th{white-space:nowrap}
.cd-row.is-focus{outline:2px solid var(--ax-color-primary);outline-offset:-2px;background:var(--ax-color-primary-tint)}
.cd-row.is-stale{background:var(--ax-color-warning-tint)}
.cd-elig{display:inline-block;font:var(--ax-text-micro);padding:2px 7px;border-radius:6px;border:1px solid transparent}
.cd-elig--success{background:var(--ax-color-success-tint);color:var(--ax-color-success-strong);border-color:color-mix(in srgb,var(--ax-color-success) 35%,transparent)}
.cd-elig--warning{background:var(--ax-color-warning-tint);color:var(--ax-color-warning-strong);border-color:color-mix(in srgb,var(--ax-color-warning) 40%,transparent)}
.cd-elig--critical{background:var(--ax-color-critical-tint);color:var(--ax-color-critical-strong);border-color:color-mix(in srgb,var(--ax-color-critical) 40%,transparent)}
.cd-elig--neutral{background:var(--ax-color-neutral-tint);color:var(--ax-color-text-secondary)}
.cd-loc{font-size:13px;color:var(--ax-color-success-strong)}
.cd-loc--no{color:var(--ax-color-warning-strong);font-size:11px}
/* spine */
.cd-spine{padding:var(--ax-space-250);display:flex;flex-direction:column;gap:var(--ax-space-150);border-inline-start:3px solid var(--ax-color-primary)}
.cd-spine.is-empty{border-inline-start-color:var(--ax-color-border-strong)}
.cd-spine__head{display:flex;gap:var(--ax-space-150);align-items:center}
.cd-spine__glyph{font-size:20px;color:var(--ax-color-primary)}
.cd-spine__id,.cd-spine__ids{font-family:var(--ax-font-mono);font-size:13px}
.cd-spine__ids{display:flex;flex-wrap:wrap;gap:6px}
.cd-spine__dl{display:flex;flex-direction:column;gap:6px;margin:0}
.cd-spine__dl>div{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cd-spine__dl dt{font:var(--ax-text-micro);text-transform:uppercase;letter-spacing:.04em;color:var(--ax-color-text-secondary)}
.cd-spine__dl dd{margin:0;text-align:end}
.cd-spine__row{display:flex;justify-content:space-between;gap:8px}
.cd-spine__allowed{display:flex;flex-direction:column;gap:6px;padding-block-start:var(--ax-space-100);border-block-start:1px solid var(--ax-color-border)}
.w100{inline-size:100%;justify-content:center}
/* bulk */
.cd-bulk{padding:var(--ax-space-250);display:flex;flex-direction:column;gap:var(--ax-space-150)}
.cd-bulk__stats{display:flex;flex-wrap:wrap;gap:var(--ax-space-100)}
.cd-stat{font:var(--ax-text-caption);padding:4px 10px;border-radius:var(--ax-radius-full);border:1px solid var(--ax-color-border);background:var(--ax-color-surface-sunken)}
.cd-stat b{font-size:14px;font-variant-numeric:tabular-nums}
.cd-stat--ok{border-color:color-mix(in srgb,var(--ax-color-success) 35%,transparent);color:var(--ax-color-success-strong)}
.cd-stat--bad{border-color:color-mix(in srgb,var(--ax-color-critical) 40%,transparent);color:var(--ax-color-critical-strong)}
.cd-bulk__actions{display:flex;flex-wrap:wrap;gap:var(--ax-space-100)}
.cd-bulk__verify{display:flex;flex-wrap:wrap;gap:var(--ax-space-200);font:var(--ax-text-caption)}
.cd-blockerlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--ax-space-100)}
.cd-blocker{display:flex;gap:var(--ax-space-150);align-items:flex-start;padding:var(--ax-space-150);border:1px solid var(--ax-color-border);border-radius:var(--ax-radius-standard)}
.cd-blocker--critical{border-color:color-mix(in srgb,var(--ax-color-critical) 40%,var(--ax-color-border));background:var(--ax-color-critical-tint)}
.cd-blocker--warning{border-color:color-mix(in srgb,var(--ax-color-warning) 45%,var(--ax-color-border));background:var(--ax-color-warning-tint)}
.cd-blocker__g{flex:none;font-size:15px}
/* ledger */
.cd-ledger{padding:var(--ax-space-250);display:flex;flex-direction:column;gap:var(--ax-space-150)}
.cd-ledger__summary{display:flex;gap:var(--ax-space-150);align-items:flex-start;padding:var(--ax-space-150);border-radius:var(--ax-radius-standard);background:var(--ax-color-surface-sunken)}
.cd-ledger__glyph{font-size:20px;color:var(--ax-color-warning-strong)}
.cd-out{font:var(--ax-text-micro);padding:3px 8px;border-radius:6px;white-space:nowrap}
.cd-out--ok{background:var(--ax-color-success-tint);color:var(--ax-color-success-strong)}
.cd-out--blocked{background:var(--ax-color-critical-tint);color:var(--ax-color-critical-strong)}
.cd-out--notif{background:var(--ax-color-warning-tint);color:var(--ax-color-warning-strong)}
/* map */
.cd-map{display:flex;flex-direction:column;gap:var(--ax-space-150)}
.cd-map__banner,.cd-map__legend{display:flex;gap:var(--ax-space-150);align-items:center;flex-wrap:wrap}
.cd-leg{font:var(--ax-text-caption);display:inline-flex;gap:5px;align-items:center}
.cd-leg__g{color:var(--ax-color-success-strong)}
.cd-leg__g--sel{color:var(--ax-color-primary)}
.cd-leg__g--no{color:var(--ax-color-warning-strong)}
.cd-map__canvas{position:relative;block-size:280px;border-radius:var(--ax-radius-standard);border:1px solid var(--ax-color-border);background:repeating-linear-gradient(45deg,var(--ax-color-surface-sunken),var(--ax-color-surface-sunken) 12px,var(--ax-color-surface) 12px,var(--ax-color-surface) 24px);overflow:hidden}
.cd-map__canvas.is-fail{background:var(--ax-color-surface-sunken)}
.cd-pin{position:absolute;font-size:16px;color:var(--ax-color-info)}
.cd-pin.is-sel{color:var(--ax-color-primary);font-size:22px}
.cd-pin__lab{font:9px/1 var(--ax-font-mono);display:block}
.cd-map__attr{position:absolute;inset-block-end:4px;inset-inline-end:8px;font:var(--ax-text-micro);color:var(--ax-color-text-secondary)}
.cd-map__fail,.cd-map__nocoord{position:absolute;inset-inline-start:12px;inset-block-start:12px;font:var(--ax-text-caption);background:var(--ax-color-surface);padding:6px 10px;border-radius:8px;border:1px solid var(--ax-color-border)}
.cd-map--blocked .cd-map__canvas{display:none}
/* calendar */
.cd-cal__head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--ax-space-150);margin-block-end:var(--ax-space-150)}
.cd-cal__nav{display:flex;gap:6px;align-items:center}
.cd-cal__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cd-cal__dow{font:var(--ax-text-micro);text-transform:uppercase;text-align:center;color:var(--ax-color-text-secondary);padding:4px}
.cd-cal__cell{min-block-size:84px;border:1px solid var(--ax-color-border);border-radius:var(--ax-radius-small);padding:4px;display:flex;flex-direction:column;gap:2px;background:var(--ax-color-surface)}
.cd-cal__cell.is-out{opacity:.5;background:var(--ax-color-surface-sunken)}
.cd-cal__num{align-self:flex-end;font-size:11px;color:var(--ax-color-text-secondary)}
.cd-cal__chip{font:10px/1.3 var(--ax-font-mono);padding:1px 4px;border-radius:4px;background:var(--ax-color-primary-tint);color:var(--ax-color-text);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cd-cal__chip.is-sel{outline:2px solid var(--ax-color-primary);font-weight:600}
/* workload bar */
.cd-wl{block-size:8px;border-radius:var(--ax-radius-full);background:var(--ax-color-neutral-tint);inline-size:100%}
.cd-wl__bar{block-size:8px;border-radius:var(--ax-radius-full);background:var(--ax-color-info)}
/* state panel */
.cd-statepanel{display:flex;gap:var(--ax-space-300);flex-wrap:wrap;align-items:center}
.cd-statepanel__col{display:flex;flex-direction:column;gap:4px}
/* result blocks */
.cd-result__row{display:flex;gap:var(--ax-space-200);align-items:flex-start}
.cd-result__icon{inline-size:44px;block-size:44px;border-radius:var(--ax-radius-full);display:grid;place-items:center;font-size:20px;flex:none}
.cd-result__icon--neutral{background:var(--ax-color-neutral-tint);color:var(--ax-color-text-secondary)}
.cd-result__icon--critical{background:var(--ax-color-critical-tint);color:var(--ax-color-critical-strong)}
.cd-result__icon--warning{background:var(--ax-color-warning-tint);color:var(--ax-color-warning-strong)}
.cd-result h3{font:var(--ax-text-heading)}
/* tags */
.cd-tag{display:inline-block;font:var(--ax-text-micro);font-family:var(--ax-font-mono);padding:3px 8px;border-radius:6px;letter-spacing:.03em}
.cd-tag--blocked{background:var(--ax-color-critical-tint);color:var(--ax-color-critical-strong);border:1px solid color-mix(in srgb,var(--ax-color-critical) 40%,transparent)}
.cd-tag--ok{background:var(--ax-color-success-tint);color:var(--ax-color-success-strong)}
.cd-tag--warn{background:var(--ax-color-warning-tint);color:var(--ax-color-warning-strong)}
.cd-rm *{transition:none!important;animation:none!important}
.cd-hypbadge{display:flex;gap:8px;align-items:center;font:var(--ax-text-body-strong);padding-block-end:4px}
.cd-revealhdr{padding:8px 0}
/* annotation */
.cd-annot{max-inline-size:1000px;margin:0 auto;padding:var(--ax-space-600) var(--ax-space-400);display:flex;flex-direction:column;gap:var(--ax-space-300)}
.cd-annot h2{font:var(--ax-text-title)}
.cd-annot h3{font:var(--ax-text-heading);margin-block-start:var(--ax-space-200)}
.cd-annot p,.cd-annot li{font:var(--ax-text-body)}
.cd-annot__lead{color:var(--ax-color-text-secondary)}
.cd-annot code{font-family:var(--ax-font-mono);font-size:13px;background:var(--ax-color-surface-sunken);padding:1px 6px;border-radius:5px;border:1px solid var(--ax-color-border)}
.cd-annot ol,.cd-annot ul{margin:0;padding-inline-start:var(--ax-space-300);display:flex;flex-direction:column;gap:var(--ax-space-100)}
.cd-matrix{inline-size:100%;border-collapse:collapse;font:var(--ax-text-caption)}
.cd-matrix th,.cd-matrix td{text-align:start;padding:var(--ax-space-100) var(--ax-space-150);border:1px solid var(--ax-color-border);vertical-align:top}
.cd-matrix th{background:var(--ax-color-surface-sunken);font:var(--ax-text-micro);text-transform:uppercase;color:var(--ax-color-text-secondary)}
.cd-hypgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--ax-space-200)}
.cd-hypcard{display:flex;flex-direction:column;gap:8px;padding:var(--ax-space-300);border:1px solid var(--ax-color-border);border-radius:var(--ax-radius-large)}
.cd-hypcard.is-selected{border-color:var(--ax-color-primary);box-shadow:0 0 0 1px var(--ax-color-primary)}
/* hypothesis schematics — genuinely different IA compositions (P1-02) */
.cd-hyp-sch{border:1px solid var(--ax-color-border);border-radius:var(--ax-radius-large);padding:var(--ax-space-250);background:var(--ax-color-surface);display:flex;flex-direction:column;gap:var(--ax-space-150)}
.cd-hyp-sch__tag{display:flex;gap:10px;align-items:center}
.cd-hyp-sch__frame{border:1px dashed var(--ax-color-border-strong);border-radius:var(--ax-radius-standard);padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--ax-color-canvas)}
.cd-zrow{display:flex;gap:8px}
.cd-z{border:1px solid var(--ax-color-border);border-radius:8px;padding:10px 12px;font:var(--ax-text-caption);background:var(--ax-color-surface);display:flex;flex-direction:column;gap:4px;min-block-size:38px;justify-content:center}
.cd-z small{font:var(--ax-text-micro);color:var(--ax-color-text-secondary);text-transform:uppercase;letter-spacing:.04em}
.cd-z--head{background:var(--ax-color-surface-sunken)}
.cd-z--primary{border-color:var(--ax-color-primary);box-shadow:inset 0 0 0 1px var(--ax-color-primary);background:var(--ax-color-primary-tint)}
.cd-z--spine{border-inline-start:3px solid var(--ax-color-primary)}
.cd-z--queue{border-inline-start:3px solid var(--ax-color-warning-strong);background:var(--ax-color-warning-tint)}
.cd-z--sched{border-inline-start:3px solid var(--ax-color-info)}
.cd-z--muted{opacity:.7}
.cd-grow1{flex:1}.cd-grow2{flex:2}.cd-grow3{flex:3}
.cd-skip{position:absolute;inset-inline-start:8px;inset-block-start:-40px;background:var(--ax-color-primary);color:var(--ax-color-inverse-text);padding:8px 14px;border-radius:8px;z-index:60;transition:inset-block-start .12s}
.cd-skip:focus{inset-block-start:8px}
/* CD-027 Visit Detail */
.cd-detail{display:flex;flex-direction:column;gap:var(--ax-space-250)}
.cd-mono{font-family:var(--ax-font-mono);font-variant-numeric:tabular-nums}
.cd-sub{font:var(--ax-text-caption);color:var(--ax-color-text-secondary)}
.cd-warn{color:var(--ax-color-warning-strong)}
.cd-stack{display:flex;flex-direction:column;gap:var(--ax-space-100);flex:1}
.cd-identity{display:flex;flex-direction:column;gap:6px}
.cd-identity__row{display:flex;align-items:center;gap:var(--ax-space-150);flex-wrap:wrap}
.cd-identity__id{font:var(--ax-text-title);font-family:var(--ax-font-mono);margin:0}
.cd-identity__meta{font:var(--ax-text-body)}
.cd-identity__scope{font:var(--ax-text-caption);display:flex;gap:8px;align-items:center}
.cd-sampletag{font:var(--ax-text-micro);font-family:var(--ax-font-mono);letter-spacing:.06em;color:var(--ax-color-warning-strong);text-transform:uppercase}
.cd-ribbon{padding:var(--ax-space-250)}
.cd-ribbon__tracks{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--ax-space-150);margin-block-start:var(--ax-space-150)}
.w-narrow .cd-ribbon__tracks,.w-tablet .cd-ribbon__tracks{grid-template-columns:1fr}
.cd-track{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:start;padding:var(--ax-space-150);border:1px solid var(--ax-color-border);border-radius:var(--ax-radius-standard);background:var(--ax-color-surface);cursor:pointer}
.cd-track.is-active{border-color:var(--ax-color-primary);box-shadow:inset 0 0 0 1px var(--ax-color-primary)}
.cd-track__label{font:var(--ax-text-micro);text-transform:uppercase;letter-spacing:.06em;color:var(--ax-color-text-secondary)}
.cd-track__meta,.cd-track__own{font:var(--ax-text-micro);color:var(--ax-color-text-secondary)}
.cd-track__own{padding-block-start:4px;border-block-start:1px solid var(--ax-color-border);inline-size:100%}
.cd-sectionhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-block-end:6px}
.cd-sectionhead h3{font:var(--ax-text-heading)}

      pageTitle:T['page.title'], pageContext:T['page.context'],
      shellMod:(S.collapsed?'is-collapsed':'')+(S.drawerOpen?' is-drawer-open':''),
