signature_interaction:
  name: Spatial Case Timeline
  links: [registered-location-context, inspection-events, evidence/document-availability, findings/actions, review-decisions, risk-version-observations]
  properties: [source-labelled, list-equivalent, keyboard-operable, non-color-only, reduced-motion-safe, never-fabricated-spatial-path-or-causal-link]
  r2_truth_correction: "Timeline is built only from facts the route reads (identity, current risk version, visits/inspections, findings/actions, review status, document-metadata availability). Evidence events and risk-version HISTORY are NOT live-sourced; both are explicit unavailable rows (HANDOFF_BLOCKED_EVIDENCE_TIMELINE / HANDOFF_BLOCKED_RISK_HISTORY)."

binding_runtime_truth:
  - identity: "factories row read-only from source: code, name, CR, licence, region, city, activity, official_lat/lng, source, source_synced_at, geofence_radius_m."
  - risk: "risk_score/band/version read; recomputable per engine_settings.risk; NO driver breakdown or recalculation action exposed."
  - history: "visits -> inspections -> submission_versions, violations+violation_codes, action_forms, reviews joined; sorted by window_start."
  - sections: "documents, representatives, products, materials are separate queries with per-section error isolation."
  - documents: "metadata + storage_path only (storage_path null from this surface); no signed URL/viewer/custody retrieval."
  - controls: "add document/representative/product/material + representative activation exist; product/material writes RLS-restricted to planner/ops/compliance_admin (0017)."

handoff_blocked:
  - HANDOFF_BLOCKED_RISK_DRIVERS       # no risk-driver breakdown or recalculation action
  - HANDOFF_BLOCKED_RISK_HISTORY       # only the current risk version is read; no historical risk observations
  - HANDOFF_BLOCKED_EVIDENCE_TIMELINE  # no inspection-evidence query/derivation on this route
  - HANDOFF_BLOCKED_MAP                # no map provider proven
  - HANDOFF_BLOCKED_BOUNDARY           # no authoritative boundary polygon
  - HANDOFF_BLOCKED_COORDINATE_CONFLICT # no coordinate-conflict resolution path
  - HANDOFF_BLOCKED_DOCUMENT_VIEWER    # no signed URL/viewer/custody retrieval
  - HANDOFF_BLOCKED_ROLE               # leadership aggregation/edit, contact privacy, doc custody/visibility unproven
  - HANDOFF_BLOCKED_BASELINE

scope_separation:
  - CD-031 reads the factory dossier; invents no aggregate lifecycle, causal link, map authority or role permission
  - shell frozen (CD-020..031); Factory 360 current in Command group

hypotheses:
  - {id: A, name: Provenance-first, selected: true}
  - {id: B, name: Case-timeline-first, selected: false}
  - {id: C, name: Decision-context-first, selected: false}
