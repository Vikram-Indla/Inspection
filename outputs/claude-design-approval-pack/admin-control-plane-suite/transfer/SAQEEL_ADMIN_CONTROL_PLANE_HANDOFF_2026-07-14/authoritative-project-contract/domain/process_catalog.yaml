version: '1.0'
gate: G2
status: PASS
phases:
- id: P00
  title: Pre-Day-0 Configuration
  owner: Compliance Admin
  channel: Admin Portal
  modules: M09
  purpose: Make the platform executable before any inspection exists.
  actions:
  - Configure regulations, inspection items and response meanings
  - Configure evidence, violations, penalties and action triggers
  - Configure workflow, roles, notifications, SLA, risk inputs and GIS policies
  - Validate dependencies, publish and lock effective versions
  outputs:
  - Published configuration versions
  - Approved package catalogue
  - Active workflow and reference data
  - Audit and impact record
  engines:
  - ENG-01
  - ENG-02
  - ENG-03
  - ENG-04
  - ENG-06
  - ENG-08
  - ENG-11
  - ENG-12
  states: Draft -> Validated -> Approved -> Published -> Locked
  failures:
  - Missing dependency blocks publish
  - Invalid effective dates block publish
  - Runtime may not consume draft configuration
- id: P01
  title: Targeting & Planning Method
  owner: Planner
  channel: Web Portal
  modules: M01
  purpose: Decide which factories require inspection and how the planning activity
    begins.
  actions:
  - Choose Bulk, Single or Immediate planning
  - Build AND/OR criteria or locate a specific factory
  - Review eligibility, risk context and Factory 360 summary
  - Select the exact target set
  outputs:
  - Planning method
  - Validated criteria
  - Selected factory set
  - Immediate-visit minimum data
  engines:
  - ENG-04
  - ENG-06
  - ENG-12
  states: Initiated -> Criteria Built -> Targets Retrieved -> Targets Selected
  failures:
  - No matching factory
  - Duplicate or ineligible target
  - Unregistered immediate factory requires controlled minimum capture
- id: P02
  title: Visit Design & Assignment
  owner: Planner
  channel: Web Portal
  modules: M01
  purpose: Convert selected targets into executable visits with the correct scope
    and resources.
  actions:
  - Select business visit type and inspection package
  - Set visit window, priority, mode eligibility and notes
  - Assign inspector automatically or manually
  - Validate availability, capacity, location and conflicts
  outputs:
  - Configured visit plan
  - Individual Visit IDs
  - Inspector/team assignment
  - Conflict/override record
  engines:
  - ENG-02
  - ENG-03
  - ENG-05
  - ENG-06
  - ENG-11
  - ENG-12
  states: Targets Selected -> Configured -> Assigned -> Ready to Publish
  failures:
  - Missing package
  - No eligible inspector
  - Scheduling or workload conflict
  - Invalid location
- id: P03
  title: Publish & Operational Management
  owner: Planner / Operations
  channel: Web Portal
  modules: M01/M02/M08
  purpose: Activate the plan, notify participants and keep visits operationally governable.
  actions:
  - Review plan completeness and publish
  - Create plan and visit records with stable IDs
  - Notify assigned inspectors and stakeholders
  - Search, edit allowed fields, reschedule, reassign, cancel, return/republish or
    expire
  outputs:
  - Published Visit Plan
  - Active Visits
  - Notification and audit events
  - Managed operational lifecycle
  engines:
  - ENG-03
  - ENG-05
  - ENG-11
  - ENG-12
  states: Ready to Publish -> Published -> Active / Returned / Cancelled / Expired
  failures:
  - Partial publish prohibited
  - Cancellation requires reason
  - Automatic expiry must be rule-driven
  - Bulk action reports per-row failures
- id: P04
  title: Inspector Startup Pack
  owner: Inspector
  channel: iPad
  modules: M03
  purpose: Ensure the inspector has everything needed before travel or virtual execution.
  actions:
  - Review assignment, agenda, factory and visit card
  - Resolve exact package version and download encrypted offline content
  - Review Factory 360, prior findings, contacts, map and documents
  - Validate device, battery, storage, network, GPS and execution eligibility
  outputs:
  - Validated startup pack
  - Offline-ready package
  - Readiness result
  - Return-assignment record if unable to proceed
  engines:
  - ENG-02
  - ENG-06
  - ENG-10
  - ENG-11
  - ENG-12
  states: Assigned -> Preparing -> Ready / Returned
  failures:
  - Package unavailable or invalid
  - Insufficient device readiness
  - Wrong execution mode
  - Assignment returned with reason
- id: P05
  title: Execution Mode Gate
  owner: Inspector / System
  channel: iPad / Virtual
  modules: M03/M04/M05
  purpose: Route the visit into a valid physical or virtual execution path.
  actions:
  - Evaluate approved execution mode rules
  - Confirm physical or virtual prerequisites
  - Block invalid mode and explain reason
  - Create the correct journey or session context
  outputs:
  - Physical Journey Session or Virtual Session
  - Eligibility result
  - Mode decision audit
  engines:
  - ENG-03
  - ENG-06
  - ENG-10
  - ENG-12
  states: Ready -> Physical Path / Virtual Path / Blocked
  failures:
  - Mode not eligible
  - Appointment not valid
  - Mandatory prerequisites not met
- id: P06A
  title: Physical Journey & Check-In
  owner: Inspector / Operations
  channel: iPad + Operations
  modules: M04/M08
  purpose: Prove the inspector travelled to the correct factory and started execution
    lawfully.
  actions:
  - Start journey and route guidance
  - Track ETA, distance, GPS accuracy and route deviation
  - Detect arrival and compare official vs observed location
  - Complete geofence check-in or governed override
  outputs:
  - Journey Session
  - Telemetry history
  - Arrival and Check-In Event
  - Exception/override record
  engines:
  - ENG-03
  - ENG-06
  - ENG-10
  - ENG-11
  - ENG-12
  states: Ready -> On Journey -> Arrived -> Checked-In -> Start Allowed
  failures:
  - Poor GPS accuracy
  - Route deviation
  - Factory unavailable or access denied
  - Override requires permission, evidence and reason
- id: P06B
  title: Virtual Session & Verification
  owner: Inspector / Factory Representative
  channel: Virtual Session
  modules: M05
  purpose: Create a governed remote inspection session with verified participants
    and traceable evidence.
  actions:
  - Open scheduled appointment and secure session
  - Record participant join and session timestamps
  - Perform identity and OTP verification where configured
  - Run device/network readiness and begin remote inspection
  outputs:
  - Verified session
  - Participant and OTP records
  - Readiness result
  - Remote inspection context
  engines:
  - ENG-03
  - ENG-07
  - ENG-11
  - ENG-12
  states: Scheduled -> Waiting -> Joined -> Verified -> In Progress
  failures:
  - Identity/OTP failure
  - Participant absent
  - Poor connection or device failure
  - Physical follow-up required when evidence is insufficient
- id: P07
  title: Inspection Execution
  owner: Inspector
  channel: iPad / Virtual
  modules: M04/M05/M09
  purpose: Execute the configured inspection package consistently in physical or virtual
    mode.
  actions:
  - Verify factory and representative context
  - Complete dynamic report and checklist sections
  - Apply required, optional and conditional rules
  - Autosave progress and expose mandatory blockers
  outputs:
  - Inspection Session
  - Report and checklist responses
  - Progress and validation status
  - Observation records
  engines:
  - ENG-01
  - ENG-02
  - ENG-03
  - ENG-07
  - ENG-10
  - ENG-12
  states: Start Allowed -> In Progress -> Ready for Validation
  failures:
  - Mandatory response missing
  - Package/configuration version mismatch
  - Offline interruption and recovery
  - Unable-to-execute exception
- id: P08
  title: Evidence, Findings, Violations & Actions
  owner: Inspector / System
  channel: iPad / Virtual
  modules: M04/M05/M09
  purpose: Turn observations into defensible, evidence-linked compliance outcomes.
  actions:
  - Capture photo, video, document, note or remote evidence
  - Link evidence to exact item, finding and location where applicable
  - Evaluate configured violation and penalty mapping
  - Create required corrective/action forms with owner and due date
  outputs:
  - Evidence chain
  - Findings and violation records
  - Penalty context
  - Action forms and blockers
  engines:
  - ENG-01
  - ENG-02
  - ENG-06
  - ENG-07
  - ENG-08
  - ENG-12
  states: Observation -> Evidence Linked -> Finding -> Violation/Action
  failures:
  - Loose/unlinked evidence rejected
  - Required evidence blocks completion
  - Action form incomplete
  - Violation mapping unresolved
- id: P09
  title: Submission & Immutable Version
  owner: Inspector / System
  channel: iPad / Virtual
  modules: M04/M05
  purpose: Finalize a complete inspection package without partial or ambiguous state.
  actions:
  - Run pre-submit validation
  - Capture acknowledgement/signature where approved
  - Create structured report and submission identity
  - Create immutable submitted version and route to review
  outputs:
  - Submitted Inspection Version
  - Evidence manifest
  - Report/submission ID
  - Review task and notification
  engines:
  - ENG-03
  - ENG-07
  - ENG-09
  - ENG-10
  - ENG-11
  - ENG-12
  states: Ready for Validation -> Validated -> Submitted -> Locked
  failures:
  - Incomplete package remains unsubmitted
  - Network retry must be idempotent
  - No partial finalization
  - Submitted version cannot be edited
- id: P10
  title: Level 2 Review & Decision
  owner: Level 2 Reviewer
  channel: Web Portal
  modules: M06
  purpose: Review the exact submitted version and make an auditable MVP1 decision.
  actions:
  - Open review queue and immutable submission
  - Review report, checklist, evidence, violations and actions
  - Record mandatory decision note
  - Approve, return or reject under allowed workflow
  outputs:
  - Review Decision
  - Reviewer comments
  - Return scope or final outcome
  - Notification and audit
  engines:
  - ENG-03
  - ENG-07
  - ENG-09
  - ENG-11
  - ENG-12
  states: Submitted -> Under Review -> Approved / Returned / Rejected
  failures:
  - Unauthorized decision blocked
  - Decision note mandatory
  - Submitted content remains read-only
  - No formal objection/appeal in MVP1
- id: P11
  title: Return, Correction & Resubmission
  owner: Inspector / Reviewer
  channel: iPad + Web
  modules: M06
  purpose: Correct only the requested scope while preserving the original submitted
    record.
  actions:
  - Reviewer identifies exact returned sections and reason
  - System unlocks only those sections
  - Inspector corrects responses/evidence/actions
  - Resubmission creates Version N+1 and reviewer compares changes
  outputs:
  - Returned Task
  - Selective Edit Scope
  - New Immutable Version
  - Before/after comparison
  engines:
  - ENG-03
  - ENG-07
  - ENG-09
  - ENG-10
  - ENG-11
  - ENG-12
  states: Returned -> Correction In Progress -> Resubmitted -> Under Review
  failures:
  - Non-returned section edit blocked
  - Reviewer comments immutable
  - Old version preserved
  - Sync conflict resolved explicitly
- id: P12
  title: Factory 360 & Operations Update
  owner: System / Operations / Leadership
  channel: Web + Operations
  modules: M07/M08
  purpose: Turn the completed lifecycle into trusted operational and historical visibility.
  actions:
  - Update factory history and inspection timeline
  - Link findings, violations, actions, reports and evidence
  - Update visit/inspector/SLA state in Operations Center
  - Expose role-appropriate KPIs, alerts, workload and exceptions
  outputs:
  - Updated Factory 360
  - Operations visibility
  - Traceable KPI inputs
  - Closed or continuing action timeline
  engines:
  - ENG-04
  - ENG-06
  - ENG-07
  - ENG-09
  - ENG-11
  - ENG-12
  states: Reviewed Outcome -> Historical/Operational Update
  failures:
  - Partial widget failure isolated
  - Stale data not shown as live
  - KPI must trace to records
  - Advanced national strategic dashboards remain MVP2
