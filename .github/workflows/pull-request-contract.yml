name: Pull request contract

on:
  pull_request:
    branches:
      - setup/Inspection
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch namespace
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            codex/ipad/*|codex/web/*|codex/admin/*|codex/shared/*|codex/governance/*|codex/release/*|feat/*|fix/*|hotfix/*|docs/*|chore/*)
              exit 0
              ;;
            *)
              echo "Use a surface branch such as codex/ipad/TASK-IPAD-123-description, codex/web/TASK-WEB-123-description, codex/admin/TASK-ADM-123-description, or codex/shared/TASK-123-description."
              exit 1
              ;;
          esac

  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
