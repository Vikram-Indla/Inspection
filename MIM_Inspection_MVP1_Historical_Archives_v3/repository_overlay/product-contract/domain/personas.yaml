human_personas:
- name: Compliance Admin
  channel: Admin Portal
  responsibility: Owns regulations, packages, rules, evidence, violations and publish
    governance.
- name: Planner
  channel: Web Portal
  responsibility: Creates plans, targets factories, assigns inspectors and publishes
    visits.
- name: Inspector
  channel: iPad / Virtual
  responsibility: Prepares, travels, checks in, executes, captures evidence and submits.
- name: Factory Representative
  channel: Factory / Virtual
  responsibility: Provides access and identity, participates in inspection and acknowledges
    activity.
- name: Level 2 Reviewer
  channel: Web Portal
  responsibility: Reviews immutable submissions, returns exact sections, approves
    or rejects.
- name: Operations Officer
  channel: Operations Center
  responsibility: Monitors live visits, telemetry, SLA, workload, exceptions and overrides.
- name: Leadership User
  channel: Dashboards
  responsibility: Consumes trusted operational performance and inspection outcome
    visibility.
- name: System Services
  channel: All Channels
  responsibility: Enforces workflow, audit, security, data integrity, sync and notifications.
system_personas:
- id: ENG-01
  name: Regulatory & Compliance
  source_modules: M09
  responsibility: Published inspection rules and item semantics
- id: ENG-02
  name: Form & Package
  source_modules: M09/M04/M05
  responsibility: Versioned report packages, sections, questions and action forms
- id: ENG-03
  name: Workflow
  source_modules: All
  responsibility: Allowed states, transitions, guards and side effects
- id: ENG-04
  name: Risk Foundation
  source_modules: M01/M07/M08
  responsibility: Approved score inputs, band, version and explainability needed for
    MVP1
- id: ENG-05
  name: Assignment
  source_modules: M01/M02
  responsibility: Automatic/manual assignment with availability and conflict checks
- id: ENG-06
  name: GIS, Geofence & Telemetry
  source_modules: M03/M04/M08
  responsibility: Location, route, ETA, arrival, geofence, override and tracking events
- id: ENG-07
  name: Evidence & Media
  source_modules: M04/M05/M06
  responsibility: Evidence rules, linkage, metadata, integrity and review visibility
- id: ENG-08
  name: Violation & Penalty
  source_modules: M09/M04/M06
  responsibility: Configured violation and penalty mappings consumed at runtime
- id: ENG-09
  name: Review & Version
  source_modules: M06
  responsibility: Immutable versions, return scope, comments, comparison and decisions
- id: ENG-10
  name: Offline Sync
  source_modules: M03/M04
  responsibility: Secure local package, autosave, recovery, retry and conflict control
- id: ENG-11
  name: Notification & SLA
  source_modules: All
  responsibility: Assignment, change, appointment, submission, return and exception
    events
- id: ENG-12
  name: Audit & Traceability
  source_modules: All
  responsibility: Actor, time, before/after, version, source requirement and evidence
    trail
