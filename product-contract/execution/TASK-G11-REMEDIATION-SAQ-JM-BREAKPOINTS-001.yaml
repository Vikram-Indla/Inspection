frozen_acceptance_criteria:
  JM-VIS-AC-001: "A Bulk Visit plan with two or more eligible factories creates one plan, one visit and one supervision request per factory in one atomic transaction."
  JM-VIS-AC-002: "Bulk failure at any target leaves no partial plan, visit, request, package snapshot, notification or audit state."
  JM-VIS-AC-003: "A bulk plan aggregate status truthfully represents all child outcomes and cannot become fully published, returned or cancelled from one row decision."
  JM-VIS-AC-004: "A returned Single, Bulk-row or Urgent visit has a governed, audited correction and resubmission path without editing immutable execution/submission evidence."
  JM-VIS-AC-005: "Single, Bulk and Urgent targeting uses an exact factory/licence/location identity where the repository supplies one; ambiguous targets are identified before commit."
  JM-VIS-AC-006: "Selected packages are server-validated as published/locked and effective; leaving package empty remains explicit and never silently selects the first package."
  JM-VIS-AC-007: "Priority values for Bulk and Urgent are empty or an active governed planning lookup; crafted values fail closed."
  JM-VIS-AC-008: "Final assignment requires an authorized Supervisor and named Inspector; concurrent overlapping approvals cannot double-book the same Inspector."
  JM-VIS-AC-009: "Single and Bulk retries are receipt-idempotent for the same actor and payload and reject request-id reuse with a changed payload."
  JM-VIS-AC-010: "Planner, Supervisor, Inspector and unauthorized callers receive only their allowed actions/data under server authorization and RLS."
  JM-VIS-AC-011: "Supervision and assignment notifications expose queued/delivered/failed truth and can resume idempotently without duplicate user notifications where the configured provider contract permits."
  JM-VIS-AC-012: "No journey is marked fixed until positive/negative database tests, typecheck/build, focused browser tests and target-bound runtime evidence pass at one pinned revision."
criteria_hash_algorithm: "sha256 canonical UTF-8 lines JM-VIS-AC-001..012 in ID order"
