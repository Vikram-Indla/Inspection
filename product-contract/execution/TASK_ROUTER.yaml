schema_version: "1.0"
project: "MIM Inspection Platform MVP1"
routing_rules:
  - intent: web_admin_phase1_planning
    id_pattern: "TASK-WEB-ADMIN-PHASE1-*"
    required_context:
      - product-contract/governance/CC-WEB-ADMIN-PHASE1-001.yaml
      - product-contract/web-admin-phase1/00_START_HERE.md
      - product-contract/web-admin-phase1/BASELINE_SUMMARY.json
      - product-contract/web-admin-phase1/REQUIREMENT_BASELINE.csv
      - product-contract/web-admin-phase1/ROUTE_INVENTORY.csv
      - product-contract/web-admin-phase1/DESIGN_ROUTE_MAP.csv
      - product-contract/web-admin-phase1/CURRENT_TO_TARGET_MIGRATION.csv
      - product-contract/web-admin-phase1/PACKAGE_MANIFEST.csv
      - product-contract/web-admin-phase1/ACCEPTANCE_CRITERIA.csv
      - .planning-pack/web-admin-phase1/WEB_ADMIN_PHASE1_HANDOFF.md
  - intent: remediation
    id_pattern: "TASK-G11-REMEDIATION-*"
    required_context:
      - product-contract/GATE_STATUS.md
      - product-contract/CURRENT_STATE.md
      - product-contract/execution/CURRENT_SLICE.yaml
      - product-contract/acceptance/ACCEPTANCE_STATUS.md
      - product-contract/evidence/EVIDENCE_STATUS.md
  - intent: gate
    id_pattern: "G[0-9]+-*"
    required_context:
      - product-contract/GATE_STATUS.md
      - product-contract/CURRENT_STATE.md
  - intent: admin
    id_pattern: "TASK-ADM-*"
    required_context:
      - product-contract/screens/screen_route_catalogue.csv
      - product-contract/domain/field_dictionary.csv
      - product-contract/domain/rbac_matrix.csv
      - product-contract/domain/state_transitions.csv
      - product-contract/governance/decision_register.csv
  - intent: web
    id_pattern: "TASK-WEB-*"
    required_context:
      - product-contract/business/master_end_to_end_process.md
      - product-contract/screens/screen_route_catalogue.csv
      - product-contract/domain/field_dictionary.csv
      - product-contract/domain/state_transitions.csv
  - intent: factory_360
    id_pattern: "TASK-FACTORY-360-*"
    required_context:
      - product-contract/factory-360/FACTORY_360_MASTER_LEDGER.csv
      - product-contract/factory-360/FACTORY_360_API_ENDPOINT_INVENTORY.csv
      - product-contract/factory-360/FACTORY_360_API_FIELD_INVENTORY.csv
      - product-contract/factory-360/FACTORY_360_ACCEPTANCE_LEDGER.csv
      - product-contract/factory-360/FACTORY_360_PRESERVATION_LEDGER.csv
      - product-contract/factory-360/FACTORY_360_FUNCTIONAL_JOURNEYS.csv
      - product-contract/factory-360/FACTORY_360_EXECUTION_STATE.yaml
      - product-contract/factory-360/industry-shared/INDUSTRY_SHARED_ENDPOINT_CONTRACT_LEDGER.csv
      - product-contract/factory-360/industry-shared/FACTORY360_STUB_RETIREMENT_MATRIX.csv
      - product-contract/factory-360/industry-shared/F360_INDUSTRY_SHARED_ACCEPTANCE_LEDGER.csv
      - product-contract/factory-360/source/Inspection_API_documentation.sanitized.json
      - product-contract/screens/screen_route_catalogue.csv
      - product-contract/domain/field_dictionary.csv
      - product-contract/domain/rbac_matrix.csv
      - product-contract/domain/state_transitions.csv
      - product-contract/governance/decision_register.csv
  - intent: ipad
    id_pattern: "TASK-IPAD-*"
    required_context:
      - product-contract/business/master_end_to_end_process.md
      - product-contract/screens/screen_route_catalogue.csv
      - product-contract/domain/field_dictionary.csv
      - product-contract/governance/error_catalogue.csv
  - intent: virtual
    id_pattern: "TASK-VIR-*"
    required_context:
      - product-contract/screens/screen_route_catalogue.csv
      - product-contract/domain/state_transitions.csv
      - product-contract/governance/decision_register.csv
  - intent: design
    id_pattern: "TASK-DESIGN-*"
    required_context:
      - product-contract/design/DESIGN_AUTHORITY_STATUS.md
      - product-contract/screens/screen_route_catalogue.csv
  - intent: qa
    id_pattern: "TASK-QA-*"
    required_context:
      - product-contract/acceptance/ACCEPTANCE_STATUS.md
      - product-contract/evidence/EVIDENCE_STATUS.md
  - intent: factory360_cross_provider_contract
    id_pattern: "TASK-FACTORY-360-CROSS-PROVIDER-CONTRACT-*"
    required_context:
      - product-contract/factory-360/FACTORY_360_INSPECTION_API_CONSUMPTION_LEDGER.csv
      - product-contract/factory-360/FACTORY_360_API_FIELD_MAPPING_LEDGER.csv
      - product-contract/factory-360/FACTORY_360_SOURCE_PRECEDENCE_MATRIX.csv
      - product-contract/factory-360/FACTORY_360_WEB_IPAD_CONSUMPTION_MATRIX.csv
      - product-contract/factory-360/industry-shared/INDUSTRY_SHARED_ENDPOINT_CONTRACT_LEDGER.csv
hard_rule: "A task may not start unless CURRENT_SLICE.yaml lists its complete context and evidence."
