    Two follow-ups, neither blocking this task. First, obtain a browser session
    as inspector@mim.gov.sa and confirm the partial-service branch renders and
    prints no zero counts. Second, add a contract test asserting that
    pg_policies contains no bare parameterless predicate, so a later migration
