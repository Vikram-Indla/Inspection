change_control_id: "CC-RLS-INITPLAN-WRAP-20260727-001"
title: "Remove per-row RLS predicate evaluation and restore the field dashboard"
priority: "P0"
status: "COMPLETE_APPLIED_AND_VERIFIED"
owner: "Claude Code"
gate: "G10 verification / G11 hardening"

objective: >
  Make the Inspector field dashboard's governed read complete inside the 8s
  statement timeout without narrowing what the inspector may see, and without
  presenting missing data as zero when a read still fails.

allowed_paths:
  - "supabase/migrations/20260727010000_rls_initplan_wrap.sql"
  - "supabase/migrations/20260727010500_visits_factory_id_idx.sql"
  - "supabase/migrations/20260726231500_planning_visits_created_at_idx.sql"
  - "apps/web/src/app/(app)/field/page.tsx"
  - "product-contract/governance/CC-RLS-INITPLAN-WRAP-20260727-001.yaml"
  - "product-contract/execution/TASK-RLS-INITPLAN-WRAP-20260727-001.yaml"

implementation_contract:
  part_1:
    migration: "20260727010000_rls_initplan_wrap.sql"
    shape: "275 ALTER POLICY statements, generated from pg_policies, not hand-edited"
    wrapped:
      - "has_any_role(ARRAY[...])"
      - "has_planning_capability('...')"
      - "has_permission('...')"
      - "has_role('...')"
      - "ccr_is_reviewer(), dash_is_config_writer(), dash_is_config_reviewer()"
      - "bare auth.uid()"
    deliberately_not_wrapped:
      - "is_assigned_inspector(visit_id)"
      - "inspects_same_factory(visit_id)"
      - "can_read_semantic_audit_object(aggregate_type, aggregate_id, source_audit_event_id)"
    reason_not_wrapped: "Row-dependent arguments. Hoisting them to an InitPlan would change meaning, not just cost."
  part_2:
    migration: "20260727010500_visits_factory_id_idx.sql"
    changes:
      - "create index visits_factory_id_idx on public.visits (factory_id) — the self-join inside inspects_same_factory() had no index and scanned all 1491 visits per call."
      - "inspects_same_factory() now calls (select auth.uid()); its two siblings already did."
  part_3:
    file: "apps/web/src/app/(app)/field/page.tsx"
    change: >
      The assignment-read failure branch no longer replaces the whole dashboard
      with one alert. It names the affected surfaces, states explicitly that no
      counts are shown and that this is not a count of zero, serves the daily
      brief when that independent read succeeded, and offers routes to My Tasks,
      Establishments, Notifications and retry.
    rejected_alternative: >
      Rendering the normal dashboard with an empty task list. Every count would
      read 0, asserting "no visits today" — a claim the page cannot make when the
      read failed. Refused on the no-fabrication rule.
  requirement_refs:
    - "MVP1-FND-012"
    - "ERR-OPS-001"
    - "RBAC-001"

