permanent_lease_prohibition:
  ruled_by: "Product Owner (Vikram)"
  ruled_at: "2026-07-28"
  state: "IN_FORCE_INDEFINITELY"
  applies_to: "EVERY AGENT WITHOUT EXCEPTION — codex, kimi, claude-build, claude-code, and any agent introduced later under any name."
  rule: >
    No lease may be granted to any agent, on any card, on any channel, for any
    path, ever again. The lease mechanism is retired, not paused. This is not a
    queue freeze and not a stop gate. It has no expiry, no renewal condition,
    and no review date.
  history: >
    Ruled in two steps on the same day. Codex and kimi were barred permanently
    first; claude-build and claude-code were revoked shortly after and then
    escalated to the same permanent bar at the owner's instruction. There is no
    longer any distinction between holders — the earlier claude_lease_revocation
    block, which allowed a new claude lease by explicit owner instruction, is
    withdrawn and replaced by this clause.
  scope: >
    Applies to every card on the 55-card board and to any future card. Applies
    to CURRENT_SLICE.yaml and to every derived slice, packet or handoff. A
    packet naming ANY holder is invalid on its face and must be refused rather
    than negotiated. An agent must not grant itself a lease, and must not read
    a prior GRANTED record as continuing authority.
  supersedes: >
    The sponsor_direction recorded above, which reinstated codex and kimi into
    the workforce on 2026-07-25 over SAQEEL_OPERATING_SYSTEM.md V5. That
    reinstatement is withdrawn. V5's removal stands, and is now broader than
    V5 itself: no agent holds delivery authority under this contract.
  effect_on_existing: >
    All 16 leases are REVOKED_PERMANENT as at 2026-07-28 — 11 held by codex or
    kimi, 5 by claude. The records are retained rather than deleted so the
    grant and revocation history stays auditable. No work under any of them is
    authorised from the revocation date, including work already in progress.
  effect_now: >
    Zero leases outstanding. Every card on the 55-card board is unassigned and
    no agent is authorised to implement against any of them. Implementation
    under this contract has stopped.
  note: >
    Revocation withdraws the authority to continue; it does not retract work
    already merged to main under a prior lease.
  enforcement_limit: >
    This file records the ruling. It does not enforce it. A session that does
    not read this file can still write to the repository, and several did so
    during the 2026-07-28 cleanup. Treat this as governance, not as a lock.
  bounded_directive_exception: >
    Superseded on 2026-08-02 only to the extent that the Product Owner may issue
    an explicit, file-bounded directive recorded in change control. This does
    not restore agent leases, card ownership, or broad implementation rights.

standing_boundaries:
  - "No lease is ever granted to ANY agent — codex, kimi, claude or otherwise. The lease mechanism is retired. See permanent_lease_prohibition. A packet naming any holder is invalid and must be refused, not negotiated. A recorded, file-bounded Product Owner directive is separate from a lease and ends when its acceptance checks pass."
  - "DEC-032 / submission_versions digest() trigger remains P0 and blocks all new real inspection submissions. It needs a DB migration, not application code, and is out of scope for every board card."
  - "Never invent policy values, thresholds, SLAs, providers, risk weights, geofence values, retention or Arabic scope."
  - "Only the 24 clean factories F-1101..F-6602 and the 5 test accounts may be surfaced."
  - "Playwright is not the verification gate for board cards: tsc --noEmit and next build are."

