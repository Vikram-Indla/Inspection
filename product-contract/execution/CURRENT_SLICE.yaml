permanent_lease_prohibition:
  ruled_by: "Product Owner (Vikram)"
  ruled_at: "2026-07-28"
  state: "IN_FORCE_INDEFINITELY"
  rule: >
    No lease may be granted to codex or to kimi, on any card, on any channel,
    for any path, ever again. This is not a pause and not a queue freeze. It
    has no expiry and no renewal condition.
  scope: >
    Applies to every card on the 55-card board and to any future card. Applies
    to CURRENT_SLICE.yaml and to every derived slice, packet or handoff. A
    packet that names codex or kimi as holder is invalid on its face and must
    be refused rather than negotiated.
  supersedes: >
    The sponsor_direction recorded above, which reinstated codex and kimi into
    the workforce on 2026-07-25 over SAQEEL_OPERATING_SYSTEM.md V5. That
    reinstatement is withdrawn. V5's original removal of codex and kimi now
    stands, by the owner's later ruling rather than by V5's own authority.
  effect_on_existing: >
    All 11 leases held by codex or kimi were set to REVOKED_PERMANENT on
    2026-07-28. The records are retained rather than deleted so the grant and
    revocation history stays auditable. No work under those leases is
    authorised from the revocation date, including work already in progress.
  note: >
    Revocation does not retract work already merged to main under a prior
    lease. It withdraws the authority to continue.

claude_lease_revocation:
  ruled_by: "Product Owner (Vikram)"
  ruled_at: "2026-07-28"
  state: "REVOKED_PENDING_OWNER_INSTRUCTION"
  rule: >
    The five leases held by claude-build and claude-code are revoked:
    m6-requests, m6-committee, virtual, feedback, reports. No claude agent
    holds a lease on any card.
  distinct_from_the_codex_kimi_prohibition: >
    This is a revocation, not a permanent bar. The codex and kimi prohibition
    above has no expiry and no renewal condition; this one does not carry that
    language. A new claude lease may be granted, but only by explicit Product
    Owner instruction — not by a session assuming continuity from a prior
    grant, and not by an orchestrator re-issuing a packet.
  effect: >
    Combined with the permanent prohibition, zero leases are outstanding. Every
    card on the 55-card board is unassigned. No agent is authorised to
    implement against any card until the owner grants a new lease.

