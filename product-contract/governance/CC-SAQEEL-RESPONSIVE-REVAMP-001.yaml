approved_product_direction:
  application:
    - "One unified responsive web application."
    - "iPhone and iPad are responsive browser test families, not separate application architectures."
    - "No separate field-only or administration application shell remains after certified convergence."
    - "Existing /field business capability is preserved and migrated before PWA delivery infrastructure is disabled."
  roles:
    canonical: ["planner", "inspector", "administrator"]
    rule: >
      Existing thirteen-role storage and policy behavior may be replaced only
      through an explicit legacy-to-canonical mapping that preserves historical
      audit attribution, least privilege, and every accepted permission outcome.
  navigation:
    - "All three canonical roles receive the same top and side navigation structure."
    - "Administration remains visible to all three roles."
    - "Planner and Inspector receive the designed unauthorized Administration state."
    - "Visibility never grants authorization; route, server, service, RLS, audit, direct URL, refresh, deep-link and API enforcement must agree."
  localization:
    - "English and Modern Standard Arabic UI are mandatory."
    - "LTR/RTL and light/dark are mandatory."
    - "Legal, regulation, enforcement, penalty, risk, SLA and compliance meanings require authoritative translation and may not be invented."
  responsive_test_widths: [320, 375, 390, 768, 1024, 1280, 1440, 1920]
  browser_families: ["current stable Chrome", "current stable Safari"]
  pwa:
    - "Archive the verified pre-migration PWA baseline in the same repository."
    - "Do not maintain, showcase or deploy the archive as an active product."
    - "Preserve offline outbox, conflict, package-integrity, evidence, submission-lock and reusable field execution logic."
    - "Service-worker removal must include an explicit Web Push disposition because current push delivery depends on it."

