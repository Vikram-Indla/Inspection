why_this_needs_an_approval:
  rule: >
    The decision register and OPEN_DECISIONS.yaml are controlled contract files.
    They are not edited without an approved change ID. This record exists to be
    that change ID. Nothing is edited until the Product Owner approves it.
  found_by: >
    The Integration lane, which removed a stale banner in the product and then
    declined to edit the register on its own authority. That was correct.

the_problem:
  summary: >
    The register says DEC-032 is open and P0, and that it "blocks ALL real
    inspection submissions". That is no longer true, and has not been true
    since 1 August.
  why_it_matters: >
    An open P0 that is actually closed is not harmless bookkeeping. It says the
    platform cannot do the one thing it exists to do. Anyone reading the
    register to decide what is safe to test, demonstrate or release would draw
    exactly the wrong conclusion. Two other decisions cite it as their root
    cause and inherit the same wrong status.

