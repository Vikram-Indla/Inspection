    - "pgcrypto is present in that schema."
    - "Two submission versions were written today, v1 and v2, on inspection db2450d2, with no digest error."
  walked_not_inferred: >
    An inspection was submitted, returned for correction, corrected, resubmitted
    and approved today with real accounts. Submission is demonstrably working.

requested_change:
