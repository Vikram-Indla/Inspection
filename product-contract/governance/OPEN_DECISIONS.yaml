closed_decisions:
  - id: "DEC-032"
    title: "submission_versions digest() trigger failure"
    closed_at: "2026-08-05"
    closed_under: "CC-DEC-032-CLOSURE-20260805"
    fixed_by: "migration 20260801225413_fix_dec032_submission_snapshot_digest, applied 2026-08-01"
    evidence: >
      Proven by walking, not by inspection. On 2026-08-05 an inspection was
      submitted, returned for correction, corrected, resubmitted and approved
      with real accounts, writing two submission versions with no digest error.
    lesson: >
      This sat in the register as an open P0 reading "blocks ALL real inspection
      submissions" for four days after it was fixed, and a banner repeated the
      false claim to users. A P0 that is wrongly open says the platform cannot
      do the one thing it exists for, and every judgement made from the register
      inherits that. Closing a decision is part of fixing it.
