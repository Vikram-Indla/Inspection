schema_version: "1.0"
title: "DEC-001..010 recommended dispositions — sponsor-accepted"
date: "2026-07-11"
authority: >
  Sponsor instruction (Vikram Indla, session 2026-07-11): "come up with the best
  recommended answers and consider that I have accepted." Recommendations below are
  therefore ACCEPTED_INTERIM: operative for design/build as configurable defaults,
  revisable by the named owner, pending formal change-control update of the frozen
  decision_register.csv (which this file deliberately does not edit).
status: ACCEPTED_INTERIM (sponsor bulk acceptance; change-control follow-up CC-DEC-001 to formalize)

decisions:
  DEC-001_risk_model:
    model: "Weighted-sum score 0–100, versioned, reproducible, drivers always displayed"
    factors:
      - { name: violation_history_24mo, weight: 0.30, source: inspection outcomes }
      - { name: last_outcome_recency_severity, weight: 0.20, source: review decisions }
      - { name: license_status, weight: 0.15, source: Senaei }
      - { name: activity_hazard_class, weight: 0.20, source: industrial activity reference }
      - { name: open_corrective_actions, weight: 0.15, source: action tracking }
    bands: { low: "0–39", medium: "40–69", high: "70–100" }
    owner_may_revise: Risk Owner / Business

  DEC-002_gis_geofence:
    gps_accuracy_checkin_max_m: 25
    arrival_detection_radius_m: 200
    geofence_default_radius_m: 150   # per-factory override incl. polygon
    telemetry_interval_s: 30
    route_deviation_alert: "> 500 m off planned route for > 2 min"
    retention: { telemetry_days: 90, checkin_evidence: permanent (regulatory record) }
    owner_may_revise: GIS / Operations

  DEC-003_sla_calendar:
    work_calendar: "Sun–Thu 08:00–17:00 AST (KSA), public holidays excluded"
    review_sla: "3 business days"
    correction_resubmission_sla: "5 business days"
    corrective_action_default_due: "14 calendar days"
    reminders: ["50% elapsed", "80% elapsed"]
    escalation: { L1: "at breach → supervisor", L2: "+1 business day → operations manager" }
    pause_resume: "review SLA pauses while returned to inspector"
    owner_may_revise: Business Operations

  DEC-004_arabic_rtl:
    scope: >
      MVP1 bilingual UI chrome (EN/AR) across all channels via externalized i18n;
      Arabic-first default for factory-facing surfaces (virtual session, acknowledgement,
      notifications to factory); Web/Admin default English with full native RTL switch.
      User-generated content stored as entered. Full bilingual authoring tooling stays MVP2-016.
    owner_may_revise: Executive / Product

  DEC-005_factory_boundary:
    mvp1_external_functions: ["virtual session join", "identity + OTP verification",
      "evidence provision in session", "digital acknowledgement / refusal"]
    excluded_mvp2: ["self-service portal (MVP2-007)", "correction/re-inspection portal (MVP2-008)",
      "objection/appeal (MVP2-009)"]
    owner_may_revise: Product Owner

  DEC-006_evidence_policy:
    photo: { formats: [JPEG, PNG, HEIC], max_mb: 15 }
    video: { formats: [MP4, MOV], max_minutes: 3, max_mb: 250 }
    document: { formats: [PDF], max_mb: 25 }
    voice_note: { formats: [M4A/AAC], max_minutes: 5 }
    content_hash: "SHA-256 computed at sync (FLD-EVD-006 = enabled)"
    malware_scan: "on upload, storage-side"
    retention: "10 years (regulatory-record default; Legal may revise)"
    redaction: MVP2
    owner_may_revise: Compliance / Security

  DEC-007_otp:
    channel: SMS (email fallback)
    code: { digits: 6, expiry_min: 5, attempts_per_code: 3 }
    resend: { max: 3, cooldown_s: 60 }
    exhausted_path: "escalate → reschedule or supervisor-approved manual verification (audited exception)"
    provider: "adapter abstraction; primary Unifonic (KSA CPaaS), fallback Twilio"
    owner_may_revise: Technical / Security

  DEC-008_maps:
    primary: "Google Maps Platform (Maps SDK, Directions, Distance Matrix, Geocoding)"
    offline_field: "MapLibre + cached OSM-derived tiles for iPad offline route context"
    abstraction: retained (provider swap must not touch feature code)
    owner_may_revise: Technical / GIS

  DEC-009_digital_acknowledgement:
    mvp1: "on-screen acknowledgement: drawn signature image + name + role + timestamp + geotag, plus explicit refusal path with reason — administrative record"
    excluded: "qualified PKI e-signature / non-repudiation (MVP2-011)"
    owner_may_revise: Legal / Product

  DEC-010_nfr_and_stack:
    availability: "99.5% business hours / 99.0% overall (MVP1)"
    latency: { api_read_p95_ms: 500, api_write_p95_ms: 1000, dashboard_load_s: 3 }
    concurrency: { users: 500, field_inspectors: 150 }
    dr: { rto_hours: 4, rpo_minutes: 15 (PITR) }
    offline_package: { target_mb: 200, max_mb: 500 }
    stack:
      web_admin: "Next.js / React / TypeScript"
      ipad: "offline-first PWA (IndexedDB + service-worker outbox, idempotent replay); native wrapper option post-MVP1"
      backend: "Supabase — Postgres + Auth + Storage + Realtime; RLS enforcing RBAC matrix"
    region_flag: >
      Current project region ap-northeast-2 (Seoul) adds ~150ms latency from KSA and
      raises data-residency questions. RECOMMENDED-ACCEPTED: migrate Supabase project to
      eu-central-1 (Frankfurt, nearest supported) BEFORE any data load — cheap now,
      expensive later. Owner: Enterprise Architect.
    owner_may_revise: Architecture / Operations
