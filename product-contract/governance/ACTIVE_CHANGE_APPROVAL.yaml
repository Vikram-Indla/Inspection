schema_version: "1.0"
change_id: "CC-BRANCH-CONSOLIDATION-001"
title: "Local branch consolidation & worktree cleanup into setup/Inspection"
requestor: "Claude Code (on behalf of Vikram Indla)"
approver: "Vikram Indla"
authorization: >
  Sponsor directed, session 2026-07-17: consolidate all active local branches
  into the root branch setup/Inspection, bring the widest stash into the root,
  resolve merge conflicts, then delete stale branches and worktrees leaving only
  the root. Approver confirmed target = setup/Inspection, scope = consolidate
  active / drop dead, and LOCAL-ONLY (no push/remote change).
business_reason: >
  ~24 divergent local branches and 16 worktrees accumulated across MVP1/MVP2/MVP3,
  admin, iPad, governance and docs workstreams. The sponsor requested a single
  clean root to reduce branch sprawl and reconciliation risk. All branch heads are
  tagged backup/20260717-cleanup/* first; uncommitted worktree work was preserved
  as commits before any consolidation.
decision:
  target_root: "setup/Inspection (local)"
  scope: "Merge every non-setup local branch (contained branches no-op); apply stash@{3} 'wip-other-session'; drop stash@{0} audit noise."
  remote: "LOCAL ONLY — no git push, no origin branch/tag deletion, no modification of origin/main or origin/setup/Inspection."
scope_allowed:
  - "git merge of local feature/codex/fix branches into local setup/Inspection."
  - "Conflict resolution taking the union of accepted content; no accepted requirement, field, rule, permission, state, audit event, evidence or offline behavior weakened."
  - "Temporary lifting of ONLY the 'git merge' block in .claude/hooks/pre_tool_guard.py for the duration of this change, restored verbatim on completion."
  - "git worktree remove and git branch -D for stale local branches/worktrees after their commits are merged or confirmed contained."
scope_forbidden:
  - "Any git push, force push, or deletion of remote branches/tags."
  - "Any modification of origin/main, origin/setup/Inspection, or the immutable submitted versions."
  - "Silent overwrite of conflicting product-contract content — conflicts resolved to preserve both sides' accepted content."
  - "Removing or weakening any accepted requirement, rule, permission, state, audit event or evidence during conflict resolution."
mvp1_mvp2_impact: >
  None removed or weakened. Consolidation is a union of existing committed work
  plus preserved uncommitted work. No scope change.
regression_impact: "Post-merge typecheck/build run as the exit check; result reported faithfully."
decision_owner: "Vikram Indla"
effective_version: "Branch consolidation 2026-07-17"
effective_date: "2026-07-17"
notes: >
  Supersedes CC-CD030-ROUTE-001 in this single-active-record file (prior record
  preserved at product-contract/governance/_superseded_CC-CD030-ROUTE-001.yaml and
  in git history; its DEC-013 decision_register entry remains authoritative). This
  approval covers ONLY the local consolidation/cleanup and the temporary merge-guard
  lift. It does not authorize any remote/main change.
