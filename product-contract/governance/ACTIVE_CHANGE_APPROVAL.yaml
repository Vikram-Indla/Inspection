schema_version: "1.0"
change_id: "CC-FACTORY-360-INDUSTRY-SHARED-GAP-013"
title: "Industry Shared API v2 deep discovery and Factory 360 gap closure"
requestor: "Vikram Indla"
approver: "Vikram Indla"
authorization: >
  The sponsor supplied eleven Industry Shared API v2 endpoint leads and the complete
  gap-closure pack, instructed Codex to perform deep discovery and implementation in a
  separate conversation, explicitly authorized multi-agent execution, required the
  exact Factory 360 Web baseline and dedicated branch, and authorized the finished
  isolated branch to be pushed. Unknown contracts must remain precise fail-closed states.
scope_allowed:
  - "Create and use codex/industry-shared-factory360-gap-013 from exact baseline db52854647fa9b4ca8fac362dfecd4ecc7ccf704."
  - "Discover verified beta frontend/API contracts without printing or committing credentials or personal data."
  - "Implement a dedicated server-only Industry Shared provider and normalize verified data into the existing Factory 360 model."
  - "Add forward-only schema only when verified fields cannot safely map to existing objects."
  - "Update active task, ledgers, acceptance, evidence, queue and session controls for this slice."
  - "Commit and push only the isolated Industry Shared branch."
scope_forbidden:
  - "Production deployment, main/setup merge or main/setup modification."
  - "Remote DDL or shared beta/production data mutation."
  - "Guessed methods, auth, identifiers, fields, endpoints or false synchronization claims."
  - "Secrets, cookies, tokens, raw personal data, environment files or external binary source documents in Git."
  - "Weakening F360-BR-002 one-license/one-plant cardinality without approved change control."
decision_owner: "Vikram Indla"
effective_date: "2026-07-20"

cross_provider_contract_014:
  change_id: "CC-FACTORY-360-CROSS-PROVIDER-CONTRACT-014"
  approver: "Vikram Indla"
