title: "SAQEEL V5.1 Web and Inspector iPad Dashboard design authority"
requestor: "Vikram Indla"
approver: "Vikram Indla"
authorization: >-
  The sponsor replied "authorised" on 2026-07-20 to the exact proposal to activate
  TASK-DESIGN-DASHBOARD-WEB-IPAD-V5-001 as a governed design-only slice, correct
  the Web/iPad handoff packs, register unresolved KPI decisions, and execute two
  separate Claude Design workstreams from an isolated branch/worktree.
scope_allowed:
  - "Create and use codex/dashboard-design-v5-001 from clean setup/Inspection baseline d53e09f7ee4018bf2046e36d95fe45df355b11a2."
  - "Update branch-local current-slice, approval, decision, design acceptance, evidence-pointer and session records."
  - "Read and reconcile supplied workbooks, references, SAQEEL V5.1 authority and current repository behavior."
  - "Create corrected Web and iPad design packs and binary design outputs under INSPECTION_DOCS_ROOT, with lightweight Git pointers only."
