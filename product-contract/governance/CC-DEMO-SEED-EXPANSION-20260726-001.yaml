    - "reviews (canonical review transitions only)"
    - "virtual_sessions and virtual_participants"
    - "notifications generated by canonical transitions/adapters only"
  generated_not_directly_written:
    - "audit_events"
    - "workflow/lifecycle event ledgers"
    - "outbox/notification rows where canonical transitions own generation"
  prohibited:
    - "Any table absent from the signed preflight schema inventory and manifest"
    - "Any untagged or non-batch-owned row mutation"
    - "Real provider delivery or real external-recipient contact"
    - "Production-shaped external provider payloads presented as live"
    - "Policy, SLA, threshold, risk weight, geofence, retention or legal values not already governed"

workflow_and_submission_rules:
  - "Use only canonical create/validate/publish/assign/prepare/arrive/submit/review/approve/return/reject/cancel/expire RPCs or application services confirmed by live function inventory."
  - "Do not invent an RPC name. Record the exact discovered signature and actor before execution."
  - "Every transition runs under the persona JWT whose role owns it and must pass RLS and guards."
  - "Audit evidence must be generated by the canonical transition/trigger and correlated back to that actor and batch."
  - >
    Before any submission scenario, reconcile DEC-032 using the R3 closure
    evidence, live applied-object state and a sacrificial canonical submit
    probe. If 42883 reproduces or the repaired object cannot be proven, mark
    submission scenarios BLOCKED_DEC_032, perform no direct insert and continue
    only with scenarios that do not claim a submission. The batch cannot be
    declared fully complete.

cleanup_and_rollback:
  cleanup_entrypoint: "scripts/seed/cleanup.ts --batch <exact-id> --dry-run"
  default: "dry-run; explicit operator confirmation required for mutation"
  target_rule: "Exact signed manifest members only, in reverse dependency order"
  never_delete_or_rewrite:
    - "audit_events"
    - "immutable submitted versions"
    - "immutable published configuration history"
    - "reused reference rows"
    - "any row not owned by the exact batch"
  auth_cleanup: >
    Auth users may be deleted only when their deterministic IDs are exact
    members of this batch, have no non-batch dependencies, and all domain
    cleanup validations pass first. A dry-run collision stops cleanup.
  rollback_definition: >
    Cleanup removes only safely removable batch-owned mutable/demo identities
    and records residual immutable/generated history truthfully. A rollback
    claim must list residual rows; it may not claim zero residue if immutable
    audit or submitted history remains.

