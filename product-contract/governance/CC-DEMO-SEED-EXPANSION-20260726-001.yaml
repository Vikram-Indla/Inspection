account_batch:
  total_accounts: 39
  per_role: 3
  canonical_role_source: "supabase/migrations/0001_foundation.sql"
  canonical_roles:
    - "compliance_admin"
    - "form_admin"
    - "workflow_admin"
    - "risk_owner"
    - "gis_admin"
    - "security_admin"
    - "planner"
    - "inspector"
    - "reviewer"
    - "ops"
    - "auditor"
    - "leadership"
    - "factory_rep"
  identity_rules:
    - "All names, emails, phone-like values and employee references are fictional and visibly synthetic."
    - "Use a reserved test-only email namespace approved by preflight; do not use @mim.gov.sa or any real person's address."
    - "No real PII, copied employee identity, personal phone number or external recipient is permitted."
    - "Account UUIDs and aliases are deterministic functions of seed_batch_id, role_key and ordinal 01..03."
  password_rules:
    - "Passwords are generated or supplied outside Git through the approved secret store/operator environment."
    - "No password, password pattern, service-role key or persona JWT appears in source, manifest, logs, evidence or PR text."
    - "Evidence records only secret references and redacted authentication outcomes."
  auth_and_profile_sequence:
    - "The service-role credential may be used only by the server-side Auth Admin module to create or reconcile the 39 auth.users identities."
    - "The service-role credential is destroyed from runner memory before any domain/profile/role write."
    - "All later writes use authenticated persona JWTs and existing RLS/canonical RPCs."
    - "Role grants use admin_grant_role authenticated as an existing security_admin; never insert user_roles directly."
    - >
      The current repository does not prove an RLS-authorized profile bootstrap
      path for a newly-created auth user. Execution must stop after Auth dry-run
      unless an existing canonical mechanism is proven. Any new self-profile
      RPC/policy requires a separately reviewed forward migration and may not be
      improvised by the seeder.

seed_batch_contract:
  batch_count: 1
  seed_batch_id: "DERIVE_AND_FREEZE_IN_SIGNED_PREFLIGHT_MANIFEST"
  deterministic_anchor: "FREEZE_ONCE_IN_SIGNED_PREFLIGHT_MANIFEST"
  profile: "demo"
  manifest_required_before_write: true
  manifest_fields:
    - "seed_batch_id"
    - "anchor_date"
    - "runner_commit_sha"
    - "target_project_ref"
    - "Drive package ID, size and SHA-256"
    - "exact deterministic IDs by table and scenario"
    - "reused reference IDs, never cleanup-owned"
    - "insert/reuse/skip/conflict expected counts"
    - "canonical RPC and persona actor for every transition"
    - "reverse-dependency cleanup order"
    - "secret references only, never secret values"
  immutable_handling: >
    Immutable rows are skip-only. If an immutable deterministic ID already
    exists and is not proven to belong to the same exact batch, stop with a
    collision; never overwrite, update, delete or silently reuse it.
  rerun_rule: >
    A rerun with the same batch ID and anchor is resume/idempotency proof only.
    Mutable seed-owned rows may converge only through their canonical write
    contracts. Immutable rows remain skip-only. A different batch ID is denied.

