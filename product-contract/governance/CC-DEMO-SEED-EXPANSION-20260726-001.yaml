    - "Target ref equals iiozvqntawxfwbgffzqu and production guard passes."
    - "Drive package bytes match ID, size and registered SHA-256."
    - "Live schema/function inventory maps every intended row and transition."
    - "Signed exact-ID manifest has zero unowned collisions."
    - "39 auth identities equal exactly 3 x 13 canonical role keys."
    - "Profile bootstrap and role-grant paths are proven canonical before Auth creation is committed."
    - "Cleanup dry-run enumerates the exact batch and no other rows."
    - "DEC-032 stale-authority conflict is reconciled against R3 evidence, live object state and a fresh canonical probe."
  execution:
    - "Service role is used for Auth Admin only, never domain/RLS proof."
    - "Persona-JWT positive and negative RLS probes pass for all 13 roles."
    - "All workflow changes use canonical transitions and guards."
    - "No direct audit insert or workflow-status mutation occurs."
    - "No real PII, real external recipient, invented policy or provider success is present."
