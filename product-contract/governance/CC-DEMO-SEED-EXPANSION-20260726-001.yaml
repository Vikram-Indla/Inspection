sponsor_authority:
  authority: "Vikram Indla / Product Owner"
  direction: >
    Authorize one deterministic demo seed batch in Supabase project
    iiozvqntawxfwbgffzqu, including three fictional accounts for each of the
    thirteen canonical roles, while preserving all workflow, RLS/RBAC, audit,
    immutability, provenance, cleanup and evidence controls.
  authorization_effect: >
    This record supersedes the CURRENT_SLICE standing boundary limiting visible
    data to 24 clean factories and five test accounts, and its blanket
    no-new-submissions consequence, for exactly one registered seed_batch_id.
    It does not change production policy, create a reusable standing exception,
    authorize a second batch, or resolve a technical defect by declaration.

supersession_boundary:
  supersedes_for_this_batch_only:
    - "CURRENT_SLICE.yaml standing boundary: only 24 clean factories F-1101..F-6602 may be surfaced"
    - "CURRENT_SLICE.yaml standing boundary: only five test accounts may be surfaced"
    - "DEC-032-derived policy prohibition on attempting new canonical submissions"
  remains_in_force:
    - "DEC-032 remains OPEN/P0 until the database trigger is repaired and independently proven."
    - "No direct insert into submission_versions is permitted."
    - "No workflow status column may be updated directly."
    - "No immutable submitted or published version may be edited."
    - "No direct audit_events insert, update or delete is permitted."
    - "No production project, provider, deployment or main-branch mutation is authorized."
  expiry: >
    The exception is consumed when the single approved seed_batch_id reaches
    completed, partial, failed, or cleaned status. Any rerun may only resume the
    same deterministic batch; a new batch root requires new Product Owner
    change control.

dec_032_authority_reconciliation:
  conflict: >
    CURRENT_SLICE.yaml, OPEN_DECISIONS.yaml, decision_register.csv and the
    V5-era control board still describe DEC-032 as OPEN/P0. Later evidence at
    product-contract/evidence/TASK-QA-R3-CLOSURE-20260722.md states that
    migration 20260722090000_fix_submission_snapshot_trigger_search_path.sql
    was applied and that a disposable golden journey passed 11/11, including
    submission v1/v2, return, resubmit and approve with v1 immutable.
  source_migration: "supabase/migrations/20260722090000_fix_submission_snapshot_trigger_search_path.sql"
  rule: >
    This packet does not silently rewrite or close the older frozen authority
    records. Before seeding, the operator must inspect the target project's
    applied migration/object state and run a fresh canonical persona-JWT
    submission probe. If the function search_path includes public, extensions,
    pg_temp and the probe succeeds without 42883, record DEC-032 as
    REMEDIATED_FOR_THIS_TARGET_RUN with both the R3 evidence and fresh probe.
    If either check fails, retain BLOCKED_DEC_032. Chat, migration-file
    presence, or stale status prose alone is insufficient.
  no_bypass: >
    In both outcomes, direct submission_versions insertion remains prohibited;
    only the canonical submission path can generate a seeded submitted version.

