schema_version: "1.0"
change_control_id: "CC-RLS-INITPLAN-WRAP-20260727-001"
task_id: "TASK-RLS-INITPLAN-WRAP-20260727-001"
title: "Evaluate parameterless RLS predicates once per query instead of once per row"
raised_at: "2026-07-27"
raised_by: "Claude Code"
state: "APPLIED_TO_ALLOWLISTED_TARGET_AND_VERIFIED"

requestor: "Vikram Indla"
decision_owner: "Vikram Indla"
approval: >-
  The Product Owner was shown the diagnosis (8s statement_timeout, 5728ms flat
  query, per-row predicate evaluation, 72 policies naming has_any_role bare) and
  the proposed remedy in three parts, and replied "do all three" on 2026-07-27.
  The approval covers the policy rewrite, the visits.factory_id index and the
  /field partial-service change.

business_reason: >-
  The Inspector field dashboard failed outright with "canceling statement due to
  statement timeout" and rendered ERR-OPS-001 with no data. The Planning list had
  failed the same way hours earlier. Both are accepted MVP1 surfaces; neither can
  be delivered while the governed read cannot complete inside the platform's own
  statement timeout.

source_evidence:
  - "Runtime: /field rendered ERR-OPS-001; console showed [field home] canceling statement due to statement timeout at src/app/(app)/field/page.tsx:116."
  - "pg_roles: statement_timeout = 8s for `authenticated`, 3s for `anon`."
  - "EXPLAIN (ANALYZE, BUFFERS) of the flat equivalent of the assignments read, executed as inspector@mim.gov.sa with RLS on: Execution Time 5728.286 ms."
  - "Seq Scan on assignments: 1874 ms and 18088 shared buffers for 1230 rows (~14 buffers per row) — the cost is predicate evaluation, not tuple access."
  - "Nested Loop SubPlan on visits: 1185 loops x 1.575 ms = 1867 ms."
  - "pg_policies: 72 SELECT/ALL policies across 148 tables called has_any_role() bare; 138 policies across all commands; 0 policies pre-wrapped."
  - "A/B on the same predicate set: bare 3192 ms vs (SELECT ...) 1534 ms, the residual being the policy's own bare copy still running per row."

root_cause: >-
  has_planning_capability(), has_any_role(), has_permission(), has_role(), the
  zero-argument ccr_/dash_ helpers and bare auth.uid() take no row-dependent
  argument, so their value is constant for a whole query. Written bare in a
  policy expression, PostgreSQL evaluates them once per row. Wrapping the call in
  (SELECT ...) makes it an InitPlan, evaluated once. The helper functions already
  used this form internally for auth.uid(); it had never been applied at the
  policy level. This is an evaluation-count defect, not an access-control defect.

authorized_files:
  - "supabase/migrations/20260727010000_rls_initplan_wrap.sql"
  - "supabase/migrations/20260727010500_visits_factory_id_idx.sql"
  - "supabase/migrations/20260726231500_planning_visits_created_at_idx.sql"
  - "apps/web/src/app/(app)/field/page.tsx"
  - "product-contract/governance/CC-RLS-INITPLAN-WRAP-20260727-001.yaml"
  - "product-contract/execution/TASK-RLS-INITPLAN-WRAP-20260727-001.yaml"
  - "product-contract/governance/decision_register.csv (append DEC-041 and DEC-042 only)"

authorized_behavior:
  - "Wrap parameterless RLS predicate calls in (SELECT ...) across 275 policies."
  - "Generate every ALTER POLICY statement from pg_policies into an explicit migration file."
  - "Add a btree index on public.visits(factory_id)."
  - "Change inspects_same_factory() to call (select auth.uid()) instead of auth.uid()."
  - "Render partial service on /field when only the assignment read fails."

prohibited:
  - "No wrapping of row-dependent calls — is_assigned_inspector(visit_id), inspects_same_factory(visit_id) and can_read_semantic_audit_object(...) must stay per-row or their meaning changes."
  - "No change to which rows any role may read, write or update."
  - "No policy added, dropped, renamed or re-scoped; ALTER POLICY only, so command, roles and permissive/restrictive are preserved."
  - "No DO-loop application of RLS changes — a generated loop cannot be reviewed by grep and was the trap recorded in the access-matrix verification work."
  - "No remote application outside the allow-listed non-production project iiozvqntawxfwbgffzqu."
  - "No rendering of the normal /field dashboard with an empty task list, which would print 0 for every count and assert a fact the page does not hold."

affected_scope:
  requirements: "None weakened. MVP1-FND-012 (per-widget fault isolation) is more fully met on /field than before."
  screens:
    - "/field — partial service replaces total failure."
    - "/planning — already carried the same class of fix at 74b481ec (countsAvailable)."
  apis: "None. PostgREST surface unchanged."
  states: "None."
  audit_events: "None added or removed."
  rls_semantics: "Unchanged — see equivalence_proof."
  mvp1_impact: "Unblocks two accepted MVP1 surfaces that could not complete their governed reads."
  mvp2_impact: "None."
  regression_impact: >-
    Every SELECT/INSERT/UPDATE path in the application traverses these policies,
    so the blast radius is the whole product. That is why equivalence was proven
    on live data before application rather than after.

equivalence_proof:
  method: >-
    For every rewritten clause, `old_expression IS DISTINCT FROM new_expression`
    was evaluated over every row of that clause's table, executed as superuser so
    RLS was bypassed and coverage was the entire table rather than only the rows
    a given identity can see. request.jwt.claims was set per identity so
    auth.uid() resolved normally inside both expressions.
  identities:
    - "inspector@mim.gov.sa (inspector)"
    - "inspector.test@mim.gov.sa (inspector + ops + reviewer)"
    - "inspector5@mim.gov.sa (inspector, second holder)"
  result:
    checks_run: 981
    distinct_clauses: 327
    row_mismatches: 0
    errors: 0
  conclusion: >-
    The rewrite changes evaluation count only. No role gained or lost a single
    row on any table under any of the three identities.
  caveat: >-
    The proof is exhaustive over the data present in iiozvqntawxfwbgffzqu on
    2026-07-27 and over three inspector-shaped identities. It is a data-driven
    proof, not a symbolic one; it does not by itself exclude a divergence that
    only a role combination absent from this database could expose. The
    transformation is nonetheless value-preserving by construction, because
    (SELECT f(constant_args)) and f(constant_args) differ only in how many times
    the planner evaluates them.

verification:
  post_application_predicate_scan:
    bare_has_any_role: 0
    bare_has_planning_capability: 0
    bare_auth_uid: 0
    total_policies: 311
  performance:
    query: "assignments + visits + factories + inspections + reviews, as inspector@mim.gov.sa, RLS on"
    before: "5728.286 ms"
    after: "44.200 ms"
    plan_change: "Per-row function filters replaced by InitPlan nodes evaluated once."
  static: "tsc --noEmit clean on apps/web."
  cleanup: "The temporary _rlsfix schema used to generate and verify was dropped; pg_namespace confirms zero residue."

open_risks:
  - id: "RISK-01"
    text: >-
      The /field partial-service branch compiles but was not exercised in a
      browser. The :3000 server holds no session and the :3400 session is a
      non-inspector identity; entering a password is not an action this agent
      performs. Runtime proof of that branch is outstanding.
    severity: "P2"
  - id: "RISK-02"
    text: >-
      No automated regression guards the wrapped form. A future migration can
      reintroduce a bare predicate and silently restore the per-row cost. A
      contract test asserting zero bare parameterless predicates in pg_policies
      is not yet written.
    severity: "P2"

effective_version: "main @ 688e9e9e"
