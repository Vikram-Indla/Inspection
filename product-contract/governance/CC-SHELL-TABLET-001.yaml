schema_version: "1.0"
change_control_id: "CC-SHELL-TABLET-001"
title: "Console shell at tablet / iPad size"
raised_by: "Claude Orchestrator"
raised_at: "2026-07-26T01:30:00+03:00"
state: "PROPOSED_AWAITING_SPONSOR_ACCEPTANCE (Q1 RESOLVED — option B)"
landed_commit: "f49c90ca"

sponsor_direction: >
  Product Owner, 2026-07-26: at iPad size — a real iPad or a responsive window —
  the console shows the hamburger AND a persistent sticky footer. The footer's
  options are the design's, not authored in code.

why_this_is_a_change_control_item: >
  There is no tablet specification for the console. SAQEEL Web Shell v5.dc.html
  declares no media queries; across all 42 web designs breakpoints appear once
  each (600, 820, 900, 1100, 1180, 1280) with no shared tablet system, and no
  design file mentions iPad or tablet. Every rule below is therefore a decision
  taken in code, not a transcription of accepted design. It is recorded here so
  it is visible rather than silently becoming precedent.

design_proposal:
  file: "SAQEEL Web Shell v5 - Tablet PROPOSAL.dc.html"
  project: "SAQEEL Design System (5e8154ad-aa9e-4e3d-9b7a-c66ca020bd61)"
  url: "https://claude.ai/design/p/5e8154ad-aa9e-4e3d-9b7a-c66ca020bd61?file=SAQEEL+Web+Shell+v5+-+Tablet+PROPOSAL.dc.html"
  note: >
    Written as a NEW page. SAQEEL Web Shell v5.dc.html is untouched and remains
    the accepted authority until the sponsor accepts this proposal. Code must
    never overwrite accepted design.

decisions:
  breakpoint:
    rule: "@media (max-width: 1024px), (pointer: coarse)"
    replaces: "899px"
    basis: >
      An iPad sat above 899px and received a narrow icon rail instead of a
      hamburger. The pointer term catches an iPad Pro in landscape, which is
      1366px wide — above any width breakpoint — but is still an iPad.
  bottom_bar:
    component: "components/field/FieldNav.tsx (ports designs/pwa/pwa/pwa-tabbar.js verbatim)"
    spec: "WA-PWA-TAB-r1"
    tabs: ["Home / الرئيسية", "My Tasks / مهامي", "Establishments / المنشآت", "Notifications / الإشعارات", "Account / حسابي"]
    scope: >
      Field channel: rendered once by field/layout.tsx, covering all 21 screens.
      Console: only for a field persona (Q1 option B) — a console persona never
      sees it, at any width.
    rejected_alternative: >
      A first attempt derived the tabs from SHELL_NAVIGATION (Dashboard,
      Planning, Inspection Rules, Users). That was invented, not designed, and
      was reverted before it reached main.
  topbar:
    change: "no change — the bell stays at every width for a console persona"
    history: >
      An earlier pass hid the bell at tablet size on the grounds that
      Notifications was a tab there. Q1 option B removed the console tab bar, so
      that reasoning no longer holds: the bell is a console persona's only route
      to notifications and must remain at every size. The rule and its
      .ax-topbar-hide-tablet class were reverted. A field-only persona still does
      not get the bell, because for them it genuinely duplicates a tab.

defect_fixes_included:
  - "Drawer wordmark was crushed into a 28px grid column and vanished; the drawer now resets brand to flex and keeps the design's 22px cap height."
  - "Drawer close control was a filled 44px box with a 24px glyph beside a 22px wordmark, so the X read as the heading; it is now a ghost 20px icon."
  - "A nav subgroup rendered as an unlabelled shield ('Inspection'): the collapsed rail hides label and chevron, and the drawer override restored the container but not its contents."
  - "The Insights group / AI Insights rail entry is removed (O-28 — never sponsor-agreed). The top-bar AI entry is unaffected."

open_question_for_sponsor:
  id: "CC-SHELL-TABLET-001-Q1"
  state: "RESOLVED"
  resolved_at: "2026-07-26T01:45:00+03:00"
  resolved_by: "Product Owner"
  ruling: "B — hide the bar for non-field personas; they keep the hamburger only."
  question: >
    The five tabs are field routes. For an Inspector that is correct — the
    access gate (TASK-WEB-CHANNEL-ACCESS-GATE-001, "Inspector = iPad") already
    routes them to the field channel. But an Operations or Leadership user on an
    iPad is on the console, and these tabs point at routes their role cannot
    open.
  implementation:
    - "The console tab bar renders only when isFieldOnlyPersona(roles) is true, so a console persona never sees field tabs."
    - >
      Consequence handled: a console persona now has no tab bar at any width, so
      the topbar notification bell must stay at every size — it is their only
      route to notifications. The tablet-hide rule added for the bell is
      removed, and the .ax-topbar-hide-tablet class with it.
    - "Field routes keep the bar from field/layout.tsx, which covers all 21 screens."
  verified:
    console_at_1024: "hamburger grid · tab bar absent · bell present"
    field_route: "one .field-nav, rendered by the layout"

propagation:
  files_changed:
    - "apps/web/src/app/astryx.css"
    - "apps/web/src/components/Shell.tsx"
    - "apps/web/src/components/ShellClient.tsx"
    - "apps/web/src/components/field/FieldNav.tsx"
    - "apps/web/src/lib/shell-navigation.ts"
  required_of_every_active_session: >
    Rebase on origin/main before your next commit. These five files are shared
    shell and are newer on main than on any card branch. Resolve them by taking
    main's version; keep your own card's files. Do not reintroduce an
    inline-style FieldNav — main's .field-nav implementation ports the design CSS
    verbatim (56px tabs, 60px above 834px, 34x2px active indicator, its own
    scroll spacer). Do not re-add the Insights nav group.
  do_not_build_further_tablet_rules: >
    Until this proposal is accepted, do not add new tablet behaviour. Align to
    the single breakpoint pair above rather than introducing a third.

closed_gaps:
  - id: "pwa-shell coverage"
    closed_by: "0c27103c"
    detail: >
      FieldNav was pasted per page, so 11 of 21 field screens rendered no tab
      bar and an inspector had no way out except browser-back. It now renders
      once in field/layout.tsx with the active tab resolved from the pathname.
      Verified in an authenticated session: all 21 screens return exactly one
      .field-nav. A stale comment on /field/[visitId] claiming the design omits
      the bar was also corrected — Execution Shell, Inspection Form and
      Preparation all load pwa-tabbar.js; only the pre-auth Login omits it.

  - id: "vendored designs are stale"
    closed_by: "bb425e22"
    detail: >
      SAQEEL Login v2.dc.html was live in the Claude Design project but never
      vendored, so the login had been built against the older SAQEEL
      Login.dc.html. v2 is now under designs/web/export-saqeel-web/ and the
      login card is synced to it: v2 story title, dismissible offline note,
      footer taken out of flow. Sign-out redirecting to the deleted
      /login/field route (a 404) was fixed in the same change.

known_gaps:
  - id: "browser verification ran against a stale server"
    detail: >
      Two processes were listening on port 4100: a next-server left from an
      earlier worktree, bound to 127.0.0.1, and the freshly built standalone
      server bound to *. The stale one won every 127.0.0.1 request, so browser
      checks made earlier in this session were served by old code. It is killed
      and the Login v2 result above was re-verified against a clean build, but
      any other browser evidence recorded before bb425e22 — including the
      tablet and tab-bar checks in this record — should be re-taken.
      Before trusting a browser check, confirm one listener:
      lsof -nP -iTCP:4100 -sTCP:LISTEN
