approval_evidence: >
  The Product Owner explicitly rejected generic remediation and directed this
  programme to the three core operational journeys only: Single Visit, Bulk
  Visit and Urgent Visit. The instruction authorizes governed implementation
  after packet activation and requires ambiguous business behaviour to stop at
  a specific decision rather than be guessed.

business_reason: >
  Repository reconstruction found concrete visit-blocking defects: a bulk plan
  cannot insert more than one supervision request under the current unique
  constraint; row-by-row supervision decisions can misstate the aggregate bulk
  plan status; returned visits cannot be corrected and resubmitted; and urgent
  target/admission behaviour conflicts with the versioned requirement
  baseline. This change control authorizes only evidence-backed remediation of
  these three journeys and their direct planning, supervision, assignment,
  notification and recovery boundaries.

