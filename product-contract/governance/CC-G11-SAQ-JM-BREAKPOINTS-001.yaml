do_not_touch:
  - "Shared main checkout and every pre-existing dirty file in it."
  - "Any route, module, schema, migration, RLS policy, test or evidence outside the allowlist."
  - "Field/PWA/iPad paths, including apps/web/src/app/(app)/field/**."
  - "Existing submitted inspection versions or historical audit/timeline rows."
  - "Provider credentials, secret values, production configuration or invented capacity/SLA/priority values."
  - "No widening beyond the resolved DEC-SAQ-JM-URGENT-ADMISSION-001 actor and unregistered-entry contract."
  - "Capacity rules beyond overlap until DEC-SAQ-JM-CAPACITY-001 is resolved."
  - "CSV/file-upload product work until DEC-SAQ-JM-BULK-UPLOAD-001 establishes it as a requirement."
  - "Standalone Saqeel Journey Monitor fixed claims until product proof exists."
  - "Commit, push, merge, deploy, remote DDL or shared-data mutation."

security_and_rls_constraints:
  - "Hidden navigation is never authorization; each action and RPC is server-authorized."
  - "Planner submits; a different authorized Supervisor decides and names the final Inspector."
  - "No client-provided role, actor, plan owner, assignment owner or aggregate status is trusted."
  - "Package versions remain published/locked and effective at authoritative submit."
  - "Returned correction never edits an immutable submitted inspection version."
  - "Bulk accepted-subset writes are atomic; no partial plan/visit/request/assignment/audit state survives failure."
  - "Idempotent retries return the original receipt only for the same actor and same canonical payload."
  - "Availability decisions are serialized so concurrent approvals cannot double-book an Inspector."
  - "RLS and capability denials remain fail-closed without disclosing out-of-scope visit data."
  - "No secret, raw provider error or private contact value appears in browser output, logs or evidence."

decision_gates:
  - id: "DEC-SAQ-JM-URGENT-ADMISSION-001"
    state: "RESOLVED_BY_PRODUCT_OWNER_2026-07-30"
    blocks: "NONE"
    questions:
      - "Does an Authorized Inspector create and immediately start an Urgent Visit, or only raise an escalation for Planner/Supervisor creation?"
      - "May an authorized creator enter a temporary/unregistered factory with minimum identity/location, or is Urgent Visit registered-only?"
    decision:
      - "An authorized Inspector may create an Urgent Visit."
      - "An unregistered factory is permitted for an Urgent Visit."
      - "Inspector-created Urgent Visits follow CR-043/CR-047/CR-048: create directly, self-assign and become available for immediate execution without a Visit Plan."
      - "Planner/Supervisor-created Urgent Visits retain the governed supervision/final-assignment path."
      - "Unregistered entry remains capability-gated and must preserve minimum identity/location, duplicate protection, provenance, audit and RLS; this does not authorize anonymous or unvalidated creation."
    approval_evidence: >
      Product Owner statement in the originating Codex task on 2026-07-30:
      "inspector can create visit, unregistered also permitted".
    conflict_evidence:
      - "CR-043..CR-048 and SCR-WEB-130 describe Planner/Inspector and unregistered operation."
      - "20260729022000 plus 20260729028000 implement Planner/Supervisor, registered-only and Inspector escalation-only."
  - id: "DEC-SAQ-JM-CAPACITY-001"
    state: "SPONSOR_DECISION_REQUIRED"
    blocks: "Capacity rules beyond overlap only"
    question: >
      What governed source and rules define Inspector capacity beyond time
      overlap: working hours, skills, territory, daily workload, travel or
      proximity? Until answered, enforce only repository-backed overlap and do
      not invent thresholds.
  - id: "DEC-SAQ-JM-BULK-UPLOAD-001"
    state: "SPONSOR_DECISION_REQUIRED_IF_REQUESTED"
    blocks: "CSV/file-upload feature only"
    question: >
      Is a file-upload/CSV import journey required? The current repository and
      route contract establish criteria-based factory selection and per-row
      eligibility, not an upload workflow.

