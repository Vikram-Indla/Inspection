  - "Playwright negative-auth suite + auth.setup (3 personas through new single sign-in): 6 pass / 0 fail (2026-07-12, re-run after persona removal)"
  - "Screenshots: login dark+light × EN+AR; /visits app page under light theme; /planning /admin under dark theme v2"
  - "Colour-law grep: raw hex confined to tokens.css (login + theme components clean)"
requirements_impact: >
  No accepted requirement, permission, state, audit event, or offline
  behavior weakened. SCR-PUB-000 retired and Nafath simulation removed by
  explicit sponsor instruction; Nafath live integration remains a future
  integration decision (was simulation-only, never release-complete).
  - id: "SAQEEL-09"
    decision: >
      Live Operations prototype BUILT at /operations/live (SCR-WEB-500,
      behind auth, linked from the Operations Center). Theme-aware CARTO
      basemap; three layers — region RAG zones (aggregate posture from
      risk_band/risk_score), factory pins with real seeded names SHAPED by
      band (▲ high / ◆ elevated / ● in-control, colourblind-safe), and
      inspectors on animated PROJECTED routes toward their target factory
      (prefers-reduced-motion aware). Inspector movement is a projection of
      the visit window, explicitly labelled "not live GPS (pending telemetry
      integration)" — DEC-002 (GIS telemetry) stays OPEN; no invented
      telemetry, no permanent mock claimed as complete. RLS scopes every row.
      Real factory names / live posture appear ONLY here (auth), never on the
      public login (SAQEEL-07).
