schema_version: "1.0"
record: "Sponsor-directed brand & theme change — Saqeel"
accepted_by: "Sponsor (Vikram Indla), session instruction 2026-07-12"
decision_id: "DEC-011"
scope:
  - id: "SAQEEL-01"
    decision: >
      Product brand is "Saqeel" (صقيل — polished/refined), full wordmark
      "صقيل | صناعي". Replaces the "Inspection Platform" ministry-green brand.
      Ministry attribution retained in footer/report headers.
  - id: "SAQEEL-02"
    decision: >
      One login page only. SCR-PUB-000 (public landing) retired; "/" redirects
      to /login. SCR-PUB-010 v2 is the single sign-in for all personas.
  - id: "SAQEEL-03"
    decision: >
      Nafath (simulated national access sub-flow) and the official-government
      green banner (GovBar) are removed from the sign-in experience.
      Credential auth (Supabase), ERR-AUTH-001 safe deny, anti-enumeration
      reset, and FND-003 auth audit events are retained unchanged.
  - id: "SAQEEL-04"
    decision: >
      Design-system theme v2: dark launch-film palette (near-black indigo
      canvas, violet primary, emerald live/success, amber warning, coral
      critical) qualified from "Factory Health Platform — Launch Film v2".
      DGA ministry-green theme (2026-07-12 morning) is superseded.
      All raw values live only in apps/web/src/app/tokens.css.
  - id: "SAQEEL-05"
    decision: >
      Type scale bumped app-wide: body 14→16px, field 16→17px, caption
      12.5→14px, heading steps re-derived; control heights +4px. Fonts:
      Space Grotesk (EN), IBM Plex Sans Arabic (AR), JetBrains Mono (labels).
  - id: "SAQEEL-06"
    decision: >
      REVISED (v3, design critique 2026-07-12 pm): login persona selector
      (Web Portal | Admin Console) REMOVED. It was security theatre — role is
      resolved server-side by /launch (RBAC-001..014), so a pre-auth self-
      declared "Admin" did nothing real and leaked the console's existence.
      Now a single sign-in posts to /launch for every user; role decides the
      landing. To answer "who signs into admin vs the portal" for evaluators,
      a collapsible DEMO ACCESS helper (DemoAccess.tsx) lists the seeded demo
      identities + which console each lands on, one-click fills the form.
      DEMO-ONLY; must be removed/gated before production. No RBAC weakening.
  - id: "SAQEEL-10"
    decision: >
      Demo/seed account domain changed @mim.example → @mim.gov.sa (login
      placeholder is name@mim.gov.sa). Renamed live via Auth Admin API
      (management PAT → service_role): all 6 auth.users + profiles.email
      updated; code/e2e/evidence (personas.ts, negative-auth, b10 script,
      migration 0011) updated to match. Known demo passwords set for admin
      (MimAdmin!2026), ops (MimOps!2026), approver (MimAppr!2026); planner/
      inspector/reviewer unchanged. STILL non-production demo credentials —
      G11 credential rotation still required before release.
  - id: "SAQEEL-07"
    decision: >
      Login brand panel is a rich STATIC illustration (SaqeelHero): the real
      KSA boundary (public GeoJSON, johan/world.geo.json SAU), regional posture
      zones, a highlighted Riyadh GEOFENCE, factory pins shaped by band
      (colourblind-safe), and inspectors mid-route — conveying "factories being
      inspected" on page one. Still safe for a public surface because it is a
      curated ILLUSTRATION: no live data, no real factory names, no counts, no
      real positions. The prior v3 "quiet decorative outline" was rejected by
      sponsor as too empty. LIVE data (real names, real posture, moving
      inspectors) remains only behind auth on /operations/live (SAQEEL-09).
      Removed the "Industrial Inspection Platform" descriptor line; brand-panel
      footer reads "صقيل · Saqeel".
  - id: "SAQEEL-08"
    decision: >
      Light mode is a first-class peer theme (sunlit field iPads, older gov
      hardware). tokens.css now carries dark (brand default) + light palettes;
      resolution = explicit [data-theme] > OS prefers-color-scheme > dark.
      A persisted toggle (ThemeToggle, no-flash ThemeScript in <head>) sits on
      the login top bar and the app shell nav. Reduced-motion honoured.
      Raw values remain confined to tokens.css.
