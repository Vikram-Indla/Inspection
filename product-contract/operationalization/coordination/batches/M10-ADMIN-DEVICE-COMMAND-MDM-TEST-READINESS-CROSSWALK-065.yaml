future_test_layers:
  DB_RLS:
    purpose: Authenticated persona, row visibility and direct table/RPC mutation boundaries.
    evidence: Transactional result, before/after rows, role identity and zero-side-effect assertions.
  DB_LIFECYCLE:
    purpose: Locked transition, version/precondition, idempotency, audit atomicity and terminal-state rules.
    evidence: Positive and negative transactional receipts with concurrent-session cases.
  SERVER_ACTION:
    purpose: Input validation, session expiry, neutral errors, correlation identity and revalidation behavior.
    evidence: Named action/API result plus database and provider-spy side-effect assertion.
  ADMIN_BROWSER:
    purpose: /admin/devices persona behavior, commands, confirmation, errors, evidence history and degraded states.
    evidence: Playwright trace plus stable screenshot/video for each governed state.
  FIELD_BROWSER:
    purpose: Enrollment, package download/open/cached-open/sync/submit enforcement and offline replay.
    evidence: iPad-profile browser trace, local-store/server rows and denial/recovery screenshots.
  PROVIDER_CONTRACT:
    purpose: Approved provider dispatch, authentication, correlation, retry, rejection and receipt stages.
    evidence: Genuine non-production provider receipt; mocks may test shape but cannot certify provider runtime.
  VISUAL_I18N_A11Y:
    purpose: Accepted design, EN/AR, RTL/LTR, light/dark, reflow, keyboard and semantic accessibility.
    evidence: Governed design fingerprint, fixed-view comparison, axe/semantic results and screenshots.
  REGRESSION:
    purpose: Package, submission, immutable evidence, offline isolation and adjacent admin route preservation.
    evidence: Required focused and protected-suite run receipts with zero unexplained failures.

fixture_prerequisites:
  deterministic_data:
    owner: Seeder and data-fixture engineering lease after contract approval
    required:
      - one device per state: pending, trusted, suspended, revoked, wipe_pending, wiped
      - assigned and unassigned devices with stable non-production identifiers
      - compliant and non-compliant app versions
      - fresh, stale, absent and mismatched evidence cases
      - active, expired, invalidated and cached package manifests
      - empty, pending, conflicted, failed and replayable outbox/sync cases
      - commands in every approved lifecycle state with independent actor identities
    restriction: No seed may manufacture a genuine provider acknowledgement or be cited as production evidence.
  personas:
    owner: Identity/RBAC governance plus test-fixture engineering
    required:
      - unauthenticated
      - inspector assigned self
      - unrelated authenticated user
      - auditor
      - ops if approved
      - security_admin if approved
      - separate requester and approver if required
  provider:
    owner: Sponsor plus security/integration owner
    required:
      - approved provider or explicit formal hold
      - authenticated non-production endpoint
      - command, correlation, idempotency and receipt schemas
      - accepted, rejected, timeout, mismatched, duplicate and late receipt fixtures
    restriction: Provider outcome, timing and retries cannot be invented.
  design:
    owner: Claude Design owner plus sponsor
    required:
      - stable CD-056 route-specific package/frame identity
      - accepted desktop, tablet and narrow reflow
      - EN/LTR and AR/RTL
      - loading, empty, denied, stale, conflict, provider-unavailable, failed-receipt and terminal states

