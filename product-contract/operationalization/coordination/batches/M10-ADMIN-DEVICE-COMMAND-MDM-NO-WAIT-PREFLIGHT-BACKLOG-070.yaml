    control: DES-02 uses null state slots only; D01..D09 semantics stay blocked.
  DB1_and_DB2:
    risk: Same tables/RPCs/migrations.
    control: Read-only inventories may run in parallel; future mutations combine or serialize under one DB owner.
  service_and_UI:
    risk: Shared mvp3-actions, action form and error/i18n files.
    control: Preflights read only; future shared files have one integration owner.
  Field1_and_Field2:
    risk: Shared offline store/replay/package files.
    control: Read-only call graphs may run in parallel only after DB2 inventory; future mutations serialize shared files.
  QA_and_seeder:
    risk: Shared live fixtures and cleanup.
    control: This backlog authorizes neither; future runs require namespaces and one fixture coordinator.
  evidence:
    risk: Lower-grade evidence relabeled as acceptance.
    control: EVD-01 defines empty slots and preserves evidence grades.

