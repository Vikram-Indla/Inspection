queue_rules:
  SAFE_NOW:
    definition: Read-only inspection, crosswalk or template preparation that does not encode an unanswered outcome.
    allowed_output: New coordination packet in the owning review namespace only.
  BLOCKED:
    definition: Any action that selects policy, changes authority, mutates design/product/data/tests, contacts a provider, uses credentials, executes shared live fixtures or promotes completion.
  completion_rule: A SAFE_NOW task closes only its readiness question and remains 0/478.
  handoff_rule: Each output names exact unresolved facts and never converts absence into a default.
  collision_rule: Only the orchestrator dispatches one owned coordination packet at a time per boundary; reviewers do not edit source.

