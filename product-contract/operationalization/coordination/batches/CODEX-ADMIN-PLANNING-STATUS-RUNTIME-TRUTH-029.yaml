status: RETURN_BLOCKED_ZERO_COMPLETION_CREDIT

decision:
  recommendation: RETURN
  implementation_gate: BLOCKED
  completion_credit:
    canonical_requirement_rows: 0
    acceptance_rows: 0
    screens: 0
    accepted_designs: 0
  three_figure_status:
    built_requirements_credited: 0
    independently_verified_requirements_credited: 0
    fully_accepted_requirements_credited: 0
  rationale: >-
    The route and a live published visit-lifecycle-v4 row are real, and the
    currently observed row displays the five canonical Planning statuses plus
    the registered publish, return, cancel and expiry transitions. That visible
    agreement is not executable authority. The route selects the newest
    published row across every workflow object without effective/scheduled
    activation resolution, and no Planning, Operations or Field consumer reads
    this config row. Actual Planning status changes remain dispersed across
    RPCs, application actions, an expiry function and permissive visits UPDATE
    policies. Those paths can bypass the displayed graph, and several
    application paths commit the status before the semantic lifecycle record or
    notification. The source registry also permits administrative mutation of
    published rows without an immutability trigger, complete maker-checker
    enforcement or a config-version audit trigger. The provider fallback
    assigns canonical transition IDs to materially wrong execution-like states.
    Reviewer and Planner deep links succeed despite Admin-only shell navigation,
    Arabic/RTL renders the route content in English, the exact route design and
    screen identity are absent, and the focused test is insufficient and not
    green. No requirement or acceptance row can receive completion credit.

