p0_findings:
  - id: PLN-ST-P0-001
    finding: The displayed config version is not the executable Planning transition authority.
    impact: Admins can read or publish a graph that Planning, Operations and Field never consume.
    blocks: [REQ-R0C-00204, REQ-R0C-00205, WA-M9-AC-001, WA-M9-AC-005]
  - id: PLN-ST-P0-002
    finding: The route resolves the newest published workflow across all objects and ignores scheduled activation.
    impact: A different workflow object or future successor can be shown as current Planning rules.
    blocks: [WA-M9-AC-001, WA-M9-AC-002, WA-M9-AC-005]
  - id: PLN-ST-P0-003
    finding: The degraded fallback reuses canonical IDs for materially incorrect execution-like transitions.
    impact: Provider loss turns into authoritative-looking misinformation.
    blocks: [REQ-R0C-00204, REQ-R0C-00205, WA-M9-AC-001, WA-M9-AC-002]
  - id: PLN-ST-P0-004
    finding: Authorized visits UPDATE policies do not enforce valid transition pairs or terminal states.
    impact: Direct Data API or another authorized path can bypass final-state and pre-start rules.
    blocks: [REQ-R0C-00204, REQ-R0C-00205, REQ-R0C-00192, REQ-R0C-00207, WA-M9-AC-002, WA-M9-AC-005]
  - id: PLN-ST-P0-005
    finding: Return, republish and cancel actions commit status before required lifecycle and notification consequences.
    impact: A visible Planning state can exist without complete semantic evidence or required notification.
    blocks: [REQ-R0C-00186, REQ-R0C-00188, REQ-R0C-00191, REQ-R0C-00202, REQ-R0C-00203, REQ-R0C-00237, WA-M9-AC-005]
  - id: PLN-ST-P0-006
    finding: Published config_versions rows are not protected from generic authorized UPDATE.
    impact: The page's immutable-governed-source claim is false at the database boundary.
    blocks: [WA-M9-AC-001, WA-M9-AC-002, WA-M9-AC-005]
  - id: PLN-ST-P0-007
    finding: Maker-checker and source audit are incomplete and bypassable.
    impact: A published workflow may have no approver or immutable config-change audit lineage.
    blocks: [WA-M9-AC-002, WA-M9-AC-005]
  - id: PLN-ST-P0-008
    finding: The route parser is incompatible with the normalized workflow-library payload.
    impact: A valid current workflow definition can render incorrectly or fail instead of degrading safely.
    blocks: [WA-M9-AC-001, WA-M9-AC-002]

