source_and_version_truth:
  table: public.config_versions
  page_query:
    engine: workflow
    status: published
    object_id_filter: ABSENT
    payload_object_filter: ABSENT
    effective_from_lte_now: ABSENT
    scheduled_from_resolution: ABSENT
    ordering: effective_from_desc
    limit: 1
  active_version_failure: >-
    config_versions supports multiple workflow objects and scheduled activation.
    approvePublishWorkflow marks a future-scheduled row published and gives it
    effective_from=now. The page can therefore display a different object or a
    not-yet-active successor as current.
  live_observation:
    version_label: visit-lifecycle-v4
    effective_from_display: 7/11/2026
    states: [draft, published, returned, cancelled, expired]
    transition_rows:
      - STM-PLAN-002
      - STM-VIS-001
      - STM-VIS-002
      - STM-VIS-003
      - republish
    result: CURRENT_ROW_VISIBLE_AND_SEMANTICALLY_CLOSE_BUT_NOT_BOUND_TO_RUNTIME
  payload_shape:
    route_expected: "states:string[]; transitions with guard:string and side_effects:string[]"
    normalized_library: "states:WfState[]; transitions with guards:string[] and fx:WfSideEffect[]"
    parser_behavior: Checks only that states and transitions are arrays.
    impact: >-
      A valid normalized workflow row may render object children, omit guards
      and side effects, or fail at render time instead of degrading safely.
  fallback:
    trigger: Query error, no published row or non-array payload.
    advertised_as: Static canonical visit-lifecycle-v4 copy that may be stale.
    actual_states: [planned, acknowledged, in_execution, completed, closed]
    result: MATERIAL_MISINFORMATION_NOT_SAFE_DEGRADATION

