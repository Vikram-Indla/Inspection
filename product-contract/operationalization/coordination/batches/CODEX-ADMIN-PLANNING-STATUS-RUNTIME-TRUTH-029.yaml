exact_prerequisites:
  policy_and_contract:
    - Select one executable Planning transition authority: config-driven runtime or a verified compiled projection of existing guards.
    - Define separate Visit Plan, Planning Visit, operational and execution state domains.
    - Decide the exact viewer persona and whether unpublished guards/capabilities are sensitive.
    - Define mandatory atomic consequences versus durable-outbox consequences for each transition.
    - Define in-flight object binding when a successor rule version activates.
  governed_mapping:
    - Register one exact screen-catalogue row for /admin/planning/status.
    - Replace CR-001..CR-478 with the direct and dependent IDs in this packet.
    - Accept and fingerprint a route-specific design without reassigning WA-DES-014 from /admin/workflows.
  database_and_service:
    - Add a non-bypassable valid-transition boundary for every Planning state change.
    - Bind the read model to one Planning object, scope and active effective version.
    - Enforce published config immutability, complete maker-checker and append-only change audit.
    - Make state, semantic lifecycle evidence and required consequences atomic or durably correlated.
    - Preserve existing publish, duplicate, assignment, package, expiry and concurrency guards.
  route:
    - Remove the fabricated fallback and show explicit unavailable/degraded truth.
    - Support exactly one approved payload schema or a lossless, tested adapter.
    - Display object, version ID, effective/scheduled state, source fingerprint and provenance.
    - Separate aggregates and derive capability explanations from governed authority.
    - Add explicit loading, empty, malformed, stale, unauthorized and dependency-impact states.
  qa:
    - Add route-focused source, active-version, RLS, transition-parity and negative tests.
    - Probe every invalid state pair through authenticated Data API and canonical RPC paths.
    - Prove source immutability, maker-checker, audit, rollback and concurrency.
    - Prove Planning, Operations and Field consumers against the same authority or verified projection.
    - Certify EN/LTR and AR/RTL, light/dark, desktop/tablet/narrow, keyboard/focus, accessibility and negative states.
    - Require qualified native-Arabic review; automation may not self-certify it.

rollback_and_stop_conditions:
  rollback: No runtime rollback is required because this packet changed no product or data.
  packet_rollback: Remove only this unique YAML packet before integration if Codex lead returns it.
  stop_conditions:
    - executable transition authority remains undecided
    - route can select a non-Planning or future-scheduled workflow
    - displayed rules and executable guards can diverge
    - invalid transitions remain possible through an authorized API path
    - published source remains mutable or unaudited
    - required consequences can partially commit
    - viewer persona, in-flight binding or aggregate boundaries are invented
    - exact route design and screen identity remain ungoverned
    - shared data proof lacks an isolated approved lease

