candidate:
  slice_id: M2-VS-001
  name: Read-only Visit Trace
  business_outcome: >
    A planning-authorized business user can enter Planning, view only the visits
    permitted by RLS, open one visit, and inspect its lifecycle and audit history
    without any mutation path.
  why_smallest_coherent: >
    It reuses existing routes, reads, and detail timelines while excluding KPI,
    advanced-search, filter, pagination, assignment, scheduling, notification,
    attachment, note, and workflow-mutation claims.
  backend_change: NONE
  schema_change: NONE
  rls_change: NONE
  api_change: NONE
  routes:
    - /planning
    - /planning/visits?wa_preview=1
    - /planning/visits/[id]?wa_preview=1

