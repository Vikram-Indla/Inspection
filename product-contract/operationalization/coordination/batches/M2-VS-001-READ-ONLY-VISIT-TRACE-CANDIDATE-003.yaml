existing_implementation_basis:
  routes_and_components:
    - path: apps/web/src/app/(app)/planning/visits/page.tsx
      role: Double-gated preview wrapper for the existing visits page.
    - path: apps/web/src/app/(app)/planning/visits/[id]/page.tsx
      role: Double-gated preview wrapper for existing visit detail.
    - path: apps/web/src/app/(app)/visits/page.tsx
      role: RLS-scoped read model for visits and related planning data.
    - path: apps/web/src/app/(app)/visits/VisitsBoard.tsx
      role: Existing list presentation; requires a true read-only preview mode.
    - path: apps/web/src/app/(app)/visits/[id]/page.tsx
      role: Existing visit graph, lifecycle, location, package, inspection, and audit read model.
    - path: apps/web/src/app/(app)/visits/[id]/DualStateRibbon.tsx
      role: Existing plan-versus-operational state presentation.
    - path: apps/web/src/lib/planning/access.ts
      role: Existing fail-closed planning capability resolver to reuse.
  existing_service_evidence:
    - "supabaseServer reads visits under RLS."
    - "Detail reads audit_events and append-only visit lifecycle/location records."
    - "Planning access resolver exposes planning_access_class and has_planning_capability."
  defects_blocking_current_claim:
