read_only_and_audit_contract:
  allowed:
    - RLS-scoped visit list read
    - RLS-scoped visit detail read
    - lifecycle timeline read
    - audit history read
  forbidden:
    - bulk actions
    - assignment
    - scheduling
    - status transition
    - attachment mutation
    - notes mutation
    - notification mutation
    - page-load expiry or workflow mutation
  audit_expectation:
    - "No new audit event is created by list or detail viewing."
    - "Existing lifecycle and audit rows are rendered without mutation."
    - "Update/delete attempts against immutable history are denied by existing database/RLS controls."

