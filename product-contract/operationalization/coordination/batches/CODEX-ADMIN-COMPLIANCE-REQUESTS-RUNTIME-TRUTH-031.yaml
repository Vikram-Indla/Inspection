database_lifecycle_truth:
  governed_tables: 8
  statuses:
    request: [draft, pending_review, returned, partially_approved, approved, rejected, cancelled]
    component: [draft, pending_review, returned, approved, rejected, auto_rejected, published]
  entity_kinds: [regulation, inspection_item, violation, penalty]
  positive_controls:
    - Submitted revisions cannot be edited or deleted.
    - Submitted component content and dependency graphs are immutable.
    - Decisions, entity versions and publications are append-only.
    - Direct authenticated DML is revoked.
    - Request rows are locked during transition RPCs.
    - Maker-checker is enforced in review and publication RPCs.
    - Parent rejection recursively auto-rejects descendants.
    - Approved branches are ordered Regulation to Item to Violation to Penalty.
    - Publication inserts version then switches head in one RPC transaction.
    - Existing active head remains unchanged when the RPC fails.
    - Audit events, correlation IDs and publication audit references are stored.
  blocking_gaps:
    - No typed schema or canonical field validation exists beyond JSON object and parent-key checks.
    - No release/effective-date validation, Scheduled state or automatic activation exists.
    - No package, template, section, evidence-rule or action-form entity is governed by this engine.
    - Direct legacy Admin authoring is not prevented or routed exclusively through CCR.
    - Draft updates have no optimistic concurrency token; concurrent edits are last-write-wins.
    - Component-level Return is absent although the canonical journey requires it.
    - Publication heads are not authoritative inputs to Compliance Library, Planning, Package or Field execution.
    - Request status remains Approved or Partially Approved after publication and the UI can continue to expose Return, Reject or Publish actions without a certified post-publication lifecycle.
  audit_and_evidence_custody:
    generic_row_audit_triggers: PRESENT
    correlated_business_audit: PRESENT_FOR_CORE_TRANSITIONS
    immutable_decision_history: PRESENT
    immutable_publication_history: PRESENT
    source_file_or_attachment_custody: NOT_IMPLEMENTED_BY_CCR_ENGINE

