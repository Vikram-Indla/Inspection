current_runtime_capability:
  library:
    - Reads packages and all nested package versions.
    - Shows version status, publication date, definition size and derived older-than-current state.
    - Shows source-read time and a manual refresh/reconciliation path.
    - Shows server-computed pinned impact, shared-item fan-out and definition diff.
    - Creates a successor draft version and reasoned deactivation.
  designer:
    - Authors ordered bilingual sections and section mandatory state.
    - Adds, removes and reorders active reusable item codes.
    - Authors required, optional and conditional relationships.
    - Authors visible_when and mandatory_when_visible.
    - Authors evidence override from accepted types.
    - Authors response violation and action-form references.
    - Authors action forms, blocking state and governed template version reference.
    - Offers a read-only projection; it is not a simulator.
    - Saves draft definitions only and blocks local duplicate/blank-title errors.
  publication:
    - Revalidates section, item, regulation, condition, cycle, evidence, action-form, template, violation and penalty dependencies.
    - Freezes item, violation and template snapshots.
    - Publishes through a row-locking SECURITY DEFINER RPC.
    - Requires a distinct authenticated checker.
    - Retains old effective windows and in-flight version pins.
  honest_boundaries:
    - Package footprint/fingerprint metrics are not claimed.
    - Visual or persisted simulation is not claimed.
    - No freshness threshold is invented.

