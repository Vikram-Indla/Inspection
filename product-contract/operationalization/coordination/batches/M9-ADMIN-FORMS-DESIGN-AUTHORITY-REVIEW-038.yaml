responsive_theme_language_accessibility:
  responsive:
    current_code: >-
      Three columns collapse to two at 1100px and one at 720px. The version
      table becomes stacked cards at 720px.
    required_proof:
      - no page-level horizontal overflow at all seven viewports
      - package/version context remains visible while editing
      - long Arabic, codes, conditions and template names remain bounded
      - save, validation and final action form are never hidden by sticky UI
      - 200 and 400 percent browser zoom
  theme:
    current_code: semantic tokens and inherited shell theme
    required_proof:
      - light and dark contrast
      - error, warning, disabled, immutable and focus parity
      - no purple fixture palette or fixed design-export colors
  language:
    current_code:
      - useT strings with document-level RTL
      - section English and Arabic fields
      - bdi for codes and versions in key areas
    required_proof:
      - all editor, dependency, validation, impact and history states in approved Arabic
      - logical reorder semantics and icon mirroring
      - stable LTR isolation for IDs, versions, dates and condition grammar
      - approved SAQEEL bilingual wordmark, never Arabic-only صناعي on English
  accessibility:
    current_strengths:
      - labelled form fields
      - 44px controls
      - semantic fieldset for selected item rules
      - read-only preview inputs are disabled
      - result focus target and live alert/status regions
      - reduced-motion CSS
    gaps_or_unproven:
      - selected structure uses aria-current rather than a complete listbox/tree contract
      - reordering does not announce the new position
      - validation issues do not link/focus the exact failing editor control
      - add/remove/reorder focus recovery is not explicit
      - creator/checker and immutable consequences are not exposed before action
      - preview disabled controls may be skipped without an equivalent semantic summary
      - automated tests do not prove full keyboard or screen-reader task completion

test_truth:
  current_suite_strengths:
    - authenticated package hierarchy and immutable banner
    - read-only preview inertness
    - impact unavailable-versus-zero
    - Arabic RTL
    - 1440, 1024 and 390 overflow checks in light/dark
    - 44px visible actions
    - source-level authoring and validation wiring
  limitations:
    - no real draft save and refresh persistence
    - no real maker-versus-checker publication journey
    - no real stale concurrent-edit collision
    - no template/violation dependency read-error browser proof
    - no future-effective scheduled-state proof
    - no parent-package creation proof
    - no audit-history UI proof
    - no 412 or 320 runtime viewport in the focused suite
    - no complete keyboard, focus recovery, screen-reader or 200/400 percent zoom proof
    - source string assertions are not runtime behavior evidence
  certification_status: CURRENT_IMPLEMENTATION_EVIDENCE_ONLY_NOT_DESIGN_ACCEPTANCE

