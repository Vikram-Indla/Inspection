version_maker_checker_immutability_truth:
  versioning:
    definition_storage: package_versions.definition
    successor_lineage: supersedes_id
    effective_window: effective_from_and_effective_to
    open_governed_constraint: one_published_or_locked_version_without_effective_to_per_package
    in_flight_binding: visits_and_inspections_retain_package_version_id
  maker_checker:
    database_constraint: approved_by_is_null_or_differs_from_created_by
    publish_trigger: published_or_locked_requires_approved_by
    publish_rpc: rejects_missing_creator_and_same_actor
    ui_actor_visibility: absent
    ui_self_approval_prevention: absent
    actual_behavior: >-
      Both writer roles see Approve and publish. The maker discovers the block
      only after submitting; creator/checker identity and review handoff are not
      shown on the page.
  immutability:
    definition_and_label_guard: proven_for_published_or_locked
    deactivated_row_guard: proven
    audit_trigger: proven_on_package_versions
    full_row_immutability: not_proven
    reason: >-
      The published guard protects definition and version_label only. Generic
      writer RLS can still attempt changes to other package_versions fields;
      only the governed deactivation transition has an explicit exception
      contract. The UI statement must say exactly what the database protects.
  scheduled_semantics:
    persisted_state: future_effective_from_with_status_published
    runtime_selection: currentPublished_filters_by_effective_window
    ui_label: published
    gap: >-
      A future-effective version is logically scheduled but is visually labelled
      published. The old version remains current until its effective_to window
      closes, but the lifecycle language is misleading.

audit_concurrency_and_data_truth:
  audit:
    package_versions_trigger: present
    definition_save_audited: true
    publish_audited: true
    deactivation_audited: true
    page_reads_audit_history: false
    broad_audit_read_roles:
      - auditor
      - ops
      - security_admin
      - leadership
      - reviewer
      - planner
    package_writer_audit_read: not_proven_through_audit_events_RLS
    implication: >-
      Append-only package audit exists, but Full history is not exposed on this
      route and package writers do not have broad audit_events read authority.
  concurrency:
    publish_row_lock: present
    version_label_unique_constraint: present
    draft_save_status_guard: present
    draft_row_version_or_updated_at_token: absent
    draft_compare_and_set: absent
    risk: >-
      Two editors can save the same draft sequentially and the later write can
      silently overwrite the earlier definition. The displayed stale notice is
      not concurrency protection.
  data_sources:
    - packages
    - package_versions
    - inspection_items
    - regulation_clauses
    - configuration_templates
    - violation_codes
    - penalty_mappings
    - user_roles
    - package_version_impact_RPC
  isolated_failures:
    package_read: distinct_fatal_error
    item_bank_read: distinct_partial_degradation_and_editor_pause
    role_read: fail_closed_mutations_hidden
    impact_rpc: unavailable_never_zero
  conflated_failures:
    configuration_templates: read_error_becomes_empty_choice_set
    violation_codes: read_error_becomes_empty_choice_set
    profiles_or_maker_checker_identity: not_read
    audit_history: not_read
  creation_gap: >-
    The route can create a package version but cannot create the parent package.
    Its verified-empty state explicitly says package creation is not exposed.
    CR-454 must not be certified from New draft alone without a governed package
    creation path or an approved external ownership decision.

design_versus_code_delta:
  registered_design_has_code_lacks:
    - Full-page dedicated designer route and breadcrumb.
    - Direct editing of question wording and guidance within the package designer.
    - Explicit answer-outcome matrix presentation.
    - Visible maker-checker checklist.
  code_has_registered_design_lacks:
    - Embedded package/version lifecycle context.
    - Ordered multi-section and item authoring.
    - Conditional, evidence, action-form and governed-template authoring.
    - Real impact, frozen dependency snapshots and neutral unavailable states.
    - Responsive three-to-two-to-one-column behavior.
  registered_design_defects:
    - Arabic-only SAQEEL and صناعي branding on an English screen.
    - Unrelated Risk Settings navigation.
    - Fixed Fire Safety, item, violation, response and policy values.
    - Score/weight presentation without settled DEC-001/DEC-028 authority.
    - Self-assessment promise not proven by this route.
    - Static controls do not specify save, error, conflict or recovery contracts.
    - Only one narrow breakpoint and no complete RTL/accessibility evidence.
  current_runtime_defects:
    - Dedicated route catalogue mismatch.
    - No parent-package creation.
    - No draft optimistic concurrency.
    - Template and violation read errors look like true-empty option lists.
    - Future-effective version labelled published rather than scheduled.
    - Creator/checker provenance and self-approval state not shown.
    - Published immutable wording overstates the exact protected columns.
    - Full package audit history not visible to the authoring persona.
    - Preview is a projection, not required happy/exception simulation.
    - Scoring controls remain exposed while DEC-001/DEC-028 authority is unresolved.

