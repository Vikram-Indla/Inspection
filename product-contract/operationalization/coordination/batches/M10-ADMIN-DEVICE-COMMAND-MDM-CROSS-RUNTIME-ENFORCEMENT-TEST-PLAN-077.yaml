    requirement: Sponsor records all null policy answers used by a test; no test substitutes a guessed expected result.
  - gate_id: DEV-XRT-GATE-02
    requirement: Database command/package/device schema and generated types are implemented under one recorded lease.
  - gate_id: DEV-XRT-GATE-03
    requirement: Field consumes the canonical manifest/device authority at open, cache, replay and submit.
  - gate_id: DEV-XRT-GATE-04
    requirement: Approved provider and authenticated receipt contract exist, or provider-live tests remain skipped and completion remains blocked.
  - gate_id: DEV-XRT-GATE-05
    requirement: Deterministic seeded fixtures exist, but genuine provider/device evidence is produced only by the real non-production integration.
  - gate_id: DEV-XRT-GATE-06
