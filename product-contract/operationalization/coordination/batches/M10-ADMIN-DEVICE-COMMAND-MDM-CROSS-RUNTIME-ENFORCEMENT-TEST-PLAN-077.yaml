pass_rule:
  - Every case must pass all listed layers; a browser-only or database-only result is incomplete.
  - A skipped provider-live case blocks provider-dependent completion rather than becoming a pass.
  - Any unauthorized server mutation, silent local-data loss, duplicate effect, false completion or missing immutable evidence is a P0 failure.
  - Existing readiness, execution, submission, offline isolation and immutable evidence regressions must remain green.
  - Completion requires the accepted design revision, exact code revision, database migration set, provider contract version and evidence bundle.

disposition:
  result: READY_AS_FUTURE_PLAN_NOT_EXECUTABLE
  blockers:
