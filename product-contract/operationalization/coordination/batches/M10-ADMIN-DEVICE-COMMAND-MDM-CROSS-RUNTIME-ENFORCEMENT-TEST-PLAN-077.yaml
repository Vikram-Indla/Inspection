preservation_floor:
  - Only the assigned, enrolled, trusted and app-compliant device may download, open, replay or submit an official package.
  - Pending, suspended, revoked, wipe-pending and wiped devices fail closed.
  - Package invalidation must govern server open, cached open, replay and submit without silently destroying recoverable work.
  - A remote request, provider acceptance, device acknowledgement and verified effect are separate facts.
  - Queued work is retained until an approved policy explicitly authorizes another outcome.
  - No provider behavior, timeout, retry, purge, grace period, exception or completion may be inferred.
  - Every denial proves zero unauthorized state change and zero duplicate provider effect.
  - Every accepted effect proves actor, device, command, correlation, reason, governing version, before/after, time and genuine receipt.

proof_environments:
  database:
    requirement: Real disposable Supabase test database with production-equivalent migrations, RLS and authenticated personas.
    prohibited: Service-role mutation used as proof of a persona-authorized operation.
  admin_browser:
    requirement: Real /admin/devices browser session with approved requester/approver identities and persisted backend rows.
    prohibited: DOM-only fixtures cited as command or provider proof.
  field_browser:
    requirement: Real browser IndexedDB, real authenticated Field session and installed-PWA-capable context.
    prohibited: In-memory cache substitute cited as offline proof.
  field_device:
    requirement: Approved non-production enrolled iPad/device for provider acknowledgement, wipe and local-data-effect certification.
    prohibited: Browser storage deletion or database mutation cited as genuine remote device effect.
  provider:
    requirement: Approved authenticated non-production provider endpoint and signed/verifiable receipts.
    prohibited: Mock, seed, hand-written receipt or intercepted success cited as provider runtime proof.
  network:
    requirement: Controlled browser/device offline mode and transport interruption with real local storage and server reconciliation.
    prohibited: Fabricated healthy/completed response during an outage.

no_mock_certification_rules:
  - Mocks may validate adapter parsing, UI state rendering and zero-dispatch negative paths only.
  - Mock/provider-spy success cannot certify accepted, acknowledged, applied, wiped, invalidated or completed.
  - Seeded command and receipt rows may prepare visual fixtures but cannot certify provider delivery or device effect.
  - Screenshots prove presentation only; they require matching database, local-store and receipt evidence.
  - Browser route interception cannot certify RLS, RPC atomicity, package denial, replay denial or submission denial.
  - A genuine receipt must authenticate issuer, correlation, device identity, command, stage, occurrence time and integrity.
  - Completion requires the real Field/device observable effect plus the correlated immutable server evidence.

