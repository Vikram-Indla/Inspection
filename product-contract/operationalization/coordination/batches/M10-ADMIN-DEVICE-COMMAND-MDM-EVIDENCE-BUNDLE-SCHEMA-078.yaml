browser_capture_contract:
  all_browser_cases:
    - Begin recording before navigation or network transition.
    - Capture the actor/persona indicator, route, source state, action and final state.
    - Save Playwright trace, screenshot, network log and console log from the same run.
    - Assert zero uncaught console errors; approved diagnostic warnings are enumerated explicitly.
    - Machine identifiers use bidi isolation and remain legible in both directions.
  i18n:
    - Repeat the focal state in EN/LTR and reviewed AR/RTL.
    - Record translation authority revision and prove no English fallback in Arabic.
    - Long reasons, names and identifiers must not clip or reverse semantic order.
  responsive:
    - Capture desktop governed viewport, 1024, 412, 390 and 320.
    - Prove action/evidence access without horizontal page loss or hidden completion state.
    - Device history may scroll within an accepted container only when the design authority allows it.
  accessibility:
    - Keyboard-only action, confirmation, denial, retry and evidence traversal.
    - Focus capture before/after every error or asynchronous status change.
    - Screen-reader semantic tree includes status, actor, command stage and recovery.
    - Run automated accessibility plus manual contrast, forced-colors, reduced-motion and touch-target checks.

network_console_contract:
  network:
    - HAR or equivalent records request method, safe URL, status, correlation and duration.
    - Authorization headers, cookies, tokens and signed secrets are removed before shareable export.
    - Raw restricted provider receipt remains separate from the redacted network view.
    - Zero-dispatch cases include provider gateway evidence proving no outbound command.
  console:
    - Capture browser console from navigation start through final assertion.
    - Raw database/provider error text must not appear in user-facing console telemetry without approved redaction.
    - Expected controlled test diagnostics are listed in case-result.yaml; every other error fails the case.

database_audit_rollback_contract:
  before_after:
    - device row/version
    - command and approval rows
    - manifest/invalidation rows
    - package access events
    - inspection and submission version rows
    - relevant evidence rows
    - immutable audit/receipt rows
  atomicity:
    - Use one correlation identity across action, database, provider and browser evidence.
    - Negative cases prove zero unauthorized row/provider/local effect.
    - Positive cases prove exactly the approved changes and no unrelated delta.
  rollback:
    - Cleanup may remove test fixtures only through the approved cleanup plan.
    - Immutable historical rows are never edited/deleted to make cleanup pass.
    - Provider test device reset is separately evidenced.
    - Residual counts and hashes are compared to pre-run baseline.

verdict_schema:
  allowed: [PASS, FAIL, BLOCKED, NOT_RUN]
  PASS:
    - all required profiles present and hash-valid
    - all assertions pass at the same source/design/environment binding
    - no prohibited mock or privileged shortcut
    - rollback/fixture residual proof complete
  FAIL:
    - assertion fails or unauthorized/duplicate/silent-loss/false-completion behavior occurs
  BLOCKED:
    - authority, provider, device, accepted design or required evidence is unavailable
    - skipped provider-live case remains BLOCKED
  NOT_RUN:
    - execution has not started
  prohibited:
    - PARTIAL_PASS
    - ASSUMED_PASS
    - SOURCE_ONLY_PASS
    - MOCKED_PROVIDER_PASS

run_summary_schema:
  required:
    - run_id
    - started_at_utc
    - completed_at_utc
    - source_commit_sha
    - design_revision_id
    - environment_id
    - provider_contract_version_or_hold
    - device_inventory_ids
    - case_counts_by_verdict
    - requirement_counts_by_verdict
    - failed_or_blocked_case_ids
    - rollback_status
    - reviewer_recommendation
    - manifest_sha256
  completion_rule: >-
    Module completion is prohibited unless every required case is PASS, every
    genuine-receipt/device-live obligation is satisfied, rollback is clean and
    independent review binds the same source/design/environment revisions.

validation:
  expected_cases: 30
  expected_groups: 5
  expected_profiles: 10
  case_ids_unique: PASS_30_OF_30
  all_077_cases_mapped: PASS
  profile_references_resolve: PASS
  yaml_parse: PASS
  diff_check: PASS

safe_successor:
  task_id: M10-ADMIN-DEVICE-COMMAND-MDM-IMPLEMENTATION-LEASE-SPLIT-PREFLIGHT-079
  mode: READ_ONLY
  purpose: >-
    Define a collision-free future lease split across governance, database,
    provider adapter, Admin, Field/offline, seed and QA using packets 061-078,
    without granting leases or modifying control files.
