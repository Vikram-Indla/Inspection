    - environment_id
    - source_commit_sha
    - design_revision_id
    - redaction_status
    - contains_secrets
    - authority_refs
    - chain_predecessor_sha256
  invariants:
    - sha256 is 64 lowercase hexadecimal characters
    - contains_secrets must be false in every shareable/indexed artifact
    - path remains under the approved external run root
    - timestamps are UTC and monotonic within the case chain
    - chain_predecessor_sha256 links capture order without rewriting originals
    - redacted derivatives have distinct hashes and retain the original restricted artifact reference
    - missing required artifact prevents PASS

