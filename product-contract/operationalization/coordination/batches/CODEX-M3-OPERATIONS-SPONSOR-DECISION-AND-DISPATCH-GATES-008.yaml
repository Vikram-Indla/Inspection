independent_findings:
  - id: SEQ-REV-001
    severity: P0
    subject: Current-slice mismatch
    finding: >-
      The authoritative current slice is M2 Planning, not M3 Operations
      authorization. Sequence 007 cannot create implementation authority for S1
      through S6 until an approved task-router and current-slice transition or
      explicit concurrent-slice record exists.
    required_correction:
      - Record an approved M3 authorization change-control task.
      - Bind CR-430..CR-448 and WA-M3-AC-001..006.
      - State whether M2 is paused, retained, or concurrently owned with disjoint paths.
    current_disposition: BLOCK_AUTHORIZATION_DISPATCH

  - id: SEQ-REV-002
    severity: P0
    subject: Claude correction lease absent from active registry
    finding: >-
      CLAUDE-M3-MAP-PROVENANCE-IMPLEMENTATION-RETURN-001 describes an exact
      eight-file lease, but ACTIVE_WORKTREE_LEASES.csv has no corresponding
      Claude Code row for the map-provenance worktree and branch.
    required_correction:
      - Atomically register the worktree, branch, base, actor, packet, exact eight files, exclusions, existing seven-file dirt, and status before or with dispatch.
      - Re-run collision checks at dispatch time.
    current_disposition: BLOCK_DISPATCH_UNTIL_REGISTRY_MATCHES_PACKET

  - id: SEQ-REV-003
    severity: P0
    subject: Conflicting map truth acceptance
    finding: >-
      SPECIAL_COMPONENT_ACCEPTANCE.csv SPC-LIVE-001 and SPC-CMD-005, plus the
      current authenticated-live-map prompt, require projected movement to be
      labelled as not live GPS. The sponsor correction requires removing
      fabricated projected-route behavior and presenting recorded GPS,
      truthful scheduled/factory fallback, unavailable, and read-error states.
      Both cannot remain simultaneously authoritative.
    required_correction:
      - Record a versioned sponsor supersession or amendment.
      - Preserve the prohibition on fabricated route, ETA, drift, animation, or live claims.
      - Replace the obsolete always-projected rule with accepted tiered provenance acceptance.
      - Preserve the future-telemetry privacy, timestamp, accuracy, freshness, and connection safeguards.
    current_disposition: BLOCK_FINAL_ACCEPTANCE_UNTIL_SUPERSESSION_RECORDED

  - id: SEQ-REV-004
    severity: P1
    subject: Shared navigation ownership conflict
    finding: >-
      Sequence 007 assigns shell-navigation.ts and shell-navigation.spec.ts to
      S3, while the M3 package manifest states shared shell and navigation work
      remains F0-owned. The F0 branch already changes both files.
    required_correction:
      - Remove those files from the M3 route-consumer lease.
      - Dispatch a separate F0 follow-up after the current F0 commit is accepted, or explicitly supersede it through change control.
      - Integrate the accepted F0 commit by immutable SHA before M3 route certification.
    current_disposition: RETURN_S3_OWNERSHIP_FOR_CORRECTION

  - id: SEQ-REV-005
    severity: P1
    subject: Access Administration belongs to M9
    finding: >-
      Sequence 007 assigns admin/access files to S5 under the M3 sequence. The
      package manifest assigns the Admin surface to M9 and makes M3 an
      Operations-route package.
    required_correction:
      - Treat S5 as a separately approved M9 cross-package dependency.
      - Keep M3 limited to consuming granted authority.
      - Do not lease admin/access files under an M3-only task.
    current_disposition: RETURN_S5_TO_M9_CHANGE_CONTROL

  - id: SEQ-REV-006
    severity: P1
    subject: Branch anchors are divergent, not stack-ready
    finding: >-
      The map branch base c48f71cc is not an ancestor of the current F0 head
      c8bdf6d1 or orchestration head 053cebdd. Both comparisons merge at
      3323a8ef. A branch name or a list of SHAs is therefore insufficient as a
      downstream base.
    required_correction:
      - Produce one explicit reconciled integration commit after each required upstream is accepted.
      - Branch consumers from that exact commit.
      - Record conflict resolution evidence; do not rebase unpublished active work.
    current_disposition: REQUIRE_RECONCILED_BASE_BEFORE_S1_OR_CONSUMERS

  - id: SEQ-REV-007
    severity: P1
    subject: Authorization sequence does not bind the complete M3 preservation contract
    finding: >-
      Sequence 007 focuses on CR-430, CR-433, CR-439, CR-447 and selected RBAC
      rules, but every authorization lane can affect the complete CR-430..CR-448
      Operations surface and WA-M3-AC-001..006.
    required_correction:
      - Add all nineteen CR rows and six M3 acceptance rows to every integration gate.
      - Preserve monitoring, alerts, drilldowns, immutable tracking history, timeline, KPI, export, partial failure, and audit behavior.
      - Require the Web/Admin 478-row validator at integration.
    current_disposition: RETURN_GATE_COVERAGE_FOR_CORRECTION

  - id: SEQ-REV-008
    severity: P1
    subject: Proposed migration paths are not reservations
    finding: >-
      The four exact migration filenames in Sequence 007 are proposals only.
      Other active work is producing migration/security coordination packets,
      and the lease registry is not proof that no unpublished migration exists.
    required_correction:
      - Resolve the latest canonical migration tail immediately before lease creation.
      - Reserve exact filenames only inside the approved lease registry.
      - Require one independently revertible commit per work-package migration.
    current_disposition: DO_NOT_USE_PROPOSED_TIMESTAMPS_AS_AUTHORITY

  - id: SEQ-REV-009
    severity: P1
    subject: Database lane rollback granularity
    finding: >-
      S1 combines scope, national grants, write alignment, and location
      projection. One writer avoids collision, but a mixed commit would prevent
      bounded review and rollback.
    required_correction:
      - Keep one database writer.
      - Require ordered, isolated commits and acceptance evidence per WP-04, WP-05 database portion, WP-03 database portion, and WP-02 database portion.
      - Do not begin a later database portion until the previous portion passes its negative gate.
    current_disposition: CONFIRMED_WITH_COMMIT_AND_GATE_SPLIT

  - id: SEQ-REV-010
    severity: P1
    subject: Open refresh governance
    finding: >-
      CR-431 requires a configurable refresh interval while DEC-002 leaves
      telemetry frequency open. Existing 30-second monitoring behavior cannot
      be promoted into the governed map policy.
    required_correction:
      - Sponsor assigns the policy owner and configuration source.
      - Until decided, the correction must not add or certify a refresh cadence.
    current_disposition: EXTERNAL_CONTRACT_BLOCK_FOR_REFRESH_CLAIM

sponsor_decision_application_checklist:
  instructions: >-
    Each item requires a recorded decision ID and authoritative repository
    update. A verbal or chat approval is not considered applied until the
    corresponding contract record exists.
  decisions:
    - decision_id: M3-SPONSOR-APPLY-001
      business_question: >-
        Do you approve replacing the obsolete always-projected map rule with
        truthful tiered provenance from recorded GPS, approved scheduling or
        factory fallback, unavailable, and explicit read-error states?
      recommended_answer: APPROVE
      application_targets:
        - design/claude-design-mvp1/acceptance/SPECIAL_COMPONENT_ACCEPTANCE.csv
        - design/claude-design-mvp1/prompts/systems/AUTHENTICATED_LIVE_OPERATIONS_MAP.md
        - approved M3 design correction record
      must_preserve:
        - no fabricated route
        - no fabricated ETA or drift
        - no projected animation presented as real
        - recorded timestamp, accuracy, privacy, freshness, and connection truth
      status: NOT_APPLIED

    - decision_id: M3-SPONSOR-APPLY-002
      business_question: >-
        Should M3 authorization become the active implementation slice now,
        with M2 retained but paused, or should it remain queued after M2?
      recommended_answer: ACTIVATE_M3_AND_RECORD_M2_AS_PAUSED_WITHOUT_CHANGING_M2_WORKTREE
      application_targets:
        - product-contract/execution/CURRENT_SLICE.yaml
        - product-contract/execution/TASK_ROUTER.yaml
        - product-contract/CURRENT_STATE.md
        - product-contract/sessions/SESSION_LEDGER.json
        - product-contract/operationalization/coordination/ACTIVE_WORKTREE_LEASES.csv
      status: NOT_APPLIED

    - decision_id: M3-SPONSOR-APPLY-003
      business_question: >-
        Which personas may open Operations, and which are monitoring-only?
      required_exact_values:
        operations_view:
          current_database_default:
            - ops
            - planner
            - leadership
          contract_personas_to_reconcile:
            - Supervisor
            - Operations Manager
            - Executive
            - Auditor for specific monitoring/history capabilities
        monitoring_only: MUST_BE_EXPLICIT
        action_capabilities: MUST_BE_EXPLICIT_PER_ACTION
      recommended_rule: >-
        Keep navigation reachability distinct from data and action authority;
        map repository role keys to contract personas without inventing a
        supervisor key.
      status: NOT_APPLIED

    - decision_id: M3-SPONSOR-APPLY-004
      business_question: What are the canonical region, branch, and organization scope identifiers and hierarchy?
      required_exact_values:
        - user-to-scope cardinality
        - factory-to-scope linkage
        - visit-to-scope linkage
        - inspector-to-scope linkage
        - case and risk-exception linkage
        - temporary cross-scope access
        - transfer and historical-record behavior
      status: NOT_APPLIED

    - decision_id: M3-SPONSOR-APPLY-005
      business_question: Who may see precise inspector identity and coordinates?
      required_exact_values:
        - capability name
        - eligible roles and direct grantees
        - active journey and execution states
        - freshness and stale thresholds
        - masking and aggregate resolution
        - zero-row, invalid-coordinate, and read-error behavior
        - privacy, retention, and audit dependencies
      proposed_capability_not_yet_authority: operations.view_precise_location_identity
      status: NOT_APPLIED

    - decision_id: M3-SPONSOR-APPLY-006
      business_question: Which Operations actions may each persona perform on which records?
      required_actions:
        - resolve action form
        - acknowledge or handle notification
        - decide GPS override
        - decide active cancellation
        - export operational data
      required_exact_values:
        - capability
        - record scope
        - workflow guard
        - audit event
        - denial behavior
      status: NOT_APPLIED

    - decision_id: M3-SPONSOR-APPLY-007
      business_question: Who may receive exceptional national visibility, for how long, and through which approval?
      required_exact_values:
        - grantor
        - grantee
        - reason
        - expiry
        - review
        - revocation
        - active-session and cache behavior
        - immutable audit
      proposed_capability_not_yet_authority: operations.view_all_regions
      status: NOT_APPLIED

    - decision_id: M3-SPONSOR-APPLY-008
      business_question: Who owns and configures the CR-431 map refresh interval?
      required_exact_values:
        - policy owner
        - configuration source
        - permitted range
        - offline, reconnect, and stale behavior
      prohibited_interim_action: Do not treat an existing client constant as policy.
      status: NOT_APPLIED

    - decision_id: M3-SPONSOR-APPLY-009
      business_question: Do you authorize separate F0 and M9 follow-ups needed by M3?
      recommended_answer:
        F0: Authorize navigation follow-up only after current F0 work is accepted.
        M9: Authorize national-grant administration only after database grant governance passes.
      ownership:
        F0:
          - apps/web/src/lib/shell-navigation.ts
          - apps/web/e2e/shell-navigation.spec.ts
        M9:
          - apps/web/src/app/(app)/admin/access/**
          - apps/web/src/lib/execution/capabilities.ts
      status: NOT_APPLIED

