hard_boundary:
  - "Read-only validator specification plus this one uniquely owned packet."
  - "Synthetic examples are fictional state vectors, not populated proof."
  - "ACK means structurally admissible for independent review only; it never means accepted, approved, closed or credited."
  - "No real proof collection, answer selection, identity, owner, lease, dispatch, implementation, SQL, database, data, seed, test execution, evidence capture, design change, branch, stash, commit, push or shared-control mutation."

outcomes:
  ACK:
    meaning: READY_FOR_INDEPENDENT_REVIEW_ONLY
    closes_route: false
    grants_authority: false
    grants_requirement_credit: false
  RETURN:
    meaning: CORRECTABLE_STRUCTURE_OR_COMPLETENESS_DEFECT
    closes_route: false
    grants_authority: false
    grants_requirement_credit: false
  BLOCK:
    meaning: UNSAFE_UNAUTHORIZED_CONFLICTED_EXPIRED_OR_FAILED_PROOF
    closes_route: false
    grants_authority: false
    grants_requirement_credit: false

deterministic_precedence:
  - order: 1
    outcome: BLOCK
    when: "Any BLOCK check triggers."
  - order: 2
    outcome: RETURN
    when: "No BLOCK check triggers and one or more RETURN checks trigger."
  - order: 3
    outcome: ACK
    when: "Every required common and route-specific check passes."
  - order: 4
    outcome: RETURN
    when: "The validator cannot deterministically evaluate an input."

common_checks:
  - check_id: V085-SRC-01
    category: SOURCE_IDENTITY
    failure_outcome: BLOCK
    test: "schema_id, route_id and route_kind exactly match one schema in packet 084."
  - check_id: V085-SRC-02
    category: SOURCE_IDENTITY
    failure_outcome: RETURN
    test: "Every route-applicable source identity field is present and non-placeholder."
  - check_id: V085-SRC-03
    category: SOURCE_IDENTITY
    failure_outcome: RETURN
    test: "Pinned refs are still current at validation time or an explicit immutable historical scope is supplied."
  - check_id: V085-AUTH-01
    category: AUTHORITY
    failure_outcome: RETURN
    test: "Authority identity, type, provenance, acceptance identity and time are complete where required."
  - check_id: V085-AUTH-02
    category: AUTHORITY
    failure_outcome: BLOCK
    test: "Human-only decisions originate from a human sponsor or documented human delegate, never agent inference."
  - check_id: V085-AUTH-03
    category: AUTHORITY
    failure_outcome: BLOCK
    test: "Implementation, QA, data and final-review identities satisfy every required separation rule."
  - check_id: V085-HASH-01
    category: HASHES
    failure_outcome: RETURN
    test: "Every applicable hash is a complete lowercase SHA-256 value."
  - check_id: V085-HASH-02
    category: HASHES
    failure_outcome: BLOCK
    test: "Independent recomputation matches every supplied payload, source, artifact, evidence and preservation hash."
  - check_id: V085-EVID-01
    category: EVIDENCE
    failure_outcome: RETURN
    test: "All route-required artifacts, personas, fixtures, positive, negative, regression and trace fields are present."
  - check_id: V085-EVID-02
    category: EVIDENCE
    failure_outcome: BLOCK
    test: "Every required P0 result passes and no claimed result conflicts with the attached trace."
  - check_id: V085-SECRET-01
    category: EVIDENCE
    failure_outcome: BLOCK
    test: "Recursive artifact and payload scan finds no forbidden key or forbidden value."
  - check_id: V085-PRES-01
    category: PRESERVATION
    failure_outcome: RETURN
    test: "Immutable copy, chain of custody, preservation authority, retention rule and cleanup disposition are complete when applicable."
  - check_id: V085-PRES-02
    category: PRESERVATION
    failure_outcome: BLOCK
    test: "Preservation hash matches, mutation_detected is false and the evidence has not been overwritten."
  - check_id: V085-EXP-01
    category: EXPIRY
    failure_outcome: RETURN
    test: "Issue time, expiry time, freshness rule and refs-rechecked time are complete."
  - check_id: V085-EXP-02
    category: EXPIRY
    failure_outcome: BLOCK
    test: "Validation time is before expiry and no invalidation event has occurred."
  - check_id: V085-NC-01
    category: NON_CLOSURE
    failure_outcome: BLOCK
    test: "closure_claimed and blocker_closed are false and requirement_credit is exactly zero."
  - check_id: V085-NC-02
    category: NON_CLOSURE
    failure_outcome: BLOCK
    test: "Validator identity is independent where required and does not author or repair the evaluated proof."
  - check_id: V085-NC-03
    category: NON_CLOSURE
    failure_outcome: RETURN
    test: "Validation status, missing fields, conflicts, expiry result, reason, validator and time are recorded."

