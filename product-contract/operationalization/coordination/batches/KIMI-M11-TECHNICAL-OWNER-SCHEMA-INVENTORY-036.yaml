six_prerequisite_summary:
  M11-TECH-OWNER-01:
    status: UNKNOWN_LIVE_OWNER
    source_truth:
      - "No relevant migration contains ALTER FUNCTION ... OWNER TO."
      - "All function owners therefore depend on the role that originally created each function; source does not identify that role."
    fail_closed_default: OWNER_ROLE_MUST_BE_CONFIRMED_FROM_ISOLATED_CATALOG
    source_packet_correction: [KIMI-M11-PERMISSION-HARDENING-LEASE-013, KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017]
  M11-TECH-SCHEMA-01:
    status: PARTIAL_SOURCE_KNOWN_LIVE_EXTENSION_SCHEMA_UNKNOWN
    source_truth:
      - "pgcrypto is created without an explicit schema in 0009."
      - "OTP functions use unqualified digest() with search_path public, extensions."
      - "Actual pgcrypto namespace is not proven from source."
      - "Most M11 functions use unqualified public objects with search_path public."
    fail_closed_default: NO_MIGRATION_OR_FUNCTION_LEASE
    source_packet_correction: [KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017]
  M11-TECH-AUDIT-INVENTORY-01:
    status: PARTIAL_STATIC_INVENTORY_NOT_RUNTIME_COMPLETE
    source_truth:
      - "Direct raw audit readers and writers are identifiable in current app source."
      - "No runtime query log, role-effective access inventory or external consumer inventory was performed."
    fail_closed_default: DO_NOT_CONTRACT_RAW_AUDIT_POLICIES
    source_packet_correction: [KIMI-M11-AUDIT-BOUNDARY-LEASE-015]
  M11-TECH-SAFE-TRIGGER-01:
    status: ABSENT
    source_truth:
      - "virtual_participants uses the global audit_row_change trigger."
      - "That trigger stores complete old/new row JSON, including verification_record."
      - "No specialized redacting participant trigger or safe projection precedes OTP."
    fail_closed_default: OTP_DISABLED
    source_packet_correction: [KIMI-M11-AUDIT-BOUNDARY-LEASE-015]
  M11-TECH-QUIESCE-01:
    status: ABSENT
    source_truth:
      - "No M11 maintenance switch, server-side mutation gate, in-flight counter, drain assertion or 013→015 no-traffic hook was found."
      - "Browser offline disabling is local UI behavior, not global quiescence."
    fail_closed_default: DO_NOT_REQUEST_MAINTENANCE_APPROVAL_OR_RUN_CONTRACT
    source_packet_correction: [KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017]
  M11-TECH-PROVIDER-01:
    status: NOT_CONFIGURED_SOURCE_IS_DEV_ONLY
    source_truth:
      - "vp_request_otp generates a code in database, stores its hash and returns dev_code."
      - "Provider is stored as a DEV-CONSOLE string; no governed external delivery adapter/callback is invoked."
      - "A notification row or provider label is not delivery proof."
    fail_closed_default: PROVIDER_NOT_CONFIGURED_AND_RUNTIME_COMPLETION_BLOCKED
    source_packet_correction: [KIMI-M11-PERMISSION-HARDENING-LEASE-013, KIMI-M11-AUDIT-BOUNDARY-LEASE-015, KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017]

