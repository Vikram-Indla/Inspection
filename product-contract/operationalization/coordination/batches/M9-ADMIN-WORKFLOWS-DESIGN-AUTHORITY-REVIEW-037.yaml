wa_des_014_design_truth:
  shown:
    - Workflow builder header with Draft v3.
    - Validate and Publish version controls.
    - One Inspection lifecycle state lane and exception badges.
    - Submitted to L2 Review transition with role, maker-checker and guard fields.
    - SLA table with calendar and breach action.
    - State inventory, Add state and validation summary.
    - Light/dark theme toggle.
  defects_and_unproven_claims:
    - It hard-codes 48 working hours, 3 working days, 5 working days and Sun-Thu despite DEC-003.
    - It hard-codes escalation and auto-expiry outcomes without approved values or engine proof.
    - The English page renders an Arabic-only wordmark and has no full Arabic/RTL state.
    - Add state, Validate and Publish controls are static design controls without action/result/error contracts.
    - Publish lacks an explicit Review and Approved lifecycle and distinct-checker hand-off.
    - The state graph omits many required object families and source lifecycles.
    - No library/list, effective-date history, scheduled version, rollback, retire or in-flight binding inspection.
    - No simulation happy/exception run, fixture provenance, replay history or audit evidence.
    - No loading, empty, error, unauthorized, stale, conflict, provider-unavailable or session-expired state.
    - At narrow widths the state lane remains min-content and horizontally scrolls.
    - Only one responsive breakpoint exists; no 412/390/320 task-order evidence.
    - No complete keyboard, focus, live-region, validation-summary or non-color state contract.
  design_action: CORRECT

