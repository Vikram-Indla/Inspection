audit_truth:
  governed_runtime_transition: Explicitly appends allowed or denied audit through its dependency.
  task_and_sla_actions: Explicitly append audit_events after successful writes.
  config_versions_generic_trigger:
    found: false
    evidence: The generic audit trigger list in 0002_rbac_audit.sql does not include config_versions.
  config_version_actions:
    propose_audit: absent
    save_audit: absent
    publish_audit: absent
    retire_audit: absent
