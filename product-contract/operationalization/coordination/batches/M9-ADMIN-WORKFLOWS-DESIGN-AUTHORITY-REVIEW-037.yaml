meaningful_design_versus_code_delta:
  parity:
    - Exact route and Workflow Settings capability exist.
    - Versioned workflow records and visible draft/published status exist.
    - State graph, transition actor/guards/side effects and validation ledger exist.
    - Maker-versus-checker explanation exists.
    - Light/dark infrastructure and English/Arabic string infrastructure exist.
  design_has_code_lacks:
    - Visual state/transition/guard composer rather than raw JSON.
    - Visible Add state and transition configuration controls.
    - SLA table within the route.
    - Compact sticky inspector layout.
  code_has_design_lacks:
    - Real config_versions reads and profile-backed maker/checker names.
    - Six-check validation ledger and idempotency disclosure.
    - Honest simulation NotYet boundary.
    - Explicit neutral load/write errors.
    - Draft cloning, rollback/retire actions and feature-flagged governed engines.
  both_need_correction:
    - Full maker-checker lifecycle and direct-write prevention.
    - Published immutability.
    - End-to-end optimistic concurrency.
    - Scheduled activation.
    - Workflow definition audit.
    - Persona/permission boundary.
    - Simulation proof.
    - Approved SLA/calendar values.
    - Responsive, RTL and accessibility state evidence.

