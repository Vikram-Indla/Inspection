permissions_and_rls_truth:
  navigation:
    visible_role: workflow_admin
    label: Workflow Settings
  screen_catalogue:
    SCR-ADM-050: Workflow Admin
    SCR-ADM-051: Workflow Admin and Approver
  route_guard:
    explicit_server_redirect_or_role_guard: false
    effect: Any authenticated user may reach the route; RLS determines visible records.
  config_versions_rls:
    read: all authenticated users
    insert_roles: [compliance_admin, form_admin, workflow_admin, risk_owner, gis_admin, security_admin]
    update_roles: [compliance_admin, form_admin, workflow_admin, risk_owner, gis_admin, security_admin]
    delete_policy: none
  server_action_authorization:
    mechanism: RLS plus authenticated session
    explicit_workflow_admin_check: false
    consequence: >-
      Any role in the generic config-writer set can attempt workflow engine
      inserts and updates, while the page declares workflow_admin only.
  ui_control_gating:
    role_aware: false
    consequence: Read-only authenticated users can see mutation controls that later fail through RLS.
  decision_required: >-
    Govern whether Workflows is workflow_admin-only or uses the broader
    config-writer set, then align navigation, route guard, RLS, server actions,
    control visibility and zero-disclosure behavior.

workflow_lifecycle_and_maker_checker_truth:
  required_source_lifecycle:
    - Draft
    - Review
    - Approved
    - Published
    - Retired
    - Rolled Back
  current_primary_ui_lifecycle:
    - draft
    - published
    - retired through unexposed action
    - rollback as a new draft through unexposed action
  review_and_approved_ui_states: absent
  maker_checker_constraint:
    expression: approved_by is null or approved_by differs from created_by
    weakness: It blocks self-approval only when approved_by is populated; it does not require an approver for published status.
  publish_action:
    server_path: approvePublishWorkflow
    positive: Sets approved_by to the current user after deterministic graph validation.
    negative: Hides publish for the current row maker and reports a distinct-checker message.
    boundary_gap: Generic direct UPDATE policy permits status changes outside the server action.
  published_immutability:
    claimed_by_ui: Published versions are immutable at the database boundary.
    located_database_guard: none
    actual_source_boundary: Page and save action filter edits to status draft, but generic RLS allows UPDATE on config_versions.
    validation: INCORRECT_RUNTIME_CLAIM
  one_active_version:
    database_index: engine, object_id, coalesce(scheduled_from, effective_from) where status is published
    implication: It prevents duplicate effective timestamps, not multiple published versions at different effective times.

concurrency_and_scheduling_truth:
  row_version:
    schema_column: present
    bump_trigger: present
    save_action_compare_and_set: conditional_when_form_value_present
    page_selects_row_version: false
    editor_submits_row_version: false
    result: CAS_NOT_WIRED_END_TO_END
    risk: Concurrent draft edits can silently overwrite because the update runs without a row_version predicate.
  scheduled_activation:
    schema_column: scheduled_from
    action_accepts_schedule: true
    action_behavior:
      status: published
      effective_from: now
      scheduled_from: supplied future value
    design_gap: No scheduled state or activation preview is visible.
    contract_risk: >-
      The action comment says future scheduling is not yet active, but the row
      is immediately marked published with effective_from now; runtime selection
      semantics must be proven before design acceptance.
  stale_state_required: true

