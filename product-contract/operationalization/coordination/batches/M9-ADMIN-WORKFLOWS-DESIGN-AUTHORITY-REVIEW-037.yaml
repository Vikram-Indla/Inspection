responsive_theme_language_accessibility:
  responsive:
    design_current: Two-column to one-column at 1100px; state lane horizontally scrolls.
    required: >-
      Preserve library, selected version, validation, transition details and one
      safe action without page-level horizontal overflow at all seven
      viewports. Replace or explicitly bound the state lane on narrow screens.
  theme:
    design_current: Light/dark toggle only.
    required: Token, contrast, validation, disabled, warning and focus parity.
  language:
    design_current: English content with Arabic-only brand text.
    required: >-
      Complete English/LTR and approved Arabic/RTL task parity, correct English
      profile wordmark treatment, domain-approved Arabic, and stable mixed-script
      IDs/version labels.
  accessibility:
    required:
      - semantic page, library, graph, transition and validation headings
      - keyboard graph navigation with correct roving tab stop behavior
      - visible focus on every composer and lifecycle action
      - live error, validation, stale, publish and provider announcements
      - labels and descriptions for graph nodes, transitions, guards and side effects
      - non-color status meaning
      - maker-checker and immutable consequences before action
      - zoom, reflow and reduced-motion parity
  current_code_issue: >-
    WfDeck gives only the first state tabIndex 0 even after arrow focus moves,
    so the roving tab stop does not follow the focused/selected state.

