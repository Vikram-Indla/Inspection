    database: "Fresh isolated Supabase-compatible database for each future run."
    run_identity: "Unique opaque run_id linked to every synthetic fixture and evidence item."
    cleanup: "Deterministic teardown; a failed teardown invalidates the run."
    ordinary_sessions_only: true
    prohibited_proof_substitutes:
