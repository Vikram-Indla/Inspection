      authority_shape: "Authenticated Planner; positive actions only where exact frozen authority maps them."
    - fixture_id: FX-PERSONA-OPERATIONS
      authority_shape: "Authenticated Operations persona; positive actions blocked without exact frozen authority."
    - fixture_id: FX-PERSONA-ANON
