expected_result_vocabulary:
  ALLOW: "The exact ordinary persona action succeeds and produces the expected bounded state/audit result."
  DENY: "The action is rejected without disclosing resource existence or internal policy details."
  NEUTRAL: "Missing and out-of-scope results are byte-equivalent at the governed boundary."
  BLOCKED_PROVIDER: "No delivery or completion claim; no secret-bearing substitute is returned."
  ROLLBACK_CLEAN: "No state, participant, visit, counter, timeline or audit residue remains."
  ONE_WINNER: "Exactly one concurrent operation commits the authoritative result."
  ONE_SEMANTIC_EVENT: "Exactly one semantic event exists for one committed transition."

