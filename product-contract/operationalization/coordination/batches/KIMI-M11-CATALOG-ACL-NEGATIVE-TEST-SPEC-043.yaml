    - catalog_or_state_before_after
    - normalized_error_or_response_hash
    - audit_and_event_cardinality
    - redaction_scan
    - teardown_result
  release_rules:
    - "No secret, personal, application-row or runtime-query value in evidence."
    - "No raw function/view body; only approved catalog fields and definition hashes."
    - "A failed redaction, checksum, teardown or reviewer check quarantines the entire evidence bundle."
    - "Existing historical evidence is context only and cannot certify the corrected stack."
    - "Independent reviewer signoff is required before sponsor acceptance."

