    - fixture_id: FX-PERSONA-UNASSIGNED-INSPECTOR
      authority_shape: "Authenticated Inspector with no relationship to the exact visit."
    - fixture_id: FX-PERSONA-REVIEWER
      authority_shape: "Authenticated Reviewer; safe view-only boundary."
    - fixture_id: FX-PERSONA-AUDITOR
      authority_shape: "Authenticated Auditor; safe view-only boundary."
