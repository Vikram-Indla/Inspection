p0_findings:
  - id: TPL-P0-001
    finding: Template publication and maker-checker are bypassable.
    evidence: >-
      RLS grants compliance_admin/form_admin FOR ALL. A direct INSERT can supply
      status=published and approved_by, while a direct UPDATE from an old draft
      to published is not rejected by the guard. The maker-checker constraint
      proves only that two UUIDs differ, not that approved_by is auth.uid.
    impact: Published business authority can be forged outside the validated RPC.
    blocks:
      - WA-M9-AC-001
      - WA-M9-AC-002
      - WA-M9-AC-005
      - WA-AC-0458
      - WA-AC-0459
  - id: TPL-P0-002
    finding: Template schema and type compatibility are not governed.
    evidence: >-
      UI and RPC accept any JSON object. Package validation checks template ID,
      status and effective_from only. Package and penalty choices are not
      type-restricted.
    impact: A structurally meaningless or wrong-class template can be published and linked.
    blocks:
      - WA-AC-0456
      - WA-AC-0457
      - WA-AC-0460
      - WA-AC-0477
  - id: TPL-P0-003
    finding: Effective-time publication is internally inconsistent.
    evidence: >-
      Publishing a future successor immediately marks the old row deactivated
      and the new row published. Field selects published action_form templates
      without effective dates, so the future version can be used early while the
      predecessor is no longer selectable.
    impact: Future-only activation and stable current-version resolution are violated.
    blocks:
      - WA-AC-0456
      - WA-AC-0458
      - WA-AC-0459
      - WA-AC-0462
      - WA-AC-0478
  - id: TPL-P0-004
    finding: Field does not preserve or render the selected template version.
    evidence: >-
      Field loads only template ID/key/title and inserts a generic action_forms
      row without template_version_id or schema. Workspace rendering therefore
      cannot reproduce the immutable template fields.
    impact: The exact acceptance claims "correct template is used at runtime" and "correct action form is generated" are unproven and contradicted.
    blocks:
      - WA-AC-0454
      - WA-AC-0456
      - WA-AC-0457
      - WA-AC-0475
      - WA-AC-0478
  - id: TPL-P0-005
    finding: Published package dependency closure can omit penalty-linked templates.
    evidence: >-
      freezeDefinition collects definition.template_refs and package
      action_forms.template_version_id; it does not traverse each frozen penalty
      mapping's template_version_id into template_snapshot.
    impact: A package may be published without a complete immutable template dependency set.
    blocks:
      - WA-AC-0460
      - WA-AC-0477
      - WA-AC-0478
  - id: TPL-P0-006
    finding: Release evidence does not test the governed template lifecycle or bypass paths.
    evidence: >-
      Existing tests assert source tokens and adjacent package behavior. There is
      no isolated create/edit/checker-publish/effective-selection/deactivate/
      history/runtime-render journey and no direct REST/RPC negative probe for
      templates.
    impact: Security, audit and runtime claims cannot be independently accepted.
    blocks:
      - WA-M9-AC-002
      - WA-M9-AC-005
      - WA-M9-AC-006

p1_findings:
  - id: TPL-P1-001
    finding: No accepted template-specific design or screen identity exists.
    evidence: >-
      No Templates row exists in the screen catalogue. DSG-005 and DSG-006 are
      not_started, and registered WA-DES-002/005 are nearest Package page/designer
      predecessors rather than exact Template Registry authority.
  - id: TPL-P1-002
    finding: Draft edits can silently overwrite another writer.
    evidence: >-
      configuration_templates has no revision or updated_at token and
      updateTemplateDraft predicates only by id and status=draft.
  - id: TPL-P1-003
    finding: Template history and evidence custody are not reviewer-visible.
    evidence: >-
      The audit trigger exists, but admin_configuration_audit omits
      configuration_templates from its whitelist and TemplateRegistry has no
      history/audit/actor/source-evidence view.
  - id: TPL-P1-004
    finding: Read scope exposes all template statuses to every authenticated user.
    evidence: configuration_templates_read checks only auth.uid() is not null.
  - id: TPL-P1-005
    finding: Loading, empty, error and degraded template states are not distinct.
    evidence: >-
      The live empty registry showed only the create form. No empty explanation
      was present, and the page does not isolate a template read failure from a
      true empty result.
  - id: TPL-P1-006
    finding: Template-specific responsive, keyboard, focus and native-Arabic acceptance is incomplete.
    evidence: >-
      Desktop EN/AR and light/dark were observed, but the existing browser file
      exercises the combined Packages page and contains no template lifecycle,
      focus recovery, error summary or qualified native-Arabic review.
  - id: TPL-P1-007
    finding: The existing Packages browser contract is not clean.
    evidence: >-
      The focused file passed 14/16. One assertion uses a non-unique Create draft
      locator; one assumes copy containing "active visit(s)" although the
      truthful zero-state says no active visits or inspections. The full
      dependency run is also blocked by the pre-existing Inspector auth HTTP 400.
    classification: TEST_AND_FIXTURE_DEFECTS_NOT_TEMPLATE_PRODUCT_PROOF

