observed_runtime:
  built:
    - A writer-only bilingual registry is embedded at the top of /admin/packages.
    - Writers can create a draft with key, type, version, effective_from, bilingual title and JSON object schema.
    - Draft titles and schema can be edited through guarded server actions.
    - A publish RPC checks distinct maker/checker, effective_from and JSON object shape.
    - Published/locked rows have a database immutability guard and can be reason-deactivated.
    - The configuration_templates table has unique key/version, one-open-version and effective-window constraints.
    - An append-only generic audit trigger is attached to configuration_templates.
    - Package publication can freeze explicitly referenced template rows into template_snapshot.
    - English and Arabic template strings exist.
  independently_verified:
    - Route boundary permits only compliance_admin and form_admin.
    - An authorized seeded Admin rendered the real package page and expanded registry.
    - The live registry currently returned no template records and supplied no template-specific empty-state explanation.
    - An authenticated Reviewer reached the Arabic role-denied boundary with no configuration data loaded.
    - Authorized Arabic rendered registry labels under document lang=ar and dir=rtl.
    - Light and dark document themes both rendered; the browser state was restored.
    - /admin/templates rendered the framework 404 page.
    - Source, migration and consumer inspection confirms all P0/P1 findings below.
  fully_accepted:
