      - apps/web/src/app/(app)/admin/access/**
      - apps/web/src/lib/shell-navigation.ts
      - apps/web/src/lib/execution/capabilities.ts
    acceptance:
      - Every matrix row for database scope, projection, mutation, and grants has positive and negative proof.
      - Unauthorized rows are not returned, not merely hidden after query.
      - Unauthorized writes fail in RPC/RLS and emit no success audit.
      - Authorized writes emit required immutable audit.
      - Existing migrations remain unchanged.
      - Migration applies cleanly from the accepted base and from a fresh database.
      - Roll-forward repair is documented for every additive database change.
    produced_anchor: A3_authorization_database_accepted
    rollback_boundary:
      before_integration: Withhold branch; do not apply to shared Supabase environments.
      after_nonproduction_apply: Use an approved forward remediation migration; never edit or delete an applied migration.
      capability_exposure: Keep new capabilities ungranted or consumer-inactive until downstream gates pass.

  - id: G2_DATABASE_AUTHORIZATION_ACCEPTANCE
    type: SECURITY_AND_DATA_GATE
    requires:
      - S1_AUTHORIZATION_DATABASE_FOUNDATION
    independent_reviewer: Codex or assigned reviewer who did not implement S1
    pass_evidence:
      - migration collision check
      - fresh-database apply
      - existing-data compatibility
      - 45-row negative-matrix database subset
      - RLS cross-role and cross-region evidence
      - RPC mutation denial and audit evidence
      - immutable accepted commit SHA
    fail_action: RETURN_TO_S1_AND_BLOCK_ALL_CONSUMERS
    produced_anchor: A3_authorization_database_accepted

  - id: S2_LOCATION_PROJECTION_CONSUMER
    work_package: WP-02
    business_scope: Consume approved full and reduced location projections after database acceptance.
    owner: ONE_UI_IMPLEMENTER_TO_BE_ASSIGNED
    proposed_branch: codex/m3-operations-location-projection
    proposed_worktree: /Users/vikramindla/Developer/Inspection-codex-m3-operations-location-projection
    required_base:
      anchors:
        - A1_map_provenance_accepted
        - A3_authorization_database_accepted
      rule: Branch from the integration commit containing both immutable anchors.
    exact_file_ownership:
      - apps/web/src/app/(app)/operations/OperationsMapWorkspace.tsx
      - apps/web/src/app/(app)/operations/OpsMap.tsx
      - apps/web/src/app/(app)/operations/live/LiveMapInner.tsx
      - apps/web/src/app/(app)/operations/live/LiveOps.tsx
      - apps/web/src/app/(app)/operations/live/page.tsx
      - apps/web/src/app/(app)/operations/live/types.ts
      - apps/web/src/app/(app)/operations/page.tsx
