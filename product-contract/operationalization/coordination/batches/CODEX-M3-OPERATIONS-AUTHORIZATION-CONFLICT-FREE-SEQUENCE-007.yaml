      - Role-derived access is not falsely presented as directly revocable.
      - Expired or revoked grants cease to authorize according to approved session semantics.
      - No grant can broaden unrelated capabilities.
    produced_anchor: A8_admin_consumer_accepted
    rollback_boundary:
      - Revert isolated admin consumer commit.
      - Keep database grant enforcement and audit intact.
      - Do not delete grant history to hide an erroneous administration attempt.

  - id: S6_CONTROLLED_INTEGRATION
    owner: ONE_INTEGRATOR_NOT_ANY_ACTIVE_IMPLEMENTER
    proposed_branch: codex/m3-operations-authorization-integration
    proposed_worktree: /Users/vikramindla/Developer/Inspection-codex-m3-operations-authorization-integration
    required_anchors:
