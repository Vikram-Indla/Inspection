    acceptance:
      - Precise identity and coordinates render only under approved capability and scope.
      - Reduced projection contains no direct identity, exact coordinates, visit ID, or accuracy.
      - Read-error, zero-row, invalid-coordinate, and no-mappable-position states remain distinct.
      - English, Arabic, RTL, 1024, 412 or 390, and 320 evidence passes.
      - No regression to accepted M3 provenance.
    produced_anchor: A5_projection_consumer_accepted
    rollback_boundary:
      - Revert only the isolated consumer commit.
      - Database authority remains safe and must not be weakened to restore UI behavior.
      - If projection fails closed, retain denial and restore the last accepted non-sensitive UI.

  - id: S3_ROUTE_AND_VIEW_CONSUMER
    work_package: WP-01
    business_scope: Enforce operations.view in navigation and direct routes.
    owner: ONE_ROUTE_IMPLEMENTER_TO_BE_ASSIGNED
    proposed_branch: codex/m3-operations-route-authorization
    proposed_worktree: /Users/vikramindla/Developer/Inspection-codex-m3-operations-route-authorization
    required_base:
