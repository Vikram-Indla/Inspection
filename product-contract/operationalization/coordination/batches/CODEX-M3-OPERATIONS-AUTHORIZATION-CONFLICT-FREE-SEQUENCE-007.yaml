      - A4_f0_navigation_accepted
      - A3_authorization_database_accepted
      - A5_projection_consumer_accepted
      - A6_route_consumer_accepted
      - A7_write_consumer_accepted
      - A8_admin_consumer_accepted
    conflict_policy:
      - Stop on any textual or semantic conflict.
      - Return conflict to the later owning lane; integrator does not redesign or rewrite leased behavior.
      - Never resolve by dropping an accepted test, requirement ID, capability check, projection field, or audit event.
      - Record exact source and target SHAs for every integrated commit.
    produced_anchor: A9_integrated_candidate
    rollback_boundary:
      - Each lane must remain a separately revertible commit set.
      - Revert consumers before database forward remediation.
      - Never rewrite shared branch history after review begins.

integration_gates:
  - id: G3_PROJECTION_CONSUMER_ACCEPTANCE
    after: S2_LOCATION_PROJECTION_CONSUMER
    required:
      - reduced and precise projection negative tests
      - accepted map-provenance regression
      - browser evidence at required locales and widths
      - immutable accepted commit SHA
  - id: G4_ROUTE_AND_WRITE_ACCEPTANCE
    after:
      - S3_ROUTE_AND_VIEW_CONSUMER
      - S4_WRITE_CAPABILITY_CONSUMER
    required:
      - direct-route denial before read
      - navigation parity
      - forged-action denial
      - audit evidence
      - immutable accepted SHAs
  - id: G5_ADMIN_GRANT_ACCEPTANCE
    after: S5_NATIONAL_GRANT_ADMIN_CONSUMER
    required:
      - unauthorized grant and revoke denial
      - expiry and audit evidence
      - role-derived versus direct-grant truth
      - immutable accepted commit SHA
  - id: G6_RUNTIME_AND_REGRESSION_ACCEPTANCE
    after: S6_CONTROLLED_INTEGRATION
    required:
      - complete 45-row authorization negative matrix
      - web-admin M3 Operations suite
      - shell navigation suite
      - execution canonical, access, journey, and admin contract suites
      - mapbox live and provider suites
      - exceptions suites
      - dashboard regression suites
      - English and Arabic browser evidence
      - desktop, 1024, 412 or 390, and 320 responsive evidence
      - keyboard, focus, and accessibility evidence
      - database audit verification
      - clean worktree and exact changed-file manifest
    fail_action:
      - Identify the owning lane.
      - Reopen only that lane from its accepted predecessor anchor.
      - Do not patch the integration branch directly.

