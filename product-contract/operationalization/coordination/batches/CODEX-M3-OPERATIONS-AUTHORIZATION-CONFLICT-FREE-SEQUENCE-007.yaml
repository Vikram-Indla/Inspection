      - apps/web/src/app/(app)/admin/access/**
      - supabase/**
    acceptance:
      - Each control has the approved capability and record-scope predicate.
      - Server action independently verifies authorization before mutation.
      - Database denial remains authoritative against forged requests.
      - Success and denial audit behavior matches contract.
      - Planner and leadership cannot acquire mutation authority through UI state.
    produced_anchor: A7_write_consumer_accepted
    rollback_boundary:
      - Revert isolated action/UI consumer commit.
      - Keep database write denial in place.
      - Disable or hide a broken control; never bypass its RPC/RLS contract.

  - id: S5_NATIONAL_GRANT_ADMIN_CONSUMER
    work_package: WP-05
    business_scope: Administer approved exceptional national-scope grants.
    owner: ONE_ACCESS_ADMIN_IMPLEMENTER_TO_BE_ASSIGNED
    proposed_branch: codex/m3-operations-national-grant-admin
    proposed_worktree: /Users/vikramindla/Developer/Inspection-codex-m3-operations-national-grant-admin
    required_base:
