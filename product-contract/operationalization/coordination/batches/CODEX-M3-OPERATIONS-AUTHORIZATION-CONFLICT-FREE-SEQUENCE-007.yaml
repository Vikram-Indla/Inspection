collision_preflight_before_every_future_lease:
  required_checks:
    - authoritative repository and Git common directory
    - exact base SHA
    - branch and worktree do not already exist unexpectedly
    - clean worktree or explicitly registered pre-existing dirt
    - active lease registry has no path overlap
    - every proposed new migration and test path is unused
    - no open pull request owns the same semantic contract
    - no dirty preview or abandoned worktree owns overlapping files
    - current product-contract gate and current slice still authorize the work
