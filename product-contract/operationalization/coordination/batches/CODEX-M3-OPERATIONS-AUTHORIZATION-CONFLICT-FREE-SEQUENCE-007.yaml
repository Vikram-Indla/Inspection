packet:
  id: CODEX-M3-OPERATIONS-AUTHORIZATION-CONFLICT-FREE-SEQUENCE-007
  title: Conflict-free sequence for rejected M3 map provenance and Operations authorization
  status: PROPOSAL_ONLY_NOT_AUTHORIZED
  created_by: Codex orchestration
  purpose: >-
    Define a dependency-safe execution and integration sequence for the rejected
    M3 map-provenance correction and five Operations authorization work packages.
    This packet grants no implementation lease and creates no branch, migration,
    capability, test, design, data, or product change.

authority:
  authoritative_repository: /Users/vikramindla/Developer/Inspection
  orchestration_worktree: /Users/vikramindla/Developer/Inspection-codex-orchestration
  orchestration_branch: codex/orchestration-control-plane
  evidence_head: 70b9caf506f2e5a995bd6d59295277f9858588b7
  source_packets:
    - CLAUDE-M3-MAP-PROVENANCE-IMPLEMENTATION-RETURN-001.yaml
    - CODEX-M3-OPERATIONS-AUTHORIZATION-CONTRACT-AUDIT-002.yaml
    - CODEX-M3-OPERATIONS-AUTHORIZATION-DECISION-BOUNDARY-003.yaml
    - CODEX-M3-OPERATIONS-AUTHORIZATION-NEGATIVE-ACCEPTANCE-MATRIX-004.csv
    - CODEX-M3-OPERATIONS-REDUCED-PROJECTION-SPEC-005.yaml
    - CODEX-M3-OPERATIONS-AUTHORIZATION-IMPLEMENTATION-DEPENDENCY-MAP-006.yaml
  prohibited_by_this_packet:
    - creating or changing product code
    - creating or changing tests
    - creating or changing data or seeds
    - creating or changing design
    - creating or changing migrations, RLS, RPCs, schema, or capabilities
    - creating branches or worktrees
    - granting implementation leases
    - committing, pushing, opening, merging, or closing pull requests
    - changing main, setup/Inspection, existing stashes, or dirty worktrees

immutable_rules:
  - At most one active writer owns any path.
  - A downstream branch starts only from an accepted immutable upstream commit.
  - No downstream work branches from uncommitted or rejected changes.
  - Existing migrations are immutable; approved database corrections use new additive migrations.
  - Database authorization is implemented and negatively tested before UI consumers claim authority.
  - UI hiding never substitutes for route, server-action, RPC, or RLS enforcement.
  - A failed gate returns the same branch to its owner; it does not leak fixes into another lease.
  - Shared regression tests are changed by one designated owner only; other lanes add lane-specific tests.
  - No branch is rebased across another active writer's unpublished work.

anchor_model:
  A0_canonical_source:
    value: c48f71cc46ce027927224109f7b070ca489f2b15
    meaning: Base already assigned to the rejected map-provenance correction.
  A1_map_provenance_accepted:
    value: PENDING
    produced_by: S0_MAP_PROVENANCE_CORRECTION
    rule: Exact accepted commit SHA, never branch name or working-tree state.
  A2_contract_approved:
    value: PENDING
    produced_by: G1_CONTRACT_APPROVAL
    rule: Versioned approval record for scope, projection, write-capability, and national-grant decisions.
  A3_authorization_database_accepted:
    value: PENDING
    produced_by: S1_AUTHORIZATION_DATABASE_FOUNDATION
    rule: Accepted commit containing only approved new migrations and database contract tests.
  A4_f0_navigation_accepted:
    value: PENDING
    produced_outside_this_sequence: codex/f0-shell-authority-correction
    rule: Exact accepted navigation commit or explicit written supersession.
  A5_projection_consumer_accepted:
    value: PENDING
    produced_by: S2_LOCATION_PROJECTION_CONSUMER
  A6_route_consumer_accepted:
    value: PENDING
    produced_by: S3_ROUTE_AND_VIEW_CONSUMER
  A7_write_consumer_accepted:
    value: PENDING
    produced_by: S4_WRITE_CAPABILITY_CONSUMER
  A8_admin_consumer_accepted:
    value: PENDING
    produced_by: S5_NATIONAL_GRANT_ADMIN_CONSUMER
  A9_integrated_candidate:
    value: PENDING
    produced_by: S6_CONTROLLED_INTEGRATION

conflict_free_dependency_graph:
  critical_path:
    - S0_MAP_PROVENANCE_CORRECTION
    - G0_MAP_PROVENANCE_ACCEPTANCE
    - G1_CONTRACT_APPROVAL
    - S1_AUTHORIZATION_DATABASE_FOUNDATION
    - G2_DATABASE_AUTHORIZATION_ACCEPTANCE
    - S2_LOCATION_PROJECTION_CONSUMER
    - S3_ROUTE_AND_VIEW_CONSUMER
    - S4_WRITE_CAPABILITY_CONSUMER
    - S5_NATIONAL_GRANT_ADMIN_CONSUMER
    - S6_CONTROLLED_INTEGRATION
    - G6_RUNTIME_AND_REGRESSION_ACCEPTANCE
  permitted_parallelism:
    - >-
      Contract decision drafting may continue while S0 is corrected, but no
      implementation lane may start until both G0 and G1 pass.
    - >-
      After G2, S4 write consumer and S5 admin consumer may run in parallel only
      if S4 does not touch operations/page.tsx and S5 remains inside admin/access
      and its dedicated test.
    - >-
      S2 and S3 are deliberately sequential because both require Operations route
      files or shared map-provenance consumers.
  forbidden_parallelism:
    - S0 with any writer touching its eight leased files
    - S2 with any writer touching Operations map or live files
    - S3 with F0 navigation until A4 exists
    - S3 with S4 if either requires operations/page.tsx
    - any database lane with another unpublished migration touching the same policies, RPCs, or capability rows

stages:
  - id: S0_MAP_PROVENANCE_CORRECTION
    business_scope: Correct the rejected first pass without broadening it.
    owner: Claude Code
    current_worktree: /Users/vikramindla/Developer/Inspection-codex-m3-map-provenance
    current_branch: codex/m3-map-provenance-correction
    required_base:
      anchor: A0_canonical_source
      sha: c48f71cc46ce027927224109f7b070ca489f2b15
    dispatch_packet: CLAUDE-M3-MAP-PROVENANCE-IMPLEMENTATION-RETURN-001.yaml
    dispatch_state: READY_TO_DISPATCH_AFTER_MANUAL_MAC_UNLOCK
    exact_file_ownership:
      - apps/web/e2e/web-admin-m3-operations.spec.ts
      - apps/web/src/app/(app)/operations/OperationsMapWorkspace.tsx
      - apps/web/src/app/(app)/operations/live/LiveMapInner.tsx
      - apps/web/src/app/(app)/operations/live/LiveOps.tsx
      - apps/web/src/app/(app)/operations/live/page.tsx
      - apps/web/src/app/(app)/operations/live/types.ts
      - apps/web/src/app/(app)/operations/page.tsx
      - apps/web/src/app/(app)/operations/live/loading.tsx
    database_ownership: NONE
    acceptance:
      required:
        - All M3-MAP-R01 through M3-MAP-R10 outcomes pass.
        - Focused tests pass with negative assertions for false provenance.
        - No ninth file is changed.
        - No migration, RPC, RLS, seed, capability, shell, or design file changes.
        - Independent Codex re-review returns APPROVE_FOR_SPONSOR_CONSENT or equivalent accepted status.
      produced_anchor: A1_map_provenance_accepted
    rejection_boundary:
      - Do not commit, push, or open a pull request while any correction remains failed.
      - Return defects to Claude in the same branch and exact lease.
      - Do not transfer partial edits to an authorization branch.
    rollback_boundary:
      before_commit: Preserve working tree for correction; no destructive reset or stash operation.
      after_commit_before_integration: Withhold the commit; do not cherry-pick or merge it.
      after_integration: Revert the isolated map-provenance commit; do not rewrite shared history.

  - id: G0_MAP_PROVENANCE_ACCEPTANCE
    type: INDEPENDENT_REVIEW_GATE
    requires:
      - S0_MAP_PROVENANCE_CORRECTION
    pass_evidence:
      - exact changed-file manifest
      - focused test results
      - English and Arabic runtime evidence or an explicit localization dependency block
      - 1024, 412 or 390, and 320 width evidence
      - map and accessible-list negative states
      - accepted immutable commit SHA
    fail_action: RETURN_TO_S0_WITHOUT_DOWNSTREAM_DISPATCH

  - id: G1_CONTRACT_APPROVAL
    type: SPONSOR_AND_CONTRACT_GATE
    requires:
      - G0_MAP_PROVENANCE_ACCEPTANCE
    required_decisions:
      - exact canonical region, branch, and organization identifiers and hierarchy
      - user-to-scope cardinality and temporary cross-scope access
      - row-to-scope linkage for factories, visits, people, cases, and risk exceptions
      - precise location and identity capability semantics
      - reduced projection, masking, aggregation, freshness, and invalid-coordinate semantics
      - action-to-capability and record-scope matrix
      - national-scope grantors, grantees, reason, expiry, review, revocation, and active-session behavior
      - denied-route behavior
    pass_evidence:
      - versioned decision IDs
      - approved acceptance rows
      - no unresolved P0 or P1 contract field
    fail_action: BLOCK_ALL_AUTHORIZATION_IMPLEMENTATION
    produced_anchor: A2_contract_approved

  - id: S1_AUTHORIZATION_DATABASE_FOUNDATION
    business_scope: Implement approved WP-04, WP-05 database authority, WP-03 RPC/policy alignment, and WP-02 projection authority.
    owner: ONE_DATABASE_IMPLEMENTER_TO_BE_ASSIGNED
    proposed_branch: codex/m3-operations-authorization-db
    proposed_worktree: /Users/vikramindla/Developer/Inspection-codex-m3-operations-authorization-db
    required_base:
      anchor: A1_map_provenance_accepted
      additional_contract_anchor: A2_contract_approved
    proposed_new_migration_paths_not_reserved:
      - path: supabase/migrations/20260725130000_operations_scope_authorization.sql
        owns:
          - canonical user-to-region, branch, and organization scope relations if approved
          - scoped read functions, views, or RLS predicates for Operations sources
          - supporting indexes
          - scope-change audit
      - path: supabase/migrations/20260725131000_operations_national_scope_grants.sql
        owns:
          - operations.view_all_regions capability if approved
          - governed grant semantics, expiry, revocation, and audit if approved
      - path: supabase/migrations/20260725132000_operations_write_capability_alignment.sql
        owns:
          - approved capability boundary for geo override, action resolution, notification handling, and cancellation
          - RPC and RLS alignment
          - mutation audit
      - path: supabase/migrations/20260725133000_operations_location_projection_authorization.sql
        owns:
          - operations.view_precise_location_identity capability if approved
          - governed precise and reduced read projections
          - approved location_visibility_matrix integration or supersession
    note_on_paths: >-
      These are exact proposed ownership paths only. They are not created or
      reserved by this packet and must be collision-checked immediately before
      an approved lease is issued.
    existing_migrations_read_only:
      - supabase/migrations/0001_foundation.sql
      - supabase/migrations/0002_rbac_audit.sql
      - supabase/migrations/0008_visibility_widen.sql
      - supabase/migrations/0012_admin_dossier_visibility.sql
      - supabase/migrations/0015_w1_field_home.sql
      - supabase/migrations/20260716161605_m04_device_eta_override.sql
      - supabase/migrations/20260717170000_mvp2_m2_04_risk_workbench.sql
      - supabase/migrations/20260717190000_mvp2_m2_10_case_spine.sql
      - supabase/migrations/20260717220000_mvp2_m2_06_spatial_gis.sql
      - supabase/migrations/20260721030000_planning_capabilities.sql
      - supabase/migrations/20260721093000_execution_canonical_contracts.sql
      - supabase/migrations/20260721110000_execution_access_grants.sql
      - supabase/migrations/20260721140000_execution_journey_cancellation.sql
    exact_rls_and_rpc_ownership:
