        - factories
        - visits
        - assignments
        - geo_events
        - profiles
        - cases
        - risk_exceptions
        - location_visibility_matrix
      writes:
        - action_forms
        - notifications
        - geo_override_requests
        - cancellation_requests
      functions_and_capabilities:
        - has_capability extension only if the approved grant model requires it
        - decide_geo_override alignment
        - decide_active_cancellation verification or alignment
        - approved scoped Operations read projections
        - operations.view_all_regions if approved
        - operations.view_precise_location_identity if approved
    proposed_test_ownership:
      create:
        - apps/web/e2e/web-admin-m3-operations-scope-rls.spec.ts
        - apps/web/e2e/web-admin-m3-operations-projection-rls.spec.ts
        - apps/web/e2e/web-admin-m3-operations-write-rls.spec.ts
        - apps/web/e2e/web-admin-m3-operations-national-grants.spec.ts
      modify:
