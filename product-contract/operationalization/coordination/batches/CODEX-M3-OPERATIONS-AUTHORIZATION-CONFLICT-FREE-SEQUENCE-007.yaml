      - Denial happens before protected reads.
      - operations.view grants match the approved role contract.
      - Denied-route behavior matches G1.
      - No shell or map regression.
    produced_anchor: A6_route_consumer_accepted
    rollback_boundary:
      - Revert the isolated route consumer commit.
      - Never restore access by broadening database RLS.
      - If navigation fails, preserve direct-route denial while repairing discoverability.

  - id: S4_WRITE_CAPABILITY_CONSUMER
    work_package: WP-03
    business_scope: Bind Operations controls and server actions to approved write capabilities and record scope.
    owner: ONE_ACTION_IMPLEMENTER_TO_BE_ASSIGNED
    proposed_branch: codex/m3-operations-write-authorization
    proposed_worktree: /Users/vikramindla/Developer/Inspection-codex-m3-operations-write-authorization
    required_base:
