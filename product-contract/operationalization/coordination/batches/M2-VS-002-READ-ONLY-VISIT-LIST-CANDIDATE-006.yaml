    - created_date
    - package_version
    - bulk_plan_reference
  truth_rules:
    - all_active_filters_apply_with_AND_semantics
    - region_constrains_city_options
    - changing_any_filter_resets_page_to_1
    - URL_state_survives_refresh_and_detail_navigation
    - unavailable_filter_source_is_not_rendered_as_no_options
    - option_sets_are_complete_or_explicitly_searchable

