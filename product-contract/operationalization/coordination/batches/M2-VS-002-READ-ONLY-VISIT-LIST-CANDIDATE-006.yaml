      - export
      - draft_continue_and_discard
      - refresh_action
      - legacy_detail_links
  list_service:
    path: apps/web/src/lib/planning/visit-list.ts
    status: PARTIAL_WITH_BLOCKING_CORRECTNESS_DEFECTS
    ready:
      - server_only
      - RLS_scoped
      - fail_closed_query_result
      - whitelist_sort
      - combinable_filters
      - planning_status_counts
      - stable_id_sort_tiebreak
    blocking_defects:
      - id: LIST-TOTAL-001
        finding: >
          The non-search row query does not request an exact count, so
          rowResults[0].count is null and total falls back to current-page row
          length. Next-page availability and total counts are therefore false.
      - id: SEARCH-CAP-002
        finding: >
          Related search dimensions cap factories/plans at 500 and inspectors
          at 200 despite the code claiming a complete result set. Valid matches
          beyond those caps can disappear.
      - id: FILTER-OPTION-CAP-003
        finding: >
          Region/city option reads are capped at 1000 factory rows, package
          versions at 500, and inspector reads rely on provider defaults.
          Required filter choices are not proven complete.
      - id: LIFECYCLE-SCOPE-004
        finding: >
          The All query does not explicitly whitelist the governed planning
          statuses. Unknown/out-of-contract values could enter a workspace that
          claims Planning-lifecycle-only scope.

KPI_contract:
  exact_cards:
    - Draft
    - Published
    - Returned
    - Cancelled
    - Expired
  mapping:
    Draft: "planning_status IN ('draft','validated'); validated is internal and folds into Draft"
    Published: "planning_status = 'published'"
    Returned: "planning_status = 'returned'"
    Cancelled: "planning_status = 'cancelled'"
    Expired: "planning_status = 'expired'"
  grain: "RLS-visible visits after active search and non-status filters."
  excluded_from_KPIs:
    - operational_state
    - inspection_status
    - executing_now
    - expiring_within_unapproved_threshold
  interaction: "Selecting a card sets the status tab, resets page to 1 and preserves other URL-backed filters/search."
  truth_rule: "Every displayed count must equal a direct RLS-scoped count query at the same filter grain."

search_contract:
  match_behavior: partial_case_insensitive
  required_dimensions:
    - Visit_ID_or_reference
    - Factory_Name
    - CR_Number
    - Industrial_License
    - Inspector
  permitted_additional_dimensions:
    - plan_reference
    - internal_reference
  completeness_rule: >
    Every permitted matching visit must be retrievable. Fixed pre-query caps
    that silently omit matching records are prohibited.
  safety:
    - escaped_PostgREST_wildcards_and_group_syntax
    - exact_UUID_support
    - deterministic_sort_and_pagination
    - RLS_scope_preserved
    - failed_dimension_read_returns_unavailable_not_empty

filter_contract:
  required_combinable_filters:
    - planning_status
    - business_visit_type
    - region
    - city
    - visit_window_overlap
    - inspector
  permitted_additional_filters:
