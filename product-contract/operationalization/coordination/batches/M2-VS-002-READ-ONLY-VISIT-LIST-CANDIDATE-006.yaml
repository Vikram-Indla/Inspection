  target_route: /planning/visits
  review_route: /planning/visits?wa_preview=1
  target_route_source: product-contract/web-admin-phase1/WEB_ADMIN_SHELL_AUTHORITY.md
  current_status: REQUIRES_PRODUCT_OWNER_APPROVAL_AND_DESIGN_CORRECTION
  material_conflicts:
    - >
      The design shows Published, Executing now, Expiring within 48 hours and
      Returned. CR-054 requires Draft, Published, Returned, Cancelled and
      Expired, and explicitly excludes execution statuses from KPIs.
    - >
      The 48-hour threshold is not policy authority and may not be invented
      from prototype fixture text.
    - >
      The design includes selection and management-action affordances owned by
      CR-071/CR-075 and prohibited in this read-only candidate.
    - >
      The design file's English surface embeds an Arabic-only wordmark; the
      approved F0 bilingual wordmark and shell authority must override it.
  required_design_resolution:
    - replace KPI cards with the five canonical planning-status counts
    - remove execution-status and unsupported threshold KPIs
    - remove selection, bulk actions and operational alerts
    - retain search, combinable filters, sortable paginated list and open-detail link
    - inherit the certified F0 shell and bilingual identity
    - provide loading, empty, unavailable, unauthorized and RLS-zero states
    - provide EN/AR, light/dark, 1440/1024/390/320 frames

current_route_component_service_readiness:
  route_wrapper:
    path: apps/web/src/app/(app)/planning/visits/page.tsx
    status: PARTIAL
