evidence_matrix:
  base_frames:
    rule: >-
      Capture every viewport in EN/LTR and AR/RTL, light and dark, for the
      loaded reference state. This yields 20 frames per successor and proves
      that 412 and 390 are independent implementations.
  state_frames:
    rule: >-
      Capture every applicable negative state at its reference desktop and at
      390 AR/RTL light. Provider-unavailable, unauthorized, degraded,
      stale/conflict and not-found may not be evidenced only in English desktop.
  interaction_evidence:
    - "Keyboard trace from skip link through shell, search/filter, result selection, licence switching, dossier disclosures, documents and safe actions."
    - "Mobile drawer focus entry, containment, Escape and restoration."
    - "Licence refresh announcement and focus behavior."
    - "Section retry announcement and focus return."
    - "Map/list synchronized selection and accessible alternative."
    - "Automated contrast and semantic checks plus manual screen-reader annotations."
  required_manifest_fields:
    - "packet, logical ID, successor revision and SHA-256"
    - "route, state, persona/data scope, locale, direction, theme and viewport"
    - "source/provider condition"
    - "capture timestamp and reviewer"
    - "P0/P1 result and blocker ID"

