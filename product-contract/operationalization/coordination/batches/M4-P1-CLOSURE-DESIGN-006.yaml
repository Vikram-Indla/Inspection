    - "Both predecessors re-export byte-identically after successor creation."
    - "Every P1 closure row is evidenced."
    - "No P0/P1 remains."
    - "Both successors receive one bundle disposition; never partial acceptance."
  stop_conditions:
    - "Any predecessor, mapping, route, provider contract, API, workflow, data or policy would need modification."
    - "Any canonical capability is removed, hidden without authority or converted into a permanent mock."
    - "Any applicable state, viewport, Arabic/RTL or accessibility evidence is missing."
    - "Any P0/P1 remains."
    - "The platform cannot create under exact unused successor filenames."

