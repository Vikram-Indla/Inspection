  purpose: >-
    Let authorized business users find a factory and inspect its complete,
    read-only, source-labelled longitudinal dossier without losing required
    capability when a provider or subsection is unavailable.
  process: P12
  screen: SCR-WEB-400
  requirements: ["CR-410..CR-429"]
  acceptance:
    module: ["WA-M4-AC-001..006"]
    shell: ["WA-SHELL-AC-010..012", "WA-SHELL-AC-016"]
    design: ["DSG-A11Y-001"]
    factory_360: ["AC-0410..AC-0429", "F360-AC-001..F360-AC-018"]
  engines: ["ENG-04", "ENG-06", "ENG-07", "ENG-08", "ENG-09", "ENG-11", "ENG-12"]
  routes: ["/factories", "/factories/:id", "/factories/cr/:id"]
  application_components:
