requirement_preservation:
  groups:
    - ids: ["CR-410..CR-414"]
      capabilities:
        - "Full dossier, overview, licence, commercial registration and separate official/planner/observed locations."
      screen_owner: "WA-DES-026 discovery and WA-DES-027 full dossier."
    - ids: ["CR-415..CR-418"]
      capabilities:
        - "Products, raw materials, workforce and investment/capacity as read-only source-labelled facts."
      screen_owner: WA-DES-027
    - ids: ["CR-419..CR-422"]
      capabilities:
        - "Visit and inspection history, approved compliance outcomes, violations, penalties and corrective actions."
      screen_owner: WA-DES-027
    - ids: ["CR-423..CR-424"]
      capabilities:
        - "Health and risk outputs only from governed Risk Engine results with model/source traceability."
      screen_owner: WA-DES-027
      decision_boundary: >-
        DEC-001 and DEC-028 remain open. Never invent a score, band, target,
        driver, recalculation date or explanation. Render Not Available when the
        governed result is absent.
    - ids: ["CR-425..CR-426"]
      capabilities:
        - "Permission-scoped documents/evidence and immutable business timeline."
      screen_owner: WA-DES-027
    - ids: ["CR-427..CR-429"]
      capabilities:
        - "Registry-to-dossier navigation, role/data-scope protection and independently failing partial-profile behavior."
      screen_owner: "Both successors."
  hard_business_rules:
    - "Factory 360 is a full page, not the small Factory Card."
    - "One Commercial Registration can contain multiple Industrial Licences; one licence is selected and changing it refreshes every dependent section."
    - "The module is read-only; only separately governed Create Inspection, Map, PDF, preview and download actions appear when authorized."
    - "Planner, licence and observed coordinates stay separate; none overwrites another."
    - "No CR-level risk or compliance score is calculated."
    - "Compliance Rate is Not Available without an approved inspection; only approved inspections contribute."
    - "Returned and rejected inspections remain visible for audit, but visits do not appear inside the Compliance section."
    - "Historical violations, source facts, documents and timeline events are never silently removed."
    - "One integration failure does not fail the whole dossier."

truthful_source_and_brand_correction:
  provider:
    configured: >-
      Display the governed source name and source_synced_at only when those
      permitted values exist. Keep the source label attached to the affected
      fact or section.
    unconfigured: >-
      Display "Source not configured". Omit provider version, synchronization
      claim and timestamp.
    unavailable: >-
      Display the section as unavailable or degraded with its retained
      last-permitted facts only when the contract permits them. Do not claim
      freshness without a source timestamp.
    prohibited:
      - "Literal MODON provider claims."
      - "Invented source version such as v6."
      - "Invented recorded/synchronization time."
      - "Empty provider parentheses."
      - "A permanent mock presented as live provider data."
  brand:
    expanded_dark_surface: "Approved bilingual SAQEEL | صقيل dark-surface asset."
    expanded_light_surface: "Approved bilingual SAQEEL | صقيل light-surface asset only on a genuinely light rail."
    collapsed_or_mobile: "Approved shield/favicon mark with accessible product name."
    prohibited: ["Typed Arabic-only or English-only substitute", "صناعي sub-brand", "Industrial sub-brand"]

p1_closure:
  responsive:
    id: M4-DESIGN-P1-RESPONSIVE-001
    status: SPECIFIED_NOT_EVIDENCED
    shared_rules:
      - "No horizontal page overflow at any required width or 200 percent zoom."
      - "Use the approved desktop expanded/collapsed shell and mobile modal drawer; do not create a second navigation model."
      - "Mobile drawer has backdrop, explicit close, focus entry/containment, Escape dismissal and focus restoration."
      - "All actions, filters, provenance and permission notices remain reachable at every width."
      - "Tables may use an internally bounded scroll region only when the same facts remain available in an accessible row/card alternative."
      - "Sticky elements may not cover content, focus indicators, error summaries or the final row."
    viewport_contract:
      - viewport: "1200x860"
        applies_to: WA-DES-026-C1
        required_layout: >-
          Expanded authenticated shell; one page header; search and view switch;
          filters; bounded factory result region; list and map modes; source
          truth notice and result count visible without overlap.
      - viewport: "1440x900"
        applies_to: WA-DES-027-C1
        required_layout: >-
          Preserve the three-zone structure: licence portfolio/navigation,
          selected-factory dossier, and sticky AI/provenance rail. The centre
          owns primary reading order; the rails may not steal heading order.
      - viewport: "1024x768"
        applies_to: "Both successors."
        required_layout: >-
          Use the approved compact/collapsed desktop shell. WA-DES-026 keeps
          search, filters and List/Map visible with a bounded result region.
          WA-DES-027 moves the licence portfolio above the dossier, retains a
          centre reading column and a bounded trust/provenance panel; no
          subsection or action disappears.
      - viewport: "412x915"
        applies_to: "Both successors."
        required_layout: >-
          Use the mobile modal drawer. Page header, search, filters and actions
          become logical single-column groups. Registry table rows become
          complete factory cards. Factory 360 orders selected context, licence
          switcher, actions, dossier sections, AI/trust and timeline without
          dropping the three semantic zones.
      - viewport: "390x844"
        applies_to: "Both successors."
        required_layout: >-
          Provide a distinct 390 state, not a 412 label reuse. Tighten spacing
          through approved tokens while retaining full labels, provenance,
          touch reachability, focus visibility and all actions.
      - viewport: "320x800"
        applies_to: "Both successors."
        required_layout: >-
          One-column reflow with no page-level horizontal scroll. Identifiers,
          dates, coordinates and source labels wrap or use bounded scrolling;
          action groups stack; comparison facts remain labelled; nothing relies
          on clipped icons or hover.

  locale:
    id: M4-DESIGN-P1-LOCALE-002
    status: SPECIFIED_NOT_EVIDENCED
    requirements:
      - "Provide complete EN/LTR and AR/RTL variants for both successors at every required viewport."
      - "Arabic is an entire document state, not isolated Arabic field values inside an English shell."
      - "Desktop navigation is physically right in RTL and left in LTR; the dossier zone order mirrors meaningfully."
      - "At wide RTL, licence portfolio is at logical start/right, dossier remains central and trust/AI rail is at logical end/left."
      - "Use logical start/end alignment, padding and chevrons. Do not mirror the shield, charts, map geography or status meaning."
      - "Keep CR numbers, licence IDs, HS codes, coordinates, hashes and machine timestamps in isolated LTR spans within Arabic text."
      - "Use canonical localization keys and approved Arabic copy. Unapproved machine translation is marked TRANSLATION_PENDING and blocks acceptance."
      - "Long Arabic labels, mixed-direction source metadata, empty/error text, filter chips and modal/drawer controls must not clip."
      - "The bilingual SAQEEL | صقيل identity remains canonical in both locales."

  states:
    id: M4-DESIGN-P1-STATES-003
    status: SPECIFIED_NOT_EVIDENCED
    common_behavior:
      - "Every state has a visible title, plain-language explanation, permitted next action and screen-reader announcement."
      - "A state changes only the affected route or subsection; no integration failure blanks unrelated permitted data."
      - "Never confuse zero authorized records with authorization failure."
      - "Never use stale data without its source and timestamp, and never resolve a discrepancy by overwriting."
    registry_WA_DES_026_C1:
      loading: "Preserve header/filter geometry; mark results busy; use non-interactive skeleton rows/cards and map placeholder."
      empty: "Authorized zero result. Distinguish no factories from filters producing no matches; preserve reset/search action."
      error: "Registry load failed. Show retry and safe navigation; no stale rows masquerade as current."
      degraded: "Available factory identity remains usable while risk/map/source subsection failure is named locally."
      unauthorized: "No factory facts render. Explain access boundary and provide a safe return route."
      stale_conflict: "Show source/timestamp and discrepancy state; keep records read-only and link to governed review path when one exists."
      provider_unavailable: "Show platform-permitted identity where available plus 'Source not configured' or provider unavailable; no provider/version fabrication."
      not_found: NOT_APPLICABLE_TO_COLLECTION_ROUTE
    dossier_WA_DES_027_C1:
      loading: "Preserve all three semantic zones with labelled skeletons; selected licence and actions are not falsely enabled."
      empty: "Existing CR with no permitted licence/detail records. Keep CR context, state reason and return-to-registry action."
      error: "Root factory identity failed. Show full-page error, retry and return-to-registry; reveal no partial sensitive data."
      degraded: "Render every healthy subsection and an inline retry/unavailable card for each failed subsection."
      unauthorized:
        route: "No dossier data renders when view_factory_360 is absent."
        section: "Permission-restricted documents, contacts, risk details and actions are hidden or replaced by a scoped denial without leaking counts."
      stale_conflict: "Show current official and observed snapshot separately with source/timestamp; label discrepancy as requiring review; never merge/overwrite."
      provider_unavailable: "Keep Inspection Platform history and permitted facts; source-dependent industrial/government areas fail closed with truthful status."
      not_found: "Unknown factory/CR/licence. Show not-found title, searched identifier and return-to-registry action without revealing whether an unauthorized object exists."
      map_provider_failure: "Location facts and accessible coordinate list remain; no schematic replacement map or invented pin."
      no_approved_inspection: "Compliance Rate is 'Not Available', not zero."
      no_documents: "Friendly permission-aware empty state; no upload action in Factory 360."
      no_risk_result: "Risk/health is 'Not Available'; no fallback score or AI explanation."

  accessibility:
    id: M4-DESIGN-P1-A11Y-004
    status: SPECIFIED_NOT_EVIDENCED
    semantic_contract:
      - "One h1 per route, ordered h2/h3 subsection headings, named nav/main/aside/region landmarks and a skip-to-content link."
      - "Factory result count, state changes, retries and licence refresh completion use appropriate polite announcements; blocking errors use an error summary."
      - "Loading regions expose busy state; skeletons and decorative icons are hidden from assistive technology."
      - "Status, risk, compliance, discrepancy and provider health use text/icon/shape and never color alone."
      - "Tables have captions, column headers and row identity; narrow card alternatives preserve every column's label."
      - "Charts have textual summary and data/table alternative. Maps have synchronized keyboard-operable list alternatives."
      - "Documents expose file type and action; unavailable or unauthorized actions do not appear as unexplained dead links."
      - "Dates, codes, coordinates and mixed-direction values have explicit reading direction."
    keyboard_contract:
      - "Focus order follows visual/semantic reading order in each locale."
      - "All navigation, search, filters, List/Map switch, licence cards, disclosures, tabs, links and permitted actions are keyboard operable."
      - "Active/selected state is programmatically exposed; focus is visible in light and dark at every viewport."
      - "Modal drawer and any dialog trap focus, close with Escape and restore focus to their invoker."
      - "Licence selection moves focus to the refreshed dossier heading or announces completion without unexpected page loss."
      - "Section error Retry returns focus to the repaired region heading."
      - "No hover-only details, icon-only unexplained action or focus-obscuring sticky region."
    visual_contract:
      - "WCAG 2.2 AA text, non-text control and focus contrast in light and dark."
      - "200 percent zoom and 320 CSS-pixel reflow."
      - "Reduced motion; no information exists only in animation."
      - "Target sizes and input geometry follow the approved authenticated shell/component contract."

