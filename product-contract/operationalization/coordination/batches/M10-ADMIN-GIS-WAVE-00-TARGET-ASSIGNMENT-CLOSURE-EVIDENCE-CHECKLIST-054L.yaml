  - reject any null required field as MISSING
  - reject a blank template, synthetic example or checklist as assignment receipt
  - reject historical approval outside exact request scope
  - reject runtime role, access capability or task ownership as assignment authority
  - reject identity, channel, destination or sender inferred from context
  - reject source or receipt with absent or mismatched hash
  - reject expired or unbounded assignment
  - reject implied or scope-expanding delegation
  - reject unresolved authorship, ownership, review or implementation conflict
  - reject missing, partial, stale, inferred or unverified prerequisite response
  - reject any weakening of non-authorization, hold, privacy, non-counting or independence boundaries
  - reject any claim that checklist PASS or validator ACK authorizes dispatch or implementation

