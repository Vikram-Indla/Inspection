responsive_arabic_theme_accessibility:
  viewports:
    - {viewport: 1440x900, expectation: Full cards and two bounded operational tables without page overflow.}
    - {viewport: 1200x900, expectation: Exact WA-DES-020 comparison viewport while demonstrating semantic mismatch, not visual replication.}
    - {viewport: 1024x768, expectation: Cards and tables reflow without clipped actions or hanging shell.}
    - {viewport: 768x1024, expectation: Single task order with source status retained beside each table.}
    - {viewport: 412x915, expectation: Labelled records replace wide tables; no peeking submenu icons or hidden governed actions.}
    - {viewport: 390x844, expectation: Pending, denial, error, and policy-held parity without two-dimensional scroll.}
    - {viewport: 320x568, expectation: No task loss, overlap, clipped identity, or detached action/status relationship.}
  locales:
    - {locale: en, direction: ltr}
    - {locale: ar, direction: rtl}
  bidi_rules:
    - Use logical properties and mirror structural layout.
    - Keep flag keys, versions, error codes, operation names, timestamps, and identifiers LTR.
    - Localize headings, source states, actions, validation, denial, policy holds, and recovery.
    - Require qualified native-Arabic review before acceptance.
  themes: [light, dark]
  theme_evidence:
    - Shell, cards, tables/records, status, policy banner, buttons, focus, disabled, pending, error, and unavailable states.
    - Lifecycle and severity use words/icons/shape plus color.
  accessibility:
    - One h1, ordered headings, semantic regions, and labelled tables or labelled-record reflow.
    - Visible single focus treatment and logical LTR/RTL keyboard order.
    - Forty-four-pixel minimum governed-action targets.
    - Unique accessible action names include the target error or flag.
    - Pending and result messages are announced; focus moves to the result without losing context.
    - Long safe error codes and flag keys wrap without obscuring meaning.
    - Prove 200 percent zoom and 400 percent or 320 CSS-pixel equivalent reflow.
    - Reduced motion and no animation-dependent lifecycle meaning.

p0_return_gates:
  - id: P0-IDENTITY
    return_if: A design/screen/frame ID or filename is invented, reused, inferred, or allocated outside governance.
  - id: P0-CD050-LINEAGE
    return_if: CD-050 is ignored, overwritten, or claimed route-specific without package/frame/fingerprint proof.
  - id: P0-WA-DES-020
    return_if: The Control Panel catalogue remains mapped or is used as the Operations predecessor.
  - id: P0-REQUIREMENT
    return_if: CR-001..478 or all 14 M3-00 rows are claimed as completed by this route.
  - id: P0-CAPABILITY
    return_if: Integration, Security Access, Devices, Admin Home, Planning, Field, or Factory behavior is absorbed.
  - id: P0-HEALTH
    return_if: Configured/count is presented as live health, uptime, throughput, SLA, freshness, or connectivity.
  - id: P0-RETRY
    return_if: Retry requested is presented as executed, delivered, resolved, or receipt-confirmed.
  - id: P0-FLAG-LIFECYCLE
    return_if: Create/edit/delete/rollback/self-approve/schedule or unsupported publication behavior is shown.
  - id: P0-AUTHORIZATION
    return_if: Navigation, authentication, or one role label is presented as universal read/action authority.
  - id: P0-CONFIDENTIALITY
    return_if: A denied persona sees source data, raw errors, provider details, credentials, payloads, or actions.
  - id: P0-SOURCE-TRUTH
    return_if: Failed, denied, or bounded source data is presented as verified zero or complete.
  - id: P0-RAW-ERROR
    return_if: Database/provider/internal RPC error text is exposed in the design.
  - id: P0-CONFLICT-AUDIT
    return_if: Conflict safety or audited completion is claimed without actor, object, before/after, timestamp, version, and no-change evidence.
  - id: P0-POLICY-PROVIDER
    return_if: Retention, purge, backup, restore, RPO/RTO, EBDA, notification, or production readiness is invented or shown enabled while held.
  - id: P0-IMPLEMENTATION-CLAIM
    return_if: Module authority, design frames, route smoke, schema tests, or screenshots are used to claim full runtime completion.

p1_return_gates:
  - id: P1-STATE-COVERAGE
    return_if: Required access, source, retry, flag, provider, policy, failure, or recovery state is missing.
  - id: P1-RESPONSIVE
    return_if: Any viewport clips, overlaps, hangs the shell, peeks submenu icons, hides actions, or detaches action from status.
  - id: P1-ARABIC-RTL
    return_if: Arabic is untranslated, unreviewed, directionally broken, or reverses identifiers/codes/versions/timestamps.
  - id: P1-THEME
    return_if: Light/dark contrast or state parity fails in shell, cards, records, statuses, actions, focus, errors, or holds.
  - id: P1-ACCESSIBILITY
    return_if: Labels, headings, regions, focus, target size, keyboard flow, announcements, or unique action names are missing.
  - id: P1-ZOOM-MOTION
    return_if: 200/400 percent zoom or reduced-motion evidence is missing or causes task loss.
  - id: P1-DATA-PROVENANCE
    return_if: Scope, source, boundedness, stored state, timestamp/freshness limitation, or fixture distinction is absent.
  - id: P1-EVIDENCE-PACK
    return_if: Identity decision, CD-050 package proof, collision check, component annotations, state index, visual matrix, limitations, or export fingerprint is incomplete.

