capability_boundary:
  admin_operations_owns:
    - RLS-visible endpoint contract counts with configured status explicitly separated from health.
    - RLS-visible error queue records and bounded retry-request action.
    - Feature-flag version visibility and independent-checker publication action.
    - Honest policy-held retention, backup target, and restore-objective state.
    - Source-specific unavailable, partial, stale, denied, and conflict truth.
  adjacent_surfaces_own:
    integration_hub: Endpoint registry, API events, export jobs, receipts, and source-specific integration trust evidence.
    security_access: Access reviews, evidence grants, purpose, expiry, and security posture.
    devices: Device trust, package access, and governed device commands.
    admin_home: Configuration evidence spine and Admin navigation.
  explicitly_excluded:
    - Provider credentials, secret values, base URLs, payloads, or raw internal errors.
    - Live connectivity, uptime, latency, throughput, SLA, job completion, or platform-health claims.
    - Error create, resolve, cancel, replay, or execution beyond the real retry-request RPC.
    - Feature-flag create, edit, delete, rollback, self-approval, or uncontracted scheduling.
    - Retention period, purge, legal hold, backup target, restore, RPO, RTO, or successful-restore claims while held.
    - Integration configuration, security review, device command, planning, inspection, or Factory 360 behavior.

