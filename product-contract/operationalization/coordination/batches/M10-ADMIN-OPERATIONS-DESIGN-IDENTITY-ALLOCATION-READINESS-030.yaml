  rendered_title: Platform operations and resilience
  code_authority_badge: M3-00_CD-050
  reads:
    error_queue:
      table: mvp3_error_queue
      fields: [id, source, operation, status, attempt_count, last_error_code, created_at]
      limit: 50
    feature_flags:
      table: mvp3_feature_flags
      fields: [id, flag_key, version, description, enabled, status, created_by, approved_by]
    integration_endpoints:
      table: mvp3_integration_endpoints
      fields: [id, status]
  derived_counts:
    endpoint_contracts: RLS-visible endpoint rows; not provider health.
    configured_endpoints: Stored status equals configured; not connectivity or uptime.
    open_errors: Returned rows not resolved; not throughput or platform reliability.
    published_flags: Returned flag rows whose stored status is published.
  governed_actions:
    - action: Request idempotent retry
      rpc: mvp3_request_error_retry
      eligible_statuses: [failed, dependency_blocked]
      success_truth: Retry requested; delivery awaits a genuine receipt.
    - action: Approve and publish feature flag
      rpc: mvp3_publish_feature_flag
      eligible_statuses: [draft]
      success_truth: Independent checker publication; maker cannot approve own flag.
  current_truth_gaps:
    - Only the error-queue read error is handled; flag and endpoint read failures can appear as verified zero.
    - The route supplies no route-specific authorization boundary beyond shared channel handling, navigation visibility, RLS, and RPC checks.
    - RPC error.message is returned raw to the client.
    - The route does not prove stale-version conflict handling or action idempotency beyond the stored RPC behavior.
    - Error rows are bounded to 50 without a total or completeness label.
    - Action tests do not prove refreshed persistence, maker self-approval denial, or retry receipt distinction on this route.

