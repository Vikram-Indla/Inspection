    rule: Navigation visibility grants nothing and is not equivalent to route authorization.
  source_visibility:
    error_queue_read: [ops, security_admin, auditor]
    endpoint_read: [security_admin, workflow_admin]
    feature_flag_read: ALL_AUTHENTICATED_UNDER_CURRENT_RLS
  action_authority:
    request_retry: [ops, security_admin]
    publish_feature_flag: [security_admin]
    publish_separation_of_duties: Maker cannot approve own draft.
  persona_implications:
    security_admin: Can read all three current sources and invoke both actions subject to row/state guards.
    workflow_admin: Can read endpoints and flags; error queue is RLS-empty and actions are denied.
    ops: Can read error queue and flags and request retry; navigation currently does not advertise the route.
    auditor: Can read error queue and flags; no action authority.
    other_authenticated: Current flag RLS may expose flag rows while other sources are empty; route-specific denial is absent.
  required_decision: >-
    Governance must reconcile route admission, navigation, source visibility,
    and action roles. The design may depict proven per-source scopes but must
    not invent one universal Platform Admin persona.

data_and_provider_truth:
  data_rules:
    - Count only successfully returned RLS-visible rows.
    - Distinguish verified zero from RLS-empty, failed source, bounded prefix, and unavailable schema.
    - Show loaded count and total only when both are source-backed.
    - Preserve stored status and version; do not convert configured into healthy.
    - Retry requested is not job executed or delivered.
    - Publication success is not proof that downstream services consumed the flag.
  provider_holds:
    - id: MVP3-HOLD-004
      scope: EBDA and data exchange
      effect: Prepared export may not be presented as transmitted without approved endpoint, credentials, schema, transport, retry, and receipt.
    - id: MVP3-HOLD-005
      scope: Notification channels
      effect: External delivery must remain unavailable and retry-safe until providers/templates are approved.
    - id: MVP3-HOLD-006
      scope: Retention and backup
      effect: No destructive purge or configured backup/restore claim.
    - id: MVP3-HOLD-008
      scope: Production release
      effect: Local/runtime evidence is not deployment or production operations proof.
  provider_boundary: No provider probe or service-control action exists on this route.

