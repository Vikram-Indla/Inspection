existing_code_behavior_to_preserve:
  regulations:
    - "Draft-only edit; distinct maker/checker publication RPC."
    - "Every clause must map to an inspection item before publish."
    - "Effective-date ordering, immutable published version and mandatory deactivation reason."
    - "Attachment upload is non-overwriting and compensates metadata failure by removing the just-uploaded object."
    - "Configuration audit and neutral provider errors."
  items:
    - "Regulation-clause ownership, unique item codes and governed response/evidence presets."
    - "Optimistic version check and stale-edit rejection."
    - "Edits blocked until every governed package reference has a frozen item snapshot."
    - "Mandatory deactivation reason, usage evidence and RLS role guard."
  packages:
    - "Draft-only editor; prior versions remain immutable and in-flight execution remains pinned."
    - "Publish-impact aggregate without leaking row-level objects."
    - "Dependency validation covers active regulation, item relationship, conditions/cycles, evidence rules, action forms, templates, violations and penalty mapping."
    - "Publish freezes item, violation and template semantics into the version snapshot."
    - "Maker-checker publication RPC and reasoned deactivation."
  violations_penalties:
    - "Violation code is configuration, distinct from runtime violation; inspector cannot author/override it."
    - "Legal-clause anchor, version, effective dates, usage trace, audit and maker-checker publication."
    - "One violation to one penalty mapping; legal basis required and never inferred."
    - "Penalty range/repeat values come only from governed presets; optional template reference is immutable."
    - "Current logical penalty route remains /admin/violations?mode=penalty until an approved route change."

meaningful_design_code_delta:
  WA_DES_015:
    strengths:
      - "Shows regulation, package, item and violation registries with version/freeze language."
      - "Separates unavailable reads from verified zero."
    gaps:
      - "Mostly static summary rows; does not expose complete create/edit/validate/publish/deactivate flows or route-specific errors."
      - "Violation mode omits configuration version history, usage/audit, deactivation and penalty mapping."
      - "Package mode omits the full dependency blocker list and template registry."
      - "Item mode omits stale-edit, frozen-snapshot and deactivation behavior."
  WA_DES_002:
    strengths:
      - "Provides detailed regulation lineage, package version impact and item runtime preview."
    gaps:
      - "No complete negative-state, stale/conflict or unauthorized-state controls."
      - "No route-level list/detail navigation contract."
      - "Risk and Planning modes create unrelated authority and policy conflicts."
  WA_DES_005:
    strengths:
      - "Three-zone builder, bilingual item fields, runtime preview and maker-checker concept."
    gaps:
      - "No implemented route."
      - "No section creation/reordering interactions, condition expression editor, circular dependency error, response-level evidence rule, template/action-form registry, save conflict or publish blocker summary."
      - "Preview is an isolated Arabic sample rather than complete EN/LTR and AR/RTL parity."
  penalty:
    gap: >-
      There is no exact design for violation-to-penalty mapping, legal basis,
      mapping version, effective lifecycle, range/repeat preset, optional amount,
      timing, immutable template and maker-checker publication.

p0_risks:
  - id: M9-DES-P0-001
    finding: >-
      WA-DES-015 contains the missing registry designs but is registered only
      to /admin. WA-DES-002 is overloaded across Compliance, Risk and Planning.
      Route/design ownership is not deterministic.
    action: RETURN_FOR_MAPPING_CORRECTION
  - id: M9-DES-P0-002
    finding: >-
      SCR-ADM-031 /admin/packages/:id/designer has a design but no code route;
      SCR-ADM-041 penalty mapping has code but no exact design. Neither can be
      called complete.
    action: BLOCK_DUE_TO_MISSING_ROUTE_AND_DESIGN
  - id: M9-POLICY-P0-003
    finding: >-
      WA-DES-002 shows item score weight 5 and risk bands/weights; WA-DES-005
      shows weight 0.15. WA-DES-015 shows item weights. CR-471/472 are explicitly
      blocked by DEC-001/DEC-028.
    action: BLOCK_DUE_TO_MISSING_CONTRACT
  - id: M9-LEGAL-P0-004
    finding: >-
      The designs present concrete authorities, clauses, provider names,
      severity, grace periods and legal/configuration counts as if authoritative
      without per-value provenance. Examples include MODON, Critical,
      seven-day grace and specific clause/penalty relationships.
    action: CHANGE_DESIGN_TO_GOVERNED_OR_NOT_AVAILABLE_VALUES
  - id: M9-CODE-P0-005
    finding: >-
      apps/web/src/app/(app)/admin/items/actions.ts accepts score_weight even
      though the governing risk/health scoring decisions remain open. Design
      must not normalize this unresolved implementation contract.
    action: BLOCK_DUE_TO_OPEN_DECISION
  - id: M9-REGRESSION-P0-006
    finding: >-
      Literal design replication would remove current stale-write, immutable
      snapshot, dependency validation, audit/usage, legal-basis and maker-checker
      safeguards that the designs do not show.
    action: PRESERVE_CODE_BEHAVIOR_AND_CORRECT_DESIGN

p1_risks:
  - id: M9-DES-P1-001
    finding: >-
      WA-DES-002/015 use fixed 256px rails and WA-DES-005 a fixed 248px rail.
      One 1180px builder collapse is not proof of 1024, 412, 390 and 320 layouts.
  - id: M9-DES-P1-002
    finding: >-
      English screens use typed Arabic-only or Arabic-plus-ADMIN/صناعي branding,
      not the approved bilingual SAQEEL | صقيل asset.
  - id: M9-DES-P1-003
    finding: >-
      Arabic item snippets and one RTL preview do not constitute complete
      AR/RTL route variants, mirrored navigation or localized validation.
  - id: M9-DES-P1-004
    finding: >-
      Loading, empty, unauthorized, provider error, stale/conflict, validation
      blocker, publish failure, immutable lock and no-data states are not
      independently selectable across the required routes.
  - id: M9-DES-P1-005
    finding: >-
      Keyboard reordering, focus restoration, error-summary navigation,
      table/card alternatives, live announcements and narrow sticky behavior
      are unevidenced.

