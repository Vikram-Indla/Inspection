successor_design_contract:
  shell:
    identity: "Approved SAQEEL | صقيل bilingual wordmark; no صناعي or Industrial sub-brand."
    title: "Execution Settings"
    context: "Execution control plane; stored version only when returned by the record."
    navigation: "Use the current admin shell. Do not add Risk Settings or a new route."
  layout:
    desktop: "Persistent shell with a readable one- or two-column section grid; no horizontal page scroll."
    tablet: "Collapsed/compact shell; section cards reflow without clipped labels or controls."
    mobile: "Single column, logical ordering, full-width form controls and actions, no peeking submenu icons."
    raw_json: "Closed by default, read-only, keyboard operable and safely wrapping long values."
  sections:
    - title: "Daily capacity & journey"
      capability: admin.execution_workflow
      controls:
        - "Editable daily visit capacity sourced from engine_settings; unset is visible."
        - "Read-only journey-start timing; missing means not configured/fail closed."
        - "Read-only one-penalty invariant; never make it editable here."
    - title: "Visit mode eligibility"
      capability: admin.mode_eligibility
      controls:
        - "Physical and virtual enabled states from the stored visit_modes object."
        - "Virtual OTP and appointment requirements from stored values."
        - "Self-assessment disabled and labelled Release 2."
    - title: "Cancellation & exception reasons"
      capability: admin.execution_workflow
      controls:
        - "Stable key, English label, Arabic label, add/remove/reorder."
        - "Protected keys remain visible and non-removable."
    - title: "Arrival & geofence rules"
      capability: admin.execution_workflow
      controls:
        - "Four shared integer defaults from the GIS engine row."
        - "Clear route handoff: per-factory overrides are managed in Map Settings."
    - title: "Evidence policy"
      capability: admin.evidence_policy
      controls:
        - "Only pre-existing evidence-type rules are editable."
        - "Allowed formats, maximum size and duration when present."
        - "Retention only when the stored key exists."
        - "sha256-at-sync integrity invariant remains read-only."
    - title: "Offline & sync policy"
      capability: admin.offline_policy
      controls:
        - "Optional maximum sync attempts; empty means platform default."
        - "Optional autosave interval; empty means platform default."
  action_feedback:
    saving: "Disable only the submitted section action and announce Saving."
    success: "Confirm the exact section saved and show returned/current version truth."
    validation_error: "Preserve input, show field error plus section summary, focus predictably."
    authorization_error: "Neutral denial; no configuration values from unauthorized sections."
    service_error: "Neutral recoverable error; never expose provider internals."

state_matrix:
  required:
    loading:
      design: "Skeletons preserve section and action geometry; no fabricated values."
    configured:
      design: "Render exact stored values, version and updated time only when supplied."
    partially_configured:
      design: "Configured sections remain usable; missing rows/keys are explicitly unavailable or unset."
    empty:
      design: "No engine rows/keys is not zero/default; explain that nothing is configured."
    error:
      design: "Neutral read/write failure with retry; preserve entered draft on write failure."
    unauthorized:
      design: "No capabilities yields a confidentiality-preserving no-access state."
    degraded:
      design: "One engine-row failure does not fabricate or erase healthy sections."
    stale_or_conflict:
      design: >-
        If the stored version changes while editing, block silent overwrite and
        require reload/review. The current code does not yet prove this state,
        so label it implementation gap rather than completed behavior.
    immutable_or_protected:
      design: "Read-only invariants and protected reason keys expose why they cannot be changed."
  runtime_gap: >-
    The existing page has source evidence for empty/error/no-access concepts,
    but lacks named loading/error route boundaries and a proven concurrent
    stale-write guard. The successor must disclose these as implementation
    gaps; it must not imply they already work.

