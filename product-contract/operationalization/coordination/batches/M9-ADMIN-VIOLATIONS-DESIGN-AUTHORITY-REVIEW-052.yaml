publication_and_security:
  intended_violation_path:
    RPC: publish_violation_code
    locking:
      - selected draft row
      - current active row
    behavior:
      - active-from and corrective-action validation
      - prior active deactivation
      - successor lineage
      - approver and publication timestamp
    validation: PARTIAL_ATOMIC_INTENDED_PATH
  intended_penalty_path:
    RPC: publish_penalty_mapping
    locking:
      - selected draft row
      - current active mapping
    behavior:
      - effective-from validation
      - prior active deactivation
      - successor lineage
      - approver and publication timestamp
    validation: PARTIAL_ATOMIC_INTENDED_PATH
  null_maker_regression:
    earlier_penalty_RPC: >-
      20260715200000_cd006_011_backend_completion.sql rejects created_by null.
    effective_later_RPC: >-
      20260715220000_m09_authoritative_contract_completion.sql replaces the
      function and rejects only created_by = auth.uid().
    violation_RPC: rejects only created_by = auth.uid()
    database_constraints: allow created_by null and approved_by with null maker
    implication: >-
      A legacy or malformed draft with no maker identity can be published by a
      writer without proving separation of duties.
    validation: FAIL
  direct_table_bypass:
    policy: >-
      violation_codes_admin and penalty_mappings_admin are broad FOR ALL
      policies for compliance_admin and form_admin.
    database_guard_limit: >-
      Published rows are protected after publication, but no trigger forces a
      draft-to-published transition through the governed RPC.
    bypass_effect:
      - supply approved_by directly
      - bypass current-user checker provenance
      - bypass dependency checks
      - bypass predecessor closing and supersedes lineage
      - publish without the RPC row-lock transaction
    validation: FAIL_NON_BYPASSABLE_GOVERNANCE

version_and_cardinality_truth:
  database_model:
    violation_codes:
      uniqueness: code plus configuration_version
      active_cardinality: one open governed version per code
    penalty_mappings:
      legacy_one_row_constraint: dropped
      active_cardinality: one published or locked mapping per violation
      draft_cardinality: one draft mapping per violation
      history: multiple deactivated versions permitted
  current_UI_claims:
    - "A second mapping is rejected by the database unique constraint."
    - "One violation = one penalty — the database rejects a second mapping."
    - "This violation already has a penalty mapping."
  actual_UI_behavior:
    - allows a new draft when an active mapping exists
    - selects draft before active for display
    - collapses every unique-index conflict into the obsolete duplicate-mapping error
  implication: >-
    The English and Arabic UI, source comments and tests misdescribe the
    current versioned one-active-plus-one-draft contract. A draft also hides
    the active mapping instead of enabling comparison and impact review.
  validation: FAIL_TRUTHFUL_CONTENT_AND_VERSION_COMPARISON

concurrency_and_immutability:
  strong:
    - publication RPCs lock selected and prior active rows
    - unique partial indexes limit active and draft cardinality
    - published and deactivated semantic rows are guarded against mutation or delete
    - runtime penalties snapshot the exact governed mapping
    - violation deactivation uses active_to and status predicates as a bounded state guard
  gaps:
    - direct draft-to-published update bypasses the RPC transaction
    - manually entered configuration_version and mapping_version have no generated next-version contract
    - no active-versus-draft comparison is presented
    - no stale version token is carried through authoring
    - no dedicated penalty deactivation action is exposed
    - direct publication and concurrent successor negative paths are not exercised
  validation: PARTIAL_NOT_CERTIFIABLE

provider_and_content_truth:
  template_provider:
    failure_handling: ignored
    visible_result: empty template list
    risk: unavailable is falsely presented as none
  trigger_trace_provider:
