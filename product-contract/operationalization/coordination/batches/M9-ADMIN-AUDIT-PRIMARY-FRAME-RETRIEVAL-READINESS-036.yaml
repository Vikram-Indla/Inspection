  - step: 2
    owner: Orchestrator
    action: Place the package only in approved external documentation storage and record provenance.
    evidence: exact path, bytes and SHA-256; no Git recommit of binary design output
  - step: 3
    owner: Independent reviewer
    action: Verify the ZIP inventory, internal hashes, editable source, HTML, frame IDs, renders and required matrices.
    evidence: deterministic manifest check with no missing or extra content
  - step: 4
    owner: Product governance
    action: Reconcile the /admin/audit screen identity and exact CD-054 route frame.
    evidence: approved change-control record; no inferred or reused identity
  - step: 5
