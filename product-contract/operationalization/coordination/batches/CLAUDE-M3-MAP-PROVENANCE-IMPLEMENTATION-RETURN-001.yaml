required_corrections:
  - correction_id: M3-MAP-R01
    severity: P1
    subject: "Truthful loading disclosure"
    finding: >-
      apps/web/src/app/(app)/operations/live/loading.tsx still renders
      "Projected route — not live GPS", and the updated test explicitly
      preserves that obsolete claim.
    required_outcome:
      - "Replace the loading claim with truthful neutral/provenance loading copy."
      - "Do not claim a route, live GPS, ETA, drift, refresh cadence or animation."
      - "Update the focused test to prove the obsolete projected-route claim is absent from loading.tsx."
    completion_bar: >-
      No rendered /operations/live state, including loading, contains the
      fabricated projected-route claim.

  - correction_id: M3-MAP-R02
    severity: P1
    subject: "Tier-1 accuracy disclosure"
    finding: >-
      accuracyM is carried through the types and data construction but is not
      rendered by OperationsMapWorkspace or LiveOps. The accepted tier-1
      contract requires recorded timestamp and accuracy when present.
    required_outcome:
      - "Render accuracy when accuracyM is present on /operations."
      - "Render accuracy when accuracyM is present on /operations/live."
      - "Do not invent an accuracy value or unit when the field is absent."
      - "Add source-level assertions and bounded runtime proof where the real fixture permits."
    completion_bar: >-
      A tier-1 entity shows the exact Last recorded GPS label, recorded time and
      the stored accuracy when present on both surfaces.

  - correction_id: M3-MAP-R03
    severity: P1
    subject: "Tier-2 resolving-source disclosure"
    finding: >-
      coordinateSource is carried but not rendered. The accepted tier-2
      contract requires the actual resolving source plus scheduled time.
    required_outcome:
      - "Render planner-set dispatch point when both planner coordinates resolve."
      - "Render factory official location when the planner pair is absent and the factory pair resolves."
      - "Preserve the canonical per-coordinate coalesce behavior without falsely labelling a mixed or incomplete pair as purely planner or factory."
      - "Render scheduledAt and add source-level assertions plus bounded runtime proof where the real fixture permits."
    completion_bar: >-
      Every tier-2 label on both surfaces identifies the truthful coordinate
      source and scheduled time, with no ambiguous or fabricated source.

  - correction_id: M3-MAP-R04
    severity: P1
    subject: "Geo-event read failure as an explicit fourth state"
    finding: >-
      On /operations and /operations/live, a geo-event error is surfaced by a
      banner or map-only error, but the empty fallback array is still reduced
      into projected/unavailable provenance and rendered in the accessible
      list. That falsely treats a failed read as confirmed absence.
    required_outcome:
      - "Model or propagate a dedicated position-read-error state on /operations."
      - "Model or propagate a dedicated position-read-error state on /operations/live."
      - "Do not construct or render projected/unavailable provenance from an empty fallback after geoRes or geoEventsRes errors."
      - "Apply the error state across both map and accessible list wherever provenance would otherwise be communicated."
      - "Unrelated successfully loaded context may remain visible only when it cannot communicate false position provenance."
      - "Add tests proving that a geo-event error cannot downgrade entities to tier 2 or tier 3."
    completion_bar: >-
      A failed geo-event read is visibly and structurally distinct from zero
      permitted rows on both surfaces; no false provenance remains visible.

  - correction_id: M3-MAP-R05
    severity: P1
    subject: "Truthful global observation time"
    finding: >-
      /operations/live constructs observedAt from new Date() at page render and
      labels it "Last observed", while the adjacent freshness copy states that
      the page is showing last-observed time. That value is a page-render
      timestamp, not any geo_events occurred_at value.
    required_outcome:
      - "Do not label page-render time as Last observed."
      - "Either rename the value to an honest snapshot/view-generated time or derive it from actual visible geo-event evidence."
      - "Keep per-entity observedAt as the authoritative tier-1 observation time."
      - "Add a source assertion that prevents page-render time from being presented as a geo observation."
    completion_bar: >-
      Every displayed time is explicitly either an actual recorded observation,
      a scheduled time, or an honest page snapshot time; no timestamp changes
      semantic meaning through its label.

  - correction_id: M3-MAP-R06
    severity: P1
    subject: "Finite and geographically valid map coordinates"
    finding: >-
      OperationsMapWorkspace and LiveMapInner claim that null/NaN cannot reach
      the map, but both new type guards check only lat/lng != null. Values are
      constructed with Number(...), and the foundation factories table has no
      latitude/longitude range constraint, so NaN, Infinity or geographically
      invalid coordinates can still reach GeoMap/Mapbox.
    required_outcome:
      - "Use one explicit map-only validity predicate requiring finite latitude and longitude."
      - "Require latitude within -90..90 and longitude within -180..180."
      - "Apply the predicate before GeoMap markers and before LiveMapInner GeoJSON features."
      - "Keep the entity in the accessible list with an honest invalid/unavailable location reason; do not drop the entity."
      - "Test null, NaN, Infinity and out-of-range coordinates without passing them to Mapbox."
    completion_bar: >-
      GeoMap and Mapbox receive only finite, geographically valid coordinate
      pairs, while every rejected coordinate remains represented in the list.

  - correction_id: M3-MAP-R07
    severity: P1
    subject: "WA-M3-AC-004 Arabic, RTL, responsive and accessibility evidence"
    finding: >-
      The focused test proves source strings and one 1024 KPI layout, but it
      does not exercise the new long provenance rows in Arabic/RTL, at 412/390
      or 320 widths, or under accessibility checks. The new provenance keys
      have no source-controlled Arabic fallback in the reviewed diff, and
      client toLocaleString() calls do not explicitly use the app-selected
      locale or Asia/Riyadh timezone.
    required_outcome:
      - "Format observation and scheduled times with the app-selected locale and explicit Asia/Riyadh timezone."
      - "Add English/LTR and Arabic/RTL runtime evidence for both /operations and /operations/live."
      - "Add 1024, 412/390 and 320 reflow checks covering the provenance rows, map/list split and selected details."
      - "Add keyboard/focus and accessibility checks for the updated list and detail interactions."
      - "Verify the exact new Arabic catalogue keys and values through existing governed localization evidence."
      - "If the Arabic catalogue evidence is absent, report it as a separate dependency; do not invent strings, mutate ui_strings or broaden this lease."
    completion_bar: >-
      WA-M3-AC-004 has runtime evidence for the changed surfaces, or the missing
      Arabic catalogue dependency is explicitly blocked without a false pass.

  - correction_id: M3-MAP-R08
    severity: P2
    subject: "Truthful no-mappable-position map state"
    finding: >-
      /operations/live computes hasNoPositions from inspectors.length === 0.
      When active inspectors exist but every inspector is tier 3, the list is
      populated while the map is blank and shows no map-side explanation.
    required_outcome:
      - "Compute mapped-position presence from finite, valid coordinate pairs rather than inspector row count."
      - "Show a truthful no-mappable-position notice when the list has entities but the map has no valid inspector position."
      - "Retain the full accessible list and each entity's unavailable/invalid reason."
      - "Do not call the state No inspectors currently active when inspectors do exist."
    completion_bar: >-
      A populated tier-3 list can never be paired with an unexplained blank map
      or a false zero-inspector message.

  - correction_id: M3-MAP-R09
    severity: P1
    subject: "Complete latest-per-visit evidence beyond the PostgREST row cap"
    finding: >-
      /operations/live performs one unpaged PostgREST geo_events select. This
      repository documents the provider's 1,000-row response cap and provides
      collectPostgrestPages for operations reads that require complete truth.
      Because qualifying events are globally ordered, a high-volume visit can
      consume the capped response and omit every qualifying event for another
      monitored visit, falsely downgrading that visit to tier 2 or tier 3.
    source_evidence:
      - "apps/web/src/lib/supabase-pagination.ts:1-20 documents and solves the 1,000-row cap."
      - "apps/web/src/lib/i18n.ts:110-120 independently documents the PostgREST maximum."
      - "apps/web/src/app/(app)/operations/live/page.tsx uses no range, limit, pagination or truncation disclosure on the new geo_events read."
      - "The accepted packet permits the same page-then-filter pattern for /operations/live."
    required_outcome:
      - "Make the permitted-kind monitored-visit read complete beyond 1,000 rows using the existing bounded pagination pattern or another already-authorized complete read."
      - "Keep the query non-N+1 and deterministically ordered by occurred_at descending, then id descending."
      - "Do not add a backend RPC, migration, schema or data change in this lease."
      - "Test a response set above the provider cap and prove the latest qualifying row is retained for every monitored visit."
      - "If completeness cannot be guaranteed within the current read contract, block rather than silently downgrade."
    completion_bar: >-
      Provider response limits can never be misinterpreted as confirmed absence
      of a permitted geo event for any monitored visit.

  - correction_id: M3-MAP-R10
    severity: P1
    subject: "Operations Map header matches the new provenance truth"
    finding: >-
      The /operations map header still states "Official factory coordinates
      and canonical visit states · markers and status only". The changed visit
      markers now intentionally use recorded GPS or assignment/schedule
      projection, so that statement is no longer true for the surface.
    required_outcome:
      - "Replace the header description with truthful three-tier provenance wording."
      - "Do not imply that every visit marker is an official factory coordinate."
      - "Do not claim live GPS, a route, ETA, drift, refresh cadence or animation."
      - "Keep the factory-marker description truthful and distinct from visit-position provenance."
      - "Add an exact source/runtime assertion for the corrected header."
    completion_bar: >-
      The map header accurately explains the sources represented by visit and
      factory markers and cannot contradict the per-entry provenance labels.

