template_completion_rules:
  required_before_any_controlled_dispatch:
    - Every null assignment field required by the request must be populated by an authorized governance process.
    - The selected canonical authority source must directly support the exact assignment scope.
    - Authority evidence must be stable, reviewable and hashable.
    - The named identity must be distinct from an authority type or runtime role.
    - Channel, destination and sender authority must all be explicit.
    - The non-delegation statement must remain effective unless an explicit governed delegation record exists.
    - Conflict and non-overlap declarations must be complete.
    - Every listed prerequisite response must exist and be hash-verified.
    - The record must contain an approval reference, effective time, expiry or one-request boundary.
    - The no-implementation-authority statement must be explicit.
  automatic_block_conditions:
    - any required field remains null
    - authority is inferred from runtime access, prior conversation or silence
    - a source candidate is treated as selected without approval
    - sender and recipient authority are represented by the same unreviewed assertion
    - any prerequisite acknowledgement is absent
    - delegation is implied rather than evidenced
    - the record attempts to modify product, design, data, controls or requirements

