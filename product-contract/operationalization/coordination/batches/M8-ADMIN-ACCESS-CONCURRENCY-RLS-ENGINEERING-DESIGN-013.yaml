problem_statement:
  - Direct role_permissions writes can bypass application-only admin.access.manage and own-authority guards.
  - Existing grant RPCs use check-then-write without serialization-safe replay.
  - The sole-security-admin count and revoke are not serialized.
  - No revision or stale-change boundary exists.
  - Semantic RPC audit and generic row audit are not correlated.
  - D-006 single-authority and transferred maker-checker requirements are unresolved.

common_non_negotiable_database_contract:
  write_surface:
    - Revoke authenticated INSERT, UPDATE and DELETE privileges on role_permissions.
    - Remove the direct f360_role_permissions_admin mutation path.
    - Expose all access changes through SECURITY DEFINER RPCs with empty search_path.
    - Re-check verified actor, authority, target, own-authority and segregation rules inside each RPC.
  locking:
    - Acquire a transaction advisory lock on a constant access-governance namespace.
    - Lock affected grant rows before deciding change or replay.
    - Serialize every security_admin membership change against the same namespace.
  idempotency:
    - Require a non-empty client-generated UUID request_id for every mutation.
    - Persist request_id with actor, operation, target, requested payload and final result.
    - Reuse with identical semantics returns the recorded result.
    - Reuse with different semantics fails closed with a stable conflict token.
  audit:
    - Emit one correlated semantic event per accepted mutation.
    - Emit a separate stable event for denied, conflicted and replay attempts only if governance approves attempt logging.
    - Include request_id, actor, target, operation, before, after, governing revision and exact requirement references.
    - Document generic trigger events as row facts and correlate them to the semantic event.
  stale_boundary:
    - Every mutation supplies expected_revision.
    - Mismatch returns a stable stale token before any grant or audit-of-change write.
  response:
    - RPC returns structured status, changed flag, request_id, revision and neutral error token.
    - Application never infers success from an empty database response.
  recovery:
    - A verified recovery Security Admin is excluded from fixtures and destructive test targets.
    - Final-admin safety is enforced under the serialized transaction, not by UI count.

plan_a:
  name: HARDENED_SINGLE_AUTHORITY
  policy_basis: Retain D-006.
  sponsor_effect: One Security Admin can apply an access change immediately.
  compatible_with:
    - Current AccessManager interaction model.
    - Current grant-only direct capability override semantics.
  conflict_to_record:
    - Maker-checker portions of MVP2-REQ-0227 and MVP2-REQ-0241 are not satisfied by this route.
    - SCR-ADM-090 Create role, Compare and Publish remain unresolved unless separately implemented or changed.
  proposed_schema:
    request_table: access_mutation_requests
    required_fields:
      - request_id uuid primary key
      - actor uuid
      - operation text
      - target_user uuid nullable
      - target_role text nullable
      - target_permission text nullable
      - expected_revision bigint
      - semantic_fingerprint text
      - result_status text
      - result_revision bigint
      - created_at timestamptz
    revision_table: access_governance_head
    revision_semantics: One monotonically increasing revision for accepted access mutations.
  proposed_rpcs:
    - admin_apply_role_change(request_id, target_user, role_key, grant, expected_revision)
    - admin_apply_capability_change(request_id, target_user, capability_key, grant, expected_revision)
    - admin_apply_role_permission_change(request_id, role_key, permission_key, grant, expected_revision)
  states:
    - accepted_changed
    - accepted_noop
    - replayed
    - stale
    - denied
    - conflict
  audit_actions:
    - access_role_granted
    - access_role_revoked
    - access_capability_granted
    - access_capability_revoked
    - access_role_permission_granted
    - access_role_permission_revoked
    - access_mutation_replayed
    - access_mutation_denied
  future_migration_lease:
    - supabase/migrations/20260725140000_admin_access_runtime_hardening.sql
  decision_gate:
    - Sponsor explicitly retains immediate single-authority changes.
    - Governance records the maker-checker requirement disposition.

plan_b:
  name: VERSIONED_MAKER_CHECKER
  policy_basis: Adopt maker-checker for sensitive access changes.
  sponsor_effect: A maker submits an immutable access proposal; a different authorized checker approves and publishes it.
  compatible_patterns_reviewed:
    - dashboard_config_drafts and dashboard_config_versions
    - compliance_configuration_requests and immutable revisions
    - package maker-checker and published-version guards
  required_boundary:
    - A request may contain one or more role, capability and role-permission changes.
    - Submission freezes an immutable revision and semantic diff.
    - Maker cannot review, approve or publish own request.
    - Checker authority is evaluated at approval and publication time.
    - Publication revalidates target existence, own-authority, segregation, last-admin and expected-head constraints.
    - All accepted changes land atomically with the new immutable published matrix version.
    - In-flight inspections retain their governing snapshot unless an approved contract explicitly says otherwise.
  proposed_schema:
    - access_change_requests
    - access_change_revisions
    - access_change_items
    - access_change_decisions
    - access_matrix_versions
    - access_matrix_heads
  lifecycle:
    - draft
    - submitted
    - returned
    - rejected
    - approved
    - published
  proposed_rpcs:
    - admin_create_access_request(request_id, reason, base_version)
    - admin_save_access_revision(request_id, expected_revision, items)
    - admin_submit_access_request(request_id, expected_revision)
    - admin_return_access_request(request_id, expected_revision, comment)
    - admin_reject_access_request(request_id, expected_revision, comment)
    - admin_publish_access_request(request_id, expected_revision)
  mandatory_guards:
    - distinct maker and checker
    - no self-target change
    - no grant beyond checker authority
    - no segregation conflict
    - no removal of final Security Admin
    - no publication from stale base version
    - immutable submitted revision
    - immutable published version and head history
  future_migration_lease:
    - supabase/migrations/20260725141000_admin_access_maker_checker.sql
  decision_gate:
    - Sponsor authorizes dual control.
    - Governance defines maker and checker roles and whether every change or only sensitive changes require approval.
    - Governance defines mandatory reason, return and rejection comment rules.

