isolated_data_contract:
  seed_owner: RESERVED_M8_ACCESS_FIXTURE_FAMILY
  identities:
    - m8_access_admin_a
    - m8_access_admin_b
    - m8_access_target
    - m8_access_non_admin
  fixed_objects:
    - one non-admin reversible role grant
    - one reversible direct capability grant
    - one reversible role-permission grant
    - stable request UUIDs per test case
  exclusions:
    - sponsor accounts
    - operational personas used by other suites
    - final recovery Security Admin
    - production-like shared records
  cleanup:
    - Transaction rollback for database probes.
    - Explicit inverse RPCs for browser tests.
    - Post-run reconciliation of grants, request rows, revisions and semantic audits.

negative_test_contract:
  shared:
    - anonymous and expired session denied
    - authenticated non-admin direct route or management data denied per selected route contract
    - direct role_permissions REST mutation denied
    - self-target grant and revoke denied
    - unknown user, role, capability and permission denied
    - actor cannot grant authority the actor lacks
    - segregation conflict denied
    - stale expected_revision denied without grant change
    - identical request replay returns one result and one change audit
    - changed-payload request_id reuse denied
    - two-session duplicate grant is deterministic
    - two-session final-admin revocation preserves at least one administrator
    - forced source/gate failure renders unavailable without authority
    - cleanup restores expected fixture state
  plan_b_only:
    - maker cannot approve or publish own request
    - second checker cannot publish stale base version
    - submitted revision cannot be edited
    - published version and head history cannot be updated or deleted
    - partial database failure rolls back all requested items
    - rejected or returned request cannot mutate live access
  future_test_lease:
    - supabase/tests/m8_admin_access_runtime_probe.sql
    - apps/web/e2e/web-admin-m8-admin-access-runtime.spec.ts

browser_gate:
  states:
    - populated
    - loading
    - empty
    - validation
    - unauthorized
    - read_only
    - stale
    - degraded
    - recovery
  matrices:
    locale_direction: [EN_LTR, AR_RTL]
    theme: [light, dark]
    viewport: [design_fixed, 1024x768, 412x915, 390x844, 320x800]
  interaction:
    - complete keyboard operation
    - visible focus
    - focus restoration after confirmation
    - screen-reader names for matrix controls
    - no color-only status
  evidence_required:
    - before and after database state
    - RPC request and response
    - correlated semantic audit
    - screenshot or video
    - automated test result
    - cleanup reconciliation

selection_recommendation:
  recommended_plan: PLAN_B_IF_MVP2_REQUIREMENTS_REMAIN_IN_SCOPE
  basis: >-
    Plan B is the only option that directly satisfies the transferred
    maker-checker and sensitive-action approval obligations and the screen's
    compare/publish semantics. Plan A is smaller and compatible with D-006, but
    requires explicit governance acceptance that those obligations are not
    satisfied by this route.
  no_implicit_choice: true

stop_conditions:
  - No sponsor and governance selection between Plan A and Plan B.
  - Exact atomic 478-row mapping remains absent.
  - Capabilities and permissions authority domains remain undefined.
  - Route visibility contract remains undefined.
  - Proposed migration path collides with another lease.
  - Live schema or migration inventory differs from reviewed assumptions.
  - Fixture or recovery administrator boundary is not approved.
  - Any direct write path remains outside the selected guarded RPC boundary.

