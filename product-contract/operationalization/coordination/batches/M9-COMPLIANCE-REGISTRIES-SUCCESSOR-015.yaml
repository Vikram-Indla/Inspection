required_state_matrix:
  common:
    - id: LOADING
      rule: "Preserve route heading/filter geometry and announce progress."
    - id: AUTHORIZED_WITH_ROWS
      rule: "Source-backed rows and counts only."
    - id: AUTHORIZED_VERIFIED_ZERO
      rule: "Successful read with no rows; explain creation path when permitted."
    - id: FILTERED_ZERO
      rule: "Registry has rows but current search/filter has none; offer clear filters."
    - id: READ_ERROR
      rule: "Neutral error, count unknown, retry and retained navigation."
    - id: UNAUTHORIZED
      rule: "No sensitive row, aggregate or object identity leakage."
    - id: READ_ONLY
      rule: "Explain capability and RLS boundary; hide or disable writes consistently."
    - id: PERMISSION_CHECK_FAILED
      rule: "Fail closed; writes disabled; retry."
    - id: STALE_CONFLICT
      rule: "Reject overwrite, preserve draft input, explain reload/compare."
    - id: VALIDATION_BLOCKED
      rule: "Error summary links to fields/dependencies; first summary receives focus."
    - id: IMMUTABLE
      rule: "Published/locked version has no edit affordance and explains future-version path."
    - id: AUDIT_OR_USAGE_UNAVAILABLE
      rule: "Never represent unavailable evidence as zero."
  regulation:
    - "Draft with no clauses."
    - "Draft with unmapped clauses."
    - "Invalid effective dates."
    - "Same maker/checker."
    - "Attachment/provider failure."
    - "Missing deactivation reason."
  package:
    - "No packages, no draft, and empty draft definition."
    - "Item bank, template registry or violation choices unavailable."
    - "Circular condition and each missing dependency class."
    - "Snapshot freeze failure."
    - "Impact unavailable versus verified no affected usage."
    - "Publish RPC failure and same maker/checker."
  item:
    - "No items and filtered no match."
    - "Missing clause or inaccessible governed choices."
    - "Package usage unavailable."
    - "Frozen-snapshot prerequisite blocks edit."
    - "Stale configuration-version write."
    - "Missing deactivation reason."
  violation:
    - "No codes and filtered no match."
    - "Clause choices or trigger trace unavailable."
    - "Future, active and deactivated lifecycle."
    - "Same maker/checker."
    - "Usage/audit unavailable."
    - "Penalty design authority missing without implying configuration is complete."

