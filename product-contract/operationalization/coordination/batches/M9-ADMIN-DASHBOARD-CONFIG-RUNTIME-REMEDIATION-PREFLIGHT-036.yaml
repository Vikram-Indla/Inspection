runtime_reconciliation:
  confirmed_assets:
    - The /admin/dashboard-config page, server actions and action-state wrapper exist.
    - The migration defines draft, immutable version and head tables plus guarded maker-checker RPCs.
    - Direct authenticated writes to the three dashboard_config tables are revoked.
    - Published dashboard_config_versions are protected from update and delete.
    - A 28-entry code-side KPI registry and typed SharedMetric contract exist.
    - Pure KPI formula/projection tests exist.
    - The operational dashboard already calculates the seven CR-445 output families with a user-selected date window.
  correction_required:
    - id: DASHCFG-P0-001
      priority: P0
      finding: The Admin Dashboard Configuration route is outside the authenticated application route group.
      evidence: >-
        apps/web/src/app/admin/dashboard-config is not under apps/web/src/app/(app);
        the active middleware only propagates x-pathname and performs no auth
        redirect; the page calls auth.getUser but does not redirect when the
        user is absent.
      implication: >-
        Anonymous requests can reach the page component and its shell instead
        of failing closed at a verified-user and Admin-capability boundary.
    - id: DASHCFG-P0-002
      priority: P0
      finding: Page-level write/review capability is derived from roles belonging to any RLS-visible user.
      evidence: >-
        The page selects role_key from user_roles without user_id = current
        user. The user_roles_read policy permits several privileged personas to
        enumerate the roster, then the page's Set tests any returned role.
      implication: >-
        Controls and review states can be presented to the wrong current user.
        RPC role checks prevent some writes, but UI authorization is false and
        cannot be accepted as permission proof.
    - id: DASHCFG-P0-003
      priority: P0
      finding: Configuration payloads are arbitrary JSON objects, not governed typed domain payloads.
      evidence: >-
        parseObject and dash_create/update_config_draft validate only that the
        value is a JSON object. No per-config_key schema, allowed field set,
        unit, range, decision reference, source, or cross-field constraint is
        enforced in TypeScript or PostgreSQL.
      implication: >-
        Writers can publish unknown keys, invented thresholds and incompatible
        values, including DEC-028-governed values, while the UI labels the
        result as governed.
    - id: DASHCFG-P0-004
      priority: P0
      finding: Future-effective publication immediately replaces the current head.
      evidence: >-
        dash_publish_config stores requested_effective_from but unconditionally
        upserts dashboard_config_heads to the new version at publication time.
        resolveDashboardPolicyVersion reads only that pointer and performs no
        effective_from check.
      implication: >-
        A future policy can apply early and the previously effective policy is
        no longer resolvable as current.
    - id: DASHCFG-P0-005
      priority: P0
      finding: The shared policy loader and typed KPI projection are not consumed by runtime pages.
      evidence: >-
        resolveDashboardPolicyVersion has no call site. /dashboard directly
        invokes buildDashboardMetrics and renders the legacy DashboardMetrics
        shape; it does not invoke buildDashboardKpiProjection. No current Web,
        Operations or Field route consumes a published dashboard payload.
      implication: >-
        Publishing Admin configuration has no demonstrated effect on KPI
        calculation period, formula metadata, policyVersionId, visibility,
        freshness, masking or any other runtime behavior.
    - id: DASHCFG-P0-006
      priority: P0
      finding: Current configuration publication does not prove exact CR-445 semantics.
      evidence: >-
        CR-445 requires the seven named Operations KPI families and a
        configurable calculation period. The existing user-selected date scope
        is real, but the Admin control plane neither defines a typed period
        parameter nor proves that /operations or /dashboard consumes it.
      implication: >-
        Existing CR-445 evidence must remain protected, while Admin-default
        period behavior remains unimplemented until its exact precedence and
        allowed values are approved under DEC-028.
    - id: DASHCFG-P0-007
      priority: P0
      finding: Published configuration policy is globally readable without a field-level disclosure contract.
      evidence: >-
        dashboard_config_versions and dashboard_config_heads allow every
        authenticated principal to read complete payloads. Domains include
        masking_export, map_profile, freshness_offline_policy and AI policy.
      implication: >-
        Visibility may disclose operational/security policy fields to personas
        that need only a reduced resolved policy projection.
    - id: DASHCFG-P1-001
      priority: P1
      finding: Draft edit, revision CAS and deterministic publication concurrency are absent.
      evidence: >-
        dash_update_config_draft exists but has no UI caller, accepts no
        expected revision, and does not increment revision for ordinary edits.
        dash_publish_config calculates max(version_number)+1 without a
        config-key serialization lock or expected-head comparison.
      implication: >-
        Concurrent makers can overwrite intent, and concurrent reviewers can
        collide at the unique version constraint without a stable conflict
        response or preserved rebase path.
    - id: DASHCFG-P1-002
      priority: P1
      finding: The page does not expose effective-date authoring or future/current lifecycle truth.
      evidence: >-
        createConfigDraft never supplies p_effective_from; the page renders the
        head as Active version even when its effective_from is in the future.
      implication: Administrators cannot author or distinguish scheduled policy safely.
    - id: DASHCFG-P1-003
      priority: P1
      finding: KPI catalogue persistence is a second incomplete governance path.
      evidence: >-
        The route renders code registry definitions alongside
        mvp3_kpi_definitions rows. Database policy permits Leadership or
        Security Admin to insert KPI drafts, but no KPI-definition publish RPC
        or runtime catalogue resolver is wired here; seed identity is selected
        from the first profile.
      implication: >-
        Code formula authority and database catalogue status can diverge while
        the page presents both as one catalogue.
    - id: DASHCFG-P1-004
      priority: P1
      finding: Existing tests do not certify route, RLS, maker-checker, effective-time or consumption behavior.
      evidence: >-
        dashboard-kpi-contract.spec.ts is a pure formula/projection test.
        No focused browser or SQL test invokes dashboard configuration RPCs,
        attacks permissions, proves CAS, activates a scheduled version, or
        demonstrates a changed resolved policy in an actual KPI consumer.
      implication: Source presence and pure formula tests cannot support runtime completion credit.

target_contract:
  route_and_permissions:
    - Verified authentication is required before any page data or shell is rendered.
    - Current-user roles are queried with user_id = auth.uid or a server-only current-user capability helper.
    - Route, control visibility, RPC authorization and RLS use one approved persona matrix.
    - Unauthorized and anonymous access fail closed without exposing drafts or policy payloads.
  governed_payloads:
    - Every config_key maps to a versioned discriminated schema.
    - Every field declares type, unit, allowed range or vocabulary, decision authority and consuming metric IDs.
    - Unknown keys and unapproved DEC-028 values are rejected at both application and database boundaries.
    - Formula text, SQL, executable expressions and arbitrary client code are never configurable payload.
    - Resolved consumer payloads are reduced to the minimum fields each persona/metric needs.
  version_and_effective_time:
    - Publication creates immutable approved history without activating a future version early.
    - Current resolution selects the latest approved version whose effective window contains the server instant.
    - Exactly one version is effective per config_key at any instant.
    - Draft edits require expected revision CAS and increment revision.
    - Publication requires expected head/version CAS and config-key serialization.
    - Conflicts return a neutral stable error and preserve both accepted history and draft work.
  consumption:
    - One server resolver returns the typed, currently effective, permission-reduced policy.
    - /dashboard and /operations consume the same governed operational KPI projection.
    - CR-445 user-selected period behavior and any approved Admin default have an explicit precedence rule.
    - Every emitted metric carries formulaVersion, applied policyVersionId, exact scope, numerator, denominator, source status and permission result.
    - Missing or undecided policy yields not_configured, decision_required or unavailable; never a fabricated fallback.
    - No Field/iPad consumer is changed until its separate channel/design/ownership contract is approved.

