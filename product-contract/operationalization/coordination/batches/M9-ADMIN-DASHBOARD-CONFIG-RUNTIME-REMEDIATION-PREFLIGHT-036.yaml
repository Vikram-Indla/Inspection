focused_test_and_browser_proof:
  database_p0:
    - Anonymous and every unauthorized persona cannot read drafts, invoke RPCs or resolve sensitive payload fields.
    - A current user never inherits another visible user's writer/reviewer role.
    - Maker cannot publish own draft; caller-supplied actor identity is impossible.
    - Unknown keys, wrong units, wrong types, executable expressions and unresolved DEC-028 values are rejected.
    - Stale draft revision and stale expected head fail without data loss.
    - Two concurrent publications for one config_key serialize to consecutive immutable versions.
    - A future version does not replace the current effective version before its server-time instant.
    - Published versions cannot be updated or deleted and the audit correlation remains immutable.
  consumer_p0:
    - CR-445 exposes all seven required KPI families with exact selected scope, numerator, denominator and source status.
    - Published approved period policy changes only the approved default/allowed behavior after its effective instant.
    - User-selected versus Admin-default period precedence matches the sponsor-approved rule.
    - Every rendered governed KPI includes the exact applied policyVersionId.
    - Missing policy is explicit and does not silently use an unapproved value.
    - Web Dashboard and Operations use the same projection for shared operational KPIs.
    - RLS/region scope cannot be widened by an Admin payload.
  protected_regression:
    - apps/web/e2e/dashboard-business.spec.ts
    - apps/web/e2e/dashboard-kpi-contract.spec.ts
    - apps/web/e2e/dashboard-kpi-seed.spec.ts
    - existing M1 Dashboard and M3 Operations permission, partial-source and drilldown suites
    - product-contract/evidence/TASK-WEB-DASHBOARD-002-REQUIREMENT-MATRIX.md
    - CR-445 / WA-AC-0445 evidence and all accepted seven-metric behavior
  browser_matrix:
    - authorized maker create, edit, submit and conflict recovery
    - independent checker return and publish
    - anonymous, unauthorized and maker-self-publish negative states
    - current, scheduled and historical version truth
    - exact consumer change after effective instant
    - EN/LTR and AR/RTL
    - light and dark
    - 1440x900, 1024x768, 412x915 or 390x844, and 320x800 reflow
    - keyboard, focus, screen reader and automated accessibility
    - loading, empty, error, degraded, stale/conflict and not-configured states

