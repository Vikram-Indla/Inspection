isolated_data_and_recovery:
  fixture_family: M9_AUDIT_REPLAY_FIXTURES
  requirements:
    - fixed case and aggregate identifiers
    - generic-only event
    - correlated semantic event
    - scoped region/object visible to one persona and denied to another
    - redacted sensitive field
    - more than 250 portfolio facts for bounded-page proof
    - controlled case-page boundary without polluting unrelated audit history
  cleanup:
    - transaction rollback for database probes
    - fixed source objects with explicit inverse cleanup for browser tests
    - immutable audit rows are never deleted; fixture namespace must make retained test evidence identifiable
  recovery_rule: If retained immutable fixture events cannot be safely isolated, browser mutation tests stop.

negative_tests:
  - inspector gets zero rows and unauthorized UI
  - scoped role cannot read unrelated generic or semantic object
  - compliance_admin sees partial-scope disclosure
  - raw sensitive field is redacted for an actor without reveal authority
  - direct raw audit table read cannot bypass the approved projection
  - audit_events UPDATE and DELETE fail for authenticated and elevated test actors
  - audit_semantic_events UPDATE and DELETE fail
  - identical semantic append is idempotent
  - changed semantic payload with reused idempotency key fails
  - invalid case and malformed timestamps fail neutrally
  - portfolio over 250 declares partial history and supports bounded continuation
  - case over 5000 declares uncertifiable completeness
  - generic source failure does not promote semantic data to full truth
  - semantic or ontology failure preserves generic-only provenance
  - duplicate generic and semantic facts are correlated, never silently double-counted
  - print-safe view never claims export or legal evidence

rollback_and_stop:
  rollback:
    - New forward-only migration only; never edit applied migrations.
    - Application rollback remains compatible with the forward database projection.
    - No cleanup deletes immutable audit facts.
    - Failed tests reconcile source fixtures and retain namespaced audit evidence truthfully.
  stop_conditions:
    - No governed screen identity.
    - Disclosure or redaction matrix is unapproved.
    - Export, retention or legal semantics are invented.
    - Migration, app, test or evidence lease overlaps another lane.
    - Raw generic table access remains broader than approved object scope.
    - Immutable fixture evidence cannot be isolated safely.
    - Any one of the eight incomplete ontology rows is falsely claimed complete.
    - Any P0 negative path lacks runtime evidence.

