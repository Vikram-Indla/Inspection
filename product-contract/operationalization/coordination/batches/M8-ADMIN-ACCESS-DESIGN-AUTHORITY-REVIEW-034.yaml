design_boundary_resolution:
  primary:
    design_id: WA-DES-043
    filename: SAQEEL Users Roles.dc.html
    route_scope: /admin/access
    states: [users, roles]
    classification: PRIMARY_NEAREST_FUNCTIONAL_AND_INFORMATION_ARCHITECTURE_MATCH
    exact_matches:
      - Roles & permissions title and RLS-not-UI boundary.
      - RLS-scoped user roster with role labels.
      - Security-admin access manager for user role and direct capability grants.
      - Self-target disabled state and sole-security-admin disclosure.
      - Effective capabilities separated into role-derived and direct-grant sources.
      - Role catalogue view and confirmation for admin grants and revokes.
      - Honest next-request effect and EXE-ACCESS audit wording.
    gaps_or_corrections:
      - Hard-coded people, emails, regions, roles, dates, capabilities and counts are fixtures only.
      - The displayed 54-policy count is not a runtime query and must not be presented as current evidence.
      - The Roles design is catalogue-only and omits the current RoleCapabilityPanel editor.
      - It must distinguish role_capabilities/capabilities from role_permissions/permissions.
      - It lacks partial-source, capability-gate failure, concurrency, audit-unavailable and full negative states.
      - It contains Arabic branding in an English surface and no complete English/Arabic route state.
  secondary:
    design_id: WA-DES-011
    filename: SAQEEL Admin Role Override.dc.html
    mapped_scope: /admin/access?view=roles
    classification: CONDITIONAL_SECONDARY_DETAIL_NOT_CURRENT_RUNTIME_AUTHORITY
    reusable_boundary:
      - Focused selected-user role assignment layout.
      - Explicit consequence, guardrail and change-history presentation.
      - Strong confirmation treatment for elevated grants.
    incompatible_or_unproven_claims:
      - It requires a second security_admin approval and recorded override reason.
      - Current accepted D-006 explicitly defers maker-checker beyond one security_admin.
      - Current user role grant RPC takes only target and role; it has no reason or approver input.
      - Current UI has no saved draft, approval queue, second-approver selection or override state machine.
      - Its Save assignments batch interaction does not match individual idempotent RPC writes.
      - Its hard-coded user, approver, history and dates are fixtures only.
    allowed_disposition:
      - FUTURE_CONSENTED_DUAL_CONTROL_DESIGN if sponsor changes the contract.
      - SECONDARY_GUARDRAIL_PATTERN_ONLY under the current single-authority contract.
    prohibited_disposition: PRESENT_AS_CURRENT_IMPLEMENTED_FLOW
  validation_status: CONFIRMED_WITH_BOUNDARY_CORRECTION
  mapping_recommendation:
    - Keep WA-DES-043 as primary /admin/access authority.
    - Narrow WA-DES-011 to a conditional secondary detail/future workflow.
    - Remove WA-DES-043 from /admin/security-access; that route is governed separately.

