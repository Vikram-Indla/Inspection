maker_checker_and_sensitive_action_truth:
  accepted_current_contract:
    authority: D-006
    model: SINGLE_SECURITY_ADMIN_WITH_DATABASE_GUARDS
    maker_checker_beyond_single_actor: DEFERRED_SPONSOR_DECISION
    user_access_guards:
      - no self-target for all four RPCs
      - cannot revoke the sole remaining security_admin
      - catalogue membership validation
      - idempotent existing-grant and absent-revoke no-op
    confirmations:
      - admin role grant
      - role revoke
      - direct capability revoke
  role_permission_guards:
    server_action:
      - actor must have admin.access.manage
      - actor cannot grant a capability they lack to a role they hold
      - actor cannot grant or revoke admin.access.manage on a role they hold
    database:
      - security_admin RLS only
      - no equivalent self-escalation or separation-of-duties RPC guard
    bypass_risk: >-
      A security_admin can write role_permissions through the REST table policy
      without the server-action-only self-escalation checks. Design must not
      imply the application guard is the database boundary.
  WA_DES_011_dual_control_status: UNAPPROVED_AND_NOT_IMPLEMENTED

data_audit_concurrency_truth:
  data:
    - Roster and grant collections are RLS projections, not global totals.
    - Email and region are personal/scope data and must not be exposed beyond proven RLS purpose.
    - capabilities/role_capabilities and permissions/role_permissions are distinct catalogues and engines.
    - Direct overrides are positive grants only; removing a direct grant does not remove role-derived access.
  source_failure_gaps:
    - Base profile failure is visible, but roles failure is ignored.
    - Security-admin panel read failures are logged and collapsed into empty collections.
    - Permission and role-permission read failures are logged and collapsed into empty collections.
    - has_role or has_planning_capability failure silently removes a management panel.
    - No explicit verified-empty roster state exists.
  audit:
    user_access_rpcs:
      - Every actual change appends EXE-ACCESS actor and before/after evidence.
      - Idempotent no-op writes no audit row because nothing changed.
      - user_roles also has row-trigger audit, so duplicate semantic audit records may exist and must be explained.
    role_permissions:
      - Audit trigger is authored in migration 20260722120000.
      - Route copy states that migration is pending apply.
      - Runtime audit coverage must remain UNVERIFIED until environment evidence proves it applied.
  concurrency:
    user_access_rpcs:
      - No target grant row or security-admin authority set is locked.
      - Concurrent identical grants may collide on primary keys instead of both returning idempotent success.
      - Concurrent revocation of the last two security_admin holders can race because count and delete are not serialized.
      - No expected version, request id or idempotency key is accepted.
    role_permissions:
      - Primary key makes duplicate grants unique but there is no expected version.
      - Revoke uses delete-and-select without a stale/conflict contract.
      - Server-action self-escalation checks and the later write are not one database transaction.

