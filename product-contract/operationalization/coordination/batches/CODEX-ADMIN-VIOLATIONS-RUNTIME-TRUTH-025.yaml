lifecycle_transition_and_concurrency_truth:
  native_records:
    violation:
      identity: "unique(code, configuration_version)"
      lineage: "supersedes_id"
      statuses: [draft, published, locked, deactivated]
      effective_window: [active_from, active_to]
      publish_rpc: "public.publish_violation_code(uuid)"
    penalty:
      identity: "unique(violation_code_id, mapping_version)"
      lineage: "supersedes_id"
      statuses: [draft, published, locked, deactivated]
      effective_window: [effective_from, effective_to]
      publish_rpc: "public.publish_penalty_mapping(uuid)"
  guards_present:
    - "Native publish RPCs lock the selected row, require draft status, enforce a distinct maker/checker, and capture the approving actor from auth.uid()."
    - "Published/locked rows reject ordinary edits; inspection_penalties rejects delete and permits only informational-to-issued transition."
  guard_failures:
    - "Draft-to-published UPDATE or published INSERT is possible through permissive table RLS because guards inspect the old row state."
    - "approved_by can be supplied as any distinct profile UUID on a direct path."
    - "Deactivation exceptions omit legal-anchor/effective-origin/actor/lineage comparisons."
    - "Publishing a future successor immediately deactivates the current version instead of preserving it until the effective instant."
    - "No expected-head, draft revision, or compare-and-swap contract exists; version identifiers are user-entered."
    - "No server transition proves parent regulation, eligible item, unique non-compliant response, active penalty, governed template, or action-form dependency."
    - "The page derives active/future/deactivated only from dates and can label a draft as active."

immutable_versioned_legal_authority_and_effective_dating:
  positive_evidence:
    - "Violation and penalty rows have version identity, supersedes_id, status, effective dates, actor fields, and generic row-change audit."
    - "Published package dependency snapshots and inspection penalty mapping snapshots are immutable."
    - "Penalty notices remain informational until the inspection moves to approved, then issue through a database trigger."
  failed_authority:
    - "The canonical append-only compliance_entity_versions/heads engine publishes violation and penalty snapshots but has no projection to the legacy tables consumed by Packages and Field."
    - "The violations route writes the legacy tables rather than the governed request engine."
    - "Violation rows do not own an inspection_item_id or non-compliant response identity; the page infers a trace by scanning response_model JSON."
    - "Parent regulation/item deactivation does not cascade to violation or penalty eligibility."
    - "Penalty publication does not validate that its violation is approved, active, and the source of inherited Regulation/Item/Response context."
    - "Penalty effective dates are not applied consistently by package validation or runtime materialization."
    - "Penalty-linked templates are neither automatically frozen from the mapping nor proven as the issued runtime artefact."

audit_and_evidence_custody:
  present:
    - "Generic audit_row_change triggers capture before/after, actor, action, object, and timestamp for violation_codes and penalty_mappings."
    - "The writer-only admin_configuration_audit RPC exposes row history on the route."
    - "Runtime violations remain as invalidated records rather than being deleted."
    - "inspection_penalties stores an immutable to_jsonb mapping snapshot and issuance metadata."
  gaps:
    - "Direct bypasses produce generic row audit, not a proven maker/checker or Compliance Request decision trail."
    - "No correlation binds request, component version, operational projection, package snapshot, field trigger response, runtime violation, penalty snapshot, and approval."
    - "Reviewer can view the catalogue but cannot view its route audit details; generic audit_events access is separately role-scoped."
    - "Violation and penalty screens do not own source-file custody; legal trace is clause/text metadata and depends on Regulation source-file governance."
    - "The deactivation impact service counts only a narrow response mapping and runtime reference set; it does not establish complete package, future-visit, active-inspection, action-form, or enforcement custody."

negative_paths:
  source_proven:
    - "Route guard denies roles outside compliance_admin/reviewer."
    - "Server actions fail closed when requireConfigurationWriter cannot prove compliance_admin/form_admin."
    - "Duplicate code/mapping errors, missing mandatory values, invalid dates, same-maker publish, and immutable accepted-row updates have handling."
    - "Inspection submission locking prevents later violation invalidation."
  missing_or_unproven:
    - "Direct REST/table writer cannot publish, forge actors, rewrite omitted deactivation fields, or delete governed history."
    - "Draft modification and successor publication cannot race or overwrite a stale head."
    - "Only approved eligible item/non-compliant response combinations can create one active violation."
    - "Assigned inspector cannot insert an arbitrary violation_code_id or mapping_version."
    - "Assigned inspector cannot invalidate a violation without the triggering response changing."
    - "A pinned historical penalty version still materializes after a live successor or deactivation."
    - "A future successor does not activate early or remove current authority."
    - "Missing/inactive Regulation, Item, Violation, Penalty, Template, or mandatory Action Form blocks at the database boundary."
    - "Penalty fine type/periodicity/amount/maximum combinations reject invalid states."
  execution_note: >-
    This was a read-only task without an isolated data lease. No destructive or
    write-path negative was executed against shared data. Source assertions are
    not treated as runtime certification.

runtime_and_integration_dependencies:
  regulations:
    truth: "Clause trace exists."
    gap: "Approved/active parent and cascade are not enforced."
  inspection_items:
    truth: "response_model.mapping can name a violation code."
    gap: "No relational item/response ownership or uniqueness exists on violation authority."
  templates:
    truth: "Published/locked templates can be selected on a penalty mapping."
    gap: "Selection is optional and linked-template freeze/render/issuance is not closed."
  packages:
    truth: "Application validation checks active violation and presence of a published/locked mapping."
    gaps:
      - "Penalty effective dates are ignored."
      - "Database publication parity with application validation is incomplete."
      - "freezeDefinition nests all penalty mappings without status/effective filtering."
  field:
    truth: "Client computes implied violations and stores mapping_version."
    gaps:
      - "Assigned inspector can directly choose authority identifiers."
      - "Live configuration fallback remains when frozen data is incomplete."
      - "More than one nested historical mapping nulls the mapping version."
  review_and_reports:
    truth: "Submission and inspection_penalties snapshots preserve selected runtime data."
    gap: "No end-to-end proof ties the snapshot to the exact governed CCR version and trigger response."
  enforcement:
    truth: "Issued penalty transition waits for inspection approval."
    gap: "Historical pinned mapping and future-effective authority are not safely resolved."
  other_consumers:
    - "Factory 360"
    - "Audit"
    - "Dashboards"
    - "Bulk violation issuance"

