  implementation_ready: false
  acceptance_ready: false
  reason: >-
    The catalogue, native draft/publication records, audit triggers, package
    snapshots, client-side response implication, and informational-to-issued
    penalty notice path are real. They do not form one safe governed capability.
    The approved Compliance Configuration Request authority is disconnected from
    the legacy tables consumed by Packages and Field; direct table policies can
    bypass maker-checker publication; item/response/legal-parent invariants are
    absent; runtime generation and invalidation remain client-selectable; and
    effective-dated penalty successors can break pinned inspections. No canonical
    acceptance row may receive completion credit.

