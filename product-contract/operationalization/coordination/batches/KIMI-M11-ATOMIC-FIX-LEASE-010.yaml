schema_version: "1.0"
packet_id: KIMI-M11-ATOMIC-FIX-LEASE-010
status: REVIEWER_READY_QUEUED_NOT_DISPATCHED
prepared_by: codex_kimi_live_watch
prepared_on: "2026-07-25"
lease_type: READ_ONLY_IMPLEMENTATION_AND_ROLLBACK_SPECIFICATION

business_function: >-
  Make CR-338 virtual-session creation all-or-nothing: a session and its
  required participant records either commit together or leave no session,
  participant or audit residue.

authority:
  requirement_ids: [CR-338]
  acceptance_ids:
    - WA-M11-AC-001
    - WA-M11-AC-002
    - WA-M11-AC-005
    - WA-M11-AC-006
  requirement_source: product-contract/web-admin-phase1/REQUIREMENT_BASELINE.csv
  acceptance_source: product-contract/web-admin-phase1/ACCEPTANCE_CRITERIA.csv
  evidence_ids:
    - WA-EV-0338
    - WA-M11-EV-001
    - WA-M11-EV-002
    - WA-M11-EV-005

prerequisites:
  - "KIMI-M11-NEGATIVE-TEST-SPEC-009-RETURN-001 dispatched after manual unlock."
  - "Corrected 009r independently reviewed and accepted."
  - "Fresh SAQEEL session-start and operating-system bootstrap."
  - "An implementation owner and exclusive file lease recorded before writes."

current_defect:
  defect_id: D-M11-001
  classification: CONFIRMED_P0_ATOMICITY_DEFECT
  evidence:
    - "apps/web/src/app/(app)/virtual/actions.ts:42-47 inserts virtual_sessions."
    - "apps/web/src/app/(app)/virtual/actions.ts:50-55 inserts virtual_participants separately."
    - "On participant error, the action returns without rollback or cleanup."
    - "apps/web/src/app/(app)/virtual/actions.ts:37-39 blocks retry whenever any session exists."
    - "virtual_sessions.visit_id is unique in supabase/migrations/0001_foundation.sql:281-286."
    - "No atomic scheduling RPC or rollback cleanup exists in the canonical migrations."
  business_effect: >-
    A failed participant insert can leave an unusable session that permanently
    blocks the visit from being scheduled again.

implementation_invariant:
  atomic_unit:
    - "Validate the authenticated caller and permitted virtual-session scope."
    - "Validate the visit is virtual and published."
    - "Validate an assigned inspector exists when the participant set requires one."
    - "Validate the representative name and appointment input already required by the current action."
    - "Reject an existing session for the visit under the existing unique business rule."
    - "Insert exactly one virtual_sessions row."
    - "Insert the required factory representative and assigned-inspector participant rows."
  commit_rule: >-
    All database mutations and their trigger-generated audit rows commit in one
    PostgreSQL transaction, or all roll back.
  return_contract: >-
    Return the created session identifier only after every required participant
    row has been created successfully. Return a stable failure token without
    exposing database internals on any validation, authorization or write error.

required_solution_shape:
  database:
    - "Add one forward-only transactional PostgreSQL RPC for session-plus-participant creation."
    - "Use the function transaction as the rollback boundary; do not add compensating delete."
    - "Serialize or lock the visit/existing-session check so concurrent requests cannot create competing sessions."
    - "Retain the unique visit_id constraint as the final race guard."
    - "Enforce the intended planner/ops/assigned-inspector authority inside the RPC; do not rely on the current virtual_sessions INSERT policy's broad WITH CHECK alone."
    - "Preserve existing append-only audit triggers for virtual_sessions and virtual_participants."
    - "Grant execute only to the authenticated application role and fail closed inside the function."
  application:
    - "Replace the two direct inserts in scheduleSession with the transactional RPC."
    - "Preserve current user-facing validation text unless the RPC returns a governed stable token requiring an existing neutral error."
    - "Keep notification insertion after the database transaction commits."
    - "If notification delivery fails, keep the committed session and report degradation honestly; do not roll back the valid core transaction."
    - "Revalidate /virtual only after the RPC succeeds."
  prohibited:
    - "Compensating delete as the atomicity fix."
    - "State-filtering the existing-session guard as a substitute for atomic creation."
    - "Permanent fault-injection flags, production backdoors or shared live-data mutation."
    - "Changes to execution-window semantics, list filtering, provider behavior or OTP policy."

owned_files_proposed:
  application:
    - apps/web/src/app/(app)/virtual/actions.ts
  migration:
    - "One new forward-only Supabase migration; filename allocated by the implementation owner at lease start."
  tests:
    - "One SQL contract test for commit/rollback and authorization."
    - "apps/web/e2e/web-admin-m11-virtual-list.spec.ts after corrected 009r acceptance."
    - "A bounded D-M11-001 failure-characterization spec using an authorized rollback-only fault seam."
  evidence:
    - "M11 textual evidence index and external binary/runtime manifest only after tests execute."

test_contract:
  positive:
    - "Authorized caller creates one session and the complete required participant set."
    - "Session and participant INSERT audit rows exist with the same successful operation evidence."
    - "Retry after success returns the existing-session failure and creates no duplicate."
  negative:
    - "Unauthorized caller creates no session, participant or audit row."
    - "Non-virtual visit creates no session, participant or audit row."
    - "Non-published visit creates no session, participant or audit row."
    - "Missing required representative or inspector data creates no session, participant or audit row."
    - "Concurrent duplicate attempts produce exactly one committed session."
  rollback_characterization:
    mechanism: >-
      Use a rollback-only SQL test transaction with a temporary transaction-local
      trigger or another separately approved test-local seam that rejects the
      participant insert after the session insert is attempted.
    assertions:
      - "RPC fails with the governed neutral error/token."
      - "No virtual_sessions row remains for the visit."
      - "No virtual_participants row remains."
      - "No INSERT audit row remains for either table."
      - "A clean retry succeeds after the fault seam is removed."

rollback_plan:
  forward_only_rule: >-
    Production rollback must be a new migration or application revert that
    restores the previous callable path without dropping valid sessions or
    weakening audit/RLS. Never delete committed business data.
  trigger: "Any P0 authorization, atomicity, audit or regression failure."
  preserve:
    - "Existing virtual sessions and participants."
    - "Append-only audit history."
    - "Existing RLS and state-machine guards."

acceptance_gate:
  pass_only_if:
    - "All positive and negative cases pass against a real isolated test database."
    - "Forced participant failure proves zero partial state and zero partial audit."
    - "Concurrent requests prove one committed session."
    - "Required M11 regression and evidence manifests are complete and truthful."
  completion_claim: >-
    Do not mark CR-338 or any 478-row count accepted until runtime, negative,
    audit and regression evidence passes independent review.

lease_separation:
  excluded_packets:
    - KIMI-M11-EXECUTION-WINDOW-LEASE-011
    - KIMI-M11-SESSION-LIST-FILTER-LEASE-TBD
  rule: "Atomicity is the only product defect owned by 010."

dispatch:
  dispatched: false
  blocked_by: MANUAL_MAC_UNLOCK_AND_009R_ACCEPTANCE
  kimi_active: false

validation:
  yaml_parse: PASS
  source_paths_checked: PASS
  scope_separation_checked: PASS
