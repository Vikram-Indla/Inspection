canonical_lifecycle_contract:
  draft:
    - "Maker creates an envelope and adds supported components/dependencies."
    - "Only the owner can edit an eligible draft or returned revision."
  submit:
    - "Submission validates the current revision and freezes it for review."
  review:
    - "Reviewer is authorized and not the owner."
    - "Component approve/reject decisions are revision-scoped."
    - "Reject/return requires a reason."
  revise:
    - "Returned request creates a new immutable revision; prior revision remains auditable."
  publish:
    - "Only approved/eligible branches may be published."
    - "Publication assigns immutable version references and retains correlation/audit evidence where returned."
    - "Do not claim atomicity, transactional scope or generated domain fields beyond current runtime evidence."
  cancel:
    - "Only an eligible owner can cancel through the guarded transition."
  audit:
    - "Request, revision, component, decision and publication histories remain immutable and scoped."

permissions:
  create_and_edit: ["Compliance Admin", "Form Admin"]
  review: ["Compliance Admin", "Reviewer"]
  segregation: "Owner/maker cannot review or publish their own request."
  read: "Only rows allowed by current route guard and RLS."
  failure_rule: "Permission-read failure disables actions and never grants optimistic access."
  UI_rule: "Visible buttons mirror capability only; RPC and RLS remain authoritative."

