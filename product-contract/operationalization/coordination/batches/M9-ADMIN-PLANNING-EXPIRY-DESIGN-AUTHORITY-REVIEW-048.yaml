expiry_engine_validation:
  table: public.planning_expiry_rules
  scheduler:
    function: expire_lapsed_visits_scheduled
    cron_name: expire-lapsed-visits
    cadence: "*/15 * * * *"
    UI_claim: evaluated every 15 minutes
    validation: CONFIRMED
  active_rule_selection:
    enabled_required: true
    effective_from_lte_now: true
    effective_to_gt_now_or_null: true
    order: rule_type then version
  expiry_result:
    planning_status: expired
    rule_provenance: visits.expired_by_rule_id
    lifecycle_event: expire
    lifecycle_reason_key: rule_type
    notifications:
      - plan creator when configured
      - inspector when configured
    validation: CONFIRMED
  source_scope:
    visit_type: exact match
    execution_mode: exact match
    priority: exact match
  important_behavior:
    - Enabled overlapping versions of the same type would all be evaluated.
    - The first matching version can expire the visit before later versions evaluate.
    - Rule iteration order is version ascending within a rule type.
    - No database invariant prevents overlapping enabled/effective versions.

version_effective_date_concurrency:
  schema:
    unique_rule_type_version: true
    unique_enabled_per_type: false
    row_version: absent
    updated_at: absent
    effective_from: present
    effective_to: present
  creation:
    next_version: max existing version plus one
    created_enabled: false
    effective_from: set immediately at creation even while disabled
    race_behavior: unique violation asks user to refresh
    validation: PARTIAL
  enable:
    sequence:
      - disable all sibling versions
      - enable selected version
    transaction: false
    database_RPC: absent
    compare_and_set: absent
    critical_risks:
      - Failure of the second write can leave no version enabled after siblings changed.
      - Concurrent enable operations can produce multiple enabled versions.
      - The success/error language can claim nothing changed after partial sibling mutation.
    validation: NON_ATOMIC_AND_UNSAFE
  disable:
    allows_zero_enabled_versions: true
    effective_to_set: false
    dependency_confirmation: absent
    validation: PERMITTED_WITHOUT_POLICY_GUARD
  edit:
    enabled_version_editable_in_place: true
    historical_version_editable_in_place: true
    effective_from_reset: false
    effective_to_updated: false
    immutable_snapshot: false
    implication: >-
      A row labelled as a version can change after it has governed expiry
      outcomes, breaking stable policy provenance.
    validation: FAIL_IMMUTABLE_VERSION_CONTRACT
  effective_dates:
    future_scheduling_UI: absent
    retirement_closes_effective_to: false
    reactivation_opens_new_interval: false
    overlap_guard: absent
    validation: PRESENT_BUT_NOT_GOVERNED
  concurrency:
    expected_version: absent
    CAS: absent
    stale_conflict_state: absent
    validation: FAIL

permissions_maker_checker_audit:
  read:
    database_policy: any authenticated user
    route_behavior: full read-only catalogue for non-configurers
    validation: CONFIRMED_WITH_SCOPE_DECISION_REQUIRED
  write:
    page_and_actions: planning.configure_expiry
    database_insert_and_update: planning.configure_expiry
    delete: no policy
    validation: CONFIRMED
  gate_failure:
    behavior: Page gate provider error collapses to ordinary read-only state.
    distinct_provider_unavailable_state: absent
    validation: CONFIRMED_WITH_CORRECTION
  maker_checker:
    implementation: absent
    policy_authority: unresolved
    implication: High-impact expiry policies can take effect on the next sweep after one actor enables them.
  audit:
    trigger: trg_audit_planning_expiry_rules
    function: public.audit_row_change
    actor: auth.uid()
    before_after: present for updates
    route_audit_view_or_link: absent
    validation: CONFIRMED_BACKEND_ONLY
  audit_semantic_gap: >-
    Two-step enable can create separate sibling-disable and selected-enable
    audit events without one atomic change-set or correlation identifier.

