source_error_findings:
  - Device read error and command read error are not represented independently on Admin.
  - Command error is ignored and can appear as verified empty.
  - Admin action exposes raw database error text.
  - Field enrollment correctly separates signed-out, invalid identifier, unavailable, policy pending and privacy-safe identifier collision; this is reusable behavior evidence, not a Device Admin policy.
  - Package open returns structured denial for trust/assignment/app/expiry but has no located application consumer.
  - Provider timeout/rejection/receipt errors have no current source because no provider adapter exists.
  - Sync source unavailable/stale/empty semantics have no current Devices query contract.

collision_boundaries:
  migrations:
    objects: [mvp3_devices, mvp3_device_commands, mvp3_inspection_package_manifests, mvp3_package_access_events, mvp3_issue_device_command, mvp3_open_inspection_package]
    rule: DB-01 and DB-02 combine or serialize under one migration owner.
  RLS_and_roles:
    objects: [device and command read/insert policies, package manifest/access-event reads]
    rule: Governance role/capability authority precedes policy edits; no navigation-derived grants.
  generated_types:
    objects: [future database types]
    rule: One integration owner after final additive migration; none located today.
  shared_server_action:
    objects: [apps/web/src/app/(app)/admin/mvp3-actions.ts, apps/web/src/components/Mvp3ActionForm.tsx]
    rule: Prefer route-local Devices service; shared files serialize through one owner.
  Field_and_offline:
    objects: [Field settings actions, package call sites, offline queue/replay]
    rule: Web/Admin lease cannot edit them; separate Field/offline lease consumes the same stable DB contract.
  tests_and_live_data:
    objects: [rollback probe, opt-in RLS test, future deterministic fixtures]
    rule: QA/seeder namespaces and cleanup are isolated; tests never become migration authority.

