current_database_surfaces:
  - surface_id: DEV-DB-CUR-01
    object: public.mvp3_devices
    kind: TABLE
    source: "supabase/migrations/20260718150000_mvp3_enterprise_control_plane.sql:113"
    current_contract:
      fields: [id, device_identifier, platform, assigned_user_id, trust_status, mdm_reference, app_version, app_version_compliant, last_seen_at, enrolled_by, enrolled_at, updated_at]
      states: [pending, trusted, suspended, revoked, wipe_pending, wiped]
      trusted_check: nonempty mdm_reference and app_version_compliant=true
      triggers: 0
      rls_enabled: true
    gaps:
      - no row version/expected-version field
      - no attestation source/version/freshness/evidence
      - no trust actor/approval/effect history
      - no verified provider reference
  - surface_id: DEV-DB-CUR-02
    object: public.mvp3_device_commands
    kind: TABLE
    source: "supabase/migrations/20260718150000_mvp3_enterprise_control_plane.sql:130"
    current_contract:
      fields: [id, device_id, requested_device_identifier, command, status, reason, requested_by, requested_at, completed_at]
      commands: [suspend, resume, remote_wipe, expire_packages]
      statuses: [queued, acknowledged, completed, failed, dependency_blocked]
      triggers: 0
      rls_enabled: true
    gaps:
      - revoke absent
      - device_id nullable
      - no approver, expected version, correlation or idempotency
      - no before/after, policy version, provider/device receipt or stage actor
      - no canonical acknowledgement/completion transition
      - no immutable mutation guard
  - surface_id: DEV-DB-CUR-03
    object: public.mvp3_inspection_package_manifests
    kind: TABLE
    source: "supabase/migrations/20260718150000_mvp3_enterprise_control_plane.sql:143"
    current_contract:
      fields: [id, inspection_id, package_version_id, workflow_version_id, manifest, manifest_hash, expires_at, compiled_by, compiled_at]
      append_only_trigger: true
      rls_enabled: true
    gaps:
      - no device-specific invalidation relation or command effect
      - no cached-device invalidation acknowledgement
  - surface_id: DEV-DB-CUR-04
    object: public.mvp3_package_access_events
    kind: TABLE
    source: "supabase/migrations/20260718150000_mvp3_enterprise_control_plane.sql:157"
    current_contract:
      fields: [id, manifest_id, device_id, requested_device_identifier, actor_id, outcome, reason, occurred_at]
      outcomes: [opened, denied_missing, denied_untrusted, denied_unassigned, denied_expired, denied_app_version]
      rls_enabled: true
    gaps:
      - no download, cached-open, sync or submit outcomes
      - no governing device/package version or correlation
      - no explicit invalidated outcome
  - surface_id: DEV-DB-CUR-05
    object: public.mvp3_issue_device_command
    kind: SECURITY_DEFINER_RPC
    source: "supabase/migrations/20260718150000_mvp3_enterprise_control_plane.sql:275"
    current_contract:
      roles: [ops, security_admin]
      validation: allow-listed current command and trimmed reason length >= 8
      locking: SELECT device FOR UPDATE
      result: inserts queued command
      immediate_effects:
        suspend: suspended
        resume: trusted
        remote_wipe: wipe_pending
        expire_packages: none
    gaps:
      - unsafe Resume before evidence
      - no source-state/terminal guard
      - no expected version, idempotency or approval
      - no provider dispatch or receipt
      - no package effect
  - surface_id: DEV-DB-CUR-06
    object: public.mvp3_open_inspection_package
    kind: SECURITY_DEFINER_RPC
    source: "supabase/migrations/20260718150000_mvp3_enterprise_control_plane.sql:316"
    current_contract:
      gates:
        - authenticated
        - manifest exists
        - device exists and assigned to auth user
        - trust_status=trusted
        - app_version_compliant=true
        - manifest not expired
      result: opened plus manifest hash, or denied plus reason
      audit: inserts access event only when manifest exists
    gaps:
      - no located application consumer
      - no download, cached-open, sync or submit guard
      - no platform/attestation freshness check beyond stored trust
      - unknown manifest produces no access event
  - surface_id: DEV-DB-CUR-07
    object: mvp3_devices_read
    kind: RLS_POLICY
    source: "supabase/migrations/20260718150000_mvp3_enterprise_control_plane.sql:425"
    current_contract: Assigned self, Ops, Security Admin and Auditor may select rows.
    gap: Canonical Device/Mobile Admin capability authority is missing.
  - surface_id: DEV-DB-CUR-08
    object: mvp3_devices_insert
    kind: RLS_POLICY
    source: "supabase/migrations/20260718150000_mvp3_enterprise_control_plane.sql:427"
    current_contract: Ops or Security Admin may insert own enrolled_by row with pending trust.
    gap: Assignment/platform/MDM/compliance values are not fully constrained by this base policy.
  - surface_id: DEV-DB-CUR-09
    object: mvp3_devices_self_enroll_insert
    kind: RLS_POLICY
    source: "supabase/migrations/20260723090200_mvp3_devices_self_enroll_insert.sql:1"
    current_contract: Self may insert only own pending iPad with null MDM/last-seen and false compliance.
    gap: No Admin approval/trust transition follows.
  - surface_id: DEV-DB-CUR-10
    object: mvp3_device_commands_read
    kind: RLS_POLICY
    source: "supabase/migrations/20260718150000_mvp3_enterprise_control_plane.sql:429"
    current_contract: Ops, Security Admin and Auditor may read all command rows.
    gap: No assigned-self command evidence or per-device scope; canonical read authority unresolved.
  - surface_id: DEV-DB-CUR-11
    object: mvp3_device_commands_insert
    kind: RLS_POLICY
    source: "supabase/migrations/20260718150000_mvp3_enterprise_control_plane.sql:431"
    current_contract: Ops/Security Admin may insert rows where requested_by=self.
