p0_return_gates:
  - id: P0-IDENTITY
    return_if: Route, design ID, revision, filename, screen, or predecessor lineage differs.
  - id: P0-RADIUS-ONLY
    return_if: Any field other than factories.geofence_radius_m is editable.
  - id: P0-OFFICIAL-PIN
    return_if: Official coordinates can be edited, reverted, reconciled, or overwritten.
  - id: P0-PUBLICATION
    return_if: Save-and-publish, maker-checker, source-revert, coordinate reason, or unsupported history is shown.
  - id: P0-POLICY
    return_if: A numeric GIS policy, 150 fallback, range, provider, risk, source, editor, observed point, or timestamp is invented.
  - id: P0-AUTHORIZATION
    return_if: GIS Admin, planner, or denied-persona authority is asserted beyond proven route/RLS truth.
  - id: P0-CONFIDENTIALITY
    return_if: Denied users can see coordinates, settings, selection detail, or radius controls.
  - id: P0-CONFLICT
    return_if: Silent overwrite is permitted or stale-write prevention is falsely marked implemented.
  - id: P0-COMPLETENESS
    return_if: The design claims a complete national factory list or full counts without total/pagination proof.
  - id: P0-AUDIT
    return_if: Audited completion is claimed without actor, object, before/after, and timestamp evidence.
  - id: P0-PROVIDER
    return_if: Mapbox, approved style, geographic authority, or offline packs are shown operational while MVP3-HOLD-002 is open.
  - id: P0-SCOPE
    return_if: Spatial Canvas, Field override, privacy, offline pack, Planning, Operations, or Factory 360 actions are absorbed into this page.
  - id: P0-TRACEABILITY
    return_if: The page claims all 478 requirements or steals downstream route ownership.

p1_return_gates:
  - id: P1-MAP-LIST
    return_if: Pointer map selection lacks equivalent semantic registry selection or unlocated factories disappear.
  - id: P1-RESPONSIVE
    return_if: Any required viewport clips, overlaps, hides actions, scrolls the page horizontally, or shows peeking navigation.
  - id: P1-RTL
    return_if: Arabic is untranslated, directionally broken, or reverses coordinates/codes/units.
  - id: P1-THEME
    return_if: Light/dark shell, map controls, popup, attribution, table, focus, status, or disabled text lacks contrast.
  - id: P1-A11Y
    return_if: Labels, errors, headings, row-control semantics, focus, target size, names, or announcements are missing.
  - id: P1-MOTION
    return_if: Reduced motion still uses flyTo, animated fit, pulsing markers, or motion-only selection.
  - id: P1-FEEDBACK
    return_if: Unsaved preview is confused with stored radius or failure loses entered data.
  - id: P1-EVIDENCE
    return_if: Export fingerprint, visual matrix, annotations, gap register, limitations, or predecessor comparison is missing.

