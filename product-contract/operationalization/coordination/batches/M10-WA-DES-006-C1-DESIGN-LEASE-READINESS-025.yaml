pagination_and_completeness_contract:
  code_observation: >-
    The page orders the factories query by name but supplies no explicit
    pagination, range, limit, total count, or completeness marker.
  risk: >-
    A provider/default row limit can make a national registry appear complete
    when it is only a prefix, producing false counts, missing factories, and
    unsafe geofence administration.
  design_requirements:
    - Never label returned rows "all factories" without a proven total and complete fetch.
    - Display loaded count and total only when both are source-backed.
    - Show "Results may be incomplete" when completeness is unknown.
    - Include accessible previous/next or load-more behavior as an implementation-gap annotation, not a functioning claim.
    - Keep filters and selected record stable across pagination only when runtime proof exists.
    - Ensure unlocated and risk-band counts declare whether they represent loaded rows or the full result set.
  implementation_status: GAP_REQUIRING_SEPARATE_ENGINEERING_LEASE

