    - ready_with_attribution
    - missing_token
    - provider_failure
    - keyboard_list_equivalent
    - reduced_motion
  truth_rule: >-
    Conflict prevention, completeness, actor authorization, and audit are
    design-required but runtime-unproven. Label each as an implementation gap;
    never depict it as delivered behavior.

denied_persona_contract:
  personas_to_prove:
    - anonymous_or_expired_session
    - authenticated_without_GIS_authority
    - planner
    - gis_admin
  required_design_truth:
    - No unauthorized route may expose factory coordinates, policy values, or radius controls.
    - Direct action denial remains neutral and leaves the row unchanged.
    - Planner is not labelled allowed or denied until route and database authority are reconciled.
    - Menu visibility is never presented as authorization.

map_list_equivalence:
  requirements:
    - Map selection and registry selection identify the same factory.
    - Every located marker has a meaningful label and a corresponding registry control.
    - Every unlocated factory remains discoverable in the registry.
    - Pointer map interaction has a keyboard and nonvisual registry equivalent.
    - Risk and selection use text, shape, and color.
    - Provider failure does not remove registry operations.
    - Popup labels may not be empty.
    - Required provider attribution remains visible and operable.

responsive_matrix:
  required_viewports:
    - viewport: 1440x900
      expectation: Persistent shell, toolbar, map, bounded detail, and registry without page overflow.
    - viewport: 1200x840
      expectation: Exact predecessor comparison viewport plus corrected state truth.
    - viewport: 1024x768
      expectation: Compact shell; map, detail, and registry stack without clipped controls.
    - viewport: 768x1024
      expectation: Registry and selected-factory context remain usable without pointer map dependence.
    - viewport: 412x915
      expectation: Registry-first single column; map is progressive content; no peeking submenu icons.
    - viewport: 390x844
      expectation: Full filter, selection, radius, error, and provider-unavailable parity.
    - viewport: 320x568
      expectation: No task loss, overlap, clipping, or two-dimensional page scroll.
  table_rule: Reflow to labelled records or a named horizontal scroll region with preserved row-control semantics.

language_bidi_theme:
  locales:
    - locale: en
      direction: ltr
    - locale: ar
      direction: rtl
  bidi_rules:
    - Use logical layout properties and mirror directional structure.
    - Isolate coordinates, factory codes, units, versions, and technical identifiers as LTR.
    - Localize filters, counts, states, actions, validation, denials, provider messages, and recovery.
    - Require qualified native-Arabic review before acceptance.
  themes: [light, dark]
  theme_evidence:
    - shell, toolbar, table, panel, map controls, popup, attribution, and radius ring
    - body, heading, caption, placeholder, disabled, focus, error, and unavailable contrast
    - risk and selection legibility without color-only meaning
    - day/night basemap only when the approved provider is actually available

accessibility_and_motion:
  structure:
    - One h1 and ordered section headings.
    - Programmatic labels, hints, errors, and result associations for filters and radius.
    - Real button or link semantics for selectable registry records.
    - Unique accessible names for markers, map controls, pagination controls, and actions.
  keyboard:
    - Logical LTR and RTL tab order.
    - Visible single focus treatment in both themes.
    - Forty-four-pixel minimum targets.
    - Search, filters, registry selection, save, retry, and pagination operable without pointer.
    - Validation focuses summary or radius field without losing input.
  announcements:
    - result count and completeness
    - selection change
    - radius preview and saved result
    - provider unavailable and partial-source state
  reduced_motion:
    - Replace flyTo and animated fit transitions with immediate movement.
    - Do not use pulsing markers or motion as the sole selection cue.
  zoom_reflow:
    - Prove 200 percent zoom.
    - Prove 400 percent or 320 CSS-pixel equivalent reflow.

action_feedback:
  dirty: Distinguish unsaved radius preview from stored radius.
  saving: Disable only the selected factory save action and announce progress.
  saved: Confirm exact factory and returned/stored radius only after server success.
  invalid: Preserve entry and show field error plus summary.
  denied: Neutral message; no database or provider internals.
  failure: Preserve entry, retain old stored radius as authority, and offer bounded retry.
  conflict: Block silent overwrite in design and disclose missing runtime proof.

