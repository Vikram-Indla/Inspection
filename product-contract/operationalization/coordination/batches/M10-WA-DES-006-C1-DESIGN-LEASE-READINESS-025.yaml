    - New export SHA-256, byte size, viewport inventory, and lineage record.
    - Predecessor-versus-successor comparison identifying removed fabricated behavior.
    - Component/state annotations for route, GisStudio, radius action, GeoMap, registry, and settings.
    - Full responsive, language, theme, accessibility, reduced-motion, provider, completeness, denial, conflict, and failure matrices.
    - Explicit implementation-gap register for authorization, pagination, audit, conflict, and 150 fallback.
  later_runtime_not_authorized_here:
    - GIS Admin map and keyboard-list selection parity.
    - Radius save, refresh persistence, invalid-input no-change, and RLS-denial no-change.
    - Planner and denied-persona route plus direct-action authorization reconciliation.
    - Audit actor, object, before/after, and timestamp.
    - Missing token/provider failure with preserved registry.
    - Missing policy without numeric fallback.
    - Empty, unlocated, zero-filter, partial-source, pagination, and completeness behavior.
    - Concurrent-editor no-silent-overwrite proof.
    - EN/AR RTL, light/dark, all viewports, keyboard, zoom, focus, target size, and reduced motion.

