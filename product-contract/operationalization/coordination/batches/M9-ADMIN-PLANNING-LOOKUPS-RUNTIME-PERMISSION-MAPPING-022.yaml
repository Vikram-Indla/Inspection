    status: NOT_IMPLEMENTED
    evidence: planning_lookups has no version, supersedes, effective_from or effective_to fields.
  - capability: Maker-checker approval
    status: NOT_IMPLEMENTED
    evidence: Writes immediately affect consumers; no proposal, checker or publish stage exists.
  - capability: Optimistic concurrency
    status: NOT_IMPLEMENTED
    evidence: updated_at exists but is neither loaded into the UI nor used as compare-and-set.
  - capability: Downstream planning selects
    status: PARTIAL
