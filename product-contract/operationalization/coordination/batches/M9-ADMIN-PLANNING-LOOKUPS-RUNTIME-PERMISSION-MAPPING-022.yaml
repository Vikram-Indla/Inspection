permission_and_governance_findings:
  - id: LK-P0-001
    priority: P0
    finding: Planning and execution cancellation vocabularies have diverging authorities.
    evidence: >-
      planning_lookups cancellation_reason is a one-time migration copy, while
      live Field/Execution/Operations flows continue reading and validating
      engine_settings.field.cancellation_reasons.
    implication: An administrator can change this page and receive success while the Inspector-facing cancellation list remains unchanged.
  - id: LK-P0-002
    priority: P0
    finding: High-impact reference changes publish immediately without maker-checker or effective versioning.
    evidence: INSERT/UPDATE directly changes active consumer reads; no draft/review/approve/publish model exists.
    implication: Existing and future planning behavior can change without governed approval, activation time or rollback lineage.
  - id: LK-P0-003
    priority: P0
    finding: Concurrent edits can silently overwrite.
    evidence: updated_at is not submitted as a compare-and-set token and update filters only by ID.
    implication: Two administrators can overwrite labels, metadata and ordering without conflict detection.
  - id: LK-P0-004
    priority: P0
    finding: Deactivation has no dependency or in-use guard.
    evidence: setLookupActive updates by ID without checking active drafts, planned visits, operational records or required last-value invariants.
    implication: A value referenced by drafts or required by a workflow can disappear from selects without impact analysis.
  - id: LK-P0-005
    priority: P0
    finding: The configurable execution cancellation list does not meet the canonical initial vocabulary.
    evidence: >-
      REQ-R0C-01486 requires Factory closed, Factory not found, Factory no
      longer operating, Access refused, No authorized representative, Unsafe
      conditions, Emergency, Incorrect assignment, Duplicate visit, Factory
      requested cancellation, Technical blocking issue and Other. The Planning
      migration copies a separate field JSON source and the route does not
      certify the required set or comments/evidence semantics.
    implication: Lookup administration cannot be credited against the canonical configurable cancellation requirement.
  - id: LK-P1-001
    priority: P1
    finding: Every Admin-class role receives configure_lookups by default.
    evidence: >-
      has_planning_capability returns true for Planning configure capabilities
      for any is_admin role; role_permissions also seed all six admin roles.
    implication: The effective owner is every administrator, not a specifically governed Planning configuration persona.
  - id: LK-P1-002
    priority: P1
    finding: Deep-linked authenticated users can inspect inactive rows and raw metadata.
    evidence: Route has no authorization boundary and planning_lookups SELECT permits any authenticated user.
    implication: Read-only business vocabulary is needed downstream, but inactive/admin metadata disclosure is not separated from active consumer projection.
  - id: LK-P1-003
    priority: P1
    finding: assignment_override_reason has no application consumer.
    implication: The page advertises governance for a vocabulary that does not control assignment override behavior.
  - id: LK-P1-004
    priority: P1
    finding: Success feedback overstates propagation.
    evidence: UI says consumers see the change on next read even for cancellation_reason, whose Field/Execution consumers use another source.
    implication: Operators receive a false confirmation of platform-wide effect.
  - id: LK-P1-005
    priority: P1
    finding: Arabic labels are optional even for a bilingual control plane.
    implication: Active values can publish without Arabic parity and degrade Arabic/RTL consumers.

test_and_browser_evidence:
  present:
    - file: apps/web/e2e/cd-044-admin-planning.spec.ts
      coverage: Admin REST-stages a return_reason, deactivates it in UI and verifies it leaves active Planning reads.
    - file: apps/web/e2e/cd-027-visit-detail.spec.ts
      coverage: Reads governed return and cancellation labels for Visit detail scenarios.
  weaknesses:
    - cd-044 mutates shared data and deliberately leaves the test row deactivated.
    - No non-configurator write denial test exists for this route/table.
    - No route-level read or inactive-metadata disclosure decision is tested.
    - No two-user stale update test exists.
    - No maker-checker, version, effective date or rollback evidence can exist on the current schema.
    - No deactivation dependency/in-use negative path is tested.
    - No test proves Planning changes reach Field/Execution; repository evidence proves they do not.
    - No canonical REQ-R0C-01486 required-vocabulary test exists.
    - No focused EN/AR, LTR/RTL, light/dark, responsive, keyboard, accessibility or visual-diff bundle exists.
    - Audit trigger presence is not enough; the UI test does not assert the exact lookup audit row.
  readiness: NOT_READY_FOR_CERTIFICATION

verdict:
  validation: CONFIRMED_WITH_CORRECTION
  recommended_action: BLOCK
  sponsor_decision: >-
    Do not credit or cut over Planning Lookups as a complete governed Lookup
    Management module. First decide the single authoritative cancellation
    source, ownership persona and version/maker-checker policy; then authorize
    a bounded remediation lease.

p0_prerequisites:
  - Govern one authoritative cancellation vocabulary across Planning, Field, Execution and Operations.
  - Add proposal/version/effective-date/maker-checker semantics or obtain an explicit bounded exception for direct reference-data publication.
  - Add compare-and-set concurrency and recoverable stale conflict handling.
  - Add dependency/in-use checks before deactivation.
  - Reconcile and test the canonical REQ-R0C-01486 initial cancellation vocabulary and metadata rules.

p1_prerequisites:
  - Decide whether every Admin-class role may configure Planning vocabularies.
  - Split active consumer projection from inactive/admin metadata if broad authenticated reads remain necessary.
  - Wire or remove assignment_override_reason from the claimed surface.
  - Correct success feedback to name the consumers actually updated.
  - Require or govern Arabic translation completeness.
  - Build focused RLS, audit, consumer, bilingual, responsive and accessibility evidence.

