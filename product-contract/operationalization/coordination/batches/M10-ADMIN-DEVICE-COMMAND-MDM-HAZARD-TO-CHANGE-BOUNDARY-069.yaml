boundary_rules:
  - Every hazard has exactly one primary future change boundary.
  - A hazard may list dependencies but dependencies do not gain edit authority over the primary boundary.
  - Each future lease must name exact files; directory patterns here are planning scopes, not authorization.
  - Shared schema, generated types, i18n, shell and common action files require one integration owner and cannot appear in parallel leases.
  - Database change is additive and forward-only; migration ordering is fixed before parallel application work.
  - Provider contract/credentials remain separate from provider adapter code.
  - Test owners do not modify implementation; evidence owners index immutable outputs rather than manufacture results.
  - Independent Review remains read-only toward every leased boundary.

