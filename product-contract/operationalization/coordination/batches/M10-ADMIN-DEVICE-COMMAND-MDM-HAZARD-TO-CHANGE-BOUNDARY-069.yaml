dependency_order:
  stage_0_sponsor_answers:
    owner: SPONSOR
    output: Ten complete compatible answers passing checklist 067.
  stage_1_authority:
    parallel:
      - DEV-CHG-GOV-01
      - DEV-CHG-PRV-01
    output: Approved policy/role/state/provider authority or truthful hold.
  stage_2_design_and_interfaces:
    parallel:
      - DEV-CHG-DES-01
      - DB/provider interface design for DEV-CHG-DB-01, DEV-CHG-DB-02 and DEV-CHG-SVC-01 without implementation
    output: Accepted design plus frozen interface/migration order.
  stage_3_implementation:
    ordered_database: [DEV-CHG-DB-01, DEV-CHG-DB-02]
    parallel_after_interfaces:
      - DEV-CHG-SVC-01 if provider execution approved
      - DEV-CHG-SVC-02
      - DEV-CHG-UI-01
      - DEV-CHG-FLD-01
      - DEV-CHG-FLD-02
    condition: Separate collision-checked leases and declared shared-file owners exist.
  stage_4_test:
    boundary: DEV-CHG-TST-01
    condition: Integrated revisions, deterministic fixtures and provider/hold state are fixed.
  stage_5_evidence_and_review:
    sequence:
      - DEV-CHG-EVD-01
      - INDEPENDENT_REVIEW
      - SPONSOR_ACCEPTANCE

shared_collision_register:
  - shared_asset: supabase device/command/package tables and RPCs
    risk: DB-01 and DB-02 concurrent migration edits
    control: One DB lease or serialized migrations with one integration owner.
  - shared_asset: apps/web/src/app/(app)/admin/mvp3-actions.ts
    risk: Devices changes collide with other MVP3 Admin routes.
    control: Prefer a route-local action; otherwise serialize through one shared-action owner.
  - shared_asset: apps/web/src/lib/i18n.ts
    risk: Design/UI/other modules edit the same translation map.
    control: One localized integration lease after route-local behavior stabilizes.
  - shared_asset: Shell, global CSS and shared action form
    risk: Visual fixes regress other Admin modules.
    control: Exclude from route lease; apply through separately tested shared-foundation lease.
  - shared_asset: offline store and replay engine
    risk: Field trust and sync-rescue changes alter the same state machine.
    control: Serialize FLD-01/FLD-02 shared files or combine under one owner.
  - shared_asset: live test fixtures and provider sandbox
    risk: Seeder/QA/provider runs interfere or manufacture evidence.
    control: Namespaced deterministic fixtures, isolated cleanup and immutable genuine receipt capture.
  - shared_asset: evidence index
    risk: Producers overwrite or relabel another lane's result.
    control: Producer-owned artifacts; EVD-01 only references immutable IDs and hashes.

