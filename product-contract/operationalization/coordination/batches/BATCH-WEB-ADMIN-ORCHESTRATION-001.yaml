global_rules:
  - Every scope begins from canonical requirement, screen and acceptance IDs.
  - No actor may infer authority from chat memory, filenames or an open browser tab.
  - One actor owns a product-code write lease; independent reviewers remain read-only.
  - Claude Design owns design changes and revision lineage, never product implementation.
  - ChatGPT and Kimi provide research, critique and bounded handoffs, never self-approval.
  - Codex is control writer, implementation orchestrator and final reviewer.
  - Claude Code implements only after an exact approved slice and exclusive file lease.
  - Blocked details enter the dirty-laundry register; unrelated READY work continues.
  - No merge, deployment, remote DDL, provider enablement or shared-data mutation.

