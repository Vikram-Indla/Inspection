    - "API/rule event outcomes with correlation identity available in an accessible detail."
    - "Data-sharing export status with purpose and delivery-proof boundary."
    - "Separate Factory Data integration link."
  record_rules:
    - "Status is displayed exactly from the record; never promoted to healthy/connected."
    - "No last-event date, count, latency, uptime or delivery percentage unless queried and sourced."
    - "No base URL, token, credential, certificate or secret."
    - "Configured, dependency-blocked, held, degraded and unavailable remain semantically distinct."
    - "Zero rows is verified empty only when that source read succeeds."
    - "RLS-hidden and source-failed are not represented as zero."
    - "Identifiers, statuses and versions use human-readable text plus machine value where needed."

state_matrix:
  loading: "Reserve registry/events/exports geometry and announce loading."
  configured: "Record says configured and contract/address database invariant is satisfied; still not a health claim."
  dependency_blocked: "Explain held dependency without provider simulation."
  degraded: "Show record-sourced degraded state and available unaffected evidence."
  empty_registry: "Verified successful registry read with zero rows."
  empty_events: "Verified successful events read with zero RLS-visible rows."
  empty_exports: "Verified successful exports read with zero RLS-visible rows."
  schema_unavailable: "No data inferred; no provider state shown."
  partial_source_error: "Each source independently unavailable; healthy sources remain."
  unauthorized: "Channel/RLS denial without registry, event or export leakage."
  stale: "Display updated/occurred/requested timestamps only when sourced; label staleness by approved policy only."
  conflict: "Contradictory registry/event truth is shown as unresolved, never auto-reconciled."

