  mode: READ_ONLY
  status: READY_TO_ASSIGN
  objective: >
    Execute the safe WAVE-00 preparation identified in packet 054A: verify
    source existence and read-only revision/hash references, reconcile packet
    counts and statuses, prepare blank custodian/reviewer acknowledgement
    evidence fields, and return readiness without supplying either
    acknowledgement.
  non_overlap:
    - no product, design, data, test, fixture, evidence, shared control, branch or lease mutation
