    - wave_id
    - gap_ids
    - respondent_name_or_accountable_body
    - canonical_role_or_authority_key
    - authority_source_artifact
    - delegation status and evidence where applicable
    - reviewed packet IDs and revisions
    - explicit ACK, RETURN or HOLD
    - exact included and excluded scope
    - evidence references
    - remaining dependencies
    - conflicts or overlap declaration
    - required non-authorization statement
    - timestamp with timezone
    - stable response reference
  safe_preparation_without_owner:
    - Pre-fill packet IDs, gap IDs and known governed source paths.
    - Build completeness, compatibility and authority validation checklists.
    - Verify source artifacts exist and record read-only hashes or revisions.
    - Prepare blank evidence-reference slots and non-authorization wording.
  owner_only_inputs:
    - respondent identity and authority attestation
    - delegation confirmation
    - disposition
    - selected business choice or accepted consequence
    - owner evidence references
    - final timestamp and stable response reference
  rule: A prepared field is not an acknowledgement until the accountable owner supplies and attests it.

