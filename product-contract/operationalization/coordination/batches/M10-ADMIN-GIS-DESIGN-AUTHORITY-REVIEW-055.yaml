    seeded_values_exist: true
    seeded_values_are_final_policy: false
    code_fallbacks_exist: true
    reviewer_rule: >-
      Preserve seeded/runtime compatibility but do not certify, publish or
      visually bless a numeric value as final policy while DEC-002 remains open.
  map_provider:
    decision: DEC-008 resolved to Mapbox GL JS and Mapbox Directions
    shared_renderer: apps/web/src/components/GeoMap.tsx
    client_token: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
