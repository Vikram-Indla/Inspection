map_and_degraded_state_review:
  strengths:
    - missing client token renders an explicit unavailable state
    - factory list, filters and radius form remain outside the map renderer
    - required compact Mapbox attribution is installed
    - KSA max bounds prevent geographic drift
    - fence rings are geodesic rather than pixel circles
    - map theme observes application theme
  gaps:
    - only selected Mapbox authorization/style errors trigger failed state
    - general tile/network degradation may leave a blank or partial canvas
    - provider-unavailable copy says only not configured and gives no retry/escalation
    - main page combines engine and factory errors into one fatal state
    - a failure in either source hides the healthy source instead of isolating it
    - popup uses provider default styling with no SAQEEL light/dark text override
    - popup content is a flat label rather than the governed detail required by the design
  observed_sponsor_defect:
    description: light-mode popup text has insufficient contrast against the white popup
    source_corroboration: no mapboxgl-popup theme override found in application styles
    validation: CONFIRMED_WITH_SOURCE_AND_SPONSOR_RUNTIME_OBSERVATION

geofence_policy_and_runtime_truth:
