      - planner
    affected_row_check: present
    implication: >-
      Planner can invoke the direct server action and change the geofence radius,
      although the route and action are represented as GIS Admin ownership.
    validation: FAIL_CAPABILITY_RLS_ALIGNMENT
  radius_audit:
    generic_factories_trigger: present
    actor_before_after_timestamp: present
    scoped_reason: absent
    GIS_policy_version: absent from factory row change
    validation: GENERIC_AUDIT_PRESENT_BUT_GOVERNANCE_CONTEXT_INCOMPLETE
  radius_versioning:
    immutable_versions: absent
    expected_current_value_or_version: absent
    compare_or_rollback: absent
    stale_conflict: absent
    failure_mode: two editors silently overwrite the same radius
    validation: FAIL_CONCURRENCY_AND_VERSION_CONTRACT
  maker_checker:
    explicit_applicable_contract_for_direct_radius_edit: not found
    predecessor_save_and_publish_claim: unsupported
    reviewer_position: >-
      Do not invent maker-checker or a publish action. Governance must first
      decide whether a per-factory radius is direct audited operational
      configuration or a submitted policy version. Until then, block design
      claims of publication and require at minimum lawful authorization, audit
      context and stale-write protection.
  spatial_layer_create:
    allowed_RLS_roles:
      - gis_admin
      - security_admin
      - compliance_admin
    explicit_action_capability_check: absent
    audit_trigger_found: false
    immutable_version: absent
    provider_hold_enforced: feature flag defaults off, not a database guard
    validation: HELD_AND_NOT_GOVERNANCE_COMPLETE

