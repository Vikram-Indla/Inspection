      studio_default_radius: silently falls back to 150 metres
      validation: FAIL_POLICY_UNRESOLVED_STATE
  per_factory_radius:
    source: factories.geofence_radius_m
    fallback: engine default then 150
    preview: live geodesic ring
    save_validation: positive finite number rounded to integer
    accepted_upper_bound_contract: not found
    reviewer_rule: do not invent a maximum
  downstream_consumers:
    arrival_and_checkin: present
    field_startup: present
    operations_and_geo_events: present
    config_version_stamping: present in execution path
    validation: PARTIALLY_WIRED_WITH_UNRESOLVED_EFFECTIVE_SOURCE
  official_coordinates:
    main_route_editable: false
    field_overwrite: prohibited
    predecessor_design_edit_action: unsupported and unsafe
    validation: CURRENT_CODE_SAFER_THAN_PREDECESSOR

permissions_mutation_audit_and_concurrency:
  intended_route_persona: gis_admin
  main_action:
    authentication: verified user required
    explicit_role_or_capability_check: absent
    database_policy: factories_update
    database_allowed_roles:
