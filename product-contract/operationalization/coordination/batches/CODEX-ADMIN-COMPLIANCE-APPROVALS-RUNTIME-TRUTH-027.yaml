  rationale: >-
    The real Approval Queue, request workspace, populated reviewer data,
    maker-owned exclusion, planner denial, revision snapshots, dependency graph,
    decision controls and database-backed read paths exist. Completion is still
    unsafe: CCR publication creates a separate version/head store that Planning,
    Field, Enforcement and inspection reports do not consume; publication leaves
    the request in an approved or partially-approved queue state; raw component
    JSON is not validated against the complete governed domain contract; and the
    current tests do not execute database maker-checker, immutability, rollback
    or downstream-consumption behavior. The route also has no exact accepted
    design, remains English inside Arabic/RTL, and lacks current P1 visual,
    accessibility and dark-theme certification.

