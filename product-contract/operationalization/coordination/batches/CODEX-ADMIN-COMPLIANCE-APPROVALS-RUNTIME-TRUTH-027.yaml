p0_findings:
  - id: CCR-APQ-P0-001
    finding: CCR publication is not consumed by Planning, Field, Enforcement or reports.
    evidence: >-
      publish_compliance_request writes compliance_entity_versions/heads and
      publications. Source search found only the Admin runtime preview reading
      CCR versions; all real downstream paths read legacy/package snapshot tables.
    impact: A reviewer can publish a change that the operational product never executes.
    blocks:
      - WA-M6-AC-001
      - WA-M6-AC-005
      - WA-AC-0458
      - WA-AC-0459
  - id: CCR-APQ-P0-002
    finding: The request lifecycle has no terminal published state.
    evidence: >-
      Request status permits no published value. The publication RPC changes
      component status but never request status. The queue continues to select
      approved requests as Ready to Publish, and the workspace continues to
      derive publishable from approved/partially_approved.
    impact: Completed publication cannot leave the actionable queue truthfully and repeated publication reaches a no-approved-components error.
    blocks:
