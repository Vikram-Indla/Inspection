exact_prerequisites:
  design:
    - Accept and fingerprint an exact queue/request successor covering all four routes.
    - Prove EN/LTR, AR/RTL, light/dark, desktop/tablet/narrow, loading/empty/error/denied/stale/publish states and accessibility.
  database_and_service:
    - Define and implement the governed projection/materialization from approved CCR versions into the exact domain/runtime stores, or migrate every consumer to one canonical version resolver.
    - Add a terminal publication lifecycle and idempotent, truthful queue behavior.
    - Validate proposed snapshots against the canonical domain schemas and all CR-460 dependency semantics inside the publication transaction.
    - Preserve immutable decisions, publications, revisions, audit correlation and historical execution locks.
    - Add expected-revision or equivalent recoverable concurrency proof where request-wide transitions can race.
  tests:
    - Execute live Admin-maker, distinct Reviewer, denied Planner and anonymous cases.
    - Execute maker self-decision denial, direct DML denial, required-comment denial, stale/double decision and double-publication behavior.
    - Execute partial approval, dependency rejection, transaction rollback, immutable mutation denial and audit reconciliation.
    - Prove published configuration is selectable by Planning, locked by Field, reflected in Enforcement and retained in reports without changing earlier inspections.
    - Correct only genuinely stale protected assertions under exact test-file leases.
  data_and_browser:
    - Use an isolated reversible non-production request with collision protection.
    - Record baseline, every immutable decision/audit row, final publication and exact cleanup/retention rule.
    - Capture current screenshots/states for authorized, maker-excluded, denied, Arabic, themes and named viewports.
    - Obtain qualified native-Arabic human review; automation must not self-certify language quality.
  governance:
    - Approve the CR-458..CR-463 enabling-route mapping correction without transferring domain ownership.
    - Obtain separate exact leases for database/service, route/UI, tests and isolated data.
    - No merge, deployment or completion credit while any listed P0/P1 remains.

rollback:
  this_packet: Delete this single evidence packet; no product, database, data, test, design or branch state changed.
  future_database_work: Additive forward-only migration with retained old heads and an explicit compatibility rollback path.
  future_application_work: Revert only the leased route/service/test commits; retain current routes until certified cutover.
  data_proof: Restore semantic business state while retaining required append-only audit and decision history.

stop_conditions:
  - Any attempt to count CR-449..CR-478 wholesale from the request/approval envelope.
  - Any approval that does not change the exact version Planning and Field consume.
  - Any publication without a terminal, idempotent and auditable lifecycle.
  - Any semantic dependency or domain validation omitted from the atomic publish gate.
  - Any maker, unauthorized role or direct table path can decide or forge publication.
  - Any current or historical runtime configuration changes silently.
  - Any P0/P1, design gap, Arabic gap, failed protected test or missing real-browser evidence is hidden.

