      - active-session and cache behavior
      - immutable audit

  - id: M3-ACT-DEC-008
    decision: Resolve CR-431 and DEC-002 telemetry-frequency ownership and configuration.
    must_resolve:
      - policy owner
      - configuration source
      - permitted range
      - offline, reconnect, and stale behavior
    current_status: OPEN_P0

  - id: M3-ACT-DEC-009
