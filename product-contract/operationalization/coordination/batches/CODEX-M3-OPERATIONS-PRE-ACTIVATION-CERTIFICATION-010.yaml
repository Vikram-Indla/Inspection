    decision: Activate M3 now, queue it after M2, or authorize a disjoint concurrent slice.
    recommended: QUEUE_AFTER_M2_UNLESS_A_REPOSITORY_BACKED_CONCURRENT_SLICE_IS_CREATED
    must_record:
      - M2 disposition
      - M3 task and change-control ID
      - exact base SHA
      - exact requirements, acceptance, evidence, rollback, and do-not-touch areas

  - id: M3-ACT-DEC-002
    decision: Supersede obsolete always-projected map acceptance with truthful tiered provenance.
    recommended: APPROVE_TIERED_PROVENANCE
    must_preserve:
      - no fabricated route, ETA, drift, animation, or live claim
      - recorded timestamp, accuracy, freshness, privacy, and connection truth
      - truthful scheduled or factory fallback
      - unavailable, invalid, zero-row, and read-error states

  - id: M3-ACT-DEC-003
