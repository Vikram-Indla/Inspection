ack_return_block_rules:
  ACK:
    decision: ACKNOWLEDGED_AS_GOVERNANCE_DRAFT
    applies_when:
      - Packet 009 is used only for planning.
      - No implementation, branch, migration, test, lease, or design authority is inferred.
    current_result: PASS
  RETURN:
    decision: RETURN_FOR_OWNERSHIP_AND_SCOPE_CORRECTION
    applies_when:
      - A proposal conflicts with authoritative package ownership.
      - A package-owned route or dependency is omitted.
    current_result: TRIGGERED
    exact_corrections:
      - >-
        Replace M9 ownership of apps/web/src/app/(app)/admin/access/** with M8.
        PACKAGE_MANIFEST.csv assigns /admin/access and its page to M8.
      - >-
        Treat apps/web/src/lib/execution/capabilities.ts as shared capability
        infrastructure requiring an explicit exact owner; do not infer M9.
      - >-
        Add apps/web/src/app/api/routing/eta/route.ts to the M3 package boundary
        or explicitly record it as unchanged/read-only. The M3 manifest includes
        /api/routing/eta.
      - Reissue the corrected draft before activation review.
  BLOCK:
    decision: BLOCK_M3_ACTIVATION_AND_DISPATCH
    applies_when:
      - Current slice is not M3.
      - Exact Claude lease is absent.
      - One reconciled immutable base is absent.
      - Required sponsor decisions are unapplied.
      - DEC-002 remains open for CR-431.
