reviewer_disposition:
  acknowledgement:
    - Existing pending self-enrollment and package-open denial are useful fail-closed foundations.
    - Suspend can support immediate local access denial if remote effect remains explicitly unacknowledged.
    - Queueing is already described as different from completed wipe.
  return:
    - Replace ambiguous trust and command labels with the fact model in this packet.
    - Reconcile role vocabulary, per-command authority and design lineage.
    - Remove invented online/offline, outbox and sync-health content.
  block:
    - Resume must not restore trusted state before fresh authoritative acknowledgement.
    - Revoked and wiped devices must not be resurrected by ordinary Resume.
    - No acknowledgement, completion, wipe, expiry or sync claim without genuine evidence.
    - No design or implementation lease until the ten decisions are recorded.
  decision: BLOCK_DUE_TO_MISSING_CONTRACT
  recommended_action: APPROVE_CONTRACT_DECISIONS_BEFORE_DESIGN_OR_BUILD

