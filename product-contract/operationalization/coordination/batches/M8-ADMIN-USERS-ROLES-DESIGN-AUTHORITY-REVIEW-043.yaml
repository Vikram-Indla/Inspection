  roles:
    design_status: PARTIAL
    required_truth:
      - role catalogue is seed/governance managed
      - user role grants are individual RPC transitions
      - self-target and sole-admin guards apply
      - role creation and published role-matrix versions are not implemented
  permissions:
    design_status: INCORRECTLY_COLLAPSED
    required_truth:
      - capabilities plus role_capabilities drive execution access
      - user_capability_grants are positive direct grants only
      - permissions plus role_permissions are a second planning/Factory360 engine
