  codex_validation: CONFIRMED_WITH_CORRECTION
  recommended_action: BLOCK
  reason: >-
    The route, rule table, scheduled engine, audit trigger and downstream
    consequences are real, but activation/version governance is not atomic,
    active versions are mutable, one exposed rule type is structurally
    dormant, and authorization/concurrency boundaries are too broad or absent.

runtime_rule_mapping:
  - rule_type: not_completed_at_window_end
    basis: visits.window_end plus offset_minutes
    candidate: published visit with no started inspection
    exclusion: inspector-created immediate visit
    status: RUNTIME_CONSUMED
  - rule_type: no_execution_start
    basis: visits.window_start plus offset_minutes
    candidate: published visit with operational_state=new and no started inspection
    exclusion: inspector-created immediate visit
    status: RUNTIME_CONSUMED
  - rule_type: no_acknowledgement
    basis: visits.window_start plus offset_minutes
    candidate: published visit with an assignment still in assigned state and no started inspection
    exclusion: inspector-created immediate visit
    status: RUNTIME_CONSUMED
  - rule_type: no_execution_date
    basis: visits.window_start is null
    status: DORMANT_BY_SCHEMA
    evidence: visits.window_start is NOT NULL; migration comments state the predicate matches nothing.
    implication: The UI offers and can enable a rule that cannot expire any current visit.

expiry_consequences:
  status_update:
    target: visits.planning_status=expired
    provenance: visits.expired_by_rule_id
  semantic_event:
    table: visit_lifecycle_events
    event_type: expire
    carries: rule_type reason prior status window_end rule_id
  notifications:
    event_key: visit_expired
    recipients:
      - assigned inspector when notify_inspector=true
      - plan creator when notify_plan_creator=true
  generic_audit:
    trigger: trg_audit_visits
    table: audit_events
  transactionality: CONFIRMED
  rationale: >-
    Status changes, lifecycle events and notifications execute within one
    PostgreSQL function call; an error rolls back the statement transaction.
  idempotency: CONFIRMED_FOR_STATUS
  limitation: Already-expired rows leave the published candidate set, but notification uniqueness is not independently constrained.

findings:
  - id: EX-P0-001
    priority: P0
    finding: Rule activation is a non-atomic two-write operation.
    evidence: >-
      setRuleEnabled first disables sibling rows, then enables the target using
      a separate Supabase update. No governed RPC or database transaction wraps
      both writes.
    implication: Failure or interruption after the first write leaves the rule family with no enabled version.
  - id: EX-P0-002
    priority: P0
    finding: Active effective versions can be edited in place.
    evidence: >-
      updateRule applies scope, offset, reason and notification changes to any
      row ID, including enabled rows; the scheduler reads those values on its
      next sweep.
    implication: Historical version meaning changes retroactively and production behavior changes without creating or approving a new version.
  - id: EX-P0-003
    priority: P0
    finding: Effective-version lifecycle is semantically false in the control plane.
    evidence: >-
      New disabled rows receive effective_from=now; enabling does not set a new
      effective_from, close the prior effective_to or prevent disabling the
      last active version. The UI therefore labels disabled and retired rows
      as effective/ongoing.
    implication: Operators cannot reconstruct which version governed a visit at a past instant from the displayed windows.
  - id: EX-P0-004
    priority: P0
    finding: no_execution_date is an impossible runtime rule.
    evidence: >-
      The engine requires visits.window_start IS NULL while the schema requires
      window_start NOT NULL. Both the migration and certification test
      acknowledge that it matches nothing.
    implication: An administrator can enable a rule whose promised business behavior cannot occur.
  - id: EX-P0-005
    priority: P0
    finding: The single-enabled invariant is not database-enforced.
    evidence: >-
      The table has unique(rule_type, version), but no partial unique constraint
      on rule_type WHERE enabled and no activation RPC. Direct permitted writes
      can create multiple enabled rows or no enabled row.
    implication: Multiple rules of one family may run in version order; the first matching rule wins by changing status, producing configuration-dependent provenance.
  - id: EX-P0-006
    priority: P0
    finding: Enable accepts an unvalidated client-supplied rule_type independent of rule_id.
    evidence: >-
      setRuleEnabled validates only non-empty strings; it disables siblings for
      the supplied type, then enables the independently supplied ID.
    implication: A configuring actor or malformed request can retire one rule family while enabling a row from another.
  - id: EX-P0-007
    priority: P0
    finding: Rule changes have no maker-checker or approved activation state.
    evidence: >-
      A single actor with planning.configure_expiry can create, edit, enable
      and disable rule versions. No proposal, review, distinct approver or
      activation decision record exists.
    implication: A high-impact scheduler policy can be changed unilaterally immediately before the next sweep.
  - id: EX-P1-001
    priority: P1
    finding: Route access and table reads are broader than control-plane need.
    evidence: >-
      The page has no route-local admin guard and planning_expiry_rules_read
      permits every authenticated user; the UI only hides writes by capability.
    implication: Any authenticated non-field route consumer can deep-link and inspect all current and historical expiry policy.
  - id: EX-P1-002
    priority: P1
    finding: Every Admin access-class role receives expiry configuration by default.
    evidence: >-
      has_planning_capability defaults planning.configure_expiry for the admin
      class, and compliance_admin, form_admin, workflow_admin, risk_owner,
      gis_admin and security_admin are all explicitly seeded with it.
    implication: Least privilege and separation of duties are not demonstrated.
  - id: EX-P1-003
    priority: P1
    finding: Updates have no optimistic concurrency guard.
    evidence: Actions update by id only; no version, updated_at or expected-state predicate is supplied.
    implication: Concurrent edits or toggles can silently overwrite one another.
  - id: EX-P1-004
    priority: P1
    finding: New-version allocation is read-max-then-insert.
    evidence: >-
      createRuleVersion reads the maximum version and inserts max+1; a uniqueness
      conflict is surfaced as refresh/retry rather than serialized by the database.
    implication: Concurrent administrators receive avoidable conflicts and no preserved draft.
  - id: EX-P1-005
    priority: P1
    finding: Scope enumerations duplicate lookup authority.
    evidence: Visit type, execution mode and priority values are hard-coded in both UI and action validation.
    implication: Expiry policy scope can drift from governed Planning lookups and runtime enum evolution.
  - id: EX-P1-006
    priority: P1
    finding: Scheduler deployment evidence is static, not live.
    evidence: Migration declares pg_cron every 15 minutes, but this review found no live cron run history or current deployed job proof.
    implication: Repository correctness alone cannot prove the production scheduler is installed and healthy.

permissions_rls_and_concurrency:
  read_policy: auth.uid() is not null
  write_policy: has_planning_capability(planning.configure_expiry)
  route_guard: ABSENT
  server_action_recheck: PRESENT
  least_privilege: NOT_PROVEN
  maker_checker: ABSENT
  database_single_enabled_constraint: ABSENT
  governed_activation_rpc: ABSENT
  active_version_immutability: ABSENT
  optimistic_concurrency: ABSENT
  delete_policy: ABSENT
  generic_audit_trigger: PRESENT

