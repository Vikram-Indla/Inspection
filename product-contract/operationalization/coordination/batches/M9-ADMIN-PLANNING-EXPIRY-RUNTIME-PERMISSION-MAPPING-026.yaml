required_prerequisites:
  P0:
    - Sponsor-approved policy for whether each rule family must always have exactly one active version or may intentionally have none.
    - Governed transactional activation RPC that validates rule identity/type, serializes the family, closes the prior effective window and activates one approved version.
    - Database invariant preventing more than one active/effective version per rule family.
    - Immutable active/effective rows; changes create a new draft version.
    - Decision to remove no_execution_date or introduce a real nullable execution-date authority and migration contract.
    - Maker-checker decision and distinct-actor approval for expiry activation.
    - Negative-path database tests proving atomic rollback and final Expired guards.
  P1:
    - Route-local authorization and least-privilege read/write policy.
    - CAS or expected-version protection for draft edit and activation.
    - Governed version allocator.
    - Scope values sourced from canonical lookup/enum authority.
    - Live pg_cron installation, run-history, failure alert and idempotent replay evidence.
    - Isolated seeder namespace with complete cleanup for expiry certification.

bounded_implementation_boundary:
  lease_1_database:
    - planning_expiry_rules constraints and lifecycle fields
    - activation/proposal/approval RPCs
    - RLS and transition guards
    - scheduler rule evaluation compatibility
  lease_2_application:
    - /admin/planning/expiry route guard
    - draft/version/approve/activate UI behavior
    - honest effective-state and unavailable-state rendering
  lease_3_quality:
    - isolated seeded fixtures
    - database negative and concurrency tests
    - browser persona, locale, theme and responsive evidence
    - deployed cron health evidence
  prohibited:
    - changing expiry thresholds or policy values without sponsor-approved authority
    - implementing the dormant rule by weakening visits.window_start integrity
    - modifying leased Design files
    - claiming completion from page rendering or repository-only cron text

