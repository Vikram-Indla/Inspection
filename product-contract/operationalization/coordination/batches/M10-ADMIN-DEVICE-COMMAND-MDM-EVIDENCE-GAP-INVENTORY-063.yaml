cross_cutting_design_evidence_gaps:
  authority:
    - No accepted immutable route-specific Devices revision.
    - No CD-056 package or exact frame fingerprint.
    - No governed screen identity.
  states:
    - loading, partial source, verified empty, unavailable, denied and session expired
    - every trust and command state
    - destructive confirmation, pending, conflict, failure and recovery
    - provider held, offline and acknowledgement unavailable
  fixture_truth:
    - WA-DES-015 device, person, OS, timestamp, outbox and online/offline values are illustrative.
  language:
    - English design uses Arabic wordmark.
    - No approved Arabic Devices frame or qualified Arabic review.
    - Raw status, command, platform, MDM and date values lack bilingual/bidi contract.
  responsive:
    - No 1440, 1200, 1024, 768, 412, 390 and 320 accepted comparison matrix.
    - Fixed design rail and wide table have no proven narrow task flow.
  accessibility:
    - No destructive-action confirmation semantics.
    - No unique device-specific action names.
    - No keyboard, focus recovery, screen-reader, target-size, zoom/reflow or reduced-motion evidence.

cross_cutting_runtime_evidence_gaps:
  source_truth:
    - Device-read error still renders zero trusted.
    - Command error becomes No RLS-visible commands.
    - Thirty-row command history has no bounded disclosure or total.
  permission:
    - No focused browser/RLS matrix for Security Admin, Ops, Auditor, assigned self and unrelated user.
    - No proof that read-only users lack rendered controls.
  transitions:
    - Resume safety, terminal states, revoke and allowed-state matrix untested.
    - Duplicate, stale and contradictory commands untested.
  audit:
    - Command UI hides device, requester and timestamps.
    - No immutable command lifecycle event or receipt.
  package_and_offline:
    - Download and submit trust enforcement unproven.
    - Expire-package and offline cache effect absent.
    - Revoked-device sync denial unproven.
    - Adjacent offline replay does not prove command delivery.
  provider:
    - No formal MDM hold row, sandbox, callback, poll, receipt or failure contract.
  localization:
    - Arabic fallback presence only; values documented as draft.
    - No Devices Arabic route test; hard-coded English and raw enums remain.
  responsive_theme_accessibility:
    - No Devices-specific viewport/theme visual or automated accessibility run.
    - No browser screenshot/video evidence located for the route.

