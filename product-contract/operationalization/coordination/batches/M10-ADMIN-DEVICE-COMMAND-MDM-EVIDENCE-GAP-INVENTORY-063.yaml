evidence_grading:
  DESIGN_SOURCE: Registered source file or frame content; appearance intent only.
  SOURCE_ASSERTION: Static test or direct source inspection; no runtime proof.
  DATABASE_ROLLBACK: Live or local transactional database behavior with no persisted product result.
  BROWSER_SMOKE: Route/title or shell visibility only.
  ADJACENT_RUNTIME: Real behavior on a related Field/package/offline surface, not Admin Devices acceptance.
  ROUTE_RUNTIME: Behavior executed through /admin/devices with a named persona.
  PROVIDER_RUNTIME: Approved external provider transport and genuine receipt.
  ACCEPTANCE_EVIDENCE: Versioned evidence tied to exact requirement, persona, state and negative path.
  rule: >-
    A lower grade does not satisfy a higher grade. Design source, static text
    matching, privileged SQL and adjacent Field behavior cannot substitute for
    route, provider or acceptance evidence.

