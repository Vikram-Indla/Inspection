authority_rules:
  - Ownership here means accountable producer/reviewer, not an implementation lease.
  - Sponsor decisions precede policy encoding; nobody else may infer unanswered values.
  - Governance authors the approved contract and role/state vocabulary; it does not implement product code.
  - Provider owner proves an approved external contract; seeded or mocked data cannot substitute for a genuine receipt.
  - Claude Design owns route-specific design output; it cannot redefine requirements, RBAC or provider semantics.
  - Seeder owner creates deterministic non-production fixtures only after schema/policy contracts are stable.
  - One implementation lease owns each file set; UI, database, provider and offline leases may run concurrently only when their files and contracts do not overlap.
  - QA writes/runs acceptance tests under a separate recorded lease and does not self-certify implementation.
  - Independent reviewer never edits leased product/test/provider/data files.
  - Sponsor alone approves policy/design promotion and final acceptance; review recommendations are not approval.

ownership_lanes:
  SPONSOR:
    accountable_for:
      - DEV-CMD-DEC-01..10 answers
      - approval or explicit hold of MDM provider capability
      - final accepted design revision and promotion decision
    may_not:
      - delegate policy invention to implementation or test workers
    completion_artifact: Signed decision record with every required matrix/value populated.
  GOVERNANCE:
    accountable_for:
      - canonical RBAC/capability mapping
      - allowed state-transition and terminal-state contract
      - maker-checker, audit, evidence, retention and change-control trace
      - formal provider-hold row when capability is held
    may_not:
      - select sponsor options or weaken accepted requirements
    completion_artifact: Versioned approved contract/change record linked to requirement and acceptance IDs.
  PROVIDER_SECURITY:
    accountable_for:
      - approved provider adapter contract or truthful fail-closed hold
      - authenticated correlation, idempotency and receipt stages
      - rejection, timeout, duplicate, late and mismatched receipt semantics
    may_not:
      - claim a mock, seed or privileged database update as a provider receipt
    completion_artifact: Approved contract plus genuine non-production endpoint/receipt evidence, or explicit hold.
  CLAUDE_DESIGN:
    accountable_for:
      - stable CD-056 route-specific revision and fingerprints
      - every approved lifecycle, denied, stale, conflict, offline, provider and audit state
      - EN/LTR, AR/RTL, theme, responsive and accessible interaction intent
    may_not:
      - invent provider behavior, policy values or application completion
    completion_artifact: Code-ready design package and acceptance mapping approved by sponsor.
  DATA_SEEDER:
    accountable_for:
      - deterministic state/persona/package/sync fixtures
      - isolated setup/cleanup and provenance
    may_not:
      - seed genuine provider acknowledgement or alter canonical policy
    completion_artifact: Re-runnable fixture manifest with expected state and cleanup proof.
  IMPLEMENTATION_DB:
    accountable_for:
      - RLS/RPC authorization
      - locked versioned transitions, idempotency and atomic audit
      - terminal-state and package enforcement
    file_authority_after_lease: Supabase additive migrations and database tests explicitly named in a future lease.
    may_not:
      - edit Admin/Field UI, provider adapter, design or governance records
  IMPLEMENTATION_PROVIDER:
    accountable_for:
      - provider dispatch and authenticated receipt ingestion
      - correlation, deduplication, quarantine and safe retry
    file_authority_after_lease: Provider adapter/server boundary files explicitly named in a future lease.
    may_not:
      - edit database transition authority, UI design or provider policy
  IMPLEMENTATION_ADMIN_UI:
    accountable_for:
      - /admin/devices source-backed lifecycle and evidence presentation
      - persona-bound actions, confirmations, conflicts and degraded states
      - accepted EN/AR, responsive and accessible design
    file_authority_after_lease: Admin Devices route/components/styles/i18n explicitly named in a future lease.
    may_not:
      - edit database/provider/offline behavior or design authority
  IMPLEMENTATION_FIELD_OFFLINE:
    accountable_for:
      - device trust at download/open/cached-open/sync/submit
      - offline invalidation/replay and immutable conflict evidence
    file_authority_after_lease: Field package/offline/sync files explicitly named in a future lease.
    may_not:
      - edit Admin UI, provider adapter, policy or design authority
  QA:
    accountable_for:
      - test implementation and execution for all applicable 60 cases
      - named-persona, negative, concurrency, provider, browser and regression evidence
      - truthful blocked/skipped reporting
    may_not:
      - invent expected policy or certify mock provider results as live
    completion_artifact: Versioned run receipts, traces, screenshots and evidence index with zero unexplained P0/P1 failure.
  INDEPENDENT_REVIEW:
    accountable_for:
      - requirement/design/code/test/evidence trace review
      - mapping, delta, lease collision and claim accuracy
      - approve-for-consent, return or block recommendation
    may_not:
      - modify any leased implementation/test/data/provider file
    completion_artifact: Independent recommendation bound to exact revisions and evidence.

