dependency_order:
  phase_1_parallel_decisions:
    may_run_now:
      - SPONSOR completes DEV-CMD-DEC-01..09 using brief 062.
      - GOVERNANCE prepares non-prescriptive templates and identifies change-control targets.
      - PROVIDER_SECURITY inventories actual available provider/environment facts without selecting a provider.
      - CLAUDE_DESIGN inventories reusable CD-056 states and waits only on semantics it cannot invent.
      - DATA_SEEDER inventories reusable fixture sources without writing data.
      - QA prepares case manifest paths and harness prerequisites without encoding unanswered outcomes.
      - INDEPENDENT_REVIEW audits mappings and collisions.
    join_condition: Sponsor decisions 01..09 recorded and governance/provider facts reconciled.
  phase_2_design_and_contract:
    prerequisites: phase_1_parallel_decisions join condition
    parallel:
      - GOVERNANCE writes approved role/state/audit/offline contract.
      - PROVIDER_SECURITY finalizes approved provider contract or formal hold.
      - CLAUDE_DESIGN produces stable route-specific lifecycle and negative states.
    join_condition: Sponsor accepts governance/provider/design artifacts.
  phase_3_fixture_and_implementation:
    prerequisites: phase_2_design_and_contract join condition
    parallel_with_separate_leases:
      - DATA_SEEDER builds isolated deterministic fixtures.
      - IMPLEMENTATION_DB implements authorization/lifecycle/audit/package enforcement.
      - IMPLEMENTATION_PROVIDER implements adapter/receipts if provider is approved.
      - IMPLEMENTATION_ADMIN_UI implements accepted Devices route.
      - IMPLEMENTATION_FIELD_OFFLINE implements trust/invalidation/replay boundary.
    collision_control: Every lease lists exact files, schemas and migration order before work starts.
  phase_4_integration_and_QA:
    prerequisites: phase_3 revisions integrated in declared dependency order
    sequence:
      - QA executes DB/server/provider tests.
      - QA executes Admin and Field browser tests.
      - QA executes visual/i18n/a11y and protected regression.
      - INDEPENDENT_REVIEW reconciles all 60 cases and evidence.
      - SPONSOR decides promotion.

no_wait_work_queue:
  sponsor_busy: Complete the ten-answer sponsor brief; no engineering answer may substitute.
  governance_busy: Draft empty role/transition/receipt/hold templates and enumerate affected canonical files read-only.
  provider_busy: Confirm whether a real approved non-production MDM endpoint and receipt contract exist.
  design_busy: Prepare state inventory and content slots that do not depend on policy values.
  seeder_busy: Map existing safe fixtures to required states and identify gaps without mutation.
  implementation_busy: Perform read-only impact and file-collision analysis; do not code before lease/contract.
  QA_busy: Build a no-result case catalogue and reusable-spec map; do not mark cases passed.
  reviewer_busy: Verify traceability, evidence grades and authority separation.

collision_boundaries:
  prohibited_overlap:
    - DESIGN and implementation editing the same application files
    - DB and provider workers changing the same migration or lifecycle function
    - Admin UI and Field/offline workers changing shared shell/i18n without a separate shared-owner lease
    - Seeder and QA mutating the same live fixtures concurrently
    - QA modifying implementation to make a test pass
    - Independent Review modifying any leased file
  shared_file_rule: >-
    Any shared shell, i18n, schema, generated type or common action file is
    removed from parallel leases and assigned to one explicit integration owner.
  database_rule: Additive forward-only migration order is fixed before parallel implementation; no destructive rollback.
  evidence_rule: Each producer writes only its owned evidence namespace; final index references rather than overwrites.

review:
  disposition: BLOCK
  code: BLOCK_UNTIL_SPONSOR_POLICY_PROVIDER_AND_DESIGN_GATES_PASS
  validations:
    - The 60 acceptance cases are partitioned among four primary pre-implementation accountability groups.
    - Every blocker names primary, supporting/review and downstream owners.
    - No implementation or test lease is granted by this board.
    - Parallel work is limited to non-overlapping decisions, fact inventory, design preparation, fixture mapping and test planning.
    - Current unsafe Resume and absent provider receipt remain explicit blockers.
  safe_successor:
    task_id: M10-ADMIN-DEVICE-COMMAND-MDM-SPONSOR-ANSWER-VALIDATION-CHECKLIST-067
    mode: READ_ONLY
    objective: >-
      Define the exact completeness and non-contradiction checks for each of
      the ten sponsor answers so Governance and Claude Design can consume them
      without invention; do not answer on the sponsor's behalf or change the
      decision register.
