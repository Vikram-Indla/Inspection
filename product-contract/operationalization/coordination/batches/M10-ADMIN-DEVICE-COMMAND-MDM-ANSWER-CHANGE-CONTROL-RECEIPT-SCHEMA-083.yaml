receipt_semantics:
  receipt_is:
    - an immutable acknowledgement that one exact answer-set revision passed checklist 067
    - a provenance link to separately approved authority and evidence records
    - a compatibility and preservation result for the complete ten-decision set
    - a change-control input for later bounded planning
  receipt_is_not:
    - a substitute for a sponsor answer or signature
    - a provider credential, provider enablement or genuine command receipt
    - Claude Design acceptance or stable design lineage
    - an implementation, data, QA, device, evidence, merge or deployment lease
    - requirement, acceptance, screen, test or release completion
  fail_closed_rules:
    - Any missing, unresolved, stale, mismatched or superseded required field keeps receipt state INVALID.
    - Partial decision sets cannot receive an ACK receipt.
    - A receipt cannot alter the answer set that its hashes bind.
    - Expiry or supersession cannot silently fall back to an older receipt.
    - A general instruction to proceed cannot populate any receipt field.

