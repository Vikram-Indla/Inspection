field_validation_contract:
  required_for_ack:
    - Exactly ten governed decision rows exist and each carries one allow-listed option.
    - Every required answer companion field is represented in the bound answer payload.
    - All answer, intake, checklist, authority, evidence, preservation and receipt hashes resolve.
    - Checklist 067 passes all 55 decision checks and all 16 cross-decision checks.
    - All 14 positive and 46 negative acceptance cases remain preserved.
    - Every required authority/evidence reference resolves to an accepted immutable record.
    - Receipt revision, effective time, expiry/revalidation policy and supersession state are explicit.
    - No receipt or acknowledgement field grants a lease.
  invalid_if:
    - Any required value is null at attempted acknowledgement.
    - Any selected option is outside its decision allow-list.
    - Any hash, revision, signature, authority or evidence reference is unresolved or mismatched.
    - Any decision compatibility or preservation result is not PASS.
    - Any receipt it supersedes is missing, overwritten or not retained immutably.
    - Any lease field is true or is interpreted as authorization.
    - Any provider assertion uses mock, seed, privileged table update or invented evidence as genuine effect.
    - Any design assertion lacks stable lineage and separate sponsor acceptance.
  allowed_states:
    - DRAFT
    - VALIDATING
    - RETURNED
    - ACK
    - EXPIRED
    - SUPERSEDED
    - INVALID
  state_rule: >-
    Only a complete, verified and mutually compatible record may transition to
    ACK. ACK enables bounded change-control planning only; it does not authorize
    implementation or claim completion.

