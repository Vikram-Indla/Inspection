five_KPI_semantics:
  result: CONFIRMED_FROM_CR_054
  cards:
    Draft:
      predicate: "planning_status IN ('draft','validated')"
      note: "validated is internal and is displayed/counted as Draft"
    Published:
      predicate: "planning_status = 'published'"
    Returned:
      predicate: "planning_status = 'returned'"
    Cancelled:
      predicate: "planning_status = 'cancelled'"
    Expired:
      predicate: "planning_status = 'expired'"
  common_grain:
    - current_authenticated_user
    - business_staff_and_planning.view
    - existing_RLS
    - current_search
    - current_non_status_filters
  excluded_grain:
    - operational_state
    - inspection_status
    - journey_state
  selection_behavior:
    - set_status_tab
    - preserve_search_and_non_status_filters
    - reset_page_to_1
  evidence_rule: "Each card equals a direct RLS count query at the identical grain."

search_completeness_validation:
  result: FAIL_CURRENT_SERVICE
  ready:
    - local visit reference and internal reference search
    - exact UUID support
    - factory, CR, license, plan and inspector dimensions
    - escaped wildcard/group syntax
    - deterministic merge sort
    - fail-closed error result
  defects:
    - >
      Factory and plan prequeries use limit(500); Inspector prequery uses
      limit(200). Matches beyond those positions silently disappear.
    - >
      Source comments claim COMPLETE search while the implementation retains
      the exact capped behavior those comments prohibit.
  exact_correction:
    - use collectPostgrestPages for every related search dimension
    - retain bounded URL chunks only after complete id enumeration
    - deduplicate stable visit identifiers
    - fail the entire search to unavailable if any dimension fails
    - prove sentinel matches beyond former 500/200 boundaries

filter_completeness_validation:
  result: FAIL_CURRENT_CONSUMER
  required_filters:
    - planning_status
    - business_visit_type
    - region
    - city
    - visit_window_overlap
    - inspector
  query_logic_ready:
    - filters_combine_with_AND
    - region_city_and_inspector_embeds_become_inner_when_filtered
    - visit_window_uses_overlap_semantics
  defects:
    - >
      Region and city options derive from factory reads capped at 1000 rows;
      valid options beyond the cap can disappear.
    - >
      Inspector options rely on a provider-default row ceiling rather than
      explicit complete pagination.
    - >
      The candidate may omit non-required package, priority, planning-method,
      creation-date and bulk-plan filters to remain small; if rendered, each
      needs the same complete-option and degraded-state proof.
  exact_correction:
    - page every required option source to exhaustion
    - deduplicate after complete RLS-scoped retrieval
    - constrain city options by selected region
    - distinguish option-source failure from legitimate no-options
    - reset page to 1 on any criteria change

counts_pagination_and_status_validation:
  result: FAIL_CURRENT_SERVICE
  defects:
    - id: TOTAL-001
      evidence: >
        Non-search row query does not request exact count; total falls back to
        rows.length, so a 25-row page can claim the complete total.
    - id: OUT-OF-RANGE-002
      evidence: >
        A requested page beyond the last page returns no rows. The UI clamps
        the displayed page number after the query but does not re-query the last
        valid page, producing false empty content.
    - id: STATUS-WHITELIST-003
      evidence: >
        The All tab has no explicit governed status predicate, so an
        out-of-contract value can enter the certified Planning workspace.
  exact_correction:
    total: "Use the already computed exact counts[current_tab] at the same search/filter grain."
    out_of_range: >
      Resolve exact total before the final row range, then redirect/requery the
      last valid page; never render false empty while total is positive.
    governed_status_whitelist:
      - draft
      - validated
      - published
      - returned
      - cancelled
      - expired
    stable_order: "Whitelisted sort plus visit id as deterministic tie-break."
    page_truth:
      - page_size_25
      - exact_total
      - exact_total_pages
      - no_gap_or_duplicate
      - criteria_change_resets_to_page_1

