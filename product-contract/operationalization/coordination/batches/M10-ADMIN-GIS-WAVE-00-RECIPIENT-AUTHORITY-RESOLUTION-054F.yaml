fail_closed_rules:
  - A role type without a named dispatch identity is not dispatch-ready.
  - A runtime role or capability is not policy-review authority.
  - A named identity without a canonical authority source is not dispatch-ready.
  - Prior sponsor or Product Owner approvals do not answer a new packet.
  - DEC-012 independence cannot be expanded to unrelated review scope without assignment.
  - Security Admin does not automatically own privacy, legal or retention decisions.
  - GIS Admin or Operations User does not automatically become the sole DEC-002 domain authority.
  - No request is sent until channel, destination and sender authority are recorded.
  - No response is inferred from silence, previous conversation or application access.

review_recommendation:
  ACK:
    - ACK the canonical source mapping and distinction between authority type and dispatch identity.
  RETURN:
    - RETURN sponsor and Product Owner requests for explicit dispatch identity/channel assignment.
    - RETURN partial authority types for an exact governed assignment.
  BLOCK:
    - BLOCK source-custodian and compatibility-review dispatch because no exact authority exists.
    - BLOCK GIS/Operations and Security/privacy dispatch until joint/exact review authority is governed.
    - BLOCK all requests from being sent in this packet.
  current: ACK_AUTHORITY_MAP_BLOCK_CONTROLLED_DISPATCH

