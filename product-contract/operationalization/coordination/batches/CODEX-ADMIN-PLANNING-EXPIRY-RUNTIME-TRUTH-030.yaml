      disposition: SEPARATE_PLANNING_CAPABILITY_NOT_OWNED_OR_CREDITED_HERE
    governance_rule: >-
      Do not invent renewal of an Expired record. If business requires a
      renewal policy beyond duplicate-to-new-Draft, it needs explicit canonical
      authority before design or implementation.
  web_admin_quality:
    - [WA-M9-AC-001, P0, FAIL, "Real services exist, but rule authority, lifecycle and effective activation are unsafe."]
    - [WA-M9-AC-002, P0, FAIL, "Atomicity, maker-checker, terminal immutability, least privilege and concurrency negatives fail or are absent."]
