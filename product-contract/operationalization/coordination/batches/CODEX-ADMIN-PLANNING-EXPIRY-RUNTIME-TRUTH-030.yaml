exact_prerequisites:
  policy_and_contract:
    - Approve exactly which rule families exist and the legal/business basis for each time basis, scope and offset.
    - Decide whether each family must always have exactly one active version or may intentionally have none.
    - Decide whether already-Published visits bind a rule version at publish time or use the effective version at sweep time.
    - Decide exact view, propose, approve and activate personas under least privilege.
    - Require or explicitly waive distinct-actor maker-checker; recommendation is require it.
    - Decide whether configured notification flags may suppress the canonical planner notification.
    - Remove or hold no_execution_date unless an approved reachable data authority is introduced without weakening window_start.
    - Keep renewal outside this screen unless a new governed requirement explicitly authorizes it.
  governed_mapping_and_design:
    - Register one exact screen-catalogue row for /admin/planning/expiry.
    - Replace CR-001..CR-478 with the direct and dependency IDs in this packet.
    - Accept and fingerprint a route-specific design without reassigning WA-DES-010 or WA-DES-014.
    - Include impact preview, immutable versions, proposal/review/activation, effective intervals, conflict, audit and rollback states.
  database_and_service:
    - Add a governed transactional activation RPC that resolves rule identity/type inside the database.
    - Enforce at most one active/effective version per family and approved continuous coverage if selected.
    - Make active, retired and rejected rows immutable and retain predecessor/decision lineage.
    - Maintain effective_from and effective_to atomically at activation and retirement.
    - Serialize family version allocation and activation; add expected-version protection for draft edits.
    - Add a non-bypassable Expired terminal guard for visit and child editable content.
    - Preserve current transactional status, provenance, lifecycle, audit and notification consequences.
    - Provide live cron job, run-history, failure-alert and idempotent replay evidence.
  route:
    - Add an exact route permission boundary and approved read-only behavior.
    - Use only approved governed scope values.
    - Remove active/historical edit controls and impossible rules.
    - Expose draft, pending, future, active, retired, rejected, unavailable and stale states truthfully.
    - Add affected-visit and notification-recipient impact before activation.
    - Add route loading, safe error/degraded and audit-history states.
    - Complete governed Arabic strings and locale-aware dates.
  qa:
    - Use an isolated seed namespace and a complete semantic cleanup manifest.
    - Prove atomic rollback, single-active invariants, identity binding, maker-checker, immutability and concurrency at the database boundary.
    - Prove the scheduled job, not only the user-scoped manual RPC.
    - Prove Expired rejects edit, republish, cancel, notes and attachment changes through UI, action, RPC and Data API.
    - Prove Planning, Operations and Field consume the result without losing provenance.
    - Certify EN/LTR and AR/RTL, light/dark, desktop/tablet/narrow, keyboard/focus, automated accessibility, screen-reader and negative states.
    - Require qualified native-Arabic review; automation may not self-certify it.

rollback_and_stop_conditions:
  rollback: No runtime rollback is required because this packet changed no product, design, test or data.
  packet_rollback: Remove only this unique YAML packet before integration if Codex lead returns it.
  stop_conditions:
    - any rule family, threshold, recipient or renewal behavior lacks explicit authority
    - activation can leave zero or multiple active/effective versions contrary to the approved invariant
    - active or historical rule meaning can change after use
    - maker and checker are not separated if approval is required
    - Expired records remain editable through any authorized path
    - no_execution_date remains advertised while structurally dormant
    - live scheduler health and isolated reversible data proof are absent
    - exact route design, Arabic, responsive or accessibility evidence remains unaccepted

