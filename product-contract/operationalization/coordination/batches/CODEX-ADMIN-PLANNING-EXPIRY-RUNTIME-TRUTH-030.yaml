p0_findings:
  - id: PLN-EX-P0-001
    finding: Three rule families and the 0-to-525600-minute policy range lack canonical business authority.
    impact: Admins can introduce final-state timing and recipient policy that CR-068 and CR-098 do not authorize.
    blocks: [REQ-R0C-00204, REQ-R0C-00206, REQ-R0C-00263, WA-M9-AC-001]
  - id: PLN-EX-P0-002
    finding: Activation is a non-atomic two-write operation with no database single-enabled invariant.
    impact: Failure or concurrency can leave zero or multiple enabled versions and ambiguous expiry provenance.
    blocks: [REQ-R0C-00204, REQ-R0C-00206, WA-M9-AC-001, WA-M9-AC-002, WA-M9-AC-005]
  - id: PLN-EX-P0-003
    finding: Enabled and historical rule versions are mutable and effective intervals are not maintained.
    impact: A previously used version can change meaning, and the UI cannot truthfully reconstruct which policy governed a visit.
    blocks: [REQ-R0C-00202, REQ-R0C-00203, REQ-R0C-00206, WA-M9-AC-001, WA-M9-AC-005]
  - id: PLN-EX-P0-004
    finding: no_execution_date is exposed as functioning even though its predicate cannot match the non-null window_start schema.
    impact: An administrator can enable a promised final-state rule that never executes.
    blocks: [REQ-R0C-00204, REQ-R0C-00206, WA-M9-AC-001, WA-M9-AC-002]
  - id: PLN-EX-P0-005
    finding: Expiry activation has no maker-checker and is broadly granted to every Admin access-class role.
    impact: One actor can unilaterally alter final-state behavior before the next 15-minute sweep.
    blocks: [WA-M9-AC-002, WA-M9-AC-005]
  - id: PLN-EX-P0-006
    finding: Expired visits remain editable through notes, attachment upload/removal and broad authorized update paths.
    impact: The canonical final and view-only rule is false even when the scheduler status transition succeeds.
    blocks: [REQ-R0C-00205, REQ-R0C-00207, WA-AC-0067, WA-AC-0068, WA-M9-AC-002, WA-M9-AC-005]

