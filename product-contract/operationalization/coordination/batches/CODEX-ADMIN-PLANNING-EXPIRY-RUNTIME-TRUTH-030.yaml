decision:
  recommendation: RETURN
  implementation_gate: BLOCKED
  completion_credit:
    canonical_requirement_rows: 0
    acceptance_rows: 0
    screens: 0
    accepted_designs: 0
  three_figure_status:
    built_requirements_credited: 0
    independently_verified_requirements_credited: 0
    fully_accepted_requirements_credited: 0
  rationale: >-
    The Admin route, planning_expiry_rules table, configured 15-minute
    scheduler, rule provenance, lifecycle event, generic append-only audit and
    notification inserts are real. The database function commits each matched
    visit status, provenance, lifecycle event and configured notifications in
    one transaction, and repeated sweeps do not reselect already-expired rows.
    Those positives do not complete a canonical requirement. Only expiry after
    a missed visit window is source-authorized; three additional rule families,
    arbitrary offsets through one year and optional consequence flags have no
    cited business-policy authority. Activation is two non-atomic writes, the
    database permits zero or multiple enabled versions, enabled and historical
    rows remain editable, effective intervals are not maintained, and one
    offered rule can never match the non-null visit-window schema. A single
    broadly granted Admin actor can make the policy effective before the next
    sweep without maker-checker or concurrency protection. Separately,
    Expired is not immutable: Planner/Operations can still edit notes and
    add/remove attachments, and the broad visits UPDATE policy has no terminal
    row guard. The live Arabic route is RTL but its complete Expiry business
    surface remains English. The focused tests mutate shared data and have
    visibly accumulated persistent rule versions. No live cron-run history,
    exact screen identity, route-specific accepted design, complete negative
    path, responsive or accessibility certification exists. Return the route
    for policy, lifecycle, database, design and isolated-quality remediation;
    block implementation credit and release use.

