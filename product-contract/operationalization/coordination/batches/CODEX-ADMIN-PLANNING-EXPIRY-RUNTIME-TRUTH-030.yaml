canonical_scope:
  ownership_correction:
    route_inventory_claim: CR-001..CR-478
    disposition: OVERBROAD_NOT_CREDITABLE
    reason: >-
      The Expiry control plane cannot own all 478 customer requirements. Its
      direct source obligations are automatic visit expiry after a missed
      window and the resulting final-state, audit and planner-notification
      consequences. Audit, lifecycle and general notification rows are
      dependencies, not blanket route ownership.
    canonical_change_written: false
  direct_and_dependency_rows:
    - mvp1_id: MVP1-M02-014
      customer_id: CR-066
      acceptance_id: WA-AC-0066
      evidence_id: WA-EV-0066
      atomic_requirements:
        - id: REQ-R0C-00202
          obligation: Record every change with previous value, new value, user and timestamp.
          result: PARTIAL_NO_CREDIT
        - id: REQ-R0C-00203
          obligation: All Planning actions are audited and audit records cannot be edited or deleted.
          result: PARTIAL_NO_CREDIT
      reason: >-
        Generic row triggers and immutable audit_events exist, but activation
        is split into separate uncorrelated updates, system cron audit uses a
        null actor by convention, and no route-level audit/history proof or
        complete live journey was executed.
    - mvp1_id: MVP1-M02-015
      customer_id: CR-067
      acceptance_id: WA-AC-0067
      evidence_id: WA-EV-0067
      atomic_requirements:
        - id: REQ-R0C-00204
          obligation: Enforce lifecycle transitions based on business rules.
          result: FAIL
        - id: REQ-R0C-00205
          obligation: >-
            Planning statuses are Draft, Published, Returned, Cancelled and
            Expired; Cancelled and Expired are final; Returned is pre-start only.
          result: FAIL
      reason: >-
        The expiry function selects Published visits, but terminal immutability
        is not enforced for all fields or authorized Data API paths.
    - mvp1_id: MVP1-M02-016
      customer_id: CR-068
      acceptance_id: WA-AC-0068
      evidence_id: WA-EV-0068
      atomic_requirements:
        - id: REQ-R0C-00206
          obligation: Update visit status to Expired and record audit history.
          result: PARTIAL_NO_CREDIT
        - id: REQ-R0C-00207
          obligation: Expired is final, view-only and cannot be edited, republished or cancelled.
          result: FAIL
      reason: >-
        The canonical window-end rule updates status and records rule/lifecycle
        provenance transactionally, but live scheduler health was not available
        and Expired visit notes and attachments remain editable.
    - mvp1_id: MVP1-M02-041
      customer_id: CR-093
      acceptance_id: WA-AC-0093
      evidence_id: WA-EV-0093
      atomic_requirements:
        - id: REQ-R0C-00256
          obligation: Send notifications for publish, return, cancel, reassignment, rescheduling and expiry.
          result: PARTIAL_NO_CREDIT
      reason: >-
        The expiry leg inserts in-app rows for configured recipients in the
        same transaction. Delivery is marked delivered at insert, live receipt
        was not certified, and the Admin rule can disable recipients without a
        cited policy authority.
    - mvp1_id: MVP1-M02-046
      customer_id: CR-098
      acceptance_id: WA-AC-0098
      evidence_id: WA-EV-0098
      atomic_requirements:
        - id: REQ-R0C-00263
          obligation: Update visit status and notify planner.
          result: PARTIAL_NO_CREDIT
      reason: >-
        Repository and prior fixture evidence show one transactional function
        performs both consequences, but live pg_cron run history and safe
        policy/version governance are absent.
  canonical_transition:
    id: STM-VIS-003
    from: Eligible active Visit
    trigger: Expiry trigger
    to: Expired
    actor: System
    guard: Configured threshold reached
    side_effects:
      - block execution
      - notify if configured
      - rule/version audit
