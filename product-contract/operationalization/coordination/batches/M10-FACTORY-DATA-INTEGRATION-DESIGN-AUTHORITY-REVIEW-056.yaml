CSV_staging_and_custody:
  positive_controls:
    maximum_bytes: 2097152
    maximum_rows: 5000
    schema_version: factory360-v2-staging-1
    required_headers:
      - cr_number
      - license_number
      - plant_number
    unknown_headers_rejected: true
    duplicate_headers_rejected: true
    row_column_count_checked: true
    file_SHA256: true
    rows_initial_state:
      valid: pending
      invalid: rejected
    source_truth_upsert: absent
    validation: STRONG_STRUCTURAL_STAGING_BOUNDARY
  client_preview:
    parser: line and comma split
    server_parser: quoted CSV state machine
    discrepancy: >-
      Preview row/header counts can disagree with server parsing for quoted
      commas or embedded newlines.
    validation: CORRECT_PREVIEW_OR_LABEL_AS_APPROXIMATE
  staged_lifecycle:
    run_insert: first
    batch_insert: second
    rows_insert: third
    database_transaction: absent
    compensating_state:
      batch_failure: run marked failed
      row_failure: run and batch marked failed
    implication: >-
      Partial writes are retained and audited rather than hidden, but the user
      receives no failed-run identifier or deterministic resume path.
    validation: HONEST_PARTIAL_STATE_BUT_NOT_ATOMIC_OR_RESUMABLE
  duplicate_file:
    unique_key: file_sha256 plus schema_version
    concurrent_outcome: one batch may succeed while another run is left failed
    validation: DEDUPLICATED_BATCH_WITH_ORPHAN_FAILED_RUN
  custody_mutability:
    tables_with_authenticated_admin_update_grant:
      - senaei_sync_runs
      - factory_import_batches
      - factory_import_rows
    row_level_policy: same three Admin roles have all operations
    immutable_trigger_on_factory_import_rows: absent
    protected_raw_values_or_row_number_fields: absent
    implication: >-
      An allowed Admin can directly change staged raw values, row numbers,
      error codes or statuses after the file hash was recorded. The audit trail
      records the change, but the parsed row set is no longer cryptographically
      bound to the uploaded file.
    validation: FAIL_STRICT_CUSTODY_AND_NON_BYPASSABLE_STAGING

