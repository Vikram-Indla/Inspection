  - correction_id: 020-R09
    target: KIMI-M11-AUDIT-BOUNDARY-LEASE-015
    severity: P0
    required_text: >-
      Restrict audit_read, audit_read_compliance and every catalog-discovered
      overlapping policy; historical rows immutable, ordinary raw access denied.

  - correction_id: 020-R10
    target: KIMI-M11-AUDIT-BOUNDARY-LEASE-015
    severity: P0
    required_text: >-
      Replace only the virtual-participant generic audit trigger with an
      allowlisted safe trigger so new code_hash/verification_record is never copied.

  - correction_id: 020-R11
    target: ALL_POLICY_AND_TRIGGER_PACKETS
    severity: P1
    required_text: >-
      Add pg_policy/pg_trigger dependency, permissive-OR, recursion, trigger
