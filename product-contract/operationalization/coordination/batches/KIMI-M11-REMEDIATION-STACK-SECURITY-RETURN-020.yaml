  - correction_id: 020-R07
    target: ALL_FUNCTION_PACKETS
    severity: P0
    required_text: >-
      search_path='', full qualification, auth/role/row/state checks, exact
      PUBLIC/anon revokes, intended authenticated grant and overload inventory.

  - correction_id: 020-R08
    target: KIMI-M11-PERMISSION-HARDENING-LEASE-013
    severity: P0
