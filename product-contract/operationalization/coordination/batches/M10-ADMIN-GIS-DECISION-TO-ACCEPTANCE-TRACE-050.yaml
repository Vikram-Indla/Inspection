    item: Dedicated primary Admin GIS requirement in the 478-row baseline
    result: NONE_FOUND
    consequence: Contextual consumer rows cannot be counted complete from SCR-ADM-070.
    stop: No 478-row completion credit for the Admin GIS screen.
  - gap_id: GIS-TRACE-GAP-02
    item: Exact 478-row requirement for single-writer convergence and field ownership
    result: NONE_FOUND
    consequence: Safety is derived from transferred governance plus WA-M10 functional, security and regression acceptance.
    stop: Sponsor and governed change control must establish the operating model before a lease.
  - gap_id: GIS-TRACE-GAP-03
    item: Exact 478-row requirement for GIS stale-write/CAS behavior
    result: NONE_FOUND
    consequence: The obligation is acceptance-derived and protects existing rows from corruption.
    stop: No implementation may retain silent last-writer-wins or false success.
  - gap_id: GIS-TRACE-GAP-04
    item: Exact 478-row requirement for shared-policy activation scheduling
    result: NONE_FOUND
    consequence: Activation must be governed before multiple versions can be implemented.
    stop: No timing behavior may be invented from code defaults.
  - gap_id: GIS-TRACE-GAP-05
    item: Exact 478-row requirement for emergency GIS policy suspension
    result: NONE_FOUND
    consequence: Failure-integrity rows CR-162 and CR-174 constrain safety but do not choose the operating response.
    stop: Sponsor choice and capability mapping required.
  - gap_id: GIS-TRACE-GAP-06
    item: Exact 478-row requirement for GIS configuration rollback
    result: NONE_FOUND
    consequence: Immutable audit rows constrain recovery but do not choose a rollback model.
    stop: Sponsor choice required; no historical rewrite.
  - gap_id: GIS-TRACE-GAP-07
    item: Complete persona-by-data projection contract
    result: NONE_FOUND
    consequence: Contextual persona rows state business use but do not authorize every full/reduced/masked field.
    stop: Every matrix cell and purpose must be approved before RLS/projection change.
  - gap_id: GIS-TRACE-GAP-08
    item: Technical Admin canonical identity
    result: UNMAPPED
    consequence: SCR-ADM-070 screen label cannot create a role or capability.
    stop: Map to an existing canonical capability or leave unresolved.
  - gap_id: GIS-TRACE-GAP-09
    item: Spatial Canvas governed screen identity
    result: MISSING
    consequence: /admin/gis/spatial cannot inherit SCR-ADM-070 mutation authority by proximity.
    stop: Keep mutation held until screen, capability, audit and acceptance are governed.
  - gap_id: GIS-TRACE-GAP-10
    item: Corrective design authority
    result: WA-DES-006-C1_NOT_CREATED_OR_ACCEPTED
    consequence: WA-M10 visual and accessibility implementation cannot start.
    stop: Preserve predecessor; require separately identified immutable successor and sponsor acceptance.
  - gap_id: GIS-TRACE-GAP-11
    item: DEC-002 canonical status
    result: ACCEPTED_INTERIM_BUT_FORMALLY_OPEN
    consequence: Existing seeded defaults have interim sponsor provenance but are not a formally closed frozen-register decision.
    stop: Do not call values final; complete CC-DEC-001 before governed publication.
