      expected:
        - "Safe participant fields are returned."
        - "Existing row relationship enforcement remains intact."
      forbidden:
        - verification_record
      evidence:
        - "Reviewed API response."
        - "Exact query and persona identity."
      execution_state: NOT_EXECUTED
