forbidden_key_contract:
  recursive_keys:
    - verification_record
    - code_hash
    - expires_at
    - last_sent_at
    - provider
    - dev_code
    - otp
  forbidden_values:
    - "Any live one-time code."
    - "Any hash copied from verification_record.code_hash."
    - "Raw DEV-CONSOLE or unapproved provider identity from verification_record.provider."
  scan_surfaces:
    - database API response
    - server component serialization
    - browser network response
    - browser DOM
    - browser-accessible state
    - server log fixture output
    - screenshot
    - video
    - text report
    - JSON evidence

fixtures:
  - fixture_id: FX-076-A
    description: >-
      One in-scope virtual session with assigned inspector, ops/planner access,
      one factory representative and one inspector participant.
    required_events:
      - virtual_sessions INSERT
      - virtual_participants INSERT
      - virtual_participants UPDATE for join
      - OTP_SENT
      - OTP_FAILED
      - OTP_VERIFIED
      - virtual_sessions UPDATE for verified
      - virtual_sessions UPDATE for begin
      - virtual_sessions UPDATE for close
    secret_seed:
      verification_record:
        code_hash: SYNTHETIC_NONLIVE_HASH
        expires_at: SYNTHETIC_TIMESTAMP
        attempts: 1
        resends: 1
        last_sent_at: SYNTHETIC_TIMESTAMP
        provider: SYNTHETIC_PROVIDER_METADATA
    rule: "Synthetic values must never be confused with a live OTP or approved provider."
  - fixture_id: FX-076-B
    description: "An unrelated virtual session and participant outside the caller's relationship scope."
  - fixture_id: FX-076-C
    description: >-
      A historical audit row whose participant before_state and after_state
      contain verification_record plus an unknown nested key.
  - fixture_id: FX-076-D
    description: "One non-M11 audit event with before/after state used to prove no global-display regression."
  - fixture_id: FX-076-E
    description: "An empty in-scope session with no audit rows beyond creation, plus a multi-page synthetic history."

