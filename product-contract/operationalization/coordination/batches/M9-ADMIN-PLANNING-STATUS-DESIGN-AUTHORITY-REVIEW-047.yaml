source_and_active_version_review:
  source_table: public.config_versions
  query:
    engine_filter: workflow
    status_filter: published
    ordering: effective_from descending
    row_limit: 1
    object_id_filter: absent
    effective_from_lte_now_filter: absent
    scheduled_from_lte_now_or_null_filter: absent
    retired_or_rollback_resolution: absent
  source_identity:
    payload_object_parsed: true
    payload_object_displayed: false
    config_object_id_displayed: false
    selected_version_id_displayed: false
    version_label_displayed: conditional
    effective_from_displayed: conditional
  critical_findings:
    - >-
      Multiple workflow objects are permitted by config_versions, but the page
      does not identify or filter the planning lifecycle object.
    - >-
      A future scheduled version is marked published with effective_from set at
      publish time; ordering only by effective_from can show it before its
      scheduled activation.
    - >-
      The page does not apply the documented coalesce(scheduled_from,
      effective_from) active-version selection rule.
    - >-
      The screen says database-enforced transitions but does not prove that the
      selected row is the exact version bound to runtime transitions.
  validation: INCORRECT_ACTIVE_VERSION_SELECTION

canonical_transition_semantic_review:
  authority: product-contract/domain/state_transitions.csv
  fallback_claim: Static copy of canonical lifecycle visit-lifecycle-v4.
  fallback_states:
    - planned
    - acknowledged
    - in_execution
    - completed
    - closed
  mismatches:
    - transition_id: STM-PLAN-002
      canonical: "Visit Plan: Validated -> Published; trigger Publish; actor Planner/Approver"
      fallback: "planned -> acknowledged; actor inspector"
      verdict: INCORRECT_ID_REUSE
    - transition_id: STM-VIS-001
      canonical: "Visit: Published -> Returned; trigger Return for update; actor Authorized Planner/Ops"
      fallback: "acknowledged -> in_execution; actor inspector"
      verdict: INCORRECT_ID_REUSE
    - transition_id: STM-VIS-002
      canonical: "Visit: Published/Returned -> Cancelled; trigger Cancel; actor Authorized role"
      fallback: "in_execution -> completed; actor inspector"
      verdict: INCORRECT_ID_REUSE
    - transition_id: STM-VIS-003
      canonical: "Visit: Eligible active -> Expired; trigger Expiry; actor System"
      fallback: "completed -> closed; actor planner"
      verdict: INCORRECT_ID_REUSE
    - transition_id: republish
      canonical: NOT_FOUND_IN_CANONICAL_TRANSITION_REGISTER
      fallback: "any -> planned; actor planner"
      verdict: UNREGISTERED_STATIC_RULE
  omitted_canonical_transition:
    transition_id: STM-PLAN-001
    canonical: "Visit Plan: Draft -> Validated"
  implication: >-
    The fallback is not merely stale; it changes the meaning of controlled
    transition identifiers. It must not be presented as a canonical lifecycle.
  validation: CRITICAL_SEMANTIC_FAILURE

permissions_maker_checker_dependency:
  read_permission:
    database: all authenticated users
    route: no additional gate
    sensitive_write_controls_exposed: capability names and transition guards
    required_decision: Confirm whether authenticated-wide visibility is intended.
  write_permission:
    route_mutations: none
    change_destination: /admin/workflows
    implication: This route itself cannot bypass status changes.
  maker_checker:
    route: NOT_APPLICABLE_READ_ONLY
    upstream: PARTIAL_AND_BYPASSABLE
    reason: >-
      The config_versions constraint only requires different actors when
      approved_by is populated; generic administrative update policy does not
      require approved_by for published status.
  dependency_impact:
    route_visibility: absent
    in_flight_version_binding: not displayed
    affected workflow objects: not displayed
    affected visits_or_inspections: not displayed
    scheduled successor impact: not displayed
    validation: MISSING
  status_transition_authority:
    route_controls: none
    static_capability_map:
      - planning.publish
      - planning.manage
      - planning.cancel
      - planning.reassign
      - planning.reschedule
    map_source: hard-coded in page
    drift_risk: It is not loaded from the role-capability authority or exact workflow payload.
    validation: PARTIAL_STATIC_EXPLANATION_ONLY

audit_version_concurrency:
  route_audit:
    writes: none
    read_access_event: not recorded
    provenance_link: absent
  upstream_config_audit:
    generic_config_versions_audit_trigger: NOT_FOUND
    lifecycle_action_audit: NOT_PROVEN
    validation: FAIL_FOR_DEFINITION_CHANGE_PROVENANCE
  versioning:
    config_version_id_available: true
    row_version_available: true
    scheduled_from_available: true
    rollback_of_available: true
    displayed_row_version: false
    displayed_schedule: false
