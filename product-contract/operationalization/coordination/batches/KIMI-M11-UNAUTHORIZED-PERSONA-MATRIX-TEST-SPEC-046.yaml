purpose: >-
  Freeze the future M11 authorization test matrix across public, anonymous,
  unrelated authenticated, assigned/unassigned Inspector, Reviewer,
  Operations, administrative, provider and technical service identities.
  Cover direct table access, governed RPCs, safe reads, writes, exports, audit
  visibility and neutral missing/out-of-scope boundaries without inferring
  authority or using privileged identities as proof of ordinary-user access.

