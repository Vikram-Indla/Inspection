evidence_contract:
  required_metadata:
    - run_id
    - case_id
    - frozen_authority_hashes
    - code_commit
    - migration_chain_hash
    - fixture_graph_hash
    - ordinary_or_technical_identity_class
    - exact_authority_citation_when_positive
    - result
    - independent_reviewer
  required_outputs:
    - persona_surface_action_resource_matrix
    - returned_field_manifest
    - row_state_before_after
    - audit_and_event_before_after
    - status_token_body_hash_pairs
    - export_artifact_count_and_schema
    - prohibited_field_scan
    - teardown_result
  integrity_rules:
    - "Every ordinary persona test uses an ordinary authenticated session."
    - "Privileged technical observations are labeled and excluded from authorization evidence."
    - "No credential, secret, personal data, raw application row or provider payload is released."
    - "Missing authority yields BLOCKED_AUTHORITY, never an inferred positive."
    - "A missing redaction scan, teardown or independent signoff invalidates the evidence bundle."

