hard_boundary:
  - "No actual test, SQL, migration, product, application, database, design, data, seed, branch or stash change."
  - "No live identity, credential, provider, service key, OTP, person, factory or application record."
  - "No role, action, provider or administrative authority is invented."
  - "service_role, owner, superuser and BYPASSRLS results cannot certify ordinary persona authorization."
  - "No implementation or QA lease is issued and zero change is made to the 478-row completion count."
  - "Kimi output remains unaccepted until the locked Mac is unlocked and its response is captured and validated."

authorization_principles:
  - "Every positive result requires exact frozen action authority plus resource relationship, state and window."
  - "Broad current RLS, role labels and historical positive tests are not authority."
  - "PUBLIC and anon have no direct table or governed RPC access."
  - "Direct INSERT, UPDATE and DELETE are denied to PUBLIC, anon and authenticated after the governed switch."
  - "Assigned Inspector authority is resource-scoped and action-scoped."
  - "Unassigned Inspector and unrelated authenticated users receive the neutral resource boundary."
  - "Reviewer and Auditor are safe view-only where exact authority permits."
  - "Operations positives remain blocked without exact canonical action authority."
  - "Administrative application personas cannot read raw participant secret-bearing audit JSON."
  - "Provider/technical service identities have only an exact future machine contract and cannot browse application data."
  - "Missing and out-of-scope responses are byte-equivalent at every governed public boundary."

