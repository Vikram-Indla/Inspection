surface_contract:
  DIRECT_TABLE_READ: "SELECT against virtual session, participant and raw audit tables."
  DIRECT_TABLE_WRITE: "INSERT, UPDATE or DELETE against governed M11 tables."
  GOVERNED_RPC_READ: "Caller-facing status, room or safe audit RPC."
  GOVERNED_RPC_WRITE: "Caller-facing creation, window, join, begin, OTP or close RPC."
  SAFE_AUDIT_VIEW: "Approved projection containing only safe facts."
  RAW_AUDIT_VIEW: "Raw participant before_state/after_state or secret-bearing JSON."
  SAFE_EXPORT: "Approved redacted export."
  RAW_EXPORT: "Raw rows, participant JSON, secret classes or prohibited fields."
  PROVIDER_CALLBACK: "Future exact provider machine callback."

expected_result_vocabulary:
  ALLOW: "Exact authorized action succeeds within resource/state/window scope."
  DENY: "Action denied without resource or internal-policy disclosure."
  NEUTRAL: "Missing and out-of-scope results have identical status, token and body bytes."
  SAFE_VIEW_ONLY: "Only approved safe fields returned; no mutation authority."
  BLOCKED_AUTHORITY: "No positive expectation until exact frozen authority exists."
  BLOCKED_PROVIDER: "Provider/service path unavailable until exact approved machine contract exists."
  NOT_VALID_AUTHORIZATION_EVIDENCE: "Privileged technical execution cannot certify an ordinary persona."

