state_matrix:
  loading: "Reserve provider, staging, controls and history geometry; announce loading."
  empty: "No RLS-visible factories/runs/rejections/reconciliation shown separately."
  schema_unavailable: "Warn that no provider or history state is inferred."
  provider_unavailable: "Preserve CSV/local controls permitted by contract; no green cue."
  csv_preview_valid: "Show name, row/header counts and schema."
  csv_preview_invalid: "Show safe field/file errors; disable staging."
  staging_pending: "One action pending; prevent duplicate submission."
  staged_success: "Batch ID, pending and rejected counts; explicitly zero accepted."
  staging_failure: "Safe error code; no imported claim; retain chosen-file context where safe."
  partial_write_failure: "Failed run/batch state remains visible and retry does not duplicate custody."
  selected_factory: "Show exact source identifiers read-only and local forms."
  unauthorized: "Route and direct actions deny without leaking data."
  degraded: "One history/read failure does not fabricate or zero healthy sources."
  stale_conflict: "No silent overwrite of representative status or duplicate batch; current runtime proof required."

