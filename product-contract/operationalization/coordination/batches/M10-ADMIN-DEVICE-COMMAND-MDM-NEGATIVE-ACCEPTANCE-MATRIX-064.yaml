acceptance_stop_rules:
  - Any queued Resume that writes Trusted before approved evidence is an immediate P0/P1 failure.
  - Any ordinary restoration from Revoked, Wipe Pending or Wiped is an immediate failure.
  - Any provider timeout, absence or unauthenticated receipt shown as completed is an immediate failure.
  - Any command accepted when its audit write fails is an immediate failure.
  - Any denied actor who can mutate through direct request despite hidden navigation is an immediate failure.
  - Any offline replay that silently overwrites, loses evidence or bypasses current trust state is an immediate failure.
  - Any mocked or privileged direct acknowledgement presented as genuine provider evidence is an immediate failure.
  - Arabic/RTL, responsive or accessibility failures on the destructive path block screen certification.

