acceptance_semantics:
  REJECT:
    meaning: The request must not be accepted or dispatched.
    invariants:
      - no command row or provider request is created
      - device, package and trust state remain unchanged
      - denial is visible without exposing restricted data
      - the governed denial audit is recorded when policy requires it
  HOLD:
    meaning: A request may be durably recorded but cannot be claimed acknowledged, completed or effective.
    invariants:
      - trust is never restored
      - wipe or invalidation is never claimed complete
      - retry remains bounded by an approved idempotency contract
      - operator sees the unresolved dependency and safe next action
  DEGRADE:
    meaning: Read-only evidence may remain available while mutation is disabled.
    invariants:
      - last confirmed state and its age are explicit
      - stale or unavailable data is not shown as healthy
      - no optimistic positive state is introduced
  BLOCK:
    meaning: Acceptance cannot be run until an unresolved sponsor, provider, policy or design contract is approved.
  proof_rule: >-
    Each executable case requires database/API evidence plus named-persona
    browser evidence where a user surface exists. Source inspection, a route
    smoke, mocked provider success or privileged direct table mutation is not a
    pass.

preservation_floor:
  - Only the assigned, enrolled, trusted and app-compliant device may download, open or submit an official package.
  - Pending, suspended, revoked, wipe-pending and wiped devices fail closed.
  - A remote request is not a remote result.
  - Queuing Resume cannot restore trust.
  - Provider acceptance, device receipt and verified effect cannot be conflated.
  - Unauthorized, invalid, stale, duplicate, missing-provider and offline paths cannot corrupt records or silently restore access.
  - Actor, reason, device identity, governing version, time, before/after state and genuine evidence remain auditable.
  - No provider behavior, SLA, retry interval, retention, policy value or translation approval may be invented.

