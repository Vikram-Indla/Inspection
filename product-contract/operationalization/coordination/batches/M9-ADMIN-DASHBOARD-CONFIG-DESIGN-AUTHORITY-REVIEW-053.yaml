requirement_authority_review:
  CR_445:
    requirement: >-
      Operations KPIs calculate visits planned, completed, cancelled, overdue,
      active inspectors, average duration and SLA breach rate; the KPI
      calculation period is configurable.
    current_admin_support:
      - generic kpi_parameters domain name
      - raw JSON draft/publish lifecycle
      - published version ID can be attached to projected metrics
    missing:
      - named period fields
      - allowed unit or range
      - timezone and boundary semantics
      - validation and dependency rules
      - preview of affected metrics
      - runtime reading of the published payload
      - source-backed proof that all CR-445 metrics use the period
    validation: NOT_IMPLEMENTED_END_TO_END
  broad_route_mapping:
    current_claim: CR-001..CR-478
    validation: INCORRECT_OVERBROAD
    correction: >-
      CR-445 is the direct customer authority. Other Dashboard and Operations
      requirements are dependent consumers only when a specific configuration
      domain demonstrably controls them.
  local_ADM_DASH_claim:
    source_contract_found: false
    page_claim: ADM-DASH-001..018
    validation: UNGOVERNED_IDENTIFIER_RANGE

kpi_period_and_typed_payload_review:
  authoring_control:
    field: free-text textarea
    parser: any JSON object
    per_domain_schema: none
    unknown_key_rejection: none
    required_key_validation: none
    type_range_enum_or_unit_validation: none
    cross_field_validation: none
  database:
    payload_check: JSON object only
    publish_dependency_validation: none
  runtime:
    loader: apps/web/src/lib/dashboard-kpi/loader.ts
    consumed_from_head:
      - current_version_id
      - config_key
    version_payload_loaded: false
    version_effective_from_loaded: false
    projected_field: policyVersionId only
  implication: >-
    Arbitrary payloads can be approved, but their values do not configure KPI
    calculations. The system proves lineage decoration, not CR-445 period
    configurability.
  validation: FAIL_TYPED_POLICY_AND_RUNTIME_WIRING

maker_checker_and_mutation_boundary:
  strengths:
    - no authenticated table INSERT, UPDATE or DELETE policy
    - direct authenticated DML explicitly revoked
    - all application mutations use role-gated security-definer RPCs
    - owner identity is non-null
    - return and publish reject the maker
    - selected draft row is locked for transition
    - published version row is append-only
    - audit is written in the transition transaction
  gaps:
    - no route authentication or Admin route boundary
    - multiple open drafts for one domain are allowed
    - no base_version_id or expected-head comparison
    - a stale pending draft can publish after a newer domain policy
    - no UI action invokes dash_update_config_draft
    - returned drafts can only be resubmitted unchanged
    - return_reason and prior decision metadata remain visible/stale after resubmission
    - generic JSON is not validated before submit or publish
  validation: STRONG_NON_BYPASSABLE_RPC_PATH_BUT_INCOMPLETE_WORKFLOW

effective_date_and_concurrency:
  storage:
    requested_effective_from: nullable timestamp
    published_effective_from: timestamp
    effective_to: absent
  current_UI:
    requested_effective_from_input: absent
    result: every UI-created publication defaults to publication time
  publication_RPC:
    future_date_allowed: true
    past_date_allowed: true
    head_switch: immediate regardless of effective_from
    domain_level_lock: absent
    next_version_algorithm: max(version_number) plus one
  runtime_loader:
    head_effective_date_filter: absent
    version_effective_date_filter: absent
  concurrency:
    simultaneous_different_pending_drafts_same_domain: permitted
    duplicate_next_version_result: one transaction may fail on unique constraint
    conflict_message: generic neutral error
    stale_draft_publish_guard: absent
  implication: >-
    A future-effective version becomes the head immediately, while a stale
    draft can replace a newer policy. The displayed effective date therefore
    does not govern activation.
  validation: FAIL_EFFECTIVE_DATE_AND_STALE_CONCURRENCY

version_audit_and_history:
  strengths:
    - immutable version rows
    - monotonically intended version number
    - source parameter, publisher, publication time and correlation
    - publication audit reference
    - lifecycle audit for create, update, submit, return and publish
  gaps:
    - UI shows only the current head version
    - no version history or compare
    - no payload display for active or draft records
    - no before/after impact
    - no audit timeline
    - no cancellation path despite cancelled status
    - no effective-period history
  validation: PARTIAL_BACKEND_NO_REVIEWABLE_GOVERNANCE_EVIDENCE

