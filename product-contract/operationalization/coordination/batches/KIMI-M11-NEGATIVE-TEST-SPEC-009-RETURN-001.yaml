corrections:
  - correction_id: 009-R01
    severity: P0
    subject: "CR-337 today-and-confirmed list contract"
    finding: >-
      Case 009-C01 stages an appointment in a wide random future window and
      expects the session to appear on /virtual, then classifies the case
      PASS-NOW. That behavior contradicts CR-337, which requires today's
      confirmed virtual inspection and states that only confirmed virtual
      visits are displayed.
    source_evidence:
      - "product-contract/web-admin-phase1/REQUIREMENT_BASELINE.csv:338"
      - "apps/web/src/app/(app)/virtual/page.tsx:13-15 queries every virtual_sessions row without a date filter."
      - "apps/web/src/app/(app)/virtual/page.tsx:19-21 keeps rows with a joined visit and factory but does not enforce confirmed/published status."
      - "apps/web/src/app/(app)/virtual/page.tsx:51-52 labels the surface 'confirmed sessions only'."
    required_correction:
      - "Add deterministic inclusion proof for a session within today's canonical window and with the required confirmed visit status."
      - "Add deterministic exclusion proof for non-today and non-confirmed sessions."
      - "Do not use a far-future fixture as positive CR-337 evidence."
      - "Classify the current unfiltered list behavior FAILS_UNTIL_FIX."
      - "Keep the product correction in a later independent session-list lease."
    completion_bar: >-
      The corrected lease cites exact fixture timestamps/statuses, exact list
      assertions, safe isolation and cleanup, and truthfully marks current
      behavior as failing until the separate list-filter implementation lands.

  - correction_id: 009-R02
    severity: P0
    subject: "C06 OTP authorization positive-control isolation"
    finding: >-
      Case 009-C06 proposes request and verify on the same reviewer participant
      while expecting sent and no_code. A successful request creates an active
      code, so verification with 000000 is wrong unless it accidentally matches.
      Reusing that participant for a later planner request also encounters the
      resend cooldown. The stated result is nondeterministic and internally
      inconsistent.
    source_evidence:
      - "supabase/migrations/0023_fix_otp_rpc_authorization.sql:20-56"
      - "supabase/migrations/0023_fix_otp_rpc_authorization.sql:58-95"
    required_correction:
      - "Retain an unassigned inspector as the denied persona for both RPCs."
      - "Give each reviewer and planner positive-control RPC its own fresh participant/session, or explicitly reset a sacrificial record between calls."
      - "State deterministic expected status and audit/database state for each isolated call."
      - "Prove denial causes no verification-record mutation and no OTP audit row."
    completion_bar: >-
      No case depends on an active code, cooldown or resend counter created by
      another persona/control leg.

  - correction_id: 009-R03
    severity: P0
    subject: "D-M11-001 characterization honesty and deterministic invariant"
    finding: >-
      Case 009-C12 manually stages an orphan virtual session. It does not force
      scheduleSession to create a session and then fail the participant insert,
      so it cannot be described as reproducing the partial-write path requested
      by packet 009. Its proposed assertion also allows either a working schedule
      path or a visibly flagged orphan, which is not one deterministic contract.
    source_evidence:
      - "apps/web/src/app/(app)/virtual/actions.ts:42-47 persists virtual_sessions."
      - "apps/web/src/app/(app)/virtual/actions.ts:50-55 inserts participants separately and returns without rollback on failure."
      - "apps/web/src/app/(app)/virtual/actions.ts:37-39 blocks retry when any session exists."
      - "No scheduling transaction RPC or rollback cleanup was found in the canonical migrations."
    required_correction:
      - "Rename manual orphan staging as downstream orphan-and-retry-guard characterization only."
      - "Choose one exact expected invariant and one exact assertion; remove the OR condition."
      - "Classify true participant-insert-failure reproduction as BLOCKED until a safe, rollback-only test fault seam is authorized."
      - "Do not mutate a shared live database or install a permanent test backdoor."
      - "A rollback-only temporary trigger or a test-local server seam may be proposed, but it must be separately authorized and removed automatically."
    completion_bar: >-
      The lease no longer claims that a manually inserted orphan proves the
      scheduleSession partial-write sequence, and every expected-failure case
      has one deterministic future contract.

  - correction_id: 009-R04
    severity: P0
    subject: "Atomicity fix authority and lease separation"
    finding: >-
      Case 009-C12 calls the fix shape a backend/product decision and presents
      compensating delete, transactional RPC and a state-filtered guard as
      equivalent candidates. They are not equivalent: compensating delete can
      fail, and a state-filtered guard does not make session-plus-participants
      creation atomic.
    required_correction:
      - "Remove the unresolved product-decision classification from the test lease."
      - "Record one transactional database RPC as the 010 implementation recommendation."
      - "Preserve RLS, role scope, unique visit guard and append-only audit behavior."
      - "Keep notification delivery post-commit and report degradation honestly."
      - "Reject compensating delete as the atomicity solution."
      - "Do not combine 010 with execution-window enforcement or list filtering."
    completion_bar: >-
      The corrected handoff treats 010 as a bounded transactional implementation
      lease and does not broaden it into other M11 defects.

