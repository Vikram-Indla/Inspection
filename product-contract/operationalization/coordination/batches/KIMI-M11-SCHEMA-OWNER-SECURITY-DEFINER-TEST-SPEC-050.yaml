      - id: M11-050-OWN-003
        identities: [FX-SEC-FUNCTION-OWNER, FX-SEC-SCHEMA-OWNER]
        action: "Inspect superuser, BYPASSRLS and login attributes."
        expected: "Exact accepted system-owner attributes; unresolved attributes BLOCKED_CATALOG."
