  - "No live catalog query, connection, role creation, grant, policy, function, trigger or extension operation."
  - "No owner role, schema, provider, extension namespace or privilege value is invented."
  - "All expected identities must come from accepted corrected manifests and isolated catalog evidence."
  - "No implementation or QA lease is issued and zero change is made to the 478-row completion count."
  - "Kimi output remains unaccepted until the locked Mac is unlocked and its response is captured and validated."

