        expected: CATALOG_EXACT
        evidence: [schema_owner_manifest, catalog_snapshot_hash]
      - id: M11-050-OWN-002
        fixtures: [FX-SEC-FINAL-TABLE-MANIFEST]
        action: "Compare virtual session, participant and audit table owners."
