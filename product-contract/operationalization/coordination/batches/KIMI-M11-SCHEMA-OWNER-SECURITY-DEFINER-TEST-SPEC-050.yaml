expected_result_vocabulary:
  CATALOG_EXACT: "Observed identity/owner/ACL/policy/dependency equals accepted manifest."
  ORDINARY_ALLOW: "Exact ordinary persona succeeds only through reviewed caller-facing path."
  DENY: "Privilege or operation denied without internal detail."
  NO_BYPASS: "SECURITY DEFINER enforces auth, persona, resource, state, window and immutability internally."
  NO_SHADOW: "Untrusted schema/object cannot alter dependency resolution."
  NO_ESCALATION: "No grant, membership, SET ROLE, owner or default-privilege path widens authority."
  ZERO_LEAK: "No owner, schema, policy, function, extension or raw SQL detail reaches client."
  BLOCKED_CATALOG: "Cannot pass until isolated catalog evidence and accepted manifest exist."

