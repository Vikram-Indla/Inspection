  - question_id: CCR-036B-Q08
    input_id: UAI-008
    subject: Attachment retention, orphan disposal, reference counting and access revocation
    affected_options: [D3-S2, D3-I2]
    authority_needed: [records_owner, legal_or_policy_owner, security_owner, storage_owner, compliance_business_owner]
    neutral_question: >-
      For content-addressed approved documents or quarantined intake, what
      retention, legal-hold, orphan, reference-count, disposal and access
      revocation policy preserves immutable approved-version custody?
    required_response_fields:
      - Record classes and retention basis; exact duration only from recorded authority.
      - Legal hold and investigation hold behavior.
      - Quarantine adoption deadline and orphan classification.
      - Who may view, adopt, supersede, revoke or dispose.
      - Reference-count semantics and last-reference behavior.
      - Whether bytes may ever be deleted while an approved/historical version references them.
      - Content-hash, object-path and replacement prohibition.
      - Access revocation without loss of authorized historical custody.
      - Disposal approval, evidence and immutable audit.
      - Storage region/provider constraint only if separately authorized.
    why_it_matters: >-
      Deduplicated or quarantined documents can become orphaned, overexposed or
      deleted while still referenced. The product requires durable hash,
      request/version linkage, access control and historical evidence.
    affected_requirements:
      - CR-449
      - CR-458
      - CR-463
      - REQ-R0C-01623
      - REQ-R0C-01903
      - REQ-R0C-01916
    affected_acceptance:
      - WA-AC-0449
      - WA-AC-0458
      - WA-AC-0463
      - WA-M6-AC-002
      - CMP-ACC-CCR-003
      - CMP-ACC-CCR-006
      - CMP-ACC-CCR-011
      - CMP-ACC-CCR-015..017
    safe_interim_boundary: >-
      Do not introduce content-addressed sharing or quarantine intake. Do not
      delete, move, replace or reclassify existing attachment objects or metadata.
    prohibited_assumptions:
      - A retention duration can be inferred from storage defaults or another module.
      - An unreferenced quarantine object may be silently deleted.
      - Same hash permits path reuse or byte replacement.
      - Revoking access permits destruction of historical custody.
      - Storage owner, region, legal hold or disposal authority is implicit.
    required_evidence:
      - Signed records-retention and attachment-custody policy.
      - Bucket/object/manifest/access inventory.
      - Reference and orphan lifecycle matrix.
      - Legal-hold, revoked-user, last-reference and disposal negative cases.
      - Immutable disposal/audit evidence contract.
      - Future SQL-B and storage-policy probe mapping.
    stop_condition: D3-S2, D3-I2 and related boundary B work remain BLOCKED.

  - question_id: CCR-036B-Q09
    input_id: UAI-009
    subject: CCR-to-Package field mapping and offline execution projection
    affected_options: [D4-S1, D4-S2, D4-S3, D4-E1, D4-E2, D4-E3]
    authority_needed: [product_owner, compliance_business_owner, package_owner, planning_owner, field_owner, data_architecture_owner]
    neutral_question: >-
      What exact, versioned mapping binds an approved CCR branch to an
      immutable Package version and complete online/offline execution
      projection, including provenance, ordering, dependencies and eligibility?
    required_response_fields:
      - Selected D4 storage and Scheduled-eligibility options.
      - CCR request, revision, component, publication and correlation identities.
      - Stable entity and exact version identities plus D1 schema identity and hashes.
      - Regulation, clause and legal-source fields.
      - Item text/guidance, response, visibility, evidence, scoring and exclusion fields.
      - Exact Violation, Penalty and Template version mappings.
      - Package section, order, report placement and usage information.
      - Null, unknown, unsupported and rejected-component behavior.
      - Transactional completeness and zero-partial-row validation.
      - Package effective/dependency-date and selectability rule.
      - Offline serialization/versioning, integrity verification and missing-snapshot behavior.
      - Planning, Field, reporting and enforcement consumer signoff.
    why_it_matters: >-
      Current Package snapshots lack complete CCR provenance. A floating active
      or latest lookup can change live/historical behavior after publication,
      while an incomplete offline projection can force Field to fall back to
      mutable legacy catalogues.
    affected_requirements:
      - CR-450
      - CR-451
      - CR-452
      - CR-458
      - CR-459
      - CR-460
      - CR-463
      - CR-478
      - REQ-R0C-01805
      - REQ-R0C-01868..01889
      - REQ-R0C-01894..01896
    affected_acceptance:
      - WA-AC-0450
      - WA-AC-0451
      - WA-AC-0452
      - WA-AC-0458
      - WA-AC-0459
      - WA-AC-0460
      - WA-AC-0463
      - WA-AC-0478
      - WA-M6-AC-001
      - WA-M6-AC-002
      - WA-M6-AC-005
      - CMP-ACC-CCR-015..018
      - CMP-ACC-CCR-021
    safe_interim_boundary: >-
      Do not connect CCR publication to Package or Field. Preserve current
      Package and runtime behavior unchanged, but do not award completion
      credit or allow fallback to serve as the future governed bridge.
    prohibited_assumptions:
      - Current Package snapshot shape is complete because it supports a happy path.
      - Runtime may resolve current, active or latest component values after Package publication.
      - Client-supplied snapshot JSON is authoritative.
      - Missing governed fields may be fetched from mutable legacy catalogues.
      - Scheduled components are eligible without signed cross-date rules.
      - Reference-only storage proves offline availability.
    required_evidence:
      - Signed, versioned CCR-to-Package mapping manifest.
      - Canonical valid and invalid Package projection fixtures.
      - Source-version/hash and projection-equivalence rules.
      - Planning, Field/offline, reporting and enforcement consumer approvals.
      - Atomicity, concurrency, maker-checker and bypass-negative test map.
      - Future SQL-C, browser-downstream, Evidence C/D/E and offline regression mapping.
    stop_condition: Boundaries C, D and E remain BLOCKED.

cross_question_dependencies:
  - Q01 must be answered before Q02 or Q09 can be accepted.
  - Q03 must be answered before Q04, Q05 or any D4 Scheduled-eligibility answer can be accepted.
  - Q05 and Q07 must be internally consistent with the D3-A1 or D3-A2 selection.
  - Q08 is mandatory when D3-S2 or D3-I2 is selected.
  - Q09 requires compatible, recorded D1 and D2 decisions.
  - No NOT_APPLICABLE response is valid without an explicit incompatible-option selection.
  - An answer set that violates any prohibition in packet 036A is returned.

response_record_template:
  response_status: UNANSWERED
  authority_name: REQUIRED
  authority_role: REQUIRED
  authority_basis: REQUIRED
  answered_on: REQUIRED
  response_version: REQUIRED
  question_id: REQUIRED
  direct_answers: REQUIRED
  attached_evidence: REQUIRED
  requirement_impact_confirmed: REQUIRED
  preservation_floor_confirmed: REQUIRED
  compatibility_confirmed: REQUIRED
  unresolved_points: MUST_BE_EMPTY_FOR_ACK
  signature_or_recorded_approval: REQUIRED
  rule: >-
    Completing this template records an authority response only. A separate
    independent receipt validation is required before any contract update or
    lease preflight.

gate_check:
  task_packet_result: PASS
  implementation_result: BLOCKED
  missing_evidence:
    - Nine signed authority responses with all required evidence.
    - Explicit selections for all nine choice sets in packet 035.
    - Complete field, lifecycle, attachment and Package mapping manifests.
    - Independent validation through dormant receipt packet 036.
  next_allowed_action: >-
    Present Q01 through Q09 to their recorded authorities. If no answers are
    available, continue only with the safe read-only successor. If complete
    answers arrive, validate rather than reinterpret them in packet 036.
  browser_readiness: NOT_READY_DECISION_ONLY
  p0_p1_truth: >-
    Operational projection, legacy bypass closure, Package/Field integration
    and complete evidence remain unresolved. This question pack removes no P0
    or P1 and receives no requirement credit.

global_stop_conditions:
  - Any question or response field is presented with a preferred or default answer.
  - A current database, provider, timezone, retention or route value is treated as authority.
  - A partial response advances to receipt validation or implementation.
  - NOT_APPLICABLE is used without a signed incompatible-option selection.
  - A response weakens the preservation floor or omits negative/historical cases.
  - A question response is treated as a lease, migration, data write, provider approval, merge or release.
  - Product, test, design, database, data, branch, stash, main or setup is modified.

rollback:
  this_packet: Remove only this packet if returned; no product, test, design, database, data, branch or remote state changed.
  authority_response: >-
    An unimplemented response may be superseded only through recorded change
    control. Implemented or published history is forward-only and may never be
    deleted, reset or rewritten.

safe_successor:
  packet_id: CODEX-ADMIN-COMPLIANCE-REQUESTS-AUTHORITY-RESPONSE-SCHEMA-036C
  mode: READ_ONLY_CONTROL_PLANE
  start_condition: No signed authority response is available.
  scope: >-
    Prepare a machine-checkable response schema for Q01 through Q09, including
    completeness, authority, compatibility, evidence and rejection rules.
    Preserve all questions unanswered and all options unselected. Do not
    validate a real answer, grant a lease, implement or modify any product,
    test, design, database, data, branch, stash, main or setup state.
  safe_because: >-
    It shortens later independent receipt validation without guessing a
    business answer or overlapping implementation ownership.

