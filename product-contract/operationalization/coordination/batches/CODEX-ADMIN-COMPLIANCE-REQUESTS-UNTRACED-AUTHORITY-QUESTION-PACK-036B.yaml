authority_rules:
  response_owner: >-
    Sponsor or explicitly recorded product, legal, security, records,
    database and operational authority appropriate to each question.
  neutrality:
    - Questions are ordered by UAI-001 through UAI-009, not priority or preference.
    - Listed response fields define completeness; they do not suggest a value.
    - Conditional questions may be answered NOT_APPLICABLE only when the incompatible option is explicitly selected in a signed decision receipt.
    - A current implementation detail, demo value, locale, server setting or provider capability is evidence, never policy authority.
  valid_response_floor:
    - authority name, role and authority basis
    - decision date and version
    - direct answer to every required response field
    - requirement and acceptance IDs preserved
    - required evidence attached and internally consistent
    - compatibility with every selected option and the preservation floor
    - explicit treatment of all negative, failure and historical cases
  invalid_response_conditions:
    - incomplete, conditional or internally inconsistent response
    - answer supplied only through chat implication or implementation convenience
    - missing authority basis or evidence
    - response that weakens maker-checker, RLS, audit, immutability, history or runtime locking
    - response treated as implementation, DDL, data, provider, merge or release authority

preservation_floor:
  - All Regulation, Item, Violation and Penalty create or modify operations remain CCR-governed.
  - Current approved truth remains operational until an approved successor is effective.
  - Future-effective content remains unavailable before its effective boundary.
  - Rejected, invalid or incomplete branches never publish.
  - Historical Inspection, Enforcement, Package and attachment references never repoint.
  - Published versions and Package projections are immutable and auditable.
  - Package publication is maker-checker, transactional and concurrency-safe.
  - Field and offline execution use only a pinned immutable Package version.
  - Database privileges, RLS, storage policies and RPC guards enforce the boundary.
  - No service-role client or client-supplied snapshot becomes business authority.

