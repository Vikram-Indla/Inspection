authority_questions:
  - question_id: CCR-036B-Q01
    input_id: UAI-001
    subject: Per-kind field, type, nullability and additional-property manifest
    affected_options: [D1-O1, D1-O2, D1-O3]
    authority_needed: [product_owner, compliance_business_owner, data_architecture_owner]
    neutral_question: >-
      For Regulation, Inspection Item, Violation and Penalty, what is the
      authoritative field manifest that every approved immutable version must
      contain, regardless of which D1 representation is selected?
    required_response_fields:
      - For every field: canonical name, business definition and owning entity kind.
      - Data type, format, units, enum or vocabulary authority.
      - Required versus optional, nullable versus non-null and allowed default behavior.
      - Creation, modification and publication validation rules.
      - Stable identity, version, predecessor and parent/child cardinality.
      - Bilingual value behavior and whether Arabic/English are both required.
      - Unknown/additional-property behavior.
      - Write authority and immutable-after-publication rule.
      - Library, Package, Planning, Field, audit and reporting projection needs.
      - Attachment, clause, Template and dependency references by exact version.
    why_it_matters: >-
      The current CCR engine stores generic JSON. Without a signed per-kind
      contract, malformed or incomplete content can appear valid and different
      consumers can interpret the same version differently.
    affected_requirements:
      - CR-449
      - CR-450
      - CR-451
      - CR-452
      - CR-458
      - CR-460
      - REQ-R0C-01803
      - REQ-R0C-01868..01872
      - REQ-R0C-01894..01896
    affected_acceptance:
      - WA-AC-0449
      - WA-AC-0450
      - WA-AC-0451
      - WA-AC-0452
      - WA-AC-0458
      - WA-AC-0460
      - WA-M6-AC-001
      - WA-M6-AC-002
      - CMP-ACC-CCR-003
      - CMP-ACC-CCR-004
      - CMP-ACC-CCR-016
    safe_interim_boundary: >-
      Keep generic CCR snapshots non-operational. Do not create a new
      projection or migration, and do not repoint Library, Package, Planning
      or Field consumers. Existing approved operational truth remains unchanged.
    prohibited_assumptions:
      - Current JSON examples, route forms or database columns define the complete contract.
      - Missing fields are nullable or may receive inferred defaults.
      - One generic shape is sufficient for all four entity kinds.
      - Unknown properties are accepted because a consumer currently ignores them.
      - Package or Field may interpret an undeclared field.
    required_evidence:
      - Signed, versioned field manifest covering all four kinds.
      - Source citation for every business field and validation rule.
      - Valid and invalid canonical examples for each kind.
      - Parent-child and one-Penalty-per-Violation cardinality matrix.
      - Product and data-architecture approval with no unresolved field.
      - Future SQL-A and browser-projection case mapping.
    stop_condition: D1 and boundary A remain BLOCKED until the manifest is complete and signed.

  - question_id: CCR-036B-Q02
    input_id: UAI-002
    subject: Schema format, owner and backward-compatibility policy
    affected_options: [D1-O2, D1-O3]
    authority_needed: [product_owner, data_architecture_owner, database_security_owner]
    neutral_question: >-
      If a schema-validated document representation is selected, what schema
      standard, immutable schema identity, ownership and compatibility policy
      govern current and historical entity documents?
    required_response_fields:
      - Schema language/format and supported version.
      - Registry location, owner and change-control authority.
      - Immutable schema identifier retained on every entity version.
      - Required, nullable and additional-property behavior.
      - Backward, forward and breaking-change classification.
      - Migration or projection treatment for old schema versions.
      - Historical schema availability and retention.
      - Database validation boundary versus application validation.
      - Query projection contract for Library, Package and audit.
      - NOT_APPLICABLE rationale if a fully relational option is authoritatively selected.
    why_it_matters: >-
      A document is typed only if validation is deterministic and its historical
      schema remains available. Unversioned or application-only validation
      permits malformed publication and makes old versions uninterpretable.
    affected_requirements:
      - CR-458
      - CR-460
      - CR-463
      - REQ-R0C-01868..01872
      - REQ-R0C-01894..01896
    affected_acceptance:
      - WA-AC-0458
      - WA-AC-0460
      - WA-AC-0463
      - WA-M6-AC-002
      - CMP-ACC-CCR-003
      - CMP-ACC-CCR-006
      - CMP-ACC-CCR-016
    safe_interim_boundary: >-
      Do not claim typed documents or add schema-backed publication. Preserve
      existing data unchanged and keep document-backed D1 choices blocked.
    prohibited_assumptions:
      - JSONB storage itself is schema validation.
      - Latest schema may reinterpret or replace an older published schema.
      - Application validation alone protects direct Data API or RPC paths.
      - Additional properties are allowed by default.
      - A library choice or schema registry exists because a package is installed.
    required_evidence:
      - Signed schema-governance contract and named owner.
      - Immutable registry/versioning and compatibility matrix.
      - Examples proving missing, wrong-type, unknown and incompatible fields fail.
      - Historical-schema retrieval and projection evidence plan.
      - Security review of exposed validation objects, grants and RLS.
      - Future SQL-A negative-case mapping.
    stop_condition: D1-O2 and D1-O3 remain BLOCKED until the schema contract is explicit.

  - question_id: CCR-036B-Q03
    input_id: UAI-003
    subject: Release/effective timezone, boundary and trusted clock
    affected_options: [D2-T1, D2-T2, D2-A1, D2-A2, D2-A3]
    authority_needed: [product_owner, compliance_business_owner, legal_or_policy_owner, database_owner]
    neutral_question: >-
      What exact time contract governs Release and Effective values: date-only
      or exact instant, which authoritative timezone and clock apply, and what
      inclusive before/at/after boundary determines Scheduled versus Active?
    required_response_fields:
      - Explicit D2-T1 or D2-T2 selection in the signed decision receipt.
      - Database data type and canonical stored representation.
      - IANA timezone when local business meaning applies.
      - Inclusive/exclusive start and end semantics.
      - Trusted clock and handling of clock disagreement.
      - Approval time versus future effective time distinction.
      - Display, edit, export and audit representation in English and Arabic.
      - Treatment of invalid, past, changed and conflicting effective values.
      - Exact before-boundary, at-boundary and after-boundary examples.
      - Package dependency-date comparison rule.
    why_it_matters: >-
      The product contract requires future-effective content to remain
      unavailable until its effective boundary while the prior version stays
      active. An unspecified timezone or hidden instant can activate content
      early, late or differently across consumers.
    affected_requirements:
      - CR-449
      - CR-458
      - CR-459
      - REQ-R0C-01627
      - REQ-R0C-01638
      - REQ-R0C-01879..01883
      - REQ-R0C-01900
      - REQ-R0C-01906
      - REQ-R0C-01915
      - REQ-R0C-01919
    affected_acceptance:
      - WA-AC-0449
      - WA-AC-0458
      - WA-AC-0459
      - WA-M6-AC-001
      - WA-M6-AC-002
      - CMP-ACC-CCR-001
      - CMP-ACC-CCR-016..018
    safe_interim_boundary: >-
      Do not implement automatic activation. Future-effective CCR publication
      must not change operational heads; the current approved version remains
      active. No timezone or browser/server clock is treated as authority.
    prohibited_assumptions:
      - Asia/Riyadh, UTC, server locale or browser locale is the business timezone without approval.
      - Approval timestamp equals Release or Effective time.
      - Midnight is inclusive without an explicit rule.
      - Date-only UI may hide a stored exact instant.
      - Client time determines operational availability.
    required_evidence:
      - Signed time contract with authority basis.
      - Before/at/after examples for each entity and Package dependency.
      - Data type, timezone conversion and display specification.
      - Audit-event timestamp semantics.
      - Future SQL-A boundary/concurrency cases and browser-projection locale cases.
    stop_condition: All activation and time-basis choices remain BLOCKED.

  - question_id: CCR-036B-Q04
    input_id: UAI-004
    subject: Scheduler, queue or runtime provider and operating ownership
    affected_options: [D2-A2, D2-A3]
    authority_needed: [platform_owner, database_owner, operations_owner, security_owner]
    neutral_question: >-
      If persisted database scheduling or a managed worker is selected, which
      approved runtime executes activation and who owns deployment, permission,
      monitoring, retry, idempotency and degraded-state response?
    required_response_fields:
      - Explicit D2-A2 or D2-A3 selection, or NOT_APPLICABLE if D2-A1 is selected.
      - Runtime/provider identity and approved environment.
      - Deployment and operational owner.
      - Authentication, database role and least-privilege boundary.
      - Schedule/queue trigger contract and trusted clock dependency.
      - Idempotency key and duplicate-execution behavior.
      - Stale-head/concurrency locking behavior.
      - Retry, backoff, terminal failure and recovery procedure.
      - Monitoring, alert ownership and degraded UI/API truth.
      - Availability objective only if separately authorized.
    why_it_matters: >-
      Automatic activation is a required business outcome, but an unowned
      scheduler can fail silently, duplicate transitions or remove the prior
      Active version. Provider existence and service-role access cannot be
      inferred.
    affected_requirements:
      - CR-459
      - CR-463
      - REQ-R0C-01881
    affected_acceptance:
      - WA-AC-0459
      - WA-AC-0463
      - WA-M6-AC-001
      - WA-M6-AC-002
      - WA-M6-AC-005
      - CMP-ACC-CCR-011
      - CMP-ACC-CCR-016..018
    safe_interim_boundary: >-
      No background or persisted transition is added. Prior Active truth stays
      intact and provider/runtime unavailability remains fail-closed and visible.
    prohibited_assumptions:
      - Supabase Cron, a queue, Edge Functions or an application worker is approved and configured.
      - A service-role client is acceptable for convenience.
      - Retry is safe without an idempotency and stale-head contract.
      - Monitoring or on-call ownership exists implicitly.
      - Provider delay may expose a future version early.
    required_evidence:
      - Recorded provider/runtime approval and named owners.
      - Architecture and least-privilege permission contract.
      - Failure, retry, duplicate and stale-head matrix.
      - Monitoring/degraded-state runbook.
      - Future SQL-A idempotency and failure probes plus browser degraded-state cases.
    stop_condition: D2-A2 and D2-A3 remain BLOCKED; no provider lease exists.

  - question_id: CCR-036B-Q05
    input_id: UAI-005
    subject: Standalone deactivation distinct from successor activation
    affected_options: [D2-A1, D2-A2, D2-A3, D3-A1, D3-A2]
    authority_needed: [product_owner, compliance_business_owner, legal_or_policy_owner, security_owner]
    neutral_question: >-
      What is the governed standalone deactivation policy for an approved
      version when no successor is becoming effective, including roles,
      maker-checker, timing, dependency effects, reactivation and historical use?
    required_response_fields:
      - Entity kinds eligible for standalone deactivation.
      - Whether deactivation must use a CCR or may use a signed lifecycle-only exception.
      - Initiator, reviewer and publisher roles.
      - Required reason, evidence and legal/policy authority.
      - Immediate versus scheduled effective behavior and time contract.
      - Effect on children, Packages, future Planning and active visits.
      - Historical Inspection and Enforcement preservation.
      - Reactivation versus new-version requirements.
      - Emergency path, if any, with exact authority and controls.
      - Audit events, notifications, rollback and concurrency behavior.
    why_it_matters: >-
      Deactivation prevents future use but must not masquerade as successor
      replacement, edit immutable content or rewrite historical executions.
      Its role and dependency behavior are not defined by implementation detail.
    affected_requirements:
      - CR-449
      - CR-459
      - CR-463
      - REQ-R0C-01815
    affected_acceptance:
      - WA-AC-0449
      - WA-AC-0459
      - WA-AC-0463
      - WA-M6-AC-002
      - CMP-ACC-CCR-008..011
    safe_interim_boundary: >-
      Add no standalone deactivation path to the future CCR projection and do
      not widen any current route, RPC or privilege. Existing business data and
      historical references remain unchanged.
    prohibited_assumptions:
      - Deactivation may edit title, legal content, relationships, rules or attachments.
      - Deactivation cascades to children or Packages automatically.
      - Immediate means approval time or server time without the Q03 contract.
      - Historical or active visits may be repointed.
      - An emergency bypass exists without separately recorded authority.
    required_evidence:
      - Signed lifecycle transition table and role matrix.
      - Dependency impact matrix for Library, Package, Planning and Field.
      - Historical-preservation and reactivation rules.
      - Audit/notification event contract.
      - Future SQL-A/SQL-B positive, unauthorized, stale and negative cases.
    stop_condition: Standalone deactivation remains unavailable in the new engine.

  - question_id: CCR-036B-Q06
    input_id: UAI-006
    subject: Ambiguous or unreconstructible legacy lineage disposition
    affected_options: [D2-B1, D2-B2, D2-B3]
