    affected_requirements:
      - CR-458
      - CR-463
      - CR-478
      - REQ-R0C-01655
      - REQ-R0C-01673
      - REQ-R0C-01726
      - REQ-R0C-01785
      - REQ-R0C-01923
      - REQ-R0C-02210
    affected_acceptance:
      - WA-AC-0458
      - WA-AC-0463
      - WA-AC-0478
      - WA-M6-AC-002
      - WA-M6-AC-005
      - CMP-ACC-CCR-018
      - CMP-ACC-CCR-020
      - CMP-ACC-CCR-021
    safe_interim_boundary: >-
      Perform no backfill, head switch, data correction or historical repoint.
