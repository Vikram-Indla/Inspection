configuration_writers:
  - writer_id: GIS_WRITER_RADIUS
    route: /admin/gis
    sources:
      - apps/web/src/app/(app)/admin/gis/actions.ts
      - apps/web/src/app/(app)/admin/gis/GisStudio.tsx
    target: factories.geofence_radius_m
    authorization:
      action: authenticated user only
      database: gis_admin or planner
    concurrency: No expected value, version, or CAS.
    audit: Generic factories trigger; no reason or GIS policy version.
    verdict: UNSAFE_P0
  - writer_id: GIS_WRITER_SHARED_ENGINE
    route: /admin/execution
    sources:
      - apps/web/src/app/admin/execution/page.tsx
      - apps/web/src/app/admin/execution/GisRulesForm.tsx
      - apps/web/src/app/admin/execution/actions.ts
    target: engine_settings row where engine equals gis
    governed_keys:
      - arrival_detection_radius_m
      - geofence_default_radius_m
      - gps_accuracy_checkin_max_m
      - telemetry_interval_s
    authorization:
      capability: admin.execution_workflow
      default_roles:
        - compliance_admin
        - form_admin
        - workflow_admin
        - risk_owner
        - gis_admin
        - security_admin
      database: engine_write also permits multiple Admin roles.
    concurrency: Read-modify-write has no expected updated_at or version_label filter.
    audit:
      generic_trigger: present
      explicit_insert: present
      defect: Explicit audit failure is logged but the action still returns success.
      requirement_refs: EXE-ADMIN only, not the exact GIS requirements.
    cache_refresh: Revalidates /admin/execution only; /admin/gis and consumers are not invalidated.
    verdict: P0_DUPLICATE_GIS_AUTHORITY_AND_STALE_WRITE_PATH
  - writer_id: GIS_WRITER_SPATIAL_LAYER
    route: /admin/gis/spatial
    sources:
      - apps/web/src/app/(app)/admin/gis/spatial/actions.ts
    target: gis_layers
    authorization:
      action: authenticated user plus feature flag
      database:
        - gis_admin
        - security_admin
        - compliance_admin
    concurrency: Unique layer_key only; no governed version or update CAS.
    audit: No table trigger found.
    verdict: HELD_AND_UNAUDITED

policy_consumers:
  - consumer_id: ADMIN_GIS_DISPLAY
    route: /admin/gis
    source: apps/web/src/app/(app)/admin/gis/page.tsx
    reads:
      - full engine_settings.gis settings
      - version_label
    uses:
      - all six displayed GIS settings
      - geofence default in radius editor
    fallback: Literal 150 metres in GisStudio when default is absent.
    issue: Missing policy and approved policy are not reliably distinguishable.
  - consumer_id: ADMIN_EXECUTION_EDITOR
    route: /admin/execution
    source: apps/web/src/app/admin/execution/page.tsx
    reads:
      - full engine_settings.gis settings
      - version_label
      - updated_at
    uses:
      - four editable GIS rule fields
      - full raw JSON display for users with any execution Admin capability
    issue: A second configuration authority exists outside SCR-ADM-070 and DEC-002 remains open.
  - consumer_id: FIELD_STARTUP
    route: /field/[visitId]
    sources:
      - apps/web/src/app/(app)/field/[visitId]/page.tsx
      - apps/web/src/app/(app)/field/[visitId]/Startup.tsx
    reads:
      - gps_accuracy_checkin_max_m
      - geofence_default_radius_m
      - telemetry_interval_s
      - route_deviation
      - factory geofence override
    fallback_values:
      gps_accuracy_checkin_max_m: 25
      geofence_default_radius_m: 150
      telemetry_interval_s: 30
      route_deviation_off_route_m: 500
      route_deviation_sustain_s: 120
    issue: Client legacy and telemetry writes stamp a hard-coded gis_version rather than the loaded engine version.
    risk: P0
  - consumer_id: FIELD_TRAVEL
    route: /field/[visitId]/travel
    sources:
      - apps/web/src/app/(app)/field/[visitId]/travel/page.tsx
      - apps/web/src/app/(app)/field/[visitId]/travel/TravelClient.tsx
    reads:
      - geofence_default_radius_m
      - factory geofence override
    fallback: Literal 150 metres.
    map: Shared GeoMap plus Mapbox Directions API.
    risk: P0
  - consumer_id: OPERATIONS_CENTER
    route: /operations
    sources:
      - apps/web/src/app/(app)/operations/page.tsx
      - apps/web/src/app/(app)/operations/OpsMap.tsx
    reads:
      - geofence_default_radius_m
      - factory overrides and coordinates
      - geo_event geofence results
    fallback: No radius ring when neither override nor engine default is numeric.
    map: Shared GeoMap, factory/visit pins, region posture.
    risk: P0
  - consumer_id: DATABASE_CONFIRM_ARRIVAL
    source: supabase/migrations/20260721140000_execution_journey_cancellation.sql
    reads:
      - gps_accuracy_checkin_max_m
      - engine version_label
      - factory radius then engine default
    behavior:
      - Server-side accuracy and geofence enforcement.
      - Stamps resolved GIS version on canonical inside arrival.
    strength: Most authoritative current consumer.
    issue: Coexists with client legacy writes and hard-coded versions.
    risk: PROTECTED_P0_BEHAVIOR
  - consumer_id: PURE_SPATIAL_LIBRARY
    source: apps/web/src/lib/gis/spatial.ts
    reads: Policy is passed as an argument.
    production_callers: 0
    test_callers:
      - apps/web/e2e/mvp2-m2-06-spatial.spec.ts
    issue: Pure checks and visibility helper do not govern production routes.
  - consumer_id: PLANNING_FACTORY_RESOLVER
    source: apps/web/src/lib/planning/factory-resolver.ts
    reads:
      - official coordinates
      - per-factory radius
    policy_default: Not read here.
    purpose: Carries GIS facts into Planning candidate resolution.
  - consumer_id: FACTORY_360
    route: /factories/[id]
    sources:
      - apps/web/src/app/(app)/factories/[id]/page.tsx
      - apps/web/src/app/(app)/factories/[id]/FactorySpatialMap.tsx
    reads:
      - official coordinates
      - per-factory radius
      - location events and GIS version
    issue: Null radius is described as engine default but the route does not load or display the actual current default value.
  - consumer_id: VISIT_DETAIL_AUDIT
    route: /visits/[id]
    source: apps/web/src/app/(app)/visits/[id]/page.tsx
    reads:
      - geo result
      - accuracy
      - GIS version
    strength: Exposes event lineage.
    issue: Hard-coded client versions can be displayed as though they were resolved policy lineage.

