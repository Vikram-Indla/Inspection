  WA_M10_AC_004_RTL_responsive_a11y:
    blocked_by:
      - missing Arabic parity
      - click-only list rows
      - no reduced motion
      - small-width overflow risk
  WA_M10_AC_005_regression:
    blocked_by:
      - shared GeoMap has many cross-channel consumers
      - engine_settings.gis has server and client consumers
