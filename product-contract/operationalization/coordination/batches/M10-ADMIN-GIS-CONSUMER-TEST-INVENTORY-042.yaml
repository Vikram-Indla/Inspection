  WA_M10_AC_006_evidence:
    blocked_by:
      - no isolated fixture manifest
      - no Admin GIS browser pack
      - no accepted design successor
      - provider and decision holds
  SPC_GIS:
    blocked:
      - SPC-GIS-001 keyboard-accessible synchronized selection
      - SPC-GIS-002 official versus observed and freshness truth across consumers
      - SPC-GIS-003 override reason/evidence/permission/audit end to end
      - SPC-GIS-004 deterministic provider failure and recovery
      - SPC-GIS-005 governed offline map state
      - SPC-GIS-006 privacy, tracking, freshness, and retention visibility
      - SPC-GIS-007 non-color equivalence and reduced motion
      - SPC-GIS-008 legal-boundary truth

exact_blockers:
  - id: GISINV-P0-01
    blocker: Two separate Admin routes govern GIS values under different persona/capability models.
  - id: GISINV-P0-02
    blocker: Both shared-engine and factory-radius writers lack CAS; last writer wins.
  - id: GISINV-P0-03
    blocker: Field client writes a hard-coded GIS version while the server resolves the current version dynamically.
  - id: GISINV-P0-04
    blocker: DEC-002 is open but both Admin and Field paths carry literal numeric fallbacks.
  - id: GISINV-P0-05
