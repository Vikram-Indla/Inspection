missing_negative_paths:
  authorization:
    - unauthorized direct GET to /admin/gis
    - unauthorized direct GET to /admin/gis/spatial
    - unauthorized direct GET to /admin/execution GIS section
    - Planner radius mutation when Planner authority is not approved
    - unrelated Admin saveGisRules mutation
    - full engine settings and precise factory coordinate disclosure
  configuration:
    - missing engine_settings.gis row
    - missing individual DEC-002 keys
    - malformed, nonnumeric, zero, negative, or extreme stored values
    - stale concurrent update on factory radius
    - stale concurrent update on engine_settings.gis
    - explicit audit insert failure after engine update
    - route refresh and open-consumer behavior after config change
  lineage:
    - active version changes while Field has a queued offline geo event
    - hard-coded client GIS version differs from server-resolved version
    - visit audit displays the incorrect policy version
  map_and_provider:
    - missing browser token
    - invalid or expired token
    - unauthorized style
    - tile/network timeout
    - partial tile failure
    - retry and recovery
    - provider failure while list and radius form stay usable
    - Directions 401, 403, 429, timeout, malformed payload, and no route
    - unauthorized persona calling arbitrary ETA coordinates
  spatial:
    - unauthorized precise visibility
    - duplicate layer key conflict
    - spatial audit absence
    - missing feature flag with direct action invocation
    - unowned factory_locations mutation
  accessibility_and_locale:
    - keyboard selection parity between marker and list
    - screen-reader selection announcement
    - reduced-motion map focus
    - popup contrast in light and dark
    - AR labels and RTL at every map/list state
    - 320, 390 or 412 width without overflow

