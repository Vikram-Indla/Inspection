runtime_capability_matrix:
  - capability: List workflow versions
    runtime: IMPLEMENTED
    evidence: page.tsx reads engine=workflow config_versions and displays state graph, validation and approval chain.
  - capability: Clone published version to draft
    runtime: IMPLEMENTED
    evidence: ProposeDraftForm calls proposeWorkflowDraft.
  - capability: Edit draft definition
    runtime: PARTIAL
    evidence: Raw JSON editor exists; graphical add/connect/guard/SLA/notification builders do not.
  - capability: Validate before publish
    runtime: IMPLEMENTED_PURE_AND_SERVER_GATE
    evidence: validateWorkflowPayload VAL-01..06 is shown and called again by approvePublishWorkflow.
  - capability: Distinct checker publish
    runtime: PARTIAL
    evidence: UI suppresses self-approval and maker_checker checks approved_by differs from created_by.
  - capability: Optimistic concurrency
    runtime: NOT_WIRED
    evidence: >-
      saveWorkflowDraft optionally compares row_version, but page.tsx does not
      select row_version and DraftPayloadEditor does not submit it. Normal UI
      edits therefore update by id/status only and can silently overwrite.
  - capability: Review and Approved lifecycle stages
    runtime: NOT_EXPOSED
    evidence: UI/actions use draft directly to published although MVP2-REQ-0026 names Draft→Review→Approved→Published.
  - capability: Scheduled activation
    runtime: NOT_WIRED
    evidence: approve action accepts scheduled_from but ApprovePublish renders no schedule field; effective_from is always set to now.
  - capability: Retire
    runtime: SERVER_ONLY_UNREACHABLE
    evidence: retireWorkflowVersion exists but no page control calls it.
  - capability: Roll back
    runtime: SERVER_ONLY_UNREACHABLE
    evidence: rollbackWorkflowToVersion exists but no page control calls it and no rolled_back lifecycle result is written.
  - capability: Persisted simulation and replay
    runtime: BLOCKED_EXPLICITLY
    evidence: NotYetBoundary states sim_fixtures and sim_runs are absent.
  - capability: Governed operational transition
    runtime: DARK_AND_INCOMPLETE
    evidence: applyGovernedTransition is feature-flagged off and does not patch the operational object's canonical status.
  - capability: Tasks and SLA operations
    runtime: SEPARATE_OR_DARK
    evidence: Task actions are used by /tasks; SLA actions have no Workflow Library UI and no scheduler/automatic breach execution.

permission_and_governance_findings:
  - id: WF-P0-001
    priority: P0
    finding: Route has no Workflow Admin authorization boundary.
    evidence: >-
      The authenticated layout redirects only field-only personas. page.tsx
      performs no role check. config_versions SELECT permits every authenticated
      user, while navigation merely hides the link from non-workflow admins.
    implication: A deep link exposes every workflow definition and approval-chain identity to any authenticated non-field user.
  - id: WF-P0-002
    priority: P0
    finding: Workflow writes are not engine-scoped to Workflow Admin.
    evidence: >-
      config_write/config_update allow compliance_admin, form_admin, workflow_admin,
      risk_owner, gis_admin and security_admin across the shared config_versions
      table. The policies do not bind engine to the caller's capability.
    implication: Non-workflow administrative roles can insert or update engine=workflow rows through REST or these actions.
  - id: WF-P0-003
    priority: P0
    finding: Published workflow immutability is not database-enforced.
    evidence: >-
      There is no DELETE policy, but config_update permits updates to all matching
      config_versions rows and no published-row mutation trigger was found.
      Server-action status filters protect only those application paths.
    implication: A permitted REST caller can mutate an in-flight published workflow, violating MVP2-REQ-0250.
  - id: WF-P0-004
    priority: P0
    finding: Stale-edit rejection is inactive on the rendered edit path.
    evidence: row_version is neither selected by page.tsx nor posted by DraftPayloadEditor.
    implication: Concurrent draft edits can silently overwrite each other.
  - id: WF-P0-005
    priority: P0
    finding: Maker-checker is identity-distinct but not capability-distinct.
    evidence: >-
      The database check only requires approved_by <> created_by. It does not
      prove the approver holds the governed publish capability for engine=workflow.
    implication: Separation of identity exists, but authorization and approval-stage semantics remain incomplete.
  - id: WF-P0-006
    priority: P0
    finding: Published version selection and activation semantics are not proven end to end.
    evidence: >-
      A uniqueness index includes coalesce(scheduled_from,effective_from), which
      permits multiple published rows at different timestamps. The reviewed
      route does not prove consumers select the correct effective workflow or
      pin in-flight objects to their original version.
    implication: Publishing can succeed without proof that future and in-flight records use the correct immutable version.
  - id: WF-P1-001
    priority: P1
    finding: Retire, rollback and schedule actions exist only in server code.
    implication: The advertised governance lifecycle cannot be completed from the application.
  - id: WF-P1-002
    priority: P1
    finding: Audit writes in task, SLA and transition actions do not fail the business action when audit append fails.
    implication: Successful state mutation can lack required audit proof.
  - id: WF-P1-003
    priority: P1
    finding: The catalogue route /admin/workflows/:id is not implemented.
    implication: SCR-ADM-051 is folded into an unbounded inline raw-JSON editor rather than a routed governed designer.

