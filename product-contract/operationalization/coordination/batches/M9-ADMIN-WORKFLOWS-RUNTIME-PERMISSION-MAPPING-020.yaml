p0_prerequisites:
  - Add a fail-closed Workflow Admin route boundary and negative deep-link evidence.
  - Replace shared broad config_versions writes with engine-scoped authorization.
  - Enforce published workflow immutability at the database boundary.
  - Wire row_version load/post and prove stale update rejection.
  - Govern checker capability and the required review/approval/publish stages.
  - Prove effective-version selection and in-flight workflow version pinning.
  - Resolve design authority for Workflow Library versus Workflow Designer before UI restructuring.

p1_prerequisites:
  - Wire scheduled activation, retire and rollback or mark them unavailable with bounded prerequisites.
  - Make audit persistence failure-safe for state-changing actions.
  - Add focused browser, RLS, concurrency, lifecycle, localization, responsive and accessibility tests.
  - Reconcile /admin/workflows/:id catalogue intent with the accepted design and route contract.

