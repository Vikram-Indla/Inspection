    pass:
      - "Mac manually unlocked."
      - "Existing Kimi conversation confirmed."
      - "All source SHA-256 fingerprints still match."
      - "Kimi acknowledges chat-only/no-write mode."
  gate_2_response_shape:
    pass:
      - "Every required delimiter appears exactly once and in order."
      - "Each enclosed packet and the manifest parse as YAML."
      - "Packet IDs are unchanged."
      - "No diff-only or truncated payload."
  gate_3_security_and_authority:
    pass:
      - "Every 026 finding and condition is mapped."
      - "No missing authority/provider/owner/lease is invented."
      - "013→015 OTP authorization/locking and no-traffic successor are exact."
      - "All 16 collision stops are acknowledged."
  gate_4_materialization:
    pass:
