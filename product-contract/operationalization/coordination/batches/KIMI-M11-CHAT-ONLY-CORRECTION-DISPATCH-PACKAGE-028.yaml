sequential_ownership_order:
  correction_phase:
    rule: "The six packet payloads may be reasoned about together, but each remains a separately delimited full replacement."
    order:
      - "017 first defines cross-cutting owner, dependency, rollout and collision standards consumed by all function packets."
      - "010 defines atomic authorized creation."
      - "011 consumes 010 and defines the creation successor, window guard, reschedule and waiting."
      - "014 consumes 011 and defines atomic join/begin."
      - "015 expansion defines safe audit projection/trigger before OTP use."
      - "013 expansion defines close/verified; its contract then defines initial locked/no-secret OTP and policy/ACL contraction."
      - "015 contract is the immediate no-traffic successor to 013 for the exact OTP signatures, raw audit and generic append contraction."
  application_files:
    virtual_actions: "010 then 011."
    virtual_detail_actions: "011 then 014 then one bounded 013/015 application-switch integrator."
    virtual_room: "011 then 014 then one bounded 013/015 application-switch integrator."
    virtual_page: "011 only."
    global_audit_consumers: "Unassigned until exact inventory and file ownership exist."
  migration_rule: >-
    No filename is allocated in a correction payload. A future integration
    owner allocates one monotonic filename immediately before each exact lease,
    after recording predecessor commit and migration-chain checksum.

collision_stops:
  - "01: Stop if a fresh active lease overlaps a proposed application or Supabase path."
  - "02: Stop if Kimi attempts repository writes under its current read-only canonical-repository row."
  - "03: Stop if a source packet is not corrected, materialized and accepted by review 025."
  - "04: Stop if corrected 009r lacks acceptance or a single QA owner."
  - "05: Stop if a predecessor application-file lease is not reviewed and released."
  - "06: Stop if two workers propose the same migration filename, function signature, policy, trigger or application file."
  - "07: Stop if 013 and 015 edit OTP signatures concurrently or traffic occurs between their contract migrations."
  - "08: Stop if the 015 safe participant audit trigger/projection is not installed before OTP is exercised."
  - "09: Stop if direct DML or generic append authority is contracted before the governed application switch."
  - "10: Stop if M11 traffic is not quiesced and drained before the 013 then 015 contract."
  - "11: Stop if any global audit consumer or exact file ownership remains unidentified."
  - "12: Stop if function owner, SECURITY DEFINER model, extension schema, role grant or dependency remains unresolved."
  - "13: Stop if Planner or Operations authority is inferred rather than cited."
  - "14: Stop if an unavailable OTP provider is described as delivered or complete."
  - "15: Stop if CR-337 or DEC-005 enters the M11 stack."
  - "16: Stop if review 025 is invoked before all actual corrected inputs exist."

response_protocol:
  requirements:
    - "Return every delimiter exactly once and in the declared order."
    - "Inside each packet delimiter, return one complete parseable YAML document, not a diff or commentary."
    - "Preserve the packet_id; set a correction-return status that does not claim implementation."
    - "Incorporate every required section, finding, condition, acceptance gate and stop condition assigned by 026."
    - "Do not silently resolve missing authority, provider, owner or lease values."
    - "After the six packets, return the response manifest and closure matrix."
  delimiters:
    packet_010:
      begin: "<<<BEGIN_CORRECTED_YAML:KIMI-M11-ATOMIC-FIX-LEASE-010>>>"
      end: "<<<END_CORRECTED_YAML:KIMI-M11-ATOMIC-FIX-LEASE-010>>>"
    packet_011:
      begin: "<<<BEGIN_CORRECTED_YAML:KIMI-M11-EXECUTION-WINDOW-LEASE-011>>>"
      end: "<<<END_CORRECTED_YAML:KIMI-M11-EXECUTION-WINDOW-LEASE-011>>>"
    packet_014:
      begin: "<<<BEGIN_CORRECTED_YAML:KIMI-M11-BEGIN-ATOMICITY-LEASE-014>>>"
      end: "<<<END_CORRECTED_YAML:KIMI-M11-BEGIN-ATOMICITY-LEASE-014>>>"
    packet_013:
      begin: "<<<BEGIN_CORRECTED_YAML:KIMI-M11-PERMISSION-HARDENING-LEASE-013>>>"
      end: "<<<END_CORRECTED_YAML:KIMI-M11-PERMISSION-HARDENING-LEASE-013>>>"
    packet_015:
      begin: "<<<BEGIN_CORRECTED_YAML:KIMI-M11-AUDIT-BOUNDARY-LEASE-015>>>"
      end: "<<<END_CORRECTED_YAML:KIMI-M11-AUDIT-BOUNDARY-LEASE-015>>>"
    packet_017:
      begin: "<<<BEGIN_CORRECTED_YAML:KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017>>>"
      end: "<<<END_CORRECTED_YAML:KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017>>>"
    manifest:
      begin: "<<<BEGIN_RESPONSE_MANIFEST:KIMI-M11-CORRECTION-RETURN>>>"
      end: "<<<END_RESPONSE_MANIFEST:KIMI-M11-CORRECTION-RETURN>>>"

six_payload_requests:
  KIMI-M11-ATOMIC-FIX-LEASE-010:
    request:
      - "Return a complete corrected 010 YAML payload."
      - "Add final function security/owner/ACL/dependency contract, atomic creation authorization, neutral resource boundary and exact evidence contract."
      - "Resolve 024-X01 and consume every 026 cross-cutting security condition."
      - "Keep Planner scheduling blocked unless RBAC-007 authority is exact; keep Operations blocked unless exact authority is cited."
      - "Mark the future lease PROPOSED_NOT_ISSUED."
  KIMI-M11-EXECUTION-WINDOW-LEASE-011:
    request:
      - "Return a complete corrected 011 YAML payload."
      - "Define the private shared window guard and governed creation successor, reschedule and waiting-room-open contracts."
      - "Preserve inclusive stored appointment/live database-time semantics and 010 atomicity."
      - "Resolve 024-X02 and consume every 026 cross-cutting security condition."
      - "Record that shared files begin only after 010 acceptance/release."
  KIMI-M11-BEGIN-ATOMICITY-LEASE-014:
    request:
      - "Return a complete corrected 014 YAML payload."
      - "Define assigned-Inspector-only atomic join/begin using the 011 guard and canonical transition."
      - "Declare neutral authorization boundary, deterministic visit→session→participants UUID→inspection locking and final-stack privilege behavior."
      - "Resolve 024-X03 and consume every 026 cross-cutting security condition."
      - "Record that detail files begin only after 011 acceptance/release."
  KIMI-M11-PERMISSION-HARDENING-LEASE-013:
    request:
      - "Return a complete corrected 013 YAML payload."
      - "Separate expansion close/verified RPCs from contract policy/ACL and initial locked/no-secret OTP definitions."
      - "Provide exact persona, owner/ACL/dependency, RLS policy, table grant, index and provider-blocker manifests."
      - "Resolve its MIGSEC/addendum/024-X04 ownership and all 026 cross-cutting conditions."
      - "Record exact no-traffic release of OTP signatures to the 015 successor."
  KIMI-M11-AUDIT-BOUNDARY-LEASE-015:
    request:
      - "Return a complete corrected 015 YAML payload."
      - "Separate expansion safe projection/participant trigger from contract raw-audit/generic-append/OTP-successor contraction."
      - "Preserve 013 OTP authorization and row locking while adding neutral errors and no-secret output."
      - "Inventory global audit consumers and block unknown file ownership."
      - "Resolve its MIGSEC/addendum/024-X05 ownership and all 026 cross-cutting conditions."
  KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017:
    request:
      - "Return a complete corrected 017 YAML payload."
      - "Define global function security, persona authority, deterministic locking, exact sequential ownership, expand/switch/quiesce/013→015 contract rollout and roll-forward-only recovery."
      - "Provide complete proposed owner/lease/dependency/policy/trigger/application/QA manifests, all marked NOT_ISSUED."
      - "Resolve its MIGSEC/addendum/024-X06 ownership and incorporate all 16 collision stops."
      - "Keep CR-337 and DEC-005 isolated."

response_manifest_schema:
  required_top_level_fields:
    - response_id
    - prepared_by
    - prepared_on
    - source_fingerprints_acknowledged
    - repository_write_attempted
    - packet_results
    - closure_matrix
    - unresolved_blockers
    - collision_stop_acknowledgements
    - self_validation
  required_values:
    repository_write_attempted: false
    implementation_claimed: false
    lease_issued_or_claimed: false
    review_025_run: false
  packet_result_fields:
    - packet_id
    - delimiter_present
    - yaml_self_parse
    - assigned_findings_addressed
    - proposed_future_lease_status
    - unresolved_blockers
  closure_matrix_columns:
    - finding_or_condition_id
    - primary_owner_packet
    - consumer_packets
    - corrected_section
    - authority_evidence
    - proposed_future_lease
    - acceptance_gate
    - blocker_or_stop_condition
    - closure_status
  allowed_closure_statuses:
    - CLOSED_IN_CORRECTED_PACKET
    - BLOCKED_ON_AUTHORITY
    - BLOCKED_ON_PROVIDER
    - BLOCKED_ON_OWNER
    - BLOCKED_ON_LEASE

exact_future_chat_message: |-
  SAQEEL OS v2 — KIMI M11 CHAT-ONLY SOURCE CORRECTION RETURN

  You are operating in READ-ONLY / CHAT-RETURN mode. Do not write, create,
  rename, delete, stage or commit any repository file. Do not create or switch
  branches/worktrees. Do not issue or claim leases. Do not modify product code,
  application code, database, remote DDL, tests, migrations, data, UI or seeds.
  Do not push, merge, deploy, modify main or setup/Inspection, or touch stashes.
  Do not run review 025 and do not claim implementation, testing or requirement
  completion.

  Authority: load and obey 022, 024, 026, 027 and the source fingerprints in
  dispatch package 028. If any supplied fingerprint differs, stop and report
  SOURCE_FINGERPRINT_MISMATCH. Keep unresolved authority, provider, owner and
  lease values BLOCKED; never invent them.

  Return six COMPLETE parseable YAML replacements, not diffs or commentary,
  inside these exact delimiters and in this order:

  <<<BEGIN_CORRECTED_YAML:KIMI-M11-ATOMIC-FIX-LEASE-010>>>
  [complete corrected 010 YAML]
  <<<END_CORRECTED_YAML:KIMI-M11-ATOMIC-FIX-LEASE-010>>>

  <<<BEGIN_CORRECTED_YAML:KIMI-M11-EXECUTION-WINDOW-LEASE-011>>>
  [complete corrected 011 YAML]
  <<<END_CORRECTED_YAML:KIMI-M11-EXECUTION-WINDOW-LEASE-011>>>

  <<<BEGIN_CORRECTED_YAML:KIMI-M11-BEGIN-ATOMICITY-LEASE-014>>>
  [complete corrected 014 YAML]
  <<<END_CORRECTED_YAML:KIMI-M11-BEGIN-ATOMICITY-LEASE-014>>>

  <<<BEGIN_CORRECTED_YAML:KIMI-M11-PERMISSION-HARDENING-LEASE-013>>>
  [complete corrected 013 YAML]
  <<<END_CORRECTED_YAML:KIMI-M11-PERMISSION-HARDENING-LEASE-013>>>

  <<<BEGIN_CORRECTED_YAML:KIMI-M11-AUDIT-BOUNDARY-LEASE-015>>>
  [complete corrected 015 YAML]
  <<<END_CORRECTED_YAML:KIMI-M11-AUDIT-BOUNDARY-LEASE-015>>>

  <<<BEGIN_CORRECTED_YAML:KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017>>>
  [complete corrected 017 YAML]
  <<<END_CORRECTED_YAML:KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017>>>

  Then return one parseable YAML response manifest containing the acknowledged
  source hashes, repository_write_attempted=false, results for all six packets,
  the complete closure matrix required by 026, every unresolved blocker, all
  16 collision-stop acknowledgements, and self-validation:

  <<<BEGIN_RESPONSE_MANIFEST:KIMI-M11-CORRECTION-RETURN>>>
  [complete response manifest YAML]
  <<<END_RESPONSE_MANIFEST:KIMI-M11-CORRECTION-RETURN>>>

  Required correction details for each packet are defined under
  six_payload_requests in package 028. Preserve this sequence:
  010 creation → 011 creation successor/window/reschedule/waiting → 014
  join/begin → 015 safe audit expansion → 013 close/verified expansion and
  contract → immediate no-traffic 015 OTP/audit/event successor. Application
  files remain sequential; no migration filename is allocated. Observe all
  16 collision stops from package 028.

  Finish after the response manifest. Wait for Codex validation and authorized
  materialization. A chat return is not implementation and does not authorize
  review 025.

codex_validation_and_materialization_gates:
