      - "No product/application/Supabase/test/migration file changes."
      - "Post-write hashes and YAML validation are recorded."
  gate_5_independent_review:
    precondition: "All six actual corrected packet files and manifests exist."
    action: "Only then dispatch KIMI-M11-POST-RETURN-INDEPENDENT-REVIEW-025."
    prohibited_before_precondition: true

