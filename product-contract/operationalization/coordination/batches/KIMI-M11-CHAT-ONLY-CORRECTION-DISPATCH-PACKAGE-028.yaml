purpose: >-
  Provide the exact copy-safe, chat-only correction brief for the existing
  Kimi session after manual unlock. Kimi returns six separately delimited full
  YAML payloads and one response manifest without writing any repository file.

authority:
  correction_authority: KIMI-M11-CONSOLIDATED-SECURITY-CORRECTION-022
  readiness_review: KIMI-M11-CORRECTION-READINESS-REVIEW-024
  source_blueprint: KIMI-M11-SOURCE-PACKET-CORRECTION-BLUEPRINT-026
  collision_preflight: KIMI-M11-OWNERSHIP-COLLISION-PREFLIGHT-027
  future_review: KIMI-M11-POST-RETURN-INDEPENDENT-REVIEW-025

dispatch_guard:
  manually_unlocked: false
  existing_kimi_conversation_confirmed: false
  dispatched: false
  blocked_by:
    - MANUAL_MAC_UNLOCK
    - EXISTING_KIMI_CONVERSATION_CONFIRMATION
  rule: "Do not open, focus, type into or dispatch to Kimi while the Mac is locked."

hard_boundary:
  response_channel: CHAT_ONLY
  kimi_may:
    - "Read the supplied authority and source packet text."
    - "Return six complete corrected YAML payloads in the exact delimiters below."
    - "Return one response manifest and one closure matrix in chat."
    - "Mark unresolved authority, provider, owner or lease values BLOCKED."
  kimi_must_not:
    - "Write, create, rename, move, delete, stage or commit any repository file."
    - "Create or switch a branch or worktree."
    - "Issue, claim, transfer or imply any lease."
    - "Modify product, application, database, remote DDL, tests, migrations, data, UI or seeds."
    - "Push, merge, deploy, modify main or setup/Inspection, or touch stashes."
    - "Run review 025 or claim any requirement, test or implementation completion."
  completion_effect: "Zero change to the 478-row completion count."

