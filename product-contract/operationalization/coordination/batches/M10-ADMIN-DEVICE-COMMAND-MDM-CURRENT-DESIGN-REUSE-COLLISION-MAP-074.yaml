shell_i18n_responsive_accessibility_boundaries:
  shell:
    reusable:
      - sidebar grouping and active-item hierarchy
      - sticky page header and content panel rhythm
    collisions:
      - Arabic wordmark appears in English profile
      - WA-DES-015 fixed 256px and WA-DES-041 fixed 248px sidebars
      - shared shell is outside a route-local Devices design/implementation lease
    future_boundary: One shared-shell owner; route design consumes rather than forks it.
  i18n:
    reusable:
      - WA-DES-041 Device verified-empty English/Arabic copy
      - dir/lang switching concept
    collisions:
      - lifecycle/provider/package/sync terminology has no reviewed Arabic authority
      - machine identifiers and dates lack demonstrated bidi/locale handling
      - control scaffold remains partly English
    future_boundary: Arabic reviewer and localization authority before design acceptance; route UI cannot self-translate.
  responsive:
    reusable:
      - table-wrap suggests bounded overflow as a primitive
      - auto-fit fact/grid patterns exist elsewhere in WA-DES-015
    collisions:
      - no Devices-specific 1024, 412/390 or 320 state
      - fixed rails and six-column table have no demonstrated reflow
      - no 200 percent zoom or virtual-keyboard layout
    future_boundary: New route-specific responsive design; shared shell breakpoint remains shared-owner authority.
  accessibility:
    reusable:
      - role=status, aria-busy and aria-pressed examples
      - scoped headings/table row-header patterns
    collisions:
      - no destructive confirmation, eligibility reason, focus recovery or modal semantics
      - no device-to-command/evidence accessible relationship
      - no forced-colors, reduced-motion, screen-reader or touch verification
    future_boundary: Route-specific interaction specification plus independent accessibility review.

reuse_constraints:
  - Reuse never imports illustrative values.
  - A supporting foundation may be referenced but not registered as the route design.
  - Any adapted component receives a new route-level accepted revision, not silent mutation of unrelated states.
  - Shell/i18n/shared token changes are isolated from route-specific design and implementation.
  - Provider-held designs show blocked dependency, not simulated lifecycle.
  - Existing online/offline labels are rejected until source/formula/threshold authority exists.
  - Existing Arabic wordmark defect must not be copied into the English route.
  - No slot becomes consumable until its null bindings in 073 are populated through governance.

