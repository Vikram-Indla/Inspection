bounded_change_boundaries_after_authority:
  - boundary_id: DEV-PKG-BND-01
    owner_domain: governance
    need: Approve roles, transitions, invalidation scope, cached-data effect, offline replay/submit behavior and rescue semantics.
  - boundary_id: DEV-PKG-BND-02
    owner_domain: database
    need: Versioned/idempotent command lifecycle, provider/device receipts and atomic device/package guards.
  - boundary_id: DEV-PKG-BND-03
    owner_domain: package_compiler
    need: Establish one canonical relationship between readiness snapshot and device-governed manifest.
  - boundary_id: DEV-PKG-BND-04
    owner_domain: Field
    need: Consume the authorized manifest envelope at download/open and persist its identity/hash with the cache.
  - boundary_id: DEV-PKG-BND-05
    owner_domain: offline_engine
    need: Fail closed at replay/submit after governed device/package change while preserving recoverable local work.
  - boundary_id: DEV-PKG-BND-06
    owner_domain: provider_adapter
    need: Authenticated command dispatch and receipt ingestion without treating request as effect.
  - boundary_id: DEV-PKG-BND-07
    owner_domain: Admin
    need: Source-backed command, package effect, sync health and rescue views.
  - boundary_id: DEV-PKG-BND-08
    owner_domain: QA
    need: Cross-device/offline negative paths proving no unauthorized open, replay, submit, duplicate effect or data loss.

disposition:
  result: BLOCK_PACKAGE_OFFLINE_WIRING_PENDING_CONTRACT
  material_conclusion: >-
    Existing readiness freezing and offline replay are useful foundations, but
    they are not currently governed by Trusted Devices. Expire Packages,
    Suspend and Remote Wipe do not reach Field cache, replay or submission.
    No design or implementation may claim end-to-end device/package control.
  sponsor_decisions_needed:
    - package invalidation scope and effect on cached/in-progress work
    - replay and submission behavior after trust or package-state changes
    - remote wipe, suspend and revoke local-data semantics
    - provider/receipt and retry authority
    - rescue ownership for held recoverable work

