required_prerequisites:
  P0:
    - Remove direct status/publication/deletion bypass; all lifecycle transitions must use governed RPCs.
    - Require approved_by=auth.uid and a distinct maker inside a non-bypassable publish boundary.
    - Make every published/locked/deactivated authority field immutable except explicit governed transition fields.
    - Move complete dependency and snapshot validation into the database publish transaction.
    - Enforce effective windows in Field selection, save, readiness and every other future-use consumer.
    - Decide pinned-work semantics for manual/scheduled deactivation and preserve prior active inspections.
    - Add governed package identity creation with validation, permissions, audit and version-zero/draft behavior.
    - Add database negative tests for direct REST/RPC bypass, delete, forged approval and future/historical selection.
  P1:
    - Add CAS/revision protection and recoverable conflict UI for draft JSON edits.
    - Render published preview from exact frozen snapshots; distinguish draft projection.
    - Extend impact analysis across visit_packages, deactivated history and future work.
    - Add package identity audit trigger and immutable identity/version relationship.
    - Scope package/snapshot reads by admin function, Planning eligibility or assigned execution need.
    - Filter /planning package catalog by governed effective eligibility.
    - Add real browser maker/checker, denial, validation, conflict and runtime-pinning evidence.

bounded_implementation_boundary:
  lease_1_database:
    - package/package_versions RLS and lifecycle guards
    - atomic create/publish/deactivate RPCs
    - complete dependency validation
    - audit and CAS fields
  lease_2_consumers:
    - Planning and Field effective-version resolver
    - readiness and visit-package binding
    - impact RPC multiple-package coverage
  lease_3_application:
    - accepted Design 049 package library/designer
    - package identity creation
    - governed draft/publish/deactivate controls
    - exact frozen preview and conflict handling
  lease_4_quality:
    - isolated package/version/item/template/visit fixtures
    - database bypass and concurrency probes
    - browser maker/checker and cross-module runtime evidence
  prohibited:
    - changing existing published definitions
    - repointing active/previous inspections to a successor version
    - inventing template, evidence, legal or penalty policy
    - modifying Design 049 or peer-leased files
    - claiming completion from static source assertions or banners

