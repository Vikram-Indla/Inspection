package_and_version_authorities:
  package_identity:
    table: public.packages
    fields: [id, code, title, scope]
    route_capability: READ_EXISTING_ONLY
    create_action: ABSENT
  version:
    table: public.package_versions
    identity: unique(package_id, version_label)
    statuses: [draft, published, locked, deactivated]
    lineage: supersedes_id
    effective_window: [effective_from, effective_to]
    active_open_invariant: unique package_id where status in published/locked and effective_to is null
  publish:
    RPC: public.publish_package_version(uuid, jsonb)
    behavior:
      - locks the target draft
      - rejects self-approval and missing effective_from
      - locks and closes the current open governed version
      - links supersedes_id
      - atomically freezes definition, publishes, records approver and published_at
    app_prevalidation: validateDefinition plus freezeDefinition
    database_validation: validate_m09_package_definition trigger
  frozen_runtime:
    embedded:
      - definition.item_snapshot
      - definition.violation_snapshot
      - definition.template_snapshot
    companion:
      - package_version_item_snapshots
      - package_version_dependency_snapshots
    visit_binding:
      - visits.package_version_id
      - visit_packages append-only links and metadata snapshots
      - visit_preparations.package_version_id
      - visit_package_snapshots immutable resolved definition and checksum
      - inspections.package_version_id
  audit:
    package_versions: trg_audit_package_versions
    package_shell: NO_AUDIT_TRIGGER_FOUND

runtime_consumers:
  administration:
    - /admin
    - /admin/packages
    - /admin/items/:id/runtime-preview
  planning:
    - /planning
    - /planning/bulk and review
    - /planning/single
    - /planning/immediate
    - /visits/:id repackage
  execution:
    - /field/:visitId preparation and package download
    - /field/inspection/:id workspace runtime
    - readiness RPCs and visit_package_snapshots
  reporting_and_history:
    - /visits/:id
    - inspection reports
    - Factory 360 and compliance history
  consumer_rule: >-
    Planning creation paths generally apply status plus effective-window
    filters and pin exact version IDs. Field preparation resolves the pinned
    definition into an immutable visit snapshot, but its package chooser and
    database readiness validators check status only.

findings:
  - id: PKG-P0-001
    priority: P0
    finding: Direct permitted table updates bypass the publish RPC and maker-checker identity.
    evidence: >-
      package_versions_admin is a FOR ALL policy for compliance_admin/form_admin.
      guard_publish_requires_approver requires only a non-null approved_by, and
      pkg_maker_checker requires only approved_by<>created_by; neither requires
      approved_by=auth.uid(). A writer can set another user's UUID and change a
      valid draft directly to published.
    implication: Approval provenance can be forged and application dependency/freeze orchestration bypassed.
  - id: PKG-P0-002
    priority: P0
    finding: Published package versions are not fully immutable.
    evidence: >-
      guard_published_package blocks changes only to definition and
      version_label and is UPDATE-only. Direct writers can change status,
      package_id, effective dates, creator/approver, published_at or lineage;
      can revert published→draft and then edit; and can delete an unreferenced
      published version because RLS grants ALL and no delete guard exists.
    implication: Historical execution authority and audit provenance can be rewritten or removed.
  - id: PKG-P0-003
    priority: P0
    finding: Full dependency validation is not a single database authority.
    evidence: >-
      Application validateDefinition checks effective regulation, item,
      response, violation, penalty, evidence, template and action-form
      dependencies. The database trigger validates core item/snapshot,
      conditional, evidence and scoring shape but does not reproduce all
      template, action-form, violation, penalty and effective-date checks.
      publish_package_version accepts caller-supplied p_definition.
    implication: A direct authorized RPC caller can publish a package the page would block.
  - id: PKG-P0-004
    priority: P0
    finding: Field preparation ignores package effective windows.
    evidence: >-
      Field package options query status=published without effective_from/to.
      save_visit_preparation and confirm_visit_ready validate status=published
      but do not validate the effective interval.
    implication: An inspector can select a future package or a historical superseded package for new execution, violating future-only activation and runtime locking rules.
  - id: PKG-P0-005
    priority: P0
    finding: Manual deactivation conflicts with effective dating and pinned work.
    evidence: >-
      deactivatePackageVersion immediately changes status to deactivated even
      when effective_to is future. Readiness accepts only status=published, so
      a previously planned but not-yet-ready visit pinned to that version can
      be blocked despite the contract that historical/previous work is preserved.
    implication: Scheduled deactivation is immediate, and active work can regress.
  - id: PKG-P0-006
    priority: P0
    finding: The route cannot create the required report package identity.
    evidence: >-
      UI/actions create draft versions only for existing packages. No
      createPackage action or packages insert exists outside seed/scaffold migrations.
    implication: REQ-R0C-01125/CR-454 cannot be completed for a new business package through the product.
  - id: PKG-P1-001
    priority: P1
    finding: Draft editing has no optimistic concurrency control.
    evidence: saveDraftDefinition updates by id and status=draft only; no expected revision or updated_at predicate exists.
    implication: Concurrent editors silently overwrite the full JSON definition.
  - id: PKG-P1-002
    priority: P1
    finding: The Admin preview is not the exact frozen inspector runtime for published versions.
    evidence: >-
      page.tsx builds previewItems from the live inspection_items catalogue and
      applies definition.item_rules overrides rather than resolving the
      published definition.item_snapshot/companion snapshots used by Field.
    implication: A historical package preview can differ from what an inspector actually executed.
  - id: PKG-P1-003
    priority: P1
    finding: Impact analysis is incomplete for multiple-package and deactivated-version work.
    evidence: >-
      package_version_impact counts visits.package_version_id only, not
      visit_packages secondary links, and its prior set excludes deactivated
      versions. It returns active prior work, not all future executions affected.
    implication: The checker may approve with an understated blast radius.
  - id: PKG-P1-004
    priority: P1
    finding: Package shell changes lack audit coverage.
    evidence: audit triggers cover package_versions and other configuration tables, but no trg_audit_packages was found.
    implication: Future package identity create/update/delete cannot satisfy CR-463 audit evidence.
  - id: PKG-P1-005
    priority: P1
    finding: Package and frozen dependency reads are globally authenticated.
    evidence: packages, package_versions and snapshot read policies use auth.uid() is not null.
    implication: Any authenticated persona can inspect every package definition and dependency snapshot regardless of assignment or admin scope.
  - id: PKG-P1-006
    priority: P1
    finding: Planning's package filter catalog includes every version status and date.
    evidence: /planning loads package_versions without status/effective filters for its filter dropdown and preview effectivePackage label.
    implication: Draft, deactivated, future and historical versions are presented as if they were usable catalog entries.

