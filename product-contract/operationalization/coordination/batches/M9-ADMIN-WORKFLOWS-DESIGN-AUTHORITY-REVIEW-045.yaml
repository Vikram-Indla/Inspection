permissions_maker_checker_version_audit:
  permissions:
    navigation_role: workflow_admin
    exact_route_role_guard: ABSENT
    config_versions_read: all authenticated
    config_writer_roles:
      - compliance_admin
      - form_admin
      - workflow_admin
      - risk_owner
      - gis_admin
      - security_admin
    UI_role_gating: ABSENT
    verdict: INCONSISTENT
    required_decision: workflow_admin-only or governed broader config-writer model
  maker_checker:
    UI_hides_publish_from_maker: true
    constraint: approved_by may be null or must differ from created_by
    weakness: Published status does not itself require approved_by.
    bypass: Generic RLS update can bypass server-action-only publish checks.
    verdict: PARTIAL_AND_BYPASSABLE
  versioning:
    row_version_column: PRESENT
    bump_trigger: PRESENT
    page_reads_row_version: false
    editor_submits_row_version: false
    compare_and_set: CONDITIONAL_ONLY
    stale_overwrite_protection: NOT_WIRED_END_TO_END
    published_immutability_guard: NOT_FOUND
    scheduled_activation: CONTRACT_INCONSISTENT
    reason: Future scheduled_from is accepted while status becomes published and effective_from becomes now.
  audit:
    runtime_transition_events: PRESENT_IN_ADJACENT_ENGINE
    config_version_create_save_publish_retire_rollback_events: NOT_PROVEN
    config_versions_generic_audit_trigger: NOT_FOUND
    verdict: FAIL_FOR_WORKFLOW_DEFINITION_LIFECYCLE

workflow_transition_and_simulation_review:
