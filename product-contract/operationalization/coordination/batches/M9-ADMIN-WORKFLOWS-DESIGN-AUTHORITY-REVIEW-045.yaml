  required_negative_paths:
    - unreachable or orphan state
    - unauthorized transition
    - ambiguous transition
    - circular terminal path
    - missing actor or guard
    - non-idempotent side effect
  governed_runtime_transition:
    feature_flag: FEATURE_WORKFLOW_TRANSITION
    default: off
    direct_status_bypass: false
  simulation:
    pure_evaluator: PRESENT
    deterministic_fixture_store: ABSENT
    persisted_runs: ABSENT
    replay_history: ABSENT
    MVP2_REQ_0249_status: NEEDS_REVIEW
  in_flight_versioning:
