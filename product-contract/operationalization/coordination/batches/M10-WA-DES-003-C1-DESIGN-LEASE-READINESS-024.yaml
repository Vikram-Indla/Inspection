responsive_matrix:
  required_viewports:
    - id: DESKTOP_1440
      viewport: 1440x900
      expectation: Persistent shell; readable one- or two-column section grid; no horizontal page scroll.
    - id: TABLET_LANDSCAPE
      viewport: 1024x768
      expectation: Compact shell; controls and action feedback remain complete and unclipped.
    - id: TABLET_PORTRAIT
      viewport: 768x1024
      expectation: Logical card reflow; no hidden labels, values, actions, or validation summary.
    - id: MOBILE_412
      viewport: 412x915
      expectation: Single column; full-width controls; no peeking submenu icons.
    - id: MOBILE_390
      viewport: 390x844
      expectation: Same information and action parity as desktop.
    - id: MINIMUM_REFLOW
      viewport: 320x568
      expectation: No two-dimensional page scroll, clipping, overlap, or inaccessible action.
  tables_and_reason_rows: Reflow to labelled cards or a named scroll region; never clip columns.
  raw_json: Wrap safely and remain keyboard operable at every width.

theme_matrix:
  modes: [dark, light]
  evidence_required_for_each:
    - body, heading, caption, placeholder, and disabled text contrast
    - borders, focus, surface hierarchy, and status contrast
    - error, warning, success, informational, and unavailable states
    - shell brand and icons
  failure_rule: >-
    A dark-only frame, color inversion, washed-out map/control surface, or
    unreadable disabled/placeholder text is a P1 return.

language_and_bidi_matrix:
  modes:
    - locale: en
      direction: ltr
    - locale: ar
      direction: rtl
  requirements:
    - Use logical layout and spacing properties.
    - Mirror navigation and directional layout where semantic.
    - Keep stable keys, engine names, hashes, versions, units, and identifiers isolated LTR.
    - Preserve bilingual reason labels without reversing their internal text.
    - Do not place Arabic-only branding inside the English identity line.
    - Localize action, status, help, validation, no-access, unavailable, and recovery copy.
  release_boundary: Qualified native-Arabic review remains required before acceptance.

accessibility_contract:
  structure:
    - Exactly one h1 with ordered section headings.
    - Every form control has a programmatic label, hint, error, and required-state association.
    - Each section action has a unique accessible name and bounded result region.
  keyboard:
    - Logical tab and reading order in LTR and RTL.
    - Visible single focus treatment in both themes.
    - 44px minimum interactive targets.
    - Keyboard-operable reason reordering with announced result.
    - Raw JSON disclosure exposes expanded state and returns focus predictably.
    - Validation focuses the section summary or first invalid field without losing input.
  perception:
    - Status is never conveyed by color alone.
    - Icons supplement rather than replace text.
    - Error and unavailable states identify the affected section.
  reflow_and_zoom:
    - Prove 200 percent zoom.
    - Prove 400 percent or 320 CSS-pixel equivalent reflow.
    - No clipped content or two-dimensional page scrolling.

action_feedback_contract:
  saving: Disable only the submitted section action and announce "Saving".
  success: >-
    Name the exact saved section and display the returned/current version only
    when it is returned. Do not use an unsupported "effective immediately" claim.
  validation_error: Preserve values, show field errors and a section summary, and move focus predictably.
  authorization_error: Neutral denial with no values or policy internals leaked.
  service_error: Neutral recoverable message; keep the draft and do not expose provider internals.
  stale_or_conflict: Block silent overwrite in the design and label runtime support as pending implementation proof.

acceptance_evidence_plan:
  design_evidence:
    - Corrected editable design export with stable filename and SHA-256 fingerprint.
    - Component disposition and annotation sheet for every preserved component and server action.
    - State inventory proving every required route, action, and invariant state.
    - Side-by-side predecessor versus corrected decision record.
    - Design-to-code delta stating existing behavior, missing behavior, and prohibited backend expansion.
  visual_evidence:
    - EN/LTR and AR/RTL at every required viewport.
    - Dark and light themes at desktop, tablet, mobile, and minimum reflow.
    - Populated, partially configured, empty, unauthorized, degraded, validation, failure, and stale/conflict frames.
    - Keyboard focus sequence and reason-reorder interaction evidence.
    - Light-mode contrast and focus evidence.
  later_runtime_evidence_not_granted_by_this_packet:
    - Authorized read/save proof for each of six sections against governed test data.
    - Partial-capability and zero-capability confidentiality proof.
    - Direct server-action denial and RLS-denial data-unchanged proof.
    - Protected-key, duplicate-key, bilingual-label, and self-assessment rejection proof.
    - Missing-row and one-row-failure isolation proof.
    - Offline clear-to-platform-default proof.
    - Before/after, actor, version, and audit proof.
    - Two-editor stale-write proof or explicit blocked-gap record.
    - Browser accessibility, RTL, theme, zoom, reflow, and regression proof.

