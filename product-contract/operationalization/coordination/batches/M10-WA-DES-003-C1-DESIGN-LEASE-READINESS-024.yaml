functional_preservation_contract:
  capabilities:
    - admin.execution_workflow
    - admin.execution_lookups
    - admin.mode_eligibility
    - admin.evidence_policy
    - admin.offline_policy
  visibility:
    - Render each section only after its server-side capability check passes.
    - With zero capabilities, show one confidentiality-preserving no-access state and no values.
  writes:
    - saveDailyCapacity
    - saveVisitModes
    - saveReasons
    - saveGisRules
    - saveEvidencePolicy
    - saveOfflinePolicy
  controls:
    - Verify the user before every server action.
    - Check the relevant capability RPC before every write.
    - Preserve engine_write RLS as authoritative.
    - Merge only the governed keys owned by the submitted section.
    - Bump version_label and record updated_by on success.
    - Append execution_config_update audit evidence with before and after governed keys.
  invariants:
    - Self-assessment remains disabled for Release 1.
    - Protected reason keys remain visible and non-removable.
    - Shared GIS defaults remain distinct from per-factory /admin/gis overrides.
    - Missing values remain unset or unavailable, never zero or assumed.
    - Stored engine rows remain read-only advanced disclosure.
    - No maker-checker flow is introduced.

