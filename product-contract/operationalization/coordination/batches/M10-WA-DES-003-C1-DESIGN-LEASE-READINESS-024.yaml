p0_return_gates:
  - id: P0-IDENTITY
    return_if: Design identity, route, predecessor lineage, or filename differs from this packet.
  - id: P0-AUTHORITY
    return_if: Any section is visible or writable without its real capability boundary, or zero-capability state leaks values.
  - id: P0-POLICY
    return_if: Any capacity, geofence, GPS, telemetry, evidence, retention, retry, autosave, SLA, provider, or version value is invented.
  - id: P0-WRITE
    return_if: Design removes governed-key merge, version bump, audit, RLS, validation, or server action boundaries.
  - id: P0-SAFETY
    return_if: Self-assessment can be enabled, protected keys can be removed, or missing evidence types appear permitted.
  - id: P0-STATE
    return_if: Unauthorized, validation, write failure, partial-engine failure, or stale/conflict states are absent or falsely shown as implemented.
  - id: P0-SCOPE
    return_if: Design adds maker-checker, new backend objects, a provider, another route, per-factory GIS editing, or Compliance item-rule editing.
  - id: P0-TRACEABILITY
    return_if: The screen claims ownership of all 478 requirements or invents a screen ID.

p1_return_gates:
  - id: P1-RESPONSIVE
    return_if: Any required viewport clips, overlaps, horizontally scrolls the page, hides an action, or exposes peeking submenu icons.
  - id: P1-RTL
    return_if: Arabic is untranslated, directionally broken, or reverses stable LTR identifiers.
  - id: P1-THEME
    return_if: Light or dark mode has unreadable text, controls, focus, status, border, placeholder, or disabled states.
  - id: P1-A11Y
    return_if: Heading, label, hint, error, focus, target-size, status, or keyboard-reorder semantics are missing.
  - id: P1-FEEDBACK
    return_if: Success does not name the section and returned version truth, or failure loses entered data.
  - id: P1-EVIDENCE
    return_if: Export fingerprint, state index, visual matrix, annotations, limitations, or predecessor comparison is missing.
  - id: P1-QUALITY
    return_if: The design is a generic card checklist, introduces more than one unjustified signature pattern, or does not explain superiority over the predecessor.

review_sequence:
  - step: 1
    owner: sponsor
    action: Approve or decline the bounded WA-DES-003-C1 correction lease.
  - step: 2
    owner: orchestrator
    action: Record one named design writer and confirm no collision.
  - step: 3
    owner: Claude Design writer
    action: Produce the corrected design and all design evidence without application changes.
  - step: 4
    owner: Codex independent reviewer
    action: Apply every P0/P1 return gate and return defects without modifying the design.
  - step: 5
    owner: sponsor
    action: Accept, return, or reject the corrected design.
  - step: 6
    owner: governance
    action: Fingerprint and update mapping only through approved change control.
  - step: 7
    owner: implementation lease holder
    action: Implement only after accepted design authority and explicit non-overlapping file ownership.

