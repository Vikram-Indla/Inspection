      - [PROH-D3-02, "Both legacy publish RPC and CCR publication remaining independent authoritative paths.", [D3-A1, D3-A2], STOP]
      - [PROH-D3-03, "A lifecycle-only exception that can change title, legal content, relationships, rules or attachments.", [D3-A2], STOP]
