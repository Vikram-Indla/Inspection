global_stop_conditions:
  - Any of the 23 options is represented as selected, preferred or default.
  - Any of UAI-001..UAI-009 is inferred rather than supplied by recorded authority.
  - A partial selection or incomplete attached manifest is treated as a decision receipt.
  - A prohibited combination remains possible or is omitted from its future negative tests.
  - A future test/evidence label is treated as existing PASS evidence.
  - Direct legacy authoring, publication, attachment or Package bypass remains unclassified.
  - RLS, maker-checker, immutable history, audit, concurrency or rollback is weakened.
  - Historical Inspection, Enforcement, Package or attachment references are rewritten.
  - Field or offline runtime falls back to mutable legacy/latest values.
  - A lease, migration, data write, merge, deployment or completion credit is inferred from this trace.

