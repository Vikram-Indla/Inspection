    applicable prohibition as a negative path, unauthorized personas, stale
    and concurrent attempts, immutable history, audit, rollback and all named
    downstream consumers. A non-selected option is not exercised as accepted
    behavior; only its prohibition interactions are denied.
  rows:
    - [CCR-036A-TC-001, D1-O1, "typed relational constraints, identity/cardinality, RLS, immutability and Package projection"]
    - [CCR-036A-TC-002, D1-O2, "schema version, missing/wrong/unknown fields, compatibility and projection"]
