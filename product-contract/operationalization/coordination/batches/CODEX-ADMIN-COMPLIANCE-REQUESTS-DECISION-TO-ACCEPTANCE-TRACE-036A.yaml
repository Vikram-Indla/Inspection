prohibited_combination_trace:
  common_evidence_rule: >-
    Every prohibition is a negative case in the referenced option's planned
    SQL/browser case. Any prohibited combination observed or left possible is
    a P0 stop under WA-M6-AC-002 and WA-M6-AC-005.
  D1:
    requirements: [CR-458, CR-460, CR-463, REQ-R0C-01868..01878, REQ-R0C-01894..01896]
    acceptance: [WA-AC-0458, WA-AC-0460, WA-AC-0463, WA-M6-AC-002, WA-M6-AC-005, CMP-ACC-CCR-003..004, CMP-ACC-CCR-006, CMP-ACC-CCR-016..018]
    future: [SQL-A, BROWSER-projection, EVIDENCE-A]
    rows:
      - [PROH-D1-01, "Any option plus unvalidated arbitrary JSON.", [D1-O1, D1-O2, D1-O3], STOP]
      - [PROH-D1-02, "A relational core and document body both claiming authority for the same field without precedence.", [D1-O3], STOP]
      - [PROH-D1-03, "Schema evolution without immutable schema-version retention.", [D1-O2, D1-O3], STOP]
      - [PROH-D1-04, "Reusing one generic shape that drops kind-specific required facts.", [D1-O1, D1-O2, D1-O3], STOP]
      - [PROH-D1-05, "Package or Field interpreting fields not declared in the approved manifest.", [D1-O1, D1-O2, D1-O3, D4-S1, D4-S2, D4-S3], STOP]
  D2:
    requirements: [CR-458, CR-459, CR-463, CR-478, REQ-R0C-01627, REQ-R0C-01638, REQ-R0C-01879..01883]
    acceptance: [WA-AC-0458, WA-AC-0459, WA-AC-0463, WA-AC-0478, WA-M6-AC-002, WA-M6-AC-005, CMP-ACC-CCR-011, CMP-ACC-CCR-016..018]
    future: [SQL-A, BROWSER-projection, BROWSER-downstream, EVIDENCE-A, EVIDENCE-D]
    rows:
      - [PROH-D2-01, "More than one authoritative activation mechanism for the same entity kind.", [D2-A1, D2-A2, D2-A3], STOP]
      - [PROH-D2-02, "Date-only activation without an approved timezone and inclusive-boundary rule.", [D2-T1], STOP]
      - [PROH-D2-03, "Exact-instant activation while retaining a date-only UI that hides the instant.", [D2-T2], STOP]
      - [PROH-D2-04, "Approval date substituted for a future Release or Effective Date.", [D2-A1, D2-A2, D2-A3, D2-T1, D2-T2], STOP]
      - [PROH-D2-05, "A new successor becoming available before approval or its effective boundary.", [D2-A1, D2-A2, D2-A3], STOP]
      - [PROH-D2-06, "Removing the prior Active version before the successor is effectively Active, except an explicitly approved standalone deactivation.", [D2-A1, D2-A2, D2-A3], STOP]
      - [PROH-D2-07, "Automatic activation without idempotency, retry and stale-head protection.", [D2-A2, D2-A3], STOP]
      - [PROH-D2-08, "Backfill that fabricates missing values, collapses versions or repoints historical records.", [D2-B1, D2-B2, D2-B3], STOP]
      - [PROH-D2-09, "Entity-kind staged cutover that permits a child without its exact valid parent.", [D2-B3], STOP]
