  rule: >-
    Protected items are read/execute-only unless a new sponsor decision,
    collision refresh and exact expanded lease explicitly authorize one.

dependency_order:
  - order: 1
    gate: VALID_SAFE_DECISION_RECEIPT
    input: KIMI-M11-AUDIT-REDACTION-DECISION-RECEIPT-GATE-078
    stop_if: "Receipt is absent, invalid, unsafe, stale or routed to hold/scope expansion."
  - order: 2
    gate: ACCEPTED_DESIGN_AUTHORITY
    input: "Claude Design timeline placement, responsive states and bounded paging."
    stop_if: "Design or paging remains unapproved."
  - order: 3
    gate: CURRENT_REF_AND_COLLISION_REFRESH
    input: "Current product/coordination refs, lease blob, dirty paths, migration namespace and objects."
    stop_if: "Any overlap, stale pin or unowned dirty path exists."
  - order: 4
    gate: FOUR_LANE_IDENTITY_ALLOCATION
    input: "Distinct implementation, QA, data and review identities."
    stop_if: "Any identity is missing or combines conflicting roles."
  - order: 5
    gate: EXACT_LEASES
    input: "Path/object/data/evidence boundaries from this packet."
    stop_if: "Any lease is broad, overlapping, ambiguous or lacks release conditions."
  - order: 6
    gate: IMPLEMENTATION
    input: "Accepted decisions, design and implementation lease."
    stop_if: "Protected path/object changes or scope expansion occurs."
  - order: 7
    gate: IMPLEMENTATION_SELF_CHECK
    input: "Typecheck/build/static contract and migration lint in the implementation worktree."
    stop_if: "Any failure or unexplained diff exists."
  - order: 8
    gate: CONTROLLED_DATA_FIXTURE
    input: "Approved non-production environment and data lease."
    stop_if: "Environment, row manifest, cleanup or secret-safety boundary is missing."
  - order: 9
    gate: INDEPENDENT_QA_35_CASES
    input: KIMI-M11-AUDIT-REDACTION-ACCEPTANCE-MATRIX-076
    stop_if: "Any P0 fails, any required P1 is unsafe, or any case is excluded."
  - order: 10
    gate: EVIDENCE_FREEZE
    input: "Seven evidence rows plus source, fixture and artifact hashes."
    stop_if: "Evidence is incomplete, mutable, secret-bearing or unattributable."
  - order: 11
    gate: FINAL_INDEPENDENT_REVIEW
    input: "Implementation, QA, data and evidence."
    stop_if: "Reviewer returns or blocks."
  - order: 12
    gate: REAL_BROWSER_SPONSOR_REVIEW
    input: "Actual Virtual and Admin Audit implementations."
    stop_if: "Only design imagery is available or sponsor does not accept."
  - order: 13
    gate: COMPLETION_CREDIT
    input: "Accepted evidence and authorized control-plane update."
    stop_if: "Any P0/P1 requirement remains failed or unevidenced."

acceptance_execution_gate:
  source: KIMI-M11-AUDIT-REDACTION-ACCEPTANCE-MATRIX-076
  categories:
    positive: 5
    direct_query: 3
    negative: 4
    unauthorized: 5
    historical: 3
    admin_audit: 4
    virtual_UI: 3
    recursive_forbidden_key: 4
    duplicate_and_bounds: 2
    immutability_and_regression: 2
  total_cases: 35
  execution_rules:
    - "All P0 cases pass."
    - "P1 cases pass or receive an accepted requirement-safe disposition."
    - "No case is skipped, quarantined as flaky or replaced with static inspection."
    - "Every persona case uses the declared identity and session relationship."
    - "Direct-query cases use the external API boundary used by the app."
