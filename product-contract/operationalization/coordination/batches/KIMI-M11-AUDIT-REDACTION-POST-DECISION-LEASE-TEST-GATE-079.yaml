rollback_and_recovery:
  implementation:
    before_acceptance:
      - "Disable or revert the bounded application commit if the existing route remains safe and functional."
      - "Do not roll back by editing main or historical migrations."
    database:
      - "Use a new forward corrective migration for a defective deployed function/policy."
      - "Never delete or rewrite audit_events."
      - "Preserve the previous function definition and grants as reviewed rollback evidence."
    stop_condition: "Rollback that weakens secret protection, OTP enforcement or audit immutability is prohibited."
  QA:
    - "Failed evidence is retained and superseded, not edited into a pass."
    - "A corrected run receives new artifact hashes and a link to the failed run."
  data:
    - "Delete only mutable fixture rows listed in the cleanup manifest when relationship constraints allow."
    - "Retain immutable generated audit rows and list their object IDs."
    - "Dispose the isolated transaction/database used for synthetic historical-secret cases."
    - "Never use broad cleanup targets, unresolved variables or production."
  review:
    - "A returned verdict remains in history; a later review supersedes it with new evidence."

