prepared_on: "2026-07-25"
timezone: Asia/Riyadh
saqeel_os: "v2"

purpose: >-
  Define the exact post-decision separation among implementation, independent
  QA, controlled fixture data and final review; protect shared paths and
  objects; sequence dependencies; and require the 35-case acceptance gate,
  evidence and rollback proof before any completion credit.

source_pins:
  product_ref: origin/main
  product_commit: 9d8c414258a5e04244fdf9ce350e5f25f952dfc1
  coordination_ref: origin/codex/orchestration-control-plane
  coordination_commit: 9198567442a7545b1cad2cafaedea3d1519d650c
  lease_registry_sha256: 33f8351c45d603a54c910c2f6a463fb6b26ee1497a647c288497aded8a7c104a

inputs:
  - KIMI-M11-AUDIT-SECRET-REDACTION-CONTRACT-075
  - KIMI-M11-AUDIT-REDACTION-ACCEPTANCE-MATRIX-076
  - KIMI-M11-AUDIT-REDACTION-SPONSOR-DECISION-PACKET-077
  - KIMI-M11-AUDIT-REDACTION-DECISION-RECEIPT-GATE-078

activation_precondition:
  required_receipt_result: VALID_DECISIONS_ONLY_POST_GATES_REQUIRED
  current_receipt_present: false
  current_state: DORMANT_READ_ONLY_SKELETON
  rule: >-
    This packet cannot be activated, converted into leases or used as write
    authority until a future receipt passes gate 078 and current refs are
    revalidated.

hard_boundary:
  - "Read-only lease/test-gate design plus this one uniquely owned packet."
  - "No actor is assigned and no lease, dispatch or migration filename is created."
  - "No code, SQL, database, data, seed, test, evidence, design, branch, stash, commit, push or shared-control mutation."
  - "No requirement credit."

separation_principles:
  - "Implementation, QA, data operations and final review use distinct identities and non-overlapping write surfaces."
  - "QA may execute implementation artifacts but may not edit implementation-leased files."
  - "Data operators may create only approved fixture rows in the approved non-production environment and may not change schema or application code."
  - "The reviewer is read-only and may return work but may not repair it."
  - "No lane may edit historical migrations, immutable audit rows or another lane's evidence."
  - "A missing lane or lease is blocking, not an invitation for another lane to absorb it."

lane_contracts:
  - lane_id: LANE-079-IMPLEMENTATION
    role: IMPLEMENTATION_OWNER
    identity: UNASSIGNED
    mode: WRITE_EXACT_PATHS_AND_OBJECTS_ONLY
    minimum_paths:
      - apps/web/src/app/(app)/virtual/[id]/page.tsx
      - "supabase/migrations/<reserved_timestamp>_m11_audit_consumer_redaction.sql"
    conditional_paths:
      - apps/web/src/app/(app)/virtual/[id]/Room.tsx
      - apps/web/src/app/(app)/virtual/[id]/AuditTimeline.tsx
      - apps/web/src/app/(app)/admin/audit/page.tsx
    minimum_database_objects:
      - public.vs_audit_trail(uuid)
    conditional_database_objects:
      - public.vp_rw
      - "new redacted Admin Audit read seam with an allocated name"
    allowed_outputs:
      - "Forward-only database read-boundary migration."
      - "Bounded Virtual UI audit wiring."
      - "M11-specific Admin Audit redaction only when decision SD-077-03-A is selected."
      - "Implementation notes and self-check results in the implementation worktree."
    prohibited:
      - "Editing QA test or certification evidence paths."
      - "Changing test fixture data in shared environments."
      - "Granting itself requirement credit."
    release_condition:
      - "Implementation commit is stable and source-diff reviewed."
      - "No file or object outside the lease changed."
      - "Migration identity and object replacement are recorded."

  - lane_id: LANE-079-QA
    role: INDEPENDENT_QA_OWNER
    identity: UNASSIGNED_DISTINCT_FROM_IMPLEMENTATION
    mode: WRITE_TEST_AND_QA_EVIDENCE_ONLY
    new_test_paths:
      - apps/web/e2e/m11-audit-consumer-redaction.spec.ts
      - apps/web/e2e/m11-audit-direct-table-secret-negative.spec.ts
      - supabase/tests/m11_audit_consumer_redaction_security.sql
    protected_existing_tests_execute_only:
      - apps/web/e2e/cd-041-virtual-backend.spec.ts
      - apps/web/e2e/cd-041-virtual-verified-gate.spec.ts
      - apps/web/e2e/cd-042-audit-read-seam.spec.ts
      - apps/web/e2e/cd-042-otp-status-authz.spec.ts
      - apps/web/e2e/cd-043-virtual-boundary-states.spec.ts
      - apps/web/e2e/execution-crossmodule-contract.spec.ts
      - apps/web/e2e/neutral-error-sweep.spec.ts
    evidence_path:
      - product-contract/evidence/M11_AUDIT_CONSUMER_REDACTION_CERTIFICATION.md
    allowed_outputs:
      - "Independent 35-case execution record."
      - "Recursive forbidden-key/value scans."
      - "Historical immutability comparison."
      - "No-exclusion protected regression result."
      - "Browser, DOM and network evidence manifests."
    prohibited:
      - "Editing implementation application or migration paths."
      - "Editing protected existing tests to make the implementation pass."
      - "Changing shared fixture data outside the data lease."
      - "Self-approving failed or unevidenced cases."
    release_condition:
      - "All evidence is immutable by hash and attributable to exact refs."
      - "Failures are returned to implementation; QA does not repair product files."

  - lane_id: LANE-079-DATA
    role: CONTROLLED_FIXTURE_OPERATOR
    identity: UNASSIGNED_DISTINCT_FROM_IMPLEMENTATION_AND_QA
    mode: NON_PRODUCTION_FIXTURE_ROWS_ONLY
    repository_paths: []
    approved_environment: UNSELECTED_NON_PRODUCTION_ONLY
    shared_preprod_allowed_rows:
      - public.visits
      - public.assignments
      - public.virtual_sessions
      - public.virtual_participants
    generated_immutable_rows:
      - public.audit_events
    generated_by:
      - "Normal row triggers."
      - public.vp_request_otp(uuid)
      - public.vp_verify_otp(uuid,text)
    isolated_transaction_only:
      - "Synthetic historical audit row containing forbidden nested keys."
      - "Direct secret-column authorization probes requiring privileged setup."
    allowed_outputs:
      - "Fixture manifest with environment, scenario, stable row IDs and timestamps."
      - "SCN-025 positive virtual flow."
      - "SCN-026 provider-unavailable/degraded truth flow."
      - "Cleanup result for mutable fixture rows."
    prohibited:
      - "Production data."
      - "DDL, policy, grant or function changes."
      - "Direct UPDATE or DELETE of audit_events."
      - "Live OTP, real participant identity or unapproved provider metadata in evidence."
      - "Using a permanent mock and claiming completion."
      - "Editing repository seeder code; no M11 seeder implementation path exists on origin/main."
    release_condition:
      - "Every mutable fixture row has a manifest and cleanup disposition."
      - "Immutable generated audit rows are retained and listed, never silently removed."

  - lane_id: LANE-079-REVIEW
    role: FINAL_INDEPENDENT_REVIEWER
    identity: UNASSIGNED_DISTINCT_FROM_IMPLEMENTATION_QA_AND_DATA
    mode: READ_ONLY
    readable_scope:
      - "Implementation diff and migration."
      - "Database object definitions."
      - "QA tests and evidence."
      - "Fixture manifest and cleanup record."
      - "Real browser implementation."
      - "Decision receipt and all gates."
    writable_paths: []
    allowed_outputs:
      - APPROVE_FOR_SPONSOR_REVIEW
      - RETURN_FOR_IMPLEMENTATION_CORRECTION
      - RETURN_FOR_QA_CORRECTION
      - RETURN_FOR_DATA_CLEANUP
      - BLOCK_AUTHORITY_OR_EVIDENCE
    prohibited:
      - "Editing leased files or fixing findings."
      - "Accepting design screenshots as implementation evidence."
      - "Granting completion credit."
    release_condition:
      - "One explicit verdict with evidence references and unresolved blockers."

lease_separation_matrix:
  - writer: LANE-079-IMPLEMENTATION
    may_write:
      - implementation application paths
      - one allocated forward migration
    must_not_write:
      - QA tests
      - QA evidence
      - shared fixture data
      - reviewer verdict
  - writer: LANE-079-QA
    may_write:
      - allocated new test paths
      - one allocated QA certification path
    must_not_write:
      - implementation application paths
      - migration
      - shared fixture data
      - reviewer verdict
  - writer: LANE-079-DATA
    may_write:
      - approved non-production fixture rows
      - fixture/cleanup manifest through its separately allocated evidence path
    must_not_write:
      - repository source
      - schema
      - tests
      - implementation evidence
      - reviewer verdict
  - writer: LANE-079-REVIEW
    may_write:
      - "No product, test, data or evidence path; verdict returned through the assigned review record only."
    must_not_write:
      - all leased implementation paths
      - all QA paths
      - all data

