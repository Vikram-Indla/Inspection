    - product-contract/evidence/CODEX_AUDIT_CD041_LIVE_GATE_2026-07-15.md
    - product-contract/evidence/CD-043_D2L_WIRING_CLOSURE_2026-07-15.md
    - product-contract/evidence/CODEX_AUDIT_NEUTRAL_ERROR_SWEEP_2026-07-15.md
    - product-contract/evidence/EVIDENCE_STATUS.md
