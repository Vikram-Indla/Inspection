mandatory_two_ref_bootstrap:
  name: SAQEEL_M11_CONTROL_BOOTSTRAP_V1
  step_order:
    - order: 1
      action: VERIFY_CANONICAL_REPOSITORY_IDENTITY
      required:
        - "Git common directory belongs to /Users/vikramindla/Developer/Inspection."
        - "Retired checkout is not accessed."
    - order: 2
      action: RESOLVE_PRODUCT_CONTROL_REF
      source: origin/main
      required:
        - "Record exact commit."
        - "Read WORK_QUEUE.yaml and CURRENT_SLICE.yaml as Git blobs from that commit."
        - "Hash both contents and compare with the dispatch manifest."
    - order: 3
      action: RESOLVE_COORDINATION_CONTROL_REF
      source: origin/codex/orchestration-control-plane
      required:
        - "Record exact commit."
        - "Read ACTIVE_WORKTREE_LEASES.csv as a Git blob from that commit."
        - "Hash content and compare with the dispatch manifest."
    - order: 4
      action: RECONCILE_TASK_AND_LEASE
      required:
        - "Find exact task ID in the product queue."
        - "Find exact actor/task/worktree/branch/path row in the lease registry."
        - "Require current slice compatibility but never treat it as a lease."
    - order: 5
      action: FAIL_CLOSED_ON_ANY_MISMATCH
      required:
        - "Missing ref, missing blob, hash drift, ambiguous task, absent exact lease, path overlap or stale dispatch means STOP."
    - order: 6
      action: RECORD_BOOTSTRAP_EVIDENCE_BEFORE_WRITE
      required:
        - "Record refs, commits, hashes, task ID, lease row and collision result."
        - "A worker may write only after an independent reviewer reproduces the same view."

