worker_acceptance_rules:
  ACK:
    exact_result: ACK_SHARED_CONTROL_VIEW_REPRODUCED
    all_required:
      - "Both refs and commits resolve exactly."
      - "All three content hashes match the dispatch manifest."
      - "Task, actor, worktree, branch, mode and exact paths/objects match one active lease row."
      - "No overlapping active lease exists."
      - "Preservation floor is 20/361/18/9/12 and credit is zero."
    effect: "Control view is reproducible; separate task prerequisites still govern whether work may start."
  RETURN:
    exact_result: RETURN_FOR_STALE_OR_INCOMPLETE_CONTROL_VIEW
    triggers:
      - "Checkout-local queue/slice differs from pinned product ref."
      - "Checkout-local lease registry is missing or differs from pinned coordination ref."
      - "Manifest omits a required field but no unauthorized write has begun."
  BLOCK:
    exact_result: BLOCK_DUE_TO_CONTROL_AUTHORITY_OR_COLLISION_FAILURE
    triggers:
      - "Any ref/blob/hash cannot be proven."
      - "Exact active lease row is absent or ambiguous."
      - "Any path/object collision exists."
      - "A missing registry is interpreted as an empty registry."
      - "Any write begins before independent bootstrap reproduction."

