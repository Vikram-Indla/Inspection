purpose: >-
  Separate genuine sponsor/change-control choices from technical prerequisites
  for M11 closure rows blocked by provider, persona, owner/schema, audit or
  quiesce dependencies. Recommend fail-closed defaults and identify the exact
  source packet and future evidence needed after authority exists.

authority:
  correction_authority: KIMI-M11-CONSOLIDATED-SECURITY-CORRECTION-022
  readiness_review: KIMI-M11-CORRECTION-READINESS-REVIEW-024
  correction_blueprint: KIMI-M11-SOURCE-PACKET-CORRECTION-BLUEPRINT-026
  collision_preflight: KIMI-M11-OWNERSHIP-COLLISION-PREFLIGHT-027
  acceptance_harness: KIMI-M11-POST-CORRECTION-ACCEPTANCE-HARNESS-030
  test_gap_map: KIMI-M11-TEST-EVIDENCE-GAP-MAP-032
  evidence_reuse_audit: KIMI-M11-EVIDENCE-REUSE-INTEGRITY-AUDIT-034

hard_boundary:
  - "No sponsor decision is inferred, recorded as approved or implemented here."
  - "No product, application, database, remote DDL, test, migration, data, UI or seed write."
  - "No dispatch, review 025 execution, test run, branch/worktree change or lease issuance."
  - "No policy value, provider, role right, owner, schema, maintenance window or SLA is invented."
  - "Zero change to the 478-row completion count."

classification:
  SPONSOR_CHANGE_CONTROL_CHOICE:
    meaning: "A business/governance authority must select or explicitly retain a blocked outcome."
  CONDITIONAL_SPONSOR_CHOICE:
    meaning: "No choice is needed unless technical discovery exposes an unresolved business-access need."
  TECHNICAL_PREREQUISITE:
    meaning: "Engineering/security must discover, implement or prove the fact; the sponsor should not guess it."
  ORCHESTRATION_PREREQUISITE:
    meaning: "Required packet, review, ownership or collision state before work may be leased."

non_negotiable_fail_closed_rules:
  - "No approved OTP delivery provider means OTP runtime completion remains BLOCKED."
  - "No exact persona authority means the disputed action is denied/BLOCKED_FOR_AUTHORITY."
  - "No confirmed function owner/security model or extension schema means no migration lease."
  - "No complete audit-consumer inventory means no raw-audit policy contraction."
  - "No safe participant trigger means hardened OTP is not exercised."
  - "No zero-in-flight quiesce proof means 013→015 contraction does not start."
  - "No corrected packets, accepted 009r or fresh collision check means no test or implementation lease."

sponsor_choice_matrix:
  - dependency_id: M11-SPONSOR-OTP-01
    category: PROVIDER
    classification: SPONSOR_CHANGE_CONTROL_CHOICE
    business_question: >-
      Approve a configured OTP delivery provider and its governed operating
      contract, or explicitly accept that virtual identity verification remains
      blocked for runtime completion.
    choices:
      - APPROVE_PROVIDER_THROUGH_CHANGE_CONTROL
      - RETAIN_RUNTIME_BLOCKED
    prohibited_choice:
      - "Treat dev_code, stored notification, permanent mock, test secret or unconfigured adapter as delivery."
    fail_closed_default: RETAIN_RUNTIME_BLOCKED
    affected_rows: ["021-P0-02", "024-X04"]
    source_packets:
      primary: [KIMI-M11-PERMISSION-HARDENING-LEASE-013, KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017]
      successor: [KIMI-M11-AUDIT-BOUNDARY-LEASE-015]
    future_evidence:
      test_leases: [TEST-PROVIDER, TEST-013, TEST-015, TEST-BROWSER]
      required:
        - "No-provider ordinary-session failure is truthful, neutral and secret-free."
        - "Approved provider configuration and delivery receipt correlate to participant/run_id without exposing the code."
        - "Request/status/verify retain assigned-Inspector authorization, row locking and one-event cardinality."
      impossible_without_choice: "Successful live OTP delivery and CR-350/CR-351 runtime-completion claim."

  - dependency_id: M11-SPONSOR-PLANNER-01
    category: PERSONA
    classification: SPONSOR_CHANGE_CONTROL_CHOICE
    business_question: >-
      Confirm through canonical change control whether RBAC-007 authorizes
      Planner creation/scheduling and rescheduling of a virtual session.
    choices:
      - "CITE_EXISTING_EXACT_AUTHORITY_PER_ACTION"
      - "APPROVE_EXPLICIT_REQUIREMENT_CHANGE_PER_ACTION"
      - "RETAIN_ACTION_BLOCKED_FOR_PLANNER"
    fail_closed_default: RETAIN_ACTION_BLOCKED_FOR_PLANNER
    affected_rows: ["021-P1-02", "024-X01", "024-X02"]
    source_packets:
      primary: [KIMI-M11-ATOMIC-FIX-LEASE-010, KIMI-M11-EXECUTION-WINDOW-LEASE-011]
      integrator: [KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017]
    future_evidence:
      test_leases: [TEST-010, TEST-011, TEST-BROWSER]
      required:
        - "Per-action Planner ALLOW or governed denial using an ordinary Planner session."
        - "No broad RLS or current UI visibility substitutes for authority."
        - "Authorized action retains atomicity/window/audit; denied action changes zero rows."

  - dependency_id: M11-SPONSOR-OPERATIONS-01
    category: PERSONA
    classification: SPONSOR_CHANGE_CONTROL_CHOICE
    business_question: >-
      Confirm through canonical change control whether RBAC-008 authorizes any
      Operations schedule, reschedule, waiting-room-open or close/cancel action,
      and state the approved-override boundary per action.
    choices:
      - "CITE_EXISTING_EXACT_AUTHORITY_PER_ACTION"
      - "APPROVE_EXPLICIT_REQUIREMENT_CHANGE_PER_ACTION"
      - "RETAIN_ACTION_BLOCKED_FOR_OPERATIONS"
    prohibited_choice:
      - "Infer execution authority from exception visibility, reassignment or broad current database access."
    fail_closed_default: RETAIN_ACTION_BLOCKED_FOR_OPERATIONS
    affected_rows: ["021-P1-02", "024-X01", "024-X02"]
    source_packets:
      primary: [KIMI-M11-ATOMIC-FIX-LEASE-010, KIMI-M11-EXECUTION-WINDOW-LEASE-011]
      integrator: [KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017]
    future_evidence:
      test_leases: [TEST-010, TEST-011, TEST-BROWSER]
      required:
        - "Per-action Operations ALLOW or governed denial with ordinary session evidence."
        - "Approved override records reason, actor, scope and immutable audit evidence."
        - "No Operations OTP/join/verify/begin permission."

  - dependency_id: M11-SPONSOR-QUIESCE-01
    category: QUIESCE
    classification: SPONSOR_CHANGE_CONTROL_CHOICE
    business_question: >-
      After technical rehearsal passes, approve the bounded M11 maintenance
      window in which new traffic is disabled, in-flight work drains to zero,
      and 013 then 015 contract migrations run without traffic.
    choices:
      - APPROVE_REHEARSED_MAINTENANCE_WINDOW
      - DEFER_CONTRACTION
    fail_closed_default: DEFER_CONTRACTION
    affected_rows: [M11-MIGSEC-006, M11-MIGSEC-008, M11-MIGSEC-012, "021-P0-07", "024-X06"]
    source_packets:
      primary: [KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017]
      contract_sequence: [KIMI-M11-PERMISSION-HARDENING-LEASE-013, KIMI-M11-AUDIT-BOUNDARY-LEASE-015]
    future_evidence:
      test_leases: [TEST-ROLLOUT, TEST-CATALOG, TEST-BROWSER]
      required:
        - "Approved switch-off and drain procedure with zero in-flight M11 mutations."
        - "Exact 013→015 migration order and no-traffic timestamps."
        - "Fail-closed abort and roll-forward-only recovery rehearsal."

  - dependency_id: M11-SPONSOR-AUDIT-AUDIENCE-01
    category: AUDIT
    classification: CONDITIONAL_SPONSOR_CHOICE
    business_question: >-
      Only if the technical inventory finds a business consumer outside the
      already-authorized Reviewer/Auditor safe-read contract, decide whether
      that role needs a new safe projection permission through change control.
    choices:
      - "APPROVE_SAFE_PROJECTION_ROLE_THROUGH_CHANGE_CONTROL"
      - "RETAIN_NO_ACCESS"
    prohibited_choice:
      - "Allow raw secret-bearing participant before/after JSON to an application role."
    fail_closed_default: RETAIN_NO_ACCESS
    affected_rows: [M11-MIGSEC-004, "021-P0-03", "021-P0-08", "024-X05"]
    source_packets:
      primary: [KIMI-M11-AUDIT-BOUNDARY-LEASE-015]
      integrator: [KIMI-M11-REMEDIATION-DEPENDENCY-LEASE-COLLISION-PLAN-017]
    future_evidence:
      test_leases: [TEST-015, TEST-BROWSER]
      required:
        - "Ordinary-session positive safe projection only for explicitly authorized roles."
        - "Raw audit denial remains universal for authenticated application personas."
    trigger: "Do not ask the sponsor until the technical global-consumer inventory identifies a real unresolved audience."

