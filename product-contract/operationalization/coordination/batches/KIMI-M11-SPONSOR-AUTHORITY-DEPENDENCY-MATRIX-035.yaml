    decision: "Planner and Operations per-action authority."
    when: "Corrected packets expose the exact action list and current canonical citations."
  - order: 2
    decision: "OTP provider approval or explicit runtime block."
    when: "Provider options and governed operating contract are supplied; no test/dev substitute."
  - order: 3
    decision: "Conditional safe-audit audience expansion, only if technical inventory identifies a real gap."
    when: "Global consumer inventory is complete."
  - order: 4
    decision: "Future implementation/test owner and exact leases."
    when: "Review 025 and review 033 permit a sponsor lease decision."
  - order: 5
    decision: "Rehearsed maintenance/quiesce window."
    when: "Technical quiesce rehearsal passes and the integrated stack is ready."

