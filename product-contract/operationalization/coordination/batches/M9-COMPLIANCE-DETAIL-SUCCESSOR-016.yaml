    - "No typed صناعي, Industrial or ADMIN sub-brand."
    - "At narrow widths the rail becomes the approved compact/drawer pattern; no clipped or peeking icons."
  layout:
    - "Desktop may use a bounded rail plus content grid."
    - "1024 preserves all actions without horizontal page scrolling."
    - "412/390/320 stack facts and panels; tables become labelled cards or an accessible bounded scroll region with clear affordance."
    - "Sticky controls must not hide validation, content or browser zoom."
    - "Long Arabic, legal-source, filename and code values wrap or scroll within their own bounded region."
  rtl:
    - "Mirror navigation and directional affordances."
    - "Keep IDs, hashes, dates, version labels and code tokens in isolated LTR bdi spans."
    - "Arabic labels, errors, empty states and announcements have semantic parity with English."
  theme:
    - "Use only approved SAQEEL semantic tokens."
    - "Meet contrast in every state; status is never conveyed by colour alone."

accessibility_contract:
  - "One h1 per route mode and ordered headings."
  - "Landmarks and a skip link identify navigation, main content and contextual actions."
  - "All controls have programmatic names and visible keyboard focus."
  - "Mode selection, tabs and disclosure patterns use the matching ARIA semantics and keyboard model."
  - "Tables have headers and captions; narrow card alternatives preserve labels and reading order."
  - "Reorder actions work by keyboard, announce the new position and do not rely on drag alone."
  - "Validation summary receives focus and links to each invalid control."
  - "Loading, success, error, stale and publish outcomes use appropriate polite/assertive live announcements."
  - "Focus returns to the originating action or meaningful result after dialogs and mutations."
  - "Touch targets remain at least the approved component minimum at every viewport."
  - "Zoom/reflow at 200% and 400% preserves actions and does not require two-dimensional page scrolling."
  - "Reduced motion removes nonessential transition while preserving state change."

