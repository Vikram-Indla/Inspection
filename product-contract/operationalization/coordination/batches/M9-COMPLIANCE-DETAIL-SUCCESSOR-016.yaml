required_state_matrix:
  common:
    - id: STATE-LOADING
      requirement: "Skeleton or progress state preserves heading and route context; announce loading without trapping focus."
    - id: STATE-RLS-EMPTY
      requirement: "Successful authorized read with no rows; never substitute for an error or denied read."
    - id: STATE-READ-ERROR
      requirement: "Neutral provider/service failure with retry or safe return; retain prior user input where applicable."
    - id: STATE-UNAUTHORIZED
      requirement: "No sensitive row detail or count; safe route-level denial and return path."
    - id: STATE-NOT-FOUND
      requirement: "Successful read with no matching ID; distinct from read error and unauthorized."
    - id: STATE-STALE-CONFLICT
      requirement: "Reject overwrite, explain that the record changed, retain draft input and offer reload/compare."
    - id: STATE-VALIDATION
      requirement: "Error summary links to invalid controls; inline errors state the correction; first summary receives focus."
    - id: STATE-IMMUTABLE
      requirement: "Published/locked snapshot has no editable affordance and explains future-version workflow."
    - id: STATE-AUDIT-UNAVAILABLE
      requirement: "State that history could not be verified; never show zero history."
  regulation_specific:
    - "Draft with unmapped clauses blocks publish and links to each unmapped clause."
    - "Attachment upload failure and metadata-compensation result."
    - "Same maker/checker identity rejected."
    - "Invalid effective-date ordering rejected."
    - "Deactivation reason missing."
  package_specific:
    - "Item-bank, template-registry or violation-choice partial-read failure."
    - "Missing dependency, circular condition and inactive reference blockers."
    - "Published item snapshot, violation snapshot or template snapshot failure."
    - "Publish RPC failure and same maker/checker rejection."
    - "No packages; package exists with no draft; empty draft section; empty item canvas."
    - "Impact unavailable versus verified no affected future usage."
  runtime_preview_specific:
    - "No immutable package-version snapshot."
    - "Selected package usage unavailable."
    - "Response, evidence, section, report placement or enforcement reference not configured."
    - "Configured violation reference inaccessible or unresolved."
    - "No version-history rows available."

responsive_locale_theme_contract:
  viewports:
