path_and_object_matching:
  path_rules:
    - "Normalize repository-relative paths without resolving through the filesystem."
    - "Reject absolute paths, parent traversal, empty path and wildcard outside an explicitly listed lease pattern."
    - "Two write paths collide when equal or when one directory path contains the other."
    - "Execute-only protected test paths never become QA write paths."
    - "DATA and REVIEW must have no repository write path."
  object_rules:
    - "Normalize schema, object name and exact function signature."
    - "Functions with different signatures are different objects only when the signature is explicit."
    - "Table, trigger, function and policy names are compared case-insensitively after canonical public-schema qualification."
    - "A protected object match always blocks, even if a lane also has a broader allowed object."
  identity_rules:
    - "All four synthetic identities must be nonempty and pairwise distinct."
    - "Identity labels beginning SYNTHETIC- cannot authorize real work."

