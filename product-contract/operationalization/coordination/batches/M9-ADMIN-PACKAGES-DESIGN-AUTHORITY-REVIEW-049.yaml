publish_lifecycle_and_maker_checker:
  intended_path:
    application_action: approveAndPublish
    validation: Full dependency validation before status transition
    snapshot: Item, violation, penalty and template semantics frozen
    RPC: publish_package_version
    transaction:
      - lock draft
      - require distinct approver
      - close previous active effective window
      - set predecessor lineage
      - publish frozen definition
    validation_result: STRONG_AND_ATOMIC
  maker_checker:
    created_by: recorded
    approved_by: required for published or locked
    distinct_actor_constraint: present
    UI_action_uses_current_actor: true
    validation: PRESENT_ON_INTENDED_PATH
  bypass:
    broad_table_update_policy: true
    direct_status_update_possible_for_authorized_writer: true
    database_publish_guard_requires_approved_by: true
    database_definition_trigger: partial shape and relationship checks only
    full_dependency_validation_at_database_boundary: false
    frozen_snapshot_build_at_database_boundary: false
    impact_acknowledgement_required: false
    implication: >-
      An authorized writer can update a draft directly to published, populate a
      distinct approved_by identity, and bypass the full action validation,
      snapshot creation and atomic predecessor handling.
    validation: MAKER_CHECKER_AND_PUBLISH_PATH_BYPASSABLE
  deactivation:
    allowed_statuses:
      - published
      - locked
    reason_required: true
    effective_to_required: true
    distinct_actor_required: false
    impact_acknowledgement_required: false
    successor_required: false
    validation: PARTIAL

immutability_versioning_concurrency:
  definition_immutability:
    trigger: trg_guard_pkg
    published_definition_change_blocked: true
    published_version_label_change_blocked: true
