hard_state_review:
  evidenced:
    - loading
    - fatal route error
    - package source unavailable
    - item-bank unavailable
    - true empty
    - partial degradation
    - manual refresh/stale notice
    - read-only projection
    - immutable published definition
    - draft editable
    - unsaved and no-op save
    - validation blockers
    - impact unavailable distinct from zero
    - publish success and neutral error
    - deactivation success and neutral error
  missing_or_inadequate:
    - concurrent draft overwrite
    - multiple divergent drafts
    - direct publish bypass detection
    - snapshot-build partial failure evidence
    - source-clone read failure
    - full-row published mutation
    - stale dependency between validation and publish
    - impact acknowledgement
    - no active successor after deactivation
    - maker-checker pending queue and rejection
    - audit unavailable
