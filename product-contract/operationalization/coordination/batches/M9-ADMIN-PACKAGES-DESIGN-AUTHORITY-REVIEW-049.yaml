    predecessor_lineage: present
    planning_consumers_reject_future_or_expired_versions: registered evidence
    in_flight_version_pin: present
    validation: CONFIRMED_ON_INTENDED_PATH
  draft_concurrency:
    row_version: absent
    updated_at_CAS: absent
    expected_version: absent
    save_filter: id and draft status only
    risk: Concurrent designers can silently overwrite one another.
    validation: FAIL
  multiple_drafts:
    unique_active_draft_per_package: absent
    implication: More than one independent draft may diverge without visible merge or ownership handling.
  create_draft:
    source_selection: latest row by published_at
    source_read_error_handled: false
    risk: Failure or ambiguity can create an empty draft rather than a proven successor clone.
    validation: PARTIAL

