design_code_delta:
  design_missing_against_contract_and_code:
    - id: M5-DES-P0-001
      severity: P0
      finding: >-
        WA-DES-039 records Approve directly from the decision panel. It has no
        separate irreversible approval confirmation containing inspection
        summary, violations, critical violations, action forms, evidence count,
        factory updates, version and compliance consequences required by
        CR-358..CR-360.
      design_evidence: "WA-DES-039 lines 185-202 and local decide() at lines 241-259."
      code_evidence: >-
        DecisionPanel.tsx has one preselected approve radio and one submit
        button; page.tsx renders violations/actions but no complete compliance
        preview contract.
      implication: "An irreversible high-impact action can be confirmed without the required consequence review."
    - id: M5-DES-P0-002
      severity: P0
      finding: >-
        WA-DES-039 has no exact returned-section selector even though it claims
        a return reopens only returned scope. The implementation does provide
        server-allow-listed checkboxes and mandatory reason validation.
      design_evidence: "WA-DES-039 lines 118-122 and 185-195."
      code_evidence: "DecisionPanel.tsx returned_section checkboxes; actions.ts validates section membership and non-empty scope."
      implication: "The design cannot represent or validate CR-361, CR-362, CR-367 and CR-399."
    - id: M5-DES-P0-003
      severity: P0
      finding: >-
        WA-DES-039 has no N versus N+1 comparison, changed-section navigation,
        locked-section tamper signal, missing-version, package-incompatibility
        or repeated-return state. The implementation contains a read-only
        scope-authoritative comparison but explicitly leaves evidence,
        package-semantic and metadata comparisons unavailable.
      design_evidence: "No comparison surface or comparison state exists in the registered export."
      code_evidence: "VersionCompare.tsx and cd-030-version-comparison.spec.ts."
      implication: "CR-367, CR-402..CR-404 and CR-409 are not covered by the design; code remains partial for CR-409."
    - id: M5-DES-P1-004
      severity: P1
      finding: >-
        All three exports are fixed 248px-rail English screens with isolated
        Arabic typed branding, not complete EN/LTR and AR/RTL variants at 1024,
        412/390 and 320.
      evidence: "Each export root uses a fixed 248px grid; state exposes theme only. No locale or viewport control exists."
      implication: "WA-M5-AC-003 and WA-M5-AC-004 are unevidenced."
    - id: M5-DES-P1-005
      severity: P1
      finding: >-
        All three English designs use typed Arabic-only صقيل صناعي identity,
        contrary to the approved bilingual SAQEEL | صقيل Web/Admin asset and
        the prohibition on the Industrial/صناعي sub-brand.
      evidence: "WA-DES-017 line 23, WA-DES-039 line 25, WA-DES-042 line 23."
      implication: "The known English-profile identity defect would be reintroduced by literal design replication."
    - id: M5-DES-P1-006
      severity: P1
      finding: >-
        Required loading, empty, error, degraded evidence, unauthorized, stale
        assignment/version, conflict, provider-unavailable, decision-in-progress
        and failure-without-partial-transition states are not independently
        selectable or evidenced in WA-DES-039.
      implication: "Negative-path and accessibility review cannot be completed from the current design."

  code_risks_not_represented_by_design:
    - id: M5-CODE-P0-001
      severity: P0
      finding: >-
        startReview inserts the review row before transitioning the inspection.
        If the second write fails, the action reports failure after leaving a
        claimed/open review row. There is no single transactional RPC.
      evidence: apps/web/src/app/(app)/reviews/[id]/actions.ts
      required_classification: BLOCK_DUE_TO_MISSING_ATOMIC_WORKFLOW_CONTRACT
    - id: M5-CODE-P0-002
      severity: P0
      finding: >-
        decide updates the immutable review decision before transitioning the
        inspection and before notification verification. Later failure returns
        an error even though the irreversible decision may already be stored.
        This violates the required failure-without-partial-transition state.
      evidence: apps/web/src/app/(app)/reviews/[id]/actions.ts
      required_classification: BLOCK_DUE_TO_MISSING_ATOMIC_WORKFLOW_CONTRACT
    - id: M5-CODE-P0-003
      severity: P0
      finding: >-
        The current Playwright suites intentionally avoid submitting live
        decisions. Source assertions protect guards, but do not prove atomic
        approve/return/reject behavior, immutable audit, downstream compliance
        triggering and fail-closed notification outcomes end to end.
      evidence:
        - apps/web/e2e/cd-029-review-workspace.spec.ts
        - apps/web/e2e/cd-030-version-comparison.spec.ts
      required_classification: BLOCK_UNTIL_RUNTIME_NEGATIVE_EVIDENCE_EXISTS

