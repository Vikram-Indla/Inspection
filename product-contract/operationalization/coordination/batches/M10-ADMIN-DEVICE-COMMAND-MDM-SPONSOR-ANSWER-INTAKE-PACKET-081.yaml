preservation_floor:
  - Only the assigned, enrolled, trusted and app-compliant device may download, open, replay or submit an official package.
  - Pending, suspended, revoked, wipe-pending and wiped devices fail closed.
  - A remote request, provider acceptance, device acknowledgement and verified effect are separate facts.
  - Queued Resume cannot restore trust and ordinary Resume cannot revive revoked, wipe-pending or wiped identities.
  - Package invalidation and remote wipe require genuine effect evidence; queueing is not cached-device deletion.
  - Unauthorized, invalid, stale, duplicate, missing-provider and offline paths cannot corrupt records or silently restore access.
  - Actor, device, command, reason, version, time, before/after and genuine evidence remain auditable.
  - No provider, SLA, retry, freshness, retention, threshold, Arabic approval or evidence result may be invented.
  - EN/AR, RTL/LTR, light/dark, responsive and accessibility outcomes remain mandatory.

decision_intake:
  - decision_id: DEV-CMD-DEC-01
    subject: Role ownership and capability mapping
    question: Who owns Device Admin and Mobile Admin capabilities?
    current_fact: Canonical RBAC has no Device Admin or Mobile Admin role; current code uses Ops and Security Admin.
    neutral_choices:
      - option_id: D01-A
        choice: Map bounded device capabilities to existing canonical roles.
        consequence: Faster, but every read and command capability and the accepted breadth of each existing role must be explicit.
      - option_id: D01-B
        choice: Create a separately governed device-administration role.
        consequence: Clearer least privilege, but adds role lifecycle, assignment, navigation, RLS/RPC and test change control.
      - option_id: D01-C
        choice: Split routine and high-impact capabilities across roles.
        consequence: Stronger separation, but requires a complete per-command and escalation matrix.
    sponsor_answer:
      option_id: null
      role_to_capability_matrix: null
      rationale: null
    authority_fields:
      canonical_role_reference: null
      governance_change_control_reference: null
    evidence_fields:
      future_RBAC_RLS_RPC_test_reference: null
    prohibited:
      - Inspector or Auditor receives mutation authority.
      - Navigation visibility is treated as server authorization.
      - Device/Mobile Admin appears without canonical meaning.
    validation_refs: [ANS-D01-01, ANS-D01-02, ANS-D01-03, ANS-D01-04, ANS-D01-05]

  - decision_id: DEV-CMD-DEC-02
    subject: Command eligibility and source states
    question: Which role may request each command, and from which device state?
    neutral_choices:
      - option_id: D02-A
        choice: One administrative role owns every eligible command.
        consequence: Simpler operation with broader privilege and misuse impact.
      - option_id: D02-B
        choice: Allocate each command independently by role and source state.
        consequence: Better least privilege with a larger policy/test matrix.
      - option_id: D02-C
        choice: Separate routine requests from exceptional or destructive commands.
        consequence: Faster routine work while restoration, revoke and wipe use stricter paths.
    sponsor_answer:
      option_id: null
      per_command_role_and_source_state_matrix: null
      rationale: null
    authority_fields:
      transition_policy_reference: null
      capability_authority_reference: null
    evidence_fields:
      future_transition_negative_test_reference: null
    prohibited:
      - Ordinary Resume from revoked, wipe_pending or wiped.
      - A command from an undocumented incompatible state.
      - Revocation omitted because current code lacks it.
    validation_refs: [ANS-D02-01, ANS-D02-02, ANS-D02-03, ANS-D02-04, ANS-D02-05]

  - decision_id: DEV-CMD-DEC-03
    subject: Independent approval
    question: Which commands require an independent approver?
    neutral_choices:
      - option_id: D03-A
        choice: No second approval for an otherwise authorized command.
        consequence: Fastest response with the highest single-actor risk; confirmation and audit still apply.
      - option_id: D03-B
        choice: Independent approval for selected high-impact commands.
        consequence: Balanced control; selected commands, approver boundary, expiry and emergencies must be named.
      - option_id: D03-C
        choice: Independent approval for every trust-restoring or destructive command.
        consequence: Strongest separation with slower emergency response and more pending states.
    sponsor_answer:
      option_id: null
      commands_requiring_approval: null
      emergency_or_expiry_behavior: null
      rationale: null
    authority_fields:
      approver_role_and_scope_reference: null
      maker_checker_policy_reference: null
    evidence_fields:
      future_approval_lifecycle_test_reference: null
    prohibited:
      - Requester approves own command when independence is required.
      - Provider/device acknowledgement counts as human approval.
      - Expiry, withdrawal or emergency bypasses audit.
    validation_refs: [ANS-D03-01, ANS-D03-02, ANS-D03-03, ANS-D03-04, ANS-D03-05]

  - decision_id: DEV-CMD-DEC-04
    subject: Terminal states and re-enrollment
    question: Are Revoked and Wiped terminal for the enrolled device identity?
    neutral_choices:
      - option_id: D04-A
        choice: Revoked and Wiped are terminal; return requires new governed enrollment and attestation.
        consequence: Strongest containment with replacement/re-enrollment work.
      - option_id: D04-B
        choice: Revoked may use a separate governed reactivation; Wiped is terminal.
        consequence: Reversible revocation with a distinct process and evidence burden.
      - option_id: D04-C
        choice: Both may use separately governed exceptional reactivation processes.
        consequence: Maximum flexibility with maximum security and audit complexity.
