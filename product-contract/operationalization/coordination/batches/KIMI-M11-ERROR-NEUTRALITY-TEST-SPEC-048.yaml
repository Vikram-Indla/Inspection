hard_boundary:
  - "No actual test, SQL, migration, product, application, database, Data API, provider, design, data, seed, export, branch or stash change."
  - "No real or realistic identifier, secret, OTP, provider payload, credential, person, factory or application row."
  - "No HTTP status, latency threshold, retry value or provider callback response is invented."
  - "The exact final status/message/payload contract must come from accepted corrected packets."
  - "Timing comparison uses only governed equivalence classes; no numeric threshold is specified here."
  - "No implementation or QA lease is issued and zero change is made to the 478-row completion count."
  - "Kimi output remains unaccepted until the locked Mac is unlocked and its response is captured and validated."

neutrality_contract:
  exact_authority_token: VIRTUAL_RESOURCE_NOT_FOUND_OR_OUT_OF_SCOPE
  paired_conditions:
    - MISSING_RESOURCE
    - EXISTING_OUT_OF_SCOPE_RESOURCE
    - EXISTING_RESOURCE_UNAUTHORIZED_ACTION
  equivalent_dimensions:
    - transport_status_class
    - application_error_code_or_token
    - human_message_key_and_rendered_copy
    - payload_schema_and_field_presence
    - body_byte_hash_after_nondeterministic_field_exclusion
    - redirect_or_navigation_result
    - export_artifact_presence_and_metadata
    - provider_invocation_count
    - audit_and_semantic_event_cardinality
    - timing_equivalence_class
    - secret_and_internal_error_absence
  forbidden_disclosures:
    - raw_SQL_error
    - RLS_policy_name_or_predicate
    - function_name_or_internal_signature
    - owner_or_schema_identity
    - extension_or_dependency_detail
    - provider_identifier_endpoint_payload_or_error
    - resource_identifier_or_state
    - row_count_existence_oracle
    - secret_or_secret_derivative
    - stack_trace_or_debug_metadata

