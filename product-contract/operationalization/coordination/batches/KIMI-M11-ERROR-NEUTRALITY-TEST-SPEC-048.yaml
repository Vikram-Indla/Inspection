purpose: >-
  Freeze future M11 tests proving that missing, out-of-scope and unauthorized
  conditions are indistinguishable across UI, governed RPC, Data API, export
  and provider callback boundaries. Cover status, message, payload shape,
  timing class, audit behavior and secret leakage without executing tests or
  selecting implementation details.

