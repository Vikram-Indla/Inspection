expected_result_vocabulary:
  NEUTRAL_EQUIVALENT: "Paired conditions match every required neutrality dimension."
  DENY_NO_ORACLE: "Denied without resource, authority, state, provider or internal detail."
  ZERO_SIDE_EFFECT: "No state, provider attempt, audit, event or export artifact is created."
  SAFE_AUDIT_ONLY: "Only approved non-secret denial fact, if required by final contract, with equal cardinality for paired conditions."
  ZERO_LEAK: "No forbidden disclosure or sentinel appears."
  BLOCKED_CONTRACT: "Case cannot run until exact final public error contract exists."

