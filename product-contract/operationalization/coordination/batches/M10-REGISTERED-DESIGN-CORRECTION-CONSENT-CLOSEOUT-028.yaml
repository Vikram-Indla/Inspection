design_write_lease_order:
  policy:
    - Sponsor consent is recorded separately for each successor; consent is not all-or-nothing.
    - Each surface has exactly one named writer and one exact output filename.
    - A writer may hold only the recorded surface lease; no shared design foundation may be changed.
    - Different named writers may work concurrently only after the first Execution shell/identity checkpoint passes and file collisions are rechecked.
    - A lease expires after one corrected export and evidence return.
    - Codex remains the read-only independent reviewer and never edits the leased design.
  sequence:
    - wave: 1
      surface: WA-DES-003-C1
      reason: Establish the corrected Admin shell, identity, form-state, and evidence pattern.
      start_condition: Sponsor consent plus one named writer.
      checkpoint_before_next_wave:
        - stable identity and approved SAQEEL | صقيل shell
        - no invented policy values or backend behavior
        - responsive, theme, RTL, accessibility, and state evidence scaffold
    - wave: 2
      surfaces: [WA-DES-006-C1, WA-DES-007-C1]
      execution: PARALLEL_ONLY_WITH_DIFFERENT_NAMED_WRITERS_AND_DISTINCT_FILES
      reason: Distinct GIS and Factory Data capabilities with no shared route or output file.
      start_condition: Wave 1 checkpoint passes; individual sponsor consents and collision checks recorded.
    - wave: 3
      surface: WA-DES-008-C1
      reason: Confirm Factory Data child-route separation before finalizing Integration Hub information architecture.
      start_condition: WA-DES-007-C1 route/authority separation passes independent review.
  writer_register:
    - surface: WA-DES-003-C1
      named_designer: null
      status: REQUIRED_BEFORE_LEASE
    - surface: WA-DES-006-C1
      named_designer: null
      status: REQUIRED_BEFORE_LEASE
    - surface: WA-DES-007-C1
      named_designer: null
      status: REQUIRED_BEFORE_LEASE
    - surface: WA-DES-008-C1
      named_designer: null
      status: REQUIRED_BEFORE_LEASE

shared_design_return_contract:
  required_for_every_surface:
    - Exact stable successor ID, title, filename, route, and predecessor lineage.
    - New export byte size and SHA-256 fingerprint.
    - Predecessor-versus-successor comparison and explicit removed-invention list.
    - Component, capability, permission, data, state, interaction, error, and evidence annotations.
    - English/LTR and Arabic/RTL with qualified native-Arabic review.
    - Light and dark themes.
    - Desktop, tablet landscape, tablet portrait, 412, 390, and 320 reflow.
    - Keyboard-only, visible focus, 44px targets, programmatic labels, status semantics, 200 percent zoom, and 400 percent or equivalent reflow.
    - Loading, populated, empty, unauthorized, degraded, failure, conflict, and provider/policy-held states relevant to the route.
    - A truthful gap register distinguishing existing runtime behavior from design-required future implementation.
  automatic_return:
    - Missing required evidence
    - Any P0 gate failure
    - Any P1 gate failure
    - Identity or file collision
    - Unrecorded writer change
    - Live design mutation outside the leased file
    - Claim of design acceptance, implementation readiness, or module completion

browser_evidence_prerequisites:
  design_review_browser_evidence:
    - Render the corrected export at its fixed comparison viewport in a controlled browser/font environment.
    - Capture all required responsive viewports in English and Arabic, light and dark.
    - Capture keyboard focus, validation/error, denied, empty, degraded, provider-held, and conflict states.
    - Compare predecessor and successor at equal fidelity; list every intentional difference.
    - Record browser version, viewport, locale, direction, theme, font, timestamp, export SHA-256, and screenshot SHA-256.
    - Verify no horizontal task loss, peeking navigation, clipped identifiers, or inaccessible full values.
  application_browser_evidence_later:
    rule: >-
      Actual application browser evidence is mandatory only after a separately
      approved implementation lease. It must use the real route, RLS-scoped
      test personas, source-backed data, negative paths, refresh persistence,
      audit where applicable, and provider-unavailable states.
    prohibition: >-
      Claude Design screenshots are appearance evidence only. They cannot prove
      application wiring, authorization, persistence, audit, concurrency,
      provider integration, tests, or implementation parity.
  acceptance_boundary:
    - Design browser evidence may support READY_FOR_DESIGN_REVIEW only.
    - Application browser evidence plus tests is required before implementation acceptance.
    - Neither evidence class exists for these successors at closeout time.

