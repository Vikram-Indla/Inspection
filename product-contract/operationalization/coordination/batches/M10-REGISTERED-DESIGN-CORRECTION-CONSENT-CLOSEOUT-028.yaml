post_consent_control_flow:
  - Record the sponsor decision separately for each successor.
  - Record one named designer and exact file ownership for each approved surface.
  - Recheck identity, filename, and concurrent-writer collisions immediately before design access.
  - Issue only the surface-specific lease; retain all P0/P1 gates.
  - Receive one export and evidence package.
  - Independently review without editing the design.
  - Return, reject, or recommend sponsor acceptance.
  - Update frozen mapping only through a separately approved change-control task.
  - Issue an implementation lease only after accepted design authority and exact non-overlapping file ownership.

