mapping_change_after_acceptance_only:
  remove:
    - logical_id: WA-DES-023
      route: /admin/violations
      reason: "Operational Enforcement is not configuration authority."
  add:
    - logical_id: WA-DES-015
      revision: WA-DES-015-C1
      route: /admin/violations
      mode: VIOLATION_REGISTER
    - logical_id: "<APPROVED-NEW-LOGICAL-ID>"
      revision: "<APPROVED-NEW-LOGICAL-ID>-C1"
      route: "/admin/violations?mode=penalty"
      mode: PENALTY_MAPPING
  rule: "No frozen mapping is changed by this packet or before exact design acceptance."

rollback:
  design: >-
    New authority has no predecessor. Reject it and leave it non-consumable;
    keep the current implementation and existing accepted design mappings
    unchanged. A retry receives C2 under the same approved logical ID.
  mapping: "Do not apply the proposed mapping until acceptance; pre-acceptance rollback is no-op."
  implementation: >-
    No implementation occurs here. A later lease must retain the current route,
    components and guarded backend functions or a proven feature-flag rollback.

queued_successor:
  packet: M9-PACKAGE-DESIGNER-NO-CODE-MATCH-RESOLUTION-019
  status: READY_READ_ONLY_AFTER_THIS_REVIEW
  logical_id: WA-DES-005
  route: "/admin/packages/:id/designer"
  current_validation: NO_CODE_MATCH
  objective: >-
    Decide whether the accepted form-builder capability remains inline at
    /admin/packages or requires the missing dedicated route, without design or
    product writes.

recommendation:
  reviewer_disposition: BLOCK_DUE_TO_MISSING_DESIGN_ID_AND_ROUTE_CONTRACT
  approve_now:
    - "Approve the semantic separation and requirement/component mapping."
    - "Approve KEEP_CURRENT_QUERY_MODE_FOR_MVP1 if governance accepts the recommendation."
  do_not_approve_now:
    - "Design creation."
    - "Logical ID or filename invented by a worker."
    - "Frozen mapping change, route implementation or product modification."
    - "Completion-score increase."
  completion_score_change: 0
  real_browser_proof_ready: false

stop_conditions:
  - "A logical ID, route, filename, legal value or penalty policy is invented."
  - "Operational Enforcement is included in configuration authority."
  - "The current query-mode route is changed without approval."
  - "Any current RLS/RBAC, maker-checker, audit, version, immutable reference, conflict, dependency or snapshot behavior is removed or weakened."
  - "A design is created before all P0 blocks close."
  - "Any P1 state, responsive, Arabic/RTL or accessibility evidence is missing."
  - "Human acceptance is absent."
