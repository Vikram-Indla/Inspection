    This is a new design authority, not a C-suffix successor. A C1 suffix may be
    used only after a new logical ID is assigned; it denotes the first revision
    of that new screen.
  proposed_title: "SAQEEL Penalty Mapping"
  exact_filename_pattern: "SAQEEL Penalty Mapping - <APPROVED-LOGICAL-ID>-C1.dc.html"
