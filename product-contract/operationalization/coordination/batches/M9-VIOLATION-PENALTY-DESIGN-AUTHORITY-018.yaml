semantic_separation:
  configuration:
    data:
      - "violation_codes"
      - "penalty_mappings"
      - "regulation_clauses"
      - "inspection_items trigger references"
      - "published/locked configuration_templates"
    actions:
      - "Create violation-code draft."
      - "Publish violation code through maker-checker."
      - "Deactivate violation code with reason."
      - "Create one penalty-mapping draft for a violation."
      - "Publish penalty mapping through maker-checker."
    outcome: "Versioned configuration consumed later by inspection/review/enforcement."
  operational_enforcement:
    data:
      - "runtime violations"
      - "cases"
      - "objections"
      - "notices and decisions"
    actions:
      - "Issue, review, decide, object or execute an operational enforcement outcome."
    exclusion: "No operational action appears in the configuration design."
  inspector_boundary:
    rule: >-
      Inspectors consume configured violation and penalty context. They never
      author, override, publish or deactivate the configuration.

canonical_capability_mapping:
  - requirement_ids: ["CR-451", "CR-474"]
    owner: VIOLATION_CONFIGURATION
    behavior:
      - "Define violation code, source clause, configured level, corrective action, grace rule, applicability and effective dates."
      - "Link a configured non-compliant response to a violation."
      - "Generated violation is not inspector-overridable."
  - requirement_ids: ["CR-452"]
    owner: PENALTY_MAPPING
    behavior:
      - "One violation has one active penalty mapping."
      - "Penalty type, optional amount, timing, legal basis and linked template are record-sourced."
      - "Penalty is information during inspection and issued only through later approval."
  - requirement_ids: ["CR-456", "CR-457", "CR-475"]
    owner: PENALTY_MAPPING_WITH_TEMPLATE_DEPENDENCY
    behavior:
      - "Select only a governed active template version."
      - "Record action-form trigger and whether completion is mandatory."
      - "Do not author the template inside this screen."
  - requirement_ids: ["CR-458", "CR-459", "CR-462", "CR-463"]
    owner: SHARED_CONFIGURATION_LIFECYCLE
    behavior:
      - "Draft/publish/version/deactivate/audit with immutable historical references."
  - requirement_ids: ["CR-460"]
    owner: DEPENDENCY_VALIDATION
    behavior:
      - "Block publication when violation, legal basis, mapping cardinality, template or effective-period dependencies fail."
  - requirement_ids: ["CR-461"]
    owner: IMPACT_AND_USAGE_EVIDENCE
    behavior:
      - "Show source-backed item/runtime/template usage or explicitly state unavailable."

violation_registry_companion_contract:
  route: /admin/violations
  design: WA-DES-015-C1
  regions:
    - "Search/filter catalogue and source-bound read timestamp."
    - "Code/title, configured level, lifecycle, category/applicability and source-clause trace."
    - "Trigger trace from item response mappings."
    - "Configuration version history, usage and object-scoped audit."
    - "Writer-only draft creation, publication and deactivation."
    - "Penalty mapping status and route handoff without exposing operational Enforcement."
  truth_rules:
    - "Lifecycle is derived from active_from/active_to and the observation date."
    - "Legal basis belongs to Penalty Mapping, never the violation-code row."
    - "Configured level, corrective action and grace are record fields; no values are invented."
    - "Usage/audit unavailable is not zero."

penalty_mapping_new_authority_contract:
  route: "/admin/violations?mode=penalty"
  screen: SCR-ADM-041
  page_structure:
    - region: MODE_CONTEXT
      content:
        - "Violation Catalogue and Penalty Mapping route modes with correct tab/link semantics."
        - "Clear label: configuration control plane, not operational Enforcement."
    - region: VALIDATION_LENS
      content:
        - "One active mapping per violation."
        - "A second mapping is rejected."
        - "Legal basis must be supplied from an approved source."
        - "Range/repeat choices are governed tokens, never inferred amounts or legal text."
    - region: VIOLATION_CONTEXT
      content:
        - "Source-bound violation code/title, configured level and effective lifecycle."
        - "Regulation-clause trace; no legal basis copied onto the code row."
    - region: MAPPING_LIFECYCLE
      content:
        - "Unmapped, draft awaiting distinct approver, published/locked and deactivated/expired states."
        - "Mapping version, effective period, predecessor and immutable reference status."
    - region: PENALTY_DEFINITION
      content:
        - "Penalty reference and type."
        - "Amount only when the record explicitly contains one."
        - "Grace/due values only when configured."
        - "Required legal basis."
        - "Governed range and repeat preset identifiers."
        - "Optional immutable template-version reference and action-form requirement."
    - region: IMPACT_AUDIT
      content:
        - "Item/runtime/template usage evidence without row leakage."
        - "Object-scoped immutable audit or explicit permission/unavailable state."
    - region: GUARDED_ACTIONS
      content:
        - "Create draft for verified Compliance/Form writers."
        - "Approve/publish only by a distinct authorized writer."
        - "No edit action on published/locked mapping."
  interaction_rules:
    - "Select one unmapped violation; do not allow duplicate active/draft mapping."
    - "Choose only configured governed presets and templates returned by the real service."
    - "Never prefill legal basis, amount, grace, due period, severity or action."
    - "Preserve entered values after validation or service failure."
    - "Focus the error summary/result after submission and return focus predictably."
    - "No operational issue, notice, fine, case or enforcement-decision action."

existing_behavior_to_preserve:
  application_routes:
    - /admin/violations
    - "/admin/violations?mode=penalty"
  route_guard_and_roles:
    read: "Authenticated access only as current route and RLS permit."
    write: "Compliance Admin or Form Admin; route visibility never grants write authority."
    permission_failure: "Fail closed and disable/hide writes."
  violation:
    - "Unique code and required regulation-clause anchor."
    - "Configured level, corrective action, grace, category, applicability, effective dates and configuration version."
    - "Draft creation, maker-checker publication, successor effective-date guard and reasoned deactivation."
    - "Derived active/future/deactivated lifecycle."
    - "Trigger trace, usage evidence and object-scoped audit."
  penalty:
    - "One-to-one violation mapping enforced by database uniqueness."
    - "Required penalty reference, mapping version, legal basis, penalty type and governed range/repeat presets."
    - "Optional amount, grace, due period and immutable template-version reference only when explicitly configured."
    - "One active and one draft lifecycle guards where proven by the current database."
    - "Distinct maker/checker publication through the existing guarded RPC."
    - "Exact mapping-version reference retained by inspections and published package snapshots."
    - "Audit history remains immutable and object-scoped."
  stale_and_conflict:
    - "Surface current unique, effective-period, maker-checker and guarded-publication conflicts."
    - "Do not claim an optimistic version token unless independently proven."
    - "Any later-proven stale-write guard must be preserved and represented before acceptance."
  dependency:
    - "Missing or inactive clause/template/reference blocks the affected action."
    - "Published package validation continues to require valid violation and penalty snapshots."

prohibited_invention:
  values:
    - "No legal action, enforcement outcome, penalty issuance or approval decision."
    - "No penalty amount, currency, range, repeat escalation or due/grace period."
    - "No severity band, configured level value, corrective action or applicability."
    - "No legal basis, authority, clause, provider, template or source identifier."
    - "No score, weight, threshold, SLA, risk, health or KPI semantic."
    - "No connected-provider, current-data, zero-count or transaction guarantee without evidence."
  presentation_rule: >-
    Design frames may show labelled placeholders such as Not configured,
    Required, Unavailable or Source-bound value. They may not fabricate a
    realistic-looking example and then label the entire screen illustrative.

required_state_matrix:
  common:
    - id: LOADING
      rule: "Preserve mode context and announce progress."
    - id: AUTHORIZED_POPULATED
      rule: "Source-backed rows and values only."
    - id: VERIFIED_ZERO
      rule: "Successful read with no violation codes or mappings."
    - id: READ_ERROR
      rule: "Neutral error, unknown count, retry; no stale data presented as current."
    - id: UNAUTHORIZED
      rule: "No row, count, legal or penalty leakage."
    - id: READ_ONLY
      rule: "Explain role boundary; no misleading disabled write path."
    - id: PERMISSION_CHECK_FAILED
      rule: "Fail closed and offer retry."
    - id: STALE_CONFLICT
      rule: "Reject overwrite/publication conflict, preserve input and offer reload/compare."
    - id: VALIDATION_ERROR
      rule: "Summary links to each field; first summary receives focus."
    - id: PROVIDER_OR_DEPENDENCY_UNAVAILABLE
      rule: "Disable affected authoring while preserving safe read/navigation."
  violation:
    - "No regulation clauses; creation unavailable."
    - "Duplicate code."
    - "Invalid configured grace/effective/version input."
    - "Future, active and deactivated derived lifecycle."
    - "Same maker/checker and successor-date rejection."
    - "Missing deactivation reason or already inactive conflict."
    - "Usage/audit unavailable versus verified zero."
  penalty:
    - "No violation codes to map."
    - "Unmapped violation."
    - "Draft awaiting distinct approver."
    - "Published/locked mapping is immutable."
    - "Duplicate/second mapping rejected."
    - "Missing legal basis, reference, version or penalty type."
    - "Governed preset or template registry unavailable."
    - "Invalid optional amount, grace or due input."
    - "Overlapping/invalid effective period."
    - "Same maker/checker and guarded publish failure."
    - "Mapping audit/usage unavailable versus verified zero."
    - "Exact snapshot/version reference unavailable."

