correction_request:
  title: "WA-DES-045 — CR-053 read-only Planning Visit List"
  objective: >
    Produce one source-faithful, code-ready design revision for the read-only
    CR-053 list slice without importing CR-071 actions or prototype policies.
  preserve:
    - SAQEEL premium density and visual language
    - stable visit ID/reference
    - factory identity
    - planning status and operational state as visibly separate row fields
    - inspector and visit window
    - open_read_only_detail affordance
    - RLS/access-controlled truth label
  replace_KPIs:
    remove:
      - Executing_now
      - Expiring_within_48_hours
    add_or_retain_in_exact_order:
      - Draft
      - Published
      - Returned
      - Cancelled
      - Expired
    semantics:
      Draft: "planning_status draft plus internal validated"
      Published: "planning_status published"
      Returned: "planning_status returned"
      Cancelled: "planning_status cancelled"
      Expired: "planning_status expired"
    prohibited_grain:
      - operational_state
      - inspection_status
      - unsupported_time_threshold
    interaction: "Selecting a KPI preserves search/non-status filters and resets page to 1."
  search:
    visible_dimensions:
      - Visit_ID_or_reference
      - Factory_Name
      - CR_Number
      - Industrial_License
      - Inspector
    behavior_notes:
      - case_insensitive_partial_match
      - RLS_scoped
      - URL_backed
      - error_is_unavailable_not_zero_results
  filters:
    required:
      - Planning_Status
      - Business_Visit_Type
      - Region
      - City
      - Visit_Window
      - Inspector
    behavior_notes:
      - all_active_filters_combine_with_AND
      - city_options_follow_region
      - criteria_change_resets_page_to_1
      - selected_criteria_survive_refresh
      - option_source_failure_is_explicit
  list:
    minimum_columns:
      - Visit_reference
      - Factory_name_and_factory_code
      - Business_Visit_Type
      - Planning_Status
      - Operational_State
      - Inspector
      - Visit_Window
      - Last_Update_when_source_backed
    allowed_interactions:
      - sort
      - previous_page
      - next_page
      - open_read_only_dossier
    remove:
      - row_checkbox
      - select_all
      - bulk_action_bar
      - inline_edit
    pagination_notes:
      - page_size_25
      - exact_total
      - exact_page_count
      - stable_sort_plus_visit_ID_tiebreak
      - no_gap_or_duplicate
      - out_of_range_request_resolves_to_last_valid_page

required_hard_states:
  - state_id: CR053-STATE-LOADING
    behavior: "Non-interactive list/KPI/filter skeleton with no stale fixture values."
  - state_id: CR053-STATE-RLS-ZERO
    behavior: "No planned visits are visible in the authorized scope."
  - state_id: CR053-STATE-NO-MATCH
    behavior: "No result; active search and filters stay visible with Reset."
  - state_id: CR053-STATE-DATA-UNAVAILABLE
    behavior: "Counts and list unavailable; never render zero counts as success."
  - state_id: CR053-STATE-OPTIONS-UNAVAILABLE
    behavior: "Required filter options unavailable; never silently shorten them."
  - state_id: CR053-STATE-UNAUTHORIZED
    behavior: "Neutral authorized-role-required state with no row/count disclosure."
  - state_id: CR053-STATE-OUT-OF-RANGE
    behavior: "Resolve to last valid page, not false empty."

