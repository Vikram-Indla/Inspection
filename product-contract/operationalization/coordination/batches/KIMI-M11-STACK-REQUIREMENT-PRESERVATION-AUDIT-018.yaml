preservation_ledger:
  scheduling:
    requirement_ids: [CR-338, CR-339, CR-340, CR-343]
    valid_behavior_to_preserve:
      - "Only authenticated contract-authorized actors schedule a published virtual visit."
      - "Representative name remains mandatory and binds the representative participant."
      - "Assigned Inspector participant is retained when an assignment exists."
      - "Existing-session uniqueness and deterministic retry/conflict behavior remain."
      - "The scheduled timeline/audit fact is created before meeting connection."
      - "Workflow status remains unchanged during virtual-session initialization."
      - "Plausible-date validation remains additive to the new canonical visit-window guard."
    remediation_effect:
      "010": "Moves session and initial participants into one authorized transaction."
      "011": "Adds appointment/live-window validation without changing advance scheduling."
      "013": "Removes direct creation/mutation bypasses after the governed RPC exists."
      "014": "No scheduling ownership."
      "015": "Redacts audit reads without deleting source creation evidence."
    regression_gate_ids:
      - M11-PRES-SCH-001
      - M11-PRES-SCH-002
      - M11-PRES-SCH-003
      - M11-PRES-SCH-004

  reschedule_and_cancel:
    requirement_ids: [CR-341, CR-342, CR-343]
    valid_behavior_to_preserve:
      - "Reschedule is limited to scheduled/waiting and loses a concurrent join race."
      - "Reschedule uses the accepted visit window after 011."
      - "Close/cancel requires a non-empty reason; comments and reason remain audited."
      - "A closed session remains immutable and cannot transition backward."
    remediation_effect:
      "011": "Adds the same canonical window guard to reschedule/execution boundaries."
      "013": "Keeps only governed role/state mutations."
      "015": "Preserves safe reason/timeline visibility without raw whole-row output."
    regression_gate_ids:
      - M11-PRES-RSC-001
      - M11-PRES-RSC-002
      - M11-PRES-CAN-001
      - M11-PRES-CAN-002

  otp_and_verification:
    requirement_ids: [CR-349, CR-350, CR-351, CR-352, CR-353, CR-354]
    valid_behavior_to_preserve:
      - "Assigned Inspector can request, inspect governed status and verify a representative."
      - "Accepted OTP engine settings remain source-backed and unchanged."
      - "Cooldown, expiry, attempts, resend limits and provider settings are not redefined by remediation."
      - "Verification succeeds only through the governed RPC and advances the canonical operational state atomically."
      - "Failed verification cannot start inspection."
      - "Verification time, method and representative facts remain available as safe Reviewer audit evidence."
      - "No OTP code, code_hash, dev_code or raw verification_record reaches the client."
    remediation_effect:
      "013": "Restricts execution to the contract-authorized Inspector path and removes direct verification-column DML."
      "014": "Retains verification/readiness as begin preconditions."
      "015": "Preserves the safe verification business fact while redacting secrets."
    intentional_security_correction:
      current_behavior: >-
        Existing cd-042 status proof treats Planner as an authorized staff
        caller. RBAC-007 authorizes planning actions but not representative
        identity verification; CR-349 through CR-352 assign the action to
        Inspector.
      disposition: >-
        Planner/Operations/Reviewer OTP execution or status access is not
        protected as valid behavior without new sponsor authority. The old
        planner-positive test must be replaced by assigned-Inspector positive
        proof, not silently retained or counted as a regression.
    regression_gate_ids:
      - M11-PRES-OTP-001
      - M11-PRES-OTP-002
      - M11-PRES-OTP-003
      - M11-PRES-OTP-004
      - M11-PRES-OTP-005

  participant_join_and_waiting:
    requirement_ids: [CR-344, CR-345, CR-346]
    valid_behavior_to_preserve:
      - "Assigned Inspector can open the waiting room in the canonical state."
      - "Inspection cannot begin before the representative is joined and verified."
      - "Inspector and representative join timestamps remain persisted and auditable."
      - "A repeated join is idempotent and cannot duplicate the semantic join fact."
      - "Meeting-provider identity remains transparent to the business surface."
    remediation_effect:
      "011": "Adds authoritative live-window enforcement."
      "014": "Makes participant join, session advance and event one transaction."
      "013": "Removes direct joined_at mutation while retaining the governed join RPC."
      "015": "Allows the existing join fact only from the governed writer."
    regression_gate_ids:
      - M11-PRES-JOIN-001
      - M11-PRES-JOIN-002
      - M11-PRES-JOIN-003
      - M11-PRES-JOIN-004

  audit_and_timeline:
    requirement_ids: [CR-339, CR-343, CR-346, CR-347, CR-348, CR-353]
    valid_behavior_to_preserve:
      - "Immutable source audit rows remain append-only and are never rewritten by redaction."
      - "Authorized Reviewer/audit personas retain session-scoped safe history."
      - "Creation, state, join, verification, close and begin facts remain correlated to actor/object/time."
      - "Rolled-back or denied operations never appear as successful semantic events."
      - "Closed-session immutability remains enforced."
    remediation_effect:
      "010": "Preserves trigger-generated creation audit inside the transaction."
      "014": "Writes join/begin semantic facts inside their transaction."
      "013": "Prevents direct DML from forging verification/join facts."
      "015": "Uses an explicit safe projection and rejects arbitrary event append."
    not_yet_proven:
      - "Provider-originated leave, disconnect and reconnect event ingestion for CR-347/CR-348."
      - "Complete meeting audit cannot be certified until the provider event contract exists."
    regression_gate_ids:
      - M11-PRES-AUD-001
      - M11-PRES-AUD-002
      - M11-PRES-AUD-003
      - M11-PRES-AUD-004
      - M11-PRES-AUD-005

  notifications:
    requirement_ids: [CR-338, CR-350]
    valid_behavior_to_preserve:
      - "Scheduling notification is attempted only after the core creation transaction commits."
      - "Reschedule and close notifications retain truthful post-mutation behavior."
      - "Inspector notification recipient remains the assigned Inspector."
      - "Factory representative SMS remains honestly not_configured when no adapter/credential exists."
      - "Notification failure never rolls back a valid core transaction or claims delivery."
      - "No remediation invents a provider response."
    remediation_effect:
      "010": "Keeps scheduling notifications post-commit and reports degradation."
      "011": "Does not alter notification provider semantics."
      "014": "Keeps join/begin success separate from post-commit notification degradation."
      "013": "No notification ownership."
      "015": "Prevents secrets/raw errors from entering rendered evidence or logs."
    regression_gate_ids:
      - M11-PRES-NTF-001
      - M11-PRES-NTF-002
      - M11-PRES-NTF-003
      - M11-PRES-NTF-004

  rls_and_role_scope:
    requirement_ids: [CR-338, CR-348, CR-349, CR-350, CR-351, CR-352, CR-353, CR-355]
    valid_behavior_to_preserve:
      - "Planner/Operations retain only canonical scheduling/management scope."
      - "Assigned Inspector retains own-session execution scope."
      - "Unassigned Inspector retains no access to another visit/session."
      - "Reviewer retains audit/review visibility without execution mutation."
      - "Auditor remains view-only."
      - "All proof uses ordinary authenticated persona sessions and RLS."
    remediation_effect:
      "010": "Corrects creation authorization."
      "014": "Enforces Inspector-only join/begin authority."
      "013": "Separates SELECT from governed mutation and closes broad FOR ALL bypasses."
      "015": "Makes missing and out-of-scope resource responses neutral."
    regression_gate_ids:
      - M11-PRES-RLS-001
      - M11-PRES-RLS-002
      - M11-PRES-RLS-003
      - M11-PRES-RLS-004
      - M11-PRES-RLS-005

  inspector_execution_handoff:
    requirement_ids: [CR-354, CR-355, CR-356]
    valid_behavior_to_preserve:
      - "Verification updates operational state while workflow status remains unchanged."
      - "Only assigned Inspector can begin execution."
      - "Confirmed readiness and frozen package remain mandatory."
      - "The Ready-created inspection row is reused; no parallel inspection is created."
      - "Visit enters executing through canonical set_operational_state authority."
      - "Inspection, visit, virtual session and begin event commit together."
      - "Redirect occurs only after commit to the common field execution engine."
      - "No virtual-specific execution fork exists after handoff."
    remediation_effect:
      "011": "Adds database-time window enforcement."
      "014": "Removes tolerant/direct CAS fallback and makes begin atomic."
      "013": "Closes non-Inspector direct mutation."
      "015": "Preserves safe begin audit without changing execution."
    regression_gate_ids:
      - M11-PRES-INS-001
      - M11-PRES-INS-002
      - M11-PRES-INS-003
      - M11-PRES-INS-004
      - M11-PRES-INS-005

  maker_checker_and_adjacent_engines:
    requirement_ids: []
    protected_contracts:
      - "Request creator cannot review/approve/publish the same request."
      - "Submitted revisions and published versions remain immutable."
      - "Review decisions/comments remain append-only and audited."
      - "Publication remains transactional and rejects orphan branches."
      - "M11 migrations do not alter compliance, review, maker-checker or publication tables/policies/functions."
    rationale: >-
      WA-M11-AC-005 requires protected backend, workflow, audit, version and
      maker-checker regression even though these are adjacent contracts rather
      than CR-338 through CR-356.
    regression_gate_ids:
      - M11-PRES-MKC-001
      - M11-PRES-MKC-002
      - M11-PRES-MKC-003

exact_regression_gates:
  - id: M11-PRES-SCH-001
    proof: "Authorized Planner, Operations and assigned Inspector each create one complete isolated session graph through the governed RPC."
  - id: M11-PRES-SCH-002
    proof: "Non-virtual, unpublished, missing representative, missing assignment where required, duplicate and invalid-date fixtures fail with zero partial rows/audit."
  - id: M11-PRES-SCH-003
    proof: "Appointment at both inclusive boundaries succeeds; before/after fails; advance scheduling remains possible before the live window."
  - id: M11-PRES-SCH-004
    proof: "Scheduled timeline/audit fact exists once and workflow status is unchanged."
  - id: M11-PRES-RSC-001
    proof: "Reschedule before join succeeds; concurrent join wins safely; post-join reschedule fails."
  - id: M11-PRES-RSC-002
    proof: "Reschedule preserves truthful Inspector/factory notification outcomes."
  - id: M11-PRES-CAN-001
    proof: "Close/cancel rejects blank reason and preserves reason/comments in safe immutable history."
  - id: M11-PRES-CAN-002
    proof: "Closed session rejects every backward/edit mutation and keeps its prior audit."
  - id: M11-PRES-OTP-001
    proof: "Assigned Inspector request/status/verify happy path succeeds using separate isolated participant fixtures."
  - id: M11-PRES-OTP-002
    proof: "Accepted engine settings checksum is unchanged; cooldown/expiry/attempt behavior still reads the source-backed settings row."
  - id: M11-PRES-OTP-003
    proof: "Invalid/expired/reused code cannot verify or begin and produces no false success event."
  - id: M11-PRES-OTP-004
    proof: "Verified transition and its semantic fact are atomic and idempotent."
  - id: M11-PRES-OTP-005
    proof: "Reviewer sees safe verification time/method/representative evidence but cannot mutate it."
  - id: M11-PRES-JOIN-001
    proof: "Assigned Inspector opens waiting only from scheduled and only inside the canonical live window."
  - id: M11-PRES-JOIN-002
    proof: "Join atomically persists participant time, advances state and records one event."
  - id: M11-PRES-JOIN-003
    proof: "Repeated/concurrent join returns deterministic state without duplicate event."
  - id: M11-PRES-JOIN-004
    proof: "Begin remains blocked while representative join/verification/readiness is incomplete."
  - id: M11-PRES-AUD-001
    proof: "Immutable audit source before/after checksums and row counts remain unchanged by redaction."
  - id: M11-PRES-AUD-002
    proof: "Authorized session audit returns safe creation/state/join/verification/close/begin facts."
  - id: M11-PRES-AUD-003
    proof: "Denied and rolled-back operations create no semantic success fact."
  - id: M11-PRES-AUD-004
    proof: "Secret sentinels are absent from RPC JSON, server response, DOM, console, logs and evidence."
  - id: M11-PRES-AUD-005
    proof: "Arbitrary append is denied while governed existing event names continue once."
  - id: M11-PRES-NTF-001
    proof: "Core scheduling commit survives isolated notification failure and returns explicit degradation."
  - id: M11-PRES-NTF-002
    proof: "A failed core transaction creates no scheduling notification."
  - id: M11-PRES-NTF-003
    proof: "Missing provider/credential stores or reports not_configured; no delivered/sent claim appears."
  - id: M11-PRES-NTF-004
    proof: "Reschedule/close preserve existing recipient, payload correlation and truthful post-commit behavior."
  - id: M11-PRES-RLS-001
    proof: "Ordinary Planner/Operations sessions retain canonical management paths but cannot OTP-verify, join or begin."
  - id: M11-PRES-RLS-002
    proof: "Assigned Inspector retains owned scheduling/OTP/join/begin paths with no direct governed-column DML."
  - id: M11-PRES-RLS-003
    proof: "Reviewer/Auditor retain safe read/audit scope and no mutation."
  - id: M11-PRES-RLS-004
    proof: "Unassigned Inspector missing/out-of-scope pairs are neutral and mutate nothing."
  - id: M11-PRES-RLS-005
    proof: "Catalog scan finds no service_role, BYPASSRLS, broad FOR ALL restoration or anonymous grant."
  - id: M11-PRES-INS-001
    proof: "Only assigned Inspector begins; Planner/Operations/Reviewer/unassigned paths leave all records unchanged."
  - id: M11-PRES-INS-002
    proof: "Begin requires verified state, confirmed readiness and the canonical window."
  - id: M11-PRES-INS-003
    proof: "Ready-created inspection is reused and its frozen package is unchanged."
  - id: M11-PRES-INS-004
    proof: "Inspection/visit/session/begin-event transition is atomic under forced failure and concurrency."
  - id: M11-PRES-INS-005
    proof: "Post-commit redirect reaches the existing common field execution route and submission flow."
  - id: M11-PRES-MKC-001
    proof: "compliance-request-engine maker-checker, immutability, append-only decision and transactional publication tests pass unchanged."
  - id: M11-PRES-MKC-002
    proof: "compliance-approval-queue creator exclusion, database authority and no-direct-decision-write tests pass unchanged."
  - id: M11-PRES-MKC-003
    proof: "Migration-diff/catalog allowlist proves zero M11 change to adjacent compliance/review/version/publication objects."

