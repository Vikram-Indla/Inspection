expected_result_vocabulary:
  BLOCKED_NOT_RUN: "Positive callback case cannot execute until the provider contract is approved and configured."
  AUTH_DENY_NEUTRAL: "Authentication denied before resource lookup; neutral public result."
  REPLAY_DENY_NEUTRAL: "Replay denied without resource or prior-event disclosure."
  BINDING_DENY_NEUTRAL: "Wrong authority/session/participant/request binding denied without existence disclosure."
  IDEMPOTENT: "Repeated accepted logical callback has no additional state or event effect."
  ONE_WINNER: "Exactly one concurrent callback commits the authoritative effect."
  ZERO_SIDE_EFFECT: "No state, provider, audit or semantic event effect."
  ROLLBACK_CLEAN: "No callback, state, audit or event residue remains."
  ZERO_LEAK: "No secret, signature, nonce, payload, provider metadata or internal error exposed."
  ONE_SAFE_EVENT: "Exactly one approved safe semantic callback fact for one committed effect."

