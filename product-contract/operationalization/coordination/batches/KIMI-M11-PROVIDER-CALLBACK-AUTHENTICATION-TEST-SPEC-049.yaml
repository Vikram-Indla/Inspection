hard_boundary:
  - "No actual test, SQL, migration, product, application, database, provider, network, design, data, seed, branch or stash change."
  - "No provider, signature algorithm, key format, secret, nonce, timestamp window, replay horizon, retry value or callback endpoint is invented."
  - "No tenant model is asserted. Wrong-tenant cases remain authority-partition cases until the accepted contract defines tenancy."
  - "No positive provider delivery or callback-completion claim while provider authority/configuration is absent."
  - "All payloads, signatures, secrets, timestamps, nonces and identities are symbolic classes."
  - "No implementation or QA lease is issued and zero change is made to the 478-row completion count."
  - "Kimi output remains unaccepted until the locked Mac is unlocked and its response is captured and validated."

callback_contract_unknowns:
  authentication_mechanism: BLOCKED_UNTIL_APPROVED_PROVIDER_CONTRACT
  signature_algorithm_and_canonicalization: BLOCKED_UNTIL_APPROVED_PROVIDER_CONTRACT
  timestamp_acceptance_window: BLOCKED_UNTIL_APPROVED_PROVIDER_CONTRACT
  nonce_format_and_retention: BLOCKED_UNTIL_APPROVED_PROVIDER_CONTRACT
  replay_retention: BLOCKED_UNTIL_APPROVED_PROVIDER_CONTRACT
  secret_rotation_overlap: BLOCKED_UNTIL_APPROVED_PROVIDER_CONTRACT
  authority_partition_or_tenant_model: BLOCKED_UNTIL_APPROVED_PROVIDER_CONTRACT
  delivery_event_semantics: BLOCKED_UNTIL_APPROVED_PROVIDER_CONTRACT
  callback_response_contract: BLOCKED_UNTIL_APPROVED_PROVIDER_CONTRACT

security_invariants:
  - "Authentication and payload integrity are verified before any resource lookup or mutation."
  - "Missing, invalid, stale, replayed or wrong-scope authentication cannot become a resource-existence oracle."
  - "The authenticated provider identity is bound to the exact approved provider/authority partition."
  - "The authenticated payload is bound to the exact callback event, logical provider request, session and participant."
  - "A callback cannot override canonical session/participant state or immutability."
  - "One logical callback produces at most one authoritative state effect and one semantic event."
  - "Rotation never creates a period where no secret or every secret is accepted."
  - "Provider technical identity cannot read tables, audit, exports or application resources outside the exact machine contract."
  - "Raw provider payload, signature material, secret, nonce and technical error are never exposed to application personas or evidence."

