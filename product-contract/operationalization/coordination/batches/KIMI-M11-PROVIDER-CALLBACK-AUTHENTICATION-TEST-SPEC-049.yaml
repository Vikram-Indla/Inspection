evidence_contract:
  required_metadata:
    - run_id
    - case_id
    - frozen_authority_hashes
    - approved_provider_contract_version
    - code_commit
    - migration_chain_hash
    - symbolic_identity_class
    - logical_callback_correlation_hash
    - result
    - independent_reviewer
  required_outputs:
    - authentication_freshness_and_binding_result
    - resource_lookup_and_mutation_counts
    - idempotency_and_replay_result
    - state_before_after
    - audit_and_semantic_event_cardinality
    - normalized_response_and_timing_class
    - secret_provider_payload_and_internal_error_scan
    - rollback_or_teardown_result
