  policies:
    - "Inventory audit_read, audit_read_compliance and every catalog-discovered permissive audit_events SELECT policy."
    - "Replace all overlapping paths; permissive policies combine with OR."
    - "Unrelated maker-checker/general audit objects retain existing safe visibility."
