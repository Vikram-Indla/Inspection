    - "Concurrent request/verify cannot lose counters, reuse a consumed code or duplicate OTP_VERIFIED."

function_security_contract:
  security_definer:
    - "Use only when required by final revoked table DML or protected audit read."
    - "SET search_path=''."
    - "Fully qualify auth.uid, every schema/table/function/type/sequence and the actual installed extension function."
    - "Check auth.uid() non-null, exact persona/role, assignment, resource relationship, canonical state, window and immutability before write/disclosure."
    - "Do not rely on RLS for authorization inside a definer."
  unsafe_nested_helpers:
    prohibited:
      - public.has_role
      - public.has_any_role
      - public.is_assigned_inspector
    reason: "Current canonical definitions are SECURITY DEFINER with search_path=public."
    allowed_resolution:
      - "Inline fully qualified role/assignment predicates in the M11 function."
      - "Or propose a separately reviewed platform-helper hardening lease; do not silently broaden this stack."
  owner_manifest:
    required_fields:
      - function_identity_arguments
      - schema
      - owner_role
      - owner_bypassrls_effect
      - security_mode
      - search_path
      - qualified_dependencies
      - intended_execute_roles
      - revoked_roles
    unresolved_state: OWNER_ROLE_MUST_BE_CONFIRMED_FROM_ISOLATED_CATALOG
    rule: "Do not guess extension schema or owner; unresolved owner blocks implementation dispatch."
  ACL_per_exact_signature:
    - "REVOKE ALL/EXECUTE FROM PUBLIC."
    - "REVOKE ALL/EXECUTE FROM anon."
    - "REVOKE obsolete authenticated grants before intended regrant."
    - "GRANT EXECUTE only to authenticated for a reviewed caller-facing RPC."
    - "Trigger/helper-only functions have no PUBLIC/anon/authenticated EXECUTE."
    - "Inventory and revoke/drop obsolete overloads."

neutral_error_contract:
