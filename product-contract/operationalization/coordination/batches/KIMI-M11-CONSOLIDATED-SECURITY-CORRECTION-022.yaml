    allow:
      - "Own-session read."
      - "Start/schedule session under CR-338."
      - "Open waiting, join, OTP request/status/verify, mark verified, begin and close/cancel under the applicable Inspector requirements."
      - "Safe own-session audit read."
    deny:
      - "Any unassigned visit/session."
      - "Direct governed-column table DML."
  reviewer:
    allow:
      - "Safe session/verification audit facts under CR-348, CR-353 and RBAC-011."
    deny:
      - "Create/start, waiting, join, OTP execution/status, verification mutation, begin or close/cancel mutation."
  auditor:
    allow:
      - "Safe view-only audit evidence under RBAC-012."
    deny:
      - "Every M11 mutation and raw secret-bearing audit JSON."
  planner:
    exact_authority:
      - "RBAC-007 supports planning create/edit/assign/publish actions."
      - "It does not explicitly authorize identity verification, join or inspection execution."
    allow_only_if_cited_in_corrected_packet:
      - "Appointment/session scheduling or reschedule that is explicitly mapped to RBAC-007 planning rather than CR-338 execution."
    deny:
      - "OTP request/status/verify, join, mark verified, begin, close/cancel unless separate exact authority is recorded."
    unresolved_rule: >-
      If scheduling/reschedule mapping cannot be proven from canonical authority,
      mark Planner BLOCKED_FOR_AUTHORITY; do not infer from current broad RLS.
  operations:
    exact_authority:
      - "RBAC-008 supports view/reassign/resolve exception/approved override per policy."
      - "It does not explicitly authorize session creation, OTP, join, begin or close/cancel."
    deny:
      - "OTP request/status/verify, join, mark verified or begin."
    unresolved_rule: >-
      Any proposed schedule/reschedule/waiting/close action requires an exact
      RBAC-008 or requirement citation. Otherwise fail closed and return for
      sponsor authority.
  unassigned_inspector:
