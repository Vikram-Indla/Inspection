        the operational Regulation, Item, Violation and Penalty package schema.
    - id: CCR-032-P0-002
      requirement_ids: [REQ-R0C-01627, REQ-R0C-01879..01881, REQ-R0C-01900, REQ-R0C-01906, REQ-R0C-01915, REQ-R0C-01919]
      blocker: >-
