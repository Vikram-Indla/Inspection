evidence_contract:
  database:
    - Fresh PostgreSQL compile and idempotent replay.
    - RLS/grant catalogue proves no anonymous access and no direct authenticated governed DML.
    - Maker self-review and package self-publish denied.
    - Stale revision/package publish denied without overwriting.
    - Future-dated version is Scheduled; current approved version remains operational.
    - Effective version changes automatically at the exact date boundary without early use.
    - Invalid/orphan branch changes zero version, head, package and snapshot rows.
    - Immutable decision, version, publication, snapshot and audit rows reject update/delete.
    - Direct legacy create/modify/publish bypass is denied after cutover.
  end_to_end_positive:
    - Admin maker creates typed Regulation-Item-Violation-Penalty CCR.
    - Reviewer checker approves valid branch and publication retains exact request/version audit.
    - Compliance Library shows approved Scheduled/Active truth only.
    - Distinct package checker publishes one package with exact CCR version provenance.
    - Planning shows the effective package and publishes one visit using it.
    - Field startup and workspace retain the exact package/version after refresh and offline replay.
    - A successor CCR/package affects only future planning; the active/historical inspection remains byte-equivalent.
    - Penalty remains informational until Inspection Approval and Enforcement.
  negative_and_degraded:
    - draft, returned, rejected, future-not-effective and deactivated versions excluded
    - denied Planner/Inspector/Admin-cross-role routes and RPCs
    - missing parent, missing evidence/template rule, duplicate active version and stale concurrency
    - failed package source read is unavailable, never an empty/healthy result
    - missing frozen Field snapshot blocks unsafe action and never reads live fallback
    - partial publication failure retains all prior active state
  audit_lineage:
    - CCR request number, revision, component and compliance version IDs
    - package version and frozen snapshot hashes
    - Planning plan/visit and selected package version
    - Field preparation/inspection/submission version
    - actor, role, correlation ID, before/after, timestamp and denied attempts
  browser_matrix:
    personas: [compliance_admin_maker, reviewer_checker, form_admin_package_checker, planner, inspector, denied_business_persona, anonymous]
    routes:
      - /admin/compliance-requests
      - /admin/regulations
      - /admin/items
      - /admin/violations
      - /admin/packages
      - /planning
      - /field/:visitId
      - /field/inspection/:id
    states:
      - populated
      - Scheduled
      - Active
      - denied
      - loading
      - empty
      - error
      - degraded
      - stale_conflict
      - refresh_persistence
      - historical_locked
    dimensions:
      - English/LTR and Arabic/RTL
      - light and dark
      - desktop, tablet, 390px and 320px
      - keyboard, focus recovery and Axe
      - console and failed-network review
  protected_regression:
    - focused CCR engine and new operational projection
    - Compliance Library
    - Packages and package DB probe
    - Planning single, bulk and immediate package selection
    - golden journey and offline drill
    - full protected Web/Admin/Field selection
    - Web/Admin 478-row structural validator

rollback_rules:
  semantic_rule: >-
    Rollback preserves exact business state and every immutable audit/version
    record. It never deletes or falsifies the real approval/publication journey.
  pre_cutover: >-
    New projections and provenance objects stay additive until parity,
    permissions and browser evidence pass. No consumer switch occurs in 032A.
  post_cutover: >-
    Existing package and inspection snapshots remain authoritative. A bad new
    version is retired or superseded through an authorized audited lifecycle;
    historical rows are never edited. Reopening legacy create/modify is not an
    automatic rollback because it would reintroduce the canonical bypass.
  data_replay: >-
    Restore the exact pre-test semantic state and remove only expressly
    reversible fixture rows. Append-only audit, decisions and publication
    history remain. Stop before writing if isolation or semantic restoration
    cannot be proven.

blockers:
  p0:
    - id: CCR-032-P0-001
      requirement_ids: [REQ-R0C-01803..01805, REQ-R0C-01868..01883, CR-449, CR-450, CR-451, CR-452]
      blocker: >-
