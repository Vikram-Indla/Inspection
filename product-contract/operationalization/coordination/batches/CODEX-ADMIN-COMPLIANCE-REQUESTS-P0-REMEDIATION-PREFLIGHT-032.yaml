smallest_safe_target:
  architecture: >-
    CCR approved/effective version -> governed Compliance Library projection ->
    package draft references exact eligible component versions -> distinct
    package checker publishes one immutable package version and frozen
    compliance snapshots atomically -> existing Planning selects that effective
    package_version -> visit/preparation/inspection retain the exact package ID
    -> Field renders only the pinned package definition and its immutable
    companion snapshots.
  invariants:
    - Planning and Field never interpret CCR workflow state.
    - Draft, returned, rejected, future-not-effective or deactivated CCR versions never enter a package.
    - Current approved configuration remains operational until its successor effective date.
    - A failed package publication changes neither active CCR projection nor any package/visit/inspection.
    - Old package versions and historical visits/inspections are never rewritten.
    - Regulation, Item, Violation and Penalty create/modify routes cannot bypass CCR after cutover.
    - Separately authorized activate/deactivate operations remain explicit, audited lifecycle actions.
    - Package maker and package checker remain distinct even when CCR maker/checker were distinct.
    - Audit correlation records CCR request/version, package version, visit and inspection lineage.
    - RLS remains authoritative; application hiding is defense-in-depth only.

