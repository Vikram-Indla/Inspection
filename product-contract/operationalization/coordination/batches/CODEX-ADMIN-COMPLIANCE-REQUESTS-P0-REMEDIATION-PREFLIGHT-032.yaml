    - id: CCR-032-P0-003
      requirement_ids: [REQ-R0C-01623, REQ-R0C-01666, REQ-R0C-01684, REQ-R0C-01709, REQ-R0C-01768, REQ-R0C-01903, REQ-R0C-01916]
      blocker: >-
