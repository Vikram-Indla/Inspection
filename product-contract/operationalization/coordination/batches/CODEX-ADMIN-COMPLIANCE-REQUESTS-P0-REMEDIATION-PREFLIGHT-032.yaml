stop_conditions:
  - any P0 or P1 above remains at a completion or cutover claim
  - a future lease overlaps an active Admin, Package, Execution/Field or database owner
  - design revision or product policy is inferred by an engineering worker
  - migration or data target is not exact and non-production
  - package or Field uses a live legacy row after a frozen version is required
  - permission, maker-checker, audit, concurrency or immutable-history regression
  - a rollback plan deletes required evidence or reopens an unapproved bypass
  - protected regression or real-browser evidence is absent

safe_successor:
  packet_id: CODEX-ADMIN-COMPLIANCE-REQUESTS-LEASE-DECISION-033
