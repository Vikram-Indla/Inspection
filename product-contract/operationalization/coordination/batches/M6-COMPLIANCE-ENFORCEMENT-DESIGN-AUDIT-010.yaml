registered_mapping_validation:
  - logical_id: WA-DES-018
    design: "SAQEEL Committee.dc.html"
    route: /committee
    component: apps/web/src/app/(app)/committee/page.tsx
    route_component_match: CONFIRMED
    requirement_match: INCORRECT_MAPPING
    evidence: >-
      CR-449..CR-478 contain no committee, quorum, deliberation, signature act,
      PKI or EBDA capability. Committee/signature belongs to the later M2-12 and
      MVP3 provider-governance contracts. It cannot count toward M6 or the 478
      Compliance Configuration rows.
    recommended_action: RETURN_FOR_MAPPING_CORRECTION
  - logical_id: WA-DES-019
    design: "SAQEEL Compliance Requests.dc.html"
    routes:
      - /admin/compliance-requests
      - /admin/compliance-requests/new
      - "/admin/compliance-requests/:id"
    route_component_match: CONFIRMED
    requirement_match: CONFIRMED_WITH_CORRECTION
    evidence: >-
      The governed request envelope, component dependencies, maker-checker
      decisions, revisions and transactional publication support the cross-cutting
      lifecycle, but the design does not itself cover each regulation, item,
      package, template, violation, penalty and runtime-preview control plane.
    alternative_route: /admin/compliance-approvals
    recommended_action: CHANGE_DESIGN
  - logical_id: WA-DES-023
    design: "SAQEEL Enforcement.dc.html"
    routes: ["/enforcement", "/admin/violations"]
    validation:
      /enforcement: CONFIRMED_WITH_CORRECTION
      /admin/violations: INCORRECT_MAPPING
    evidence: >-
      The design is an operational enforcement/correction case and recommendation
      surface. It is not the SCR-ADM-040 violation-code configuration catalogue
      and does not provide configuration versions, clause anchoring, trigger
      mapping, one-to-one penalty mapping, maker-checker publication or audit
      evidence.
    better_matches:
      - /admin/enforcement-recommendations
      - /enforcement
    recommended_action: RETURN_FOR_MAPPING_CORRECTION
  - logical_id: WA-DES-040
    design: "SAQEEL Risk.dc.html"
    routes: ["/admin/risk", "/admin/risk/models"]
    route_component_match: CONFIRMED
    requirement_match: INCORRECT_MAPPING
    evidence: >-
      General risk-model configuration is not a CR-449..CR-478 capability.
      CR-471/CR-472 only say item scoring can feed an approved Risk/Health
      Engine and are explicitly OPEN_BUSINESS_DECISION under DEC-001/DEC-028.
    recommended_action: BLOCK_DUE_TO_MISSING_CONTRACT

meaningful_design_code_delta:
  WA_DES_019:
    design_present:
      - "Request creation, current/proposed component values, dependency tree, revision history."
      - "Maker-checker decisions, mandatory reason statement, immutable version identifiers and transactional publication claim."
    design_missing:
      - "Request and approval queue states, ownership conflict, duplicate component, invalid dependency and publish rollback."
      - "Loading, empty, unauthorized, degraded, stale/conflict and provider/error cases."
      - "Complete route-level relationship to regulations, items, packages, templates, violations and penalty mapping."
      - "Independently selectable EN/LTR, AR/RTL, 1024, 412, 390 and 320 states."
    code_present:
      - "Real request/revision/component/dependency/decision/publication tables and request creation RPC."
      - "Separate request and approval routes with role boundaries and loading/error paths."
    implication: "WA-DES-019 is a useful shell but cannot serve as sole CR-449..CR-478 design authority."
  WA_DES_023:
    design_present:
      - "Operational cases and enforcement recommendations."
    design_missing:
      - "Violation configuration catalogue, legal clause source, configuration versioning, deactivation, usage trace and penalty-mapping lifecycle."
    code_present:
      - "The /admin/violations implementation reads violation_codes, regulation_clauses, penalty_mappings and immutable templates; exposes audit, usage, publish and deactivation paths."
    implication: "Literal replication would remove existing configuration capability."
  WA_DES_040:
    design_present:
      - "Live Risk Studio and governed draft workbench."
    code_present:
      - "The same split exists: /admin/risk saves engine_settings immediately; /admin/risk/models uses risk_models and maker-checker transitions."
    conflict: >-
      Design and current Risk Studio both state there is no draft/approval and
      save is immediately effective, while RBAC-004 and SCR-ADM-060 require
      draft/test/submit and approved publication. This is a contract/code/design
      conflict, not a visual gap.

p0_risks:
  - id: M6-MAP-P0-001
    finding: >-
      Committee, operational Enforcement and Risk are convenience-bundled under
      CR-449..CR-478 without semantic authority. Their existence cannot count as
      delivery of any M6 requirement row.
    action: RETURN_FOR_MAPPING_CORRECTION
  - id: M6-COVERAGE-P0-002
    finding: >-
      The M6 design bundle omits the real control-plane screens for regulations,
      items, packages/designer, templates, violation configuration and penalty
      mapping. Those routes are placed under generic M9 design authority.
    action: BLOCK_UNTIL_CROSS_MODULE_DESIGN_OWNERSHIP_IS_RESOLVED
  - id: M6-RISK-P0-003
    finding: >-
      WA-DES-040 invents active weights 0.35/0.25/0.20/0.20 and bands 39/69,
      claims effective-immediate save and bypasses maker-checker while
      DEC-001/DEC-028 remain open.
    evidence: "WA-DES-040 lines 67, 72-92 and 160-163."
    action: BLOCK_DUE_TO_MISSING_CONTRACT
  - id: M6-ENF-P0-004
    finding: >-
      WA-DES-023 presents Immediate closure, Financial fine, Refer to committee
      and Final warning as available decisions without CR-449..CR-478 policy,
      legal-basis or authorization authority.
    evidence: "WA-DES-023 lines 90-96."
    action: BLOCK_DUE_TO_MISSING_CONTRACT
  - id: M6-REG-P0-005
    finding: >-
      Treating WA-DES-023 as /admin/violations authority would regress current
      legal-clause, version, audit, usage, immutable template, one-to-one penalty
      and maker-checker publication capabilities.
    action: CHANGE_DESIGN

p1_risks:
  - id: M6-DES-P1-001
    finding: >-
      All four exports use a fixed 248px desktop grid and expose theme only.
      They do not prove 1024, 412, 390 or 320 reflow.
  - id: M6-DES-P1-002
    finding: >-
      All four English exports use typed Arabic-only صقيل صناعي identity instead
      of the approved bilingual SAQEEL | صقيل asset.
  - id: M6-DES-P1-003
    finding: >-
      None proves a complete AR/RTL document variant, localized validation,
      logical-direction control or mixed-direction identifier handling.
  - id: M6-DES-P1-004
    finding: >-
      Required loading, empty, unauthorized, degraded, stale/conflict,
      dependency failure, publish failure and provider-unavailable states are
      not selectable or evidenced.
  - id: M6-DES-P1-005
    finding: >-
      Keyboard order, error-summary focus, table/card alternatives, live
      announcements, maker-checker confirmation and narrow sticky-region
      behavior are unevidenced.

