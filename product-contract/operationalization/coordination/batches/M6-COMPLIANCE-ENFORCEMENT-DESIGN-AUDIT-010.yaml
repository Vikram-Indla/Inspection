recommended_sponsor_decision:
  recommendation: RETURN_FOR_MAPPING_CORRECTION
  business_language: >-
    Keep the four existing products, but stop treating them as one module.
    Approve a mapping correction first. Compliance Requests can proceed to a
    controlled successor. Committee, operational Enforcement and Risk must move
    to their real contracts, and the missing Compliance Configuration screens
    must receive explicit design authority before implementation or cutover.

