sponsor_decisions:
  application_rule: >-
    Chat or verbal approval is not self-applied. Each decision needs a
    repository-backed decision ID and authoritative target update.
  required:
    - id: M3-ACT-DEC-001
      question: Activate M3 now, queue after M2, or authorize a disjoint concurrent slice?
      recommended: QUEUE_AFTER_M2_UNLESS_A_REPOSITORY_BACKED_CONCURRENT_SLICE_IS_CREATED
      must_record:
        - M2 disposition
        - M3 task and change-control ID
        - exact base SHA
        - requirements, acceptance, evidence, rollback, and do-not-touch areas

    - id: M3-ACT-DEC-002
      question: Supersede obsolete always-projected map acceptance with truthful tiered provenance?
      recommended: APPROVE_TIERED_PROVENANCE
      preserve:
        - no fabricated route, ETA, drift, animation, or live claim
        - recorded timestamp, accuracy, freshness, privacy, and connection truth
        - scheduled or factory fallback truth
        - unavailable, invalid, zero-row, and read-error truth

    - id: M3-ACT-DEC-003
      question: Map business personas to repository role keys for view, monitoring-only, and actions.
      must_resolve:
        - Supervisor
        - Operations Manager
        - Executive
        - Auditor
        - planner
        - ops
        - leadership
      prohibition: Do not invent a supervisor role key.

    - id: M3-ACT-DEC-004
      question: Approve canonical region, branch, and organization scope hierarchy.
      must_resolve:
        - user-to-scope cardinality
        - factory, visit, inspector, case, and risk-exception linkage
        - transfer, history, and temporary cross-scope behavior

    - id: M3-ACT-DEC-005
      question: Approve precise inspector identity and coordinate access.
      must_resolve:
        - eligible roles and direct grantees
        - active journey and execution states
        - freshness, stale, masking, and aggregation behavior
        - privacy, retention, and audit

    - id: M3-ACT-DEC-006
      question: Approve action-to-capability and record-scope matrix.
      actions:
        - resolve action form
        - handle notification
        - decide GPS override
        - decide active cancellation
        - export operational data

    - id: M3-ACT-DEC-007
      question: Approve exceptional national-scope grant governance.
      must_resolve:
        - grantor
        - grantee
        - reason
        - expiry
        - review
        - revocation
        - active-session and cache behavior
        - immutable audit

    - id: M3-ACT-DEC-008
      question: Resolve CR-431 and DEC-002 telemetry-frequency ownership and configuration.
      must_resolve:
        - policy owner
        - configuration source
        - permitted range
        - offline, reconnect, and stale behavior
      current_status: OPEN_P0

    - id: M3-ACT-DEC-009
      question: Approve cross-package follow-ups.
      recommended:
        F0: Navigation only after current F0 work is accepted.
        M8: National-grant administration only after database grant governance passes.

