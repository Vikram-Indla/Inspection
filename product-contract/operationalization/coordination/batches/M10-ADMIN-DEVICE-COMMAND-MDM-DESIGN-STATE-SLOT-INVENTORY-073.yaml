      required_interaction: Contradictory commands unavailable.
    - slot_id: DEV-DS-016
      state: device_wiped_terminal
      purpose: Show verified wipe effect without erasing identity history.
      decisions: [DEV-CMD-DEC-04, DEV-CMD-DEC-06]
      cases: [DEV-NEG-STATE-04, DEV-NEG-STATE-07, DEV-NEG-STATE-08, DEV-POS-09, DEV-POS-13]
      required_content: Completion evidence, time and preserved former identity.
      required_interaction: Ordinary Resume unavailable.
    - slot_id: DEV-DS-017
      state: trust_evidence_missing_stale_or_conflicting
