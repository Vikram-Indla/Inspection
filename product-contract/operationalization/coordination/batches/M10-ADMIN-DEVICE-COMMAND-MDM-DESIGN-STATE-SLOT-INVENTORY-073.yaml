      purpose: Separate requested/accepted wipe from verified completion.
      decisions: [DEV-CMD-DEC-04, DEV-CMD-DEC-06, DEV-CMD-DEC-09]
      cases: [DEV-NEG-STATE-05, DEV-NEG-OFF-02, DEV-NEG-PROV-04, DEV-POS-09]
