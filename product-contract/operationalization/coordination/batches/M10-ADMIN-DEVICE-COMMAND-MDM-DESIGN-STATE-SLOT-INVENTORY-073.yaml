slot_rules:
  - Every slot inherits all null_binding_template fields until recorded authorities exist.
  - A null binding renders the slot unresolved/held; it cannot be filled from current code, a mock, a seed or illustrative design values.
  - Machine identifiers and immutable evidence remain factual; human-friendly labels require governed bilingual copy.
  - A design state may explain a blocked dependency but cannot imply provider delivery or completion.
  - State color never acts as the only status signal.
  - Every action state must retain device, actor, reason, version, time and evidence association where applicable.
  - Slots are not frames and do not allocate design IDs.

design_state_slots:
  route_and_source:
    - slot_id: DEV-DS-001
      state: route_loading
      purpose: Preserve shell and page hierarchy while device and command reads are pending.
      decisions: [DEV-CMD-DEC-10]
      cases: [DEV-POS-14]
      required_content: Localized loading name; no fabricated count or healthy state.
      required_interaction: Keyboard focus remains stable and no action is available.
    - slot_id: DEV-DS-002
      state: verified_empty
      purpose: Distinguish a successful zero-row result from denial or source failure.
      decisions: [DEV-CMD-DEC-01, DEV-CMD-DEC-10]
      cases: [DEV-NEG-AUTH-01, DEV-NEG-AUTH-04, DEV-POS-14]
      required_content: Access-scoped empty explanation and safe next action if authorized.
      required_interaction: No command controls.
    - slot_id: DEV-DS-003
      state: unauthorized_route
      purpose: Deny the direct route without disclosing device or command evidence.
      decisions: [DEV-CMD-DEC-01]
      cases: [DEV-NEG-AUTH-01, DEV-NEG-AUTH-02, DEV-NEG-AUTH-03, DEV-NEG-AUTH-04]
      required_content: Neutral localized denial and permitted recovery.
      required_interaction: No mutation or automatic replay after authentication.
    - slot_id: DEV-DS-004
      state: source_error
      purpose: Distinguish device-read, command-read and schema/service failure.
      decisions: [DEV-CMD-DEC-06, DEV-CMD-DEC-08, DEV-CMD-DEC-10]
      cases: [DEV-NEG-OFF-05, DEV-NEG-AUD-01, DEV-POS-11, DEV-POS-12, DEV-POS-14]
      required_content: Last confirmed fact/time where safe; no false empty or schema diagnosis.
      required_interaction: Dependent mutation disabled with retry/recovery semantics unresolved.
    - slot_id: DEV-DS-005
      state: stale_or_conflicting_source
      purpose: Show that displayed device version is no longer current.
      decisions: [DEV-CMD-DEC-02, DEV-CMD-DEC-05, DEV-CMD-DEC-06]
      cases: [DEV-NEG-STALE-01, DEV-NEG-STALE-02, DEV-NEG-STALE-05]
      required_content: Stale marker, last confirmed time and conflict explanation.
      required_interaction: Refresh/reconcile; no blind resubmit.

  persona_and_permission:
    - slot_id: DEV-DS-006
      state: authorized_read_only
      purpose: Allow approved evidence viewing without mutation.
      decisions: [DEV-CMD-DEC-01, DEV-CMD-DEC-02]
      cases: [DEV-NEG-AUTH-03, DEV-NEG-AUTH-05]
      required_content: Read scope and action-disabled reason.
      required_interaction: Direct submission remains denied.
    - slot_id: DEV-DS-007
      state: authorized_mutation_scope
      purpose: Present only capabilities approved for the actor and device.
      decisions: [DEV-CMD-DEC-01, DEV-CMD-DEC-02]
      cases: [DEV-NEG-AUTH-05, DEV-POS-02, DEV-POS-06, DEV-POS-07, DEV-POS-08, DEV-POS-09, DEV-POS-10]
      required_content: Actor role/scope and per-command eligibility.
      required_interaction: Controls absent or disabled consistently with server authority.
    - slot_id: DEV-DS-008
      state: session_expired_or_role_lookup_failed
      purpose: Prevent an action viewed under old authority from being submitted.
      decisions: [DEV-CMD-DEC-01]
      cases: [DEV-NEG-AUTH-06]
      required_content: Neutral recovery without leaking raw database error.
      required_interaction: Re-authentication never auto-replays the privileged command.
    - slot_id: DEV-DS-009
      state: independent_approval_required
      purpose: Separate requester from approver when policy requires it.
      decisions: [DEV-CMD-DEC-03]
      cases: [DEV-NEG-AUTH-07, DEV-POS-06, DEV-POS-08, DEV-POS-09]
      required_content: Requester, approver boundary, pending/expiry and reason.
      required_interaction: Requester cannot approve.
    - slot_id: DEV-DS-010
      state: approval_rejected_withdrawn_or_expired
      purpose: Preserve a non-completed approval outcome and history.
      decisions: [DEV-CMD-DEC-03, DEV-CMD-DEC-06]
      cases: [DEV-NEG-AUTH-07, DEV-NEG-AUD-04, DEV-POS-12]
      required_content: Outcome, actor/time/reason and safe next action.
      required_interaction: Cannot dispatch or advance the command.

  device_register:
    - slot_id: DEV-DS-011
      state: device_pending
      purpose: Show enrolled but not trusted and fail-closed.
      decisions: [DEV-CMD-DEC-05]
      cases: [DEV-POS-01, DEV-POS-02, DEV-POS-03]
      required_content: Assignment, app policy and missing evidence facts.
      required_interaction: No official package access.
    - slot_id: DEV-DS-012
