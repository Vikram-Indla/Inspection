      decisions: [DEV-CMD-DEC-05, DEV-CMD-DEC-06, DEV-CMD-DEC-09]
      cases: [DEV-POS-03, DEV-POS-04, DEV-POS-05, DEV-POS-07]
      required_content: Evidence authority/version/time, app policy, assignment and lifecycle source.
      required_interaction: Evidence detail is inspectable by an authorized actor.
    - slot_id: DEV-DS-013
      state: device_suspended
      purpose: Show reversible fail-closed state without implying terminal identity.
      decisions: [DEV-CMD-DEC-02, DEV-CMD-DEC-04]
      cases: [DEV-NEG-STATE-08, DEV-POS-06, DEV-POS-07]
      required_content: Governing command/effect evidence and package/sync denial.
      required_interaction: Resume eligibility remains null until policy is recorded.
    - slot_id: DEV-DS-014
      state: device_revoked_terminal
      purpose: Show revoked identity and preserved history.
      decisions: [DEV-CMD-DEC-04]
      cases: [DEV-NEG-STATE-03, DEV-NEG-STATE-07, DEV-NEG-STATE-08, DEV-POS-08, DEV-POS-13]
      required_content: Terminal/exceptional policy, original evidence and re-enrollment boundary.
      required_interaction: Ordinary Resume unavailable.
    - slot_id: DEV-DS-015
