persona_fixture_gap:
  currently_seeded_test_personas:
    - planner
    - inspector
    - reviewer
    - admin
    - ops
  missing_required_personas:
    - auditor
    - leadership
    - compliance_admin
    - form_admin
    - unassigned_inspector
  implication: Full persona certification cannot start without an isolated fixture/data lease.
  hard_rule: Do not repurpose sponsor, operator or another suite's accounts.

persona_scope_matrix:
  - persona: anonymous
    expected: RPC denied; zero event and existence disclosure.
  - persona: expired_session
    expected: Neutral authentication denial; zero event disclosure.
  - persona: inspector
    expected: /admin/audit denied; raw tables denied; no general guarded replay.
  - persona: assigned_inspector
    expected: Only approved Virtual Session/participant facts under RBAC-014, with sensitive fields redacted.
  - persona: planner
    expected: Object-scoped facts already visible through Planning RLS; partial-scope disclosure.
  - persona: reviewer
    expected: Object-scoped Inspection/Submission/Review facts; partial-scope disclosure.
  - persona: leadership
    expected: Approved organizational object scope only; partial-scope disclosure.
  - persona: compliance_admin
    expected: Approved compliance/configuration scope only; partial-scope disclosure.
  - persona: form_admin
    expected: Exact supported configuration objects only; no global Audit route unless separately approved.
  - persona: auditor
    expected: Full scope only if approved by the disclosure matrix; still redacted by field policy.
  - persona: ops
    expected: Full or operational scope exactly as approved; still redacted by field policy.
  - persona: security_admin
    expected: No automatic reveal; scope and redaction remain policy-controlled.

database_test_cases:
  - id: AUD-DB-001
    priority: P0
    test: Anonymous cannot execute guarded replay or read raw stores.
  - id: AUD-DB-002
    priority: P0
    test: Authenticated direct SELECT on audit_events and audit_semantic_events is denied after migration.
  - id: AUD-DB-003
    priority: P0
    test: Generic and semantic UPDATE/DELETE remain rejected for authenticated, elevated and owner-equivalent probe contexts.
  - id: AUD-DB-004
    priority: P0
    test: Planner sees one in-scope Visit and zero out-of-scope Visit facts.
  - id: AUD-DB-005
    priority: P0
    test: Reviewer sees one in-scope Review chain and zero unrelated Inspection facts.
  - id: AUD-DB-006
    priority: P0
    test: Compliance Admin sees supported configuration objects and zero unrelated operational objects.
  - id: AUD-DB-007
    priority: P0
    test: Assigned Inspector sees only the approved Virtual Session trail.
  - id: AUD-DB-008
    priority: P0
    test: Unassigned Inspector receives zero Virtual Session facts.
  - id: AUD-DB-009
    priority: P0
    test: Unknown aggregate type fails closed.
  - id: AUD-DB-010
    priority: P0
    test: Empty/unavailable disclosure policy returns redacted data and disables reveal.
  - id: AUD-DB-011
    priority: P0
    test: Unknown field path never appears in before, after or payload.
  - id: AUD-DB-012
    priority: P0
    test: Reveal without approved role, field, purpose and policy version is denied.
  - id: AUD-DB-013
    priority: P0
    test: Successful reveal, if later authorized, produces one correlated access event.
  - id: AUD-DB-014
    priority: P0
    test: Identical reveal request ID is idempotent; changed reuse is rejected.
  - id: AUD-DB-015
    priority: P0
    test: Generic and semantic versions of one business fact correlate without silent double-counting.
  - id: AUD-DB-016
    priority: P0
    test: Cursor is bound to actor and filter fingerprint; cross-filter replay is rejected.
  - id: AUD-DB-017
    priority: P1
    test: Limit is bounded to 1 through 250 with deterministic occurred_at/id keyset ordering.
  - id: AUD-DB-018
    priority: P1
    test: More than 250 portfolio facts returns has_more and a valid next cursor.
  - id: AUD-DB-019
    priority: P1
    test: More than 5000 case facts marks history partial and completeness uncertifiable.
  - id: AUD-DB-020
    priority: P0
    test: Source, scope or redaction failure never widens access.
  - id: AUD-DB-021
    priority: P0
    test: Existing semantic append source validation and idempotency remain intact.
  - id: AUD-DB-022
    priority: P0
    test: Existing configuration and Virtual narrow seams cannot bypass the new redaction boundary.

application_regression_cases:
  - id: AUD-APP-001
    route: /admin/audit
    expected: Recorder, reconstruct, compare, ledger, custody and print-safe consume guarded results.
  - id: AUD-APP-002
    route: /admin
    expected: Governed audit summary distinguishes verified count, verified zero and unavailable.
  - id: AUD-APP-003
    route: /dashboard
    expected: OPS-KPI-008 preserves newest-12 scoped facts and explicit failed-source state for every permitted persona.
  - id: AUD-APP-004
    route: /visits/:id
    expected: Planner/Ops scoped timeline works; Inspector gets an authorized narrow timeline or explicit unavailable, never false empty.
  - id: AUD-APP-005
    route: /reviews/:id
    expected: Reviewer chronological chain preserves actor, action, object and timestamp without raw payload leakage.
  - id: AUD-APP-006
    route: /admin/items
    expected: Configuration history preserves supported object scope and approved fields.
  - id: AUD-APP-007
    route: /admin/regulations
    expected: Regulation history preserves supported object scope and approved fields.
  - id: AUD-APP-008
    route: /admin/violations
    expected: Violation and penalty history preserves supported object scope and approved fields.
  - id: AUD-APP-009
    route: /virtual/sessions/:id/verify
    expected: RBAC-014 session scope remains intact and verification material is redacted.

