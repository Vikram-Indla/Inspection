evidence_bundle_requirements:
  - exact commit and migration inventory
  - persona and fixture manifest with no credentials
  - database before/after counts
  - guarded RPC request and redacted response
  - RLS denial responses
  - immutable mutation denial
  - semantic correlation and idempotency rows
  - browser screenshots and accessibility output
  - consumer regression test results
  - cleanup/reconciliation report
  - requirement, acceptance, route, screen and design crosswalk

execution_order:
  - Transaction-wrapped database contract against an isolated local database.
  - Authenticated remote read-only RLS and projection probes.
  - Isolated namespaced seed fixtures after data lease.
  - Focused consumer regression suites.
  - Browser state and accessibility matrix.
  - Cleanup and immutable-fixture reconciliation.
  - Full protected regression.

stop_conditions:
  - Missing governed screen identity or policy decisions required by the selected behavior.
  - Missing auditor, leadership, compliance_admin, form_admin or unassigned-inspector fixtures.
  - Any fixture overlaps sponsor or another suite account/data.
  - Raw-table or privileged-seam bypass remains.
  - Reveal defaults on when policy is absent.
  - Immutable test facts cannot be namespaced and reconciled.
  - Any P0 database or consumer regression case fails.
  - Evidence omits a required locale, scope, denial or partial-history state.

