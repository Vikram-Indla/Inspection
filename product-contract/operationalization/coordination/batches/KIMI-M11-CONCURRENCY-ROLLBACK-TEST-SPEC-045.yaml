purpose: >-
  Freeze the exact future M11 concurrency, rollback, quiesce, immutable-audit,
  partial-failure and recovery tests required by the security and test-gap
  authorities. This is a specification only and does not choose SQL mechanics,
  run transactions, create fixtures or issue leases.

