responsive_matrix:
  viewports:
    - 1440x900
    - 1160x880
    - 1024x768
    - 768x1024
    - 412x915
    - 390x844
    - 320x568
  desktop: Provider and staging may share a row; master-data and history remain clearly separated.
  tablet: Forms and histories stack without clipped identifiers, fields, statuses, or actions.
  mobile: Single-column task order; factory selection precedes controls; no peeking submenu icons.
  minimum_reflow: No task loss, overlap, or two-dimensional page scroll.
  table_rule: Use labelled cards or a named horizontal region; preserve header and action semantics.

language_bidi_theme:
  locales:
    - {locale: en, direction: ltr}
    - {locale: ar, direction: rtl}
  bidi_rules:
    - Use logical layout and mirror directional structure.
    - Isolate hashes, batch IDs, error codes, schema versions, CR/licence/plant identifiers, emails, and phone numbers appropriately.
    - Localize headings, hints, errors, statuses, provider truth, staging distinctions, recovery, and empty/degraded states.
    - Require qualified native-Arabic review before acceptance.
  themes: [light, dark]
  theme_evidence:
    - shell, banners, provider status, file control, selector, forms, tables, badges, links, and focus
    - body, heading, caption, placeholder, disabled, error, success, warning, unavailable, and RLS-hidden contrast
    - long identifier readability without relying on underlined body text as the only action affordance

accessibility_contract:
  structure:
    - One h1 and ordered region headings.
    - Programmatic labels, required/optional hints, field errors, and result associations.
    - Each form and status action has a unique accessible name.
  keyboard:
    - File chooser, factory selector, forms, representative toggles, histories, dossier link, pagination placeholder, and retry are operable.
    - Visible single focus treatment in both themes.
    - Forty-four-pixel minimum targets.
    - Validation focuses the summary or first invalid field without clearing input.
  announcements:
    - file preview and validation
    - staging progress and safe result counts
    - local mutation result
    - source unavailable, partial failure, conflict, and test failure
  content:
    - Status uses text, icon, and shape rather than color alone.
    - Long hashes and IDs wrap or truncate with accessible full values.
    - Tables retain programmatic headers or become labelled records.
  zoom_reflow:
    - Prove 200 percent zoom.
    - Prove 400 percent or 320 CSS-pixel equivalent reflow.

error_and_degraded_contract:
  safe_error_codes:
    - CSV_FILE_REQUIRED
    - CSV_SCHEMA_VERSION_UNSUPPORTED
    - CSV_FILE_SIZE_INVALID
    - CSV_UNCLOSED_QUOTE
    - CSV_HAS_NO_DATA_ROWS
    - CSV_DUPLICATE_HEADER
    - CSV_UNKNOWN_HEADER
    - CSV_REQUIRED_HEADER_MISSING
    - CSV_ROW_LIMIT_EXCEEDED
    - CSV_COLUMN_COUNT_MISMATCH
    - CSV_BATCH_ALREADY_STAGED
    - CSV_STAGE_RUN_FAILED
    - CSV_STAGE_BATCH_FAILED
    - CSV_STAGE_ROWS_FAILED
  rules:
    - Do not display raw row payloads, SQL, provider URLs, stack traces, or database messages.
    - One source failure does not zero or fabricate healthy sources.
    - Preserve chosen-file context only where privacy and browser security permit.
    - Preserve master-data input after safe validation or write failure.
    - Show which region is unavailable without declaring the whole provider unhealthy.

acceptance_evidence_plan:
  design_return:
    - Corrected editable design export under the stable filename.
    - Export byte size, SHA-256, viewport inventory, and predecessor lineage.
    - Predecessor-versus-successor record proving removal of fabricated provider, history, counts, IDs, and imported claims.
    - Component/action/state annotations for layout, page, CSV, master-data forms, and both server actions.
    - Full permission, data, audit, concurrency, failure, responsive, theme, RTL, accessibility, and bounded-history matrices.
    - Explicit implementation-gap register and test-failure status treatment.
  later_runtime_not_authorized_here:
    - Each allowed role can load and perform only permitted actions.
    - Anonymous, denied role, role-read failure, and direct-action RLS denial leak no data and change no rows.
    - Valid, invalid, duplicate, oversized, malformed, all-rejected, and partial-write CSV paths.
    - Proof that staging writes no accepted/imported factory truth.
    - Each local operation persists after refresh with source identifiers unchanged.
    - Audit actor, object, before/after, action, and timestamp for staging and local mutations.
    - Concurrent representative and duplicate-batch behavior.
    - Empty, unavailable, RLS-hidden, partial-source, and bounded-history completeness.
    - No raw provider/database errors or representative-contact leakage.
    - EN/AR RTL, light/dark, all viewports, keyboard, zoom, focus, target size, and automated accessibility.
    - Required focused and protected regression suites with zero unexplained failure.

