    sync_runs: {limit: 20, total_count: absent}
    import_batches: {limit: 20, total_count: absent}
    rejected_rows: {limit: 50, total_count: absent}
    reconciliation_records: {limit: 30, total_count: absent}
  design_requirements:
    - Label each history as recent or loaded records, never complete history.
    - Show total counts only when returned by a counted query.
    - Do not imply the 250-factory selector is the full national registry.
    - Annotate pagination/load-more as an implementation gap until it exists.
    - Preserve selected factory and filters across pagination only after runtime proof.
  risk: Partial data can masquerade as complete custody, reconciliation, or factory coverage.

