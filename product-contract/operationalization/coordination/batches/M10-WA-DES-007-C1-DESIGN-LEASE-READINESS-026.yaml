real_capability_contract:
  provider_truth:
    provider_label: Senaei
    state: NOT_CONFIGURED_AND_NOT_VERIFIED_HERE
    remote_call_from_page: false
    missing_contract: SENAEI_API_CONTRACT_NOT_SUPPLIED
    rule: Provider configuration, database rows, fixtures, or prior runs do not prove connectivity.
  csv_staging:
    action: stageFactoryCsv
    schema_version: factory360-v2-staging-1
    maximum_file_bytes: 2097152
    maximum_data_rows: 5000
    required_headers: [cr_number, license_number, plant_number]
    custody:
      - SHA-256 file fingerprint
      - one senaei_sync_runs record
      - one factory_import_batches record
      - factory_import_rows records
    statuses:
      - pending
      - rejected
    accepted_rows_written: 0
    guarantees:
      - Unknown, duplicate, missing-required, malformed, oversized, and over-limit CSV input fails safely.
      - Staging never upserts factories, commercial registrations, licences, or plants.
      - A failed batch or row write marks prior custody records failed where the current action provides it.
      - Duplicate custody exposes a safe code rather than an imported claim.
  local_master_data:
    action: mutateFactoryMasterData
    operations:
      - key: document
        table: factory_documents
        outcome: Add document metadata only; no binary upload.
      - key: representative
        table: factory_representatives
        outcome: Add a representative within the selected authorized context.
      - key: product
        table: factory_products
        outcome: Add a product and optional non-negative annual capacity.
      - key: material
        table: factory_materials
        outcome: Add a local or imported raw-material record.
      - key: representative_status
        table: factory_representatives
        outcome: Activate or deactivate an existing selected-factory representative.
    immutable_external_truth:
      - CR number
      - licence number
      - plant number
      - provider source identity
    excluded:
      - source import or apply
      - reconciliation decision
      - Factory 360 dossier edit
      - risk or compliance calculation
      - visit, inspection, or corrective-action workflow

audit_concurrency_and_truth:
  audit:
    source_expectation: RLS-protected tables have row-audit triggers.
    current_UI_claim: Saved and audit-recorded
    runtime_evidence_status: NOT_PROVEN_BY_CURRENT_SOURCE_TEST
    design_rule: >-
      Do not claim "audit-recorded" solely from action success. The corrected
      design may say "Saved" and separately show audit evidence only when a
      source-backed audit record is returned or independently proven.
  concurrency:
    representative_status_version_guard: absent
    local_insert_idempotency_guard: not_evidenced
    csv_duplicate_custody: Database duplicate is mapped to CSV_BATCH_ALREADY_STAGED after a run record may already exist.
    design_rule: >-
      Include stale/conflict and duplicate-custody states, preserve input, and
      disclose current runtime gaps. Never imply silent-overwrite prevention or
      atomic all-or-nothing custody beyond the action's actual behavior.
  data_truth:
    - Staged is not accepted, imported, synchronized, reconciled, or authoritative.
    - Empty is distinct from unavailable, RLS-hidden, and not configured.
    - Fixture/example values are visibly labelled and excluded from acceptance evidence.
    - Raw staged row payloads and sensitive representative contacts do not appear in history.

