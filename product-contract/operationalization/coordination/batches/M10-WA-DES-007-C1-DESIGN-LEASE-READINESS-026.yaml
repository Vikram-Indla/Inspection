p0_return_gates:
  - id: P0-IDENTITY
    return_if: Route, design identity, revision, filename, or predecessor lineage differs.
  - id: P0-STAGING-TRUTH
    return_if: Staged rows are called imported, accepted, synchronized, reconciled, or authoritative.
  - id: P0-PROVIDER
    return_if: Senaei connectivity, endpoint, contract, provider health, freshness, mapping, or success is invented.
  - id: P0-WORKFLOW
    return_if: Import/apply, reconciliation decision, publication, approval, or another unsupported workflow is added.
  - id: P0-PERMISSION
    return_if: Technical Admin or another fictional role replaces the exact three-role boundary.
  - id: P0-CONFIDENTIALITY
    return_if: Denied personas see factory source IDs, custody, rejected rows, reconciliation, or representative contacts.
  - id: P0-SOURCE
    return_if: External CR, licence, plant, provider, or official factory truth becomes locally editable.
  - id: P0-AUDIT
    return_if: Audit completion is asserted solely from action success without runtime audit evidence.
  - id: P0-CONCURRENCY
    return_if: Stale representative update, duplicate batch, or partial custody is silently overwritten or falsely marked atomic.
  - id: P0-DATA
    return_if: Any run, filename, date, correlation ID, hash, count, external ID, outcome, reason, fixture, metric, or policy is fabricated.
  - id: P0-FAILURE
    return_if: Required test failure, runtime negative failure, or missing evidence is hidden or converted into completion.
  - id: P0-SCOPE
    return_if: Spatial Canvas, Integration Hub, Factory 360 dossier editing, risk, compliance, visit, inspection, or corrective-action logic is added.
  - id: P0-TRACEABILITY
    return_if: The page claims all 478 requirements or direct ownership of Factory 360 route behaviors.

p1_return_gates:
  - id: P1-RESPONSIVE
    return_if: Any required viewport clips, overlaps, hides a task, scrolls the page horizontally, or exposes peeking navigation.
  - id: P1-RTL
    return_if: Arabic is untranslated, directionally broken, or corrupts hashes, IDs, codes, contact data, or schema versions.
  - id: P1-THEME
    return_if: Light/dark controls, statuses, focus, text, borders, placeholders, disabled, error, or unavailable states lack contrast.
  - id: P1-A11Y
    return_if: Headings, labels, hints, errors, focus, targets, announcements, table semantics, or full identifier access is missing.
  - id: P1-HISTORY
    return_if: Bounded histories or the 250-factory selector are presented as complete without totals and pagination proof.
  - id: P1-FEEDBACK
    return_if: Progress, success, validation, denial, partial failure, conflict, or retry loses context or misstates custody.
  - id: P1-EVIDENCE
    return_if: Fingerprint, visual matrix, state index, annotations, gap register, test status, or predecessor comparison is absent.

