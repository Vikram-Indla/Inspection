implementation_ownership_boundary:
  before_design_acceptance:
    claude_design: Owns only approved design correction leases and design evidence.
    codex_reviewer: Owns independent mapping, semantic-delta, and sponsor-consent validation.
    engineering_lanes: Must not implement from rejected, orphaned, no-code-match, or no-design-match authority.
  after_design_acceptance:
    rule: One implementation lease per file set; all other agents remain read-only reviewers.
    prerequisite: Ownership, requirements, acceptance IDs, dependencies, and do-not-touch files must be recorded before work.

