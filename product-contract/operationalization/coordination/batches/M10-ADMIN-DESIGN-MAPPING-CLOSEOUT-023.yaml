mandatory_mapping_corrections:
  - Keep WA-DES-015 as the sole /admin design authority.
  - Map each real route to one exact design authority rather than the seven-design M10 bundle.
  - Correct WA-DES-003, WA-DES-006, WA-DES-007, and WA-DES-008 through their existing C1 successor identities.
  - Remove WA-DES-020 from /admin/operations.
  - Record /admin/operations and /admin/gis/spatial as NO_DESIGN_MATCH.
  - Record WA-DES-012 and WA-DES-013 as NO_CODE_MATCH and retire their Admin route claims.
  - Record WA-DES-020 as orphaned pending sponsor retirement or explicit route change control.
  - Replace CR-001-through-CR-478 screen claims with exact or approved contextual requirement expressions.
  - Replace fictional persona labels with actual capability, RLS, RPC, and feature-flag boundaries.
  - Keep provider-held, contract-held, and policy-held behavior unavailable and visibly unresolved.
  - Allocate any new design identity only through governance collision checking.

