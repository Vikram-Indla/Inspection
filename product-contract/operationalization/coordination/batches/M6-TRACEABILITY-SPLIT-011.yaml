      - "/admin/regulations/:id"
      - /admin/items
      - /admin/packages
      - "/admin/packages/:id/designer"
      - /admin/violations
      - "/admin/violations?mode=penalty"
    enabling_routes:
      - /admin/compliance-requests
      - /admin/compliance-requests/new
      - "/admin/compliance-requests/:id"
      - /admin/compliance-approvals
    primary_designs:
      - logical_id: WA-DES-019
        role: MAKER_CHECKER_REQUEST_ENVELOPE_ONLY
        status: CONFIRMED_WITH_CORRECTION
    ownership_rule: >-
      Compliance Requests coordinates change approval and publication but does
      not replace the domain screen that owns each configuration object.
    preserve:
      - "Versioning, draft/publish, dependency validation, impact, deactivation and immutable audit."
      - "RPC/RLS/correlation and transactional claims only where independently proven."

