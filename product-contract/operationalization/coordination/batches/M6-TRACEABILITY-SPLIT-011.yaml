business_decision:
  recommendation: APPROVE_TRACEABILITY_CORRECTION_ONLY
  reason: >-
    CR-449..CR-478 describe Compliance Configuration. The current M6 bundle
    mixes unrelated Committee, operational Enforcement and Risk products and
    omits several true Compliance Configuration routes. Correct ownership
    before design correction or implementation.
  completion_effect: >-
    This packet changes no completion score. It prevents unrelated screens from
    being counted against the 30 requirement rows and identifies the missing
    route/design evidence required for future acceptance.

proposed_authoritative_matrix:
  - requirement_ids: ["CR-449"]
    capability: "Regulation Management"
    primary_routes: ["/admin/regulations", "/admin/regulations/:id"]
    screens: ["SCR-ADM-010", "SCR-ADM-011"]
    components:
      - apps/web/src/app/(app)/admin/regulations/page.tsx
      - apps/web/src/app/(app)/admin/regulations/[id]/page.tsx
    primary_designs:
      - logical_id: WA-DES-015
        role: REGISTRY_NEAREST_MATCH
        status: CONFIRMED_WITH_CORRECTION
      - logical_id: WA-DES-002
        role: DETAIL_NEAREST_MATCH
        status: CONFIRMED_WITH_CORRECTION
    permissions: "RBAC-001; Compliance Admin; maker-checker; published version immutable."
    preserve:
      - "Clause hierarchy, legal-source attachment, effective dates, version lineage and audit."
      - "Draft-only edit, dependency guard, distinct approver and reasoned deactivation."
  - requirement_ids: ["CR-450", "CR-453", "CR-467", "CR-468", "CR-471..CR-473"]
