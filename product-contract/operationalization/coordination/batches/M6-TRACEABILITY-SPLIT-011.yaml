        role: VIOLATION_REGISTRY_NEAREST_MATCH
        status: CONFIRMED_WITH_CORRECTION
      - logical_id: NONE
        role: PENALTY_MAPPING
        status: NO_DESIGN_MATCH
    route_decision: >-
      SCR-ADM-041 names /admin/penalties. Current implementation deliberately
      owns the logical mode /admin/violations?mode=penalty. Keep the current
      route until sponsor-approved route change; design must use the recorded
      current route.
    preserve:
      - "Configuration/runtime violation distinction and no inspector override."
      - "Legal-clause anchor, one-to-one penalty mapping, governed presets, effective version, audit/usage and maker-checker."
  - requirement_ids:
      - "CR-454..CR-457"
      - "CR-464..CR-470"
      - "CR-473"
      - "CR-475..CR-478"
    capability: "Package, Form, Template and Runtime Contract Management"
    primary_routes: ["/admin/packages", "/admin/packages/:id/designer"]
    screens: ["SCR-ADM-030", "SCR-ADM-031"]
    components:
      - apps/web/src/app/(app)/admin/packages/page.tsx
      - apps/web/src/app/(app)/admin/packages/DraftEditor.tsx
      - apps/web/src/app/(app)/admin/packages/PackagePreview.tsx
      - apps/web/src/app/(app)/admin/packages/PublishControls.tsx
      - apps/web/src/app/(app)/admin/packages/TemplateRegistry.tsx
    primary_designs:
      - logical_id: WA-DES-002
        role: PACKAGE_LIBRARY_AND_VERSION_EDITOR_NEAREST_MATCH
        status: CONFIRMED_WITH_CORRECTION
      - logical_id: WA-DES-005
        role: PACKAGE_DESIGNER_NEAREST_MATCH
        status: NO_CODE_MATCH
    code_gap: >-
      No /admin/packages/:id/designer route exists. Some designer behavior is
      implemented inline under /admin/packages, but the canonical route and
      full screen contract are absent.
    preserve:
      - "Sections/order, required/optional/conditional, response mapping and response evidence."
      - "Action forms, templates, preview, impact, complete dependency validation and cycle detection."
      - "Frozen item/violation/template snapshots, maker-checker publication and runtime version pinning."
  - requirement_ids: ["CR-458..CR-463"]
