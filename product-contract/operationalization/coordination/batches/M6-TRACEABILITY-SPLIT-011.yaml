preservation_contract:
  - "No existing regulation, item, package, template, violation or penalty capability is removed by remapping."
  - "Maker-checker, RLS/RBAC, audit, versioning, immutable published/runtime snapshots and stale-write guards remain binding."
  - "No legal basis, provider, weight, score, threshold, SLA, grace period, penalty, severity or enforcement action is invented."
  - "Current /admin/violations?mode=penalty route remains until approved route change."
  - "Compliance Requests remains an enabling governance layer, not a substitute for domain screens."
  - "Committee, Enforcement and Risk retain their own later-contract products and evidence."

