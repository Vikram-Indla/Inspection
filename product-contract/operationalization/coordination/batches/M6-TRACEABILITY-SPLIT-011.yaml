    primary_routes: ["/admin/items", "/admin/items/:id/runtime-preview"]
    screens: ["SCR-ADM-020"]
    components:
      - apps/web/src/app/(app)/admin/items/page.tsx
      - apps/web/src/app/(app)/admin/items/[id]/runtime-preview/page.tsx
    primary_designs:
      - logical_id: WA-DES-015
        role: REGISTRY_NEAREST_MATCH
        status: CONFIRMED_WITH_CORRECTION
      - logical_id: WA-DES-002
        role: DETAIL_AND_RUNTIME_PREVIEW_NEAREST_MATCH
        status: CONFIRMED_WITH_CORRECTION
    open_decision:
      rows: ["CR-471", "CR-472"]
      decisions: ["DEC-001", "DEC-028"]
      rule: >-
        Item scoring fields may be located on the item route, but no weight,
        score, exclusion behavior or downstream calculation is design- or
        implementation-authorized until both decisions close.
    preserve:
      - "Unique code, clause ownership, governed response/evidence presets and reuse."
      - "Frozen package snapshot prerequisite, optimistic stale-write guard, usage and audit."
  - requirement_ids: ["CR-451", "CR-452", "CR-474"]
    capability: "Violation and Penalty Configuration"
    primary_routes: ["/admin/violations", "/admin/violations?mode=penalty"]
