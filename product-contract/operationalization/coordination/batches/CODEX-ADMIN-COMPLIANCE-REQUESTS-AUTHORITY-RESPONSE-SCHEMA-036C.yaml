ack_return_block_rules:
  evaluation_precedence:
    - BLOCK
    - RETURN
    - ACK
  BLOCK:
    conditions:
      - Source packet hash does not match this schema.
      - Respondent authority is absent, unverifiable, expired, revoked or out of scope.
      - Bundle, response or evidence hash mismatches exact canonical content.
      - Any INC check with result_on_true BLOCK is true.
      - Any preservation acknowledgement is false.
      - Evidence is tampered, revoked, expired for the response window or contains prohibited secrets.
      - The response weakens maker-checker, RLS, audit, immutability, history, transactional publication or runtime locking.
      - The response attempts to grant implementation, migration, data, provider, merge, deployment or release authority.
    result:
      receipt_action: Do not record an accepted decision receipt.
      implementation_action: Remains BLOCKED.
      correction_action: New authority response or formal change control is required.
  RETURN:
    conditions:
      - No BLOCK condition is true.
      - One or more required response, selection, parameter, evidence, hash, expiry or attestation values is null or structurally invalid.
      - Conditional NOT_APPLICABLE lacks a complete rationale or incompatible-option selection.
      - An evidence reference is missing, ambiguous or not linked to the relevant question.
      - An incompatibility check is null, UNKNOWN or has result_on_true RETURN.
      - Unresolved points are present.
    result:
      receipt_action: Return the response bundle for bounded correction.
      implementation_action: Remains BLOCKED.
      correction_action: Preserve the submitted record; issue a new version that supplies only the missing or corrected authority material.
  ACK:
    conditions:
      - No BLOCK or RETURN condition is true.
      - All nine questions are complete or validly NOT_APPLICABLE.
      - Exactly one allowed option is selected in every choice set.
      - Respondent authority is valid for every answered question.
      - Every required evidence item and hash verifies.
      - Bundle is currently valid and not expired or revoked.
      - All INC checks are false.
      - All preservation acknowledgements are true.
      - Unresolved points are empty.
      - Independent validator records the exact bundle hash and evidence manifest hash.
    result:
      receipt_action: Eligible for independent recording in dormant receipt packet 036.
      implementation_action: Still BLOCKED pending contract change control and serial A-C lease preflights.
      completion_credit: Zero until implementation, independent QA, browser proof and sponsor gates pass.
  blank_template_expected_evaluation:
    verdict: RETURN
    reason: Required response-bearing values are null.
    rule: This expected result is schema behavior, not a populated validator response.

global_stop_conditions:
  - Any null response value is filled in this packet.
  - A default answer, selection, timezone, provider, retention value or mapping is inferred.
  - A missing field is silently converted to empty, false, zero or UNKNOWN.
  - A hash is computed over non-canonical bytes or excludes a response-bearing field.
  - Expiry or no-expiry is inferred.
  - An incompatibility or preservation failure is downgraded to preserve pace.
  - ACK is treated as a product, database, provider, data, merge or release lease.
  - Product, test, design, database, data, branch, stash, main or setup is modified.

gate_check:
  task_packet_result: PASS
  response_bundle_result: RETURN
  implementation_result: BLOCKED
  reason: >-
    The schema is complete, but the embedded response bundle is deliberately
    blank. All respondent, selection, parameter, evidence, hash, expiry,
    incompatibility, preservation and attestation values are null.
  next_allowed_action: >-
    Use the safe read-only validator preflight while no signed response exists.
    If a signed response arrives, populate a separate response artifact and
    independently validate it; do not edit this blank schema in place.
  browser_readiness: NOT_READY_DECISION_ONLY

rollback:
  this_packet: Remove only this packet if returned; no product, test, design, database, data, branch or remote state changed.
  populated_response_rule: >-
    A submitted response is append-only evidence. Correction creates a new
    response version and never overwrites the prior bundle, evidence hashes,
    validator output or receipt audit.

safe_successor:
  packet_id: CODEX-ADMIN-COMPLIANCE-REQUESTS-AUTHORITY-RESPONSE-VALIDATOR-PREFLIGHT-036D
  mode: READ_ONLY_CONTROL_PLANE
  start_condition: No signed authority response is available.
  scope: >-
    Define the future validator's exact inputs, deterministic checks, reason
    codes and synthetic fixture classes for ACK, RETURN and BLOCK without
    populating a real response or selecting business answers. Do not implement
    a validator, grant a lease or modify product, test, design, database, data,
    branch, stash, main or setup state.
  safe_because: >-
    It makes later receipt review repeatable without guessing an answer or
    overlapping implementation ownership.

