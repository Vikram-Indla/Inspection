schema_contract:
  schema_id: SAQEEL-CCR-AUTHORITY-RESPONSE-036C
  schema_version: "1.0"
  source_question_ids:
    - CCR-036B-Q01
    - CCR-036B-Q02
    - CCR-036B-Q03
    - CCR-036B-Q04
    - CCR-036B-Q05
    - CCR-036B-Q06
    - CCR-036B-Q07
    - CCR-036B-Q08
    - CCR-036B-Q09
  source_input_ids:
    - UAI-001
    - UAI-002
    - UAI-003
    - UAI-004
    - UAI-005
    - UAI-006
    - UAI-007
    - UAI-008
    - UAI-009
  null_policy:
    blank_template: Every response-bearing leaf is null.
    populated_bundle: >-
      Null is prohibited for a required field. Conditional fields may remain
      null only when the governing selection makes them inapplicable and a
      signed NOT_APPLICABLE rationale is present.
    no_empty_substitute: Empty string, empty object, empty array, zero, false or UNKNOWN may not substitute for null or a required answer.
  type_contract:
    identifier: uppercase or source-exact string
    free_text: non-empty UTF-8 string with no hidden control characters
    boolean_acknowledgement: true only; false is a preservation failure
    timestamp: RFC3339 timestamp with explicit offset
    date: ISO-8601 calendar date
    sha256: exactly 64 lowercase hexadecimal characters
    evidence_items: non-empty ordered array of evidence records
    selection: exact option ID from the relevant allowed set
  response_order:
    - respondent_authority
    - selections
    - question_responses
    - evidence_manifest
    - validity
    - incompatibility_results
    - preservation_acknowledgements
    - unresolved_points
    - hashes
    - submitted_attestation
  deterministic_serialization:
    format: canonical_json_projection
    character_encoding: UTF-8
    line_endings: LF
    object_key_order: lexicographic_by_unicode_code_point
    array_order: source-declared_order_unless_the_field_contract_declares_identifier_sort
    nulls: retained
    numbers: prohibited_unless_a_question_parameter_explicitly_declares_a_numeric_business_value
    timestamps: normalized_to_RFC3339_with_original_offset_retained_in_a_sibling_field_when_business_relevant
    unicode: preserve_normalized_NFC
    excluded_from_response_hash:
      - hashes.response_sha256
      - hashes.bundle_sha256
      - validator_output
    rule: >-
      The exact canonical JSON bytes are the hash input. YAML formatting,
      comments, map insertion order and filesystem metadata are never hashed.

selection_contract:
  required_choice_sets:
    D1_REPRESENTATION: [D1-O1, D1-O2, D1-O3]
    D2_ACTIVATION: [D2-A1, D2-A2, D2-A3]
    D2_TIME_BASIS: [D2-T1, D2-T2]
    D2_BACKFILL: [D2-B1, D2-B2, D2-B3]
    D3_ACTION_BOUNDARY: [D3-A1, D3-A2]
    D3_ATTACHMENT_STORAGE: [D3-S1, D3-S2]
    D3_ATTACHMENT_INTAKE: [D3-I1, D3-I2]
    D4_SNAPSHOT_STORAGE: [D4-S1, D4-S2, D4-S3]
    D4_SCHEDULED_ELIGIBILITY: [D4-E1, D4-E2, D4-E3]
  rule: Exactly one source option is required per choice set; no value is preselected here.

evidence_item_schema:
  required_fields:
    evidence_id: source-scoped unique identifier
    question_ids: non-empty source-ordered subset of CCR-036B-Q01..Q09
    evidence_type: signed_policy, manifest, matrix, architecture, report, fixture, test_map, or approval_record
    title: non-empty descriptive title
    issuer_name: recorded authority or evidence producer
    issuer_role: recorded role
    authority_basis: non-empty authority reference
    issued_at: RFC3339 timestamp
    valid_from: RFC3339 timestamp or explicit NOT_APPLICABLE basis
    expires_at: RFC3339 timestamp or explicit no-expiry basis
    source_reference: immutable repository path, governed record ID or approved evidence URI
    content_sha256: SHA-256 of exact evidence bytes
    metadata_sha256: SHA-256 of canonical metadata excluding both hash fields
    confidentiality_class: explicit approved classification
    supersedes_evidence_id: null or exact prior evidence ID
  forbidden:
    - unsigned chat implication
    - mutable latest-only URL without immutable version identity
    - missing or unverifiable hash
    - secret, credential, service-role key or direct personal contact data
    - evidence whose expiry precedes the response validity window

hash_contract:
  algorithm: SHA-256
  hex_encoding: lowercase
  response_hash:
    scope: One question response including parameters, its evidence references, validity and acknowledgement; excludes its own hash.
    required_when_populated: true
  evidence_hash:
    scope: Exact evidence file bytes and separately canonicalized evidence metadata.
    required_for_every_item: true
  bundle_hash:
    scope: Entire canonical response projection including all nine response hashes and evidence manifest; excludes bundle_sha256 and validator_output.
    required_when_submitted: true
  source_hashes:
    rule: Source packet hashes must exactly match this schema header before evaluation.
  mismatch_result: BLOCK

expiry_contract:
  required_bundle_fields:
    valid_from: required populated RFC3339 timestamp
    expires_at: populated RFC3339 timestamp or explicit no_expiry_basis
    no_expiry_basis: null when expires_at exists; otherwise signed authority basis
    review_on: populated date no later than expiry when expiry exists
    expiry_timezone: explicit IANA timezone
    supersedes_bundle_id: null or exact prior bundle ID
    change_triggers: non-empty list
  mandatory_change_triggers:
    - governing requirement or acceptance change
    - selected option or parameter change
    - authority scope or delegation change
    - schema, provider, RLS, storage or runtime contract change
    - evidence revocation, supersession or hash mismatch
    - discovered incompatibility or preservation-floor conflict
  rules:
    - Expired, revoked or not-yet-valid authority cannot receive ACK.
    - No-expiry is not inferred from a null expires_at.
    - Supersession never deletes the prior signed response or audit record.

incompatibility_check_catalogue:
  checks:
    - check_id: INC-001
      condition: More or fewer than one option is supplied for any required choice set.
      result_on_true: BLOCK
    - check_id: INC-002
      condition: D2-A1 coexists with a persisted database or worker activation authority.
      result_on_true: BLOCK
    - check_id: INC-003
      condition: D2-T1 and D2-T2 both govern the same field or boundary.
      result_on_true: BLOCK
    - check_id: INC-004
      condition: D1-O2 or D1-O3 is selected while Q02 is null, expired or unsupported by schema evidence.
      result_on_true: RETURN
    - check_id: INC-005
      condition: Any D1 option is selected while Q01 field manifest is incomplete.
      result_on_true: RETURN
    - check_id: INC-006
      condition: D3-A2 is selected while Q07 allow-list, role, reason or audit parameters are incomplete.
      result_on_true: BLOCK
    - check_id: INC-007
      condition: D3-I2 or D3-S2 is selected while Q08 retention/orphan/access policy is incomplete.
      result_on_true: BLOCK
    - check_id: INC-008
      condition: D4-E1 is selected while Package publication reads Scheduled components.
      result_on_true: BLOCK
    - check_id: INC-009
      condition: D4-E2 or D4-E3 is selected without compatible Q03 time and D2 activation readiness.
      result_on_true: BLOCK
    - check_id: INC-010
      condition: Any D4 option is selected while Q09 mapping or D1/D2 prerequisite response is incomplete.
      result_on_true: RETURN
    - check_id: INC-011
      condition: A NOT_APPLICABLE response lacks an explicit incompatible-option selection and rationale.
      result_on_true: RETURN
    - check_id: INC-012
      condition: Any answer conflicts with a prohibition or preservation floor in packets 035, 036A or 036B.
      result_on_true: BLOCK
    - check_id: INC-013
      condition: Evidence is expired, revoked, unhashed, hash-mismatched or not linked to the relevant question.
      result_on_true: BLOCK
    - check_id: INC-014
      condition: Respondent authority is absent, expired, out of scope or unsupported by an authority record.
      result_on_true: BLOCK
    - check_id: INC-015
      condition: A response attempts to grant implementation, DDL, data, provider, merge or release authority.
      result_on_true: BLOCK
  evaluation_order: INC-001 through INC-015
  severity_precedence: BLOCK_over_RETURN_over_ACK

preservation_acknowledgement_catalogue:
  acknowledgements:
    - ACK-PRES-001: CCR-only create and modify remains mandatory.
    - ACK-PRES-002: Maker-checker and self-approval prohibition remain mandatory.
    - ACK-PRES-003: Future-effective content remains unavailable before its effective boundary.
    - ACK-PRES-004: Prior approved truth remains until an approved successor is effective.
    - ACK-PRES-005: Rejected, invalid or incomplete branches never publish.
    - ACK-PRES-006: Historical Inspection, Enforcement, Package and attachment references never repoint.
    - ACK-PRES-007: Published versions, evidence and Package projections remain immutable and auditable.
    - ACK-PRES-008: Package publication remains transactional and concurrency-safe.
    - ACK-PRES-009: Field and offline execution use only the pinned immutable Package version.
    - ACK-PRES-010: RLS, grants, RPC guards and storage policies remain database-authoritative.
    - ACK-PRES-011: No service-role client or client-supplied snapshot becomes business authority.
    - ACK-PRES-012: A response or receipt does not itself grant implementation, migration, data, provider, merge or release authority.
  rule: Every populated acknowledgement must be true; false or null at submission is BLOCK.

