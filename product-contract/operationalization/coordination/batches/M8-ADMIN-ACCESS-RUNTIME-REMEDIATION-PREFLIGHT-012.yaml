rollback_and_recovery_contract:
  source:
    - Every future implementation slice begins from an identified commit and clean leased paths.
    - Existing migrations are immutable; correction uses a new forward-only migration.
    - Application and test changes remain isolated to the named lease paths.
  database:
    - All database probes run inside a transaction and roll back fixture mutations.
    - Remote fixture creation requires fixed reserved identities and an explicit cleanup script.
    - Reconciliation must prove role, capability, permission and audit counts return to the expected state.
    - If cleanup or reconciliation fails, certification stops and the shared data lease remains blocked.
  access_safety:
    - Never remove the final verified Security Admin.
    - Never test revocation against sponsor, operator or unrelated shared accounts.
    - Preserve a separately verified recovery administrator before mutation testing.
    - A denied or conflicted access change must leave grants, matrix head and audit state unchanged except for an approved denied-attempt event.
  release:
    - No rollback depends on editing or deleting an applied migration.
    - Application rollback must remain compatible with the forward database shape.
    - A fail-closed feature boundary is required if application and migration deployment cannot be atomic.

stop_conditions:
  - Current slice or lease authority does not name every file and shared-data target.
  - Atomic requirement mapping or approved change control is absent.
  - Any of M8-DEC-001 through M8-DEC-004 remains required for the selected implementation plan.
  - Live migration inventory differs from repository migration assumptions.
  - The reserved recovery Security Admin cannot be independently verified.
  - Test fixtures overlap sponsor, operator or another active lane's data.
  - Direct table mutation can bypass the selected database guard.
  - Concurrent tests can remove the last Security Admin or leave nondeterministic state.
  - Audit correlation cannot distinguish attempt, mutation, replay and row-trigger events.
  - Cleanup or post-test reconciliation does not return the fixture set to its expected state.
  - Product, test, design, migration or evidence files overlap another active lease.
  - Any required P0 acceptance or negative path fails or lacks evidence.

