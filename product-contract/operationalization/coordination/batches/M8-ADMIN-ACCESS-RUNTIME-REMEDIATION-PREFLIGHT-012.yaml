decision_blockers:
  - id: M8-DEC-001
    priority: P0
    question: >-
      Does access governance retain D-006 single-security_admin direct audited
      writes, or adopt maker-checker for sensitive access changes?
    conflict: >-
      D-006 defers maker-checker, while MVP2-REQ-0227 and MVP2-REQ-0241 require
      maker-checker or sensitive-action approvals.
    required_owner: Sponsor plus product governance
    implementation_effect:
      single_authority: Harden existing atomic RPC path without approval workflow.
      dual_control: Add immutable request, review, approval, publish and self-review denial.
  - id: M8-DEC-002
    priority: P0
    question: >-
      Are capabilities/role_capabilities/user_capability_grants and
      permissions/role_permissions intentionally separate authority domains?
    required_owner: Architecture plus product governance
    implementation_effect: Defines which catalogue, guard and effective-access explanation owns each action.
  - id: M8-DEC-003
    priority: P0
    question: >-
      Is /admin/access a deny-by-route Security Admin control plane, or an
      authenticated read-only roster with Security Admin mutation controls?
    required_owner: Product governance
    implementation_effect: Determines route admission, roster data minimization and unauthorized evidence.
  - id: M8-DEC-004
    priority: P0
    question: >-
      Are Create role, Compare and Publish mandatory MVP1 behavior for
      SCR-ADM-090, or must the screen contract be changed to the current
      seed-managed catalogue?
    required_owner: Product governance
    implementation_effect: Defines whether immutable version and publication engines must be built.

technical_risks:
  - id: M8-RISK-001
    priority: P0
    risk: Stronger role_permissions server-action guards are bypassable through direct table access.
    evidence: >-
      f360_role_permissions_admin permits every security_admin insert, update and
      delete; admin.access.manage and own-authority checks exist only in the action.
    fail_closed_correction: Remove direct write grant and expose guarded RPCs or equivalent database-enforced checks.
  - id: M8-RISK-002
    priority: P0
    risk: Sole-security-admin invariant can race.
    evidence: admin_revoke_role performs count-then-delete without row/advisory serialization.
    fail_closed_correction: Serialize on a stable access-governance key and prove two-session contention.
  - id: M8-RISK-003
    priority: P0
    risk: Concurrent duplicate grants are not deterministically idempotent.
    evidence: Grant RPCs perform existence-check then plain insert without conflict-safe retry semantics.
    fail_closed_correction: Lock or conflict-safe insert with deterministic replay result and one semantic audit event.
  - id: M8-RISK-004
    priority: P0
    risk: Access changes have no stale/version boundary.
    evidence: No expected version, revision, request identifier or published matrix head is supplied.
    fail_closed_correction: Add an explicit revision contract appropriate to M8-DEC-001 and M8-DEC-004.
  - id: M8-RISK-005
    priority: P1
    risk: One logical change can produce ambiguous duplicate audits.
    evidence: user_roles carries a generic trigger and access RPCs append EXE-ACCESS semantic rows.
    fail_closed_correction: Define one correlated semantic event and a documented relationship to row-level audit.
  - id: M8-RISK-006
    priority: P1
    risk: Provider/read failures appear as empty or read-only rather than explicit degraded states.
    evidence: Page logs gate/source errors and reduces missing data to false or empty arrays.
    fail_closed_correction: Preserve each source state and render unavailable/retry without granting authority.
  - id: M8-RISK-007
    priority: P1
    risk: Static policy-count copy can be mistaken for live evidence.
    evidence: UI states 54 policies without querying the current policy inventory.
    fail_closed_correction: Remove the count or source it from a governed, testable read.

