responsive_theme_language_accessibility:
  current_source_strengths:
    - localization rows collapse to one column below 900px
    - logical CSS properties are used in the local layout
    - Arabic editor fields declare RTL and Arabic language
    - form fields have labels and action feedback uses alert or status semantics
    - statuses combine text and appearance
  missing_or_unproven:
    - native 1440, 1160, 1024, 412 or 390, and 320 design/runtime captures
    - bounded page height and usable virtualization or pagination for large dictionaries
    - sticky review context without hiding actions
    - long Arabic, mixed-direction keys, placeholders and dates without clipping
    - exact full-document RTL order, focus order and icon direction
    - light/dark contrast and disabled/focus/error parity
    - keyboard-only search, filtering, editing, review, history and restore
    - focus recovery after save, sync, history load and restore
    - screen-reader distinction between source, translation, state and history
    - 48px target and 16px input proof
    - 200/400 percent zoom, reflow and reduced-motion proof
    - error summary and exact-field focus for large result sets

