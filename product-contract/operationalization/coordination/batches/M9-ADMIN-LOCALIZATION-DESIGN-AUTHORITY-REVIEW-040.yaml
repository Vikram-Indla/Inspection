design_versus_code_delta:
  registered_WA_design_has_code_lacks_or_different:
    - Reference-list families, versioned retirement and external sync ownership.
    - Lookup-family side navigation and consumed-by context.
    - These belong to Lookup Management, not the current ui_strings workflow.
  code_has_registered_WA_design_lacks:
    - Translation search and status filters.
    - Inline Arabic editing.
    - Placeholder mismatch protection.
    - Source synchronization and orphan recovery.
    - Revision history and restore-as-draft.
    - CSV export and coverage KPIs.
  CD_018_requires_code_lacks_or_unproven:
    - Module and screen filter.
    - Exact live screen-context link and freshness.
    - Pluralization contract.
    - Governed Localization Reviewer persona.
    - Complete approved visual risk and impact preview.
    - Native responsive, theme, RTL and accessibility evidence.
  current_source_defects_or_unproven:
    - No canonical catalogue screen ID or route-specific design acceptance row.
    - Incorrect WA-DES-009/010 mapping.
    - No accepted CD-018 R2 handoff.
    - Duplicate shell entries point to the same route under different meanings.
    - Direct-route users may see write controls before RLS denies them.
    - Revision history is public and not reconciled to disclosure requirements.
    - No generic audit_events proof for ui_strings.
    - change_source is not explicitly set for sync or restore.
    - No stale-save concurrency guard.
    - Sync is not atomic and lacks a precise partial-result recovery state.
    - Source scan assumes deployed source availability and literal t-call grammar.
    - Placeholder check covers double braces only and no accepted pluralization grammar exists.
    - Long-Arabic warning uses a heuristic, not measured layout impact.
    - Accepted bilingual shell asset is absent from WA-DES-010 and differs from this branch source.

