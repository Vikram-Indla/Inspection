current_source_capability:
  dictionary:
    - Reads key, English source, Arabic value, status, context and orphan flag.
    - Calculates total, translated, reviewed and coverage counts from the read.
    - Searches key, English and Arabic and filters draft, reviewed, missing and orphaned.
    - Exports the filtered rows as UTF-8 BOM CSV.
  authoring:
    - Adds a draft key with English source, optional Arabic and context.
    - Saves Arabic and returns the row to draft.
    - Marks a non-null Arabic row reviewed.
    - Detects missing double-brace placeholders in the client before save.
    - Flags Arabic length above a simple 1.3-times English heuristic.
  synchronization:
    - Scans TypeScript and TSX source for literal t key and English pairs.
    - Inserts new keys, updates changed English, orphans removed keys and revives reappearing keys.
    - English drift downgrades a previously reviewed row to draft in the database trigger.
  history:
    - Trigger snapshots prior row state into ui_string_revisions.
    - Shows the five newest revisions.
    - Restore changes Arabic only and re-enters draft.
    - Orphans are retained rather than deleted.
  runtime:
    - English is the code fallback.
    - Arabic uses ui_strings with English fallback for missing values.
    - Dictionary reads use a public/anonymous read policy for pre-auth surfaces.
    - A request cache and runtime cache reduce repeat reads.
  honest_boundary: >-
    No machine translation provider, screenshot context link, pluralization
    engine, full-screen impact preview, or separate approval workflow is proven.

permissions_and_data_truth:
  prompt_personas: [Localization Reviewer, Admin]
  runtime_write_roles:
    - compliance_admin
    - security_admin
    - workflow_admin
  route_level_writer_guard: not_found_in_page_or_layout
  read_policy:
    ui_strings: public_using_true
    ui_string_revisions: public_using_true
  navigation_visibility:
    writer_roles_only: true
    security_boundary: false
  actions_visible_to_non_writer_direct_route_user: true_by_source_composition
  write_denial_behavior: zero_row_or_neutral_error_after_submission
  gap: >-
    Navigation hides the destination for non-writers, but direct authenticated
    route access can render the dictionary and write controls. RLS blocks
    mutations, yet UI action visibility and public revision-history disclosure
    are not reconciled to a governed read-only persona contract.

audit_version_and_concurrency_truth:
  versioning:
    ui_string_revision_trigger: present
    old_row_snapshot: present
    recent_history_UI_limit: 5
    restore_as_draft: present
    delete_policy: absent
  audit:
    generic_audit_events_trigger_on_ui_strings: not_found
    revision_changed_by: present
    change_source_runtime_setting_set_by_actions: not_found
    likely_effect: change_source_defaults_to_panel_for_sync_and_restore_too
    implication: >-
      Revision history exists, but it is not the same as a proven generic audit
      event chain and its source label may not distinguish panel, sync and restore.
  concurrency:
    updated_at_exists: true
    updated_at_used_as_compare_and_set: false
    row_version: absent
    stale_conflict_guard: absent
    retained_input_conflict_recovery: absent
    risk: >-
      Concurrent reviewers can overwrite the same Arabic value; the later save
      wins and only history preserves the prior value. No user-facing conflict
      prevents silent semantic replacement.
  sync_atomicity:
    transaction_or_RPC: absent
    mutation_sequence: inserts_then_per_row_EN_updates_then_orphan_batch_then_revive_batch
    partial_failure_possible: true
    recovery_contract: retry_without_exact_partial_summary
    implication: >-
      A failed later synchronization step can leave earlier changes committed.
      The route needs truthful partial-result and reconciliation behavior.

