authorization_and_RLS_mapping:
  requirement_persona: Planner
  target_read_gate:
    access_class: business_staff
    capability: planning.view
    sequence:
      - verified_identity
      - planning_access_class
      - has_planning_capability(planning.view)
      - deny_or_RPC_error_before_any_visit_or_related_query
      - retain_RLS_on_every_related_read
  expected_denied:
    - admin
    - inspector_pending_DEC-025
    - anonymous
  current_target_defect: >
    The target wrapper performs only preview gating. The delegated page starts
    profiles and visit reads without getPlanningAccess(planning.view).
  current_RLS_reality:
    visits: >
      Legacy role policy exposes all visits to planner/ops/reviewer/auditor/
      leadership/compliance_admin and own assigned visits to Inspector. The
      additive capability policy also exposes visits to planning.view.
    assignments: "Inspector-own or planner/ops/reviewer/auditor, plus planning.view capability."
    audit_events: "Planner/ops/reviewer/auditor/leadership/security_admin only."
    profiles: "Self, security_admin, ops or planner under the observed base policy."
    implication: >
      A row can be visible while related assignment, profile, audit or history
      data is partial because policies differ. The page currently renders many
      such failures as empty or missing, not a source-specific degraded state.
  mutation_gate_defect: >
    Action visibility is derived mainly from lifecycle state, not the caller's
    planning.manage/cancel/reassign/reschedule/edit capability. RLS may reject
    submit, but the read-only default is already violated by exposing forms.

workflow_audit_and_version_mapping:
  ready_behavior:
    - planning_status_and_operational_state_rendered_separately
    - assignment_inspection_and_review_are_separate_state_domains
    - submitted_versions_rendered_as_final_and_read_only
    - published_or_locked_package_version_and_visit_package_snapshot_are_visible
    - visit_lifecycle_events_are_append_only_by_policy
    - visit_location_events_and_geo_events_are_read_only_in_the_detail
    - visits_and_assignments_have_append_only_audit_trigger_coverage
    - final_cancelled_and_expired_states_are_visually_identified
    - errors_from_primary_visit_and_attachment_reads_are_neutralized
  blocking_truth_defects:
    - id: DETAIL-READONLY-001
      finding: >
        NotesEditor, attachment upload/remove and the full management ActionBar
        render immediately. There is no explicit read-only mode followed by an
        Edit selection as CR-057 and CR-076 require.
    - id: DETAIL-AUDIT-CAP-002
      finding: >
        Audit history is ordered newest-first and capped at 30. CR-057/076 and
        CR-066/097 require complete visit history; the UI labels the section
        latest 30 without a complete-history navigation or pagination path.
    - id: DETAIL-LIFECYCLE-CAP-003
      finding: >
        Lifecycle and location event reads are each capped at 50 with no
        pagination or completeness label sufficient to satisfy the complete
        timeline requirements.
    - id: DETAIL-DEGRADE-004
      finding: >
        Lifecycle, location and visit-package query failures are logged and
        converted to empty arrays. A failed source therefore looks like a
        legitimate no-events/no-packages state.
    - id: DETAIL-AUDIT-EMPTY-005
      finding: >
        The audit empty copy combines no history with no audit permission, so
        data absence and authorization failure are indistinguishable.
    - id: DETAIL-PARTIAL-PRIMARY-006
      finding: >
        The single nested visit read has no per-relation error contract.
        Policy-filtered relations can appear absent without a degraded-source
        explanation.
    - id: DETAIL-TRANSITION-007
      finding: >
        Existing mutation actions update the primary state then append a
        lifecycle event in a second write. The action surfaces a lifecycle gap
        after state commit; this cannot be treated as atomic lifecycle proof.
    - id: DETAIL-REVALIDATE-008
      finding: >
        Existing actions revalidate /visits paths only. The Planning-owned
        preview path is not named, so target refresh parity is unproven.

