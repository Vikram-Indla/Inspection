canonical_requirement_derivation:
  source: product-contract/web-admin-phase1/REQUIREMENT_BASELINE.csv
  source_total_rows: 478
  exact_completion_candidates:
    - requirement_id: CR-057
      source_coordinate: "Visit Planning- Mangment!6"
      acceptance_id: WA-AC-0057
      evidence_id: WA-EV-0057
      capability: View Visit Details
      purpose: "Review all information related to a planned visit."
      user_flow: Open Visit
      required_system_action: >
        Display factory profile, location, assignment, visit information,
        timeline and audit history.
      business_rule: "Information is read-only until Edit is selected."
      persona: Planner
      dependency: Visit Repository
      source_acceptance: "Planner can access complete visit information."
    - requirement_id: CR-076
      source_coordinate: "Visit Planning- Mangment!25"
      acceptance_id: WA-AC-0076
      evidence_id: WA-EV-0076
      capability: View Visit Details
      purpose: "Display complete planning information for a selected visit."
      user_flow: "Visit → Details"
      required_system_action: >
        Display factory profile, assignment, planning information, location,
        timeline, attachments and audit.
      business_rule: "Information remains read-only until Edit is selected."
      persona: Planner
      dependency: Visit Repository
      source_quality_note: >
        The source row's later fields are visibly displaced, but its requirement
        ID, capability, system action, acceptance ID and evidence ID are explicit.
        This packet preserves them and does not repair the frozen baseline.
  exact_completion_candidate_count: 2
  rationale: >
    CR-057 and CR-076 are the only Phase 1 M2 rows whose canonical capability
    is exactly View Visit Details. Neither is replaced, deduplicated or guessed.
  AI_boundary:
    - "CR-057 risk summary is Future and receives no completion credit."
    - >
      CR-076 contains an AI history/risk summary without a Phase 2 label in the
      source. No AI provider or summary may be invented; the item remains
      BLOCKED_MISSING_CONTRACT until separately governed.

