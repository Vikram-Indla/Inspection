common_future_lease_controls:
  no_grant_statement: >-
    This packet defines possible future envelopes only. Codex lead must issue a
    separate exact lease after every prerequisite is PASS.
  generated_migration_protocol:
    - Confirm the exact accepted predecessor commit and a clean isolated worktree.
    - Confirm no migration owner holds the logical name or database objects.
    - Inspect `supabase migration --help` and `supabase migration new --help`.
    - Run `supabase migration new <approved-logical-name>` only after grant.
    - Record the CLI-generated path, SHA and owner in the granted lease before SQL editing.
    - Stop if the generated path collides, the migration graph advanced, or project linkage is ambiguous.
  owner_separation:
    lease_issuer: Codex lead
    product_database_decision_owner: Sponsor or recorded delegated authority
    implementation_owner_rule: One named implementation owner per boundary
    independent_qa_rule: >-
      Each boundary has a reviewer who did not implement or author its focused
      probe. The reviewer may not modify the implementation under review.
    integration_owner: Codex lead
    later_test_author_rule: The E test author implemented none of A-D.
    later_certifier_rule: The E certifier is distinct from all implementers and test authors.
  shared_constraints:
    - No service-role browser or application client.
    - No production or shared business-data write in A-C implementation work.
    - No remote DDL without a separate exact project and migration authority.
    - No Cron, scheduler, notification or external-provider assumption.
    - No direct status mutation, audit deletion or immutable-history rewrite.
    - No requirement credit until the complete E certification passes.

