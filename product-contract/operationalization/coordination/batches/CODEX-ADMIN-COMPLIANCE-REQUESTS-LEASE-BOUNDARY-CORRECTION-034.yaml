    database_bridge_invariants:
      source_truth: >-
        The database re-reads exact approved, effective and immutable CCR
        request, revision, component, entity-version and publication rows. It
        does not trust client-supplied live legacy values or unverified JSON.
      atomicity: >-
        Package status transition, full item/evidence/template/violation/
        penalty/dependency snapshot insertion, provenance hashes and audit
        succeed in one transaction or leave zero new rows.
      maker_checker: >-
        Package maker cannot publish; the checker is authorized and distinct.
      immutability: >-
        Published, locked, deactivated and historical Package versions and
        snapshots remain immutable.
      bypass_prevention: >-
        The existing publish_package_version entry cannot publish without the
        governed bridge. It is either replaced by the governed implementation
        or retained only as a fail-closed compatibility wrapper with identical
        provenance checks.
      concurrency: >-
        Stale version, changed CCR head, duplicate publication and concurrent
        package publish attempts are rejected before any partial commit.
    focused_probe_contract:
      path: supabase/tests/compliance_package_snapshot_bridge_probe.sql
      required_checks:
        - Catalogue bridge objects, RLS, grants, triggers and function privileges.
        - Successful publish stores exact CCR request, revision, component, version, publication and hash provenance.
        - One invalid or non-effective dependency rolls back package, snapshots, provenance and audit atomically.
        - Draft, returned, rejected, future, deactivated and stale CCR versions are rejected.
        - Package maker self-publish, denied persona, anon and PUBLIC are rejected.
