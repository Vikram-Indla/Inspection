        - any role widening or historical-row deletion
    database_bypass_prevention_contract:
      direct_table_invariant: >-
        After cutover, authenticated, anon and PUBLIC have no INSERT, UPDATE or
        DELETE privilege or permissive write policy on the seven named legacy
        tables. Historical SELECT remains least-privilege and RLS-scoped.
      data_api_invariant: >-
        Direct REST/Data API create, modify and publish attempts fail at the
        database even for Compliance Admin and Form Admin.
      legacy_rpc_invariant: >-
        PUBLIC and anon execution is denied. Authenticated execution of each
        legacy mutation RPC is revoked unless the approved action matrix names
        it as a lifecycle-only exception. Any exception must reject business
        content changes, require an allowed role, enforce maker-checker where
        applicable, preserve immutable fields and append correlated audit.
      trigger_invariant: >-
        Table-level guards reject unapproved legacy writes regardless of the
        caller path, including direct SQL, Data API and SECURITY DEFINER RPC.
        The implementation may not trust a client-set session flag as proof of
        CCR provenance.
      governed_write_invariant: >-
        Create and modify business content enter only through the existing
        guarded CCR request/revision/component/decision/publication flow and
        exact A version identities. No UI or database path may manufacture a
        legacy draft outside that lineage.
      attachment_invariant: >-
        Regulation source-file upload/removal and metadata mutation follow the
        approved action matrix. If not explicitly preserved as a lifecycle-only
        exception, authenticated bucket and metadata writes are denied after
        cutover. Existing objects, hashes, access control and historical reads
        are never deleted or weakened.
      current_user_invariant: >-
        Role presentation uses auth.uid()-scoped role evidence or an existing
        verified-current-user helper. An unfiltered user_roles result cannot
        authorize Create Request.
    focused_probe_contract:
      path: supabase/tests/compliance_request_authoring_cutover_probe.sql
      required_checks:
        - Catalogue exact table grants, write policies, triggers and function execute privileges.
        - Deny direct insert, update and delete for Compliance Admin, Form Admin, Reviewer, denied persona, anon and PUBLIC as applicable.
        - Deny every unapproved legacy publish RPC entry point.
        - Prove each approved lifecycle-only exception changes only classified fields and appends correlated audit.
        - Prove historical Library and attachment reads remain RLS-scoped.
        - Prove no client-controlled flag can bypass table guards.
        - Execute in a transaction and leave zero fixture or storage residue.
    implementation_evidence_contract:
      - Probe output and object catalogue attached to the B factual evidence file.
      - Library exposes only approved effective A versions and truthful empty/error/degraded states.
      - Draft, returned, rejected, future, deactivated and unapproved versions are absent from current truth.
      - Create Request is visible to authorized writers and absent for Reviewer and denied personas.
      - Direct Data API, SQL, legacy RPC and attachment bypass negatives pass.
      - Historical legacy reads, audit, usage and source-file custody remain intact.
    rollback: >-
      Before final cutover, B may run read-parity without changing write
      authority. After cutover, rollback may restore the prior read projection
      only through a reviewed forward change. It may not reopen direct legacy
      create/modify/publish or weaken attachment custody automatically.

