    - "OTP verification remains server-side and cannot be bypassed."
    - "An unavailable provider is not represented as connected."
    - "No unavailable integration is replaced by a permanent mock."

hard_boundary:
  - "Read-only contract definition plus this one uniquely owned packet."
  - "No code, migration, policy, function, grant, database, data, seed, test, evidence, design, owner, lease, dispatch, branch, stash, commit, push or shared-control mutation."
  - "No invented OTP thresholds, provider selection, legal rule, retention period or break-glass procedure."
  - "No requirement credit."

contract_principles:
  - principle_id: RP-075-01
    rule: "Secrets are retained only in the authoritative server-side record needed to verify OTP; they never cross a normal application read boundary."
  - principle_id: RP-075-02
    rule: "Immutable historical audit rows are preserved byte-for-byte; redaction happens at every read projection."
  - principle_id: RP-075-03
    rule: "Every application query uses an explicit allowlist. Recursive denylist filtering alone is insufficient."
  - principle_id: RP-075-04
    rule: "A row-authorized caller is not automatically authorized for every column in that row."
  - principle_id: RP-075-05
    rule: "The reviewer sees proof of verification, not OTP material."
  - principle_id: RP-075-06
    rule: "The assigned inspector sees the bounded live status needed to operate the flow, not code_hash or raw provider metadata."
  - principle_id: RP-075-07
    rule: "One business action may have raw trigger and explicit audit rows, but the presentation must label them deterministically and must not double-count them as two business actions."
  - principle_id: RP-075-08
    rule: "No UI, log, screenshot, report, fixture output or evidence artifact may contain a live OTP, code_hash or unredacted verification_record."

field_classification:
  - field: verification_record.code_hash
    class: SECRET_AUTHENTICATOR_DERIVATIVE
    storage: SERVER_ONLY_CURRENT_RECORD
    normal_application_read: NEVER
    audit_projection: NEVER
    admin_audit_projection: NEVER
    evidence: NEVER
    replacement_fact: has_active_code
  - field: verification_record.expires_at
    class: SENSITIVE_EPHEMERAL_OPERATIONAL
    storage: SERVER_ONLY_CURRENT_RECORD
    normal_application_read: "Allowed only through vp_otp_status to a session-authorized caller."
    audit_projection: OMIT
    admin_audit_projection: OMIT
    evidence: "Only bounded pass/fail or fixture-relative expiry proof; no live value."
    replacement_fact: "status and has_active_code"
  - field: verification_record.attempts
    class: SENSITIVE_OPERATIONAL_COUNTER
    storage: SERVER_ONLY_CURRENT_RECORD
    normal_application_read: "Allowed only as attempts_used/attempts_max through vp_otp_status."
    audit_projection: "Allowed only as the explicit OTP_FAILED attempt number or OTP_VERIFIED attempts count already recorded by the OTP RPC."
    admin_audit_projection: "Same bounded explicit event count; never the raw record."
    evidence: "Allowed as aggregate fixture count with no authenticator material."
  - field: verification_record.resends
    class: SENSITIVE_OPERATIONAL_COUNTER
    storage: SERVER_ONLY_CURRENT_RECORD
    normal_application_read: "Allowed only as resends_used/resends_max through vp_otp_status."
    audit_projection: "Allowed only as the explicit OTP_SENT resend number already recorded by the OTP RPC."
    admin_audit_projection: "Same bounded explicit event count; never the raw record."
    evidence: "Allowed as aggregate fixture count with no authenticator material."
  - field: verification_record.last_sent_at
    class: SENSITIVE_OPERATIONAL_TIMESTAMP
    storage: SERVER_ONLY_CURRENT_RECORD
    normal_application_read: NEVER_RAW
    audit_projection: OMIT
    admin_audit_projection: OMIT
    evidence: NEVER_RAW
    replacement_fact: audit_events.occurred_at
  - field: verification_record.provider
    class: INTERNAL_INTEGRATION_METADATA
    storage: SERVER_ONLY_CURRENT_RECORD
    normal_application_read: NEVER_RAW
    audit_projection: OMIT
    admin_audit_projection: OMIT
    evidence: "Only a governed capability state such as configured, unavailable or simulated when separately proven."
    replacement_fact: "verification_method=otp; provider identity remains a separate approved contract."
  - field: verification_record.verified
    class: BUSINESS_VERIFICATION_FACT
    storage: SERVER_ONLY_CURRENT_RECORD
    normal_application_read: "Allowed as verified boolean through vp_otp_status and virtual_participants.verified_at."
    audit_projection: "Allowed as action=OTP_VERIFIED or verified=true."
    admin_audit_projection: ALLOWED
    evidence: ALLOWED_WITH_FIXTURE_IDENTITY
  - field: verification_record.verified_at
    class: BUSINESS_VERIFICATION_TIMESTAMP
    storage: SERVER_ONLY_CURRENT_RECORD
    normal_application_read: "Use virtual_participants.verified_at, not the nested duplicate."
    audit_projection: "Use audit occurred_at or the top-level verified_at field."
    admin_audit_projection: ALLOWED
    evidence: ALLOWED_WITH_FIXTURE_IDENTITY
  - field: virtual_participants.display_name
    class: PERSONAL_BUSINESS_DATA
    storage: AUTHORITATIVE_PARTICIPANT_ROW
    normal_application_read: "Allowed to session-authorized personas."
    audit_projection: "Allowed only for the same session-authorized personas when required by CR-353."
    admin_audit_projection: "Allowed to existing audit-authorized personas in the redacted M11 projection."
    evidence: "Fixture name or masked value only."
  - field: virtual_participants.role
    class: BUSINESS_ROLE_DATA
    storage: AUTHORITATIVE_PARTICIPANT_ROW
    normal_application_read: ALLOWED_TO_SESSION_AUTHORIZED
    audit_projection: ALLOWED
    admin_audit_projection: ALLOWED
    evidence: ALLOWED
  - field: virtual_participants.joined_at
    class: BUSINESS_ATTENDANCE_FACT
    storage: AUTHORITATIVE_PARTICIPANT_ROW
    normal_application_read: ALLOWED_TO_SESSION_AUTHORIZED
    audit_projection: ALLOWED
    admin_audit_projection: ALLOWED
    evidence: ALLOWED_WITH_FIXTURE_IDENTITY
  - field: virtual_participants.verified_at
    class: BUSINESS_VERIFICATION_FACT
    storage: AUTHORITATIVE_PARTICIPANT_ROW
    normal_application_read: ALLOWED_TO_SESSION_AUTHORIZED
    audit_projection: ALLOWED
    admin_audit_projection: ALLOWED
    evidence: ALLOWED_WITH_FIXTURE_IDENTITY

persona_access_contract:
  - persona_group: SESSION_OPERATOR
    personas:
      - assigned_inspector
      - ops
      - planner
    allowed:
      - "Session and participant rows in authorized scope, excluding raw verification_record."
      - "Bounded vp_otp_status result."
      - "Redacted session audit trail."
    prohibited:
      - code_hash
      - raw verification_record
      - raw provider metadata
      - unrelated session audit
  - persona_group: SESSION_REVIEW_AND_AUDIT
    personas:
      - reviewer
      - auditor
      - compliance_admin
    allowed:
      - "Authorized session/participant business facts, excluding raw verification_record."
      - "Redacted immutable session audit trail."
      - "Verification method as the business fact otp, verification result and time."
    prohibited:
      - code_hash
      - raw verification_record
      - live OTP status not required for the historical review
      - unrelated session audit outside existing row scope
  - persona_group: GLOBAL_AUDIT
    personas:
      - auditor
      - ops
      - security_admin
      - leadership
      - reviewer
      - planner
      - compliance_admin
    allowed:
      - "Existing audit-browser row visibility through a redacted M11 projection."
      - "M11 business facts and event identifiers."
    prohibited:
      - "Unredacted virtual_participants before_state or after_state."
      - code_hash
      - raw verification_record
      - raw provider metadata
    qualification: >-
      This contract does not expand existing row visibility or add a role; it
      only constrains the fields returned for M11 participant events.
  - persona_group: UNAUTHORIZED
    personas:
      - anonymous
      - unauthenticated
      - unassigned_inspector
      - unrelated_authenticated_user
    allowed: []
    prohibited:
      - participant row
      - OTP status
      - session audit
      - global audit

direct_participant_read_contract:
  authoritative_table: public.virtual_participants
  current_problem: >-
    vp_rw is row-scoped but not column-scoped. A caller allowed to read a row
    can request verification_record directly unless a separate server-enforced
    column/projection boundary denies it.
  required_outcome:
    - "Normal authenticated application access cannot select verification_record."
    - "Existing authorized reads of id, session_id, display_name, role, joined_at and verified_at continue to work."
    - "OTP mutation functions retain server-side access to verification_record."
    - "vp_otp_status remains the only normal application read of live OTP counters/state."
    - "The negative contract is proven through the same external API boundary used by the application, not only with an internal SQL role."
  implementation_mechanism: UNSELECTED
  forbidden_shortcut:
    - "Hiding the field only in TypeScript."
    - "Depending on current UI select lists."
    - "Client-side removal after raw retrieval."
    - "Deleting verification_record or weakening OTP verification."

immutable_audit_storage_contract:
  table: public.audit_events
  required_outcome:
    - "Existing audit rows are never updated, deleted or rewritten."
    - "Future trigger rows may remain full immutable server records if every read boundary is proven safe."
    - "No normal application consumer receives raw virtual_participants before_state or after_state."
    - "Explicit OTP_SENT, OTP_FAILED and OTP_VERIFIED rows remain immutable."
    - "Audit event IDs and occurred_at remain stable evidence anchors."
  unresolved_release_decision: >-
    Whether privileged database operators have an out-of-band raw-forensics
    route is outside this application contract. No break-glass role, process or
    retention period is invented here.

session_audit_function_contract:
  function: public.vs_audit_trail(uuid)
  access_predicate: >-
    Preserve the currently coded session relationship and role predicate
    unless separately approved; do not expand it through this contract.
  required_top_level_fields:
    - id
    - at
    - action
    - object_type
    - object_id
    - actor
    - detail
  ordering: "occurred_at ascending, then id ascending for deterministic ties"
  scope:
    - "The requested virtual_sessions row."
    - "virtual_participants rows whose session_id equals the requested session."
  forbidden_top_level_fields:
    - before_state
    - after_state
    - requirement_refs
    - config_versions
  forbidden_recursive_keys:
    - verification_record
    - code_hash
    - expires_at
    - last_sent_at
    - provider
    - dev_code
    - otp
  detail_allowlist:
    virtual_sessions:
      INSERT:
        - state
        - appointment_at
        - visit_id
      UPDATE:
        - previous_state
        - new_state
        - appointment_at
        - timeline_event
      DELETE:
        - state
        - visit_id
    virtual_participants:
      INSERT:
        - session_id
        - display_name
        - role
      UPDATE:
        - display_name
        - role
        - joined_at
        - verified_at
      DELETE:
        - session_id
        - display_name
        - role
      OTP_SENT:
        - resend_no
      OTP_FAILED:
        - attempt
      OTP_VERIFIED:
        - attempts
        - verification_method
        - verified_at
  derivation_rules:
    - "verification_method is the business method otp; do not surface provider."
    - "verified_at uses the top-level participant value when present, otherwise the immutable event occurred_at."
    - "previous_state and new_state are derived only from the corresponding raw audit row."
    - "timeline_event is emitted only when a single appended timeline entry can be proven from before/after."
    - "Unknown fields and unknown nested keys are omitted, never passed through."
  duplicate_presentation:
    rule: >-
      Preserve every immutable row and its ID. Mark trigger UPDATE rows as row
      changes and explicit OTP_* rows as business events. UI KPI/count language
      must count explicit business events, not both rows as two OTP actions.
    forbidden: "Dropping or rewriting the raw duplicate row."
  bounds_contract:
    state: REQUIRES_ACCEPTED_DECISION
    minimum: >-
      The function must not return an unbounded history in one response.
      Exact page size is not invented here and must be selected through
      approved performance/UX change control.

admin_audit_contract:
  route: /admin/audit
  current_problem: "Selects and renders raw before_state/after_state."
  required_outcome:
    - "M11 virtual_participants rows are rendered through an explicit allowlist."
    - "No recursive secret key appears in HTML, serialized server payload or browser-accessible state."
    - "Non-M11 event rendering remains behaviorally unchanged unless separately approved."
    - "Filtering, stable event ID, actor, object, action and occurred_at remain available."
    - "A raw-row count is not presented as a business-action count where trigger and explicit OTP events coexist."
  implementation_mechanism: UNSELECTED
  forbidden_shortcut:
    - "CSS hiding."
    - "Client-side string replacement."
    - "Removing only code_hash while returning the parent verification_record."
    - "Changing or deleting immutable audit rows."

virtual_UI_contract:
  routes:
    - /virtual
    - /virtual/:id
  required_outcome:
    - "/virtual/:id consumes a safe session audit projection for immutable history."
    - "The existing virtual_sessions.timeline may remain a state/readiness presentation source but is not labelled as the complete immutable audit trail."
    - "Live OTP controls consume only vp_otp_status plus OTP mutation responses."
    - "Reviewer-facing verification shows representative, role, verified result, method=OTP and time without provider or authenticator material."
    - "Empty, load failure and unauthorized states are explicit and neutral."
    - "Provider-unavailable state remains honest; no disconnect/reconnect fact is fabricated."
  design_decision_required:
    - "Exact placement and responsive treatment of the immutable audit timeline."
    - "Page-size and load-more interaction."
    - "How raw-row changes versus explicit business events are labelled."

historical_data_contract:
  existing_raw_rows:
    action: PRESERVE_UNCHANGED
    reason: "audit_events is immutable and evidence-bearing."
  historical_read:
    action: REDACT_AT_PROJECTION
    rule: "The same field allowlist applies to old and new rows."
  malformed_or_unknown_legacy_shape:
    action: FAIL_CLOSED
    output: "Event identity, timestamp, object and action only; detail omitted."
  existing screenshots_and_evidence:
    action: AUDIT_BEFORE_REUSE
    rule: "Any artifact containing live codes, code_hash, raw provider metadata or participant PII outside fixture policy is quarantined from acceptance evidence."
  backfill:
    required: false
    reason: "The contract does not mutate historical immutable rows."

evidence_contract:
  allowed:
    - "Stable audit event IDs."
    - "Fixture session and participant IDs."
    - "Fixture display names."
    - "Actions, timestamps, object types and redacted details."
    - "Aggregate attempt/resend counts."
    - "Proof that forbidden keys are absent recursively."
  prohibited:
    - "Live OTP codes."
    - code_hash
    - "Raw verification_record."
    - "Raw provider metadata."
    - "Unmasked real participant identity."
    - "Browser, console or network captures containing forbidden fields."
  required_manifest_facts:
    - product_commit
    - migration_identity
    - test_identity
    - persona
    - session_fixture
    - event_ids
    - forbidden_key_scan_result
    - immutable_row_preservation_result
    - direct_table_negative_result
    - UI_network_payload_negative_result

