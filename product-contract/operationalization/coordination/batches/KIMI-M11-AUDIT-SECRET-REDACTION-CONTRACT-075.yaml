  - test_id: T-075-02
    layer: DATABASE_API
    case: "OTP request/verify/status continue through server-authorized functions."
    expected: "Existing positive and negative behavior preserved; code_hash never returned."
  - test_id: T-075-03
    layer: DATABASE_API
    case: "vs_audit_trail returns a session and participant history."
    expected: "Only required top-level fields and allowlisted detail; forbidden recursive keys absent."
  - test_id: T-075-04
    layer: DATABASE_API
    case: "Legacy audit row contains nested verification_record and unknown keys."
    expected: "Raw row remains unchanged; projection omits secret and unknown keys."
  - test_id: T-075-05
    layer: AUTHORIZATION
    case: "Each currently authorized persona reads an in-scope trail."
    expected: "Positive only within existing role/relationship scope."
  - test_id: T-075-06
    layer: AUTHORIZATION
    case: "Anonymous, unauthenticated, unassigned inspector and unrelated authenticated caller read the trail."
    expected: DENIED_WITH_NO_DATA
  - test_id: T-075-07
    layer: PRODUCT_UI
    case: "/virtual/:id renders immutable audit history."
    expected: "Business facts visible; raw before/after and forbidden fields absent from DOM and network payload."
  - test_id: T-075-08
    layer: PRODUCT_UI
    case: "/admin/audit renders M11 participant events."
    expected: "Redacted fields only; non-M11 audit rendering does not regress."
  - test_id: T-075-09
    layer: PRESENTATION
    case: "One OTP operation generated a trigger UPDATE plus explicit OTP event."
    expected: "Both immutable rows remain traceable; business-action count is one."
  - test_id: T-075-10
    layer: IMMUTABILITY
    case: "Redaction rollout against historical data."
    expected: "Audit row count, IDs and raw stored hashes remain unchanged."
  - test_id: T-075-11
    layer: EVIDENCE
    case: "Recursive scan of test artifacts, screenshots, HTML and captured payloads."
    expected: "No forbidden key or value."
  - test_id: T-075-12
    layer: REGRESSION
    case: "CD-041, CD-042, CD-043, execution cross-module and neutral-error suites."
    expected: PASS_WITH_NO_EXCLUSIONS
  - test_id: T-075-13
    layer: BOUNDS
    case: "Empty, one-page and more-than-one-page session history."
    expected: "Deterministic order, no omission or duplicate across pages after exact bounds are approved."
  - test_id: T-075-14
    layer: PROVIDER_TRUTH
    case: "Provider is unavailable and no callback lifecycle exists."
    expected: "No fabricated connected/disconnected/reconnected audit fact."

stop_conditions:
