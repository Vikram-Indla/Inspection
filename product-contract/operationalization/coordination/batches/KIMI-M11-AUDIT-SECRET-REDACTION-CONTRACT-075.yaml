  Define the minimum canonical redaction and access contract for M11
  verification_record data across direct participant reads, immutable audit
  storage, session-scoped audit functions, Admin Audit, Virtual UI and
  acceptance evidence. This packet specifies outcomes and stop conditions; it
  does not select an implementation mechanism or authorize a write.

