nearest_design_comparison:
  accepted_candidate:
    design_id: WA-DES-004
    filename: SAQEEL Admin Extended.dc.html
    state_key: operations
    selector_label: Platform Ops
    title: Platform operations & resilience
    description: Fail-closed operations · error queue, flags, resilience
    module_label: M3-00
    classification: NEAREST_EXACT_FUNCTIONAL_AND_INFORMATION_ARCHITECTURE_MATCH
    exact_evidence:
      - Endpoint contracts card with configured-count distinction.
      - Open error records card explicitly says there is no throughput claim.
      - Published flag versions card explicitly calls out maker-checker enforcement.
      - Error queue includes source, operation, status, attempts, error code and retry controls.
      - Feature-flag table includes version, maker, checker, state and approve/publish control.
      - Retention, backup and restore remain visibly policy-held.
    fixture_values_not_runtime_truth:
      - endpoint counts 6 and 4
      - open error count 3
      - published flag count 7
      - sample sources, operations, statuses, attempt counts and error codes
      - sample flag keys, versions, makers and checkers
    limitations:
      - It does not prove route admission, RLS visibility, RPC authorization or runtime data.
      - It lacks complete partial-source, bounded-list, denied, stale/conflict, audit and receipt states.
      - It lacks full responsive, Arabic/RTL, theme, zoom, motion and accessibility evidence.
  rejected_candidate:
    design_id: WA-DES-020
    filename: SAQEEL Control Panel.dc.html
    classification: INCORRECT_MAPPING
    reason:
      - It is an Administration navigation catalogue.
      - Its System Operations card links to another screen.
      - It contains no operational queue, feature-flag lifecycle, endpoint evidence or governed action.
      - Its Technical Admin label does not establish route/RLS/RPC authority.
    disposition: ORPHANED_PENDING_SEPARATE_ADMIN_CATALOGUE_DECISION
  inventory_defect:
    current_mapping: WA-DES-020_to_/admin/operations
    omitted_mapping: WA-DES-004_operations_state_to_/admin/operations
    required_result: >-
      Governance must bind the WA-DES-004 operations state to the route and
      remove WA-DES-020 from the route. This packet does not mutate the map.

