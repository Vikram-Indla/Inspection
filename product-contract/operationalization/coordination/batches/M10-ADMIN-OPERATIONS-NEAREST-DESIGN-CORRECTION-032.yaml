real_route_truth:
  route_exists: true
  component: apps/web/src/app/(app)/admin/operations/page.tsx
  title: Platform operations and resilience
  code_authority_badge: M3-00_CD-050
  reads:
    error_queue:
      table: mvp3_error_queue
      fields: [id, source, operation, status, attempt_count, last_error_code, created_at]
      bounded_limit: 50
    feature_flags:
      table: mvp3_feature_flags
      fields: [id, flag_key, version, description, enabled, status, created_by, approved_by]
    integration_endpoints:
      table: mvp3_integration_endpoints
      fields: [id, status]
  actions:
    retry:
      rpc: mvp3_request_error_retry
      eligible_stored_statuses: [failed, dependency_blocked]
      runtime_truth: Retry requested; execution or delivery awaits genuine receipt evidence.
    publish_flag:
      rpc: mvp3_publish_feature_flag
      eligible_stored_statuses: [draft]
      runtime_truth: Independent security-admin checker may publish; maker cannot self-approve.
  bounded_delta:
    preserve:
      - All real reads, RLS and RPC state/authorization guards.
      - Retry-request semantics and independent feature-flag publication.
      - Stored statuses and versions without optimistic overwrite.
    correct:
      - Never present configured endpoint rows as health, connectivity or uptime.
      - Never present open-error rows as throughput or reliability.
      - Never present design fixture values as runtime metrics.
      - Distinguish each failed source from a verified zero.
      - Label the error queue as a bounded prefix unless source-backed totals prove completeness.
      - Replace raw internal RPC errors with safe stable user messages while preserving diagnostic evidence.
      - Add denied, pending, stale/conflict, persistence, audit and receipt states.

