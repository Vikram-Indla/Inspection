capability_and_persona_boundary:
  security_access_review_owns:
    - RLS-visible access certification reviews with scope, purpose, status, and due date.
    - Retain/revoke decision for an eligible open review with required reason.
    - Read-only RLS-visible purpose-bound evidence grants and active/expired/revoked truth.
    - RLS-visible role-holding count explicitly not presented as effective permission proof.
    - Honest partial-scope, error, denied, concurrency, audit-limitation, and provider-held states.
  users_and_roles_owns:
    route: /admin/access
    designs: [WA-DES-043, WA-DES-011]
    capabilities:
      - User roster and role catalogue.
      - Role/capability grant and revocation.
      - Self-escalation and sole-security-admin safeguards where proven.
  persona_views_requiring_governance:
    security_admin:
      reads: All access reviews, evidence grants, and allowed user-role holdings under current RLS.
      action: Decide eligible open reviews unless actor is the subject.
    auditor:
      reads: All access reviews and evidence grants; user-role count under current policy.
      action: None.
      navigation: Not currently advertised.
    review_subject:
      reads: Own access reviews and own evidence grants; own role holdings unless another read role is held.
      action: Subject self-decision prohibited.
      navigation: Not currently advertised.
    unrelated_authenticated:
      reads: Own rows only if they are a subject/grantee; otherwise RLS-empty. Own user-role holdings may remain visible.
      action: None.
    unauthenticated_or_field_only:
      reads: None through this route.
      action: None.
  explicitly_excluded:
    - User creation, user profile editing, role/capability assignment, override, or role-catalogue mutation.
    - Evidence-grant create, edit, revoke, extend, or renewal action; current route is read-only for grants.
    - SSO/MFA/provider configuration, identity proofing, session revocation, device commands, or audit-log administration.
    - Bulk decisions, auto-renewal, automatic expiry mutation, or approval delegation.

permission_audit_maker_checker_concurrency_truth:
  route_and_navigation:
    shared_route_group: AUTHENTICATED_NON_FIELD_CHANNEL
    navigation_visible_roles: [security_admin]
    exact_route_guard: NOT_PRESENT
    rule: Navigation is not authorization and hidden navigation is not a denial contract.
  rls:
    access_reviews_read: Subject self, security_admin, or auditor.
    access_reviews_insert: security_admin creating an open row as opened_by.
    evidence_grants_read: Grantee self, security_admin, or auditor.
    evidence_grants_insert_update: security_admin under row checks; not exposed on this route.
    user_roles_read: Self or planner, ops, security_admin, reviewer, auditor, compliance_admin.
  decide_rpc:
    allowed_role: security_admin
    state_guard: Review must still be open.
    self_guard: Actor cannot be subject_user_id.
    required_reason: Minimum eight trimmed characters.
    stored_result: status, reviewed_by, review_reason, reviewed_at.
  maker_checker:
    proven: Subject cannot decide own review.
    not_proven: Opened_by cannot decide the review they opened.
    design_rule: Use subject-separation language; do not claim full independent maker-checker until opener-versus-decider is governed and tested.
  concurrency:
    proven_in_contract: SELECT FOR UPDATE and open-state guard prevent a second successful decision.
    missing_in_ui_evidence: Stale message, reload/reconciliation, preserved reason, and refreshed result.
  audit:
    stored_row_evidence: reviewed_by, review_reason, reviewed_at.
    immutable_audit_event: NOT_PROVEN
    design_rule: Do not label the action fully audited until actor, object, before/after, reason, timestamp, immutable event, and retrieval evidence exist.

data_provider_and_policy_truth:
  data_rules:
    - Distinguish successful zero, RLS-empty, failed read, incomplete result, and unauthorized route.
    - Counts are RLS-visible holdings/reviews/grants, not global security posture or effective permissions.
    - Active means not revoked and expiry after the render-time clock; show an as-of timestamp or label freshness limitation.
    - Closed review evidence must show stored decision truth only when returned; never infer reviewer or reason.
    - Sample counts, dates, UUIDs, cases, scopes, names, roles, and policies in designs are illustrative.
  provider_holds:
    - id: MVP3-HOLD-003
      area: External identity and SSO
      effect: No SSO/MFA provider, claims, tenant, or external-identity readiness may be shown.
    - id: MVP3-HOLD-006
      area: Retention and backup
      effect: Evidence/access retention, legal-hold, purge, backup, or restore values may not be invented.
    - id: MVP3-HOLD-008
      area: Production release
      effect: Local/runtime evidence is not deployment or production security certification.
  provider_boundary: No external provider action exists on this route.

