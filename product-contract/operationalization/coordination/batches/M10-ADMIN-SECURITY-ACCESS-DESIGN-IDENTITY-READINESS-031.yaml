responsive_arabic_theme_accessibility:
  viewports:
    - {viewport: 1440x900, expectation: Full summary, bounded review queue, decision form, and grants without page overflow.}
    - {viewport: 1200x900, expectation: Exact WA-DES-004/WA-DES-043 comparison viewport with route task preserved.}
    - {viewport: 1024x768, expectation: Summary and tables reflow without clipped reasons, actions, or shell.}
    - {viewport: 768x1024, expectation: Queue and evidence grants stack in decision order with source status retained.}
    - {viewport: 412x915, expectation: Labelled review records replace wide tables; decision and reason remain attached to subject/scope.}
    - {viewport: 390x844, expectation: Denial, error, conflict, closed, and grant-state parity without two-dimensional scroll.}
    - {viewport: 320x568, expectation: No task loss, overlap, clipped identity, peeking submenu icons, or detached evidence/action.}
  locales:
    - {locale: en, direction: ltr}
    - {locale: ar, direction: rtl}
  bidi_rules:
    - Use logical properties and mirror structural layout.
    - Keep UUIDs, role keys, scope codes, case references, dates, timestamps, and technical identifiers LTR.
    - Localize headings, states, decision options, validation, denials, errors, holds, and recovery.
    - Require qualified native-Arabic review before acceptance.
  themes: [light, dark]
  theme_evidence:
    - Shell, summaries, records, decision controls, grants, statuses, focus, disabled, pending, error, partial, and held states.
    - Decision/lifecycle meaning uses text, icons, and shape plus color.
  accessibility:
    - One h1, ordered headings, semantic regions, and labelled tables or labelled-record reflow.
    - Decision and reason controls have programmatic labels, hints, errors, and review-row association.
    - Unique action names include subject and scope without exposing restricted data.
    - Visible single focus treatment and logical LTR/RTL keyboard order.
    - Forty-four-pixel minimum decision targets.
    - Pending/result announcements and deterministic focus recovery.
    - Status, due/overdue, active/expired/revoked, and partial-source meaning never use color alone.
    - Prove 200 percent zoom and 400 percent or 320 CSS-pixel equivalent reflow.
    - Reduced motion and no animation-dependent security meaning.

