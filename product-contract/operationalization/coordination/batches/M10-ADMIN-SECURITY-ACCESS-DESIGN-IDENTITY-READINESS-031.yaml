route_and_component_evidence:
  route_exists: true
  route: /admin/security-access
  primary_component: apps/web/src/app/(app)/admin/security-access/page.tsx
  loading_component: apps/web/src/app/(app)/admin/security-access/loading.tsx
  action_module: apps/web/src/app/(app)/admin/mvp3-actions.ts
  action_form: apps/web/src/components/Mvp3ActionForm.tsx
  rendered_title: Security posture and access review
  code_authority_badge: M3-00_CD-050
  reads:
    access_reviews:
      table: mvp3_access_reviews
      fields: [id, subject_user_id, scope, purpose, status, due_at, reviewed_at]
    evidence_access_grants:
      table: mvp3_evidence_access_grants
      fields: [id, grantee_user_id, purpose, granted_at, expires_at, revoked_at]
    role_holdings:
      table: user_roles
      query: exact count under RLS
  governed_action:
    action: Retain or revoke an open access review with a reason.
    rpc: mvp3_decide_access_review
    validation: Decision must be retain/revoke and trimmed reason must be at least eight characters.
    concurrency_truth: Row is locked and must still be open; a concurrent second decision fails.
    subject_separation: Subject cannot decide their own review.
  current_truth_gaps:
    - Only the access-review read error is captured; grant and role-count failures can appear as verified zero.
    - No route-specific guard exists beyond shared non-field channel handling, navigation visibility, RLS, and RPC checks.
    - RPC error.message is returned raw to the client.
    - Open-review action displays a subject, scope and purpose but not opened_by, opener/decider separation, current reviewer, or immutable audit reference.
    - The RPC prevents subject self-review but does not prove opener-versus-decider maker-checker separation.
    - Reviewed actor, reason, and timestamp are stored, but the current select/render does not expose complete decision evidence.
    - No append-only audit trigger/event for the review decision is proven by this route.
    - Reviews and grants have no explicit pagination, total, or completeness marker.
    - Active/expired status is calculated at render time without a displayed as-of/freshness timestamp.

design_authority_resolution:
  exact_route_design_candidates:
    - design_id: WA-DES-004
      filename: SAQEEL Admin Extended.dc.html
      sha256: b2ff11c538430f6f045ba66cf992cbcbc53897c0a62db1db98e30e3c811b19fc
      state_key: security
      title: Security posture and access review
      match: NEAREST_EXACT_FUNCTIONAL_AND_INFORMATION_ARCHITECTURE_MATCH
      evidence:
        - Navigation-is-not-authorization boundary matches the route.
        - Three RLS-visible summary cards match role holdings, open reviews, and active evidence grants.
        - Access certification queue matches subject, scope/purpose, status, and decision action.
        - Purpose-bound evidence grant list matches active/expired presentation.
        - State is explicitly labelled M3-00 in its selector.
      limitations:
        - Hard-coded counts, subjects, dates, scopes, and grants are illustrative only and cannot become runtime truth.
        - Decision control omits the required reason field.
        - It labels the action independent without proving opener-versus-decider separation.
        - It lacks complete error, denied, conflict, audit, partial-source, responsive, Arabic, and accessibility evidence.
    - design_id: WA-DES-043
      filename: SAQEEL Users Roles.dc.html
      sha256: 9d4e9879d7f2d4fd39a47895c9f746d99cbb3b3030aa033009889c7ada82a6b6
      title: Roles and permissions
      match: ADJACENT_BUT_INCORRECT_FOR_SECURITY_ACCESS_REVIEW
      actual_capability:
        - User roster.
        - Role assignment and revocation.
        - Direct capability override management.
        - Frozen role catalogue.
      correct_route_boundary: /admin/access
      mismatch:
        - No access certification queue.
        - No purpose-bound evidence grant lifecycle.
        - No review due/overdue, retain/revoke, or review-reason flow.
        - Its mutation guards and RPC claims belong to user/role administration, not review certification.
    - design_id: CD-050
      match: BINDING_M3_00_FAMILY_AUTHORITY_NOT_YET_ROUTE_FRAME_VERIFIED
      evidence: M3-00 register and R2 reconciliation cover 14 rows and three routes.
      missing: Exact package, route-frame manifest, Operations/Security frame IDs, and package/frame fingerprints are absent from Git.
  secondary_adjacent_design:
    design_id: WA-DES-011
    route: /admin/access?view=roles
    capability: Role assignment override.
    usable_for_security_access_review: false
  conclusion: >-
    WA-DES-004's existing security frame is the exact nearest route design and
    is the safest route-specific expression of CD-050. WA-DES-043 must remain
    Users/Roles authority for /admin/access only.

