current_action_map:
  file: apps/web/src/app/(app)/operations/actions.ts
  actions:
    - name: updateActionFormStatus
      current_authority: actions_rw RLS
      explicit_has_capability_check_in_action: false
      concern: Current write policy is not a precise Operations resolution contract.
    - name: fetchMonitoringRows
      current_authority: source-table RLS
      explicit_has_capability_check_in_action: false
      concern: Client region and city values are filters, not authoritative user scope.
    - name: markNotificationHandled
      current_authority: recipient-or-ops notification RLS
      explicit_has_capability_check_in_action: false
      concern: Action authorization is role-broad and not expressed at the server-action boundary.
    - name: decideGeoOverride
      current_authority: decide_geo_override RPC guarded by has_role('ops')
      explicit_has_capability_check_in_action: false
      concern: Role check is broader and less auditable than the canonical capability model.
    - name: decideActiveCancellation
      current_authority: RPC guarded by operations.approve_active_cancel
      explicit_has_capability_check_in_action: false
      concern: RPC is capability-bound, but route and record scope still require verification.

