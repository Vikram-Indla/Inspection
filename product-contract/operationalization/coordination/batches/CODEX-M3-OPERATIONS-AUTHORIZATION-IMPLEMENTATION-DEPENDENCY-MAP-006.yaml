sequencing_recommendation:
  status: PROPOSAL_ONLY
  order:
    - step: 1
      action: Complete and independently review Claude's map-provenance correction.
    - step: 2
      action: Resolve F0 navigation and old-preview ownership collisions.
    - step: 3
      action: Approve scope, projection, action-capability, and national-grant contracts.
    - step: 4
      action: Implement database authorization boundaries and negative tests before exposing new UI authority.
    - step: 5
      action: Implement route, projection, and action consumers in exclusive file leases.
    - step: 6
      action: Run the 45-row negative matrix, regression suite, runtime browser review, audit verification, and evidence capture.
  parallelism_after_contract_approval:
    - WP-03 action mapping can proceed separately from WP-05 grant administration if their database migration and file leases are disjoint.
    - WP-01 navigation work can proceed after F0 ownership resolves, but route files remain sequenced behind Claude.
    - WP-02 and WP-04 are coupled because reduced location projections must consume authoritative geography and organization scope.

