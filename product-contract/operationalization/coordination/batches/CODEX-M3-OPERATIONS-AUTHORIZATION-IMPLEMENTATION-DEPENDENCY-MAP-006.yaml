work_packages:
  - id: WP-01
    title: Route and view authorization
    intent: >-
      Make discoverability and direct-route access consistently enforce the
      existing operations.view capability without changing its grants.
    dependencies:
      routes:
        - apps/web/src/app/(app)/operations/page.tsx
        - apps/web/src/app/(app)/operations/live/page.tsx
        - apps/web/src/app/(app)/operations/exceptions/page.tsx
      navigation:
        - apps/web/src/lib/shell-navigation.ts
      authentication:
        - verified-user server helper currently used by app routes
        - server Supabase client
      capability:
        existing: operations.view
        proposed_new: []
      tests:
        existing:
          - apps/web/e2e/shell-navigation.spec.ts
          - apps/web/e2e/execution-canonical-contract.spec.ts
          - apps/web/e2e/execution-access-contract.spec.ts
          - apps/web/e2e/web-admin-m3-operations.spec.ts
        proposed:
          - apps/web/e2e/web-admin-m3-operations-authorization.spec.ts
    collision_boundary:
      - Operations and live pages are in Claude's active eight-file map-provenance lease.
      - shell-navigation.ts is changed on the F0 shell authority branch.
      - The old preview worktree has uncommitted live-page edits.
    prerequisite_decisions:
      - Confirm whether planner and leadership retain operations.view.
      - Define denied-route behavior consistently: not-found, access-denied, or safe redirect.
    readiness: BLOCKED_BY_ACTIVE_FILE_OWNERSHIP_AND_ROUTE_BEHAVIOR_DECISION

  - id: WP-02
    title: Precise identity and GPS projection
    intent: >-
      Separate full operational location data from masked, aggregate, or
      identity-free projections without weakening CR-433 or RBAC-013.
    dependencies:
      routes_and_components:
        - apps/web/src/app/(app)/operations/page.tsx
        - apps/web/src/app/(app)/operations/OpsMap.tsx
        - apps/web/src/app/(app)/operations/live/page.tsx
        - apps/web/src/app/(app)/operations/live/LiveMapInner.tsx
        - apps/web/src/app/(app)/operations/live/LiveOps.tsx
        - apps/web/src/app/(app)/operations/live/types.ts
        - apps/web/src/app/(app)/operations/OperationsMapWorkspace.tsx
      data:
        - geo_events
        - visits
        - assignments
        - profiles
        - factories
        - location_visibility_matrix
      capability:
        existing: null
        proposed_not_existing: operations.view_precise_location_identity
      projection_contract:
        - CODEX-M3-OPERATIONS-REDUCED-PROJECTION-SPEC-005.yaml
      tests:
        existing:
          - apps/web/e2e/web-admin-m3-operations.spec.ts
          - apps/web/e2e/mvp2-mapbox-live.spec.ts
          - apps/web/e2e/mapbox-provider.spec.ts
          - apps/web/e2e/platform-design-system-contract.spec.ts
        proposed:
          - apps/web/e2e/web-admin-m3-operations-authorization.spec.ts
    collision_boundary:
      - Six dependencies overlap Claude's active map-provenance lease.
      - LiveMapInner.tsx, LiveOps.tsx, and live/page.tsx also have uncommitted edits in the old preview worktree.
    prerequisite_decisions:
      - Approve the precise-location capability and its role/direct-grant semantics.
      - Approve sensitivity classes, masking resolution, temporal freshness, and aggregation thresholds.
      - Decide whether projection is enforced by security-definer RPC, governed view, or equivalent database boundary.
      - Seed and govern location_visibility_matrix only after the contract is approved.
    readiness: BLOCKED_BY_MISSING_CONTRACT_AND_ACTIVE_FILE_OWNERSHIP

  - id: WP-03
    title: Write capability alignment
    intent: >-
      Ensure each Operations mutation has a server-side and database-side
      capability boundary aligned to the intended business action.
    dependencies:
      actions:
        - apps/web/src/app/(app)/operations/actions.ts
      components:
        - apps/web/src/app/(app)/operations/Controls.tsx
        - apps/web/src/app/(app)/operations/OverrideQueue.tsx
        - apps/web/src/app/(app)/operations/CancellationQueue.tsx
        - apps/web/src/app/(app)/operations/page.tsx
      database:
        - action_forms policies
        - notifications policies
        - decide_geo_override RPC
        - decide_active_cancellation RPC
        - audit_events
      capabilities:
        existing:
          - operations.resolve_exception
          - operations.approve_active_cancel
        unresolved_mapping:
          - updateActionFormStatus to a canonical capability
          - markNotificationHandled to recipient ownership or a canonical capability
          - decideGeoOverride from has_role('ops') to an approved capability
      tests:
        existing:
          - apps/web/e2e/execution-journey-contract.spec.ts
          - apps/web/e2e/execution-journey-ui-contract.spec.ts
          - apps/web/e2e/m04-device-eta-override.spec.ts
          - apps/web/e2e/web-admin-m3-operations.spec.ts
        proposed:
          - apps/web/e2e/web-admin-m3-operations-authorization.spec.ts
    collision_boundary:
      - operations/page.tsx overlaps Claude's active lease.
      - actions and queue components have no active lease found, but must not be separated from database authorization work.
    prerequisite_decisions:
      - Approve the action-to-capability matrix.
      - Confirm record-scope rules for each mutation.
      - Require negative-path and audit evidence for every denied and successful decision.
    readiness: BLOCKED_BY_CAPABILITY_MAPPING_DECISION

  - id: WP-04
    title: Region, branch, and organization server scope
    intent: >-
      Bind Operations reads to canonical user geography and organization scope
      at a server and database boundary; never treat URL filters as authority.
    dependencies:
      routes_and_helpers:
        - apps/web/src/app/(app)/operations/page.tsx
        - apps/web/src/app/(app)/operations/live/page.tsx
        - apps/web/src/app/(app)/operations/exceptions/page.tsx
        - apps/web/src/app/(app)/operations/actions.ts
        - apps/web/src/lib/operations/exceptions.ts
      profile_fields:
        - profiles.region
        - profiles.org_scope
      row_sources:
        - factories
        - visits
        - assignments
        - geo_events
        - profiles
        - cases
        - risk_exceptions
      database_work_likely_required:
        - governed scope relation or canonicalized profile-scope contract
        - row-level predicates or scoped RPCs/views
        - indexes supporting scope predicates
        - audit coverage for scope changes
      tests:
        existing:
          - apps/web/e2e/web-admin-m3-operations.spec.ts
          - apps/web/e2e/mvp2-m2-09-exceptions.spec.ts
          - apps/web/e2e/mvp2-modules-live.spec.ts
          - apps/web/e2e/execution-access-contract.spec.ts
        proposed:
          - apps/web/e2e/web-admin-m3-operations-authorization.spec.ts
    collision_boundary:
      - Operations and live pages overlap Claude's active lease.
      - Live page also overlaps uncommitted old-preview changes.
      - New migration ownership must be exclusive and sequenced after the scope contract.
    prerequisite_decisions:
      - Define canonical region, branch, and organization identifiers and hierarchy.
      - Define how users receive one or multiple scopes.
      - Define row-to-scope linkage for factories, visits, people, cases, and risk exceptions.
      - Define cross-region exception handling and audited temporary access.
    readiness: BLOCKED_BY_MISSING_SCOPE_CONTRACT

  - id: WP-05
    title: Explicit national-scope grants and administration
    intent: >-
      Govern exceptional national visibility through explicit, auditable
      authority without silently broadening role defaults.
    dependencies:
      capability_database:
        - supabase/migrations/20260721093000_execution_canonical_contracts.sql
        - supabase/migrations/20260721110000_execution_access_grants.sql
      administration_ui:
        - apps/web/src/app/(app)/admin/access/page.tsx
        - apps/web/src/app/(app)/admin/access/AccessManager.tsx
        - apps/web/src/app/(app)/admin/access/RoleCapabilityPanel.tsx
        - apps/web/src/app/(app)/admin/access/actions.ts
        - apps/web/src/app/(app)/admin/access/role-capability-actions.ts
      ui_mirror:
        - apps/web/src/lib/execution/capabilities.ts
      audit:
        - audit_events
        - governed capability grant and revoke functions
      capability:
        existing: null
        proposed_not_existing: operations.view_all_regions
      tests:
        existing:
          - apps/web/e2e/execution-canonical-contract.spec.ts
          - apps/web/e2e/execution-access-contract.spec.ts
          - apps/web/e2e/execution-admin-contract.spec.ts
        proposed:
          - apps/web/e2e/web-admin-m3-operations-authorization.spec.ts
    collision_boundary:
      - No active lease was found for the access-admin files at this snapshot.
      - A future migration and admin lease must still be checked immediately before dispatch.
      - Role-derived capabilities cannot currently be negatively revoked by a direct grant record.
    prerequisite_decisions:
      - Approve operations.view_all_regions and eligible grantors, grantees, reasons, expiry, and review.
      - Decide whether national scope is additive, time-bound, break-glass, or role-derived.
      - Decide how expiry and revocation affect active sessions and cached projections.
      - Require immutable audit evidence and periodic access review.
    readiness: BLOCKED_BY_NEW_CAPABILITY_AND_GRANT_GOVERNANCE_DECISION

