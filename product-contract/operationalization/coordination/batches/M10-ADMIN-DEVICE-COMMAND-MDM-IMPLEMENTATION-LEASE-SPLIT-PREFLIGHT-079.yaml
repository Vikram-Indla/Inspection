global_lease_rules:
  - One writable owner per file at any time; review, data and QA ownership never implies implementation authority.
  - Database lifecycle and package enforcement use one integration owner or strictly serialized leases.
  - Existing migrations are immutable; all database remediation is additive and forward-only.
  - Shared Shell, global CSS, shared i18n, shared action modules and generated types are protected until one serialized integration owner is recorded.
  - Provider governance/credentials, adapter code, database transitions and UI are separate authorities.
  - Field package/open and offline replay may run in parallel only after a frozen typed interface and with disjoint files.
  - Seeder creates deterministic non-production state but never genuine provider/device receipts.
  - QA edits only new focused test/fixture-helper files assigned to it and returns defects to the owning implementation lane.
  - Evidence curator indexes immutable outputs and never manufactures, repairs or overwrites producer evidence.
  - Independent reviewer is read-only toward all leased files and cannot become the implementer in the same review cycle.
  - Every lane stops on contract drift, unexpected shared-file need, migration-order conflict or foreign worktree change.

