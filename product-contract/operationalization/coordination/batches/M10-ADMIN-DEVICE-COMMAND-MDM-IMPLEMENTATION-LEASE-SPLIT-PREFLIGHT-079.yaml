lease_request_checklist:
  - Sponsor decisions and provider authority are compatible and recorded.
  - Stable design revision and interface hashes are recorded.
  - Exact branch/worktree and Git common directory are verified.
  - Exact writable files exist or new-file paths are named; no patterns or nulls remain.
  - Foreign dirty changes and existing leases are checked at request time.
  - Shared/protected file needs are either removed or assigned to one serialized integration lease.
  - Dependencies and entry evidence are present.
  - Required tests, negative paths, evidence bundle and rollback are named.
  - Lease expiry, handoff recipient and stop conditions are named.
  - Independent reviewer is different from the implementation owner.

stop_conditions:
  - unresolved authority needed for behavior is null
  - exact path overlaps another active lease or foreign dirty change
  - implementation needs a protected/shared file not named in the lease
  - provider dependency is unavailable and no canonical hold exists
  - migration order or typed interface changes after a dependent lane starts
  - QA needs to modify implementation to make a test pass
  - seed or mock is proposed as genuine provider/device proof
  - evidence cannot bind the exact source/design/environment revisions

disposition:
  result: READY_FOR_FUTURE_LEASE_REQUESTS_AFTER_AUTHORITY_NOT_READY_TO_GRANT
  immediate_blockers:
    - sponsor decisions remain unresolved
    - provider/receipt authority remains unresolved
    - accepted CD-056 revision remains absent
    - exact new-file paths and active implementers are null
    - current B002 slice remains awaiting approval and is not a Devices lease

