  code_has_predecessor_designs_lack:
    - fail-closed register read
    - true-empty versus unknown impact counts
    - real attachment upload, hash and signed retrieval
    - atomic intended publication RPC
    - current successor lineage
    - scoped audit timeline
  predecessor_defects_not_to_copy:
    - invented regulation code, title, authority, clauses, people and dates
    - false claims that fixed example values are live records
    - Arabic-only wordmark and ADMIN label in English state
    - incomplete unavailable, stale, conflict and storage-custody states
  required_successor_delta:
    - preserve only proven record fields and actions
    - expose request/review/publish authority unambiguously
    - expose dependency readiness without treating unavailable as zero
    - expose attachment custody and broken-file state
    - include version comparison only after its behavior is implemented
