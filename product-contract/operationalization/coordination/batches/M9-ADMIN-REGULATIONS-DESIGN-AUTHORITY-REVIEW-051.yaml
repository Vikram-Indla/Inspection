publication_and_maker_checker:
  intended_path:
    application_action: publishRegulation
    RPC: publish_regulation
    authorization:
      - compliance_admin
      - form_admin
    transaction:
      - lock selected draft
      - reject the recorded creator as approver
      - require effective_from
      - require at least one clause
      - require every clause to map to an item
      - lock and close the prior active version
      - write supersedes_id
      - publish with approved_by and published_at
    one_open_governed_index: regulations_one_open_governed
    validation: STRONG_AND_ATOMIC_ON_INTENDED_PATH
  maker_checker_null_creator_gap:
    RPC_condition: v_new.created_by = auth.uid()
    null_creator_rejected: false
    database_constraint_allows_null_creator: true
    implication: >-
      A legacy or malformed draft with created_by null can be published without
      proven maker identity.
    validation: FAIL
  direct_table_bypass:
    broad_update_policy: true
    draft_to_published_database_trigger: no_full_publish_guard
    dependency_validation_at_direct_transition: absent
    approved_by_distinct_identity_constraint: present_but_identity_can_be_supplied
    predecessor_window_transaction: absent
    lineage_write: absent
    implication: >-
      An authorized writer can directly update a draft to published, supply a
      different approved_by identity, and bypass clause dependency validation,
      current-user approval provenance, predecessor closing and successor
      lineage.
    validation: CRITICAL_PUBLISH_BYPASS
  governed_request_path:
    route: /admin/compliance-requests
    register_link: present
    direct_legacy_controls: still active
    page_warning: present_in_register_only
    detail_warning: absent
    maker_checker_unified: false
    validation: CONTRADICTORY_PARALLEL_AUTHORITIES

versioning_immutability_deactivation:
  regulation_row:
    published_content_mutation_blocked: true
    published_delete_blocked: true
    deactivated_mutation_blocked: true
    allowed_transition: published_or_locked_to_deactivated
    validation: STRONG_WITH_FIELD_GAPS
  deactivation_guard_fields:
    required:
      - status deactivated
      - deactivated_at
      - deactivated_by
      - deactivation_reason
    effective_to_required_at_database_boundary: false
    unchanged_not_checked:
      - created_by
      - approved_by
      - published_at
      - supersedes_id
      - effective_to
    implication: >-
      A direct deactivation can omit the closed effective date and can alter
      provenance or lineage fields in the same permitted transition.
    validation: FAIL_FULL_ROW_IMMUTABILITY
  child_content:
    clauses_draft_only_trigger: present
    attachment_metadata_draft_only_trigger: present
    published_child_update_delete_blocked: true
    validation: CONFIRMED_SEQUENTIALLY
  successor:
    code_version_unique: present
    one_open_published_or_locked: present
    predecessor_close: atomic_on_RPC
    old_status: deactivated
    lineage: supersedes_id
    validation: CONFIRMED_ON_INTENDED_PATH
  future_use:
    new_package_publish_rejects_inactive_regulation: true
    already_published_package_can_still_be_selected_for_new_visit: not_rejected_by_regulation_state
    implication: >-
      The code proves that a deactivated regulation cannot enter a newly
      published package, but it does not prove the broader CR-449 promise that
      deactivation prevents all future use through an already-published package.
    validation: CONTRACT_SCOPE_AMBIGUITY_OR_GAP

attachment_custody:
  positive:
    - private bucket
    - random non-overwriting path
    - computed SHA-256
    - metadata uploaded_by
    - metadata insert compensation removes uploaded binary on failure
    - short-lived signed download link
    - attachment metadata audit
    - metadata child immutability after parent publish
  storage_delete_policy:
    roles:
      - compliance_admin
      - form_admin
    parent_status_check: absent
    metadata_join: absent
    implication: >-
      A configuration writer can delete the stored binary for a published or
      deactivated regulation while its immutable metadata and audit history
      remain, breaking source custody and the signed-link experience.
    validation: CRITICAL_PUBLISHED_BINARY_CUSTODY_BYPASS
  storage_read_policy:
    scope: any authenticated user who can identify the object path
    route_scope: narrower
    validation: DISCLOSURE_SCOPE_REVIEW_REQUIRED
  upload_validation:
    server_size_limit: absent
