governance_and_maker_checker:
  desired_path:
    entry: /admin/compliance-requests/new
    page_handoff: Create governed request and Request change links
    validation: PRESENT_AS_RECOMMENDATION
  direct_legacy_path:
    create: createItem
    edit: updateItem
    deactivate_or_reactivate: toggleItemActive
    page_label: Legacy compatibility authoring
    request_or_approval_required: false
    maker_checker_required: false
    implication: >-
      Compliance/Form Admin can mutate the published catalogue directly while
      the page simultaneously says governed changes should begin through a
      Compliance Configuration Request.
    validation: GOVERNED_CHANGE_PATH_BYPASSABLE
  required_resolution: >-
    Choose and enforce one authority. Either lease and retire direct legacy
    mutation after migration, or formally approve a bounded exception with
    equivalent approval, audit, version and future-use controls.

versioning_immutability_concurrency:
  edit:
    current_version_read: true
    expected_configuration_version_filter: true
    stale_write_message: true
    old_and_new_snapshot_trigger: true
    history_update_delete_guard: true
    frozen_package_reference_check: true
    validation: STRONG_WITH_GOVERNANCE_GAP
  version_archive:
    trigger: trg_archive_inspection_item_version
    behavior: >-
      Every distinct row update inserts old and new snapshots using their
      configuration_version values with conflict ignored.
    issue: >-
      Deactivation/reactivation updates do not increment configuration_version.
      They therefore attempt to archive two different states under one version
      key, and ON CONFLICT DO NOTHING can discard the later active-state
      snapshot from item-version history even though audit still records it.
    validation: ACTIVE_STATE_VERSION_LINEAGE_INCOMPLETE
  active_state:
    expected_version_or_state: absent
    current_row_read: absent
    dependency_impact_confirmation: absent
    concurrent_result: last_write_wins
    reactivation_reason: absent
    validation: FAIL
  package_execution:
    published_snapshot_guard: present
    in_flight_package_pin: registered
    validation: CONFIRMED_FOR_FROZEN_PACKAGE_CONTEXT

