  prerequisite_sequence:
    - Governance corrects authority and resolves exact CD-054 frame and screen identity.
    - Governance closes persona, counting, pagination/search, disclosure and held-policy decisions.
    - Orchestrator rechecks CD-054, WA-DES-015 all states, WA-DES-020, shared Admin shell and every active writer.
    - Sponsor names exactly one writer and one bounded Audit design lease.
  writer_boundary:
    primary_source: CD-054 exact route frame after registration
    secondary_source: WA-DES-015 Audit state only after lineage acceptance
    must_preserve:
      - every other WA-DES-015 state and selector
      - M3-04/CD-054 and M9 authority
      - generic-only versus semantic provenance
      - append-only and fail-closed policy truth
    prohibited_parallel_writers:
      - any writer touching CD-054
      - any writer touching SAQEEL Admin.dc.html or its Audit state/selector
      - any writer touching shared Admin shell, replay ontology or the same evidence index
  closeout:
