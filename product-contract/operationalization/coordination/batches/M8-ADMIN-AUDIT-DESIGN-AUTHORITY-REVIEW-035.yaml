  partial_scope_flag: >-
    The application labels planner, reviewer and leadership as partial, but not
    compliance_admin even though object-scoped RLS also applies to it.
  rule: Navigation, application role label, generic RLS and semantic object RLS must be represented separately.

audit_immutability_and_provenance_truth:
  generic_events:
    classification: GENERIC_ONLY
    canonical_promotion: PROHIBITED
    update_delete: blocked by existing audit immutability controls
  semantic_events:
    append_path: server-authorized append_semantic_audit_event
    required_source: authenticated generic audit_event proving actor/object/action
    idempotency: server-derived from source audit ID, event type and schema version
    caller_claimed_integrity_or_chain: PROHIBITED
    stored_initial_integrity: not_assessed
    stored_initial_chain: incomplete
    update_delete: trigger-blocked
  replay:
    order: occurred_at_then_id
    conflict_detection:
      - same timestamp with different state
      - stale before-state
      - invalid or cross-correlation causation
    completeness: Only a selected non-truncated case with a published 36-row ontology.
  coexistence_gap: >-
    The UI concatenates semantic and generic rows without deduplicating a
    semantic event from its proven source generic row. Provenance labels avoid
    false promotion, but event counts can represent two records for one
    governed business change and must not be called unique business events.

pagination_search_and_data_truth:
  generic_case:
    completeness: BOUNDED_TO_250_WITH_NO_NEXT_PAGE
    risk: A case with more than 250 generic events is partial but the generic limit alone does not independently set historyTruncated beyond exact-cap detection.
  semantic_case:
    completeness: KEYSET_UP_TO_5000
    truncation: Explicit after page 20 or exact cap.
  portfolio:
    completeness: BOUNDED_250_PER_SOURCE
    certification: Never certify portfolio completeness.
  search:
    rule: q results are matches within the bounded loaded snapshot, not all records.
  time:
    rule: occurred_at and recorded_at are distinct; reconstruction orders on occurred_at.
  sensitive_payload:
    rule: Before/after/payload can contain sensitive fields; design must preserve object RLS, purpose and safe disclosure.

current_truth_gaps:
  - Generic read error is shown; semantic failure becomes degraded but does not surface a separate neutral error.
  - Ontology, registry or constraint read errors collapse into semanticUnavailable without naming the failed source.
  - Unauthorized users still reach the route and issue RLS-filtered queries before the explicit denial frame.
  - compliance_admin object-scoped results are not labelled partialScope.
  - Generic and portfolio pagination stop at 250 with no next-page control.
  - Client search can look global while it covers only loaded bounded rows.
  - No export exists despite WA-DES-015's visible Export scoped button.
  - Print-safe is not an evidence export, signed pack or legal artifact.
  - No source-backed as-of/freshness timestamp or total exists.
  - Event detail focus trapping forces every Tab back to Close instead of cycling through all interactive elements.

