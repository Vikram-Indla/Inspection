real_route_and_component_truth:
  route_exists: true
  primary_component: apps/web/src/app/(app)/admin/audit/page.tsx
  loading_component: apps/web/src/app/(app)/admin/audit/loading.tsx
  workspace: apps/web/src/app/(app)/admin/audit/AuditReplayWorkspace.tsx
  replay_library: apps/web/src/lib/audit-replay.ts
  title: Inspection Flight Recorder
  modes: [recorder, reconstruct, compare, ledger, custody, print]
  page_size: 250
  reads:
    generic:
      table: audit_events
      fields: [id, actor, object_type, object_id, action, before_state, after_state, occurred_at]
      ordering: occurred_at_desc_then_id_desc
      limit: 250
    semantic_portfolio:
      table: audit_semantic_events
      ordering: occurred_at_desc_then_id_desc
      limit: 250
    semantic_case:
      rpc: audit_replay_case
      keyset_page_size: 250
      maximum_pages: 20
      maximum_rows: 5000
    ontology:
      tables:
        - audit_event_ontology_versions
        - audit_event_ontology_entries
        - audit_event_registry
        - audit_event_order_constraints
      required_expected_rows: 36
  search:
    case_filter:
      generic: Exact UUID object_id only; non-UUID case forces impossible UUID.
      semantic: Exact case_ref through replay RPC.
    q_filter:
      implementation: Client-side over already-returned bounded rows.
      fields: [event_type, aggregate_type, aggregate_id, actor, correlation_id]
      limitation: Not a server-wide search and no total-match count.
  export:
    implemented: false
    print_safe_view: true
    policy_truth: Export, reveal, redaction, retention, watermark, purge and legal-evidence claims are held.

