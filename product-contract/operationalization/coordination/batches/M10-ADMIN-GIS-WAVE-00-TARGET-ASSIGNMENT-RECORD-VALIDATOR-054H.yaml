outcome_semantics:
  ACK:
    meaning: >
      The supplied assignment record passes this structural governance
      validator. ACK does not authorize dispatch, answer the underlying request,
      grant implementation authority or prove that the named identity accepted
      the assignment.
    next_boundary: A separate authorized controlled-dispatch decision is still required.
  RETURN:
    meaning: >
      A non-null record is reviewable but contains a correctable evidence,
      scope, expiry, delegation, conflict or separation defect.
    next_boundary: Return to the authorized record issuer; do not dispatch.
  BLOCK:
    meaning: >
      A required authority, identity, channel, sender, prerequisite or
      non-authorization control is absent, inferred, prohibited or unverifiable.
    next_boundary: No dispatch or acknowledgement handling is permitted.

precedence:
  order:
    - BLOCK
    - RETURN
    - ACK
  aggregation_rule: >
    Evaluate all checks. Any BLOCK produces BLOCK. Otherwise any RETURN produces
    RETURN. ACK is permitted only when every applicable check returns PASS.
  no_silent_coercion: >
    Null, empty, omitted, placeholder, previous-conversation and runtime-role
    values are never coerced into authority, identity, evidence or consent.

deterministic_checks:
  - check_id: VAL-054H-001
    category: template_identity
    applies_to: ALL
    test: template_id, request_id, acknowledgement_id and record_type exactly match packet 054G
    PASS: exact match
    RETURN: duplicate or internally inconsistent non-null identifier
    BLOCK: missing identifier or identifier not present in packet 054G

  - check_id: VAL-054H-002
    category: authority_source
    applies_to: ALL
    test: canonical_authority_source_selected is non-null and directly governs the exact assignment scope
    PASS: selected source is stable, reviewable and scope-direct
    RETURN: source exists but exact-scope linkage is incomplete or ambiguous
    BLOCK: null, inferred, runtime-access-only, conversation-only or unverifiable source

  - check_id: VAL-054H-003
    category: authority_evidence
    applies_to: ALL
    test: authority evidence reference and hash resolve to the selected canonical source
    PASS: stable reference exists and computed hash matches
    RETURN: reference exists but hash, version or scope citation does not match
    BLOCK: evidence reference or hash is absent

  - check_id: VAL-054H-004
    category: recipient_identity
    applies_to: ALL
    test: named_dispatch_identity is explicit and distinguishable from authority type, role or account class
    PASS: explicit governed identity is present
    RETURN: identity is present but ambiguous or inconsistent with accountable body
    BLOCK: null, group-placeholder, runtime role, inferred person or unknown identity

  - check_id: VAL-054H-005
    category: exact_scope
    applies_to: ALL
    test: exact_allowed_scope is explicitly accepted and does not exceed the 054G template
    PASS: all and only allowed items are accepted
    RETURN: accepted scope is incomplete, ambiguous or adds a review topic
    BLOCK: scope is absent or grants product, design, data, control or implementation mutation

  - check_id: VAL-054H-006
    category: excluded_scope
    applies_to: ALL
    test: all request-specific exclusions in 054G remain explicit and unchanged
    PASS: exclusions are complete
    RETURN: a non-critical exclusion is ambiguously worded
    BLOCK: an exclusion is removed, weakened or contradicted

  - check_id: VAL-054H-007
    category: delivery_channel
    applies_to: ALL
    test: permitted_delivery_channel and exact_destination are explicit and bounded to one request or expiry
    PASS: channel, destination and boundary are all explicit
    RETURN: non-null channel metadata is malformed or expiry formatting is invalid
    BLOCK: channel or destination is null, inferred, shared without control or unbounded

  - check_id: VAL-054H-008
    category: sender_authority
    applies_to: ALL
    test: authorized sender identity, authority source and evidence are independently reviewable
    PASS: all sender fields are present and evidenced
    RETURN: sender evidence is present but stale, mismatched or incomplete
    BLOCK: sender identity, authority source or evidence is null or inferred

  - check_id: VAL-054H-009
    category: sender_recipient_separation
    applies_to: ALL
    test: sender and recipient functions are not supported only by the same unreviewed assertion
    PASS: separation or explicitly governed dual-role authority is evidenced
    RETURN: dual-role authority is claimed but evidence does not resolve the conflict
    BLOCK: same identity self-asserts both roles without canonical authorization

  - check_id: VAL-054H-010
    category: effective_time_and_expiry
    applies_to: ALL
    test: approval, effective and expiry timestamps are parseable, timezone-qualified and logically ordered
    PASS: approval <= effective < expiry, or a valid one-request boundary is explicit
    RETURN: timestamps are non-null but malformed, unordered or already expired
    BLOCK: neither expiry nor one-request boundary exists

  - check_id: VAL-054H-011
    category: delegation
    applies_to: ALL
    test: non-delegation remains effective unless a complete canonical delegation record exists
    PASS: delegation is false, or every governed delegation field and evidence item is complete
    RETURN: delegation is claimed with reviewable but inconsistent details
    BLOCK: delegation is implied, evidence-free, scope-expanding or missing delegator/delegate identity

  - check_id: VAL-054H-012
    category: conflict_and_non_overlap
    applies_to: ALL
    test: request-specific independence, authorship, ownership and implementation conflicts are declared
    PASS: declaration is complete and no prohibited conflict exists
    RETURN: declaration is complete but a resolvable potential conflict is identified
    BLOCK: declaration is null, false, self-certified without evidence or reveals a prohibited conflict

  - check_id: VAL-054H-013
    category: prerequisites
    applies_to: REQUEST_SPECIFIC
    test: every prerequisite_response_id in 054G exists, is final and has a verified source hash
    PASS: all required responses are present and hash-verified, or the template requires none
    RETURN: response exists but its version, finality or hash linkage is inconsistent
    BLOCK: any required response is absent, null, inferred or unanswered

  - check_id: VAL-054H-014
    category: approval_record
    applies_to: ALL
    test: approval reference and timestamp resolve to the authorized record issuer
    PASS: stable approval record exists and is internally consistent
    RETURN: approval is non-null but citation or timestamp is inconsistent
    BLOCK: approval is null, conversational, inferred from silence or reused from unrelated scope

  - check_id: VAL-054H-015
    category: non_authorization
    applies_to: ALL
    test: record explicitly states that it grants no implementation authority and does not itself dispatch or answer the request
    PASS: both non-authorization statements are explicit
    RETURN: statement is present but ambiguous
    BLOCK: statement is absent, contradicted or claims implementation/dispatch authority

  - check_id: VAL-054H-016
    category: disposition
    applies_to: ALL
    test: assignment-record disposition is limited to ASSIGNED_FOR_CONTROLLED_DISPATCH_REVIEW
    PASS: exact permitted disposition after all other checks pass
    RETURN: another non-executing disposition is used
    BLOCK: ACK_RESPONSE, REQUEST_SENT, IMPLEMENT, LEASED, COMPLETE or equivalent is asserted

request_specific_rules:
  - template_id: GIS-TARGET-ASSIGNMENT-W00-01
    additional_BLOCK:
      - source custodian authority is derived only from SRC-CUST-001
      - custodian is permitted to change a requirement or decision
  - template_id: GIS-TARGET-ASSIGNMENT-W00-02
    additional_BLOCK:
      - DEC-012 is treated as automatic appointment for GIS governance review
      - reviewer authored the packets or expects to implement reviewed GIS scope
  - template_id: GIS-TARGET-ASSIGNMENT-W01-01
    additional_BLOCK:
      - prior sponsor approval is treated as the answer to packet 048
      - assignment closes a hold or grants implementation authority
  - template_id: GIS-TARGET-ASSIGNMENT-W01-02
    additional_BLOCK:
      - Product Owner assignment substitutes for privacy, RBAC or implementation authority
      - contextual rows are counted as Admin GIS completion
  - template_id: GIS-TARGET-ASSIGNMENT-W01-03
    additional_BLOCK:
      - joint_or_final_authority_rule is null
      - GIS Admin or Operations User is selected solely from runtime access
      - GIS-ACK-W01-01 is absent or unverified
  - template_id: GIS-TARGET-ASSIGNMENT-W01-04
    additional_BLOCK:
      - joint_or_final_authority_rule is null
      - Security Admin is treated as automatic privacy, legal or retention authority
      - persona, purpose or disclosure scope is invented
      - GIS-ACK-W01-01 is absent or unverified
  - template_id: GIS-TARGET-ASSIGNMENT-W01-05
    additional_BLOCK:
      - reviewer owns, authored or will implement any reviewed scope
      - any of GIS-ACK-W01-01 through GIS-ACK-W01-04 is absent or unverified
      - reviewer fills, interprets or assumes a missing prerequisite answer

