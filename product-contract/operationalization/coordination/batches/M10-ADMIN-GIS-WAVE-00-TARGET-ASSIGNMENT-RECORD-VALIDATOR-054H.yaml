mode: READ_ONLY_DETERMINISTIC_VALIDATION_SPECIFICATION

purpose: >
  Define deterministic ACK, RETURN and BLOCK checks for later human-populated
  copies of the seven blank target-assignment templates. The validator assesses
  record completeness, evidence linkage and fail-closed governance boundaries;
  it does not identify or appoint people, select authority, authorize a sender
  or channel, dispatch a request, record an acknowledgement, or grant a lease.

