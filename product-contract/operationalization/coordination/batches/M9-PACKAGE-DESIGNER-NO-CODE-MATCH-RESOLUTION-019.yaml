existing_behavior_to_preserve:
  versioning:
    - "New draft clones the latest definition while prior versions remain immutable."
    - "Save updates only a row still in draft status."
    - "Publication and deactivation are separate guarded operations."
    - "In-flight inspections remain pinned to their prior published version."
  authoring:
    - "Bilingual section names and unique section keys."
    - "Section and item ordering with keyboard-operable buttons."
    - "One item relationship per section and duplicate-item detection."
    - "Required/optional/conditional and mandatory-when-visible rules."
    - "Evidence override, response mapping, violation and action-form reference."
    - "Action-form definition, blocking state and immutable template-version reference."
    - "Unsaved/no-op state and read-only preview."
  dependency_validation:
    - "Sections array and bilingual titles."
    - "Active item and active published regulation relationship."
    - "Condition target and circular dependency rejection."
    - "Evidence-rule shape."
    - "Action-form key and referenced action-form existence."
    - "Active violation and one-to-one penalty mapping."
    - "Active governed template version."
  publication:
    - "Complete blocker list before publication."
    - "Item, violation and template snapshots frozen into the published definition."
    - "Maker-checker publication through the existing RPC."
    - "Neutral failure message on snapshot or publish error."
  impact_and_audit:
    - "Aggregate active pinned impact without unauthorized row leakage."
    - "Configuration changes remain audited where the current database proves it."
    - "Unavailable impact/audit is never represented as zero."
  stale_and_conflict:
    - "Non-draft writes are rejected."
    - "Do not claim concurrent-edit version-token protection unless independently proven."
    - "Successor design must expose a conflict recovery state and retain user input."

