required_state_matrix:
  page_and_access:
    - id: LOADING
      rule: "Package/version context and route heading remain identifiable."
    - id: READ_ERROR
      rule: "Package, item bank, template or violation read failure is isolated and neutral."
    - id: AUTHORIZED_READ_ONLY
      rule: "No designer controls; explain RLS role boundary."
    - id: PERMISSION_CHECK_FAILED
      rule: "Fail closed; writes disabled; retry."
    - id: PACKAGE_NOT_FOUND
      rule: "Distinct from read failure and denied scope."
  version:
    - "No packages."
    - "Package with no draft."
    - "Empty draft definition."
    - "Published/locked immutable version."
    - "Deactivated version and mandatory reason."
    - "Concurrent/non-draft save conflict with retained unsaved input."
  authoring:
    - "No sections and add-first-section guidance."
    - "Blank or missing bilingual section title."
    - "Duplicate item."
    - "Empty item bank or item bank unavailable."
    - "No selected section/item."
    - "Missing condition target and circular condition."
    - "Invalid evidence rule."
    - "Missing action-form key, trigger target or template."
    - "Referenced violation or penalty dependency unavailable."
    - "Unsaved changes, save pending, save success and save failure."
  preview:
    - "Read-only preview with no configured items."
    - "Conditional item inactive/active."
    - "Missing response/evidence/guidance shown as Not configured."
    - "No live input, submit, score or Inspector mutation."
  publish:
    - "Complete dependency blocker summary."
    - "Same maker/checker."
    - "Snapshot-freeze failure."
    - "Publish RPC failure."
    - "Successful immutable publication and retained prior version."
    - "Impact unavailable versus verified no affected execution."

