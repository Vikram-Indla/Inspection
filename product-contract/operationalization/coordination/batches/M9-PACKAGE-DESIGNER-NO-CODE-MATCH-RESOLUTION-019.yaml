accessibility_contract:
  - "One h1 for the package page and a labelled h2/h3 region for the embedded designer."
  - "Landmarks and skip links preserve page/designer orientation."
  - "Structure selection uses list/tree semantics appropriate to actual interaction."
  - "Reorder actions are keyboard-operable, announce position and never require drag."
  - "Each editor input has a persistent label, description and linked error."
  - "Validation summary receives focus and links to the exact section/item/form."
  - "Unsaved, saving, saved, conflict and publish results use suitable live announcements."
  - "Focus returns to the changed structure item or meaningful result after action."
  - "Preview is labelled read-only and its inert controls are not misleadingly focusable."
  - "1024 and narrow step sequence has deterministic keyboard order."
  - "200% and 400% zoom preserve all fields/actions without two-dimensional page scrolling."
  - "Touch targets meet the approved minimum and reduced motion preserves state changes."

