receipt_results:
  - result: INVALID_AUTHORITY
    receipt_recordable: false
    implementation_authority: false
  - result: INVALID_RECEIPT_INTEGRITY
    receipt_recordable: false
    implementation_authority: false
  - result: INCOMPLETE_OR_INVALID_DECISIONS
    receipt_recordable: false
    implementation_authority: false
  - result: PRESERVATION_NOT_ACKNOWLEDGED
    receipt_recordable: false
    implementation_authority: false
  - result: PROHIBITED_FOR_IMPLEMENTATION
    receipt_recordable: true
    implementation_authority: false
    note: "Preserve the authentic human decision as history; do not dispatch it."
  - result: VALID_RECEIPT_REQUIRES_REPIN
