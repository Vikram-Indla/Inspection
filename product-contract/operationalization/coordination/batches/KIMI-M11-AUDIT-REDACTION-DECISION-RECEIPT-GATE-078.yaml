post_decision_gates:
  - gate_id: PDG-078-01
    name: RECEIPT_ACCEPTANCE
    pass_when: "Result is VALID_DECISIONS_ONLY_POST_GATES_REQUIRED."
  - gate_id: PDG-078-02
    name: DESIGN_AUTHORITY
    pass_when: "Accepted Virtual timeline placement, responsive states and bounded paging are stable."
  - gate_id: PDG-078-03
    name: COLLISION_AND_MIGRATION_ALLOCATION
    pass_when: "Refs are current; exact paths/objects are clear; one forward migration filename is reserved."
  - gate_id: PDG-078-04
    name: IMPLEMENTATION_LEASE
    pass_when: "One owner holds exact app/SQL/object paths with protected exclusions."
  - gate_id: PDG-078-05
    name: INDEPENDENT_QA_LEASE
    pass_when: "A different owner holds test/evidence paths and cannot edit implementation files."
  - gate_id: PDG-078-06
    name: ACCEPTANCE_MATRIX
    pass_when: "All 35 cases are executed; every P0 passes; P1 disposition is requirement-safe."
  - gate_id: PDG-078-07
    name: SECRET_SCAN
    pass_when: "Zero forbidden keys/values across API, serialization, network, DOM/state, logs and evidence."
  - gate_id: PDG-078-08
    name: HISTORICAL_IMMUTABILITY
    pass_when: "Audit row counts, IDs and stored raw hashes are unchanged."
  - gate_id: PDG-078-09
    name: REGRESSION
    pass_when: "Protected suites pass with no exclusion."
  - gate_id: PDG-078-10
    name: BROWSER_AND_SPONSOR_REVIEW
    pass_when: "Real Virtual/Admin implementations and evidence are reviewed and accepted."

post_decision_readiness_rule: "Every gate must pass in order; no gate is inferred from a receipt."

