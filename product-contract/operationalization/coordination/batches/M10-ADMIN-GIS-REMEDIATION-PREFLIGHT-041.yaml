    name: AUTHORITY
    requires:
      - GIS-DEC-041-01 through GIS-DEC-041-08
      - accepted WA-DES-006-C1 for UI work
      - explicit hold-disposition boundaries
  - stage: 2
    name: DATABASE_AND_PERMISSION
    future_leases:
      - GIS-DB-RLS-AUDIT-041
      - GIS-AUTH-ROUTE-READ-041
  - stage: 3
    name: MUTATION_AND_SPATIAL
    future_leases:
      - GIS-RADIUS-CONFIG-ACTION-041
      - GIS-SPATIAL-AUDIT-041
  - stage: 4
    name: MAP_AND_PRESENTATION
    future_leases:
      - GIS-MAP-LIST-FALLBACK-041
      - GIS-I18N-RESPONSIVE-A11Y-041
  - stage: 5
