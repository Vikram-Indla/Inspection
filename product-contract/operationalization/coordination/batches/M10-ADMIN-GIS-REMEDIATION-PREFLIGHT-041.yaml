    future_leases:
      - GIS-ISOLATED-FIXTURES-041
      - GIS-TEST-BROWSER-EVIDENCE-041

release_evidence_requirements:
  permissions:
    - Anonymous and every unauthorized authenticated persona denied before GIS data disclosure.
    - Page, action, and RLS capability results agree.
    - Reduced and precise-location reads match the approved persona matrix.
  mutation:
    - Authorized radius save persists, audits, and displays the governing context.
    - Planner behavior matches the explicit authority decision.
    - Stale concurrent save fails without overwriting the accepted value.
  policy:
    - Missing DEC-002 settings render unresolved, not a certified number.
    - Any final value points to an approved decision/version.
  spatial:
    - Authorized layer/location mutation is audited and unauthorized mutation fails.
    - Official coordinates remain immutable outside the approved GIS correction workflow.
  provider_and_fallback:
    - Mapbox token/style/tile/network failures preserve list and coordinate evidence.
    - Each closed MVP3-HOLD-002 clause has controlled runtime evidence.
    - Offline and geographic-authority claims remain absent until separately approved.
  EN_AR_and_accessibility:
    - EN/LTR and AR/RTL pass light/dark at 1440, 1200, 1024, 768, 412 or 390, and 320 widths.
    - Map and list have equivalent keyboard selection and visible focus.
    - Screen reader, live status, contrast, zoom, and reduced-motion checks pass.
  browser:
    - Accepted WA-DES-006-C1 reference and actual implementation are shown side by side.
    - Runtime screenshots are backed by assertions, fixture manifest, trace, and evidence index.

preflight_verdict:
  implementation_lease_ready: false
  classification: BLOCKED_PENDING_AUTHORITY_POLICY_PROVIDER_AND_DESIGN
  safe_next_action: Run the queued read-only GIS consumer and test inventory.
  prohibited_next_action: Grant, imply, or begin any future implementation lease.

next_queue:
  packet_id: M10-ADMIN-GIS-CONSUMER-TEST-INVENTORY-042
  mode: READ_ONLY
  status: READY_TO_ASSIGN
  objective: >
    Inventory every downstream consumer of engine_settings.gis, factory
    coordinates, per-factory radius, GIS version, Mapbox renderer, spatial
    tables, visibility matrix, and map-provider adapter; map current tests,
    mocks, runtime evidence, breakage risk, and collision-safe certification order.
  boundaries:
    - Separate provider selection from production/offline certification.
    - Preserve Field, Planning, Factory 360, Operations, geo-event, override, and audit behavior.
    - Do not create tests, fixtures, data, code, design, leases, branches, or stashes.
