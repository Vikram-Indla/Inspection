current_source_capability:
  configuration:
    - Creates draft rules from a fixed event-key list.
    - Selects in-app, push, SMS or email channel.
    - Selects governed recipient and escalation roles from roles.
    - Stores an English free-text template and optional SLA minutes.
    - Requires SLA minutes and escalation role together.
  lifecycle:
    - Publishes a draft through publish_notification_rule.
    - Enforces a distinct maker and checker in the database RPC.
    - Supersedes the prior published event-and-channel rule.
    - Deactivates a published rule with a mandatory reason.
    - Guards published rules from mutation or deletion.
  audit_and_version:
    - Generic row audit trigger exists.
    - Notification rows stamp notification_rule_id and rule_version_label.
    - Admin notification-rule audit RPC exists.
    - The page does not display rule audit history.
    - version_label defaults to v1 and no successor-version authoring control is shown.
  provider_truth:
    - In-app persistence is treated as delivery.
    - Email, SMS and push register only when configured provider credentials exist.
    - Unconfigured providers are recorded as not_configured.
    - Send test can address only the authenticated tester.
    - Automatic SLA breach firing is explicitly not implemented.
  language:
    - Page shell and labels use localization.
    - Current manager stores and edits only template, the English half.
    - A later migration adds nullable template_ar.
    - The current manager neither reads nor authors template_ar.
  source_boundary: >-
    These are source-level observations only. No live provider, database,
    browser, responsive, theme, Arabic, accessibility or concurrency journey
    was independently run in this lane.

