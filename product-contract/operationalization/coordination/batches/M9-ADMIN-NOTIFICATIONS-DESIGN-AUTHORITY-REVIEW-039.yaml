design_versus_code_delta:
  nearest_design_has_code_lacks:
    - Dedicated design authority registered to the actual route.
    - A clearly governed audience model rather than recipient-role only.
  CD_016_prompt_requires_code_or_evidence_lacks:
    - Timeline simulator with accepted work calendar.
    - Provider status continuously visible.
    - Reminder, breach, escalation, pause and correction semantics.
    - Delivery audit and partial-channel outcome presentation.
    - Bilingual template editing and realistic Arabic-first proof.
    - Exact component map, wiring map, tests and runtime-evidence contract.
  code_has_nearest_design_lacks_or_does_not_prove:
    - Real maker-checker RPC and published immutability.
    - Honest not_configured provider state.
    - Rule/version stamp on notification records.
    - Explicit declaration that automatic escalation is unbuilt.
  current_source_defects_or_unproven:
    - No exact accepted design package.
    - CD-016 prompt is stale about route and primary files.
    - Broad persona/role mapping is unresolved.
    - Hard-coded event list is not governed by a database catalogue.
    - English-only template authoring despite template_ar schema support.
    - No placeholder validation in create or publish.
    - Arbitrary SLA minutes while DEC-003 remains open.
    - No provider health, attempt, retry, partial-failure or audit UI.
    - No visible maker/checker provenance or pre-submit self-approval block.
    - No draft concurrency token or retained-input stale recovery.
    - No audit-history or governed successor-version workflow on the route.

