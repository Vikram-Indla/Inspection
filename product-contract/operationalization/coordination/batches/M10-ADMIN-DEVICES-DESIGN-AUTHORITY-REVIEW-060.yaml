permissions_and_persona_truth:
  shared_channel_gate:
    field_only: redirected to Field before route query
    other_authenticated_non_field: route admitted
    role_lookup_failure: fails open to AppShell
  navigation_visible_roles: [security_admin]
  source_visibility:
    devices:
      - assigned_user_self
      - ops
      - security_admin
      - auditor
    commands:
      - ops
      - security_admin
      - auditor
  command_authority: [ops, security_admin]
  defects:
    - Ops can command devices but has no navigation entry.
    - Auditor sees every command form but the RPC denies submission.
    - An assigned non-field user can see their device and command form but cannot invoke it.
    - The route does not query actor roles and renders every action to every visible device row.
    - Navigation, route admission, RLS visibility and command authority are not reconciled.
  required_design_rule: >-
    Distinguish full Security Admin, Ops command, Auditor read-only, assigned
    self, denied and session-expired states. Do not expose a destructive control
    and use the RPC error as normal permission discovery.
  validation: FAIL_ROUTE_AND_ACTION_PERMISSION_TRUTH

trust_lifecycle_and_command_contract:
  stored_trust_states: [pending, trusted, suspended, revoked, wipe_pending, wiped]
  trusted_invariant:
    mdm_reference_required: true
    app_version_compliant_required: true
    MDM_attestation_verified: false
    app_policy_version_stored: false
  command_request:
    commands: [suspend, resume, remote_wipe, expire_packages]
    reason_minimum_trimmed_characters: 8
    actor_and_request_time_stored: true
    row_lock: true
    idempotency_key: absent
    expected_device_version: absent
    allowed_transition_matrix: absent
  immediate_state_effects:
    suspend: suspended
    remote_wipe: wipe_pending
    expire_packages: no_device_or_package_state_change
    resume: trusted
  critical_defects:
    - >-
      Resume changes the device to trusted within the queue transaction before
      any MDM transport, device acknowledgement or fresh attestation.
    - >-
      Resume can restore a revoked, wiped or wipe-pending row whenever its
      existing MDM reference and app-compliant boolean satisfy the table check.
    - Suspend and remote-wipe can be repeatedly or contradictorily queued from any state.
    - Expire packages records a command but expires no manifest or cached package.
    - There is no duplicate-command or contradictory-pending-command guard.
    - There is no canonical authenticated acknowledgement/completion RPC or policy.
  test_boundary:
    live_probe_acknowledgement: privileged direct table update after reset role
    application_actor_acknowledgement: absent
    provider_receipt: absent
    implication: >-
      The probe demonstrates that a privileged database actor can mutate status;
      it does not prove device, MDM, service or authenticated application
      acknowledgement.
  validation: FAIL_UNSAFE_TRUST_RESTORATION_AND_UNIMPLEMENTED_COMMAND_LIFECYCLE

package_offline_and_degraded_truth:
  package_open_guard:
    assigned_user_required: true
    trust_status_trusted_required: true
    app_version_compliant_required: true
    package_not_expired_required: true
    append_only_access_event_for_existing_manifest: true
  limitations:
    - A missing manifest denial creates no package-access event.
    - Download and submit paths are not certified by this Admin route.
    - Revoked-device sync rejection is not proven here.
    - Offline cached package invalidation after suspend/wipe/expire request is not proven.
    - Last seen is not sync health and has no approved stale threshold.
    - No outbox, conflict, replay, readiness or rescue source is queried.
  self_enrollment:
    source: separate Field Settings flow
    initial_state: pending
    fail_closed_values:
      mdm_reference: null
      app_version_compliant: false
      last_seen_at: null
      platform: ipad_os
    admin_approval_path: absent
    live_RLS_test_default: skipped_without_opt_in
  validation: PARTIAL_OPEN_GUARD_WITHOUT_END_TO_END_OFFLINE_LIFECYCLE

