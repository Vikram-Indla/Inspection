localization_responsive_theme_and_accessibility:
  localization:
    translated_route_labels: present
    hard_coded_or_raw_English:
      - MDM
      - unverified
      - unassigned
      - platform key
      - trust_status values
      - command and command-status values
      - Working…
      - action validation, success and raw RPC errors
    date_rendering: server-default toLocaleString without explicit app locale or timezone
    identifier_isolation:
      assigned_user_UUID: bdi present
      device_and_MDM_identifiers: not systematically isolated or classified
    design_wordmark:
      English_LTR: Arabic صقيل
      validation: FAIL_SEMANTIC_IDENTITY
    validation: PARTIAL_NOT_EQUIVALENT_ARABIC_FLOW
  responsive:
    structural_support: horizontally wrapped table and wrapping command rows
    risks:
      - select, textarea and queue button inside a wide table cell
      - destructive control detaches from device facts under horizontal scrolling
      - no compact labelled-record layout for narrow screens
      - WA-DES-015 fixed 256px rail lacks explicit narrow breakpoint
    focused_route_evidence: absent
    required_viewports: [1440x900, 1200x900, 1024x768, 768x1024, 412x915, 390x844, 320x568]
    validation: INSUFFICIENT_EVIDENCE
  themes:
    design_modes: [light, dark]
    focused_runtime_matrix: absent
    validation: INSUFFICIENT_EVIDENCE
  accessibility:
    strengths:
      - semantic device table with scoped headers
      - labelled command and reason controls
      - pending button disable
      - status text supplements color
      - action result status or alert
    critical_gaps:
      - repeated Queue command names omit device and consequence
      - no confirmation for remote wipe, suspend or expire packages
      - no valid-state disabled reason
      - no deterministic focus recovery proof
      - no labelled-record alternative for narrow reflow
      - no keyboard, screen-reader, zoom, contrast or reduced-motion evidence
    validation: FAIL_DESTRUCTIVE_ACTION_SAFETY_AND_ACCEPTANCE_EVIDENCE

