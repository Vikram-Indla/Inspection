test_and_evidence_assessment:
  current_proof:
    - structural schema, RLS and command source assertions
    - package-open fail-closed SQL paths
    - one suspend request and privileged status-update rollback probe
    - Field self-enrollment source-contract test
    - optional live self-enrollment RLS test
    - Security Admin route-open smoke
    - Arabic-key presence test
  misleading_or_insufficient_proof:
    - Privileged direct update is not a canonical provider/device acknowledgement path.
    - Route smoke proves rendering, not action authority or lifecycle safety.
    - Arabic-key presence proves neither raw-status translation nor RTL behavior.
    - The only Arabic/mobile additive-route runtime test targets Integrations.
    - Optional self-enrollment live test is skipped by default.
  missing:
    - Security Admin, Ops, Auditor, assigned self, unrelated user, field and anonymous route matrix
    - action visibility and denial for each persona
    - every valid and invalid trust transition
    - resume denial until fresh MDM acknowledgement
    - duplicate, contradictory and stale command prevention
    - destructive-action confirmation and no-change cancellation
    - real MDM transport, acknowledgement, completion and receipt
    - expire-package effect and offline cache invalidation
    - device, actor, time, reason, before/after and immutable audit presentation
    - per-source failure and bounded command-history truth
    - full English/Arabic, LTR/RTL, theme, viewport, keyboard, zoom and accessibility evidence
    - exact accepted route-frame fingerprint and design/runtime comparison
  completion_rule: >-
    No route, screen, requirement or design receives completion credit until
    design authority, trust safety, provider acknowledgement, offline effects,
    audit evidence and every named P0/P1 evidence item pass.

risk_register:
  - id: DEV-060-RISK-001
    severity: CRITICAL
    risk: Queued Resume restores trusted state before MDM or device acknowledgement.
  - id: DEV-060-RISK-002
    severity: CRITICAL
    risk: Revoked, wiped or wipe-pending devices can be resumed without a valid transition contract.
  - id: DEV-060-RISK-003
    severity: CRITICAL
    risk: Remote wipe and package expiry are presented as actionable without transport or effect evidence.
  - id: DEV-060-RISK-004
    severity: CRITICAL
    risk: Frozen design and route inventories point to unrelated designs and persona.
  - id: DEV-060-RISK-005
    severity: HIGH
    risk: Auditor or assigned users receive destructive command controls without RPC authority.
  - id: DEV-060-RISK-006
    severity: HIGH
    risk: Command evidence cannot be attributed to device, actor or time.
  - id: DEV-060-RISK-007
    severity: HIGH
    risk: Failed or bounded command reads appear as complete verified empty history.
  - id: DEV-060-RISK-008
    severity: HIGH
    risk: Design online/offline and outbox fixtures become invented operational truth.
  - id: DEV-060-RISK-009
    severity: HIGH
    risk: Raw MDM reference and internal RPC errors are exposed without approved classification.

reviewer_disposition:
  acknowledgement:
    - WA-DES-015 Devices is the nearest existing information-architecture match.
    - Pending self-enrollment, device RLS and package-open denial are genuinely fail-closed.
    - Queueing is correctly distinguished from completed wipe in route copy.
  return:
    - Correct route mapping to a governed WA-DES-015 Devices state under CD-056.
    - Remove WA-DES-004, WA-DES-043 and WA-DES-011 from route ownership.
    - Remove invented online/offline, outbox, sync and fixture truth.
  block:
    - No design consumption until screen identity and CD-056 route-frame revision are governed.
    - No implementation completion while Resume restores trust before acknowledgement.
    - No MDM, command-completion, wipe, package-expiry or sync-health claim without a provider contract and receipt.
  decision: BLOCK_DUE_TO_MISSING_CONTRACT
  secondary_action: RETURN_FOR_MAPPING_CORRECTION
  recommended_action_after_governance: CORRECT_MAPPING_DEFINE_SAFE_TRANSITIONS_AND_MDM_ACKNOWLEDGEMENT

sponsor_business_decision:
  recommendation: >-
    Approve WA-DES-015 Devices as the corrected design starting point under
    CD-056, but do not approve it for implementation or completion. First
    require a device-state transition contract that forbids restoring trust
    until a fresh MDM/device acknowledgement, defines the effect of revoke and
    expire-packages, and records genuine receipts. Register the MDM hold and
    reconcile personas, audit and offline boundaries. Then assign exactly one
    bounded design writer; any application lease remains a separate decision.

safe_follow_on:
  task_id: M10-ADMIN-DEVICE-COMMAND-MDM-CONTRACT-READINESS-061
  objective: >-
    Read-only define the governance decisions and evidence prerequisites for a
    valid device transition matrix, MDM transport/acknowledgement contract,
    package-expiry effect, command audit and bounded corrective design lease.
  constraints:
    - No live design, application, Field/iPad, provider, database, seed, test or evidence mutation.
    - No frozen mapping, branch, lease, main, setup/Inspection or stash change.
