required_P0_addendum:
  - check_id: 021-P0-01
    subject: "Exact OTP persona authority"
    omission: >-
      020 freezes 013's role/assignment predicate but does not restate the
      canonical final persona matrix. That leaves room to preserve the current
      Planner/Operations/Reviewer/Auditor OTP allowlist.
    required_dispatch_text:
      - "OTP request, verify and status execution: assigned Inspector only."
      - "Reviewer/Auditor: safe verification audit read only."
      - "Planner/Operations: no OTP execution/status unless a new explicit sponsor authority is recorded."
      - "Unassigned Inspector: neutral denial with zero mutation/audit success fact."
    evidence_gate: "Final function-source and persona runtime matrix proves the exact role set."

  - check_id: 021-P0-02
    subject: "OTP runtime after dev_code removal"
    omission: >-
      020 correctly removes dev_code but does not resolve how a representative
      receives the OTP when the configured provider is unavailable. Removing the
      only current delivery seam can make the canonical OTP journey impossible.
    required_dispatch_text:
      - "No dev_code or secret may return to application/client."
      - "Production/runtime OTP completion remains BLOCKED unless an approved configured provider delivers the code."
      - "Isolated tests may inject/observe a code only through an automatically removed transaction-local test harness, never an application flag/shared setting/permanent RPC."
      - "Do not claim CR-350/CR-351 runtime completion from stored not_configured notification evidence."
    evidence_gate: "Provider-backed runtime proof or truthful blocked state plus isolated rollback-only test proof."

  - check_id: 021-P0-03
    subject: "Raw audit denial must cover every authenticated application persona"
    omission: >-
      020 uses 'ordinary staff' and leaves privileged application roles
      ambiguous. code_hash is brute-forceable and cannot remain available to a
      security_admin/leadership/compliance role through normal Data API access.
    required_dispatch_text:
      - "No authenticated application persona, including security_admin, leadership, compliance_admin, Planner, Operations, Reviewer or Auditor, may SELECT raw secret-bearing virtual_participant before_state/after_state."
      - "Only an out-of-band database operational authority may retain physical-row access, governed outside the application Data API."
      - "All application personas use the safe projection."
    evidence_gate: "Direct table query as every application role returns no raw participant audit JSON."

  - check_id: 021-P0-04
    subject: "Stop future secret capture before hardened OTP runs"
    migration_order_risk: >-
      020 schedules the specialized participant audit trigger in phase-3
      contract, after phase-1 013 OTP expansion. Every OTP run before phase 3 can
      still duplicate code_hash into immutable audit.
    required_dispatch_text:
      - "Move the specialized safe virtual-participant audit trigger to phase-1 expansion before any new 013 OTP definition is exercised."
      - "Installing the specialized trigger must preserve old application compatibility."
      - "Raw historical-policy contraction may remain after the application switch."
    evidence_gate: "First OTP call after expansion produces no secret sentinel in audit_events."

  - check_id: 021-P0-05
    subject: "Table ACL contraction must include anon and PUBLIC"
    omission: >-
      020 explicitly revokes ordinary authenticated direct DML but does not
      explicitly require table INSERT/UPDATE/DELETE revokes from anon and PUBLIC.
      RLS denial alone is not the complete privilege contract.
    required_dispatch_text:
      - "Catalog and revoke direct virtual_sessions/virtual_participants INSERT/UPDATE/DELETE from PUBLIC and anon as well as authenticated where not required."
      - "Retain only SELECT grants needed by final RLS-scoped reads."
      - "Trigger/function owners receive no broader role grant than required."
    evidence_gate: "relacl/table_privileges plus anon/authenticated direct DML matrix match the manifest."

  - check_id: 021-P0-06
    subject: "Neutral error contract for every governed resource boundary"
    omission: >-
      020 specifies neutral errors for OTP/audit but does not give stable
      missing/out-of-scope behavior for create/reschedule/waiting/join/verify/
      begin/close RPCs. Definer functions can otherwise become existence oracles.
    required_dispatch_text:
      - "Define one stable not-found-or-out-of-scope token per public resource family, with identical safe response shape for missing and unauthorized IDs."
      - "Do not expose row state, assignment, factory, participant or visit existence before authorization."
      - "Validation/state/window failures may remain distinct only after caller scope is proven."
    evidence_gate: "Paired missing/out-of-scope tests for every public RPC have identical normalized status/token/body."

  - check_id: 021-P0-07
    subject: "Contract deployment drain and in-flight request safety"
    migration_order_risk: >-
      Phase 3 contains separate 013 and 015 contract migrations. In-flight old
      application requests can call direct DML/generic append while grants and
      functions are changing.
    required_dispatch_text:
      - "Quiesce M11 mutating endpoints and drain in-flight M11 requests before phase-3 contraction."
      - "Apply 013 then 015 contract migrations without reopening traffic between them."
      - "Run the final catalog/health smoke before resuming traffic."
      - "If controlled quiescence is unavailable, block deployment rather than accept a skew window."
    evidence_gate: "Deployment rehearsal shows no old-path call succeeds or partially fails across the contract boundary."

  - check_id: 021-P0-08
    subject: "Global admin audit consumer preservation"
    ownership_collision: >-
      015 restricts raw virtual_participant audit rows, but 020 switches only the
      M11 room audit renderer. The global admin audit surface may still depend
      on audit_events and could lose required virtual-session evidence.
    required_dispatch_text:
      - "Inventory every application consumer of audit_events before raw-policy contraction."
      - "Move any virtual_participant consumer to the safe projection or show an explicit truthful restricted state."
      - "Do not weaken maker-checker/general audit visibility for unrelated object types."
    evidence_gate: "Admin audit, Reviewer audit and maker-checker audit regressions pass after contraction."

required_P1_addendum:
  - check_id: 021-P1-01
    subject: "Unsafe nested legacy helpers"
    contradiction: >-
      New definer functions may call public.has_role/has_any_role/
      is_assigned_inspector, whose canonical definitions are themselves
      SECURITY DEFINER with search_path=public.
    required_dispatch_text:
      - "New M11 definers must not depend on an unsafe nested legacy helper."
      - "Inline fully qualified role/assignment predicates, or separately harden the helper under an explicitly reviewed global lease."
      - "Do not silently broaden 020 into an unreviewed platform-wide helper rewrite."
    evidence_gate: "Function dependency graph contains no unsafe search_path definer below an M11 public RPC."

  - check_id: 021-P1-02
    subject: "Exact role authority for reschedule, waiting and close"
    omission: >-
      020 assigns governed RPC owners but leaves final persona sets implicit.
      Current broad RLS behavior and CR-338/CR-341 Inspector personas are not a
      sufficient executable role matrix.
    required_dispatch_text:
      - "For each RPC, cite the exact requirement/RBAC authority for Planner, Operations and assigned Inspector."
      - "Where authority is absent or conflicting, fail closed and return for sponsor decision rather than preserve broad current behavior."
    evidence_gate: "Per-RPC role matrix has an authority citation and positive/negative proof for every persona."

  - check_id: 021-P1-03
    subject: "Deterministic multi-record lock order"
    omission: >-
      020 locks OTP participants but does not freeze a consistent lock order for
      creation, reschedule, join and begin transactions touching visit, session,
      participant and inspection rows.
    required_dispatch_text:
      - "Document and reuse one lock order for every overlapping governed RPC."
      - "Bound lock waits through the environment's accepted database defaults; do not invent a timeout value."
    evidence_gate: "Concurrent mixed-action test proves no deadlock and deterministic loser behavior."

  - check_id: 021-P1-04
    subject: "Function owner and extension qualification manifest"
    omission: >-
      020 requests owner catalog proof but does not require the corrected packet
      to declare the intended owner or qualification of digest/gen_random_uuid
      and enum/types used with search_path=''.
    required_dispatch_text:
      - "Declare intended owner and bypass-RLS consequence for every definer."
      - "Qualify extensions.digest/gen_random_uuid (as installed), auth.uid, public types/tables and private helpers."
      - "Verify against the actual isolated database namespaces; do not guess extension schema."
    evidence_gate: "pg_proc owner/proconfig/dependency catalog matches source and no name resolution depends on caller search_path."

  - check_id: 021-P1-05
    subject: "Policy predicate indexes and zero-row semantics"
    omission: >-
      020 covers recursion but not the index/RETURNING proof needed to
      distinguish denial/stale state and avoid policy joins degrading or silently
      returning zero rows.
    required_dispatch_text:
      - "Verify indexes for every final assignment/session/participant policy join."
      - "Every governed update checks affected-row count and maps zero rows only after caller scope is proven."
      - "No raw SQL/RLS message reaches the client."
    evidence_gate: "Explain/catalog index proof plus stale/denied zero-row negative tests."

