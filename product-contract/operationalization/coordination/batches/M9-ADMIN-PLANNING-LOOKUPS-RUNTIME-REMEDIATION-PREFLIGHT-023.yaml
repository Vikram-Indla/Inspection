blocking_decisions:
  - id: LK-DEC-001
    decision: >-
      Select one canonical cancellation vocabulary for Planning, Field,
      Execution and Operations, including migration and backward compatibility.
    prohibited_default: Do not silently synchronize two mutable authorities.
  - id: LK-DEC-002
    decision: >-
      Approve lookup ownership: every Admin-class role, a dedicated Planning
      configuration role, or an explicit capability grant model.
    prohibited_default: Do not infer ownership from current permissive defaults.
  - id: LK-DEC-003
    decision: >-
      Approve version/effective-date/maker-checker governance or a documented,
      bounded direct-publication exception by lookup kind and risk.
    prohibited_default: Do not retrofit generic config_versions without a migration contract.
  - id: LK-DEC-004
    decision: >-
      Define dependency behavior when an active value is used by drafts,
      published visits, in-flight inspections or audit history.
    prohibited_default: Do not block, rewrite or cascade historical references by assumption.
  - id: LK-DEC-005
    decision: >-
      Define whether Arabic labels are mandatory before activation and who may
      approve translation completeness.

proposed_lease_sequence:
  - lease_id: LK-LEASE-CONTRACT-001
    order: 1
    purpose: Canonical vocabulary and backward-compatibility contract.
    owner: ONE_CONTRACT_OWNER
    artifacts_only:
      - source-of-truth decision
      - kind/key and metadata schema
      - canonical REQ-R0C-01486 value reconciliation
      - historical-reference and consumer migration rules
    do_not_touch:
      - product code
      - database
      - design
      - tests
  - lease_id: LK-LEASE-DB-001
    order: 2
    purpose: Version, approval, concurrency, dependency and projection boundary.
    owner: ONE_DATABASE_ENGINEER
    proposed_paths:
      - one new forward-only Planning Lookup governance migration
      - one new authenticated RLS/concurrency database probe
    forbidden_overlap:
      - existing migrations
      - engine_settings execution-admin ownership
      - audit replay migration
      - remote Supabase apply
    entry_criteria:
      - LK-DEC-001 through LK-DEC-005 recorded.
      - Migration filename and database owner recorded.
      - Execution-admin owner accepts the source convergence plan.
    exit_criteria:
      - Exactly one approved active/effective vocabulary drives every consumer.
      - Maker/checker or approved bounded exception is database-enforced.
      - Compare-and-set rejects stale writes.
      - Deactivation applies the approved dependency policy.
      - Historical references remain resolvable.
      - Audit records proposal, approval, activation, retirement and source migration.
  - lease_id: LK-LEASE-CONSUMERS-001
    order: 3
    purpose: Migrate all readers to the governed active/effective projection.
    owner: ONE_CROSS_MODULE_INTEGRATION_ENGINEER
    proposed_paths:
      - apps/web/src/app/(app)/planning/page.tsx
      - apps/web/src/app/(app)/planning/bulk/actions.ts
      - apps/web/src/app/(app)/planning/immediate/page.tsx
      - apps/web/src/app/(app)/planning/immediate/actions.ts
      - apps/web/src/lib/planning/lifecycle.ts
      - approved Field/Execution/Operations adapters only
    collision_rule: >-
      Field, Execution and Operations files require explicit package-owner
      consent; otherwise add a stable shared projection and leave their files
      to their recorded owners.
    exit_criteria:
      - Every affected route reads the same effective value set.
      - Unknown/deactivated keys fail safely without corrupting existing records.
      - assignment_override_reason is either wired or removed from claims.
  - lease_id: LK-LEASE-UI-001
    order: 4
    purpose: Implement accepted Planning Lookup authority and hard states.
    owner: ONE_M9_WEB_ENGINEER
    proposed_paths:
      - apps/web/src/app/(app)/admin/planning/lookups/page.tsx
      - apps/web/src/app/(app)/admin/planning/lookups/LookupsAdmin.tsx
      - apps/web/src/app/(app)/admin/planning/lookups/actions.ts
      - apps/web/src/app/(app)/admin/planning/lookups/constants.ts
      - optional route-local layout only
    entry_criteria:
      - Design review 046 has an accepted stable revision.
      - DB and consumer contracts are frozen.
    exit_criteria:
      - Route authorization matches the approved owner model.
      - Draft/check/publish or approved direct-publication semantics are honest.
      - Stale, dependency-blocked, unauthorized, empty, provider-error and audit-error states are visible.
      - Success text names exactly which consumers receive the change.
      - EN/AR completeness follows LK-DEC-005.
  - lease_id: LK-LEASE-QA-001
    order: PARALLEL_AFTER_CONTRACT_FREEZE
    purpose: Independent database, browser and cross-channel certification.
    owner: INDEPENDENT_QA_REVIEWER
    proposed_paths:
      - new apps/web/e2e/web-admin-m9-planning-lookups-runtime.spec.ts
      - new supabase/tests/m9_planning_lookups_governance_probe.sql
      - external evidence under approved INSPECTION_DOCS_ROOT
    rule: QA owner does not modify implementation files or issue its own completion credit.

