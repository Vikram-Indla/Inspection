focused_test_matrix:
  p0:
    - id: LK-TST-001
      proof: Planning, Field, Execution and Operations return identical effective cancellation keys and metadata.
    - id: LK-TST-002
      proof: Every REQ-R0C-01486 required key exists with governed comments/evidence rules.
    - id: LK-TST-003
      proof: Unauthorized users cannot propose, approve, activate, edit or retire lookup values.
    - id: LK-TST-004
      proof: Maker cannot approve their own high-impact vocabulary change.
    - id: LK-TST-005
      proof: Two editors load one version and the stale writer is rejected without overwrite.
    - id: LK-TST-006
      proof: Deactivation of an in-use value follows the approved dependency rule and preserves history.
    - id: LK-TST-007
      proof: A scheduled/effective change appears in no consumer early and every consumer after activation.
    - id: LK-TST-008
      proof: Change and audit publication are atomic or durably correlated.
  p1:
    - id: LK-TST-009
      proof: Active-only readers never receive drafts, future versions or retired metadata.
    - id: LK-TST-010
      proof: Approved administrators can review inactive/history data without widening consumer reads.
    - id: LK-TST-011
      proof: Unknown kind, malformed key, invalid metadata and duplicate version fail neutrally.
    - id: LK-TST-012
      proof: EN/AR, LTR/RTL, light/dark, responsive and keyboard/a11y evidence passes.
    - id: LK-TST-013
      proof: UI success, stale, dependency, audit and provider messages describe the real outcome.

