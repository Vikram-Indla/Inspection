result_semantics:
  ACK:
    meaning: >-
      The answer set is complete, internally compatible, within sponsor
      authority and safe for formal change-control recording.
    does_not_mean:
      - design approved
      - provider enabled
      - implementation or test lease granted
      - requirement or acceptance case completed
  RETURN:
    meaning: >-
      One or more answers are incomplete, ambiguous, unverified or mutually
      inconsistent but appear correctable without weakening requirements.
    next_action: Return exact failed check IDs to sponsor/governance; do not infer missing content.
  BLOCK:
    meaning: >-
      An answer authorizes an unsafe/prohibited outcome, claims authority it
      does not possess, invents provider/policy facts, or weakens the mandatory
      requirement/evidence floor.
    next_action: Stop design/implementation consumption and escalate the exact prohibited check.

