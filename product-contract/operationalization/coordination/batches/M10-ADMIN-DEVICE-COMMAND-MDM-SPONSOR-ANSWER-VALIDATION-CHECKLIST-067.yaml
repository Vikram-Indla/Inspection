acceptance_preservation_checks:
  negative_cases:
    source: M10-ADMIN-DEVICE-COMMAND-MDM-NEGATIVE-ACCEPTANCE-MATRIX-064
    expected: 46
    checks:
      - Every case remains mapped to an answered policy or remains explicitly blocked.
      - No answer changes REJECT/HOLD/DEGRADE/BLOCK into optimistic success without approved evidence.
      - No provider-held case is removed from the ledger.
  positive_cases:
    source: M10-ADMIN-DEVICE-COMMAND-MDM-TEST-READINESS-CROSSWALK-065
    expected: 14
    checks:
      - Every positive lifecycle has an allowed path or a truthful dependency block.
      - A held provider may block completion but cannot cause the mandatory requirement to be deleted or marked complete.
      - Current source behavior or adjacent tests cannot substitute for future lifecycle evidence.
  fail_result:
    missing_or_ambiguous_mapping: RETURN
    removed_or_weakened_case: BLOCK

provider_authority_verification:
  D09-A:
    required: Canonical provider-hold record resolving the current MDM hold contradiction.
    forbidden: Credentials, transport, provider receipt, attestation or positive completion claim.
  D09-B:
    required:
      - separate approved provider governance reference
      - named non-production environment and credential owner
      - authenticated request/receipt and correlation contract
      - privacy/security/release evidence requirements
    forbidden: Enabling provider solely from sponsor option text.
  D09-C:
    required:
      - separate approved provider-neutral schema/governance reference
      - explicit hold on provider-specific execution and live completion
    forbidden: Claiming mock/seed contract tests prove provider runtime.
  unverified_reference_result: RETURN
  invented_or_false_runtime_authority_result: BLOCK

evaluation_algorithm:
  ordered_steps:
    - Parse exact ten-answer structure and allow-listed option IDs.
    - Evaluate required and conditional companion fields.
    - Resolve cited governance/provider references read-only.
    - Run per-decision checks.
    - Run all cross-decision checks.
    - Reconcile every one of the 46 negative and 14 positive cases.
    - Confirm no lease, enablement, completion or design-acceptance authority is implied.
    - Emit one overall result and every failed check ID.
  precedence: BLOCK overrides RETURN; RETURN overrides ACK.
  ACK_condition: No BLOCK or RETURN check fails.
  output_fields:
    - answer_set_revision
    - overall_result
    - passed_check_ids
    - failed_return_check_ids
    - failed_block_check_ids
    - unresolved_references
    - acceptance_case_reconciliation
    - next_authorized_change_control_step

