    - mvp3_evidence_access_grants
    - user_roles exact RLS-visible count
  mutation:
    rpc: mvp3_decide_access_review
    actor: security_admin
    decisions: [retain, revoke]
    reason_minimum_trimmed_characters: 8
    row_lock: true
    open_state_guard: true
    subject_self_decision_denied: true
  current_runtime_gaps:
    - Route has no exact admission guard equivalent to Security Admin navigation.
    - Grant-read and role-count failures can appear as zero.
    - Review-read failure is rendered as an environment-contract warning, not a source-specific state.
    - Raw RPC error messages may be returned to the client.
    - Closed review rows omit stored reviewer and reason from the page.
    - Counts have no as-of, completeness or freshness indicator.
    - No immutable audit event for the decision was found.

roles_permissions_and_maker_checker:
  roles:
    status: CONTEXT_ONLY
    truth: RLS-visible role holdings count is not effective-permission proof.
  permissions:
    status: NOT_OWNED_BY_ROUTE
    truth: No role/capability/permission grant or revoke belongs here.
  maker_checker:
    subject_separation: ENFORCED
    opener_vs_decider_separation: NOT_ENFORCED
    full_independent_maker_checker: NOT_PROVEN
    design_defect: Current runtime and design use "Independent decision" too broadly.
    required_label: Subject-separated access review unless governance adds opener/checker separation.
  concurrency:
    database_row_lock: PRESENT
    second_successful_decision_prevented: CONTRACTUALLY_EXPECTED
    expected_version: ABSENT
    stale_UI_recovery: UNPROVEN
    design_requirement: Preserve user input, show already-decided truth, and reload without overwrite.
  audit:
    stored_row_fields:
      - reviewed_by
      - review_reason
      - reviewed_at
      - status
    immutable_event: NOT_PROVEN
    before_after_event: NOT_PROVEN
    retrieval_evidence: NOT_PROVEN
    design_rule: Never claim fully audited completion from stored row columns alone.

