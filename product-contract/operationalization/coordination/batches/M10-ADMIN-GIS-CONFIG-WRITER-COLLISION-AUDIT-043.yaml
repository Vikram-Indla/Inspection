CAS_and_lost_update_proof:
  factory_radius_same_row:
    initial: Radius R0.
    sequence:
      - Editor A and Editor B load R0.
      - A saves R1 using only factory ID.
      - B saves R2 using only factory ID.
    observed_contract: Both writes may succeed; R2 silently replaces R1.
    rejected_or_conflict_state: absent
    proof_source: updateGeofenceRadius filters only .eq("id", factory_id).
  shared_GIS_rules_same_row:
    initial: Settings S0 and version V0.
    sequence:
      - Editor A and Editor B read S0.
      - A writes four rule values S1 with generated version V1.
      - B writes four rule values S2 from stale S0 with generated version V2.
    observed_contract: B overwrites A; no version or updated_at predicate exists.
    rejected_or_conflict_state: absent
    proof_source: writeGovernedKeys reads settings, then updates only by .eq("engine", "gis").
  factory_override_versus_shared_default:
    initial: Factory has null override and therefore inherits default D0.
    sequence:
      - /admin/execution changes default to D1.
      - Open /admin/gis page still shows D0 until reload because only /admin/execution is revalidated.
      - An Admin saves the displayed D0 as an explicit factory override.
    observed_contract: The factory becomes permanently pinned to stale D0 while other null-radius factories inherit D1.
    conflict_state: absent
    severity: P0
  open_Field_session:
    initial: Field page loads old policy P0 and old default/accuracy/interval.
    sequence:
      - Admin changes shared policy to P1 effective immediately.
      - Field client continues displaying and calculating with P0.
      - Server confirm_arrival reads P1 at transaction time.
    observed_contract: Client preview can disagree with the authoritative server result.
    conflict_or_refresh_contract: absent
    severity: P0

audit_failure_proof:
  generic_engine_trigger:
    source:
      - supabase/migrations/0002_rbac_audit.sql
      - supabase/migrations/20260721100000_execution_admin_audit.sql
    behavior: A successful engine_settings update appends a generic audit event through a security-definer trigger.
  explicit_execution_audit:
    source: apps/web/src/app/admin/execution/actions.ts
    behavior: After update, the action directly inserts a second execution_config_update event.
    RLS_state:
      audit_events_RLS_enabled: true
      authenticated_insert_policy_found: false
      read_policy_only: audit_read
    current_result: Direct application insert is expected to be rejected by RLS.
    action_handling: Error is logged, then the action returns ok true.
    implication:
      - Source-level test claims explicit audited behavior without proving the insert.
      - Generic audit may exist, but scoped governed keys and EXE-ADMIN refs are absent from that generic event.
      - User is told success even when the intended scoped audit fails.
    severity: P0
  duplicate_risk:
    condition: If a future policy permits the explicit insert without removing or correlating the generic trigger.
    result: One update can generate two overlapping audit records.
    severity: P1
  factory_radius_audit:
    behavior: Generic before/after event exists for a successful update.
    gaps:
      - no radius-change reason
      - no governing policy version
      - no conflict/rejection event
      - gis_admin cannot read audit_events under current audit_read roles
  spatial_audit:
    behavior: No audit trigger found on gis_layers or factory_locations.
    severity: P0

version_lineage_collision:
  shared_engine_version:
    writer: /admin/execution
    value: Timestamp-derived application string.
    CAS: absent
  server_arrival:
    source: supabase/migrations/20260721140000_execution_journey_cancellation.sql
    value: Reads current engine_settings.gis version_label during confirm_arrival.
    result: Canonical inside arrival carries current server-resolved lineage.
  Field_client:
    source: apps/web/src/app/(app)/field/[visitId]/Startup.tsx
    value: v1-accepted-2026-07-11
    affected_records:
      - telemetry
      - deviation
      - outside check-in
      - legacy check-in
      - legacy arrival
      - exception
      - offline queued geo_checkin
    result: Events can carry stale or false lineage after an Admin change.
  offline_replay:
    source: apps/web/src/lib/offline.ts
    behavior: Preserves the queued caller-provided GIS version.
    issue: No reconciliation against the effective server version is defined.
  Visit_detail:
    source: apps/web/src/app/(app)/visits/[id]/page.tsx
    behavior: Displays stored GIS version as audit lineage.
    issue: Cannot distinguish server-resolved from client-hard-coded provenance.
  verdict: CONFIRMED_P0_LINEAGE_DIVERGENCE

consumer_dependency_and_failure_matrix:
  - consumer: /admin/gis
    dependency: engine_settings.gis plus factories
    writer_effect: Shared default and version change.
    refresh_gap: /admin/execution does not revalidate /admin/gis.
    failure: One source error hides both healthy sources.
  - consumer: /field/[visitId]
    dependency: accuracy, default radius, telemetry and deviation settings.
    writer_effect: Behavior changes after page reload, while open sessions remain stale.
    failure: Client fallbacks can mask missing policy and disagree with server.
  - consumer: server confirm_arrival
    dependency: current accuracy, radius and version at transaction time.
    writer_effect: Immediate.
    failure: May reject a client preview calculated under stale settings.
  - consumer: /field/[visitId]/travel
    dependency: default/factory radius and Directions.
    writer_effect: Requires page reload.
    failure: Literal radius fallback and provider failure are independent.
  - consumer: /operations
    dependency: default/factory radius and geo-event results.
    writer_effect: Requires navigation or refresh for page-level map.
    failure: Old open screen can show stale rings and mixed-version events.
  - consumer: Planning
    dependency: official coordinates and per-factory radius.
    writer_effect: Factory override appears after query refresh.
    failure: No explicit GIS policy lineage is shown.
  - consumer: Factory 360
    dependency: coordinates, radius and geo events.
    writer_effect: Null override is labelled engine default without loading its current value.
    failure: Audit presentation can imply lineage not actually resolved.
  - consumer: spatial schema
    dependency: gis_layers, factory_locations, visibility matrix, map packs and snapshots.
    writer_effect: Only gis_layers has a current writer.
    failure: Other foundations remain unwired and unaudited.

