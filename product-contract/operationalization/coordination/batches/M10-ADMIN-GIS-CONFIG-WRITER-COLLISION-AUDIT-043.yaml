writer_matrix:
  - writer_id: FACTORY_RADIUS_WRITER
    route: /admin/gis
    source: apps/web/src/app/(app)/admin/gis/actions.ts
    record: factories row
    owned_field: geofence_radius_m
    current_authorization:
      page: Any authenticated non-field user can reach the route directly.
      action: Any authenticated user may invoke.
      RLS: gis_admin or planner may update the row.
    validation:
      - positive
      - finite
      - rounded integer
    missing:
      - explicit GIS capability check
      - approved upper bound
      - expected current value or version
      - reason
      - GIS policy version context
      - conflict result
    audit: Generic factory update trigger only.
    refresh: /admin/gis only.
  - writer_id: SHARED_GIS_RULE_WRITER
    route: /admin/execution
    source: apps/web/src/app/admin/execution/actions.ts
    record: engine_settings row where engine equals gis
    owned_fields:
      - arrival_detection_radius_m
      - geofence_default_radius_m
      - gps_accuracy_checkin_max_m
      - telemetry_interval_s
    current_authorization:
      page_and_action_capability: admin.execution_workflow
      default_capability_roles:
        - compliance_admin
        - form_admin
        - workflow_admin
        - risk_owner
        - gis_admin
        - security_admin
      direct_user_grants: Possible through user_capability_grants.
      RLS_update_roles:
        - risk_owner
        - gis_admin
        - compliance_admin
        - workflow_admin
        - security_admin
      mismatch:
        - form_admin has the capability but not engine_write RLS.
        - A directly granted non-RLS persona can render and invoke but cannot update.
    validation:
      - integer
      - minimum 1
    missing:
      - approved upper bounds
      - DEC-002 formal authority
      - expected updated_at or version_label
      - atomic update and audit
      - downstream invalidation
    version_behavior: Creates a timestamp-derived version_label in application code.
    refresh: /admin/execution only.
  - writer_id: SPATIAL_LAYER_WRITER
    route: /admin/gis/spatial
    source: apps/web/src/app/(app)/admin/gis/spatial/actions.ts
    record: gis_layers row
    current_authorization:
      page: Any authenticated non-field user can reach the route when enabled.
      action: Authenticated user plus feature flag.
      RLS:
        - gis_admin
        - security_admin
        - compliance_admin
    validation:
      - nonempty key
      - nonempty label
      - enumerated layer type
    missing:
      - governed screen identity
      - explicit action capability
      - audit trigger
      - version lifecycle
      - provider and policy clearance

