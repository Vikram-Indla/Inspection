      status: OPEN
      evidence: >
        Packet 044 still calls GIS-WRITER-A the "Clearest ownership and audit
        story." Addendum 046 states that it does not amend packet 044 and does
        not provide a balanced replacement comparison for GIS-WRITER-A,
        GIS-WRITER-B and GIS-WRITER-C.
      required_correction: >
        Present the same benefit, operating cost, migration consequence and
        governance risk structure for all three writer choices.
    - prior_id: GISCONSENT-N-02
      subject: Offline lineage tradeoffs
      status: OPEN
      evidence: >
        Packet 044 gives an explicit continuity cost for GIS-OFFLINE-B but not
        an equivalent operational, audit and conflict-handling cost for
        GIS-OFFLINE-A. Addendum 046 does not replace these options.
      required_correction: >
        Give both offline choices the same benefit, field-continuity cost,
        audit burden and conflict/review consequence structure.
    - prior_id: GISCONSENT-N-03
      subject: Conflict-protection tradeoffs
      status: OPEN
      evidence: >
        Packet 044 calls field-level merge more complex but does not equally
        disclose the refresh/re-entry burden of reject-and-compare.
      required_correction: >
        Give both conflict choices the same user-friction, delivery-complexity
        and residual-risk structure.
  business_readability:
    - prior_id: GISCONSENT-BR-01
      status: CLOSED_BY_046
      evidence: Addendum 046 opens with a short sponsor brief and no-build boundary.
    - prior_id: GISCONSENT-BR-02
      status: CLOSED_BY_046
