real_route_truth:
  route_exists: true
  component: apps/web/src/app/(app)/admin/devices/page.tsx
  loading_component: apps/web/src/app/(app)/admin/devices/loading.tsx
  title: Trusted device and offline administration
  code_authority_badge: M3-06_CD-056_14_CONTROLLED_ROWS
  reads:
    devices:
      table: mvp3_devices
      fields: [id, device_identifier, platform, assigned_user_id, trust_status, mdm_reference, last_seen_at, enrolled_at]
      order: enrolled_at_descending
      pagination_or_limit: NONE
    commands:
      table: mvp3_device_commands
      fields: [id, device_id, command, status, reason, requested_at, completed_at]
      order: requested_at_descending
      limit: 30
  governed_action:
    rpc: mvp3_issue_device_command
    commands: [suspend, resume, expire_packages, remote_wipe]
    reason_minimum_characters: 8
    authorized_roles: [ops, security_admin]
    concurrency: Device row is locked before command creation and immediate trust-state update.
    queued_truth: Command creation is not device acknowledgement or completion.
  immediate_state_effects:
    suspend: suspended
    resume: trusted
    remote_wipe: wipe_pending
    expire_packages: NO_IMMEDIATE_DEVICE_STATE_CHANGE
  current_route_gaps:
    - Only the device read error is handled; command-read failure can appear as verified no commands.
    - Raw RPC error.message is returned to the client.
    - Device list is unbounded; command history is bounded to 30 without completeness or total.
    - Assigned users render as opaque UUIDs, not governed display identities.
    - MDM reference is shown as unverified when null but external MDM status is not independently proven.
    - App version and app_version_compliant exist in schema but are not selected or shown.
    - Command evidence omits device identifier, requester, requested time and completed time.
    - Every row exposes every command even when it is nonsensical for the current trust state.
    - The RPC does not reject no-op or contradictory state transitions and has no optimistic version guard.
    - The command table is not append-only and no dedicated immutable audit trigger is proven.
    - Command acknowledgement/completion is not implemented by this route.
    - Registration, reassignment, revoke, sync health, outbox, package-access and replay controls are absent.

