nearest_design_resolution:
  nearest:
    design_id: WA-DES-015
    filename: SAQEEL Admin.dc.html
    state_key: devices
    title: Field devices
    subtitle: registered devices · last sync · attestation
    classification: NEAREST_EXISTING_FUNCTIONAL_AND_INFORMATION_ARCHITECTURE_MATCH
    exact_evidence:
      - A dedicated Devices navigation state exists in the registered multi-state Admin design.
      - Its table contains Device, Inspector, OS, Last sync, Outbox and Status.
      - It distinguishes online, offline and revoked illustrative states.
      - Its content is closer to trusted-device and offline administration than any mapped M8 design.
    limitations:
      - It has no governed suspend, resume, expire-package or remote-wipe command.
      - It has no mandatory reason, authorization, pending/acknowledged/completed/failed evidence or audit actor.
      - It presents last sync and outbox values not read by the current route.
      - It lacks MDM/app-version compliance and trust-policy detail required by the real schema.
      - It contains hard-coded device, inspector, OS, timestamp, outbox and status fixtures.
      - It does not cover registration, assignment, package access, readiness, replay or sync-rescue requirements end to end.
  state_system_support:
    design_id: WA-DES-041
    state_key: devices
    classification: FOUNDATION_STATE_SUPPORT_NOT_ROUTE_AUTHORITY
    exact_support:
      en_title: Trusted Devices
      ar_title: الأجهزة الموثوقة
      en_empty: No registered devices are visible under access policy.
      ar_empty: لا توجد أجهزة مسجلة مرئية وفق سياسات الوصول.
    rule: Use its verified-empty semantics as a foundation reference; do not replace the route design with it.
  rejected:
    - {design_id: WA-DES-004, reason: No Devices state exists.}
    - {design_id: WA-DES-043, reason: Users and roles, not device administration.}
    - {design_id: WA-DES-011, reason: Role override, not device administration.}
  validation_status: CONFIRMED_WITH_CORRECTION

