collision_safe_design_lease:
  prerequisite_sequence:
    - Governance binds WA-DES-015 Devices, removes false route authorities and records CD-056 lineage.
    - Governance closes identity, scope, permission, command, audit, MDM and adjacent-surface decisions.
    - Orchestrator rechecks WA-DES-015, every state in SAQEEL Admin.dc.html, CD-056, WA-DES-041 and all active writers.
    - Sponsor names exactly one writer and one bounded Devices-frame design lease.
  writer_boundary:
    may_change_after_lease:
      - WA-DES-015 Devices state only, within the accepted bounded delta.
    must_preserve:
      - every other WA-DES-015 state and its selector
      - CD-056 family authority
      - WA-DES-041 foundation semantics
      - fail-closed MDM and production holds
    prohibited_parallel_writers:
      - any writer touching SAQEEL Admin.dc.html or its state selector
      - any writer touching its Devices state or shared Admin shell
      - any writer touching CD-056, WA-DES-041 or the same evidence index
  closeout:
    - Independent reviewer verifies P0 and P1 evidence.
    - Sponsor accepts, returns or rejects the design correction.
    - Any later implementation lease separately records exact application-file ownership.

