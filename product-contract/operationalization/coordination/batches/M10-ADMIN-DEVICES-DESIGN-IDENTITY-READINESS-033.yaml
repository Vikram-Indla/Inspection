data_audit_concurrency_and_provider_truth:
  data:
    - Count only successful RLS-visible reads.
    - Distinguish verified empty, denied, read failure and bounded history.
    - A last-seen timestamp is not sync health; no outbox data is read here.
    - Trusted requires a non-empty MDM reference and compliant app version in the schema.
  audit:
    - Command row stores command, reason, requester and request time.
    - Current UI does not expose the full stored actor/time/device evidence.
    - No append-only command trigger or canonical audit event is proven.
  concurrency:
    - The RPC locks the device row during command creation and state update.
    - There is no expected version, allowed-transition matrix or duplicate-command idempotency key.
    - Concurrent commands serialize but may still create contradictory sequential commands.
  provider:
    implementation_status: RUNTIME_CERTIFIED_MDM_HELD
    formal_provider_hold_id: NONE_IN_MVP3_PROVIDER_POLICY_HOLDS
    consequence: >-
      External MDM enrollment, attestation, command transport, acknowledgement
      and completed wipe cannot be claimed live. Governance must register the
      MDM contract and fail-closed hold before design acceptance or enablement.
    production_hold: MVP3-HOLD-008

