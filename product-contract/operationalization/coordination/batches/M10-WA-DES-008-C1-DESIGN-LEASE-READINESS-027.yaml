provider_name_rule: >-
  Show a provider name only when returned by an RLS-visible endpoint record.
  Do not hard-code Twilio, Resend, Senaei, DocuSign, Teams, Zoom, or another
  provider as connected, scheduled, live, healthy, late, or failing.

pagination_completeness_and_freshness:
  endpoint_registry:
    query_limit: absent
    total_count: absent
    completeness_proof: absent
  api_events:
    query_limit: 20
    rendered_rows: 8
    total_count: absent
  export_jobs:
    query_limit: 20
    rendered_rows: 8
    total_count: absent
  requirements:
    - Label event and export panels "Recent" and state that only eight loaded rows are visible.
    - Do not label endpoint count as global inventory without a counted complete query.
    - Show totals only when returned by source.
    - Annotate pagination or load-more as an implementation gap.
    - Use updated_at, occurred_at, requested_at, or completed_at only when selected and deliberately displayed.
    - Do not classify stale/fresh without an approved freshness policy.

error_isolation_and_data_truth:
  current_behavior:
    endpoint_error: Captured and drives the schema-unavailable banner.
    event_error: Discarded; failure can appear as empty.
    export_error: Discarded; failure can appear as empty.
  design_rule: >-
    Design independent endpoint, event, and export unavailable states and mark
    per-source runtime isolation as an implementation gap. Never depict a
    failed read as verified empty or healthy.
  empty_truth:
    - Verified empty requires a successful source read with zero RLS-visible rows.
    - RLS-hidden, failed, not configured, dependency-blocked, degraded, and empty are distinct.
    - Record status is reproduced exactly and never promoted to health.
  contradiction:
    - Conflicting endpoint status and event/export outcomes remain unresolved.
    - Do not auto-reconcile, infer connectivity, or overwrite record truth.

audit_and_concurrency:
  audit:
    page_mutations: none
    api_events: Append-only evidence, not a page action audit.
    export_jobs: Read-only status on this page.
    rule: Do not claim that merely viewing the page creates an audit event.
  concurrency:
    page_writes: none
    read_snapshot_consistency: not_evidenced_across_three_parallel_queries
    conflict_state: >-
      If registry, events, and exports disagree, show the observation times and
      unresolved contradiction. Do not claim a transactionally consistent
      snapshot or silently synthesize one.

