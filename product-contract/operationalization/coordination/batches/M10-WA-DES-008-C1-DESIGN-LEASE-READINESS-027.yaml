data_contract:
  endpoint_registry:
    table: mvp3_integration_endpoints
    selected_fields:
      - endpoint_key
      - display_name
      - endpoint_kind
      - contract_version
      - status
      - updated_at
    displayed_fields:
      - display_name
      - endpoint_key
      - endpoint_kind
      - contract_version
      - status
    status_vocabulary:
      - dependency_blocked
      - disabled
      - configured
      - degraded
    truth_rule: >-
      Configured requires a non-empty runtime address and database contract
      invariant, but remains configuration truth rather than connectivity or
      health.
  api_events:
    table: mvp3_api_events
    selected_fields:
      - event_kind
      - direction
      - outcome
      - correlation_id
      - occurred_at
    displayed_fields:
      - event_kind
      - direction
      - outcome
    status_vocabulary:
      - accepted
      - rejected
      - blocked
      - failed
      - delivered
    immutability: Append-only trigger blocks update and delete.
  export_jobs:
    table: mvp3_export_jobs
    selected_fields:
      - export_kind
      - purpose
      - status
      - artifact_hash
      - requested_at
      - completed_at
    displayed_fields:
      - export_kind
      - purpose
      - status
    status_vocabulary:
      - prepared
      - dependency_blocked
      - queued
      - delivered
      - failed
      - cancelled
    delivery_invariant: Delivered requires artifact_hash and completed_at at database level.
    receipt_gap: Receipt is not selected or displayed; the current page cannot prove receipt truth.
  secret_boundary:
    prohibited:
      - base_url
      - configuration
      - tokens
      - credentials
      - certificates
      - secret material

permission_contract:
  route_shell:
    authentication: Authenticated application layout
    field_only_persona: Redirected from web portal
    route_specific_AdminRouteBoundary: absent
    rule: The design must not invent a route-level Integration Admin permission.
  table_RLS:
    endpoint_registry:
      visible_to: [security_admin, workflow_admin]
    api_events:
      visible_to: [security_admin, ops, auditor]
    export_jobs:
      visible_to:
        - requesting_user
        - security_admin
        - auditor
        - leadership
  permission_implications:
    - A user may legitimately see one section and not another.
    - RLS-empty is not global empty.
    - One table's visibility never grants another table's visibility.
    - Unauthorized or field-only users must not receive registry, event, export, correlation, or hash details.

