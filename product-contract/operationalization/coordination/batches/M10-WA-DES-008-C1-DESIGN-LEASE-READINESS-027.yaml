p0_return_gates:
  - id: P0-IDENTITY
    return_if: Route, design identity, revision, filename, or predecessor lineage differs.
  - id: P0-CAPABILITY
    return_if: A credential, provider test, endpoint mutation, retry, replay, webhook, sync, import, or export action is added.
  - id: P0-PROVIDER
    return_if: A provider is called connected, live, healthy, scheduled, late, successful, or failing without a returned record and approved contract.
  - id: P0-METRIC
    return_if: Count, latency, uptime, delivery rate, freshness, last-event time, schedule, or health is fabricated.
  - id: P0-SECRET
    return_if: Base URL, configuration, token, credential, certificate, or secret is displayed.
  - id: P0-PERMISSION
    return_if: Technical Admin or one global Admin persona replaces table-specific RLS truth.
  - id: P0-CONFIDENTIALITY
    return_if: Denied personas receive registry, event, correlation, export, hash, or provider detail.
  - id: P0-ERROR
    return_if: Event/export read failure is represented as verified empty or healthy.
  - id: P0-EXPORT
    return_if: Prepared is shown delivered, or delivered receipt is claimed without receipt evidence.
  - id: P0-CONCURRENCY
    return_if: Three parallel reads are called one transactionally consistent snapshot or contradictions are auto-reconciled.
  - id: P0-HOLD
    return_if: Any MVP3 provider/policy hold is presented as resolved.
  - id: P0-SCOPE
    return_if: Factory Data, Senaei Admin, Platform Operations, or Spatial Canvas behavior is embedded in this route.
  - id: P0-TRACEABILITY
    return_if: The page claims all 478 requirements or more than the exact 14 transferred rows.
  - id: P0-TEST
    return_if: A failed required test or missing evidence is hidden or converted into completion.

p1_return_gates:
  - id: P1-HISTORY
    return_if: Endpoint inventory or recent event/export rows are presented as complete without count/pagination proof.
  - id: P1-RESPONSIVE
    return_if: Any required viewport clips, overlaps, hides a task, scrolls the page horizontally, or exposes peeking navigation.
  - id: P1-RTL
    return_if: Arabic is untranslated, directionally broken, or corrupts keys, versions, correlations, hashes, or statuses.
  - id: P1-THEME
    return_if: Light/dark surfaces, text, focus, statuses, warnings, unavailable, or RLS-hidden states lack contrast.
  - id: P1-A11Y
    return_if: Headings, table/record semantics, focus, targets, names, announcements, or full identifier access is missing.
  - id: P1-TRUTH
    return_if: Machine status, reader label, observation time, and source-specific limitation are ambiguous.
  - id: P1-EVIDENCE
    return_if: Fingerprint, visual matrix, state index, annotations, gap register, test status, or predecessor comparison is absent.

