responsive_matrix:
  viewports:
    - 1440x900
    - 1160x820
    - 1024x768
    - 768x1024
    - 412x915
    - 390x844
    - 320x568
  desktop: Registry leads; event and export evidence sit below without dashboard-health framing.
  tablet: Registry and evidence panels stack without clipped IDs, versions, purposes, statuses, or timestamps.
  mobile: Single-column order; Factory Data link remains reachable; no peeking submenu icons.
  minimum_reflow: No task loss, overlap, clipping, or two-dimensional page scroll.
  table_rule: Reflow to labelled records or a named horizontal region with preserved header semantics.

language_bidi_theme:
  locales:
    - {locale: en, direction: ltr}
    - {locale: ar, direction: rtl}
  bidi_rules:
    - Use logical layout and mirror directional structure.
    - Isolate endpoint keys, contract versions, correlation IDs, hashes, and machine statuses as LTR.
    - Localize truth, permission, empty, unavailable, degraded, conflict, and recovery copy.
    - Require qualified native-Arabic review before acceptance.
  themes: [light, dark]
  theme_evidence:
    - shell, truth banner, registry, evidence panels, table/card surfaces, statuses, links, and focus
    - body, heading, caption, disabled, error, warning, unavailable, and RLS-hidden contrast
    - status differentiation using text, shape, and icon rather than color alone

accessibility_contract:
  structure:
    - One h1 and ordered section headings.
    - Programmatic table headers or labelled record semantics.
    - Unique accessible names for Factory Data link and any expandable row detail.
  keyboard:
    - Logical LTR and RTL focus order.
    - Visible single focus treatment in both themes.
    - Forty-four-pixel minimum interactive targets.
    - Registry, event, export detail, pagination placeholder, and Factory Data link are keyboard reachable.
  announcements:
    - source unavailable
    - partial visibility
    - verified empty
    - conflicting truth
    - test failure
  content:
    - Long IDs and versions wrap or truncate with accessible full value.
    - Status is not color-only.
    - Machine status and reader-facing label remain distinguishable.
  zoom_reflow:
    - Prove 200 percent zoom.
    - Prove 400 percent or 320 CSS-pixel equivalent reflow.

test_and_evidence_contract:
  existing_strength:
    - Additive MVP3 schema, RLS, append-only events, fail-closed dependency states, and export database invariant exist.
    - Live route smoke and negative persona containment exist in broader suites.
    - Selected Arabic RTL mobile and theme switching are exercised.
  missing:
    - Focused independent endpoint/event/export read-error isolation.
    - Table-specific persona matrix for partial visibility.
    - Proof that configured status is never presented as live health.
    - Record-detail accessibility and correlation/hash handling.
    - Endpoint completeness, recent-history labeling, pagination, and totals.
    - Cross-query contradiction and observation-time behavior.
    - Tablet, 320px, keyboard-only, zoom, and complete light/dark visual evidence.
    - Qualified native-Arabic review.
  design_return:
    - Corrected editable export under the stable filename.
    - Export byte size, SHA-256, viewport inventory, and predecessor lineage.
    - Predecessor comparison proving removal of fabricated provider-health cards and metrics.
    - Component, data, RLS, state, and source annotations.
    - Full permission, hold, pagination, error, conflict, responsive, theme, RTL, accessibility, and test-status matrices.
  runtime_later_not_authorized_here:
    - Security/workflow endpoint visibility.
    - Security/ops/auditor event visibility.
    - Requester/security/auditor/leadership export visibility.
    - Partial visibility and denied-persona non-leakage.
    - Independent source failures preserving healthy panels.
    - Verified-empty versus unavailable versus RLS-hidden.
    - Prepared versus delivered and receipt-unproven states.
    - No secret/base-url/configuration leakage.
    - All responsive, bilingual, theme, keyboard, zoom, and accessibility checks.
    - Required focused and protected suites with zero unexplained failure.

