  reason: >-
    The route and configuration components exist, and several settings are
    consumed by execution journeys, but the screen is outside the authenticated
    application shell, table-write authorization can bypass the capability and
    validation boundary, form_admin can receive a false success after a
    row-level-security no-op, audit is not an atomic scoped event, concurrent
    edits can overwrite one another, several settings have no proven runtime
    consumer, no governed screen identity exists, and the corrective Claude
    Design successor has not been created or accepted.

