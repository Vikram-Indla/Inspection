approved_policy_interpretation:
  D_004:
    authority: Direct-but-audited engine_settings administration is approved.
    maker_checker: NOT_REQUIRED_BY_APPROVED_DECISION
    reviewer_position: >-
      This review does not invent a maker-checker requirement. It requires the
      approved direct path to be capability-bound, validated, atomic, auditable
      and concurrency-safe.
  D_005:
    authority: Offline overrides may remain unset and use the platform default.
    reviewer_position: >-
      Unset values are valid. If an override is set, the consuming runtime must
      demonstrably use it and disclose the effective source.

authorization_and_mutation_boundary:
  page_capabilities:
    checked:
      - admin.execution_capacity
      - admin.execution_modes
      - admin.execution_reasons
      - admin.execution_gis
      - admin.execution_evidence_offline
    provider: apps/web/src/lib/execution/capabilities.ts
  route_level_failure:
    - anonymous requests are not redirected
    - provider errors are collapsed into denial
    - the unauthenticated route does not inherit Admin shell identity or navigation
  raw_json_disclosure:
    behavior: >-
      Possession of any one execution capability causes RawJsonDetails to render
      every fetched engine row, including when the only direct grant is the
      lookup capability and no governed form section is shown.
    validation: FAIL_LEAST_PRIVILEGE
  default_role_mapping:
    roles:
      - compliance_admin
      - form_admin
      - workflow_admin
      - risk_owner
      - gis_admin
      - security_admin
    behavior: all five Admin capabilities are assigned to every listed role
    validation: OVERBROAD_DEFAULT_CAPABILITY_MAPPING
  table_RLS:
    engine_write_roles:
      - risk_owner
      - gis_admin
      - compliance_admin
      - workflow_admin
      - security_admin
    omitted_role_with_default_capabilities: form_admin
    validation: CAPABILITY_RLS_MISMATCH
  false_success_path:
    sequence:
      - form_admin passes application capability check
      - row-level security can reduce UPDATE to zero affected rows
      - action does not request or verify the updated row count
      - action continues to audit attempt and can return ok true
      - UI displays saved and effective immediately
    validation: FAIL_CRITICAL
  bypass_path:
    behavior: >-
      Eligible engine_write roles can update engine_settings directly, outside
      the server actions, bypassing per-capability checks, governed-key
      restrictions, protected reason-key rules, payload validation, the
      self-assessment release gate and version-label convention.
    validation: FAIL_NON_BYPASSABLE_POLICY_BOUNDARY

audit_version_and_concurrency:
  application_action:
    pattern: read current JSON, merge governed keys, update full row, insert audit separately
    transaction: none
    affected_row_verification: none
    expected_version_predicate: none
    returned_persisted_version: none
  database_trigger:
    available: true
    behavior: generic full-row before/after audit on successful engine_settings update
    strength: a successful direct row update receives a database-trigger audit
    limitation: not the scoped execution_config_update event claimed by the action
  manual_scoped_audit:
    policy_or_grant_proving_authenticated_insert: not found
    failure_behavior: logged but does not fail the configuration write
    validation: UNPROVEN_AND_NON_ATOMIC
  concurrency:
    failure_mode: >-
      Two administrators can read the same settings object and then write full
      merged rows. A later writer can overwrite the earlier writer's same-section
      or unrelated-section update without a stale-version conflict.
    immutable_version_history: absent
    compare_or_rollback: absent
    validation: FAIL_LOST_UPDATE_PROTECTION
  UI_claim:
    text: saved — effective immediately
    issue: >-
      The claim can appear after a zero-row update and after scoped-audit failure;
      no persisted version is returned to substantiate it.
    validation: FALSE_SUCCESS_AND_UNSUPPORTED_EFFECTIVE_STATE

section_runtime_wiring:
  capacity:
    authored_key: daily_visit_cap
    consumer_found: capacity and execution scheduling RPC paths
    fallback_found: 10
    validation: PARTIALLY_WIRED_WITH_FALLBACK
  visit_modes:
    authored_keys:
      - physical_enabled
      - virtual_enabled
      - virtual_requires_otp
      - virtual_appointment_required
      - self_assessment_release
    consumers_found: preparation and field journeys
    dependency_validation_missing:
      - both physical and virtual can be disabled
      - virtual subordinate controls can remain enabled when virtual is disabled
    validation: WIRED_BUT_POLICY_DEPENDENCIES_INCOMPLETE
  reasons:
    authored_keys:
      - cancellation_reasons
      - geo_override_reasons
    consumers_found: execution runtime RPCs and pages
    protected_reason_guard: present in action
    direct_table_bypass: present
    validation: WIRED_BUT_BYPASSABLE
  gis:
    authored_keys:
      - gps_accuracy_threshold_m
      - geofence_radius_m
      - arrival_radius_m
      - telemetry_interval_s
    consumers_found: execution and location runtime paths
    runtime_fallbacks_found: [25, 150, 200, 30]
    validation: PARTIALLY_WIRED_WITH_MULTIPLE_EFFECTIVE_SOURCES
  evidence:
    authored_controls:
      - allowed formats
      - maximum size
      - duration
      - retention years
    proven_execution_consumer: false
    implication: >-
      The route can save a policy whose enforcement and retention behavior are
      not demonstrated by the inspected runtime.
    validation: INSUFFICIENT_RUNTIME_EVIDENCE
  offline:
    authored_keys:
      - max_sync_attempts
      - autosave_interval_s
    runtime_consumer_found: false
    unset_platform_default_per_D005: allowed
    set_override_effect: no effect proven
    validation: NOT_WIRED_WHEN_CONFIGURED

validation_and_safety:
  strengths:
    - server actions verify a user and section capability
    - each action parses and limits its intended governed keys
    - reason keys receive protected-key checks
    - evidence types preserve extra existing fields
    - labels and control names are generally present
  gaps:
    - full direct table updates bypass every application validator
    - visit modes permit a no-execution-mode configuration
    - subordinate virtual settings are not normalized or rejected
    - evidence formats accept arbitrary lowercased strings without a governed vocabulary
    - GIS values have no accepted business range contract
    - no impact preview or dependent-consumer warning
  policy_boundary: >-
    Do not invent upper bounds, formats, defaults or dependencies. Resolve them
    through exact requirement/design acceptance where the source contract is
    silent.
  validation: INCOMPLETE_AND_BYPASSABLE

hard_states_localization_and_accessibility:
  loading_route: absent
  error_route: absent
  permission_provider_failure: falsely rendered as no access
  engine_read_failure: logged then rendered like absent configuration
  empty_and_not_configured: partially represented
  conflict_or_stale_state: absent
  retry: absent
  localization:
    page_content: mostly translated
    hardcoded_English:
      - Raw JSON (advanced)
      - server action error strings
    LTR_isolation_for_keys_units_and_versions: inconsistent
    validation: FAIL_COMPLETE_EN_AR_PARITY
  accessibility:
    strengths:
      - labels and aria-labels exist for most controls
      - validation messages commonly use role alert
      - pending actions disable submit
    gaps:
      - success messages are not consistently live status regions
      - no focus transfer to validation, failure or success
      - no keyboard or screen-reader runtime evidence
  responsive_theme_and_wordmark:
    authenticated_shell_wordmark: absent
    English_wordmark_parity: absent
    RTL_LTR_visual_evidence: absent
    responsive_evidence: absent
    light_dark_evidence: absent
    validation: FAIL_VISUAL_AND_SHELL_EVIDENCE

test_and_evidence_review:
  focused_spec: apps/web/e2e/execution-admin-contract.spec.ts
  test_type: SOURCE_TEXT_CONTRACT_ONLY
  runtime_browser_proof: false
  unsupported_claim: every write is audited
  missing_proof:
    - unauthenticated redirect and unauthorized role denial
    - capability versus RLS role matrix
    - zero-row update must fail rather than report success
    - direct-table bypass denial
    - atomic scoped audit correlation
    - concurrent edit and stale-version conflict
    - each setting's real runtime consumer
    - invalid combinations and dependency guards
    - provider unavailable versus denied versus empty
    - EN/LTR and AR/RTL content parity
    - 1160, 1024, 412 or 390, and 320 layouts
    - light and dark visual comparison
    - keyboard, focus and screen-reader behavior
    - accepted WA-DES-003-C1 visual diff
  validation: INSUFFICIENT_EVIDENCE

