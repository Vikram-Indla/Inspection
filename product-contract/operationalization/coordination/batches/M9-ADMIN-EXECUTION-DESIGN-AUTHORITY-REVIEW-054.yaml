reviewer_recommendation:
  classification: RETURN_FOR_SECURITY_GOVERNANCE_MAPPING_AND_RUNTIME_WIRING_CORRECTION
  sponsor_decision: DO_NOT_CERTIFY_OR_COUNT_COMPLETE
  maker_checker_decision: NOT_REQUIRED_UNDER_D004
  bounded_next_actions:
    - "Place the route inside the authenticated Admin shell and define exact allowed personas."
    - "Assign a governed screen ID and exact section-level requirement and acceptance rows."
    - "Unify capability and database authorization so every authorized role writes and every unauthorized role is denied truthfully."
    - "Remove the direct-table bypass or enforce equivalent capability and validation controls inside the database mutation boundary."
    - "Make the update, scoped audit and persisted version one atomic operation and verify the affected row."
    - "Add expected-version conflict detection and immutable version/audit visibility."
    - "Prove and wire the runtime consumer for every editable evidence and offline value."
    - "Separate denied, provider unavailable, engine unavailable, empty and conflict states."
    - "Create and accept WA-DES-003-C1 with corrected shell, wordmark, navigation, states and governed values."
    - "Run functional, security, negative, concurrent, EN/AR, RTL/LTR, responsive, accessibility and visual evidence."

