validated_route:
  exists: true
  page: apps/web/src/app/(app)/admin/violations/page.tsx
  controls: apps/web/src/app/(app)/admin/violations/Controls.tsx
  actions: apps/web/src/app/(app)/admin/violations/actions.ts
  route_guard:
    file: apps/web/src/app/(app)/admin/violations/layout.tsx
    allowed_roles: [compliance_admin, reviewer]
    discrepancy: Page/actions/RLS also declare form_admin as writer, but the layout blocks form_admin.
  codex_validation: CONFIRMED_WITH_CORRECTION
  recommended_action: BLOCK
  reason: >-
    Violation and penalty catalogues, native version publication, immutable
    package snapshots, response-driven UI, action-form blockers, informational
    penalty notices and post-approval issuance are real. End-to-end authority
    is unsafe: governed request versions are disconnected; direct configuration
    writes bypass publication; runtime violation insert/invalidation trusts the
    inspector client; penalty successors can break pinned inspections; and
    package snapshots/resolvers mishandle versioned penalty rows.

configuration_authorities:
  violation_codes:
    table: public.violation_codes
    identity: unique(code, configuration_version)
    lineage: supersedes_id
    statuses: [draft, published, locked, deactivated]
    effective_window: [active_from, active_to]
    semantics:
      - title
      - level
      - clause_id
      - corrective_action
      - grace_period_days
      - category
      - applicability
    native_publish_RPC: public.publish_violation_code(uuid)
  penalty_mappings:
    table: public.penalty_mappings
    identity: unique(violation_code_id, mapping_version)
    cardinality:
      - one draft per violation version
      - one published/locked row per violation version
    lineage: supersedes_id
    effective_window: [effective_from, effective_to]
    semantics:
      - penalty_ref
      - penalty_type
      - amount
      - grace_period_days
      - due_period_days
      - legal_basis
      - penalty_range
      - repeat_rule
      - template_version_id
    native_publish_RPC: public.publish_penalty_mapping(uuid)
  governed_request_engine:
    entity_kinds: [violation, penalty]
    tables:
      - public.compliance_entity_versions
      - public.compliance_entity_heads
    operational_projection_to_legacy_tables: ABSENT
    consumed_by_package_or_runtime: false
  split_authority_verdict: P0_CONFIRMED

runtime_and_consumers:
  item_trigger:
    configuration: response_model.mapping[response].violation
    package_override: definition.item_rules[code].response_mapping
    frozen_source: package_versions.definition.item_snapshot
  package_publication:
    application_validation:
      - referenced violation is published/locked and date-active
      - violation has a published/locked penalty mapping
      - action-form key exists in package definition
    database_validation_gap: Full violation, penalty, template and action-form dependency parity is absent.
    frozen_outputs:
      - definition.violation_snapshot
      - package_version_dependency_snapshots violation rows
    nested_penalty_filter: ABSENT
    penalty_linked_template_snapshot: NOT_GUARANTEED
  field_execution:
    implication: impliedViolations derives candidates from frozen response mapping.
    persistence: Assigned inspector client inserts directly into public.violations.
    penalty_materialization: AFTER INSERT trigger reads live published/locked penalty mapping by violation ID and mapping_version.
    action_forms: Package action_forms plus response action_form key; blocking form completeness prevents submit in client/runtime calculations.
    invalidation: Assigned inspector directly updates invalidation fields; guard preserves immutable core columns.
  review_and_reporting:
    - review displays runtime violation code and mapping_version
    - report prefers immutable submission snapshot and inspection_penalties.mapping_snapshot
    - penalty notice changes informational to issued only after inspection approval
  enforcement_and_analytics:
    - enforcement reads runtime violations
    - Factory 360/history and dashboards consume violation rows

findings:
  - id: VIO-P0-001
    priority: P0
    finding: Governed Compliance Request violation/penalty versions are disconnected from operational authority.
    evidence: >-
      publish_compliance_request creates immutable compliance_entity_versions
      and heads, but does not project to violation_codes or penalty_mappings.
      Packages and Field continue to consume the legacy tables/snapshots.
    implication: Approved governed changes can be unused while legacy direct writes control execution.
  - id: VIO-P0-002
    priority: P0
    finding: Authorized direct configuration writes bypass publication and maker-checker.
    evidence: >-
      violation_codes_admin and penalty_mappings_admin are permissive FOR ALL
      policies. Guards constrain rows only after published/locked. A writer can
      INSERT status=published or directly change a draft to published with
      supplied actor fields, bypassing native RPC validation.
    implication: Unapproved violations/penalties can become package-eligible.
  - id: VIO-P0-003
    priority: P0
    finding: Runtime violation generation is not server-authoritative.
    evidence: >-
      violations_insert checks only that the caller is assigned to the
      inspection visit. The Workspace inserts inspection_id,
      violation_code_id and mapping_version directly. No database contract
      proves the frozen response implies that code or that mapping_version came
      from the pinned package.
    implication: An assigned inspector/direct client can add an arbitrary predefined violation or mapping version.
  - id: VIO-P0-004
    priority: P0
    finding: Runtime violation invalidation does not prove the triggering response changed.
    evidence: >-
      violations_invalidate and guard_violation_invalidate restrict core-column
      changes and submitted states, but accept caller-supplied invalidated_at,
      invalidated_by and reason without checking checklist response/frozen mapping
      or forcing invalidated_by=auth.uid.
    implication: An inspector can suppress a generated candidate outside the response transition.
  - id: VIO-P0-005
    priority: P0
    finding: Penalty successor publication can break existing pinned inspections.
    evidence: >-
      publish_penalty_mapping immediately deactivates the prior mapping.
      materialize_informational_penalty accepts only mappings whose current
      status is published/locked, even when a pinned package frozen the prior
      mapping_version. A later response in that existing inspection then fails.
    implication: Later configuration changes affect active inspections, violating runtime locking.
  - id: VIO-P0-006
    priority: P0
    finding: Future-effective violation and penalty successors are activated incorrectly.
    evidence: >-
      Native publish immediately deactivates the predecessor and marks the
      future row published. Package application validation checks violation
      dates but does not check penalty effective_from/to. Penalty materialization
      also ignores effective dates.
    implication: There can be an availability gap for violations and premature use of a future penalty.
  - id: VIO-P0-007
    priority: P0
    finding: Frozen violation snapshots include unfiltered penalty-version arrays.
    evidence: >-
      freezeDefinition embeds penalty_mappings without a nested status/effective
      filter. Field treats any array length greater than one as a conflict and
      nulls mapping_version. Versioned history therefore appears as a false
      singularity conflict.
    implication: Publishing a penalty successor can disable valid violation generation in new or existing packages.
  - id: VIO-P0-008
    priority: P0
    finding: Deactivation guards permit changes to omitted authority fields.
    evidence: >-
      The violation deactivation exception does not compare clause_id,
      active_from, created/approved/published actors/times or supersedes_id.
      The penalty exception omits effective_from and actor/lineage fields.
    implication: A direct writer can rewrite legal anchor, effective origin or approval lineage during an allowed deactivation.
  - id: VIO-P0-009
    priority: P0
    finding: Package database publication does not fully validate violation/penalty/template/action-form dependencies.
    evidence: >-
      Application validateDefinition checks these dependencies, but the database
      relationship trigger primarily validates item and item_snapshot semantics.
      Direct publish RPC callers can supply a definition that bypasses page checks.
    implication: A package can publish without a valid violation/penalty/action-form chain.
  - id: VIO-P0-010
    priority: P0
    finding: Linked penalty template is not guaranteed to be frozen or consumed.
    evidence: >-
      penalty_mappings.template_version_id is stored, but freezeDefinition
      snapshots templates only from package template_refs/action_forms, not
      automatically from penalty mappings. Runtime/report surfaces use penalty
      metadata and mapping_snapshot but no proven rendering of that linked template.
    implication: REQ-R0C-01119 linked-template behavior is not end-to-end proven.
  - id: VIO-P1-001
    priority: P1
    finding: Draft violation editing and deterministic successor numbering are absent.
    evidence: >-
      The route creates a draft with user-entered configuration_version but
      exposes no edit action. Publish does not require the next consecutive
      version or expected predecessor.
    implication: Corrections require direct writes and lineage can skip/rebase silently.
  - id: VIO-P1-002
    priority: P1
    finding: Main lifecycle chip can label a draft as active.
    evidence: deriveLifecycle uses only active_from/active_to and ignores stored status.
    implication: A non-published draft with a current date is visually presented as active authority.
  - id: VIO-P1-003
    priority: P1
    finding: Violation usage/trigger impact is incomplete and internally inconsistent.
    evidence: >-
      violation_code_usage counts only response_model.mapping.non_compliant,
      while the UI trace scans every response mapping. Neither includes package
      overrides, exact package versions, action forms, future visits or pinned inspections.
    implication: Change/deactivation blast radius is understated.
  - id: VIO-P1-004
    priority: P1
    finding: Route and data writer roles disagree.
    evidence: layout allows compliance_admin/reviewer; actions/RLS/copy allow form_admin.
    implication: form_admin can mutate by API but cannot use the route.
  - id: VIO-P1-005
    priority: P1
    finding: Draft concurrency controls are absent.
    evidence: No expected revision/CAS exists for violation or penalty draft authoring.
    implication: Concurrent changes can overwrite/rebase without a stable conflict.
  - id: VIO-P1-006
    priority: P1
    finding: Configuration and runtime reads are globally authenticated.
    evidence: violation_codes, penalty_mappings, runtime violations and inspection_penalties have broad authenticated reads.
    implication: Personas outside the route can inspect compliance and penalty data.
  - id: VIO-P1-007
    priority: P1
    finding: Existing evidence does not test adversarial actor/runtime/version transitions.
    evidence: >-
      Current browser tests prove rendering and source tokens; SQL coverage
      proves selected happy paths. No test attempts writer direct publish,
      arbitrary assigned-inspector insert/invalidation, historical mapping
      materialization, future penalty use or linked-template runtime rendering.
    implication: P0 gaps can pass the current suite.

