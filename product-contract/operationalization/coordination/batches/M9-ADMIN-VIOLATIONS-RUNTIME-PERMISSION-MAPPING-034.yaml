  evidence_rule: Browser screenshots and source assertions cannot close RLS bypass, pinned-history, generation/invalidation or dependency gaps.

p0_prerequisites:
  - Select one operational violation/penalty authority and project governed request versions transactionally.
  - Revoke direct lifecycle/approval writes and narrow all state changes to actor-bound RPCs.
  - Create server-authoritative generate/invalidate transitions derived from frozen response and package version.
  - Resolve penalty by pinned frozen mapping identity/snapshot, not current live status.
  - Introduce approved-future/active/superseded states and a shared effective resolver.
  - Freeze exactly one effective penalty and its linked template for each referenced violation.
  - Enforce full package violation/penalty/template/action-form dependency validation in the database transaction.
  - Close deactivation-field immutability and require exact impact/checker consent.

decision:
  implementation_ready: false
  lease_ready: false
  verdict: CONFIRMED_WITH_CORRECTION
  recommended_action: BLOCK
  recommended_sponsor_action: >-
    Preserve current UI and immutable inspection_penalty snapshots, but do not
    approve Violation/Penalty Management completion. First approve one
    authority, server-owned runtime transitions, effective-time, pinned mapping,
    linked-template and permission contracts; then lease database governance,
    package/runtime integration, accepted Design 052 UI and independent QA.

