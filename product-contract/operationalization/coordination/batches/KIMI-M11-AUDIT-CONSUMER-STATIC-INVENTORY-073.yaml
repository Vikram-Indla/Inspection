    source: supabase/migrations/0005_audit_absolute_immutability.sql
    rule: "UPDATE and DELETE are rejected; authenticated mutation privileges are revoked."
  read_roles:
    source:
      - supabase/migrations/0002_rbac_audit.sql
      - supabase/migrations/0019_w5_records.sql
    broad_roles:
      - auditor
      - ops
      - security_admin
      - leadership
      - reviewer
      - planner
    additional_role: compliance_admin

M11_event_producers:
  - producer_id: P-073-01
    path: supabase/migrations/0018_w4_notifications_reviews.sql
    mechanism: trg_audit_virtual_sessions
    object_type: virtual_sessions
    actions: [INSERT, UPDATE, DELETE]
    fields_written: [actor, object_type, object_id, action, before_state, after_state, occurred_at]
    observation: "Every row write is copied by audit_row_change."
  - producer_id: P-073-02
    path: supabase/migrations/0018_w4_notifications_reviews.sql
    mechanism: trg_audit_virtual_participants
    object_type: virtual_participants
    actions: [INSERT, UPDATE, DELETE]
    fields_written: [actor, object_type, object_id, action, before_state, after_state, occurred_at]
    observation: >-
      UPDATE snapshots include the full virtual_participants row, including
      verification_record.
  - producer_id: P-073-03
    path: supabase/migrations/0023_fix_otp_rpc_authorization.sql
    mechanism: vp_request_otp
    object_type: virtual_participants
    actions: [OTP_SENT]
    fields_written: [actor, object_type, object_id, action, after_state, occurred_at]
    observation: "Writes a reduced resend counter, in addition to the trigger-produced UPDATE row."
  - producer_id: P-073-04
    path: supabase/migrations/0023_fix_otp_rpc_authorization.sql
    mechanism: vp_verify_otp
    object_type: virtual_participants
    actions: [OTP_VERIFIED, OTP_FAILED]
    fields_written: [actor, object_type, object_id, action, after_state, occurred_at]
    observation: "Writes reduced attempt counters, in addition to the trigger-produced UPDATE row."
  - producer_id: P-073-05
    paths:
      - apps/web/src/app/(app)/virtual/actions.ts
      - supabase/migrations/0018_w4_notifications_reviews.sql
    mechanism: "virtual row writes plus vs_append_event"
    object_types: [virtual_sessions, virtual_participants]
    actions:
      - INSERT
      - UPDATE
      - DELETE
    timeline_events:
      - scheduled
      - rescheduled
      - waiting_opened
      - joined
      - verified
      - begin
      - closed
    observation: >-
      The application also maintains virtual_sessions.timeline. That JSON
      timeline is a parallel presentation source; its write causes an immutable
      audit_events UPDATE row but it is not itself the audit_events store.

consumer_inventory:
  - consumer_id: C-073-01
    kind: DATABASE_READ_SEAM
    path: supabase/migrations/20260715190000_cd042_audit_read_seam.sql
    component: vs_audit_trail
    direct_M11_consumer: true
    scope: "one virtual session row plus its participant rows"
    personas:
      - ops
      - reviewer
      - auditor
      - compliance_admin
      - planner
      - assigned_inspector
    required_fields:
      - occurred_at
      - action
      - object_type
      - object_id
      - actor
      - after_state
    returned_shape:
      - at
      - action
      - object_type
      - object_id
      - actor
      - detail
    status: PRESENT_UNSAFE_DETAIL
    gap: >-
      detail is the unredacted after_state. Trigger-produced participant UPDATE
      rows can therefore expose verification_record, including code_hash,
      expiry, counters and provider text, through a SECURITY DEFINER function.
  - consumer_id: C-073-02
    kind: PRODUCT_UI
    path: apps/web/src/app/(app)/virtual/[id]/page.tsx
    component: VirtualRoom
    direct_M11_consumer: false
    consumed_source: virtual_sessions.timeline
    required_fields:
      - event
      - at
      - actor
      - detail.participant
      - detail.reason
      - detail.appointment_at
    status: PARALLEL_TIMELINE_ONLY
    gap: >-
      The route never calls vs_audit_trail and therefore does not render the
      immutable audit_events stream. It cannot show OTP_SENT, OTP_FAILED or
      OTP_VERIFIED audit rows, and it does not prove reviewer-facing complete
      meeting audit availability.
  - consumer_id: C-073-03
    kind: PRODUCT_UI
    path: apps/web/src/app/(app)/virtual/[id]/Room.tsx
    component: Room
    direct_M11_consumer: false
    consumed_sources:
