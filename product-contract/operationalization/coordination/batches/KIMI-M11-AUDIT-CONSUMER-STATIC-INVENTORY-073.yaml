evidence_gaps:
  - "No runtime capture of vs_audit_trail output for all authorized personas."
  - "No negative proof that unassigned inspector, unrelated staff and anonymous callers cannot read a session."
  - "No assertion that code_hash and the full verification_record are absent from every consumer."
  - "No complete event-set proof for creation, joins by both roles, verification, begin, cancellation/close and operational updates."
  - "No leave/disconnect/reconnect evidence because no provider event contract is implemented."
  - "No reviewer UI screenshot or browser evidence for a complete audit timeline."
  - "No ordering, duplicate-event, empty-history, high-volume or deletion-history test."
  - "No catalog reconciliation that adds vs_audit_trail to EP-058."

