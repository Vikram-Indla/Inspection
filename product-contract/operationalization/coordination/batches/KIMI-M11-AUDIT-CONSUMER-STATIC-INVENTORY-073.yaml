required_event_field_crosswalk:
  - requirement: CR-343
    needed_business_facts:
      - session creation
      - cancellation
      - operational state updates
    current_sources:
      - "virtual_sessions INSERT/UPDATE audit snapshots"
      - "virtual_sessions.timeline events"
    missing_or_ambiguous:
      - "No normalized event taxonomy links raw UPDATE rows to the required business facts."
      - "No application audit_events consumer displays the immutable facts."
  - requirement: CR-346
    needed_business_facts:
      - inspector join time
      - factory representative join time
    current_sources:
      - virtual_participants.joined_at
      - "virtual_participants UPDATE audit snapshot"
      - "virtual_sessions.timeline joined event"
    missing_or_ambiguous:
      - "No proof that both required roles receive separate joins."
      - "No reviewer-facing immutable join audit consumer."
  - requirement: CR-347
    needed_business_facts:
      - connected
      - disconnected
      - reconnected
      - session end
    current_sources:
      - "session close can be inferred from virtual_sessions UPDATE/timeline"
    missing_or_ambiguous:
      - "No provider callback contract or stored disconnected/reconnected events."
  - requirement: CR-348
    needed_business_facts:
      - join
      - leave
      - disconnect
      - reconnect
      - reviewer-visible complete audit timeline
    current_sources:
      - vs_audit_trail
      - virtual_sessions.timeline
    missing_or_ambiguous:
      - "No leave/disconnect/reconnect producers."
      - "No reviewer UI wired to vs_audit_trail."
      - "No complete-history bounds or pagination contract."
  - requirement: CR-353
    needed_business_facts:
      - verification time
      - verification method
      - representative details
    current_sources:
      - virtual_participants.verified_at
      - virtual_participants.verification_record
      - OTP_VERIFIED reduced audit event
    missing_or_ambiguous:
      - "The reduced event omits representative details and method."
      - "The raw trigger event contains excess sensitive material."
      - "No approved safe reviewer projection is defined."

security_findings:
  - finding_id: F-073-01
    severity: P0_BLOCKER
    title: "Safe seam returns raw participant verification_record"
    evidence:
      - "audit_row_change serializes the complete virtual_participants row."
      - "verification_record contains code_hash, expires_at, attempts, resends, last_sent_at and provider."
      - "vs_audit_trail returns after_state unchanged as detail."
      - "The SECURITY DEFINER seam is callable by the assigned inspector and listed staff roles."
    implication: >-
      The seam intended to avoid broad audit-table access can disclose the very
      OTP verification material that vp_otp_status deliberately redacts.
    disposition: BLOCK_DUE_TO_MISSING_REDACTION_CONTRACT
  - finding_id: F-073-02
    severity: P0_BLOCKER
    title: "Global audit UI renders raw before/after state"
    evidence:
      - "Admin audit selects before_state and after_state without M11 redaction."
      - "Virtual participant audit triggers serialize verification_record."
    implication: "Broad audit readers may receive unnecessary OTP-derived sensitive state."
    disposition: BLOCK_DUE_TO_MISSING_REDACTION_CONTRACT
  - finding_id: F-073-03
    severity: P1
    title: "One OTP action produces two audit records with different shapes"
    evidence:
      - "The participant UPDATE trigger writes a raw UPDATE event."
      - "The OTP RPC separately writes OTP_SENT, OTP_VERIFIED or OTP_FAILED."
    implication: >-
      Consumers need an approved deduplication/presentation rule; otherwise
      one business action can appear twice and counts can be misleading.
    disposition: RETURN_FOR_EVENT_PRESENTATION_CONTRACT

