    rule: Accepted authority or executed runtime outcome exists and is bound to exact immutable evidence.
    prohibition: Planning, source inspection, mock, seed, screenshot-only proof, an approval statement without required fields or a queued remote command cannot be green.
  AMBER:
    rule: Required plan/schema/map is complete, but execution or acceptance remains blocked by named dependencies.
  RED:
    rule: Required authority/runtime/evidence is absent, contradicted or known unsafe.
  GREY:
    rule: Not yet applicable because a preceding gate has not opened.

