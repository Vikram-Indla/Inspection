    authenticated_AppShell: true
    route_specific_role_boundary: false
    route_specific_error_boundary: false
    validation: CONFIRMED_REAL_ROUTE_WITH_ADMISSION_AND_ERROR_GAPS
  real_capability:
    - count RLS-visible user-role holdings
    - list RLS-visible access review records
    - derive open and overdue review counts at server-render time
    - record retain or revoke as the status of an eligible open review
    - list RLS-visible purpose-bound evidence grants
    - derive active, expired or revoked grant display state
  absent_capability:
    - revoke or retain an underlying role, capability, evidence grant or session
    - identify an exact entitlement object from the free-text review scope
    - grant creation, extension, revocation or renewal
    - user or role administration
    - effective-permission computation
    - immutable privacy/access audit timeline
    - SSO, MFA, identity-provider or tenant administration
    - retention, purge, legal-hold, backup or restore execution
  functional_implication: >-
    Choosing Revoke records a review outcome only. The RPC does not delete a
    user role, revoke an evidence grant, end a session or enqueue a governed
    remediation. The current design and label can therefore imply access was
    removed when no entitlement changes.
  validation: CONFIRMED_REVIEW_REGISTER_BUT_NOT_END_TO_END_ACCESS_ENFORCEMENT

