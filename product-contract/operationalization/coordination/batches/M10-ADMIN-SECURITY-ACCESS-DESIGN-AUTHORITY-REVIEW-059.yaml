permissions_and_persona_truth:
  shared_channel_gate:
    field_only: redirected away
    other_authenticated_non_field: route admitted
    failure_mode: role lookup fails open to the AppShell
  navigation_visible_roles: [security_admin]
  source_visibility:
    access_reviews:
      - subject_user_id_self
      - security_admin
      - auditor
    evidence_grants:
      - grantee_user_id_self
      - security_admin
      - auditor
    user_role_holdings:
      - self
      - planner
      - ops
      - security_admin
      - reviewer
      - auditor
      - compliance_admin
  action_authority:
    decide_access_review: [security_admin]
    subject_self_decision: denied
    opener_self_decision: allowed_if_opener_is_not_subject
  rendered_action_defects:
    - Auditor receives a decision form on every visible open review but the RPC denies submission.
    - A review subject receives a decision form on their own open review but the RPC denies submission.
    - Other non-security readers can receive the form whenever RLS exposes an open row.
    - The page does not query the actor identity or role and cannot hide ineligible actions.
    - The page does not show why a read-only actor lacks the action.
  maker_checker_proof:
    subject_vs_decider_separation: true
    opener_vs_decider_separation: false
    live_probe_behavior: The same Security Admin opens and decides the synthetic review.
    design_label: Independent decision
    validation: FALSE_FULL_MAKER_CHECKER_CLAIM
  required_design_rule: >-
    Represent route admission, navigation, source visibility, action authority
    and subject/opener separation separately. Never discover ordinary
    ineligibility by submitting a control that the user should not receive.

source_truth_freshness_and_privacy:
  access_reviews:
    query_error_captured: true
    failure_copy: MVP3 database contract is not applied in this environment.
    defect: Copy invents a schema diagnosis for permission, network or dependency failures.
  evidence_grants:
    query_error_captured: false
    failure_result: zero_active_and_empty_list
    defect: Failed or inaccessible source is indistinguishable from verified zero.
  role_holdings:
    query_error_captured: false
    failure_result: zero
    defect: Failed role query is indistinguishable from no RLS-visible holdings.
  completeness:
    explicit_limit_or_pagination: false
    exact_total_for_reviews_or_grants: false
    service_row_cap_disclosed: false
    validation: COMPLETENESS_UNKNOWN
  freshness:
    active_and_overdue_clock: server_render_time
    displayed_as_of: false
    timezone_or_locale_contract: absent
    validation: STALE_OR_LOCALE_DEPENDENT_DERIVATION_UNDISCLOSED
  privacy_and_evidence_scope:
    identifiers: subject and grantee UUIDs are shown
    evidence_scope_stored: true
    evidence_scope_selected_or_shown: false
    grant_actor_stored: granted_by
    grant_actor_selected_or_shown: false
    grant_dates_selected: [granted_at, expires_at, revoked_at]
    grant_dates_shown: []
    contradiction: Copy says every grant has purpose and expiry but expiry is not visible.
    validation: FAIL_PURPOSE_SCOPE_EXPIRY_ACTOR_EVIDENCE

review_workflow_audit_and_concurrency:
  decision_contract:
    allowed_decisions: [retain, revoke]
    required_reason: at least eight trimmed characters
    role_guard: security_admin
    row_lock: true
    state_guard: review must still be open
    subject_guard: subject cannot decide own review
    stored_result: [status, reviewed_by, review_reason, reviewed_at]
  implementation_strengths:
    - Server validation repeats client validation.
    - Row lock and open-state predicate prevent a second successful decision.
    - Successful action revalidates the route.
    - Pending submission disables its button.
  implementation_gaps:
    - opened_by is not compared with reviewed_by
    - review row has no entitlement object type or ID
    - revoke does not mutate or enqueue remediation for an entitlement
    - retain does not renew an expiring evidence grant
    - closed rows hide reviewed_by and review_reason
    - reviewed_at is selected but not displayed
    - due_at is displayed even after the decision instead of decision evidence
    - no immutable audit event with before/after, actor, object, reason and timestamp
    - no stale-conflict recovery copy or preserved-input proof
    - raw RPC error.message is returned to the client
    - success copy claims actor/timestamp storage without displaying retrievable proof
  status_semantics:
    behavior: Every non-open review uses a success lozenge.
    defect: revoke and expired states are visually classified as success.
  validation: FAIL_END_TO_END_ENFORCEMENT_MAKER_CHECKER_AUDIT_AND_EVIDENCE

localization_responsive_theme_and_accessibility:
  localization:
    translated_route_labels: present
    hard_coded_English:
      - Working…
      - Select a decision and provide a meaningful reason.
      - Access review decision recorded with actor and timestamp.
      - raw RPC error messages
    untranslated_data:
      - scope
      - purpose
      - stored status
    date_rendering: server-default toLocaleDateString without explicit app locale
    mixed_identifier_isolation:
      UUIDs: bdi present
      scope_role_and_date_codes: not systematically isolated
    design_wordmark:
      English_LTR: Arabic صقيل صناعي
      validation: FAIL_SEMANTIC_IDENTITY
    validation: PARTIAL_NOT_EQUIVALENT_ARABIC_FLOW
  responsive:
    structural_support:
      - horizontally wrapped table
      - grant rows can wrap
    risks:
      - decision select, textarea and button inside a wide table cell
      - action may detach from subject/scope under horizontal scrolling
      - fixed 248px design rail has no explicit narrow breakpoint
    focused_route_evidence: absent
    required_viewports: [1440x900, 1200x900, 1024x768, 768x1024, 412x915, 390x844, 320x568]
    validation: INSUFFICIENT_EVIDENCE
  themes:
    design_modes: [light, dark]
    focused_runtime_matrix: absent
    validation: INSUFFICIENT_EVIDENCE
  accessibility:
    strengths:
      - semantic table with scoped headers
      - programmatic labels for decision and reason
      - pending button disable
      - action result status or alert
      - text accompanies status color
    gaps:
      - repeated Record decision names omit subject and scope
      - form has no concise reason hint or server-error field association
      - no confirmation or effect explanation for revoke
      - no deterministic focus recovery proof
      - no labelled-card alternative for narrow reflow
      - no keyboard, screen-reader, zoom, contrast or reduced-motion evidence
    validation: PARTIAL_IMPLEMENTATION_NO_ACCEPTANCE_EVIDENCE

design_versus_code_delta:
  parity:
    - route title and M3-00/CD-050 family badge
    - navigation-is-not-authorization message
    - three RLS-visible summary concepts
    - review queue and evidence-grant list
    - active, expired and revoked grant semantics
  design_contains_but_code_must_not_copy_as_truth:
    - hard-coded counts, subjects, scopes, dates and grants
    - independent decision claim
    - English-shell Arabic wordmark
  code_contains_but_design_must_preserve:
    - minimum trimmed reason
    - security_admin RPC role guard
    - subject self-decision denial
    - row lock and open-state conflict guard
    - RLS-specific self, auditor and security-admin read scopes
  missing_in_both:
    - governed route-frame identity and CD-050 fingerprint
    - opener-versus-decider governance decision
    - exact entitlement object and revoke/retain enforcement outcome
    - immutable audit evidence and retrieval
    - per-source unavailable and scoped-empty states
    - completeness and as-of provenance
    - safe localized denied, conflict and recovery states
    - complete Arabic, responsive, theme and accessibility evidence

