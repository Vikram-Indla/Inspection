test_and_evidence_assessment:
  current_proof:
    - structural schema, RLS and RPC source assertions
    - live rollback probe for one valid decision
    - admin route-open smoke
    - Arabic-key presence test
    - shared loading and table/action primitives
  misleading_or_insufficient_proof:
    - The live probe uses the same Security Admin as opener and decider.
    - Route smoke proves HTTP rendering, not action authority or data containment.
    - Arabic-key presence proves neither Arabic data semantics nor RTL behavior.
    - The only Arabic/mobile runtime test targets Integrations, not Security Access.
  missing:
    - Security Admin, auditor, subject, unrelated user, field and anonymous route matrix
    - action hidden/disabled behavior for every ineligible persona
    - self-decision denial and no-change proof
    - opener/decider separation if governance requires it
    - valid retain/revoke persistence and visible actor/reason/time evidence
    - actual entitlement remediation or explicit unchanged-entitlement evidence
    - stale concurrent decision and preserved-input recovery
    - per-source failure isolation and safe error copy
    - evidence grant scope, purpose, expiry, actor and lifecycle proof
    - immutable audit retrieval
    - full EN/AR, LTR/RTL, theme, viewport, keyboard, zoom and accessibility evidence
    - exact accepted route-frame fingerprint and design/runtime comparison
  completion_rule: >-
    No route, screen, requirement or design receives completion credit until
    authority, functional effect, negative behavior, audit evidence and every
    named P0/P1 evidence item pass.

risk_register:
  - id: SECACC-059-RISK-001
    severity: CRITICAL
    risk: Revoke is interpreted as access removal although only the review row changes.
  - id: SECACC-059-RISK-002
    severity: CRITICAL
    risk: Independent maker-checker is claimed although the opener may decide the review.
  - id: SECACC-059-RISK-003
    severity: CRITICAL
    risk: Unauthorized and subject-self users receive sensitive decision controls.
  - id: SECACC-059-RISK-004
    severity: CRITICAL
    risk: Multiple frozen inventories assign conflicting design authority.
  - id: SECACC-059-RISK-005
    severity: HIGH
    risk: Failed grant or role sources appear as trustworthy zero.
  - id: SECACC-059-RISK-006
    severity: HIGH
    risk: Evidence scope, expiry, granting actor and review decision evidence remain hidden.
  - id: SECACC-059-RISK-007
    severity: HIGH
    risk: Raw RPC errors expose internal detail and bypass localized safe copy.
  - id: SECACC-059-RISK-008
    severity: HIGH
    risk: Illustrative design values become runtime or seeded truth.

reviewer_disposition:
  acknowledgement:
    - WA-DES-004 Security is the nearest semantic and information-architecture match.
    - RLS, subject self-decision denial and atomic open-state decision storage are real.
    - Provider, retention and production claims remain held.
  return:
    - Correct all route/design/package inventory to one governed WA-DES-004 Security lineage.
    - Remove WA-DES-043 and WA-DES-011 from Security Access Review ownership.
    - Correct independent-decision and hard-coded fixture claims.
  block:
    - No design consumption until screen identity and CD-050 route-frame revision are governed.
    - No implementation completion until revoke/retain effect, personas, audit and evidence contracts are decided.
  decision: BLOCK_DUE_TO_MISSING_CONTRACT
  secondary_action: RETURN_FOR_MAPPING_CORRECTION
  recommended_action_after_governance: CORRECT_MAPPING_GOVERN_EXISTING_FRAME_AND_DEFINE_ENFORCEMENT

sponsor_business_decision:
  recommendation: >-
    Approve WA-DES-004 Security as the corrected route design under CD-050, but
    do not approve it for build or completion yet. Require one explicit business
    decision: whether Revoke must actually remove or queue removal of the
    reviewed entitlement, and which exact entitlement object is affected.
    Separately decide opener-versus-decider separation and immutable audit.
    After those contracts and route personas are recorded, assign exactly one
    bounded design writer; any application lease remains separate.

