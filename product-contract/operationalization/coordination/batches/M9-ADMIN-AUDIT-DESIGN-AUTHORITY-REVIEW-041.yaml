semantic_delta:
  parity:
    - Real route and replay workspace exist.
    - Chronology, before/after, correlation and provenance are represented.
    - Generic records are labelled non-canonical and semantic degradation is explicit.
    - Unauthorized state is zero-disclosure in the rendered workspace.
    - Append-only database triggers exist for generic and semantic audit rows.
    - EN and AR label sets, document direction and a bilingual loading state exist.
  code_beyond_WA_DES_015:
    - reconstruction, comparison, completeness, custody and print-safe modes
    - semantic provenance, integrity and chain status
    - ontology-backed expected-event ledger
    - bounded-history and policy-held disclosure
    - source-error, degraded, empty and unauthorized states
  design_beyond_code_or_unproven:
    - WA-DES-015 Export scoped is not implemented or governed.
    - CD-019 actor, object, action and date filters are not fully implemented.
    - CD-019 sensitive redaction, export, retention and tamper-evidence controls are held.
    - No accepted stable design proves the current six-mode workspace.
  current_source_risks:
    - Queries execute before the workspace renders unauthorized, relying on RLS.
    - compliance_admin object-scoped results are not labelled partial.
    - Generic and portfolio reads stop at 250 without next-page navigation.
    - Client q search covers the bounded loaded snapshot but can look global.
    - Generic and semantic rows may represent the same business change twice.
    - Before, after and payload JSON have no approved field-redaction contract.
    - Print-safe is not a legal export or evidence package.
    - Localized date display does not expose a governed timezone policy.
    - Dialog Tab handling returns focus only to Close rather than cycling all controls.
  functional_implication: >-
    Existing replay behavior must be preserved. A design may reorganize the
    workspace only after it shows bounded scope, provenance, RLS, partial
    history and held policy truth without adding fake export or legal proof.
  wiring_implication: >-
    BUILD, WIRE and UPDATE are blocked. First retrieve and validate CD-054 or
    create a governed successor; separately approve any privacy/export contract.

