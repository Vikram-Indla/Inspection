purpose: close_remaining_MVP1_semantic_review_without_serial_waiting
team_lead: Claude Code
control_writer: Codex

continuous_execution:
  enabled: true
  instruction: >-
    Claude lead must keep an internal execution loop running for the active
    session: read latest events, collect workers, validate outputs, claim the
    next disjoint READY work, refill available agent slots and repeat. Do not
    wait for Codex or the sponsor while any unrelated READY work exists.
  next_queue_after_first_wave: [PA-009, PA-010, PA-011, PA-012, PA-006]
  stop_only_for: [goal_complete, all_remaining_work_hard_blocked, authority_required, permission_or_safety_boundary, session_budget_exhausted]
  error_instruction: >-
    On error, stop only that packet and write ERROR_STOP plus
    CODEX_ACTION_REQUIRED events. Do not ask Vikram. Continue unrelated READY
    work. Poll for a Codex RESOLUTION at bounded intervals and resume only the
    referenced packet/checkpoint.

shared_write_rule: >-
  Workers and Claude lead do not edit the shared workbook, coordination CSV,
  handoff log or cursor. They create only the unique outputs and immutable
  events named here. Codex consolidates after TEAM_COMPLETE.

