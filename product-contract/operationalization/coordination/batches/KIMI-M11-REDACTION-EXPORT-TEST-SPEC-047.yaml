saqeel_os: "v2"

purpose: >-
  Freeze future M11 tests for raw-audit denial, safe-audit projection,
  secret-sentinel exclusion, CSV/JSON export filtering, provider metadata,
  before/after states, neutral resource scope and immutable evidence. This
  specification creates no export, fixture, test, database query or product
  change.

