evidence_contract:
  required_metadata:
    - run_id
    - case_id
    - frozen_authority_hashes
    - code_commit
    - migration_chain_hash
    - fixture_graph_hash
    - ordinary_persona_or_isolated_reviewer_class
    - result
    - producer_attestation
    - independent_reviewer
  required_outputs:
    - returned_field_and_row_scope_manifest
    - status_token_body_or_artifact_behavior_pairs
    - CSV_and_JSON_schema_scan
    - prohibited_sentinel_and_derivative_scan
    - historical_audit_row_count_and_checksums
    - artifact_bundle_index_and_hashes
    - quarantine_or_release_result
    - teardown_result
  release_rule: >-
    Release requires every allowlist, scope, redaction, canonicalization,
    checksum, attestation, reviewer and teardown control to pass. Any single
    failure quarantines the entire bundle.

