hard_boundary:
  - "No actual test, SQL, migration, product, application, database, design, data, seed, export, branch or stash change."
  - "No real or realistic secret, OTP, provider payload, credential, person, factory or application row."
  - "No raw audit, function body, query text or provider response is collected in this specification."
  - "Symbolic secret sentinels are never released or hashed into evidence."
  - "No export or evidence path is authorized unless exact persona and scope authority exists."
  - "No implementation or QA lease is issued and zero change is made to the 478-row completion count."
  - "Kimi output remains unaccepted until the locked Mac is unlocked and its response is captured and validated."

disclosure_invariants:
  raw_audit:
    - "No authenticated application persona can read raw participant before_state or after_state."
    - "No raw verification_record, code_hash, dev_code or provider payload reaches an application surface."
    - "Privileged isolated evidence inspection cannot be used as proof of application visibility."
  safe_projection:
    - "Only an explicit allowlist of safe facts is returned."
    - "Unknown or additional fields fail closed."
    - "One resource cannot disclose another resource's safe facts."
  export:
    - "CSV and JSON use the same semantic allowlist."
    - "Nested JSON, CSV quoting, formula-like strings, alternate encodings and metadata cannot bypass filtering."
    - "No empty-versus-denied artifact oracle exposes resource existence."
  evidence:
    - "Historical audit rows remain immutable."
    - "Evidence contains approved fields and hashes only; no prohibited value or derivative."
    - "Any redaction, checksum, scope, teardown or reviewer failure quarantines the entire bundle."

