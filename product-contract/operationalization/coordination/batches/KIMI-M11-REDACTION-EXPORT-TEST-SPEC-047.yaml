  - id: FX-RED-ASSIGNED-INSPECTOR
    authority: "Exact resource-scoped Inspector; no raw participant audit."
  - id: FX-RED-UNASSIGNED-INSPECTOR
    authority: "No relationship to the resource."
  - id: FX-RED-REVIEWER
    authority: "Safe view-only where exact authority exists."
  - id: FX-RED-AUDITOR
    authority: "Safe audit view-only where exact authority exists."
  - id: FX-RED-PLANNER
    authority: "Only exact planning scope; no raw participant audit."
  - id: FX-RED-OPERATIONS
    authority: "No inferred authority; no raw participant audit."
  - id: FX-RED-SECURITY-ADMIN
    authority: "Application administration only; no raw participant secret audit."
  - id: FX-RED-COMPLIANCE-ADMIN
    authority: "Safe compliance evidence only."
  - id: FX-RED-LEADERSHIP
    authority: "Safe aggregate evidence only."
  - id: FX-RED-ANON
    authority: "No M11 read or export."
  - id: FX-RED-ISOLATED-EVIDENCE-REVIEWER
    authority: "Privileged future evidence lane; never an application persona."

