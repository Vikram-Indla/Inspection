    - FX-RED-RAW-PARTICIPANT-AFTER
  sentinels:
    - FX-RED-SENTINEL-PLAINTEXT-SECRET
    - FX-RED-SENTINEL-SECRET-DERIVATIVE
    - FX-RED-SENTINEL-PERSONAL-DATA
    - FX-RED-SENTINEL-PROVIDER-PAYLOAD
