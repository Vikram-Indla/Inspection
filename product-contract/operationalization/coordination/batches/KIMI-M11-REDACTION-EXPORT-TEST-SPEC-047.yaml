    - FX-RED-DENIED-RESULT

field_classes:
  always_prohibited:
    - dev_code
    - plaintext_OTP
    - OTP_or_secret_derivative
    - verification_record
    - code_hash
    - raw_participant_before_state
    - raw_participant_after_state
    - raw_provider_payload
    - provider_credential_or_endpoint
    - runtime_query_text
    - raw_function_or_view_body
    - personal_contact_or_identity_value
  conditionally_allowed_safe_facts:
    - approved_resource_identifier
    - approved_event_type
    - approved_occurred_at
    - approved_actor_class
    - approved_state_transition_fact
    - approved_requirement_reference
    - approved_provider_outcome_class
  rule: >-
    The final safe field allowlist must come from accepted corrected contracts.
    The labels above classify candidate safe facts but do not authorize a field.

expected_result_vocabulary:
  DENY: "No data or artifact returned and no resource-existence disclosure."
  SAFE_VIEW_ONLY: "Only exact approved safe fields returned."
  SAFE_EXPORT: "Artifact contains only exact approved fields and authorized rows."
  QUARANTINE: "Entire candidate artifact/evidence bundle is withheld."
  NEUTRAL: "Missing and out-of-scope outcomes have identical status, token, body and artifact behavior."
  IMMUTABLE: "Historical row count and checksums remain unchanged."
  ZERO_LEAK: "No prohibited sentinel, value, derivative, metadata or field name appears."

