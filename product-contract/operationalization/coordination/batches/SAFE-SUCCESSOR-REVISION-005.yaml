m4_factory_360_readiness:
  lease_proposal: CLAUDE-DESIGN-M4-SUCCESSOR-005-B
  bundle_policy: >-
    Create two independent successors while preserving both predecessors.
    Neither successor is consumable unless the complete pair passes review and
    receives one bundle acceptance. A partial pair is rejected, not partially
    adopted.
  requirements: ["CR-410..CR-429"]
  acceptance: ["WA-M4-AC-001..006"]
  files:
    - logical_id: WA-DES-026
      route: /factories
      predecessor:
        filename: "SAQEEL Factories.dc.html"
        bytes: 11274
        sha256: "a099cdf0b94e85ff57b3357fb4a26212c052261e0cb49b29bb4237d8372dfa87"
        state: ACCEPTED_PREDECESSOR_IMMUTABLE
      proposed_successor:
        revision: WA-DES-026-C1
        filename: "SAQEEL Factories - WA-DES-026-C1.dc.html"
        initial_state: DRAFT_NON_CONSUMABLE
      bounded_delta:
        - "Replace the blank provider sentence 'Factory identity records sync from the national source ().'"
        - "Configured case: display the governed source value and source_synced_at only when present."
        - "Unconfigured case: display 'Source not configured'; omit provider version, timestamp and sync claim."
        - "Replace typed Arabic-only 'صقيل / صناعي' branding with the approved bilingual Web/Admin asset."
        - "Preserve factory list, map/list modes, search, routing, states, locale, theme, responsiveness and accessibility."

    - logical_id: WA-DES-027
      routes: ["/factories/:id", "/factories/cr/:id"]
      predecessor:
        filename: "SAQEEL Factory 360.dc.html"
        bytes: 29250
        sha256: "8fdfd8530ccf4ebbddb4a1960455aee3f638824d72bd1b7db824ed7eba096573"
        state: ACCEPTED_PREDECESSOR_IMMUTABLE
      proposed_successor:
        revision: WA-DES-027-C1
        filename: "SAQEEL Factory 360 - WA-DES-027-C1.dc.html"
        initial_state: DRAFT_NON_CONSUMABLE
      exact_observed_defects:
        - "Line 89 claims 'source MODON · recorded 2026-07-20'."
        - "Lines 195-197 claim 'MODON · v6'."
        - "Lines 224-225 claim source system MODON and a recorded sync timestamp."
        - "Line 31 uses typed Arabic-only 'صقيل / صناعي' branding in the English/LTR reference."
      bounded_delta:
        - "Configured source: bind source name and source_synced_at to governed record values only."
        - "Unconfigured source: show 'Source not configured' and omit provider version, timestamp and sync claim."
        - "Provider-unavailable/partial profile remains visible and fail-closed."
        - "Remove literal MODON, invented v6 and fabricated synchronization claims."
        - "Use the approved bilingual Web/Admin wordmark or collapsed shield asset according to actual rail surface."
        - "Preserve the three-column Factory 360 information architecture and every CR-410..CR-429 section, action and required state."
  pre_acceptance_assertions:
    - "Both predecessor hashes remain unchanged."
    - "Exactly two successor filenames are added and no other design inventory changes."
    - "No MODON literal, provider version, fabricated sync value, empty parentheses, صناعي or Industrial sub-brand remains."
    - "Configured, unconfigured and provider-unavailable cases are distinct and truthful."
    - "WA-DES-026 and WA-DES-027 remain the logical screen IDs."
  read_only_design_truth_findings:
    - id: M4-DESIGN-P1-RESPONSIVE-001
      severity: P1
      evidence: >-
        The current WA-DES-026 export declares only a 1200x860 preview. The
        current WA-DES-027 export declares only a 1440x900 preview and one
        max-width 1280 grid rule; neither export proves distinct 1024, 412, 390
        and 320 layouts.
      effect: "Blocks design acceptance and Claude Code consumption until a separate responsive-state lease is reviewed and evidenced."
    - id: M4-DESIGN-P1-LOCALE-002
      severity: P1
      evidence: >-
        Arabic field values exist, but neither current export proves a complete
        AR/RTL screen variant, locale switch, mirrored information architecture
        or English/Arabic interaction parity.
      effect: "Blocks design acceptance and Claude Code consumption until full EN/LTR and AR/RTL comparisons exist."
    - id: M4-DESIGN-P1-STATES-003
      severity: P1
      evidence: >-
        The exports do not expose independently selectable loading, empty,
        error, degraded, unauthorized, stale/conflict, provider-unavailable and
        route-specific not-found cases required by the route mapping.
      effect: "The source/brand successor may be prepared as a draft, but the M4 bundle cannot advance to accepted design or implementation authority."
    - id: M4-DESIGN-P1-A11Y-004
      severity: P1
      evidence: >-
        Some controls have accessible names, but current evidence does not prove
        keyboard order, visible focus, narrow-layout reachability, table
        alternatives or state announcements across the required cases.
      effect: "Requires a separate accessibility proof/correction packet before design acceptance."
  next_read_only_task:
    packet: CLAUDE-DESIGN-M4-STATE-READINESS-006
    scope: >-
      Inventory the missing responsive, EN/AR, accessibility and negative-state
      frames without changing source/provider semantics, routes, product
      behavior or either predecessor.
    output: "A reviewed successor-frame delta and evidence matrix; no design write until separately leased."

acceptance_and_consumption:
  acceptance_record_required:
    status_values: ["DRAFT_NON_CONSUMABLE", "REJECTED", "ACCEPTED"]
    required_fields:
      - "logical design ID"
      - "predecessor revision, filename and SHA-256"
      - "successor revision, filename, URL, byte count and SHA-256"
      - "reviewer and sponsor decision"
      - "comparison evidence"
      - "accepted timestamp"
      - "route and application component mapping"
  mapping_impact_before_acceptance:
    - "Do not change product-contract/web-admin-phase1/DESIGN_ROUTE_MAP.csv."
    - "Do not change application code, tests, seeds or Supabase."
    - "Claude Code continues to consume the currently registered predecessor/base mapping."
  mapping_impact_after_acceptance:
    - "Update only the design filename and SHA-256 authority fields for the unchanged logical ID."
    - "Do not change routes, requirement ranges, acceptance IDs or application component paths."
    - "Record the predecessor as retained rollback authority."
    - "For M4, update both WA-DES-026 and WA-DES-027 together or neither."
  claude_code_intake_gate:
    - "Claude Code begins with SAQEEL_SESSION_START_COMMAND.md and independently reloads the operating system and current task packet."
    - "Claude Code receives the accepted successor export, exact SHA-256 and acceptance record."
    - "Claude Code independently hashes the supplied export and stops on any mismatch."
    - "Claude Code maps by logical ID and accepted revision, never by newest filename or project page order."
    - "Claude Code must ignore every DRAFT_NON_CONSUMABLE or REJECTED successor."
    - "Implementation requires a separate, non-overlapping application-code lease."

rollback:
  design: >-
    No predecessor restoration is required because predecessors are never
    modified. Reject the successor in the acceptance record and keep Claude Code
    mapped to the prior accepted revision.
  implementation: >-
    If a later accepted successor implementation regresses, restore the retained
    application implementation or feature-flag path and remap to the retained
    predecessor authority; do not delete either design revision.

stop_conditions:
  - "The platform cannot create under an exact unused filename."
  - "The predecessor cannot be independently exported and hashed immediately before creation."
  - "The predecessor hash changes."
  - "The platform creates or edits any file outside the proposed successor set."
  - "The successor cannot be independently exported and hashed."
  - "Any requested correction changes routes, APIs, providers, policy, data fields, workflow or product behavior."
  - "Human acceptance is missing."
  - "Any P0/P1 defect remains in the successor, mapping, preserved capability or acceptance evidence."
