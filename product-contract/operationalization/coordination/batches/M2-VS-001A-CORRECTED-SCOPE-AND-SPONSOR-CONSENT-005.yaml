complete_dossier_contract:
  identity_and_planning:
    - stable visit identifier and visit reference
    - visit type and source channel
    - planning status and operational state shown as separate domains
    - priority
    - creation timestamp
    - visit window
    - planning method
    - plan identifier/reference and plan state
    - package and immutable package-version reference
  factory_profile:
    - stable factory identifier and factory code
    - factory name
    - commercial registration number where permitted
    - governed risk band where permitted
    - master-data versus temporary/unverified provenance
  assignment:
    - assigned inspector identity where permitted
    - assignment method
    - assignment state
    - neutral unavailable state when permission or source data prevents display
  location:
    - official factory location when permitted
    - current planned pin
    - original pin when corrected
    - location source/provenance
    - complete retrievable location-event history
  timeline:
    - complete retrievable visit lifecycle history
    - complete retrievable journey/location events permitted to Planning
    - stable event identifier
    - event type
    - actor or system attribution
    - event timestamp
    - reason and comments where permitted
  attachments:
    - read-only attachment metadata list
    - permitted view/download through existing private signed-URL service
    - file type, size, version/provenance and timestamp where available
    - explicit expired-link, missing-file and permission-denied states
    - no upload, replace, edit or delete control
  audit:
    - complete retrievable audit history, not latest-30 only
    - stable audit identifier
    - action
    - actor or system attribution
    - occurred timestamp
    - before state
    - after state
    - explicit zero-history state
    - distinct unavailable/denied/error state
  AI_summary:
    - "CR-057 Future leg remains labelled Future and is not counted."
    - >
      CR-076 summary may appear only when a real approved provider/service
      returns a record-grounded result with provenance.
    - "No generated fixture, permanent mock or unsupported risk statement."
    - "Provider unavailable is fail-closed and leaves the CR-076 AI leg incomplete."

complete_history_truth:
  rule: >
    Complete means every permitted event is retrievable. A bounded page size is
    allowed only with stable cursor pagination until exhaustion; a hard
    latest-30/latest-50 ceiling is prohibited.
  ordering:
    canonical: chronological
    presentation: "Newest-first or oldest-first is allowed only if labelled and deterministic."
    tie_breaker: "timestamp plus stable event identifier"
  cursor_requirements:
    - server-evaluated
    - RLS-scoped
    - stable under refresh
    - no duplicated or omitted event at page boundaries
    - terminal exhausted state
  audit_truth:
    - "Zero events is not equivalent to access denied."
    - "Read failure is not rendered as empty success."
    - "Truncated data is never labelled complete."

authorization_boundary:
  access_class: business_staff
  required_capability: planning.view
  required_server_sequence:
    - verify authenticated identity
    - resolve planning_access_class
    - resolve has_planning_capability(planning.view)
    - fail closed before dossier queries on either resolver error or denial
    - query selected visit and related records under existing RLS
  permitted_class_behavior:
    business_staff_with_planning_view: ALLOW
    admin: DENY
    inspector: DENY_PENDING_DEC-025
    anonymous: DENY
  DEC_025_boundary: >
    DEC-025 remains open. This slice neither grants Inspector selector/detail
    access nor changes /planning or /planning/immediate routing.
  cross_org_behavior: >
    An out-of-scope identifier and a nonexistent identifier return the same
    neutral result and reveal no record existence.

read_only_invariant:
  allowed:
    - server-side RLS reads
    - signed read URL generation through the existing attachment service
    - cursor navigation
    - locale, theme and non-mutating tab/section navigation
  forbidden_controls:
    - selection checkbox
    - bulk action
    - edit
    - reschedule
    - reassign
    - cancel
    - publish
    - return
    - status transition
    - note editor
    - attachment upload
    - attachment replace
    - attachment delete
  implementation_rule: >
    The read-only route must use a component path that does not import, bind,
    serialize or render mutation server actions. Merely hiding enabled action
    controls with CSS or a client-side flag is insufficient.
  zero_write_proof:
    - no write-capable form or server-action reference in rendered payload
    - no POST/PATCH/PUT/DELETE request during the journey
    - before/after database snapshots unchanged
    - audit-event count unchanged solely from viewing
    - no expiry or workflow RPC invoked on page load

