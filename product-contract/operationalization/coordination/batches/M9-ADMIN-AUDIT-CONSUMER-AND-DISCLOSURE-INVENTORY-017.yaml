      - audit_semantic_events with before_state, after_state and semantic_payload
      - audit_replay_case returning raw semantic rows
    personas: [auditor, ops, security_admin, leadership, reviewer, planner, compliance_admin]
    object_scope:
      generic: Global for all permitted roles under current audit_read policies.
      semantic: Global for auditor/ops/security_admin; object-scoped for leadership/reviewer/planner/compliance_admin.
    disclosure: Full raw before, after and semantic payload rendered in event detail.
    search_export:
      search: Case filter plus client q over bounded loaded rows.
      export: Not implemented; print-safe only; export is policy-held.
    guarded_boundary_impact: BREAKS
    required_migration: Replace all three reads with the guarded replay RPC.
    requirements:
      - MVP2-REQ-0230
      - MVP2-REQ-0237
      - MVP2-REQ-0254
      - MVP2-REQ-0137 through MVP2-REQ-0172
  - consumer_id: AUD-CONS-APP-002
