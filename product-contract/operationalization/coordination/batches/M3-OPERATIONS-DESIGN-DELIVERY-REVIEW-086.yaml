runtime_findings:
  - id: M3-RUN-P1-001
    finding: Shared shell renders typed locale-specific SAQEEL Industrial or صقيل صناعي.
    required_correction: >-
      Use the approved bilingual SAQEEL | صقيل dark-surface wordmark in the
      expanded rail and the approved shield in collapsed mode. Do not generate
      Industrial or صناعي as a sub-brand.
  - id: M3-RUN-P1-002
    finding: Live Operations uses one global "Projected route — not live GPS" disclosure.
    required_correction: >-
      Bind exactly one provenance state per entity: last recorded GPS with
      source/time/accuracy when present; assignment/schedule projection with
      coordinate source and scheduled time; or location unavailable with a
      specific reason. Draw no route, trail or ETA.
  - id: M3-RUN-P1-003
    finding: Active-inspector rows display impossible future Since dates.
    required_correction: >-
      Use the source-backed operational-state-entered event time, not visit
      window_start. Reject invalid, contradictory or future timestamps and
      show an explicit unavailable/invalid-data treatment without inventing a
      tolerance or threshold.
  - id: M3-RUN-P1-004
    finding: English UI displays Arabic-only names without a locale-safe treatment.
    required_correction: >-
      Use a source-backed locale-specific display name when present. Otherwise
      retain the official name inside automatic bidirectional isolation; never
      invent transliteration or replace the person identity.
  - id: M3-RUN-P1-005
    finding: Active-inspector list is fixture-heavy and factory-first.
    required_correction: >-
      Make the inspector the primary line, factory/region secondary, and
      canonical state plus valid state-entered time/provenance tertiary.
      Preserve governed scope/filtering and use bounded paging or virtualization
      based on the existing query contract rather than an arbitrary UI cap.
  - id: M3-RUN-P1-006
    finding: Dirty preview adds selection detail but retains global projected disclosure and invalid time source.
    required_correction: >-
      Selection must expose source-backed inspector, factory, region, canonical
      operational state, valid state-entered time, visit reference and that
      entity's provenance metadata; keep map/list selection synchronized,
      dismissible, keyboard reachable and announced.
  - id: M3-RUN-P1-007
    finding: Runtime hard-state implementation is incomplete relative to the visible design matrix.
    required_correction: >-
      Keep normal, loading, RLS-empty, query error, tile/provider failure, no
      positions and direct-route unauthorized states distinct. Provider failure
      withdraws the basemap but retains non-map context; no pseudo-map.

concrete_implementation_delta:
  operations_center:
    - Preserve the five-card contract and both decision-blocked values as unavailable, never zero.
    - Preserve Operations Map and National Performance as primary scoped views.
    - Preserve synchronized map/list selection and bounded detail hierarchy.
    - Keep 1024, 412, 390 and 320 layouts free of clipping and horizontal page overflow.
    - Do not change formulas, alert taxonomy, SLA, roles, providers or backend contracts.
  operations_live:
    - Replace the global projected disclosure with the per-entity provenance union.
    - Remove every route/path/trail/navigation/ETA implication.
    - Correct the inspector-first list and selected-detail information hierarchy.
    - Correct time semantics and fail closed on invalid/future values.
    - Correct locale-safe person-name rendering without invented transliteration.
    - Preserve map/list synchronization, keyboard/focus, reduced motion and wallboard behavior.
    - Preserve all seven hard states across EN/LTR, AR/RTL, light/dark and registered widths.
  shared_shell_dependency:
    - Replace typed/generated wordmark content with the approved bilingual asset.
    - Keep logical RTL layout while the canonical identity asset remains unchanged.

