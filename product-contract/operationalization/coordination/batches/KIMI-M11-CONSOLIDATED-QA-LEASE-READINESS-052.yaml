rollback_and_recovery:
  test_fixture_failure:
    action: "Abort run, teardown isolated fixture graph and invalidate evidence."
  pre_contract_deployment_failure:
    action: "Use compatible rollback where accepted; retain inert expansion if safer; never widen privilege."
  quiesce_or_drain_failure:
    action: "Do not enter contract; remain quiesced and diagnose without forced data loss."
  post_013_or_post_015_failure:
    action: "Remain fail-closed and repair forward; never restore dev_code, broad grants, direct DML, raw audit or generic append."
  certification_failure:
    action: "Feature remains disabled until repaired and full recertification passes."
  evidence_failure:
    action: "Quarantine bundle and rerun affected cases; do not partially accept."

