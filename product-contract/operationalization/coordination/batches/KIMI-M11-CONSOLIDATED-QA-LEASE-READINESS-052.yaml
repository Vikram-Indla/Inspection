deduplication_contract:
  rule: >-
    A canonical proof run may satisfy multiple source case IDs only when the
    run records every mapped case ID, executes every distinct assertion,
    preserves each persona/resource/failure variant, and produces a separate
    verdict per source case. Shared fixtures, catalog snapshots, browser
    sessions, transaction schedules and evidence scans may be reused.
  prohibited:
    - "Deleting a case because another case is similar."
    - "Replacing ordinary-persona proof with service_role, owner, superuser or BYPASSRLS."
    - "Using one provider outcome to stand in for another outcome class."
    - "Using a source scan as runtime proof."
    - "Reusing historical pre-correction evidence as certification."
    - "Collapsing missing and out-of-scope cases without comparing both."
    - "Collapsing CSV, JSON, UI, RPC, Data API and audit surfaces into one unobserved assertion."

