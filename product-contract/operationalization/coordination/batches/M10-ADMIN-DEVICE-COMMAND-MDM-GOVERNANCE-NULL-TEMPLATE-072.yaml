rejection_rules:
  RETURN:
    - Missing or invalid option ID.
    - Required or conditional field remains null.
    - Required matrix/list is empty, partial or ambiguous.
    - A cited reference cannot be resolved.
    - Derived authority fields conflict but do not yet weaken the preservation floor.
    - Design identity/revision is supplied by a non-governance actor without collision proof.
  BLOCK:
    - Any null is replaced by current source behavior, illustrative design data, seed, mock or assumed best practice.
    - Inspector or Auditor receives device mutation.
    - Ordinary Resume is allowed from revoked, wipe_pending or wiped.
    - Queueing, local database update or mock is accepted as acknowledgement/completion/trust evidence.
    - Provider execution is claimed while held or without separate provider authority.
    - Cached deletion, wipe or expiry is claimed without genuine effect evidence.
    - Sync health, formula, threshold or rescue action is invented.
    - Any preservation-floor field is false, omitted or waived.
    - Any answer is treated as a lease, provider enablement, design acceptance or completion evidence.

