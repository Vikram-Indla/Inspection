hard_boundary:
  - "No actual test, SQL, migration, deployment, provider, product, application, database, design, data, seed, branch or stash change."
  - "No migration filename, maintenance window, timeout, drain threshold, retry count, provider value or operational SLA is invented."
  - "All identities, phases, traffic and failures are symbolic test-contract classes."
  - "After security contraction, recovery is roll-forward and fail-closed; no broad privilege or direct DML restoration."
  - "No implementation or QA lease is issued and zero change is made to the 478-row completion count."
  - "Kimi output remains unaccepted until the locked Mac is unlocked and its response is captured and validated."

required_phase_order:
  - dependency_and_collision_preflight
  - database_expansion
  - application_switch_with_OTP_and_provider_callbacks_disabled
  - safe_projection_and_specialized_participant_trigger_verified
  - traffic_quiesce_gate_closed
  - active_mutations_drained_to_zero
  - contract_013
  - immediate_no_traffic_successor_015
  - catalog_runtime_and_regression_certification
  - controlled_feature_resume

phase_invariants:
  - "Every phase consumes evidence from its predecessor and fails closed when evidence is absent."
  - "Expansion remains backward-compatible with the pre-switch application."
  - "The switched application uses only governed paths before direct DML or generic append contraction."
  - "OTP requests and provider callbacks are disabled before quiesce and remain disabled until certification permits resume."
  - "No new mutation enters after the quiesce gate closes."
  - "Contract starts only after the in-flight mutation count is proven zero."
  - "013 and 015 run as an uninterrupted no-traffic sequence under exact sequential ownership."
  - "Safe participant trigger/projection exists before any hardened OTP path can execute."
  - "Historical audit remains immutable and every global audit consumer remains safe."
  - "Failed post-contract certification keeps the feature disabled and invokes roll-forward repair."

