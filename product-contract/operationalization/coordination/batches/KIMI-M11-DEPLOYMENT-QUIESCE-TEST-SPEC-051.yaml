evidence_contract:
  required_metadata:
    - run_id
    - case_id
    - frozen_authority_hashes
    - predecessor_commit
    - migration_chain_hash
    - active_lease_snapshot_hash
    - accepted_catalog_manifest_hash
    - phase
    - proposed_owner_identity_class
    - result
    - independent_reviewer
  required_outputs:
    - phase_timeline_and_owner_handoffs
    - preflight_dependency_and_collision_manifest
    - application_and_feature_state_timeline
    - in_flight_count_and_no_traffic_attestation
    - catalog_before_after
    - provider_and_OTP_pause_resume_state
    - audit_checksums_consumer_results_and_event_cardinality
    - recovery_or_certification_result
    - evidence_bundle_hash
  integrity_rules:
    - "Every phase start cites predecessor evidence."
    - "No hidden/unindexed migration, test, evidence file or owner handoff."
    - "No secret, provider payload, personal data, raw application row or runtime query in evidence."
    - "A failed phase, checksum, redaction, teardown or reviewer signoff blocks release."

