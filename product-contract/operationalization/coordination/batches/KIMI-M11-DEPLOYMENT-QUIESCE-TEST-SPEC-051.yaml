expected_result_vocabulary:
  PREFLIGHT_PASS: "Every authority, dependency, owner, lease and manifest gate is exact."
  PREFLIGHT_BLOCK: "Deployment does not start; no partial change."
  PHASE_PASS: "Phase completes with required predecessor evidence and no prohibited side effect."
  QUIESCED: "New mutations denied and in-flight count proven zero."
  ACTIVE_WORK_HANDLED: "In-flight work follows the accepted drain/finish/fail-closed contract without silent loss."
  NO_TRAFFIC: "No M11 mutation between contract 013 start and successor 015 completion."
  ROLLBACK_CLEAN: "Pre-contract failed phase restores compatible prior state without privilege widening."
  ROLL_FORWARD_FAIL_CLOSED: "Post-contract failure keeps feature disabled and repairs forward."
  ONE_SEMANTIC_EVENT: "Each committed transition produces exactly one semantic event."
  AUDIT_CONTINUOUS: "Historical audit immutable; safe consumers remain operational without raw participant secrets."
  RELEASE_READY: "All catalog, runtime, negative, regression and evidence gates pass."

