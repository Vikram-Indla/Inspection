      owner: F0 migration owner
    - order: T10
      prerequisite: Use isolated commits and negative gates for every database work package.
      owner: F0 migration owner and security reviewer
    - order: T11
      prerequisite: Keep ETA read-only unless separately exact-leased.
      owner: M3 owner
    - order: T12
      prerequisite: Dispatch Claude only after activation, lease, collision, branch, and manual-unlock gates pass.
      owner: Orchestrator

independent_certification_queue:
  status: WAITING_FOR_DECISIONS_TO_BE_APPLIED
  target: Applied decision authority change set
  reviewer_rule: Reviewer must not be the governance writer who applies the decisions.
  allowed_results:
    - PASS
    - CONDITIONAL PASS
    - FAIL
    - BLOCKED
  authority_created_by_certification: none

monitoring:
  mac_state: LOCKED
  on_manual_unlock:
    - Report unlock immediately to root.
    - Do not contact Claude Design.
    - Keep Claude Code dispatch blocked because sponsor choices are still pending.

no_change_attestation:
  decisions_applied: false
  product: unchanged
  tests: unchanged
  migrations: unchanged
  data: unchanged
  design: unchanged
  branches: unchanged
  leases: unchanged
  main: unchanged
  setup_inspection: unchanged
  stashes: unchanged
