  items:
    - order: T01
      prerequisite: Validate the sponsor response is explicit for all nine decisions.
      owner: Orchestrator
    - order: T02
      prerequisite: Apply only selected decisions to exact authority rows under change control.
      owner: Governance writer
    - order: T03
      prerequisite: Validate YAML/CSV/JSON and exact changed-file manifest.
      owner: Governance writer
    - order: T04
      prerequisite: Run true independent certification after application.
      owner: Independent reviewer
    - order: T05
      prerequisite: Close M2 before activating queued Option A.
      owner: M2 owner and Product Owner
    - order: T06
      prerequisite: Register exact Claude eight-file correction lease and resolve dirty preview overlap.
      owner: Orchestrator
    - order: T07
