    - Keyboard-only recording for registry, create, errors, retry, and any map/list synchronization.
    - Provider-held, feature-off, RLS-empty, per-source failure, invalid, denial, duplicate, persistence, and conflict frames.
    - Accessibility and reduced-motion annotations plus export fingerprint and state index.
  later_application_review_not_authorized_here:
    - Real route guard and direct-action denial with zero location disclosure.
    - Layer create refresh persistence, duplicate no-change, failure input preservation, and immutable audit evidence.
    - Working-location visibility, source accuracy, bounded-count truth, and per-source failures.
    - Provider failure with complete non-map fallback; no invented policy.
    - EN/AR RTL, light/dark, all viewports, keyboard, zoom, target size, focus, and reduced-motion runtime proof.
  truth_rule: >-
    Claude Design screenshots prove appearance only. They do not prove runtime
    wiring, authorization, RLS, persistence, audit, provider readiness, policy,
    data completeness, or application implementation.

