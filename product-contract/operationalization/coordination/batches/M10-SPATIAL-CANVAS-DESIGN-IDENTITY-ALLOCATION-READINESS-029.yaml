capability_boundary:
  spatial_canvas_owns_when_contractually_approved:
    - Additive working-layer registry with source, lifecycle truth, visibility scope, and completeness labelling.
    - Working-location registry with factory identity, coordinate availability, source, sensitivity, and RLS-visible scope.
    - Governed layer creation limited to the proven fields and allowlisted layer types.
    - Map/list synchronized selection only after the provider contract is approved.
    - Honest held states for map provider, offline packs, privacy, visibility, snapshots, and unresolved policy.
  adjacent_gis_studio_owns:
    route: /admin/gis
    capabilities:
      - Official factory coordinate display and immutability.
      - Geofence-radius administration and record-supplied GIS engine settings.
      - Factory search, region/risk filters, and official-pin registry.
  explicitly_excluded:
    - Editing, replacing, reverting, reconciling, or publishing official factory coordinates.
    - Inventing a layer edit, activation, deletion, ordering, version, submit, approve, or publish lifecycle.
    - Field tracking, check-in, override, GPS evidence, route navigation, or offline field execution.
    - Factory 360 dossier editing, Planning, Operations, risk, compliance, or enforcement actions.
    - Mapbox health, tile, style, route, offline-pack, or geographic-authority claims while held.
    - Numeric geofence, GPS accuracy, arrival, telemetry, retention, privacy, or visibility policy.
    - Treating a map as legal evidence or seed data as proof of provider, policy, permission, audit, or lifecycle completion.

