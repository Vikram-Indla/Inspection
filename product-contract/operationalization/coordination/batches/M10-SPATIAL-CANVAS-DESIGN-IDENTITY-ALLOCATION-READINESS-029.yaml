responsive_language_theme_accessibility:
  viewports:
    - viewport: 1440x900
      expectation: Persistent Admin shell; bounded registry and optional map region without page-level horizontal overflow.
    - viewport: 1200x840
      expectation: Desktop evidence baseline with complete task and state visibility.
    - viewport: 1024x768
      expectation: Stacked map and registries with no clipped controls or hanging side rail.
    - viewport: 768x1024
      expectation: Registry-first tablet layout that remains usable without pointer map interaction.
    - viewport: 412x915
      expectation: Single-column task order, no peeking submenu icons, complete create and recovery actions.
    - viewport: 390x844
      expectation: Error, held-provider, selection, and form parity without two-dimensional scroll.
    - viewport: 320x568
      expectation: No task loss, overlap, clipping, or hidden status/action.
  locales:
    - locale: en
      direction: ltr
    - locale: ar
      direction: rtl
  bidi_rules:
    - Use logical properties and mirror structural direction.
    - Keep coordinates, layer keys, factory codes, versions, and technical identifiers LTR.
    - Localize headings, states, filters, actions, validation, denials, provider messages, and recovery.
    - Require qualified native-Arabic review before acceptance.
  themes: [light, dark]
  theme_proof:
    - Shell, registry, form, map controls, popup, legend, attribution, focus, errors, disabled text, and held states.
    - Selection and lifecycle status must not depend on color alone.
  accessibility:
    - One h1 with ordered semantic headings and landmarks.
    - Programmatic labels, hints, errors, status announcements, and preserved input on failure.
    - Real button/link semantics for selectable records and actions.
    - Synchronized keyboard and nonvisual list equivalent for every map marker.
    - Visible single focus treatment and logical LTR/RTL tab order.
    - Forty-four-pixel minimum action targets.
    - Required provider attribution remains visible and operable.
    - Reduced motion removes fly-to, animated fitting, pulsing, and motion-only selection.
    - Prove 200 percent zoom and 400 percent or 320 CSS-pixel equivalent reflow.

p0_return_gates:
  - id: P0-IDENTITY-ALLOCATION
    return_if: A design or screen ID is invented, reused, inferred, or allocated outside governance change control.
  - id: P0-ROUTE-OWNERSHIP
    return_if: WA-DES-006 or SCR-ADM-070 is silently stretched from /admin/gis to /admin/gis/spatial.
  - id: P0-REQUIREMENT-OWNERSHIP
    return_if: All 478 rows, CD-045, or MVP2-REQ-0087..0108 are claimed as canonical route ownership without reconciliation.
  - id: P0-CAPABILITY
    return_if: Official-pin, GIS Studio, Field, Factory 360, Planning, Operations, risk, compliance, or enforcement behavior is absorbed.
  - id: P0-INVENTED-LIFECYCLE
    return_if: Edit, activate, delete, order, version, submit, approve, publish, retry, or reconcile behavior is shown without a contract.
  - id: P0-POLICY
    return_if: Any geofence, accuracy, arrival, telemetry, privacy, retention, or visibility value is invented.
  - id: P0-PROVIDER
    return_if: Mapbox, geographic authority, map style, map tiles, offline pack, or route behavior is presented as operational while held.
  - id: P0-AUTHORIZATION
    return_if: Menu visibility, authentication, or optimistic UI is presented as route/action authority.
  - id: P0-CONFIDENTIALITY
    return_if: Denied users can see sensitive locations, layer detail, policy, or create controls.
  - id: P0-AUDIT
    return_if: A mutation is labelled audited without actor, object, before/after, timestamp, and immutable record evidence.
  - id: P0-CONFLICT
    return_if: Silent overwrite is allowed or stale-write prevention is presented as implemented without proof.
  - id: P0-COMPLETENESS
    return_if: A bounded or RLS-scoped read is presented as complete without total and pagination evidence.
  - id: P0-MAP-EVIDENCE
    return_if: A map, centroid, circle, fixture, or seed record is presented as legal or source-authoritative evidence.
  - id: P0-IMPLEMENTATION-CLAIM
    return_if: The design, current heading, layer create, or screenshots are used to claim end-to-end implementation completion.

p1_return_gates:
  - id: P1-STATE-COVERAGE
    return_if: Any required access, data, create, provider, policy, failure, or recovery state is missing.
  - id: P1-MAP-LIST-EQUIVALENCE
    return_if: A marker lacks synchronized semantic registry selection or working locations remain invisible.
  - id: P1-RESPONSIVE
    return_if: Any required viewport clips, overlaps, hides tasks, hangs the shell, peeks submenu icons, or scrolls the page in two dimensions.
  - id: P1-ARABIC-RTL
    return_if: Arabic is untranslated, unreviewed, directionally broken, or reverses technical identifiers.
  - id: P1-THEME
    return_if: Light/dark contrast or state parity fails in shell, registry, form, map, popup, legend, attribution, focus, or error surfaces.
  - id: P1-ACCESSIBILITY
    return_if: Labels, headings, landmarks, focus, target size, keyboard operation, announcements, map alternative, or attribution is missing.
  - id: P1-MOTION-ZOOM
    return_if: Reduced-motion or 200/400 percent zoom evidence is missing or causes task loss.
  - id: P1-EVIDENCE-PACK
    return_if: Identity decision, inventory collision proof, component annotations, state index, limitations, visual matrix, and new export fingerprint are incomplete.

