hard_boundary:
  - "Synthetic truth-table and decision-function validation plus this one owned packet."
  - "No fetch, checkout, branch/worktree creation, merge, push, real dispatch, identity, owner, lease or shared-control mutation."
  - "No implementation, QA, product/test/SQL/data/design/provider/stash mutation or requirement credit."

signals:
  ownership_drift:
    true_when:
      - "Overlapping active ownership exists."
      - "Owner/task/worktree/repository/mode mismatch exists."
      - "Owner separation or preservation floor fails."
    precedence: 1
  lease_authority_change:
    true_when:
      - "Lease-registry blob, path or semantic row changes."
    precedence: 2
  stale_dispatch_pin:
    true_when:
      - "Dispatch coordination commit/hash/task row does not reproduce the current authority view."
    precedence: 3
  documentation_only_movement:
    true_when:
      - "Changed files are non-authoritative coordination documents and authority blobs/rows are identical."
    precedence: 4

classifier_function:
  pseudocode:
    - "if ownership_drift then BLOCKING_OWNERSHIP_DRIFT"
    - "else if lease_authority_change then LEASE_AUTHORITY_CHANGE"
    - "else if stale_dispatch_pin then STALE_DISPATCH_PIN"
    - "else if documentation_only_movement then HARMLESS_DOCUMENTATION_ADVANCE"
    - "else NO_REF_MOVEMENT"
  invariant: >-
    Lower-priority or contradictory true signals can never override a
    higher-priority signal. In particular, documentation-only movement cannot
    mask lease-authority change or ownership drift.

expected_verdicts:
  BLOCKING_OWNERSHIP_DRIFT: BLOCK_OWNERSHIP_DRIFT
  LEASE_AUTHORITY_CHANGE: RETURN_FOR_FULL_LEASE_REVALIDATION
  STALE_DISPATCH_PIN: RETURN_REFRESH_PIN_OR_BLOCK_IF_WRITE_ATTEMPTED
  HARMLESS_DOCUMENTATION_ADVANCE: ACK_DOCUMENTATION_ADVANCE
  NO_REF_MOVEMENT: ACK_NO_REF_MOVEMENT

