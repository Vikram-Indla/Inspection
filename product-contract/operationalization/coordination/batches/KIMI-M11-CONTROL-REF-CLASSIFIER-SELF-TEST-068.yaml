purpose: >-
  Exhaustively self-test the packet-067 ref-advance classifier across every
  boolean combination of ownership drift, lease-authority change, stale pin
  and documentation-only movement, including contradictory signals.

authority:
  classifier:
    packet: KIMI-M11-CONTROL-REF-ADVANCE-CLASSIFIER-067
    sha256: 788ad21df990884831e3639bcbd9b3fc83a892bdd02cffae159ec0c407fe1652
