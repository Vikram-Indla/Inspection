decision_05_factory_radius_governance:
  question: How is a factory-specific radius created, applied and returned to inheritance?
  governance_choice_required: ONE
  governance_options:
    - option_id: GIS-RADIUS-A
      label: Direct audited operational exception
      benefit: An authorized operator can correct a factory value promptly.
      operating_cost: Every change still requires reason, actor, before/after values, governing version and stale protection.
      residual_risk: Incorrect changes take effect immediately under the selected activation rule.
    - option_id: GIS-RADIUS-B
      label: Versioned approval-controlled exception
      benefit: Independent review occurs before activation.
      operating_cost: Adds draft, review, rejection, activation and turnaround behavior.
      residual_risk: It is workflow expansion and may delay an operational correction.
  precedence_choice_required: ONE
  precedence_options:
    - option_id: GIS-OVERRIDE-PRECEDENCE-A
      label: Exception remains effective until explicitly cleared
      benefit: Stable factory treatment.
      operating_cost: Exceptions need periodic ownership review.
      residual_risk: Shared-default changes do not reach exception factories.
    - option_id: GIS-OVERRIDE-PRECEDENCE-B
      label: Exception applies only during an approved effective window
      benefit: Temporary exceptions can expire automatically.
      operating_cost: Requires start/end timing and expiry monitoring.
      residual_risk: Expiry must visibly and safely return to the approved default.
  reset_choice_required: ONE
  reset_options:
    - option_id: GIS-OVERRIDE-RESET-A
      label: Clear exception and inherit the current shared default
      consequence: Record old exception, reason, actor, default version and inherited result.
    - option_id: GIS-OVERRIDE-RESET-B
      label: Replace with a newly approved exception
      consequence: Record a new change; never edit the earlier exception history.
  invariants:
    - Shared-default changes never silently rewrite stored factory exceptions.
    - Exception precedence is visible to Admin and every affected downstream consumer.
    - Reset is stale-protected and historical event outcomes are never recalculated.
  selections:
    governance: PENDING
    precedence: PENDING
    reset: PENDING

decision_06_concurrent_edit_protection:
  question: What happens when another accepted change occurred after a user loaded the screen?
  choice_required: ONE
  options:
    - option_id: GIS-CONFLICT-A
      label: Reject the stale save and show a comparison
      benefit: No automatic merge can hide a conflict.
      user_cost: The user may need to refresh, review and re-enter a proposed change.
      delivery_cost: Requires clear comparison, retry and accessibility states.
      residual_risk: Operational correction can be delayed while the user reconciles.
    - option_id: GIS-CONFLICT-B
      label: Merge unchanged independent fields and reject same-field conflicts
      benefit: A user need not re-enter unrelated changes.
      user_cost: The user must understand which fields merged and which were rejected.
      delivery_cost: Requires exact field ownership, field-level version checks and broader concurrency tests.
      residual_risk: Incorrect field boundaries can produce an unintended merge.
  required_for_both:
    - Save includes the version or value originally loaded.
    - Zero affected rows is an error.
    - Same-field conflict is never overwritten.
    - Refresh never silently reapplies an old client value.
  selection: PENDING

decision_07_audit_truth_and_visibility:
  question: What is the authoritative audit outcome and who may read it?
  truth_choice_required: ONE
  truth_options:
    - option_id: GIS-AUDIT-A
      label: One scoped GIS business event
      benefit: One human-readable record represents the accepted change.
      operating_cost: Generic duplicate history must be suppressed or reconciled at this boundary.
      residual_risk: Removing technical detail can weaken diagnosis unless required fields remain complete.
    - option_id: GIS-AUDIT-B
      label: Linked technical and business events
      benefit: Preserves technical row history and business decision context.
      operating_cost: Both records must share one reference and remain readable as one change.
      residual_risk: Duplicate-looking records can confuse reviewers without correlation and explanation.
  visibility_choice_required: ONE
  visibility_options:
    - option_id: GIS-AUDIT-VIEW-A
      label: GIS Admin plus Auditor
      benefit: Narrow audit exposure.
      operating_cost: Operations needs a separate reduced exception view when action is required.
      residual_risk: Operational responders may lack context unless the reduced view is complete.
    - option_id: GIS-AUDIT-VIEW-B
      label: GIS Admin, Auditor and named Operations oversight
      benefit: Approved responders can inspect relevant history directly.
      operating_cost: Precise fields and masking must be specified.
      residual_risk: Broader visibility can expose unnecessary location detail.
    - option_id: GIS-AUDIT-VIEW-C
      label: Existing capability-based readers
      benefit: Access can be granted by approved duty rather than broad role.
      operating_cost: Capability lifecycle and database alignment must be governed.
      residual_risk: Stale grants can outlive the approved duty.
  required_event_fields:
    - actor
    - authority or capability
    - shared-policy or factory object
    - reason where applicable
    - before value
    - after value
    - source version
    - resulting version
    - effective time
    - timestamp
    - requirement references
  invariants:
    - Change and required audit both commit or both fail.
    - Audit visibility never implies write authority.
    - Export permission and precise-location visibility are separately approved.
  selections:
    audit_truth: PENDING
    audit_visibility: PENDING
    exception_review_owner: PENDING
    export_permission: PENDING
    precise_location_visibility: PENDING

decision_08_policy_activation:
  question: When does an approved shared GIS policy begin governing actions?
  choice_required: ONE
  options:
    - option_id: GIS-ACTIVATE-A
      label: Immediately after final approval
      benefit: Approved correction takes effect without delay.
      operating_cost: Open clients require revalidation, refresh or reconfirmation.
      residual_risk: Active work can encounter a new rule unless lineage is pinned.
    - option_id: GIS-ACTIVATE-B
      label: At a scheduled date and time
      benefit: Operations can communicate and prepare.
      operating_cost: Requires future-version scheduling, cancellation, replacement and timezone handling.
      residual_risk: A future policy must never activate early or twice.
    - option_id: GIS-ACTIVATE-C
      label: At one selected lifecycle boundary
      boundary_must_be_one_of:
        - journeys started after approval
        - visits published after approval
      benefit: Work before the boundary stays on a stable version.
      operating_cost: Multiple valid policy versions coexist and must be displayed.
      residual_risk: Missing durable lineage makes the boundary unprovable.
  required_details:
    timezone: PENDING
    exact_inclusive_boundary: PENDING
    future_policy_cancel_or_replace_rule: PENDING
    already_open_client_consequence: PENDING
  selection: PENDING

decision_09_policy_lineage:
  question: Which policy version governs online and offline work?
  online_choice_required: ONE
  online_options:
    - option_id: GIS-LINEAGE-A
      label: Pin policy at journey start
      benefit: One version governs the journey from start to end.
      field_continuity_cost: Active journeys do not automatically receive later corrections.
      delivery_cost: Journey records and every relevant screen must store and show the pinned version.
      residual_risk: An emergency process must override pinning when continued use is unsafe.
    - option_id: GIS-LINEAGE-B
      label: Resolve current policy at each governed action
      benefit: Check-in and arrival use the server's currently effective rule.
      field_continuity_cost: A policy change can require user notice and reconfirmation during a journey.
      delivery_cost: Every governed action needs online version validation and mismatch states.
      residual_risk: Connectivity loss can prevent a policy-sensitive action.
    - option_id: GIS-LINEAGE-C
      label: Pin policy when the visit is published
      benefit: Planning and execution share one published governing version.
      field_continuity_cost: Later corrections do not reach published visits unless formally re-versioned.
      delivery_cost: Planning, publication, visit history and downstream consumers need version support.
      residual_risk: Broad planning and visit-version scope increases regression exposure.
  offline_choice_required: ONE
  offline_options:
    - option_id: GIS-OFFLINE-A
      label: Preserve capture-time policy and reconcile explicitly
      benefit: Device evidence retains the policy actually present at capture.
      field_continuity_cost: Replay may require later review when server and capture versions differ.
      audit_and_delivery_cost: Store both versions, conflict outcome and reviewer action without rewriting capture evidence.
      residual_risk: A captured transition cannot be accepted automatically when current policy or emergency state prohibits it.
    - option_id: GIS-OFFLINE-B
      label: Preserve evidence but hold policy-sensitive completion until refresh and reconfirmation
      benefit: Final transition cannot complete under an expired or unsafe rule.
      field_continuity_cost: Inspector workflow can pause after reconnection.
      audit_and_delivery_cost: Preserve capture evidence, hold reason, refresh outcome and user confirmation.
      residual_risk: A delayed state change can require Operations intervention.
  required_for_all:
    - Remove hard-coded GIS version claims from future records.
    - Preserve historical stored labels and classify provenance honestly.
    - Visit Detail distinguishes capture-time, pinned and current server versions.
    - Server remains authoritative for the accepted transition.
  selections:
    online: PENDING
    offline: PENDING

decision_10_open_client_refresh:
  question: How does an already-open screen learn that policy changed?
  choice_required: ONE
  options:
    - option_id: GIS-REFRESH-A
      label: Revalidate before every policy-sensitive action
      benefit: Action uses an authoritative version without continuous updates.
      operating_cost: The screen can look stale until the user acts.
      residual_risk: The action requires a clear changed-policy notice and safe retry.
    - option_id: GIS-REFRESH-B
      label: Push or poll for version change
      benefit: Open Admin, Operations and Field screens can display change promptly.
      operating_cost: Adds connection, retry, stale-indicator and accessibility behavior.
      residual_risk: Push or polling failure still requires action-time revalidation.
    - option_id: GIS-REFRESH-C
      label: Keep the open journey on its stored pinned version
      benefit: Prevents ordinary policy change from interrupting the journey.
      operating_cost: Multiple versions remain active and visible.
      residual_risk: Cannot override an emergency state that makes the pinned version unsafe.
  required_for_all:
    - Admin screens cannot display different accepted current versions after successful change propagation.
    - Consumer cache and refresh expectations are testable and visible.
  selection: PENDING

decision_11_emergency_suspension:
  question: What happens when an accepted GIS policy is discovered to be unsafe?
  choice_required: ONE
  options:
    - option_id: GIS-EMERGENCY-A
      label: Suspend policy-sensitive state changes
      benefit: Check-in or arrival cannot complete under a policy known to be unsafe.
      operating_cost: Field work can pause and require Operations intervention.
      residual_risk: Required non-map evidence and captured data must remain available.
    - option_id: GIS-EMERGENCY-B
      label: Activate a previously accepted safe version as a new governed action
      benefit: Work may continue under a known accepted policy.
      operating_cost: Requires a valid prior version plus new activation, conflict and audit evidence.
      residual_risk: Restoration is unsafe if the selected prior version is not valid for the current condition.
    - option_id: GIS-EMERGENCY-C
      label: Keep active journeys pinned and block new journeys
      benefit: Avoids ordinary mid-journey rule changes while stopping new exposure.
      operating_cost: Two operating states coexist until active journeys close.
      residual_risk: Prohibited when the active policy creates immediate safety or legal harm.
  required_details:
    authorized_existing_capability: PENDING
    active_journey_behavior: PENDING
    Field_and_Operations_notification: PENDING
    reason_and_audit: REQUIRED
    resume_or_replacement_authority: PENDING
  selection: PENDING

decision_12_existing_data_transition:
  question: How should current values and records enter the converged model?
  sponsor_action: Select one allowed treatment for each data class.
  data_classes:
    - class: Current engine_settings.gis values and version
      options:
        - Preserve as a legacy active baseline pending formal DEC-002 change control.
        - Mark unresolved and block policy-sensitive new actions until formally accepted.
        - Review and republish as a new governed version without rewriting original history.
      selection: PENDING
    - class: Existing per-factory radius exceptions
      options:
        - Preserve as legacy exceptions and require later review.
        - Require approval before they govern new actions.
        - Preserve active behavior while flagging incomplete owner, reason or version metadata.
      selection: PENDING
    - class: Historical immutable geo events
      options:
        - Preserve exactly as recorded and annotate provenance gaps separately.
      selection: REQUIRED_PRESERVE_NO_REWRITE
    - class: Queued offline geo events
      options:
        - Replay with capture-time version and separately record current server version when different.
        - Preserve evidence but hold policy-sensitive transition for refresh and reconfirmation.
      selection: PENDING
    - class: Hard-coded GIS version labels already stored
      options:
        - Preserve stored value and mark provenance as client-asserted.
        - Correct only through a separately approved append-only reconciliation record.
      selection: PENDING
  prohibited:
    - rewriting historical check-in, arrival, override or audit records
    - silently replacing queued evidence
    - presenting a hard-coded client label as server-resolved proof

decision_13_recovery_and_rollback:
  question: How may an accepted GIS configuration be reversed?
  choice_required: ONE
  options:
    - option_id: GIS-RECOVERY-A
      label: Restore a prior accepted value as a new governed version or change
      benefit: Operations can return to a known value while preserving history.
      operating_cost: Requires new reason, actor, conflict check, activation, audit and refresh.
      residual_risk: The earlier value must still be safe and valid for the current context.
    - option_id: GIS-RECOVERY-B
      label: Cancel a future scheduled version before it becomes effective
      benefit: Prevents an unwanted future change without altering current behavior.
      operating_cost: Requires cancellation state, actor, reason and audit.
      residual_risk: Cannot be used after the scheduled version becomes effective.
    - option_id: GIS-RECOVERY-C
      label: Suspend first, then create a new approved change
      benefit: Avoids ambiguous direct restoration.
      operating_cost: Recovery may take longer and suspension must be operationally supported.
      residual_risk: Field continuity can be interrupted until the new change activates.
  invariant: No recovery edits or deletes historical versions, policy evidence or geo events.
  selection: PENDING

decision_14_explicit_held_boundaries:
  question: Which adjacent scopes remain held after GIS governance choices?
  sponsor_action: Record HOLD or cite the separately approved closure evidence for every item.
  items:
    - item: Spatial Canvas mutation and governed screen identity
      current_status: HOLD
      closure_requires: Exact layer/location capabilities, screen authority, audit and acceptance.
    - item: Mapbox runtime and approved style
      current_status: HOLD_UNDER_MVP3-HOLD-002
      closure_requires: Controlled runtime and style evidence for the exact clause.
    - item: Geographic coverage and accuracy
      current_status: HOLD_UNDER_MVP3-HOLD-002
      closure_requires: Controlled geography and accuracy evidence for the exact clause.
    - item: Offline map packs
      current_status: HOLD_UNDER_MVP3-HOLD-002
      closure_requires: Controlled download, version, expiry and offline evidence.
    - item: Legal-evidence and retention status
      current_status: HOLD_WHERE_MVP3-HOLD-006_APPLIES
      closure_requires: Formal policy and legal approval; no inferred claim.
  invariant: Held adjacent scope does not excuse writer, permission, conflict, audit or lineage defects.

compatibility_rules:
  writer_and_field_ownership:
    - if: GIS-WRITER-A
      then:
        - Every editable shared field is MAP_SETTINGS or explicitly held.
        - Execution cannot activate shared GIS rules.
    - if: GIS-WRITER-B
      then:
        - Every field has exactly one non-overlapping owner.
        - Both screens use one version, conflict and audit boundary.
    - if: GIS-WRITER-C
      then:
        - Proposal, review, rejection, activation and audit lifecycle receives explicit scope approval.
  activation_and_lineage:
    - if: GIS-ACTIVATE-C with journeys-started boundary
      then:
        - GIS-LINEAGE-A is required.
        - Journey version is stored and displayed.
    - if: GIS-ACTIVATE-C with visits-published boundary
      then:
        - GIS-LINEAGE-C is required.
        - Planning and visit publication versioning enter the bounded scope.
    - if: GIS-LINEAGE-B
      then:
        - GIS-REFRESH-A or GIS-REFRESH-B is required.
        - User notice and reconfirmation are required when the server version differs.
    - if: GIS-LINEAGE-A
      then:
        - GIS-REFRESH-C is allowed for ordinary changes.
        - Emergency handling still overrides an unsafe pinned version.
    - if: GIS-LINEAGE-C
      then:
        - Published visit version is durable through execution unless formally re-versioned.
  emergency_and_recovery:
    - if: GIS-EMERGENCY-A
      then:
        - Policy-sensitive online and offline completion is blocked.
        - Captured evidence remains available.
    - if: GIS-EMERGENCY-B
      then:
        - Only a previously accepted and currently valid version may be reactivated.
        - Reactivation is a new governed action with activation, conflict, audit and refresh.
    - if: GIS-EMERGENCY-C
      then:
        - It is prohibited when active journeys face immediate safety or legal harm.
        - New journeys are blocked and active journey versions remain visible.
    - if: GIS-RECOVERY-B
      then:
        - The target version must not yet be effective.
    - if: Recovery affects an effective policy
      then:
        - A new governed version/change is required.
        - The selected activation and lineage rules apply again.
  radius_and_conflict:
    - if: GIS-RADIUS-B
      then:
        - Immediate unreviewed activation is prohibited.
    - if: Any exception reset or replacement
      then:
        - Stale-change protection and atomic audit are required.
  data_and_holds:
    - if: A field is READ_ONLY_EXISTING_VALUE_PENDING_DECISION
      then:
        - It is not editable and is not presented as newly approved.
    - if: A field is NOT_IN_CURRENT_RELEASE
      then:
        - Mandatory active parent behavior must remain available or fail closed through an approved path.
    - if: An offline event is replayed during emergency suspension
      then:
        - Evidence is preserved but a prohibited policy-sensitive transition cannot silently complete.
  universally_prohibited:
    - independent overlapping field writers
    - page, server action and database policy disagreement
    - hidden navigation treated as authorization
    - last-writer-wins or zero-row false success
    - required audit failure while business change succeeds
    - GIS-REFRESH-C with GIS-LINEAGE-B
    - lifecycle-boundary activation without stored lineage
    - shared-default change silently rewriting factory exceptions
    - precise data exposure based only on authentication
    - hard-coded version treated as server-resolved proof
    - history rewrite or queued-evidence discard
    - provider or legal hold closure without exact controlled evidence

