schema_version: "1.0"
packet_id: M10-ADMIN-GIS-CONSOLIDATED-SPONSOR-CONSENT-PACKET-048
title: Consolidated sponsor consent packet for GIS governance convergence
status: READY_FOR_SPONSOR_CHOICES_NO_AUTHORITY_GRANTED
prepared_by: CODEX
prepared_on: "2026-07-25"
mode: READ_ONLY_SPONSOR_DECISION_PACKET

purpose: >
  Present one complete, neutral and business-readable set of choices for
  correcting the GIS governance collision. This packet replaces neither the
  product contract nor any open decision. It records no selection, changes no
  policy, grants no authority or lease, and authorizes no implementation.

sponsor_brief:
  problem_now:
    - More than one Admin screen can control parts of one GIS operating policy under different permissions.
    - An older screen can overwrite a newer accepted value.
    - A screen can report success when its intended database change or audit did not complete.
    - Field and server records can identify different governing GIS policy versions.
    - Current read access can disclose more configuration or location data than a persona needs.
  decisions_required_before_safe_repair:
    count: 13
    categories:
      - authoritative writer and field ownership
      - read and write authority
      - minimum persona data disclosure
      - factory-radius governance and inheritance
      - concurrent-edit protection
      - audit truth and visibility
      - activation timing
      - online and offline policy lineage
      - open-client refresh
      - emergency suspension
      - existing-data transition
      - recovery and rollback
      - explicit held boundaries
  what_may_remain_held:
    - Spatial Canvas product scope and governed screen identity
    - exact Mapbox runtime, style, geography and offline certification clauses
    - legal-evidence and retention claims
  no_build_boundary: >
    Sponsor choices in this packet are necessary but are not implementation
    approval. After choices are recorded, the post-consent gate must still pass
    through governed change control, accepted design, characterization evidence,
    bounded ownership and independent review.
  recommendation: NONE

authority:
  governed_screen: SCR-ADM-070
  companion_screen: SPATIAL_CANVAS_SCREEN_ID_REQUIRED
  exact_primary_478_requirements: []
  transferred_requirements:
    - MVP2-REQ-0072 / MVP2-AC-0072
    - MVP2-REQ-0075 / MVP2-AC-0075
    - MVP2-REQ-0233 / MVP2-AC-0233
  phase1_acceptance:
    - WA-M10-AC-001..006
  special_map_acceptance:
    - SPC-GIS-001..008
  unresolved:
    - DEC-002
    - MVP3-HOLD-002
    - MVP3-HOLD-006 where legal or retention status is required
    - WA-DES-006-C1
  rule: >
    Nothing selected here closes an unresolved decision, design acceptance row,
    provider clause or legal hold. Each must follow its own controlled evidence
    and approval path.

evidence_basis:
  - packet_id: M10-ADMIN-GIS-RUNTIME-PERMISSION-MAPPING-040
    finding: Route entitlement, radius authority, concurrency and policy defects.
  - packet_id: M10-ADMIN-GIS-REMEDIATION-PREFLIGHT-041
    finding: Repair boundary defined; implementation remained blocked.
  - packet_id: M10-ADMIN-GIS-CONSUMER-TEST-INVENTORY-042
    finding: Consumer lineage and test evidence were incomplete.
  - packet_id: M10-ADMIN-GIS-CONFIG-WRITER-COLLISION-AUDIT-043
    finding: Writer, authority, audit and lineage collisions confirmed.
  - packet_id: M10-ADMIN-GIS-WRITER-CONVERGENCE-DECISION-PACKET-044
    finding: Core business choices identified.
  - packet_id: M10-ADMIN-GIS-SPONSOR-CONSENT-READINESS-045
    finding: Missing choices, preservation floors and neutrality corrections identified.
  - packet_id: M10-ADMIN-GIS-DECISION-GAP-ADDENDUM-046
    finding: Missing decision categories and preservation floors supplied.
  - packet_id: M10-ADMIN-GIS-CONSOLIDATED-CONSENT-CHECK-047
    finding: Residual wording, disclosure and compatibility gaps identified.

plain_language_terms:
  authoritative_writer: The one approved business path that can finally activate a shared GIS rule.
  field_owner: The approved screen or held state for one specific GIS setting.
  stale_change_protection: Stop an older screen from overwriting a newer accepted change.
  minimum_necessary_data: Give each persona only the GIS values and precision required for its approved job.
  atomic_audit: The business change and its required audit either both succeed or both fail.
  linked_audit_records: Technical and business audit entries that share one reference and can be read as one change.
  effective_time: The exact approved moment a policy begins governing new actions.
  capture_time_policy: The policy version present when a device recorded an event.
  current_policy: The policy version the server considers active now.
  pinned_policy: A stored policy version that remains attached to a journey or published visit.
  factory_exception: A factory-specific radius that takes precedence over the shared default under an approved rule.

requirement_preservation_floor:
  - Official factory coordinates remain governed; Field observation never silently overwrites them.
  - Historical geo events, check-ins, arrivals, overrides, versions and audit records remain immutable.
  - Existing Field, Planning, Operations, Factory 360 and Visit Detail behavior cannot be removed merely to simplify convergence.
  - The server remains authoritative for accepted geofence and workflow transitions.
  - Offline conflicts are surfaced and reconciled; evidence is never silently overwritten or discarded.
  - Provider or offline-map unavailability cannot hide required non-map operational evidence.
  - No Phase 2 or transferred status weakens active MVP1 parent behavior.
  - No numeric threshold, radius, retention rule, persona, provider, legal status or Arabic scope is invented here.
  - A missing or unresolved policy fails closed without fabricating an accepted value.
  - A factory-radius or shared-policy correction never recalculates a historical check-in or arrival outcome.
  - A held field cannot remain editable or be presented as newly governed.
  - NOT_IN_CURRENT_RELEASE cannot be selected if it removes mandatory active behavior.

decision_01_authoritative_writer:
  question: Which operating model is the final authority for shared GIS rules?
  choice_required: ONE
  options:
    - option_id: GIS-WRITER-A
      label: Map Settings is the final authority
      business_model:
        - SCR-ADM-070 owns shared GIS rules and factory exceptions.
        - Execution may display effective values and link to Map Settings but cannot activate them.
      benefit: One GIS-focused ownership and audit boundary.
      operating_cost: Existing shared-rule controls in Execution must move or become read-only without losing behavior.
      migration_consequence: Personas, navigation, history and accepted states must be preserved through the move.
      governance_risk: The Map Settings screen can become overloaded unless shared rules and factory exceptions are clearly separated.
    - option_id: GIS-WRITER-B
      label: Split non-overlapping ownership through one governance service
      business_model:
        - Execution owns explicitly named execution-facing rules.
        - Map Settings owns explicitly named GIS and factory-exception rules.
        - Both use one approved version, conflict and audit service.
      benefit: Keeps settings close to their operational context.
      operating_cost: Users must understand which screen owns each field.
      migration_consequence: Every field and capability must be assigned once and tested across both screens.
      governance_risk: Boundary and audit drift can recur if either screen bypasses the shared service.
    - option_id: GIS-WRITER-C
      label: Execution proposes and Map Settings approves
      business_model:
        - Execution prepares a proposed shared-rule change.
        - GIS governance approves and activates it through SCR-ADM-070.
      benefit: Separates operational proposal from final GIS approval.
      operating_cost: Adds a review queue, turnaround dependency and exception handling.
      migration_consequence: A new proposal, review, rejection and activation lifecycle must be approved and evidenced.
      governance_risk: This is scope expansion and cannot be treated as existing behavior.
  prohibited_current_state:
    - Independent overlapping writers.
    - Different page, action and database permission models.
  selection: PENDING

decision_02_complete_field_ownership:
  question: Which approved owner state applies to every GIS field?
  sponsor_action: Select one owner state for every row; no field may remain implicit.
  allowed_owner_states:
    - MAP_SETTINGS
    - EXECUTION_SETTINGS
    - PROPOSE_IN_EXECUTION_APPROVE_IN_MAP_SETTINGS
    - READ_ONLY_EXISTING_VALUE_PENDING_DECISION
    - NOT_IN_CURRENT_RELEASE
  fields:
    - field: GPS accuracy threshold
      current_writer: /admin/execution
      current_display: /admin/gis and /admin/execution
      owner_state: PENDING
    - field: Arrival detection radius
      current_writer: /admin/execution
      current_display: /admin/gis and /admin/execution
      owner_state: PENDING
    - field: Shared geofence default radius
      current_writer: /admin/execution
      current_display: /admin/gis and /admin/execution
      owner_state: PENDING
    - field: Telemetry interval
      current_writer: /admin/execution
      current_display: /admin/gis and /admin/execution
      owner_state: PENDING
    - field: Route deviation rule
      current_writer: No governed editor found in reviewed screens.
      current_display: /admin/gis
      owner_state: PENDING
    - field: GIS retention rule
      current_writer: No governed editor found in reviewed screens.
      current_display: /admin/gis
      owner_state: PENDING
    - field: Geofence override policy
      current_writer: No complete governed editor found in reviewed screens.
      current_display: Partial downstream workflow only.
      owner_state: PENDING
    - field: Per-factory radius exception
      current_writer: /admin/gis
      current_display: /admin/gis and downstream maps/dossiers
      owner_state: PENDING
  consequences_by_owner_state:
    MAP_SETTINGS:
      benefit: One GIS-focused control surface.
      cost: Existing editing behavior may need to move.
      risk: Screen complexity increases unless groups and permissions remain clear.
    EXECUTION_SETTINGS:
      benefit: Execution rules remain near journey configuration.
      cost: GIS administration remains distributed.
      risk: Governance can drift unless the shared service is mandatory.
    PROPOSE_IN_EXECUTION_APPROVE_IN_MAP_SETTINGS:
      benefit: Independent activation control.
      cost: New queue and response-time dependency.
      risk: Unapproved workflow expansion.
    READ_ONLY_EXISTING_VALUE_PENDING_DECISION:
      benefit: Preserves compatibility without claiming new approval.
      cost: No user can change the value through this release.
      risk: Operations may require a governed exception path.
    NOT_IN_CURRENT_RELEASE:
      benefit: Prevents an incomplete control appearing governed.
      cost: Dependent operations need an approved fail-closed boundary.
      risk: Cannot remove mandatory active behavior.

decision_03_read_and_write_authority:
  question: Who may read and change GIS policy and factory exceptions?
  selections_required:
    read_model: ONE
    write_model: ONE
  read_options:
    - option_id: GIS-READ-A
      label: GIS administrators receive full policy; all others receive task-specific reduced data
      benefit: Narrow full-policy exposure.
      cost: Requires maintained projections for each approved consumer purpose.
      risk: An incomplete projection can block legitimate work or leak unnecessary data.
    - option_id: GIS-READ-B
      label: GIS and named existing technical capabilities receive full policy; all others receive task-specific reduced data
      benefit: Allows approved technical support without giving every Admin full access.
      cost: Every named capability needs page, action and database alignment.
      risk: A screen label must not create a new role or implied authority.
  write_options:
    - option_id: GIS-WRITE-A
      label: GIS Admin capability only
      benefit: Smallest write-authority surface.
      cost: Operational changes depend on GIS Admin availability.
      risk: Work can bottleneck without an approved escalation path.
    - option_id: GIS-WRITE-B
      label: GIS Admin plus named delegated existing capabilities
      benefit: Permits bounded operational delegation.
      cost: Delegation lifecycle, revocation and audit require governance.
      risk: Broad role grants can exceed the approved field boundary.
  sponsor_must_name:
    - whether Planner may change only per-factory radius
    - whether Compliance, Security or Workflow Admin may change any shared field
    - whether delegation is a permanent role mapping or revocable user grant
    - canonical mapping for any Technical Admin label
  invariants:
    - Hidden navigation is not authorization.
    - Direct route, rendered controls, server action and database policy agree.
    - Zero affected rows is an error, never success.
  selections:
    read_model: PENDING
    write_model: PENDING
    named_capabilities: PENDING

