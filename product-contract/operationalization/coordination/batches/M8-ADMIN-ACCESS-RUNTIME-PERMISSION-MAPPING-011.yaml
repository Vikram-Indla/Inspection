permission_boundary:
  classification: TWO_DISTINCT_ENGINES_NOT_RECONCILED
  execution_engine:
    catalogue: capabilities
    role_defaults: role_capabilities
    direct_grants: user_capability_grants
    gate: has_role(security_admin)
    writes:
      - admin_grant_role
      - admin_revoke_role
      - admin_grant_capability
      - admin_revoke_capability
    write_boundary: SECURITY_DEFINER_RPC_ONLY
  planning_factory360_engine:
    catalogue: permissions
    role_defaults: role_permissions
    gate: has_planning_capability(admin.access.manage)
    writes:
      - direct insert into role_permissions
      - direct delete from role_permissions
    server_action_guards:
      - actor must hold admin.access.manage
      - actor cannot grant a capability the actor does not hold
      - actor cannot change admin.access.manage on an actor-held role
    database_boundary: >-
      RLS permits a security_admin to mutate role_permissions directly. The
      stronger server-action checks can therefore be bypassed through the table
      API unless the database contract is strengthened.
  required_resolution:
    - Define whether the engines remain separate and name their distinct scopes.
    - Move all non-bypassable authority and segregation guards into the database boundary.
    - Define a single route admission and partial-source failure contract.

governance_behavior:
  maker_checker:
    implemented: false
    current_contract: D-006 permits one security_admin and defers dual control.
    transferred_requirement_conflict: MVP2-REQ-0227 and MVP2-REQ-0241 require maker-checker or sensitive-action approval.
    decision_required: Sponsor must retain D-006 or authorize a dual-control change.
  versioning_and_publish:
    implemented: false
    missing:
      - immutable role-matrix version
      - draft and publish states
      - comparison against current live version
      - explicit effective-from boundary
      - protection against silently changing active inspections
  concurrency_and_idempotency:
    rpc_grants: >-
      Check-then-insert has no lock or conflict-safe insert; concurrent identical
      requests can collide instead of producing deterministic no-op success.
    sole_admin_revoke: >-
      Count-then-delete is not serialized; concurrent revocations can race the
      sole-security-admin invariant.
    role_permissions: >-
      Server actions have no expected version, idempotency key or transaction
      covering authorization check and mutation.
  audit:
    execution_rpc_audit: Semantic EXE-ACCESS rows are authored for actual changes.
    duplicate_risk: >-
      Generic row triggers may produce a second audit event for the same logical
      user_roles change in addition to the semantic RPC event.
    role_permission_audit: >-
      Migration 20260722120000_planning_role_permissions_audit.sql is authored,
      but the reviewed repository evidence does not prove it is applied live.
    verdict: PARTIAL_AND_LIVE_STATE_UNVERIFIED

test_review:
  source_contract:
    path: apps/web/e2e/execution-access-contract.spec.ts
    strengths:
      - RPC presence, definer hardening, self-target tokens and static UI wiring.
      - Direct user grant tables are not written by application actions.
    gaps:
      - Static source assertions do not prove runtime RLS or concurrency.
      - The test calls check-then-write behavior idempotent without racing requests.
  live_access:
    path: apps/web/e2e/cd-044-admin-planning.spec.ts
    strengths:
      - Self-target denial.
      - Admin role grant and revoke with semantic audit read.
      - Role-permission grant and revoke through the UI.
      - Non-security-admin roster-only behavior.
    gaps:
      - The test intentionally leaves governed data behind in adjacent sections.
      - No direct-table bypass test for role_permissions.
      - No route-level denial expectation for a non-security-admin.
      - No concurrent grant or sole-admin revoke race.
      - No live role_permissions audit assertion.
      - No source-failure, session-expiry, stale, conflict or recovery state.
      - No complete EN/AR, RTL, light/dark, responsive or keyboard evidence.
  route_link:
    path: apps/web/e2e/cd-004-admin-control-plane-home.spec.ts
    limitation: It proves /admin/access is linked, not that access is authorized.
  execution_status: NOT_RUN_READ_ONLY_REVIEW

