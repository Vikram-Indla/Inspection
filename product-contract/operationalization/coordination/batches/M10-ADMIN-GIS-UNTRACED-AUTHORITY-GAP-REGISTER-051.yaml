  implementation_lease_granted: false
  future_ownership_envelopes: UNGRANTED
  completion_credit:
    requirement_rows: 0
    screens: 0

accountability_terms:
  decision_owner: >
    Existing business or governance authority that must make or ratify the
    missing decision. Where the canonical individual or capability is not yet
    named, the register says so instead of inventing one.
  source_artifact: Existing authoritative record that establishes the present boundary.
  resolution_artifact: >
    Governed record that must exist before the gap can close. It is a required
    artifact type, not permission to create or edit it in this task.
  safe_interim_boundary: Behavior allowed while the gap remains open.
  closure_evidence: Objective proof required before status may change to closed.

