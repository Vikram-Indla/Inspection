authorization_and_disclosure:
  application_roles:
    - auditor
    - ops
    - security_admin
    - leadership
    - reviewer
    - planner
    - compliance_admin
  explicit_denied_role: inspector
  generic_rls:
    unrestricted_read_roles:
      - auditor
      - ops
      - security_admin
      - leadership
      - reviewer
      - planner
      - compliance_admin
    implication: >-
      Generic before_state and after_state are broadly visible to every listed
      role; no object-scope or field-redaction rule is applied at this layer.
  semantic_rls:
    unrestricted_roles: [auditor, ops, security_admin]
    object_scoped_roles: [leadership, reviewer, planner, compliance_admin]
    function: can_read_semantic_audit_object
  mismatch:
    priority: P0
    finding: >-
      Generic audit rows are globally role-readable while semantic events use
      object scope for four roles. The UI merges both sources, so semantic
      object scoping does not prevent broad disclosure through generic
      before/after state.
  query_before_denial:
    finding: Both audit sources are queried before the unauthorized workspace renders.
    boundary: RLS is therefore the only zero-disclosure authority.
  partial_scope_label:
    current_roles: [planner, reviewer, leadership]
    omitted_role: compliance_admin
    defect: compliance_admin receives object-scoped semantic results without the partial-scope disclosure.

