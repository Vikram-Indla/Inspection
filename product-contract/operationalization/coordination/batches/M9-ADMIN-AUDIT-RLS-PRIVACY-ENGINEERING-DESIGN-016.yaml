stop_conditions:
  - DEC-006 redaction policy remains open for the selected implementation behavior.
  - Screen identity and route authority remain unresolved.
  - Any raw-table consumer is unidentified.
  - Object-scope predicate cannot fail closed for a generic event type.
  - Reveal is requested without approved persona, field and purpose rules.
  - Migration path overlaps another active lease.
  - Runtime migration inventory does not match reviewed source.
  - Negative role, raw-table denial and source-failure tests are unavailable.

