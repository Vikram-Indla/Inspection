p0_findings:
  - id: PLN-LK-P0-001
    finding: Cancellation vocabulary has two unsynchronized mutable authorities.
    impact: An Admin receives success while Field, Operations and Execution behavior remains unchanged.
    blocks: [WA-M9-AC-001, WA-M9-AC-005, WA-AC-0170, WA-AC-0342, REQ-R0C-01486]
  - id: PLN-LK-P0-002
    finding: Lookup edits and activation publish immediately without maker-checker, versions or effective dates.
    impact: High-impact operational vocabulary changes have no governed approval, scheduled activation or rollback lineage.
    blocks: [WA-M9-AC-001, WA-M9-AC-002, WA-M9-AC-005]
  - id: PLN-LK-P0-003
    finding: Concurrent updates filter only by row ID and silently overwrite.
    impact: A stale editor can erase another administrator's labels, order or metadata without warning.
    blocks: [WA-M9-AC-002, WA-M9-AC-005]
  - id: PLN-LK-P0-004
    finding: Deactivation performs no dependency, in-use or last-required-value check.
    impact: Active drafts and future actions can lose a required selectable value without impact analysis.
    blocks: [WA-M9-AC-001, WA-M9-AC-002, WA-M9-AC-005]
  - id: PLN-LK-P0-005
    finding: The live six-value cancellation set fails the canonical twelve-value initial vocabulary.
    impact: The configurable cancellation obligation and dependent workflows cannot be credited.
    blocks: [REQ-R0C-01486, WA-M9-AC-001, WA-M9-AC-005]

p1_findings:
  - id: PLN-LK-P1-001
    finding: No exact accepted design or screen-catalogue identity exists for /admin/planning/lookups.
  - id: PLN-LK-P1-002
    finding: The route's CR-001..CR-478 ownership and package acceptance assignment are overbroad.
  - id: PLN-LK-P1-003
    finding: Every Admin-class role is a default configurator without a recorded narrow owner decision.
  - id: PLN-LK-P1-004
    finding: Every authenticated user can deep-link to inactive rows and admin metadata.
  - id: PLN-LK-P1-005
    finding: assignment_override_reason has no application consumer.
  - id: PLN-LK-P1-006
    finding: Success messages overstate downstream propagation.
  - id: PLN-LK-P1-007
    finding: Arabic route UI is English fallback and 22 of 30 live labels lack Arabic.
  - id: PLN-LK-P1-008
    finding: Query failure can expose an empty editor while the catalogue source is degraded.
  - id: PLN-LK-P1-009
    finding: Loading, empty, degraded and recoverable error states are incomplete.
  - id: PLN-LK-P1-010
    finding: Audit exists only as backend custody; route history, correlation and rollback evidence are absent.
  - id: PLN-LK-P1-011
    finding: Current focused tests mutate shared data, leave residue and omit required negative paths.
  - id: PLN-LK-P1-012
    finding: Tablet, narrow, full accessibility and qualified native-Arabic certification are unproven.

exact_prerequisites:
  policy_decisions:
    - Select one authoritative cancellation vocabulary and backward-compatibility plan.
    - Select the lookup owner persona/capability model.
    - Approve version, effective-date and maker-checker behavior or a bounded documented exception by lookup kind.
    - Define in-use and historical-reference behavior for deactivation.
    - Define mandatory Arabic completeness and qualified-review ownership.
  governed_mapping:
    - Register one exact screen-catalogue row for /admin/planning/lookups.
    - Accept and fingerprint a route-specific design or formally govern reuse of WA-DES-010 without changing /admin/localization ownership.
    - Replace the blanket CR-001..CR-478 claim with the exact dependent rows in this packet.
  database_and_service:
    - Converge Planning, Field, Execution and Operations on one active/effective projection.
    - Enforce maker-checker or the approved exception in the database.
    - Add immutable versions, effective dates and compare-and-set conflict rejection.
    - Add dependency impact and historical-reference protection before retirement.
    - Preserve append-only audit custody and expose correlated history without deleting required audit evidence.
  data:
    - Reconcile REQ-R0C-01486 with an approved key and metadata migration.
    - Complete Arabic labels under the approved translation workflow.
    - Use a separately leased isolated fixture with deterministic cleanup for future behavioral tests.
  qa:
