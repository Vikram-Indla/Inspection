controlled_dispatch_rules:
  - Resolve target identity from a governed source or explicit user instruction; never infer it.
  - Verify the target's authority is exact for the requested boundary.
  - Record the permitted communication channel, destination and authorized sender.
  - Re-hash cited sources immediately before dispatch.
  - Send only the relevant request, not another owner's fields or hidden analysis.
  - Record delivery evidence separately from acknowledgement evidence.
  - Treat no response as ABSENT; never as approval.
  - Validate a returned response through packet 053 before any wave can advance.

fail_closed_examples:
  - input: Valid request template but no named recipient.
    result: RETURN_NOT_READY
  - input: Recipient named from memory without authority source.
    result: RETURN_NOT_READY
  - input: Chat/browser destination exists but sender permission is unrecorded.
    result: RETURN_NOT_READY
  - input: Compatibility reviewer request before four prerequisite responses.
    result: BLOCK_DEPENDENCY_NOT_READY
  - input: Request is sent and receives no answer.
    result: ACKNOWLEDGEMENT_ABSENT
  - input: Delivery receipt exists but response fields are blank.
    result: ACKNOWLEDGEMENT_ABSENT
  - input: Response says approved but lacks stable authority/evidence reference.
    result: RETURN_INCOMPLETE

review_recommendation:
  ACK:
    - ACK all seven templates as complete, correctly scoped and non-authorizing.
  RETURN:
    - RETURN dispatch readiness because target identity, authority and delivery paths are missing for all seven.
  BLOCK:
    - BLOCK the compatibility-review request additionally because its four owner responses do not exist.
    - BLOCK acknowledgement recording, wave advancement and implementation.
  current: RETURN_DISPATCH_READINESS_NO_SEND

