review_criteria:
  template_complete:
    - Stable request and acknowledgement IDs.
    - Correct wave and gap scope.
    - Exact source IDs and verified SHA-256 hashes.
    - Plain request text limited to the accountable boundary.
    - Required common and boundary-specific response fields.
    - Required evidence.
    - Shared and request-specific rejection rules.
    - Explicit UNSENT and ABSENT state.
  correctly_scoped:
    - No request asks one owner to answer for another.
    - No request creates a requirement, role, value, provider status or hold closure.
    - Contextual rows remain consumer-owned and receive no Admin GIS completion credit.
  non_authorizing:
    - ACK is defined as source/boundary acknowledgement only.
    - The request does not approve design, implementation, data mutation, tests or evidence.
    - The request cannot serve as an implementation lease.
  controlled_dispatch_ready_only_if:
    - Recipient identity is explicitly recorded.
    - Recipient's existing authority source is verified.
    - Delegation, if any, is evidenced.
    - Permitted delivery channel and destination are recorded.
    - Sender is authorized to use that channel for this request.
    - Required predecessor responses exist for dependent reviewers.
    - Source hashes still match immediately before dispatch.

