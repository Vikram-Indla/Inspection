runtime_test_correction_requirements:
  current_finding: >-
    apps/web/e2e/web-admin-m2-batch-002.spec.ts mixes runtime checks with
    self-referential source-string assertions. Its focus assertion requires the
    legacy outer 2px outline even though the recorded correction and canonical
    component CSS claim a single inset stroke. Runtime elements using sq-input
    and the shell search still receive the loaded legacy selectors, so the
    recorded single-stroke claim is not proven.
  future_test_owner: F0_FOR_SHARED_FOCUS_AND_M2_FOR_PLANNING_RUNTIME
  prohibited_now: DO_NOT_EDIT_TESTS_UNDER_THIS_PACKET
  corrected_expectations:
    shared_focus_runtime:
      - Focus the authenticated shell search and one rendered sq-input.
      - Assert computed outline-style is none.
      - Assert no positive outline width or separated outline offset exists.
      - Assert the focused border uses the approved focus/action token.
      - Assert one contiguous inset reinforcement exists if that is the accepted F0 contract.
      - Run in light/dark and EN/LTR/AR/RTL.
    preview_guards:
      - Preview route returns not-found when the server flag is disabled.
      - Preview route returns not-found when wa_preview=1 is absent.
      - Authorized Planner reaches all three preview routes.
      - Unauthorized Admin is denied without protected content disclosure.
    real_data_and_wiring:
      - Require a non-empty certified RLS fixture or return BLOCKED_MISSING_DATA.
      - Never skip Visit list/detail assertions because zero rows were returned.
      - Assert Planning list/detail links stay in the Planning-owned preview route.
      - Assert detail renders audit, lifecycle, package/version, and governed-action content.
      - Assert preview comparison performs no expiry or workflow mutation.
    visual_and_accessibility:
      - Assert zero horizontal overflow at every required viewport.
      - Run axe on all three screens in EN/LTR and AR/RTL.
      - Use screenshot comparisons tied to the accepted stable design revision.
    source_checks_allowed_only_for:
      - Exact server/query gate presence as defense in depth.
      - Prohibited credential, service-role, bypass-RLS, and mock markers.
    source_checks_not_accepted_as_runtime_proof:
      - Layout geometry.
      - Focus appearance.
      - Icons.
      - Data population.
      - Route behavior.
      - RLS behavior.

