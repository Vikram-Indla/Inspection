validator_contract:
  validator_id: SAQEEL-CCR-AUTHORITY-RESPONSE-VALIDATOR-036D
  validator_version: "1.0"
  input_schema_id: SAQEEL-CCR-AUTHORITY-RESPONSE-036C
  input_schema_sha256: d71022d45875a76461598ce7dd8e2ed5d0c1d563064ae41a84c97bb7835f87e1
  accepted_input: >-
    A separate immutable populated response artifact conforming to 036C.
    The blank 036C source is never edited in place.
  forbidden_input:
    - chat transcript as authority
    - mutable response without bundle hash
    - secret, credential or service-role key
    - unversioned evidence
    - response whose source packet hashes differ from the validator contract
  deterministic_rules:
    - Same canonical response bytes, evidence bytes, authority records and evaluation time yield the same verdict and ordered reason codes.
    - Validation never supplies a default, converts null to another value or repairs the response.
    - Validator clock is an explicit input and is recorded in validator output.
    - BLOCK reasons take precedence over RETURN reasons; RETURN takes precedence over ACK.
    - Reason codes are de-duplicated and emitted in stage order, then catalogue order.
    - All failures are accumulated; validation does not stop after the first reason.
    - ACK remains decision-receipt eligibility only and grants zero implementation authority.
  output_fields:
    evaluated_at: explicit validator-clock input
    validator_identity: immutable validator identity/version
    source_hash_check: PASS or FAIL
    authority_check: PASS, RETURN or BLOCK
    completeness_check: PASS or RETURN
    evidence_hash_check: PASS, RETURN or BLOCK
    expiry_check: PASS, RETURN or BLOCK
    incompatibility_check: PASS, RETURN or BLOCK
    preservation_check: PASS, RETURN or BLOCK
    unresolved_point_check: PASS or RETURN
    verdict: ACK, RETURN or BLOCK
    reason_codes: ordered non-empty list unless verdict is ACK
    independent_review_reference: required for a real evaluation

evaluation_stages:
  - stage: 00_PARSE_AND_SOURCE
    checks:
      - response artifact parses
      - schema ID/version match
      - 035, 036A, 036B and 036C source IDs and hashes match
      - no duplicate keys or hidden control characters
    return_reasons: [R-000-SCHEMA-OR-STRUCTURE-INCOMPLETE]
    block_reasons: [B-001-SOURCE-HASH-MISMATCH, B-002-DUPLICATE-OR-AMBIGUOUS-KEY]
  - stage: 01_RESPONSE_STATE
    checks:
      - response is a new immutable artifact
      - response status and version are present
      - prior version is not overwritten
    return_reasons: [R-010-RESPONSE-IDENTITY-INCOMPLETE]
    block_reasons: [B-010-PRIOR-RESPONSE-OVERWRITE]
  - stage: 02_AUTHORITY_AND_DELEGATION
    checks:
      - respondent identity, role and authority basis
      - delegation chain, scope, validity and signature
      - authority covers every answered question
    return_reasons: [R-020-AUTHORITY-MATERIAL-INCOMPLETE, R-021-DELEGATION-MATERIAL-INCOMPLETE]
    block_reasons: [B-020-AUTHORITY-INVALID-EXPIRED-OR-OUT-OF-SCOPE, B-021-DELEGATION-INVALID-OR-CYCLIC, B-022-SIGNATURE-HASH-MISMATCH]
  - stage: 03_SELECTIONS_AND_ENVELOPES
    checks:
      - nine choice sets each contain exactly one allowed option
      - nine question IDs/input IDs match source order
      - required parameters are non-null and correctly typed
      - NOT_APPLICABLE has a signed incompatible-option rationale
    return_reasons:
      - R-030-SELECTION-MISSING
      - R-031-QUESTION-RESPONSE-INCOMPLETE
      - R-032-PARAMETER-INCOMPLETE
      - R-033-NOT-APPLICABLE-RATIONALE-INCOMPLETE
    block_reasons:
      - B-030-SELECTION-CARDINALITY-OR-VALUE-INVALID
      - B-031-QUESTION-ID-OR-INPUT-ID-MISMATCH
  - stage: 04_EVIDENCE_AND_HASHES
    checks:
      - required evidence is present and question-linked
      - evidence/content/metadata/response/bundle hashes use canonical bytes
      - hashes match exact content
      - evidence is not revoked or prohibited
    return_reasons: [R-040-EVIDENCE-MISSING-OR-UNLINKED, R-041-HASH-MISSING]
    block_reasons: [B-040-HASH-MISMATCH, B-041-EVIDENCE-REVOKED-OR-PROHIBITED]
  - stage: 05_VALIDITY_EXPIRY_AND_SUPERSESSION
    checks:
      - valid_from, expiry or no-expiry basis, review date and timezone
      - evaluation time falls inside authority and evidence validity
      - superseded bundle chain is complete, acyclic and immutable
      - change triggers do not invalidate the response
    return_reasons: [R-050-VALIDITY-MATERIAL-INCOMPLETE, R-051-SUPERSESSION-LINK-MISSING]
    block_reasons: [B-050-NOT-YET-VALID-EXPIRED-OR-REVOKED, B-051-SUPERSESSION-CYCLE-OR-HASH-DIVERGENCE]
  - stage: 06_INCOMPATIBILITIES
    checks: INC-001 through INC-015 in numeric order
    return_reasons: [R-INC-004, R-INC-005, R-INC-010, R-INC-011]
    block_reasons:
      - B-INC-001
      - B-INC-002
      - B-INC-003
      - B-INC-006
      - B-INC-007
      - B-INC-008
      - B-INC-009
      - B-INC-012
      - B-INC-013
      - B-INC-014
      - B-INC-015
  - stage: 07_PRESERVATION
    checks: ACK-PRES-001 through ACK-PRES-012 in numeric order
    return_reasons: [R-070-PRESERVATION-ACK-NULL-IN-DRAFT]
    block_reasons: [B-070-PRESERVATION-ACK-FALSE, B-071-PRESERVATION-ACK-NULL-AT-SUBMISSION]
  - stage: 08_ATTESTATION_AND_UNRESOLVED
    checks:
      - complete/accurate, no-inference and no-lease attestations are true
      - signer and signature are valid
      - unresolved points are empty
    return_reasons: [R-080-ATTESTATION-INCOMPLETE, R-081-UNRESOLVED-POINTS-PRESENT]
    block_reasons: [B-080-LEASE-OR-IMPLEMENTATION-AUTHORITY-ATTEMPT]
  - stage: 09_VERDICT
    checks:
      - any BLOCK reason yields BLOCK
      - otherwise any RETURN reason yields RETURN
      - otherwise yield ACK
      - record all ordered reason codes and input hashes

abstract_state_rules:
  parse_and_source:
    PASS: []
    STRUCTURE_INCOMPLETE: [RETURN, R-000-SCHEMA-OR-STRUCTURE-INCOMPLETE]
    SOURCE_HASH_MISMATCH: [BLOCK, B-001-SOURCE-HASH-MISMATCH]
    DUPLICATE_OR_AMBIGUOUS_KEY: [BLOCK, B-002-DUPLICATE-OR-AMBIGUOUS-KEY]
  response_identity:
    PASS: []
    INCOMPLETE: [RETURN, R-010-RESPONSE-IDENTITY-INCOMPLETE]
    PRIOR_OVERWRITE: [BLOCK, B-010-PRIOR-RESPONSE-OVERWRITE]
  authority:
    PASS: []
    MISSING_DRAFT: [RETURN, R-020-AUTHORITY-MATERIAL-INCOMPLETE]
    INVALID_OR_OUT_OF_SCOPE: [BLOCK, B-020-AUTHORITY-INVALID-EXPIRED-OR-OUT-OF-SCOPE]
    DELEGATION_INCOMPLETE: [RETURN, R-021-DELEGATION-MATERIAL-INCOMPLETE]
    DELEGATION_INVALID_OR_CYCLIC: [BLOCK, B-021-DELEGATION-INVALID-OR-CYCLIC]
    SIGNATURE_HASH_MISMATCH: [BLOCK, B-022-SIGNATURE-HASH-MISMATCH]
  selections:
    PASS: []
    MISSING: [RETURN, R-030-SELECTION-MISSING]
    INVALID_OR_MULTIPLE: [BLOCK, B-030-SELECTION-CARDINALITY-OR-VALUE-INVALID]
  envelope:
    PASS: []
    REQUIRED_RESPONSE_NULL: [RETURN, R-031-QUESTION-RESPONSE-INCOMPLETE]
    REQUIRED_PARAMETER_NULL: [RETURN, R-032-PARAMETER-INCOMPLETE]
    NOT_APPLICABLE_INCOMPLETE: [RETURN, R-033-NOT-APPLICABLE-RATIONALE-INCOMPLETE]
    ID_MISMATCH: [BLOCK, B-031-QUESTION-ID-OR-INPUT-ID-MISMATCH]
  evidence:
    PASS: []
    MISSING_OR_UNLINKED: [RETURN, R-040-EVIDENCE-MISSING-OR-UNLINKED]
    HASH_MISSING: [RETURN, R-041-HASH-MISSING]
    HASH_MISMATCH: [BLOCK, B-040-HASH-MISMATCH]
    REVOKED_OR_PROHIBITED: [BLOCK, B-041-EVIDENCE-REVOKED-OR-PROHIBITED]
  validity:
    PASS: []
    MATERIAL_INCOMPLETE: [RETURN, R-050-VALIDITY-MATERIAL-INCOMPLETE]
    NOT_YET_VALID_EXPIRED_OR_REVOKED: [BLOCK, B-050-NOT-YET-VALID-EXPIRED-OR-REVOKED]
  supersession:
    PASS_OR_NO_PRIOR: []
    LINK_MISSING: [RETURN, R-051-SUPERSESSION-LINK-MISSING]
    CYCLE_OR_HASH_DIVERGENCE: [BLOCK, B-051-SUPERSESSION-CYCLE-OR-HASH-DIVERGENCE]
  preservation:
    "TRUE": []
    NULL_DRAFT: [RETURN, R-070-PRESERVATION-ACK-NULL-IN-DRAFT]
    NULL_SUBMITTED: [BLOCK, B-071-PRESERVATION-ACK-NULL-AT-SUBMISSION]
    "FALSE": [BLOCK, B-070-PRESERVATION-ACK-FALSE]
  attestation:
    PASS: []
    INCOMPLETE: [RETURN, R-080-ATTESTATION-INCOMPLETE]
    LEASE_ATTEMPT: [BLOCK, B-080-LEASE-OR-IMPLEMENTATION-AUTHORITY-ATTEMPT]
  unresolved_points:
    EMPTY: []
    PRESENT: [RETURN, R-081-UNRESOLVED-POINTS-PRESENT]

