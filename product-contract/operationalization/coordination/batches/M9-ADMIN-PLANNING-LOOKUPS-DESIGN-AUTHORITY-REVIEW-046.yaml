nearest_design_validation:
  classification: NO_DIRECT_DESIGN_MATCH
  nearest_pattern: WA-DES-010
  reason: >-
    WA-DES-010 supplies a useful reference-list information architecture but
    depicts a different catalogue and lacks the governed planning behaviors.
  parity:
    - lookup/reference-list administration concept
    - bilingual value concept
    - navigation by lookup category
    - tabular reference-value presentation
    - administration-shell context
  design_has_code_lacks:
    - generic reference catalogues including authorities, regions, activities, document types, severity and fuel types
    - visible versioned-value claim
    - external Senaei synchronization provenance
  code_has_design_lacks:
    - seven planning-specific lookup kinds
    - create-new value flow
    - active and inactive states
    - activate and deactivate actions
    - guided eligibility metadata flags
    - raw metadata JSON override
    - read-only capability state
    - per-action success and neutral error feedback
    - no-delete retirement note
  semantic_conflicts:
    - WA-DES-010 is registered to /admin/localization, not /admin/planning/lookups.
    - WA-DES-010 values are not the planning lookup kinds implemented by this route.
    - WA-DES-010 claims versioning while planning_lookups is directly mutable and unversioned.
    - WA-DES-010 suggests provider synchronization absent from the planning lookup contract.
    - The design's edit-only interaction does not cover create, retirement, reactivation or metadata.
  recommended_design_action: >-
    Correct and bind a route-specific Planning Lookups design state after the
    screen identity, exact requirements, CD lineage, version/concurrency and
    dependency policies are decided. Reuse WA-DES-010 only as a visual and IA
    pattern; do not adopt its catalogue or unsupported provider claims.

