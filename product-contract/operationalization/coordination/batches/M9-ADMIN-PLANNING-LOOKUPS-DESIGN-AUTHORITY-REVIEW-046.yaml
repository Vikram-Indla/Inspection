governed_lookup_contract:
  table: public.planning_lookups
  kinds:
    - visit_type
    - visit_mode
    - priority
    - return_reason
    - cancellation_reason
    - manual_entry_reason
    - assignment_override_reason
  guided_metadata_flags:
    - manual_entry_allowed
    - attachment_required
    - location_required
    - comments_required
  supported_actions:
    - create
    - edit English and Arabic labels
    - edit sort order
    - edit guided metadata flags
    - replace metadata with a validated raw JSON object
    - activate
    - deactivate
  unsupported_actions:
    - delete
    - immutable version publication
    - scheduled effective activation
    - dependency impact preview
    - maker-checker approval
    - compare-and-set update
  dependency_behavior:
    active_consumers: Governed selects read active rows on their next load.
    historical_reference: Deactivation preserves the row.
    unresolved_risk: >-
      Editing an existing row remains mutable and can change the current label
      or metadata observed by historical consumers. The route does not prove a
      frozen display snapshot or immutable lookup-version binding.

permission_and_rls_validation:
  read:
    database_policy: Any authenticated user may select planning_lookups.
    page_behavior: Users without configure capability receive the full read-only catalogue.
    validation: CONFIRMED_WITH_SCOPE_REVIEW_REQUIRED
  write:
    capability: planning.configure_lookups
    page_gate: has_planning_capability
    action_gate_recheck: true
    database_insert_policy: capability required
    database_update_policy: capability required
    database_delete_policy: absent
    validation: CONFIRMED
  fail_closed:
    direct_write: CONFIRMED_BY_RLS
    page_gate_provider_error: >-
      Gate errors collapse canConfigure to false and are logged, so the user
      sees the ordinary read-only permission banner rather than a distinct
      authorization-provider failure state.
    validation: CONFIRMED_WITH_CORRECTION
  self_escalation: NOT_APPLICABLE_TO_LOOKUP_VALUES
  maker_checker:
    implementation: ABSENT
    policy_authority: UNRESOLVED
    finding: >-
      All permitted changes apply immediately. Do not invent a maker-checker
      obligation, but do not certify governance until applicability is decided.

