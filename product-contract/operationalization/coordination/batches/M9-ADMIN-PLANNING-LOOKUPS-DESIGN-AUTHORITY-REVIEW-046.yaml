    - duplicate key
    - missing row
  missing_or_unproven:
    - dedicated loading state
    - explicit empty-state explanation and recovery
    - gate-provider unavailable distinct from permission denial
    - partial source or stale cache
    - session expiry at page level
    - dependency impact before deactivation
    - concurrent stale edit conflict
    - audit write failure
    - immutable-version conflict
    - destructive raw-metadata replacement confirmation
    - unsupported metadata schema or consumer incompatibility
    - complete EN/LTR and AR/RTL states
    - light and dark states
    - desktop, tablet and mobile evidence

