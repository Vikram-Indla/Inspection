      - deleting audit, decisions, publications or immutable version history
      - self-certification by an implementer or test author
      - changing a failing protected assertion without a separate exact lease
    data_and_provider_constraints:
      environment: NON_PRODUCTION_ONLY
      authentication: existing approved personas and browser sessions
      service_role: PROHIBITED
      provider_calls: >-
        No external delivery, scheduler or notification success is required or
        claimed. Unconfigured providers remain fail-closed.
      collision_rule: STOP_BEFORE_WRITE_ON_ANY_MATCH_OR_UNPROVEN_ISOLATION
      restoration_rule: >-
        Restore exact business values, statuses, active versions and package
        selection semantics. Retain updated_at, updated_by and append-only
        decisions, versions, publication and audit rows that truthfully record
        the journey.
    evidence:
      database:
        - migration/object state, RLS, grants and function privileges
        - maker-checker, concurrency, atomic rollback and immutable-history negatives
        - exact audit lineage from CCR through package, visit and inspection
      browser:
        personas:
          - compliance_admin_maker
          - reviewer_checker
          - form_admin_package_checker
          - planner
          - inspector
          - denied_business_persona
          - anonymous
        states:
          - Draft
          - Pending Review
          - Scheduled
          - Active
          - denied
          - loading
          - empty
          - error
          - degraded
          - stale_conflict
          - refresh_persistence
          - historical_locked
        matrix:
          - English/LTR and Arabic/RTL
          - light and dark
          - desktop, tablet, 390px and 320px
          - keyboard, focus recovery and Axe
          - console and failed-network review
      regression:
        - focused SQL and Playwright tests
        - Compliance Library and Packages
        - Planning single, bulk and immediate package selection
        - golden journey and offline drill
        - protected Web/Admin/Field selection
        - 478-row structural validator
    certification_exit:
      - Every required test passes on the exact candidate commit.
      - Data restoration and retained immutable audit are independently reviewed.
      - Real-browser matrix is complete with no P0/P1.
      - Codex lead records ACK; sponsor acceptance remains separate.
    rollback: >-
      Test source reverts independently. Data returns to exact semantic
      pre-test business state while immutable audit/version history remains.
      No product rollback is performed by the QA lease.

dependency_and_integration_order:
  - Correct the returned lease definitions in successor 034.
  - Obtain explicit authority and generate/reserve 032A migration path.
  - Implement 032A locally; independent database QA must ACK.
  - Grant and implement corrected 032B; independent Library/permission QA must ACK.
  - Grant and implement corrected 032C; independent package/SQL QA must ACK.
  - Reconcile the Field baseline, then grant and implement 032D; independent Field/offline QA must ACK.
  - Stack A -> B -> C -> D on one exact integration commit without modifying main.
  - Grant 032E test-author and data/operator scopes separately.
  - Run independent full certification and real-browser review.
  - Only after zero P0/P1 may Codex lead request sponsor cutover, merge or release decisions.

