global_lease_rules:
  grant_rule: >-
    Only Codex lead may issue a lease after every prerequisite for that boundary
    is PASS, the exact base commit/worktree/branch/owner is recorded, every
    writable path is clean and unowned, and the preceding serial boundary has
    independent acceptance. This record is not a lease.
  branch_rule: >-
    Each implementation boundary requires its own isolated codex/* branch and
    authorized worktree from the exact accepted predecessor commit. No work may
    begin on main, setup/Inspection or an unrelated dirty worktree.
  migration_path_rule:
    current_032_paths: UNRESERVED_PLACEHOLDERS_NOT_ALLOWED
    required_generation: >-
      After a database lease is explicitly granted, the owner must inspect the
      installed Supabase CLI help and create the migration through
      `supabase migration new <approved-name>`. The generated path and timestamp
      are then added to the granted lease. No worker may reserve or invent the
      filename in advance.
    names_for_future_generation_only:
      - compliance_request_operational_projection
      - compliance_request_authoring_cutover
      - compliance_package_snapshot_cutover
  implementation_qa_separation:
    - Implementers for 032A..032D may write only their exact leased product, migration, focused probe and factual handoff-evidence files.
    - An implementer may not set independent acceptance, requirement credit, sponsor status or release status.
    - The 032E test author must not have implemented 032A..032D.
    - The final 032E certifier must be independent from both implementation and test authorship.
    - The data operator must hold the exact data lease; the certifier reviews its immutable audit and restoration evidence.
    - Codex lead performs final browser acceptance and lease closeout.
  serial_rule: >-
    032A -> 032B -> 032C -> 032D -> 032E. A later boundary may perform read-only
    preparation, but no write lease starts until the prior boundary is
    independently accepted on the exact integration base.
  no_credit_rule: >-
    No individual boundary earns a canonical customer-row completion. Credit is
    considered only after 032E proves the complete chain and no P0/P1 remains.

