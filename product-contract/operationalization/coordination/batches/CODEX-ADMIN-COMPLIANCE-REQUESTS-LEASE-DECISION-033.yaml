    purpose: >-
      Add typed immutable CCR versions, Scheduled/Active effective-date truth,
      optimistic concurrency, RLS-safe operational projection and append-only
      lifecycle/audit behavior without switching an application consumer.
    prerequisite_gates:
      - id: 032A-G1-TYPED-CONTRACT
        status: BLOCKED
        requirement: >-
          Product authority approves the exact required/optional fields,
          validation and dependency shape for Regulation, Inspection Item,
          Violation and Penalty snapshots. Arbitrary JSON is not acceptable.
      - id: 032A-G2-EFFECTIVE-LIFECYCLE
        status: BLOCKED
        requirement: >-
          Product/database authority selects a canonical no-provider mechanism
          for Scheduled -> Active date-boundary truth, current-version
          preservation, deactivation and successor semantics.
      - id: 032A-G3-LEGACY-BACKFILL
        status: BLOCKED
        requirement: >-
          Read-only reconciliation proves how every existing active head and
          legacy stable ID receives unambiguous effective/version lineage.
      - id: 032A-G4-MIGRATION-PATH
        status: BLOCKED
        requirement: >-
          An explicit database lease is granted and the migration path is
          generated at that time; the 032 placeholder is not reserved.
      - id: 032A-G5-TARGET
        status: BLOCKED
        requirement: >-
          Local PostgreSQL execution is available. Remote project
          iiozvqntawxfwbgffzqu remains out of scope until separately authorized.
    would_be_allowed_only_after_grant:
