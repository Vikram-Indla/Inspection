shared_rejection_rules:
  - Reject a response with a blank required field.
  - Reject silence, verbal context or prior general approval as an acknowledgement.
  - Reject a title, screen label, current code path, schema or RLS policy as authority evidence.
  - Reject a response supplied outside the cited existing authority.
  - Reject delegation without a stable authority reference.
  - Reject contextual requirement completion or a new requirement mapping without change control.
  - Reject DEC-002 as formally final while the frozen register remains open.
  - Reject silent closure of Spatial Canvas, provider, offline, legal or retention holds.
  - Reject any response presented as an implementation lease.

