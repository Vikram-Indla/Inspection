schema_version: "1.0"
handoff_id: "<UTC>-<actor>-<packet>-HANDOFF-<sequence>"
actor:
  name: "<Codex|Claude Code|Claude Design|ChatGPT|Kimi>"
  tool_or_application: "<exact tool/application>"
  account_or_workspace: "<non-secret identity or UNKNOWN>"
  session_or_conversation_id: "<exact ID or NOT_PROVEN>"
packet:
  batch_id: "<batch>"
  lane_id: "<lane>"
  task_id: "<canonical task>"
  source_commit: "<full SHA>"
  worktree: "<absolute canonical worktree>"
  branch: "<branch>"
authority:
  requirement_ids: []
  screen_ids: []
  acceptance_ids: []
  design_project_id: "<ID or N/A>"
  design_file_id: "<stable ID or N/A>"
  accepted_design_revision: "<etag/revision/hash or NOT_PROVEN>"
scope:
  mode: "<READ_ONLY|DESIGN_WRITE|PRODUCT_WRITE|REVIEW>"
  allowed_writes: []
  prohibited_writes: []
  files_touched: []
outputs:
  - path_or_url: "<output>"
    sha256_or_revision: "<hash/revision>"
    status: "<COMPLETE|PARTIAL|BLOCKED>"
verification:
  tests: []
  browser_evidence: []
  negative_paths: []
findings:
  confirmed: []
  ambiguous: []
  dirty_laundry: []
  decisions_requested: []
completion:
  status: "<READY_FOR_CODEX_REVIEW|BLOCKED|RETURNED>"
  completed_at_utc: "<UTC>"
  next_checkpoint: "<exact next action>"
  no_unlisted_product_change: true
acknowledgement:
  codex_event_id: "<ACK|RETURNED event or PENDING>"

