self_caught_defect: >-
  First capture attempt used hostname "localhost" while the dev server's
  cookies were scoped to "127.0.0.1" -- all requests silently landed on
  /login. Fixed by matching the storage state's actual cookie domain. Second
  attempt (all 8 profiles) then revealed light/dark screenshot pairs were
  byte-identical -- the app's theme-init script (ThemeScript.tsx) reads
  localStorage synchronously on page load, and setting it via page.evaluate()
  after a prior navigation did not reliably apply before the next navigation's
  init script ran. Fixed by using context.addInitScript() to set
  "saqeel-theme" before any page load in that context, then verified via
  page.evaluate(() => document.documentElement.getAttribute("data-theme"))
  on every single capture that the observed theme matched the intended
  profile -- this check is recorded per-row in the manifest
  (data_theme_observed column). Removed 3 stray duplicate-content files left
  over from the first (pre-fix) successful single-profile test.
