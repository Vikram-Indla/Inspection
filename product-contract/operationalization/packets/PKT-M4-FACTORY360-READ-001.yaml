  outcome: >-
    Preserve the current Factory 360 business truth while delivering the accepted
    SAQEEL list/detail hierarchy: registry filtering; identity; licence and CR;
    official versus observed location; products; materials; workforce and
    investment when verified; visit and inspection history; approved compliance
    outcomes; corrective actions; risk; documents; timeline; provenance; access
    control; and partial-source behavior.
  read_only_boundary:
    - "No new create, update, delete, upload, workflow transition or provider forwarding."
    - "Existing Controls.tsx and current write actions are untouched regression boundaries."
    - "CR-423 Health Score remains decision-required; Risk Score is never relabelled as Health Score."
    - "Factory, licence, CR, product, material, workforce and provider-owned facts remain read-only."
  required_interactions:
    - "Open /factories from the retained authenticated shell."
    - "Filter by existing licensed/unlicensed, region and city controls."
    - "Open the governed factory destination without breaking normalized CR redirect or legacy compatibility."
    - "Navigate accepted read-only Factory 360 sections and permitted existing drilldowns."
  required_states:
    - "loading"
    - "populated"
    - "empty registry"
    - "no filter matches"
    - "not found"
    - "unauthorized or permission-restricted section"
    - "partial verified-source error"
    - "source field unavailable"
    - "source timestamp unavailable"
    - "Industry Shared contract unavailable"
    - "map/provider unavailable while non-map content remains usable"
    - "document preview unavailable while metadata remains truthful"
    - "Health Score decision-required with Risk Profile kept separate"
  delivery_matrix:
    locales: ["EN/LTR", "AR/RTL"]
    themes: ["light", "dark"]
    viewports: ["1440x900", "1200x860", "1024x768", "412x915", "390x844", "320x800 reflow"]
    accessibility: >-
