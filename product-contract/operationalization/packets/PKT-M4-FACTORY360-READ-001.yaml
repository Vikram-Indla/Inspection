      semantic alternatives; non-colour status cues; accessible source and
      unavailable-state labels.

wiring_contract:
  verified_repository_sources:
    - "Existing Supabase server reads and RLS for factories and industrial_licenses."
    - "Existing factory_documents, factory_representatives, factory_products and factory_materials reads."
    - "Existing visits, inspections, submission_versions, reviews, violations, action_forms and penalty_notices lineage."
    - "Existing factory_risk_snapshots and risk provenance; no new formula or Health Score inference."
    - "Existing geo_events official/observed separation and Mapbox fail-closed boundary."
    - "Existing evidence metadata visibility and role-sensitive masking."
    - "Existing /factories/cr/:id normalized route is a read-only dependency and redirect destination, not an owned edit path."
  rls_rbac:
    - "Direct route and nested reads remain constrained by existing authenticated RLS/RBAC."
    - "Positive test: authorized scoped business user."
    - "Negative tests: unauthenticated, unauthorized role and restricted documents/evidence/contacts."
    - "Client hiding never substitutes for server/RLS enforcement."
  audit_and_versioning:
    - "No new write action or audit event is introduced."
    - "Submitted/approved inspection versions and official compliance lineage stay immutable and read-only."
    - "Timeline/source facts are displayed without manufacturing events or causal links."
  truth_rules:
    - "Render only facts returned by existing verified repository contracts."
    - "Expose source/source_synced_at where available, otherwise an explicit unavailable state."
    - "Missing is not zero, healthy, compliant, current or synchronized."
    - "One failed source or unverified contract never blanks the whole route."
    - "No source conflict is silently resolved and no observed value overwrites official master data."
    - "No Industry Shared endpoint is called until separately CONTRACT_VERIFIED."

