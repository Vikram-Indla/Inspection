business_scope:
  persona: "Operations user"
  outcome: >
    Display factories, visits and inspectors only within the authenticated user's
    authorized geography; distinguish factory coordinates from live inspector or
    journey telemetry; expose the source timestamp and a truthful freshness state;
    never manufacture a current position from a factory coordinate, fixture or
    future-dated record.
  required_interactions:
    - "Open /operations/live from the Operations Center."
    - "Pan, zoom and filter the map by authorized region, branch or city."
    - "Open a pin and identify entity type, source and observation timestamp."
    - "Open the permitted visit handoff without gaining action authority."
    - "Retry a failed source without losing healthy widgets."
  required_states:
    - "loading"
    - "populated"
    - "empty"
    - "unauthorized"
    - "partial-source error"
    - "provider unavailable"
    - "stale telemetry"
    - "future-dated or implausible telemetry rejected"
    - "fixture-labelled data"
  delivery_matrix:
    locales: ["EN/LTR", "AR/RTL"]
    themes: ["light", "dark"]
    viewports: ["1200x800", "1024x768", "412x915", "390x844", "320x800 reflow"]
    accessibility: "Keyboard map alternatives, visible focus, semantic labels, non-colour status cues and applicable WCAG checks."

wiring_contract:
  real_services:
    - "Supabase server reads for factories, visits and existing telemetry sources established by repository contracts."
    - "Existing authenticated user verification and region/branch permission scope."
    - "Existing Mapbox/provider boundary; fail closed when provider configuration is unavailable."
  rls_rbac:
    - "Positive Operations role within authorized geography."
    - "Negative role and out-of-scope region/branch/entity tests."
    - "Inspector location is visible only during the contract-authorized active journey/execution window."
  audit:
    - "No write action is introduced by this monitoring slice."
    - "Any existing audited drilldown or export boundary remains unchanged and is regression tested."
  truth_rules:
    - "Source and observation time must be visible or programmatically available for each live-position claim."
    - "Freshness derives from existing source facts/configuration; no interval or threshold may be invented."
    - "Future-dated, fixture and missing-timestamp records cannot be represented as live."
    - "A failed telemetry/provider source degrades only its bounded widget and never breaks the route."

