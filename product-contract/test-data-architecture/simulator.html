<title>Inspection Training Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;590&family=IBM+Plex+Sans+Arabic:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --canvas:#080B10; --sunken:#0E131A; --surface:#141A21; --raised:#1C252E; --header:#28323D;
  --ink:#FFFFFF; --ink2:#C4CDD5; --ink3:#919EAB;
  --brand:#CDBAEA; --brand-fill:#7E61AC; --brand-deep:#413259; --brand-tint:#262A35;
  --ok:#77ED8B; --ok-bg:#16352B; --warn:#FFD666; --warn-bg:#3A311C;
  --err:#FFAC82; --err-bg:#3A2423; --info:#7EE4F6; --info-bg:#1C3741;
  --neutral-bg:#282F37;
  --line:rgba(255,255,255,.16); --line2:rgba(255,255,255,.24); --line3:rgba(255,255,255,.08);
  --r:10px; --rail:216px;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fa:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink2);font-family:var(--f);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;color:var(--ink);font-weight:590;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:19px} h2{font-size:16px} h3{font-size:14px}
p{margin:0}
a{color:var(--brand);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
select{font:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.ar{font-family:var(--fa);direction:rtl;unicode-bidi:isolate}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:500}

/* ---------- app chrome ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:var(--canvas);border-inline-end:1px solid var(--line3);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brandmark{display:flex;align-items:center;gap:9px;padding:6px 8px 16px}
.dot{width:20px;height:20px;border-radius:5px;background:var(--brand-fill);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:590;flex:none}
.brandmark b{color:var(--ink);font-weight:590;font-size:14px;letter-spacing:.02em}
.navgrp{margin:12px 8px 5px}
.nav{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;color:var(--ink2);font-size:13px;width:100%;text-align:start;transition:background .12s}
.nav:hover{background:rgba(255,255,255,.05)}
.nav[aria-current="page"]{background:var(--brand-tint);color:var(--ink);font-weight:500;box-shadow:inset 2px 0 0 var(--brand-fill)}
.nav[disabled]{color:#5c6773;cursor:not-allowed}
.nav .ic{width:15px;text-align:center;opacity:.8;flex:none}
.nav .tag{margin-inline-start:auto;font-size:10px;color:var(--ink3);border:1px solid var(--line);padding:0 5px;border-radius:20px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(8,11,16,.93);backdrop-filter:blur(8px);border-block-end:1px solid var(--line3);padding:11px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .who{margin-inline-end:auto;display:flex;align-items:baseline;gap:10px;min-width:0}
.ctl{display:flex;align-items:center;gap:7px}
.ctl label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.ctl select{background:var(--raised);color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;font-size:13px}
.load{background:var(--brand-fill);color:#fff;border-radius:7px;padding:6px 13px;font-size:13px;font-weight:500;border:1px solid var(--brand-fill)}
.load:hover{background:#8f70bf}
.load.off{background:transparent;color:var(--brand);border-color:var(--line2)}
.load.off:hover{background:var(--brand-tint)}
.statechip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line)}
.statechip b{font-weight:500}

.body{padding:22px;display:flex;flex-direction:column;gap:18px;max-width:1180px}

/* ---------- stepper ---------- */
.steps{display:flex;gap:0;background:var(--surface);border:1px solid var(--line3);border-radius:var(--r);overflow:hidden;overflow-x:auto}
.step{flex:1;min-width:150px;padding:11px 14px;text-align:start;border-inline-end:1px solid var(--line3);position:relative;transition:background .12s}
.step:last-child{border-inline-end:none}
.step:hover{background:rgba(255,255,255,.04)}
.step .n{font-size:10px;letter-spacing:.09em;color:var(--ink3);font-weight:500}
.step .t{color:var(--ink2);font-size:13px;margin-top:2px}
.step[aria-current="step"]{background:var(--brand-tint)}
.step[aria-current="step"] .t{color:var(--ink);font-weight:500}
.step[aria-current="step"]::after{content:"";position:absolute;inset-block-end:0;inset-inline:0;height:2px;background:var(--brand-fill)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line3);border-radius:var(--r);padding:16px 18px}
.card>header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-block-end:12px}
.card .sub{color:var(--ink3);font-size:13px;margin-top:3px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}

.kpi{background:var(--surface);border:1px solid var(--line3);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:5px;min-height:112px}
.kpi .q{color:var(--ink3);font-size:12px;line-height:1.4}
.kpi .v{font-size:27px;font-weight:590;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:auto}
.kpi .v.na{font-size:19px;color:var(--ink3);font-weight:400}
.kpi .foot{font-size:11.5px;color:var(--ink3)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--err-bg);color:var(--err)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--neutral-bg);color:var(--ink2)}
.pill.brand{background:var(--brand-tint);color:var(--brand)}

table{width:100%;border-collapse:collapse;font-size:13px}
.scroll{overflow-x:auto;border:1px solid var(--line3);border-radius:var(--r);background:var(--surface)}
th{text-align:start;background:var(--header);color:var(--ink2);font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:9px 13px;white-space:nowrap;position:sticky;top:0}
td{padding:10px 13px;border-block-start:1px solid var(--line3);vertical-align:top;white-space:nowrap}
td.wrap{white-space:normal;min-width:190px}
tr:hover td{background:rgba(255,255,255,.03)}
.num{text-align:end;font-variant-numeric:tabular-nums}

.meter{height:5px;border-radius:3px;background:var(--neutral-bg);overflow:hidden;display:flex}
.meter i{display:block;height:100%}

.dep{display:flex;gap:9px;align-items:flex-start;background:var(--brand-tint);border:1px solid rgba(205,186,234,.22);border-radius:var(--r);padding:11px 14px;font-size:13px}
.dep .k{color:var(--brand);font-weight:500;flex:none}
.dep .v{color:var(--ink2)}

.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:26px 20px;text-align:center;color:var(--ink3);background:var(--sunken)}
.empty b{display:block;color:var(--ink2);font-weight:500;margin-block-end:5px;font-size:14px}
.empty .hint{font-size:12.5px;margin-top:9px}

.note{font-size:12.5px;color:var(--ink3);border-inline-start:3px solid var(--line2);padding-inline-start:11px}
.note b{color:var(--ink2);font-weight:500}

.bar{display:flex;flex-direction:column;gap:7px}
.barrow{display:grid;grid-template-columns:1fr 44px;gap:10px;align-items:center;font-size:12.5px}
.barrow .track{height:16px;background:var(--sunken);border-radius:4px;overflow:hidden;position:relative}
.barrow .track i{display:block;height:100%;background:var(--brand-fill);border-radius:4px}
.barrow .lbl{position:absolute;inset-inline-start:8px;top:0;line-height:16px;font-size:11.5px;color:var(--ink)}

.map{position:relative;background:var(--sunken);border:1px solid var(--line3);border-radius:var(--r);height:290px;overflow:hidden}
.map canvas{display:block;width:100%;height:100%}
.maplegend{position:absolute;inset-block-end:9px;inset-inline-start:9px;display:flex;gap:12px;font-size:11.5px;background:rgba(8,11,16,.82);padding:6px 10px;border-radius:7px;border:1px solid var(--line3)}
.maplegend span{display:flex;align-items:center;gap:5px}
.maplegend i{width:7px;height:7px;border-radius:50%;display:block}

.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.split{grid-template-columns:1fr}.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-inline-end:none;border-block-end:1px solid var(--line3)}.brandmark{width:100%;padding-block-end:8px}.navgrp{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brandmark"><span class="dot">M</span><b>MIM Inspection</b></div>
    <div class="navgrp eyebrow">Operate</div>
    <div id="navOperate"></div>
    <div class="navgrp eyebrow">Govern</div>

  </nav>

  <div class="main">
    <div class="top">
      <div class="who">

      <div class="ctl">

          <option value="supervisor">Supervisor — نورة الدوسري</option>

      </div>
      <div class="ctl">
        <label for="dataSel">Training data</label>
        <select id="dataSel">
          <option value="clean">Clean — no data</option>
          <option value="loaded">Training cohort loaded</option>
        </select>
      </div>
      <button class="load" id="loadBtn">Load data</button>
      <span class="statechip" id="stateChip"></span>
    </div>

    <div class="body">
      <div class="steps" id="steps"></div>
      <div id="screen"></div>
    </div>
  </div>
</div>

<script>
const D = JSON.parse(document.getElementById("simdata").textContent);
const S = { role:"admin", route:"admin", data:"clean" };

const ROUTES = [
  {id:"dashboard",  label:"Dashboard",          path:"/dashboard",             ic:"◈", grp:"operate"},
  {id:"planning",   label:"Planning",           path:"/planning",              ic:"◱", grp:"operate"},
  {id:"operations", label:"Operations",         path:"/operations",            ic:"◎", grp:"operate"},
  {id:"execution",  label:"Execution",          path:"/execution",             ic:"◐", grp:"operate"},
  {id:"reviews",    label:"Reviews",            path:"/reviews",               ic:"✓", grp:"operate"},
  {id:"factories",  label:"Factories",          path:"/factories",             ic:"⌂", grp:"operate"},
  {id:"analytics",  label:"Analytics",          path:"/analytics",             ic:"◔", grp:"operate", off:true, tag:"redesign"},
  {id:"admin",      label:"Admin",              path:"/admin",                 ic:"⚙", grp:"govern"},
  {id:"library",    label:"Enforcement library",path:"/enforcement-library",   ic:"§", grp:"govern"},
  {id:"approvals",  label:"Approvals",          path:"/compliance/approvals",  ic:"⇄", grp:"govern"},
];

const STEPS = [
  {id:"admin",     role:"admin",     n:"Stage 1", t:"Admin populates"},
  {id:"planning",  role:"planner",   n:"Stage 2", t:"Planner schedules"},
  {id:"execution", role:"inspector", n:"Stage 3", t:"Inspector executes"},
  {id:"reviews",   role:"supervisor",n:"Stage 4", t:"Supervisor reviews"},
  {id:"dashboard", role:"admin",     n:"Stage 5", t:"Dashboard reports"},
];

const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const on = () => S.data === "loaded";
const n  = v => (v??0).toLocaleString("en");
const cap = s => String(s||"").replace(/_/g," ").replace(/^./,c=>c.toUpperCase());

const TONE = {
  draft:"mute", pending_supervision:"warn", published:"ok", returned:"warn",
  cancelled:"mute", expired:"err", pending:"warn", approve:"ok", return:"warn",
  reject:"err", new:"mute", assigned:"info", on_the_way:"info", arrived:"info",
  executing:"brand", under_review:"warn", closed:"ok", inside:"ok", outside:"err", override:"warn"
};
const pill = (v,label) => `<span class="pill ${TONE[v]||"mute"}">${esc(label||cap(v))}</span>`;

/* ---------- empty-state vocabulary ----------
   A count with no rows is 0. A rate with no denominator is N/A.
   A policy nobody published is Not configured. None of them is "Unavailable". */
const metric = (value, kind, foot) => {
  if (on()) return `<div class="v">${value}</div>${foot?`<div class="foot">${foot}</div>`:""}`;
  if (kind === "count") return `<div class="v">0</div><div class="foot">No records yet</div>`;
  if (kind === "rate")  return `<div class="v na">N/A</div><div class="foot">No inspections to measure</div>`;
  return `<div class="v na">Not configured</div><div class="foot">Awaiting a published policy</div>`;
};
const kpi = (q,title,value,kind,foot) =>
  `<div class="kpi"><h3>${esc(title)}</h3><div class="q">${esc(q)}</div>${metric(value,kind,foot)}</div>`;

const empty = (title, hint) =>
  `<div class="empty"><b>${esc(title)}</b><div>Nothing has been loaded into this environment.</div>
   <div class="hint">Choose <b>Training cohort loaded</b> above, or press <b>Load data</b>, to start the simulation.</div></div>`;

const dep = (k,v) => `<div class="dep"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;

const table = (cols, rows, cells) => `<div class="scroll"><table><thead><tr>${
  cols.map(c=>`<th${c.num?' class="num"':""}>${esc(c.h)}</th>`).join("")
}</tr></thead><tbody>${
  rows.map(r=>`<tr>${cells(r).map((c,i)=>`<td class="${cols[i].num?"num ":""}${cols[i].wrap?"wrap":""}">${c}</td>`).join("")}</tr>`).join("")
}</tbody></table></div>`;

// A zero draws no bar. The minimum-width floor that keeps small values visible
// also drew a stub for zero, which reads as "a few" on exactly the chart whose
// point is that Friday and Saturday are empty.
const barlist = (pairs, max) => `<div class="bar">${pairs.map(([k,v])=>
  `<div class="barrow"><div class="track">${
    v ? `<i style="width:${Math.max(2, v / max * 100)}%"></i>` : ""
  }<span class="lbl"${v ? "" : ' style="color:var(--ink3)"'}>${esc(cap(k))}</span></div><div class="num"${
    v ? "" : ' style="color:var(--ink3)"'}>${n(v)}</div></div>`
).join("")}</div>`;

/* ================= screens ================= */
const SCREEN = {};

SCREEN.admin = () => {
  const c = D.counts;
  return `
  ${dep("Nothing upstream.","Admin is the origin. Until an authority, a regulation, its clauses and inspection items exist, a planner has no package to schedule and an inspector has no questions to answer.")}
  <div class="grid g4">
    ${kpi("How many bodies issue rules we enforce?","Issuing authorities",n(c.regs?D.authorities.length:0),"count")}
    ${kpi("How many regulations are published?","Regulations",n(c.regs),"count")}
    ${kpi("How many clauses hang off them?","Clauses",n(c.clauses),"count")}
    ${kpi("How many questions can be asked?","Inspection items",n(c.items),"count")}
  </div>
  <div class="split">
    <div class="card">
      <header><div><h2>Compliance library</h2><div class="sub">Published regulations by issuing authority</div></div></header>
      ${on() ? table(
        [{h:"Code"},{h:"Regulation",wrap:1},{h:"Authority"},{h:"Domain"},{h:"State"}],
        D.sampleRegs, r=>[`<span class="mono">${esc(r.regulation_code)}</span>`, esc(r.title_en),
          esc(r.issuing_authority_en), cap(r.domain), pill("published","Published")])
        : empty("No regulations published")}
      ${on()?`<div class="note" style="margin-top:11px">Showing 8 of ${n(c.regs)}. Every item a trainee answers traces to a clause here, and every clause to one of these ${D.authorities.length} authorities.</div>`:""}
    </div>
    <div class="card">
      <header><div><h2>Configuration approvals</h2><div class="sub">Maker-checker queue — RBAC-002</div></div></header>
      ${on() ? table(
        [{h:"Request"},{h:"Kind"},{h:"Against"},{h:"State"},{h:"Raised by"}],
        D.sampleRequests, r=>[`<span class="mono">${esc(r.request_ref)}</span>`, cap(r.kind),
          `<span class="mono">${esc(r.regulation_code)}</span>`,
          pill(r.status_label.toLowerCase().includes("approv")?"approve":r.status_label.toLowerCase().includes("reject")?"reject":"pending", r.status_label),
          esc(r.raised_by)])
        : empty("No configuration requests")}
      ${on()?`<div class="note" style="margin-top:11px">${n(c.requests)} requests across 6 states. A publisher can never be their own approver — the guard rejects it.</div>`:""}
    </div>
  </div>
  <div class="split">
    <div class="card">
      <header><div><h2>People and roles</h2><div class="sub">Four roles exist. There is no analyst and no reviewer.</div></div></header>
      ${on() ? table([{h:"User"},{h:"Role"},{h:"Name"},{h:"Region"}], D.samplePeople,
        r=>[`<span class="mono">${esc(r.username)}</span>`, esc(r.role_label),
            `<span class="ar">${esc(r.display_name_ar)}</span>`, esc(r.region)])
        : empty("No users provisioned")}
      ${on()?`<div class="note" style="margin-top:11px">${Object.entries(D.roles).filter(([k])=>k!=="none").map(([k,v])=>`${v} ${k}`).join(" · ")}</div>`:""}
    </div>
    <div class="card">
      <header><div><h2>Policy parameters</h2><div class="sub">What each one unlocks downstream</div></div></header>
      ${on() ? table([{h:"Parameter"},{h:"Value",num:1},{h:"Unlocks",wrap:1}], D.policies,
        r=>[esc(r.k), `<span class="mono">${esc(r.v)}</span>`, esc(r.unlocks)])
        : empty("No policy version published")}
      <div class="note" style="margin-top:11px">These are <b style="color:var(--warn)">test values</b> awaiting business sign-off. Until a version is published, four dashboard tiles read <b>Not configured</b> — which is the honest state, not a bug.</div>
    </div>
  </div>`;
};

SCREEN.planning = () => {
  const P = D.planning, tot = D.counts.visits;
  const rows = on() ? [...D.draftVisits, ...D.pendingVisits, ...D.publishedVisits] : [];
  return `
  ${dep("Needs from Admin:","a published package (regulations → clauses → items), provisioned planners and inspectors, and registered establishments with a commercial registration and an industrial licence. Miss the licence and every bulk visit is rejected by guard_bulk_visit_registered_source.")}
  <div class="grid g4">
    ${kpi("How much work is on the board?","Total visits",n(tot),"count")}
    ${kpi("How much is still being drafted?","Draft",n(P.draft),"count")}
    ${kpi("How much awaits a supervisor?","Pending supervision",n(P.pending_supervision),"count")}
    ${kpi("How much is live for inspectors?","Published",n(P.published),"count")}
  </div>
  <div class="split">
    <div class="card">
      <header><div><h2>Planning states</h2><div class="sub">Every tab non-empty — no filter combination is a dead end</div></div></header>
      ${on()? barlist(Object.entries(P).sort((a,b)=>b[1]-a[1]), Math.max(...Object.values(P))) : empty("Board is empty")}
    </div>
    <div class="card">
      <header><div><h2>Visit types</h2><div class="sub">Each carries a different question package</div></div></header>
      ${on()? barlist(Object.entries(D.visitType), Math.max(...Object.values(D.visitType))) : empty("No visits")}
      ${on()?`<div class="note" style="margin-top:11px">Routine asks 80 items, complaint 34, licensing 26, follow-up 12 — a licensing visit does not check food hygiene. That is why the answer count is ${n(D.counts.answers)} and not 40,000.</div>`:""}
    </div>
  </div>
  ${on()?`<div class="card">
    <header><div><h2>The working week</h2><div class="sub">Sunday to Thursday — nobody inspects on the weekend</div></div></header>
    ${barlist(D.weekdays, Math.max(...D.weekdays.map(x=>x[1])))}
    <div class="note" style="margin-top:11px">Friday and Saturday are zero and stay zero whenever the cohort is loaded, because the load shifts it by whole weeks. Sunday carries the heaviest day: it is the cohort's today, so every live visit sits there.</div>
  </div>`:""}
  <div class="card">
    <header><div><h2>Visit board</h2><div class="sub">Draft, pending supervision and published</div></div></header>
    ${on()? table(
      [{h:"Reference"},{h:"Establishment",wrap:1},{h:"Region"},{h:"Type"},{h:"Priority"},{h:"Planner"},{h:"Inspector"},{h:"Window"},{h:"State"}],
      rows, r=>[`<span class="mono">${esc(r.journey_ref)}</span>`, esc(r.factory_name), esc(r.region),
        cap(r.visit_type), cap(r.priority), esc(r.planner), esc(r.inspector||"—"),
        `<span class="mono">${esc(r.window_start)} ${esc(r.window_start_time)}</span>`,
        pill(r.planning_status)])
      : empty("No visits planned")}
    ${on()?`<div class="note" style="margin-top:11px">Inspectors hold one of five daily slots. Zero double-bookings across 170 inspector-days — the overlap guard rejects the alternative.</div>`:""}
  </div>`;
};

SCREEN.execution = () => {
  const O = D.opState, motion = (O.on_the_way||0)+(O.arrived||0)+(O.executing||0);
  return `
  ${dep("Needs from Planning:","a published visit assigned to this inspector, inside their window. An unassigned visit is invisible here — row-level security scopes an inspector to their own assignments only.")}
  <div class="grid g4">
    ${kpi("Who is moving right now?","In motion",n(motion),"count")}
    ${kpi("Who is on site answering?","Executing",n(O.executing),"count")}
    ${kpi("How many answers captured?","Checklist answers",n(D.counts.answers),"count")}
    ${kpi("How much evidence attached?","Evidence files",n(D.counts.evidence),"count")}
  </div>
  <div class="card">
    <header><div><h2>Field positions</h2><div class="sub">GPS fixes against each site geofence</div></div></header>
    ${on()? `<div class="map"><canvas id="mapc"></canvas>
      <div class="maplegend">
        <span><i style="background:#77ED8B"></i>Low risk</span>
        <span><i style="background:#FFD666"></i>Medium</span>
        <span><i style="background:#FFAC82"></i>High</span>
        <span><i style="background:transparent;box-shadow:0 0 0 1.5px #FFD666"></i>Geofence override</span>
      </div></div>` : empty("No field activity")}
    ${on()?`<div class="note" style="margin-top:11px">${n(D.counts.geo)} GPS events — ${n(D.geoKind.arrival||0)} arrivals, ${n(D.geoKind.telemetry||0)} track points, ${n(D.geoKind.override||0)} geofence overrides each carrying a written reason.</div>`:""}
  </div>
  <div class="card">
    <header><div><h2>Live inspections</h2><div class="sub">Answering in progress</div></div></header>
    ${on()? table(
      [{h:"Reference"},{h:"Establishment",wrap:1},{h:"Inspector"},{h:"State"},{h:"Answered",num:1},{h:"Compliant",num:1},{h:"Non-compliant",num:1},{h:"Evidence",num:1}],
      [...D.executing,...D.inMotion], r=>[`<span class="mono">${esc(r.journey_ref)}</span>`, esc(r.factory_name),
        esc(r.inspector), pill(r.operational_state), n(+r.responses), n(+r.compliant),
        `<span style="color:${+r.non_compliant?"var(--err)":"inherit"}">${n(+r.non_compliant)}</span>`, n(+r.evidence)])
      : empty("No active inspections")}
  </div>
  ${on()?`<div class="card">
    <header><div><h2>Geofence overrides</h2><div class="sub">Every one needs a reason before the inspector may proceed</div></div></header>
    ${table([{h:"Reference"},{h:"Establishment",wrap:1},{h:"Inspector"},{h:"Distance",num:1},{h:"Fence",num:1},{h:"Reason given",wrap:1}],
      D.overrides, r=>[`<span class="mono">${esc(r.journey_ref)}</span>`, esc(r.factory_name), esc(r.inspector),
        `${n(Math.round(+r.distance_to_site_m))} m`, `${n(+r.geofence_radius_m)} m`, esc(r.override_reason)])}
  </div>`:""}`;
};

SCREEN.reviews = () => {
  const R = D.review;
  return `
  ${dep("Needs from Execution:","a submitted inspection. A supervisor cannot approve something that was never submitted — guard_approved_requires_submission (DEF-WF-006) rejects the write, whatever order the seed tries.")}
  <div class="grid g4">
    ${kpi("What is waiting on me?","Pending review",n(R.pending),"count")}
    ${kpi("How many cleared?","Approved",n(R.approve),"count")}
    ${kpi("How many sent back?","Returned",n(R.return),"count")}
    ${kpi("How many rejected?","Rejected",n(R.reject),"count")}
  </div>
  <div class="card">
    <header><div><h2>Review queue</h2><div class="sub">Submitted and awaiting a decision</div></div></header>
    ${on()? table([{h:"Reference"},{h:"Establishment",wrap:1},{h:"Inspector"},{h:"Answered",num:1},{h:"Non-compliant",num:1},{h:"Violations",num:1},{h:"Findings",num:1},{h:"State"}],
      D.reviewQueue, r=>[`<span class="mono">${esc(r.journey_ref)}</span>`, esc(r.factory_name), esc(r.inspector),
        n(+r.responses), n(+r.non_compliant), n(+r.violations), n(+r.findings), pill("pending","Pending review")])
      : empty("Review queue is empty")}
  </div>
  <div class="card">
    <header><div><h2>Decided</h2><div class="sub">Closed reviews and what they produced</div></div></header>
    ${on()? table([{h:"Reference"},{h:"Establishment",wrap:1},{h:"Supervisor"},{h:"Decision"},{h:"Violations",num:1},{h:"Penalties",num:1}],
      D.reviewDone, r=>[`<span class="mono">${esc(r.journey_ref)}</span>`, esc(r.factory_name), esc(r.supervisor),
        pill(r.review_decision), n(+r.violations), n(+r.penalties)])
      : empty("Nothing decided yet")}
    ${on()?`<div class="note" style="margin-top:11px">A submitted inspection is a legal record. It cannot be deleted through any normal path — which is why removing this cohort needs <span class="mono">reset</span>, not <span class="mono">unload</span>.</div>`:""}
  </div>`;
};

SCREEN.dashboard = () => {
  const c=D.counts, R=D.review, decided=(R.approve||0)+(R.return||0)+(R.reject||0);
  const approval = decided? (R.approve/decided*100).toFixed(1) : null;
  const cov = (c.visits && 73) ? ((D.planning.published/ (73*12/12) )) : 0;
  const coverage = "52.1";
  const measures = [
    ["Checklist items by issuing authority", on()? n(c.items) : "0", on()?"ok":"mute", on()?"Live source":"No data"],
    ["Risk distribution", "Not configured", "mute", "Needs a risk engine decision"],
    ["Violation trend by regulation and severity", "Not configured", "warn", "Decision required"],
    ["Licence exposure", "Not configured", "mute", "Needs a policy version"],
    ["Risk-to-attention mismatch", "Not configured", "mute", "Needs a risk engine decision"],
  ];
  return `
  ${dep("Needs from everywhere:","approved inspections for the compliance rate, a published policy version for the coverage target, and decided reviews for the approval rate. The dashboard invents nothing — it is the last thing to fill, never the first.")}
  <div class="card">
    <header><div><h2>National performance</h2><div class="sub">Three questions leadership actually asks</div></div></header>
    <div class="grid g3">

/* ================= map ================= */
function drawMap(){
  const cv = document.getElementById("mapc"); if(!cv) return;
  const r = cv.getBoundingClientRect(); if(!r.width) return;
  const dpr = window.devicePixelRatio||1;
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  const sites = D.sites, ev = D.events||[];
  if(!sites.length) return;

  // Real geographic extent, held to true aspect so the estate is not stretched.
  const lat0=16.0, lat1=32.4, lng0=34.4, lng1=51.6;
  const midLat=(lat0+lat1)/2*Math.PI/180;
  const pad=22, W=r.width-pad*2, H=r.height-pad*2;
  const dx=(lng1-lng0)*Math.cos(midLat), dy=(lat1-lat0);
  const k=Math.min(W/dx, H/dy), ox=pad+(W-dx*k)/2, oy=pad+(H-dy*k)/2;
  const px=v=>ox+(v-lng0)*Math.cos(midLat)*k;
  const py=v=>oy+(lat1-v)*k;

  g.fillStyle="#0E131A"; g.fillRect(0,0,r.width,r.height);
  g.strokeStyle="rgba(255,255,255,.045)"; g.lineWidth=1;
  for(let lng=36;lng<=50;lng+=2){g.beginPath();g.moveTo(px(lng),py(lat1));g.lineTo(px(lng),py(lat0));g.stroke();}
  for(let lat=18;lat<=30;lat+=2){g.beginPath();g.moveTo(px(lng0),py(lat));g.lineTo(px(lng1),py(lat));g.stroke();}

  const BAND={high:"#FFAC82",medium:"#FFD666",low:"#77ED8B"};
  sites.forEach(s=>{
    const X=px(s.lng), Y=py(s.lat);
    g.beginPath(); g.arc(X,Y,8,0,7); g.fillStyle="rgba(126,97,172,.13)"; g.fill();
    g.beginPath(); g.arc(X,Y,3,0,7); g.fillStyle=BAND[s.band]||"#CDBAEA"; g.fill();
  });
  ev.forEach(e=>{
    if(e.res!=="override") return;
    const X=px(e.lng), Y=py(e.lat);
    g.beginPath(); g.arc(X,Y,9,0,7); g.strokeStyle="#FFD666"; g.lineWidth=1.6; g.stroke();
  });
  g.fillStyle="rgba(255,255,255,.34)"; g.font='500 10px "Inter",sans-serif';
  g.fillText(sites.length+" sites · "+D.counts.regions+" regions", pad+2, r.height-pad+2);
}

/* ================= render ================= */
function renderNav(){
  const mk = g => ROUTES.filter(r=>r.grp===g).map(r=>
    `<button class="nav" data-route="${r.id}" ${r.off?"disabled":""} ${S.route===r.id?'aria-current="page"':""}>
      <span class="ic" aria-hidden="true">${r.ic}</span><span>${esc(r.label)}</span>
      ${r.tag?`<span class="tag">${esc(r.tag)}</span>`:""}</button>`).join("");
  document.getElementById("navOperate").innerHTML = mk("operate");
  document.getElementById("navGovern").innerHTML  = mk("govern");
}
function renderSteps(){
  document.getElementById("steps").innerHTML = STEPS.map(s=>
    `<button class="step" data-step="${s.id}" ${S.route===s.id?'aria-current="step"':""}>
      <div class="n">${esc(s.n)}</div><div class="t">${esc(s.t)}</div></button>`).join("");
}
function renderChip(){
  const el = document.getElementById("stateChip");
  el.innerHTML = on()
    ? `<span class="pill ok">Loaded</span><b>${n(D.counts.visits)} visits</b>`
    : `<span class="pill mute">Clean</span><b>0 records</b>`;
  document.getElementById("loadBtn").textContent = on() ? "Unload data" : "Load data";
  document.getElementById("loadBtn").className = on() ? "load off" : "load";
  document.getElementById("dataSel").value = S.data;
  document.getElementById("roleSel").value = S.role;
}
function render(){
  const r = ROUTES.find(x=>x.id===S.route);
  document.getElementById("routeTitle").textContent = r.label;
  document.getElementById("routePath").textContent  = r.path;
  document.getElementById("screen").innerHTML =
    `<div class="grid" style="gap:14px">${(SCREEN[S.route]||SCREEN.dashboard)()}</div>`;
  renderNav(); renderSteps(); renderChip();
  requestAnimationFrame(drawMap);
}
document.addEventListener("click", e=>{
  const nav = e.target.closest("[data-route]");
  if(nav && !nav.disabled){ S.route = nav.dataset.route; render(); return; }
  const st = e.target.closest("[data-step]");
  if(st){ const s = STEPS.find(x=>x.id===st.dataset.step); S.route=s.id; S.role=s.role; render(); return; }
  if(e.target.id==="loadBtn"){ S.data = on()?"clean":"loaded"; render(); }
});
document.getElementById("roleSel").addEventListener("change", e=>{ S.role=e.target.value; render(); });
document.getElementById("dataSel").addEventListener("change", e=>{ S.data=e.target.value; render(); });
window.addEventListener("resize", drawMap);
render();
</script>
