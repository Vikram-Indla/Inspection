  }

    --brand:#C0A8E0; --accent:#A183D0; --line:#2E2840; --hair:#262032;
    --ok:#5CCB9E; --ok-bg:#12281F; --warn:#E0AC46; --warn-bg:#2C2210;
    --bad:#E28E98; --bad-bg:#301A1E; --info:#7FB2E0; --info-bg:#15222E;}}

    --ground:#100D16; --shell:#0B0910; --shellink:#B9B1CB; --shellhi:#241C33;
    --surface:#1A1622; --sunk:#221C2E; --ink:#EFEBF5; --body:#CEC7DB; --muted:#948CA8;
    --brand:#C0A8E0; --accent:#A183D0; --line:#2E2840; --hair:#262032;
    --ok:#5CCB9E; --ok-bg:#12281F; --warn:#E0AC46; --warn-bg:#2C2210;
    --bad:#E28E98; --bad-bg:#301A1E; --info:#7FB2E0; --info-bg:#15222E;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--body);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.55}
  code,.mono{font-family:"IBM Plex Mono",monospace;font-size:.85em}
  h1,h2,h3{margin:0;color:var(--ink);font-weight:600}
  h1{font-family:Spectral,Georgia,serif;font-size:1.6rem;letter-spacing:-.01em}
  h2{font-size:1.15rem}h3{font-size:.95rem}
  .app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
  .nav{background:var(--shell);color:var(--shellink);padding:20px 0;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{padding:0 18px 18px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:12px}
  .brand b{color:#fff;font-size:.95rem;letter-spacing:.06em}
  .brand span{font-size:.7rem;opacity:.55;letter-spacing:.14em;text-transform:uppercase}
  .navgroup{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;opacity:.45;padding:14px 18px 6px}
  .navitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 18px;font-size:.85rem;cursor:pointer;border:0;background:none;color:inherit;width:100%;text-align:start;font-family:inherit}
  .navitem:hover{background:var(--shellhi)}
  .navitem[aria-current="true"]{background:var(--shellhi);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
  .navitem .n{font-size:.7rem;opacity:.6;font-variant-numeric:tabular-nums}
  .main{padding:0 0 80px}
  .top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 30px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .roles{display:flex;gap:6px;background:var(--sunk);padding:3px;border-radius:6px}
  .roles button{border:0;background:none;font:inherit;font-size:.8rem;padding:5px 12px;border-radius:4px;cursor:pointer;color:var(--muted)}
  .roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .who{font-size:.78rem;color:var(--muted);margin-inline-start:auto}
  .who b{color:var(--ink)}
  .page{padding:26px 30px;display:flex;flex-direction:column;gap:22px;max-width:1180px}
  .phead{display:flex;flex-direction:column;gap:5px}
  .phead .rt{font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--accent)}
  .phead p{margin:0;font-size:.88rem;color:var(--muted);max-width:74ch}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}

  .tile .k{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-family:Spectral,Georgia,serif;font-size:1.75rem;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
  .tile .s{font-size:.74rem;color:var(--muted)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .filters .lbl{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-inline-end:4px}
  .chipbtn{border:1px solid var(--line);background:var(--surface);font:inherit;font-size:.78rem;padding:4px 11px;border-radius:20px;cursor:pointer;color:var(--body)}
  .chipbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
  .tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .tabs button{border:0;background:none;font:inherit;font-size:.83rem;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
  .tabs button .n{font-size:.72rem;opacity:.65;margin-inline-start:5px;font-variant-numeric:tabular-nums}
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
  table{border-collapse:collapse;width:100%;font-size:.83rem}
  th{text-align:start;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:11px 14px;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 14px;border-bottom:1px solid var(--hair);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:3px;white-space:nowrap;border:1px solid transparent}
  .pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .pill.ok{color:var(--ok);background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
  .pill.warn{color:var(--warn);background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
  .pill.bad{color:var(--bad);background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
  .pill.info{color:var(--info);background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
  .pill.mute{color:var(--muted);background:var(--sunk);border-color:var(--line)}
  .note{font-size:.8rem;color:var(--muted)}
  .empty{padding:34px;text-align:center;color:var(--muted);font-size:.86rem;background:var(--surface);border:1px dashed var(--line);border-radius:7px}
  .empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:5px}
  .split2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:18px;display:flex;flex-direction:column;gap:12px}
  .bar{display:flex;align-items:center;gap:10px;font-size:.8rem}
  .bar .lab{width:132px;color:var(--body);flex:none}
  .bar .track{flex:1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent)}
  .bar .val{width:42px;text-align:end;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500;flex:none}
  .mapbox{position:relative;background:var(--sunk);border:1px solid var(--line);border-radius:7px;height:400px;overflow:hidden}
  .mapbox svg{width:100%;height:100%;display:block}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:.83rem}
  .kv dt{color:var(--muted)}.kv dd{margin:0;color:var(--ink)}
  @media (max-width:860px){.app{grid-template-columns:1fr}.nav{position:static;height:auto}}

function render() {
  const nav = document.getElementById("nav");
  nav.replaceChildren($("div", { class: "brand" }, $("b", {}, "INSPECTION"), $("span", {}, "التفتيش")));
  for (const [group, items] of NAV) {
    const vis = items.filter(([id]) => ALLOW[role].has(id));
    if (!vis.length) continue;
    nav.append($("div", { class: "navgroup" }, group));
    for (const [id, label] of vis) {
      const c = id === "planning" ? scoped().length : id === "field" ? J.filter(j => j.inspector === PERSONA.inspector).length : null;
      nav.append($("button", { class: "navitem", "aria-current": String(route === id),
        on: { click: () => { route = id; tab = "all"; render(); window.scrollTo(0, 0); } } },
        label, c != null ? $("span", { class: "n" }, c) : null));
    }
  }
  const rs = document.getElementById("roles");
  rs.replaceChildren(...ROLES.map(([id, label]) => $("button", { "aria-pressed": String(role === id),
    on: { click: () => { role = id; if (!ALLOW[id].has(route)) route = id === "inspector" ? "field" : "dashboard"; tab = "all"; render(); } } }, label)));
  const who = D.personas.find(x => x.username === PERSONA[role]);
  document.getElementById("who").replaceChildren($("span", { dir: "auto" }, who ? who.display_name_ar : ""), " · ",
    $("b", {}, PERSONA[role]), " · " + D.meta.journeys + " visits · " + n(D.meta.responses) + " answers · anchor " + D.meta.anchor);
  const page = document.getElementById("page");
  page.replaceChildren(...(PAGES[route] ? PAGES[route]() : [head("", "Not built", "")]));
