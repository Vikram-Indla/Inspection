<title>Inspection UAT Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;590&family=IBM+Plex+Sans+Arabic:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --canvas:#080B10; --sunken:#0E131A; --surface:#141A21; --raised:#1C252E; --header:#28323D;
  --ink:#FFFFFF; --ink2:#C4CDD5; --ink3:#919EAB;
  --brand:#CDBAEA; --brand-fill:#7E61AC; --brand-tint:#262A35;
  --ok:#77ED8B; --ok-bg:#16352B; --warn:#FFD666; --warn-bg:#3A311C;
  --err:#FFAC82; --err-bg:#3A2423; --info:#7EE4F6; --info-bg:#1C3741;
  --neutral-bg:#282F37;
  --line:rgba(255,255,255,.16); --line2:rgba(255,255,255,.24); --line3:rgba(255,255,255,.08);
  --r:10px; --rail:216px;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fa:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink2);font-family:var(--f);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;color:var(--ink);font-weight:590;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:19px} h2{font-size:16px} h3{font-size:14px}
a{color:var(--brand);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
select{font:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.ar{font-family:var(--fa);direction:rtl;unicode-bidi:isolate}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:500}

.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:var(--canvas);border-inline-end:1px solid var(--line3);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brandmark{display:flex;align-items:center;gap:9px;padding:6px 8px 16px}
.dot{width:20px;height:20px;border-radius:5px;background:var(--brand-fill);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:590;flex:none}
.brandmark b{color:var(--ink);font-weight:590;font-size:14px}
.navgrp{margin:12px 8px 5px}
.nav{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;color:var(--ink2);font-size:13px;width:100%;text-align:start;transition:background .12s}
.nav:hover{background:rgba(255,255,255,.05)}
.nav[aria-current="page"]{background:var(--brand-tint);color:var(--ink);font-weight:500;box-shadow:inset 2px 0 0 var(--brand-fill)}
.nav[disabled]{color:#5c6773;cursor:not-allowed}
.nav .ic{width:15px;text-align:center;opacity:.8;flex:none}
.nav .n{margin-inline-start:auto;font-size:11px;color:var(--brand);font-variant-numeric:tabular-nums}
.nav .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The Inspection subgroup: a labelled header with its children indented under a
   hairline, the way the application draws it. */
.subgroup{margin:2px 0 2px}
.subhead{display:flex;align-items:center;gap:9px;padding:7px 9px;margin:0;color:var(--ink3);font-size:13px}
.subhead .ic{width:15px;text-align:center;opacity:.8;flex:none}
.nav.child{margin-inline-start:22px;padding-inline-start:12px;border-inline-start:1px solid var(--line3);border-radius:0 7px 7px 0}
.nav.child[aria-current="page"]{border-inline-start-color:var(--brand-fill)}
.rail{scrollbar-width:thin}
.nav .tag{margin-inline-start:auto;font-size:10px;color:var(--ink3);border:1px solid var(--line);padding:0 5px;border-radius:20px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(8,11,16,.93);backdrop-filter:blur(8px);border-block-end:1px solid var(--line3);padding:11px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .who{margin-inline-end:auto;display:flex;align-items:baseline;gap:10px;min-width:0}
.ctl{display:flex;align-items:center;gap:7px}
.ctl label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.ctl select{background:var(--raised);color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;font-size:13px;max-width:270px}
.load{background:var(--brand-fill);color:#fff;border-radius:7px;padding:6px 13px;font-size:13px;font-weight:500;border:1px solid var(--brand-fill)}
.load:hover{background:#8f70bf}
.load.off{background:transparent;color:var(--brand);border-color:var(--line2)}
.load.off:hover{background:var(--brand-tint)}
.statechip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line)}
.statechip b{font-weight:500}

.body{padding:22px;display:flex;flex-direction:column;gap:18px;max-width:1180px}

.steps{display:flex;background:var(--surface);border:1px solid var(--line3);border-radius:var(--r);overflow:hidden;overflow-x:auto}
.step{flex:1;min-width:152px;padding:11px 14px;text-align:start;border-inline-end:1px solid var(--line3);position:relative;transition:background .12s}
.step:last-child{border-inline-end:none}
.step:hover{background:rgba(255,255,255,.04)}
.step .n{font-size:10px;letter-spacing:.09em;color:var(--ink3);font-weight:500}
.step .t{color:var(--ink2);font-size:13px;margin-top:2px}
.step .c{font-size:11px;color:var(--brand);font-variant-numeric:tabular-nums;margin-top:1px}
.step[aria-current="step"]{background:var(--brand-tint)}
.step[aria-current="step"] .t{color:var(--ink);font-weight:500}
.step[aria-current="step"]::after{content:"";position:absolute;inset-block-end:0;inset-inline:0;height:2px;background:var(--brand-fill)}

.card{background:var(--surface);border:1px solid var(--line3);border-radius:var(--r);padding:16px 18px}
.card>header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-block-end:12px}
.card .sub{color:var(--ink3);font-size:13px;margin-top:3px}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.kpi{background:var(--surface);border:1px solid var(--line3);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:5px;min-height:112px}
.kpi .v{font-size:27px;font-weight:590;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:auto}
.kpi .v.na{font-size:19px;color:var(--ink3);font-weight:400}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--err-bg);color:var(--err)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--neutral-bg);color:var(--ink2)}
.pill.brand{background:var(--brand-tint);color:var(--brand)}

table{width:100%;border-collapse:collapse;font-size:13px}
.scroll{overflow-x:auto;border:1px solid var(--line3);border-radius:var(--r);background:var(--surface)}
th{text-align:start;background:var(--header);color:var(--ink2);font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:9px 13px;white-space:nowrap}
td{padding:9px 13px;border-block-start:1px solid var(--line3);vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal;min-width:180px}
tr:hover td{background:rgba(255,255,255,.03)}
tr.flash td{animation:flash 1.2s ease-out}
@keyframes flash{from{background:rgba(205,186,234,.24)}to{background:transparent}}
.num{text-align:end;font-variant-numeric:tabular-nums}
.end{text-align:end}

.act{border:1px solid var(--line2);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--ink);background:var(--raised);white-space:nowrap}
.act:hover{background:var(--brand-tint);border-color:var(--brand-fill)}
.act.go{background:var(--brand-fill);border-color:var(--brand-fill);color:#fff}
.act.go:hover{background:#8f70bf}
.act.no{color:var(--err);border-color:rgba(255,172,130,.4)}
.act.no:hover{background:var(--err-bg)}
.acts{display:flex;gap:6px;justify-content:flex-end}


.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:24px 20px;text-align:center;color:var(--ink3);background:var(--sunken)}
.empty b{display:block;color:var(--ink2);font-weight:500;margin-block-end:5px;font-size:14px}
.empty .hint{font-size:12.5px;margin-top:9px}


.bar{display:flex;flex-direction:column;gap:7px}
.barrow{display:grid;grid-template-columns:1fr 44px;gap:10px;align-items:center;font-size:12.5px}
.barrow .track{height:16px;background:var(--sunken);border-radius:4px;overflow:hidden;position:relative}
.barrow .track i{display:block;height:100%;background:var(--brand-fill);border-radius:4px;transition:width .45s}
.barrow .lbl{position:absolute;inset-inline-start:8px;top:0;line-height:16px;font-size:11.5px;color:var(--ink)}

.map{position:relative;background:var(--sunken);border:1px solid var(--line3);border-radius:var(--r);height:280px;overflow:hidden}
.map canvas{display:block;width:100%;height:100%}
.maplegend{position:absolute;inset-block-end:9px;inset-inline-start:9px;display:flex;gap:12px;font-size:11.5px;background:rgba(8,11,16,.82);padding:6px 10px;border-radius:7px;border:1px solid var(--line3);flex-wrap:wrap}
.maplegend i{width:7px;height:7px;border-radius:50%;display:block}
.maplegend span{display:flex;align-items:center;gap:5px}

.logwrap{position:fixed;inset-block-end:0;inset-inline-end:0;width:min(430px,100%);z-index:30}
.logbar{display:flex;align-items:center;gap:9px;width:100%;background:var(--raised);border:1px solid var(--line2);border-block-end:none;border-start-start-radius:var(--r);padding:8px 14px;font-size:12.5px;text-align:start}
.logbar b{color:var(--ink);font-weight:500}
.logbar .sp{margin-inline-start:auto}
.logbody{background:var(--surface);border:1px solid var(--line2);border-block-end:none;max-height:260px;overflow-y:auto}
.logrow{display:grid;grid-template-columns:58px 1fr;gap:9px;padding:6px 14px;font-size:12.5px;border-block-start:1px solid var(--line3)}
.logrow:first-child{border-block-start:none}
.logrow .t{color:var(--ink3);font-family:var(--fm);font-size:11px}
.logrow .w{color:var(--ink2)}
.logrow .w b{color:var(--ink);font-weight:500}

@media(max-width:900px){.split{grid-template-columns:1fr}.app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-inline-end:none;border-block-end:1px solid var(--line3)}
  .brandmark{width:100%;padding-block-end:8px}.navgrp{display:none}.logwrap{position:static;width:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brandmark"><span class="dot">M</span><b>MIM Inspection</b></div>
    <div id="railNav"></div>
  </nav>
  <div class="main">
    <div class="top">
      <div class="who"><h1 id="routeTitle">Dashboard</h1><span class="eyebrow" id="routePath">/dashboard</span></div>
      <div class="ctl"><label for="roleSel">Signed in as</label><select id="roleSel"></select></div>
      <button class="act" id="demoBtn" hidden>Run one visit end to end</button>
      <button class="load" id="loadBtn">Load UAT data</button>
      <span class="statechip" id="stateChip"></span>
    </div>
    <div class="body">
      <div class="steps" id="steps"></div>
      <div id="screen"></div>
    </div>
  </div>
</div>

<div class="logwrap" id="logwrap" hidden>
  <button class="logbar" id="logbar"><span id="logCaret">▲</span><b>Activity</b><span class="sp eyebrow" id="logCount"></span></button>
  <div class="logbody" id="logbody" hidden></div>
</div>

<script>
const D = JSON.parse(document.getElementById("simdata").textContent);

/* ---------------------------------------------------------------------------
   The ladder. A visit sits on exactly one rung and the only way it moves is
   somebody with the right role acting on it. Every count, queue and dashboard
   figure is derived from where the 300 visits currently stand — nothing is
   precomputed. That is the difference between a simulation and a slideshow.
--------------------------------------------------------------------------- */
const DRAFT=0, PENDING=1, PUBLISHED=2, ASSIGNED=3, TRAVELLING=4, ARRIVED=5,
      EXECUTING=6, SUBMITTED=7, APPROVED=8, RETURNED=9, CANCELLED=10,
      EXPIRED=11, REJECTED=12;

const RUNG = {
  [DRAFT]:["Draft","mute"], [PENDING]:["Pending supervision","warn"],
  [PUBLISHED]:["Published","ok"], [ASSIGNED]:["Assigned","info"],
  [TRAVELLING]:["On the way","info"], [ARRIVED]:["Arrived","info"],
  [EXECUTING]:["Executing","brand"], [SUBMITTED]:["Pending review","warn"],
  [APPROVED]:["Approved","ok"], [RETURNED]:["Returned","warn"],
  [CANCELLED]:["Cancelled","mute"], [EXPIRED]:["Expired","err"],
  [REJECTED]:["Rejected","err"],
};

// Who may move a visit off a rung, and where to. A role sees buttons only for
// the rungs it owns — that is the whole authorisation model, made visible.
const MOVES = {
  planner: {
    [DRAFT]:     [[PENDING,   "Send for supervision","go"]],
    [PUBLISHED]: [[ASSIGNED,  "Assign to me","go"]],
    [RETURNED]:  [[DRAFT,     "Reopen as draft",""]],
  },
  supervisor: {
    [PENDING]:   [[PUBLISHED, "Publish","go"], [RETURNED, "Return","no"]],
    [SUBMITTED]: [[APPROVED,  "Approve","go"], [RETURNED, "Return",""], [REJECTED,"Reject","no"]],
  },
  inspector: {
    [ASSIGNED]:  [[TRAVELLING,"Start travel","go"]],
    [TRAVELLING]:[[ARRIVED,   "Arrive on site","go"]],
    [ARRIVED]:   [[EXECUTING, "Begin inspection","go"]],
    [EXECUTING]: [[SUBMITTED, "Submit report","go"]],
  },
  admin: {},
};

const W = { loaded:false, visits:[], log:[], me:null, flash:new Set() };
const S = { role:"planner", nav:"dashboard", logOpen:true, busy:false };

const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n = v => (v??0).toLocaleString("en");
const cap = s => String(s||"").replace(/_/g," ").replace(/^./,c=>c.toUpperCase());
const fac = i => D.factories[i];
const per = i => (i==null || i<0) ? null : D.people[i];
const perName = i => { const p = per(i); return p ? p[0] : "—"; };
const on = () => W.loaded;

function hydrate(){
  const C = D.visitCols;
  W.visits = D.visits.map(row => { const v={}; C.forEach((k,i)=>v[k]=row[i]); return v; });
  W.log = [];
  // You sign in as whoever carries the most live work, so no queue is empty on
  // arrival and the inspector view has something to act on immediately.
  const load = {};
  W.visits.forEach(v=>{ if(v.stop>=ASSIGNED && v.stop<=EXECUTING && v.insp>=0) load[v.insp]=(load[v.insp]||0)+1; });
  const busiest = Object.entries(load).sort((a,b)=>b[1]-a[1])[0];
  W.me = {
    inspector: busiest ? +busiest[0] : D.people.findIndex(p=>p[1]==="inspector"),
    planner:   D.people.findIndex(p=>p[1]==="planner"),
    supervisor:D.people.findIndex(p=>p[1]==="supervisor"),
    admin:     D.people.findIndex(p=>p[1]==="admin"),
  };
}

/* ---- everything below is derived, recomputed on every render ---- */
const at = r => W.visits.filter(v=>v.stop===r);
const countAt = r => at(r).length;
const approved = () => at(APPROVED);
const decided = () => W.visits.filter(v=>[APPROVED,RETURNED,REJECTED].includes(v.stop) && v.ans>0);
const inMotion = () => countAt(TRAVELLING)+countAt(ARRIVED)+countAt(EXECUTING);
const mine = () => W.me ? W.visits.filter(v=>v.insp===W.me.inspector) : [];
const myQueue = () => mine().filter(v=>v.stop>=ASSIGNED && v.stop<=EXECUTING);

function compliance(){
  const a = approved();
  const ok = a.reduce((s,v)=>s+v.ok,0), nc = a.reduce((s,v)=>s+v.nc,0);
  return ok+nc ? {rate:(ok/(ok+nc)*100).toFixed(1), ok, total:ok+nc} : null;
}
function approvalRate(){
  const d = decided(); if(!d.length) return null;
  const a = d.filter(v=>v.stop===APPROVED).length;
  return {rate:(a/d.length*100).toFixed(1), a, d:d.length};
}
function coverage(){
  const seen = new Set(approved().map(v=>v.f));
  return {n:seen.size, pct:(seen.size/D.factories.length*100).toFixed(1)};
}

/* ---- acting: the part that makes it a simulation ---- */
function move(v, to, label){
  const from = v.stop;
  v.stop = to;
  if(to===ASSIGNED && v.insp<0) v.insp = W.me.inspector;
  // Submitting is when answers come into being. The package answered is the one
  // for this visit type, and the compliance split follows the site's risk band.
  if(to===SUBMITTED && !v.ans){
    const size = D.pkg[v.type] || 20;
    const na = Math.floor(size/10), eligible = size - na;
    v.ans = size;
    v.nc = Math.round(eligible * (fac(v.f)[15]==="high" ? 0.30 : 0.16));
    v.ok = eligible - v.nc;
    v.ev = Math.max(1, Math.round(v.nc * 1.4));
    v.viol = v.nc >= Math.max(2, Math.round(size*0.15)) ? 1 : 0;
  }
  W.flash.add(v.ref);
  log(`${esc(label)} — <b>${esc(fac(v.f)[1])}</b> ${RUNG[from][0].toLowerCase()} → ${RUNG[to][0].toLowerCase()}`);
  render();
  setTimeout(()=>{ W.flash.delete(v.ref); }, 1400);
}
function log(html){
  const d = new Date(), p = x => String(x).padStart(2,"0");
  W.log.unshift({t:`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`, w:html});
}
const movesFor = v => (MOVES[S.role]||{})[v.stop] || [];

/* ---- one visit through all four people, for a trainer to show the chain ---- */
async function runDemo(){
  if(S.busy) return;
  const v = at(DRAFT)[0] || at(PENDING)[0];
  if(!v){ log("No draft left to walk through."); render(); return; }
  S.busy = true;
  const chain = [
    ["planner",   "planning",              PENDING,    "Planner sent for supervision"],
    ["supervisor","inspection-review",     PUBLISHED,  "Supervisor published the plan"],
    ["planner",   "planning",              ASSIGNED,   "Planner assigned an inspector"],
    ["inspector", "inspection-execution",  TRAVELLING, "Inspector started travel"],
    ["inspector", "inspection-execution",  ARRIVED,    "Inspector arrived on site"],
    ["inspector", "inspection-execution",  EXECUTING,  "Inspector began the inspection"],
    ["inspector", "inspection-execution",  SUBMITTED,  "Inspector submitted the report"],
    ["supervisor","inspection-review",     APPROVED,   "Supervisor approved"],
  ];
  if(v.insp < 0) v.insp = W.me.inspector;
  for(const [role, route, to, label] of chain){
    S.role = role; S.nav = route;
    move(v, to, label);
    await new Promise(r=>setTimeout(r, 950));
  }
  S.nav = "dashboard";
  log(`<b>Chain complete.</b> One visit crossed four people, and the dashboard moved.`);
  S.busy = false;
  render();
}

/* ---------------------------------- render helpers ---------------------------------- */
const pill = r => `<span class="pill ${RUNG[r][1]}">${esc(RUNG[r][0])}</span>`;
const metric = (value, kind) => {
  if(on()) return `<div class="v">${value}</div>`;
  return kind === "rate" ? `<div class="v na">N/A</div>` : `<div class="v">0</div>`;
};
const kpi = (title,value,kind) =>
  `<div class="kpi"><h3>${esc(title)}</h3>${metric(value,kind)}</div>`;
const empty = t => `<div class="empty"><b>${esc(t)}</b></div>`;
const barlist = (pairs,max) => `<div class="bar">${pairs.map(([k,v])=>
  `<div class="barrow"><div class="track">${v?`<i style="width:${Math.max(2,v/max*100)}%"></i>`:""}<span class="lbl"${v?"":' style="color:var(--ink3)"'}>${esc(cap(k))}</span></div><div class="num"${v?"":' style="color:var(--ink3)"'}>${n(v)}</div></div>`
).join("")}</div>`;

function actionCell(v){
  // A role that cannot move this visit gets no control, exactly as it would in
  // the application. Nothing explains the absence; the absence is the rule.
  if(S.role==="inspector" && v.insp!==W.me.inspector) return "";
  const m = movesFor(v);
  if(!m.length) return "";
  return `<div class="acts">${m.map(([to,label,cls])=>
    `<button class="act ${cls}" data-go="${esc(v.ref)}" data-to="${to}" data-label="${esc(label)}">${esc(label)}</button>`
  ).join("")}</div>`;
}
function queue(rows, cols, cells, emptyTitle){
  if(!on()) return empty(emptyTitle);
  if(!rows.length) return `<div class="empty"><b>${esc(emptyTitle)}</b></div>`;
  return `<div class="scroll"><table><thead><tr>${
    cols.map(c=>`<th${c.num?' class="num"':(c.end?' class="end"':"")}>${esc(c.h)}</th>`).join("")
  }</tr></thead><tbody>${rows.map(v=>`<tr${W.flash.has(v.ref)?' class="flash"':""}>${
    cells(v).map((c,i)=>`<td class="${cols[i].num?"num ":""}${cols[i].wrap?"wrap ":""}${cols[i].end?"end":""}">${c}</td>`).join("")
  }</tr>`).join("")}</tbody></table></div>`;
}

function drawMap(){
  const cv = document.getElementById("mapc"); if(!cv) return;
  const r = cv.getBoundingClientRect(); if(!r.width) return;
  const dpr = window.devicePixelRatio||1;
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  const lat0=16.0, lat1=32.4, lng0=34.4, lng1=51.6;
  const midLat=(lat0+lat1)/2*Math.PI/180, pad=22, Wd=r.width-pad*2, H=r.height-pad*2;
  const dx=(lng1-lng0)*Math.cos(midLat), dy=(lat1-lat0);
  const k=Math.min(Wd/dx,H/dy), ox=pad+(Wd-dx*k)/2, oy=pad+(H-dy*k)/2;
  const px=v=>ox+(v-lng0)*Math.cos(midLat)*k, py=v=>oy+(lat1-v)*k;
  g.fillStyle="#0E131A"; g.fillRect(0,0,r.width,r.height);
  g.strokeStyle="rgba(255,255,255,.045)"; g.lineWidth=1;
  for(let l=36;l<=50;l+=2){g.beginPath();g.moveTo(px(l),py(lat1));g.lineTo(px(l),py(lat0));g.stroke();}
  for(let l=18;l<=30;l+=2){g.beginPath();g.moveTo(px(lng0),py(l));g.lineTo(px(lng1),py(l));g.stroke();}
  const BAND={high:"#FFAC82",medium:"#FFD666",low:"#77ED8B"};
  const live = new Set(W.visits.filter(v=>v.stop>=TRAVELLING&&v.stop<=EXECUTING).map(v=>v.f));
  D.factories.forEach((f,i)=>{
    const X=px(f[13]), Y=py(f[12]);
    g.beginPath(); g.arc(X,Y,8,0,7); g.fillStyle="rgba(126,97,172,.13)"; g.fill();
    g.beginPath(); g.arc(X,Y,3,0,7); g.fillStyle=BAND[f[15]]||"#CDBAEA"; g.fill();
    if(live.has(i)){ g.beginPath(); g.arc(X,Y,9.5,0,7); g.strokeStyle="#CDBAEA"; g.lineWidth=1.6; g.stroke(); }
  });
  g.fillStyle="rgba(255,255,255,.34)"; g.font='500 10px "Inter",sans-serif';
  g.fillText(`${D.factories.length} sites · ${live.size} with an inspector in motion`, pad+2, r.height-pad+2);
}

      ${it.tag?`<span class="tag">${esc(it.tag)}</span>`:(c?`<span class="n">${n(c)}</span>`:"")}</button>`;
  };
  document.getElementById("railNav").innerHTML = NAV.filter(g=>!g.adminOnly || S.role==="admin").map(g=>
    `<div class="navgrp eyebrow">${esc(g.en)}</div>` + g.items.map(it => it.sub
      ? `<div class="subgroup"><p class="subhead"><span class="ic" aria-hidden="true">${it.ic}</span><span>${esc(it.en)}</span></p>${
          it.sub.map(x=>row(x,true)).join("")}</div>`
      : row(it,false)).join("")
  ).join("");
}
function renderSteps(){
  document.getElementById("steps").innerHTML = STEPS.map(s=>
    `<button class="step" data-step="${s.id}" ${S.nav===s.nav?'aria-current="step"':""}>
      <div class="n">${esc(s.n)}</div><div class="t">${esc(s.t)}</div>
      ${on()?`<div class="c">${esc(s.c())}</div>`:""}</button>`).join("");
}
function renderRoles(){
  const TITLE = {admin:"Admin",planner:"Planner",inspector:"Inspector",supervisor:"Supervisor"};
  document.getElementById("roleSel").innerHTML = Object.keys(TITLE).map(r=>{
    const p = on() ? per(W.me[r]) : null;
    return `<option value="${r}"${S.role===r?" selected":""}>${esc(TITLE[r] + (p?` — ${p[3]}`:""))}</option>`;
  }).join("");
}
function renderChip(){
  document.getElementById("stateChip").innerHTML = on()
    ? `<span class="pill ok">UAT data</span><b>${n(W.visits.length)} visits</b>`
    : `<span class="pill mute">No UAT data</span><b>0 records</b>`;
  const b = document.getElementById("loadBtn");
  b.textContent = on() ? "Unload UAT data" : "Load UAT data";
  b.className = on() ? "load off" : "load";
  document.getElementById("demoBtn").hidden = !on();
  document.getElementById("logwrap").hidden = !on();
  document.getElementById("logCaret").textContent = S.logOpen ? "▼" : "▲";
  document.getElementById("logCount").textContent = W.log.length ? `${W.log.length} events` : "nothing yet";
  const lb = document.getElementById("logbody");
  lb.hidden = !S.logOpen;
  lb.innerHTML = W.log.slice(0,40).map(e=>
    `<div class="logrow"><span class="t">${esc(e.t)}</span><span class="w">${e.w}</span></div>`).join("")
    || `<div class="logrow"><span class="t">—</span><span class="w">Act on a visit and it shows up here.</span></div>`;
}
function render(){
  const it = navItem(S.nav) || navItem("dashboard");
  document.getElementById("routeTitle").textContent = it.en;
  document.getElementById("routePath").textContent  = it.href;
  const view = SCREEN[it.screen] || (() => SCREEN.section(it));
  document.getElementById("screen").innerHTML = `<div class="grid" style="gap:14px">${view()}</div>`;
  renderNav(); renderSteps(); renderRoles(); renderChip();
  requestAnimationFrame(drawMap);
}

document.addEventListener("click", e=>{
  const go = e.target.closest("[data-go]");
  if(go){ const v = W.visits.find(x=>x.ref===go.dataset.go);
          if(v) move(v, +go.dataset.to, go.dataset.label); return; }
  const nav = e.target.closest("[data-nav]");
  if(nav && !nav.disabled){ S.nav = nav.dataset.nav; render(); return; }
  const st = e.target.closest("[data-step]");
  if(st){ const x = STEPS.find(y=>y.id===st.dataset.step); S.nav=x.nav; S.role=x.role; render(); return; }
  if(e.target.closest("#logbar")){ S.logOpen = !S.logOpen; renderChip(); return; }
  if(e.target.id==="demoBtn"){ runDemo(); return; }
  if(e.target.id==="loadBtn"){
    if(on()){ W.loaded=false; W.visits=[]; W.log=[]; W.me=null; }
    else { W.loaded=true; hydrate(); log("<b>UAT data loaded.</b> 300 visits across 73 establishments."); }
    render();
  }
});
document.getElementById("roleSel").addEventListener("change", e=>{ S.role=e.target.value; render(); });
window.addEventListener("resize", drawMap);
render();
</script>
