<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:14px;display:flex;flex-direction:column;gap:12px}</style></head><body>
<div class="row" style="flex-wrap:wrap"><button class="btn btn-primary">Submit for review</button><button class="btn btn-secondary">Assign inspector</button><button class="btn btn-tertiary">Save draft</button><button class="btn btn-ghost">Cancel</button><button class="btn btn-danger">Reject</button></div>
<div class="row" style="flex-wrap:wrap"><button class="btn btn-primary btn-sm">Small</button><button class="btn btn-primary">Medium</button><button class="btn btn-primary btn-lg">Large</button>
<button class="btn btn-secondary btn-icon" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
<span class="btn-group"><button class="btn btn-secondary">Day</button><button class="btn btn-secondary">Week</button><button class="btn btn-secondary">Month</button></span>
<span class="btn-group"><button class="btn btn-primary">Approve</button><button class="btn btn-primary btn-icon" aria-label="More"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button></span></div>
<div class="row" style="flex-wrap:wrap"><button class="btn btn-primary is-loading">Loading</button><button class="btn btn-primary" disabled>Disabled</button><button class="btn btn-secondary" disabled>Disabled</button>
<button class="btn btn-secondary" style="outline:2px solid var(--focus-ring);outline-offset:2px">Focus-visible</button></div>
<div dir="rtl" class="row" style="flex-wrap:wrap"><button class="btn btn-primary">إرسال للمراجعة</button><button class="btn btn-secondary">إسناد مفتش</button><button class="btn btn-danger">رفض</button></div>
</body></html>
