delivery_strategy:
  name: "family-incremental implementation with controlled release"
  principle: >-
    Design, implement, and verify coherent screen families incrementally; never deploy
    isolated screens that create a mixed experience, and never defer all implementation
    until a single high-risk big-bang build.
  implementation_cadence:
    - id: F0
      scope: "foundation, shell, tokens, shared component grammar"
      design_inputs: "SAQEEL_FOUNDATION_LOCK"
    - id: F1
      scope: "access family"
      design_inputs: "CD-001..CD-003"
    - id: F2A
      scope: "admin governance"
      design_inputs: "CD-004..CD-007, CD-010, CD-011, CD-017..CD-019"
    - id: F2B
      scope: "admin studios"
      design_inputs: "CD-008, CD-009, CD-012..CD-016"
    - id: F3
      scope: "planning and visit management"
      design_inputs: "CD-020..CD-027"
    - id: F4
      scope: "review, Factory 360, and operations"
      design_inputs: "CD-028..CD-032"
    - id: F5
      scope: "iPad field journey"
      design_inputs: "CD-033..CD-040"
    - id: F6
      scope: "virtual inspection"
      design_inputs: "CD-041..CD-043"
    - id: F7
      scope: "cross-family Big Bang critique and release audit"
      design_inputs: "CD-001..CD-043 plus cumulative P2 register"
  family_implementation_entry_gate:
    - "family design is complete enough to prove its end-to-end storyline"
    - "all family P0/P1 findings are closed with evidence"
    - "family contact sheet, outliers, EN/AR, RTL, dark/light, and responsive states are accepted"
    - "exact before/after file manifest and protected behavior register are accepted"
    - "source commit and current regression baseline are recorded"
    - "product, UX, accessibility, architecture, and security approvals required for the family are recorded"
  allowed_parallel_work:
    - "controlled branch/worktree preparation"
    - "fresh production build and regression baseline"
    - "visual-diff and screenshot harness preparation"
    - "asset provenance, licensing, and verified public-location research"
    - "approved shared-component implementation needed by an accepted family"
    - "non-visual backend work already authorized by the product contract"
  prohibited_parallel_work:
    - "implementing a screen whose family P0/P1 gate is still open"
    - "writing unapproved design changes into the dirty main worktree"
    - "deploying isolated screens that mix old and new shells or component grammar"
    - "using unlicensed imagery or unverified geographic/industrial claims"
    - "changing product behavior under the label of visual refinement"
  environment_policy:
    design: "read-only against application source"
    implementation: "controlled branch/worktree per accepted family"
    integration: "continuous integration into a revamp staging environment"
    production: >-
      release only coherent persona journeys or the complete revamp; use feature flags
      where partial exposure is required; never expose a broken mixture of old and new UX.
  final_release_gate:
    - "F7 Big Bang critique is complete"
    - "cumulative P2 register is closed, accepted as residual risk, or explicitly deferred"
    - "all cross-family P0/P1 findings are closed"
    - "end-to-end role journeys pass on the actual platform"
    - "production build, Playwright, accessibility, RTL, theme, offline, and visual-diff evidence pass"
feedback_governance:
  orchestrator_duty: >-
    Critique sponsor feedback when it would weaken inspection truth, coherence,
    accessibility, security, cultural appropriateness, asset rights, implementation fit,
    or accepted product behavior; do not defer merely because the feedback is aesthetic.
  mandatory_challenge_conditions:
    - "feedback creates a tourism, consumer, gaming, or generic-SaaS pattern that weakens the inspection story"
    - "feedback implies live, real, verified, connected, or operational data that is only illustrative or pending"
    - "feedback introduces unlicensed assets, confidential factories, unsafe imagery, or culturally inappropriate treatment"
    - "feedback changes requirements, roles, workflow, policy, security, audit, offline, or immutable behavior"
    - "feedback breaks the approved family grammar or creates a one-off component system"
    - "feedback cannot map deterministically to the existing repository"
  review_moments:
    - "foundation lock"
    - "first signature screen of each family"
    - "family contact-sheet and cross-screen storyline review"
    - "penultimate P0/P1 gate before family implementation handoff"
    - "runtime review on the real staging platform"
    - "F7 consolidated Big Bang critique before production"
  non_blocking_policy: "record P2 findings in the cumulative Big Bang register and continue"
  blocking_policy: "stop or correct progressively only for genuine P0/P1 findings"
status: "ready_for_claude_design_execution"
