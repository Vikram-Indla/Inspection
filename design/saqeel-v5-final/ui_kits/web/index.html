<!-- @startingPoint section="Screens" subtitle="Authenticated web app (shell + 3 screens)" viewport="1440x860" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saqeel — Web app UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}a{color:var(--ax-color-primary-hover)}a:hover{color:var(--ax-color-primary)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="VisitsScreen.jsx"></script>
<script type="text/babel" src="ReviewScreen.jsx"></script>
<script type="text/babel">
const TITLES = { dashboard: "Dashboard", visits: "Visits", reviews: "Level-2 review" };
function App() {
  const [route, setRoute] = React.useState("dashboard");
  return <Shell current={route === "reviews" ? "reviews" : route} title={TITLES[route] || "Dashboard"} onNavigate={r => setRoute(TITLES[r] ? r : "dashboard")}>
    {route === "dashboard" ? <DashboardScreen onNavigate={setRoute} /> : null}
    {route === "visits" ? <VisitsScreen onOpenReview={() => setRoute("reviews")} /> : null}
    {route === "reviews" ? <ReviewScreen /> : null}
  </Shell>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
