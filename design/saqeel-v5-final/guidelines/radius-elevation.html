<!-- @dsCard group="Spacing & Shape" viewport="700x190" name="Radius & elevation" subtitle="Nearly flat: borders carry hierarchy; only overlays float" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font:var(--ax-text-body);color:var(--ax-color-text);background:var(--ax-color-canvas);padding:16px}.sw{display:flex;gap:10px}.sw div{flex:1;border-radius:var(--ax-radius-standard);padding:10px;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--ax-color-border)}.sw b{font:var(--ax-text-caption);font-weight:600}.sw small{font:var(--ax-text-micro);font-family:var(--ax-font-mono);opacity:.75}</style></head><body><div class="sw" style="align-items:stretch">
<div style="border-radius:var(--ax-radius-small);background:var(--ax-color-surface)"><b>small 4</b><small>lozenge, chips</small></div>
<div style="border-radius:var(--ax-radius-standard);background:var(--ax-color-surface)"><b>standard 6</b><small>cards, buttons</small></div>
<div style="border-radius:var(--ax-radius-large);background:var(--ax-color-surface)"><b>large 8</b><small>panels, modals</small></div>
<div style="border-radius:var(--ax-radius-input);background:var(--ax-color-surface)"><b>input 6</b><small>standard field geometry</small></div>
<div style="border-radius:var(--ax-radius-standard);background:var(--ax-color-surface);border:0;box-shadow:var(--ax-shadow-overlay)"><b>overlay shadow</b><small>0 12px 28px</small></div>
</div></body></html>
