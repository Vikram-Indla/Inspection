<!-- @dsCard group="Colors" viewport="700x180" name="Semantic" subtitle="Success, warning, critical, info — base + tint pairs" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font:var(--ax-text-body);color:var(--ax-color-text);background:var(--ax-color-canvas);padding:16px}.sw{display:flex;gap:10px}.sw div{flex:1;border-radius:var(--ax-radius-standard);padding:10px;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--ax-color-border)}.sw b{font:var(--ax-text-caption);font-weight:600}.sw small{font:var(--ax-text-micro);font-family:var(--ax-font-mono);opacity:.75}</style></head><body><div class="sw">
<div style="background:var(--ax-color-success);color:#fff"><b>Success</b><small>#18794E</small></div>
<div style="background:var(--ax-color-warning);color:#fff"><b>Warning</b><small>#8A5A00</small></div>
<div style="background:var(--ax-color-critical);color:#fff"><b>Critical</b><small>#B42318</small></div>
<div style="background:var(--ax-color-info);color:#fff"><b>Info</b><small>#175CD3</small></div></div>
<div class="sw" style="margin-top:10px">
<div style="background:var(--ax-color-success-tint);min-height:40px"><small>success-tint</small></div>
<div style="background:var(--ax-color-warning-tint);min-height:40px"><small>warning-tint</small></div>
<div style="background:var(--ax-color-critical-tint);min-height:40px"><small>critical-tint</small></div>
<div style="background:var(--ax-color-info-tint);min-height:40px"><small>info-tint</small></div>
</div></body></html>
