<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font:var(--ax-text-body);color:var(--ax-color-text);background:var(--ax-color-canvas);padding:16px}.sw{display:flex;gap:10px}.sw div{flex:1;border-radius:var(--ax-radius-standard);padding:10px;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--ax-color-border)}.sw b{font:var(--ax-text-caption);font-weight:600}.sw small{font:var(--ax-text-micro);font-family:var(--ax-font-mono);opacity:.75}</style></head><body><div class="sw">
<div style="background:var(--ax-color-primary)"><b style="color:#101317">Primary</b><small style="color:#101317">#64C2A1</small></div>
<div style="background:var(--ax-color-canvas);color:var(--ax-color-text)"><b>Canvas</b><small>#101317</small></div>
<div style="background:var(--ax-color-surface);color:var(--ax-color-text)"><b>Surface</b><small>#191D22</small></div>
<div style="background:var(--ax-color-critical)"><b style="color:#101317">Critical</b><small style="color:#101317">#E17770</small></div>
<div style="background:var(--ax-color-success)"><b style="color:#101317">Success</b><small style="color:#101317">#55B885</small></div>
</div></body></html>
